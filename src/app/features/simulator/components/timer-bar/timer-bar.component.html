<header class="timer-bar" role="banner" aria-label="Barra de estado del simulador">
  <div class="timer-container">
    <!-- Indicador de pregunta actual -->
    <div class="question-progress">
      <span class="exam-badge">LPIC-1</span>
      <span class="progress-text">
        Pregunta <strong>{{ currentIndex() + 1 }}</strong> de <strong>{{ totalQuestions() }}</strong>
      </span>
    </div>

    <!-- Temporizador o indicador de modo -->
    <div class="timer-display-wrapper">
      @if (!isPractice()) {
        <div
          class="timer-badge"
          [class.warning]="urgencyLevel() === 'warning'"
          [class.critical]="urgencyLevel() === 'critical'"
          aria-label="Tiempo restante"
        >
          <svg
            class="timer-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="timer-digits" font-mono>{{ formattedTime() }}</span>
        </div>
      } @else {
        <div class="practice-badge">
          <span class="practice-dot"></span>
          <span>Modo práctica</span>
        </div>
      }

      <!-- Anuncio accesible discreto -->
      <div class="sr-only" aria-live="polite" aria-atomic="true">
        {{ screenReaderAnnouncement() }}
      </div>
    </div>

    <!-- Botón de finalizar examen -->
    <div class="timer-actions">
      <app-button
        variant="warning"
        size="sm"
        (btnClick)="onFinishClick()"
        aria-label="Finalizar y entregar examen"
      >
        Finalizar examen
      </app-button>
    </div>
  </div>
</header>
