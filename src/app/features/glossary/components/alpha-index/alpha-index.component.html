<nav class="alpha-index-nav" aria-label="Índice alfabético A a Z">
  <ul class="alpha-list">
    @for (item of items(); track item.letter) {
      <li class="alpha-list-item">
        <button
          type="button"
          class="alpha-letter-btn font-mono"
          [class.has-terms]="item.hasTerms"
          [class.is-empty]="!item.hasTerms"
          [class.active]="activeLetter() === item.letter"
          [disabled]="!item.hasTerms"
          [attr.aria-disabled]="!item.hasTerms ? 'true' : null"
          [attr.title]="item.hasTerms ? item.count + ' términos con la letra ' + item.letter : 'Sin términos con la letra ' + item.letter"
          (click)="onSelect(item.letter, item.hasTerms)"
        >
          {{ item.letter }}
        </button>
      </li>
    }
  </ul>
</nav>
