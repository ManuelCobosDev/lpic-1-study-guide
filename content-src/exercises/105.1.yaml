- id: "105.1-eg-01"
  kind: guiado
  title: "Clasificación de shells e inicio de sesión"
  statement: "Estudie cómo se inician los shells (por consola virtual Ctrl+Alt+F2, gnome-terminal o script test.sh) e indique si cada uno es interactivo, de inicio de sesión (login) y qué devuelve 'echo $0'."
  answer: "• Ctrl+Alt+F2: Interactivo: Sí, Login: Sí, echo $0: -bash\n• gnome-terminal: Interactivo: Sí, Login: No, echo $0: bash\n• Script test.sh: Interactivo: No, Login: No, echo $0: ./test.sh"
  source: ["105.1#u288", "105.1#u389"]

- id: "105.1-eg-02"
  kind: guiado
  title: "Lanzar shells con su y sudo"
  statement: "¿Cuáles son los comandos con 'su' y 'sudo' para iniciar una shell de login interactiva como root y como otro usuario?"
  answer: "• Shell de login como root: 'su -' o 'sudo -i' (o 'sudo su -')\n• Shell interactiva sin login como root: 'su' o 'sudo -s'\n• Shell de login como otro usuario: 'su - usuario' o 'sudo -i -u usuario'"
  source: ["105.1#u296", "105.1#u400"]

- id: "105.1-eg-03"
  kind: guiado
  title: "Archivos de inicio leídos por tipo de shell"
  statement: "¿Qué archivo de inicio lee un shell interactivo de inicio de sesión (/etc/profile, ~/.bash_profile) vs un shell interactivo sin login (/etc/bash.bashrc, ~/.bashrc)?"
  answer: "• Shell de login interactivo: primero /etc/profile y luego el primer fichero encontrado entre ~/.bash_profile, ~/.bash_login o ~/.profile.\n• Shell interactivo sin login: /etc/bash.bashrc y luego ~/.bashrc.\n• Al cerrar la sesión de login: ~/.bash_logout."
  source: ["105.1#u309", "105.1#u415"]

- id: "105.1-ee-01"
  kind: exploratorio
  title: "Recargar variables de configuración con source"
  statement: "Si cambias los valores de algunas variables o alias en ~/.bashrc, ¿cómo haces para que surtan efecto inmediatamente en la sesión actual sin cerrar sesión ni reiniciar la terminal?"
  answer: "Ejecutando 'source ~/.bashrc' o la forma abreviada '. ~/.bashrc' para que la shell actual interprete el archivo en el mismo proceso."
  source: ["105.1#u331", "105.1#u435"]

- id: "105.1-ee-02"
  kind: exploratorio
  title: "Plantilla de usuario con /etc/skel"
  statement: "¿Cómo utiliza el sistema el directorio /etc/skel al crear un nuevo usuario con useradd -m y qué archivos contiene habitualmente?"
  answer: "El directorio /etc/skel sirve de plantilla. Cuando se crea un nuevo usuario con 'useradd -m', los archivos de /etc/skel (por ejemplo .bashrc, .profile, .bash_logout) se copian automáticamente al nuevo directorio personal (home) del usuario con los permisos adecuados."
  source: ["105.1#u336", "105.1#u440"]

