- id: 105.1-ee-07
  kind: exploratorio
  title: Sustitución de comandos con backticks vs $(...)
  statement: |-
    En la función music_info:
    latest_music=`ls -l1t ~/Music | head -n 6`
    ¿Cuál es la sintaxis moderna recomendada y sinónimo exacto?
    A) latest_music=$(ls -l1t ~/Music | head -n 6)
    B) latest_music="(ls -l1t ~/Music | head -n 6)"
    C) latest_music=((ls -l1t ~/Music | head -n 6))
    Variable utilizada: $latest_music.
  answer: |-
    La opción A: latest_music=$(ls -l1t ~/Music | head -n 6). La sintaxis $(comando) es más legible, estándar POSIX y permite anidamiento limpio frente a las comillas invertidas.
    Definición: latest_music=$(ls -l1t ~/Music | head -n 6). El valor se almacena en $latest_music.
  source:
    - 105.1#u892-u905
    - 105.1#u1031-u1040
- id: 105.1-eg-18
  kind: guiado
  title: 'Tabla comparativa de capacidades: Alias vs Funciones'
  statement: |-
    Complete con Sí o No considerando las capacidades de los alias y las funciones:
    • ¿Las variables locales pueden ser usadas?
    • ¿Las variables de entorno pueden ser utilizadas?
    • ¿Se puede escapar con \?
    • ¿Puede ser recursivo?
    • ¿Muy productivo cuando se usa con parámetros posicionales ($1, $2)?
  answer: |-
    • Variables locales: Alias: Sí | Funciones: Sí
    • Variables de entorno: Alias: Sí | Funciones: Sí
    • Escapar con \ para ignorar definición: Alias: Sí (\comando) | Funciones: No
    • Recursivo: Alias: Sí | Funciones: Sí
    • Parámetros posicionales: Alias: No (los argumentos se concatenan al final) | Funciones: Sí (maneja $1, $2, etc.)
  source:
