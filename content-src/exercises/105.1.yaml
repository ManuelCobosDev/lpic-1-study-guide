- id: 105.1-eg-01
  kind: guiado
  title: Clasificación de shells e inicio de sesión
  statement: |-
    Estudie cómo se han iniciado los shells en la columna 'Iniciado con…' y complete la información requerida (¿Interactivo?, ¿Inicio de sesión?, Resultado de echo $0):
    • sudo ssh user2@machine2
    • Ctrl + Alt + F2
    • su - user2
    • gnome-terminal
    • Un usuario regular usa konsole para iniciar una instancia de sakura
    • Un script llamado test.sh que contiene el comando echo $0
  answer: |-
    • sudo ssh user2@machine2 → Interactivo: Sí | Login: Sí | echo $0: -bash
    • Ctrl + Alt + F2 (TTY virtual) → Interactivo: Sí | Login: Sí | echo $0: -bash
    • su - user2 → Interactivo: Sí | Login: Sí | echo $0: -bash
    • gnome-terminal → Interactivo: Sí | Login: No | echo $0: bash
    • konsole / sakura → Interactivo: Sí | Login: No | echo $0: /bin/bash (o bash)
    • Script test.sh → Interactivo: No | Login: No | echo $0: ./test.sh
  source:
    - 105.1#u288-u295
    - 105.1#u389-u399
- id: 105.1-eg-02
  kind: guiado
  title: Comandos su y sudo para lanzar shells específicos
  statement: |-
    Escriba los comandos su y sudo para lanzar cada uno de los shells especificados:
    1. Shell de inicio de sesión interactivo como user2
    2. Shell de inicio de sesión interactivo como root
    3. Shell interactivo sin inicio de sesión como root
    4. Shell interactivo sin inicio de sesión como user2
    • Shell interactivo de no inicio de sesion como root
    • Shell interactivo de no inicio de sesion como user2
  answer: |-
    1. Login interactivo como user2:
       • su: su - user2 (o su -l user2, su --login user2)
       • sudo: sudo su - user2 (o sudo -i -u user2)
    2. Login interactivo como root:
       • su: su - root o su -
       • sudo: sudo su -, sudo -i o sudo su - root
    3. Shell interactivo sin login como root:
       • su: su root o su
       • sudo: sudo su, sudo -s o sudo -u root -s
    4. Shell interactivo sin login como user2:
       • su: su user2
       • sudo: sudo su user2 o sudo -u user2 -s
    • Shell interactivo de no inicio de sesion como root: su root
    • Shell interactivo de no inicio de sesion como user2: su user2
  source:
    - 105.1#u296-u308
    - 105.1#u400-u420
- id: 105.1-eg-03
  kind: guiado
  title: Archivos de inicio leídos según el tipo de shell
  statement: |-
    ¿Qué archivo de inicio se lee cuando se inicia el shell bajo 'Tipo de shell' (/etc/profile, /etc/bash.bashrc, ~/.profile, ~/.bashrc)?
    1. Shell de inicio de sesión interactivo como user2
    2. Shell de inicio de sesión interactivo como root
    3. Shell interactivo sin inicio de sesión como root
    4. Shell interactivo sin inicio de sesión como user2
  answer: |-
    1. Login interactivo como user2: Sí lee /etc/profile, /etc/bash.bashrc (referenciado), ~/.profile y ~/.bashrc (referenciado).
    2. Login interactivo como root: Sí lee /etc/profile, /etc/bash.bashrc, ~/.profile / ~/.bash_profile y ~/.bashrc.
    3. Shell interactivo sin login como root: No lee /etc/profile ni ~/.profile; Sí lee /etc/bash.bashrc y ~/.bashrc.
    4. Shell interactivo sin login como user2: No lee /etc/profile ni ~/.profile; Sí lee /etc/bash.bashrc y ~/.bashrc.
  source:
    - 105.1#u309-u315
    - 105.1#u421-u431
- id: 105.1-ee-01
  kind: exploratorio
  title: Función simple en archivo e invocación en Bash
  statement: |-
    En Bash podemos escribir una simple función '¡Hola mundo!' incluyendo el código:
    function hello() {
      echo "Hello world!"
    }
    1. ¿Qué deberíamos hacer para que la función esté disponible en el shell actual?
    2. ¿Cómo la invocarías?
    3. ¿En qué archivo la agregarías para que esté disponible en cada terminal de user2?
    4. ¿En qué archivo la pondrías para que se ejecute cuando root lance un nuevo shell?
  answer: |-
    1. Ejecutar 'source nombre_archivo' o '. nombre_archivo' para cargar la función en el proceso del shell actual.
    2. Tecleando directamente su nombre: hello
    3. En /home/user2/.bashrc para shells interactivos sin login.
    4. En /etc/bash.bashrc para que se aplique a todos los shells interactivos del sistema.
  source:
    - 105.1#u317-u324
    - 105.1#u433-u444
- id: 105.1-ee-02
  kind: exploratorio
  title: Interactividad en scripts de Bash
  statement: |-
    Observe el script hello_world:
    #!/bin/bash
    echo "Hello world!"
    ¿Sería un script interactivo si se le otorgan permisos de ejecución y se invoca? ¿Qué hace que un script sea interactivo?
  answer: No es interactivo, ya que se ejecuta de forma autónoma sin esperar intervención humana ni tecleo de comandos por parte del usuario. Lo que hace interactivo a un shell o script es requerir entrada directa (stdin/teclado) del usuario.
  source:
    - 105.1#u325-u330
    - 105.1#u445-u453
- id: 105.1-ee-03
