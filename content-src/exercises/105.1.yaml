- id: 105.1-eg-32
  kind: guiado
  title: Variables especiales en funciones de Bash
  statement: |-
    Dada la función:
    special_vars2() {
      echo $#; echo $_; echo $1; echo $4; echo $6; echo $7; echo $_; echo $@; echo $?
    }
    Invocada con: special_vars2 crying cockles and mussels alive alive oh
    Adivine cada una de las salidas.
  answer: |-
    • echo $# → 7 (número total de argumentos pasados)
    • echo $_ → 7 (último argumento del comando anterior o expansión previa)
    • echo $1 → crying
    • echo $4 → mussels
    • echo $6 → alive
    • echo $7 → oh
    • echo $_ → oh (último argumento evaluado)
    • echo $@ → crying cockles and mussels alive alive oh
    • echo $? → 0 (código de salida exitoso del comando previo)
  source:
    - 105.1#u1397-u1421
    - 105.1#u1540-u1564
- id: 105.1-eg-33
  kind: guiado
  title: Función parametrizada con control condicional
  statement: 'Escriba una función llamada check_music que acepte argumentos para: carpeta ($1), extensión ($2), límite máximo ($3) y tipo de archivo ($4), verificando con ''ls -1 ~/$1/*.$2'' e imprimiendo avisos con echo.'
  answer: |-
    check_music() {
      ls -1 ~/$1/*.$2 > ~/.mkv.log 2>&1
      if [ "$?" = "0" ]; then
        echo -e "Remember, you must not keep more than $3 $4 files in your $1 folder.\nThanks."
      else
        echo -e "You do not have any $4 files in the $1 folder. You can keep up to $3.\nThanks."
      fi
    }
    # Invocación: check_music Music ogg 7 music
  source:
    - 105.1#u1422-u1426
    - 105.1#u1565-u1580
- id: 105.1-ee-08
  kind: exploratorio
  title: Funciones de solo lectura con readonly -f
  statement: |-
    1. ¿Cómo se marca una función llamada my_fun para que sea de solo lectura y no pueda ser modificada ni eliminada?
    2. ¿Cómo se listan todas las funciones de solo lectura activas?
    Investigación sobre funciones de sólo lectura. Columnas: [Nombre de la función], [Haz que sea sólo de lectura], [Lista de todas las funciones].
  answer: |-
    1. readonly -f my_fun
    2. readonly -f
    Las funciones de sólo lectura se protegen con readonly -f. Haz que sea sólo de lectura: readonly -f my_fun. Lista de todas las funciones de sólo lectura: readonly -f.
  source:
    - 105.1#u1428-u1430
    - 105.1#u1582-u1584
- id: 105.1-ee-09
  kind: exploratorio
  title: Función fyi y personalización avanzada de PS1
  statement: 'Escriba una función fyi que muestre: usuario ($USER), home ($HOME), host ($HOSTNAME), SO ($OSTYPE), PATH ($PATH), directorio de correo ($MAIL), frecuencia ($MAILCHECK segundos), nivel de shell ($SHLVL) y modifique PS1 para que muestre ''<user>@<host-date>''.'
  answer: |-
    fyi() {
      echo -e "For your Information:\nUsername: $USER\nHome directory: $HOME\nHost: $HOSTNAME\nOperating System: $OSTYPE\nPath for executable files: $PATH\nYour mail directory is $MAIL and is searched every $MAILCHECK seconds.\nThe current level of your shell is: $SHLVL"
      PS1="\u@\h-\d "
    }
    fyi
  source:
    - 105.1#u1431-u1440
    - 105.1#u1585-u1606
