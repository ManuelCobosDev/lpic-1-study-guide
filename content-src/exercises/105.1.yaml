- id: 105.1-eg-05
  kind: guiado
  title: Variables canónicas de entorno y significado de sus valores
  statement: |-
    Estudie el comando y la salida y explique su significado:
    • echo $HISTCONTROL → ignoreboth
    • echo ~ → /home/carol
    • echo $DISPLAY → reptilium:0:2
    • echo $MAILCHECK → 60
    • echo $HISTFILE → /home/carol/.bash_history
  answer: |-
    • HISTCONTROL=ignoreboth: No se registran en el historial ni los comandos duplicados ni los que empiezan por espacio.
    • echo ~: El directorio HOME del usuario carol es /home/carol.
    • DISPLAY=reptilium:0:2: La máquina tiene servidor X activo en el display 0, pantalla virtual 2.
    • MAILCHECK=60: El buzón de correo se verifica cada 60 segundos.
    • HISTFILE=/home/carol/.bash_history: El historial de sesión se guardará en dicho archivo al salir.
  source:
    - 105.1#u850-u856
    - 105.1#u957-u964
- id: 105.1-eg-06
  kind: guiado
  title: Corrección sintáctica en asignación y referencia de variables
  statement: |-
    Corrija los comandos erróneos para que produzcan la salida esperada:
    1. 'lizard =chameleon' → salida chameleon
    2. 'cool' y 'lizard=chameleon' → salida chameleon
    3. 'lizard=cha|me|leon' → salida cha|me|leon
    4. 'lizard=/** chameleon **/' → salida /** chamelon **/
    5. 'win_path=C:\path\to\dir\' → salida C:\path\to\dir\
    Tabla con columnas: [Comando erróneo], [Comando correcto]. Casos evaluados: $cool_lizard, $win_path.
  answer: |-
    1. Sin espacios en la asignación: lizard=chameleon; echo $lizard
    2. Sin espacio previo: lizard=chameleon; echo $lizard
    3. Entrecomillando caracteres especiales de tubería: lizard='cha|me|leon' (o con comillas dobles)
    4. Entrecomillando asteriscos para evitar globbing: lizard='/** chameleon **/' (o "/** chameleon **/")
    5. Entrecomillando barras invertidas: win_path='C:\path\to\dir\' (las comillas simples protegen la barra invertida)
    Comando erróneo vs Comando correcto con variables $cool_lizard y $win_path.
  source:
    - 105.1#u857-u869
    - 105.1#u965-u979
- id: 105.1-eg-07
  kind: guiado
  title: Comandos para configurar el entorno y variables de sistema
  statement: |-
    Escriba el comando apropiado para cada propósito:
    1. Establecer el idioma del shell actual en español UTF-8 (es_ES.UTF-8)
    2. Imprimir el nombre del directorio actual usando variable de entorno
    3. Referenciar la variable que almacena información de conexiones SSH
    4. Establecer PATH para incluir /home/carol/scripts como último directorio
    5. Establecer el valor literal 'PATH' en la variable my_path
    6. Establecer el valor de la variable de entorno PATH en my_path
  answer: |-
    1. export LANG=es_ES.UTF-8 (o LC_ALL=es_ES.UTF-8)
    2. echo $PWD
    3. echo $SSH_CONNECTION (o $SSH_CLIENT)
    4. export PATH="$PATH:/home/carol/scripts"
    5. my_path=PATH
    6. my_path=$PATH
  source:
    - 105.1#u870-u877
    - 105.1#u980-u991
