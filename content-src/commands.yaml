- id: lspci
  name: lspci
  synopsis: lspci -nnk -s 00:02.0
  description: >-
    Inspeccionar tarjetas gráficas, controladoras de red, sonido y
    almacenamiento PCI
  category: Determinar y configurar los ajustes de hardware
  subtopicIds:
    - '101.1'
  example: lspci -nnk -s 00:02.0
  flags:
    - flag: '-k'
      description: >-
        🎯 Clave de Examen: Muestra el controlador activo del kernel (Kernel
        driver in use) y módulos disponibles.
    - flag: '-v / -vv / -vvv'
      description: >-
        Incrementa el nivel de detalle (interrupciones IRQ, rangos de memoria
        E/S y capacidades).
    - flag: '-'
      description: 'Filtra por dirección física del bus (ej: -s 00:02.0).'
    - flag: '-'
      description: >-
        Filtra por identificador numérico de fabricante y modelo en hexadecimal
        (ej: -d 8086:9bc5).
    - flag: '-nn'
      description: >-
        Muestra los nombres textuales junto a los códigos numéricos
        [vendor:device] entre corchetes.
    - flag: '-t'
      description: Muestra la topología de buses y puentes en formato de árbol jerárquico.
- id: lsusb
  name: lsusb
  synopsis: lsusb -t
  description: Identificar teclados, ratones, pendrives, cámaras y concentradores USB
  category: Determinar y configurar los ajustes de hardware
  subtopicIds:
    - '101.1'
  example: lsusb -t
  flags:
    - flag: '-t'
      description: >-
        🎯 Clave de Examen: Muestra la topología jerárquica en árbol, indicando
        clase de dispositivo, driver y velocidad (ej: 480M = USB 2.0).
    - flag: '-v'
      description: >-
        Detalle exhaustivo de descriptores de configuración USB (requiere sudo
        para ver números de serie completos).
    - flag: '-s [bus]:[devnum]'
      description: 'Filtra por número de bus y número de dispositivo (ej: -s 001:002).'
    - flag: '-d [vendor]:[product]'
      description: >-
        Filtra por ID de fabricante y producto en hexadecimal (ej: -d
        0781:5583).
- id: lsmod-modinfo
  name: lsmod | modinfo
  synopsis: lsmod | head -n 4; echo '---'; modinfo -d e1000e
  description: >-
    Un módulo es un controlador (driver) compilado (.ko) que añade funciones al
    kernel en caliente sin reiniciar. Con lsmod y modinfo los auditamos:
  category: Determinar y configurar los ajustes de hardware
  subtopicIds:
    - '101.1'
  example: lsmod | head -n 4; echo '---'; modinfo -d e1000e
  flags:
    - flag: lsmod
      description: >-
        Lee /proc/modules y formatea 3 columnas: Nombre del módulo, tamaño en
        bytes y módulos dependientes que lo usan.
    - flag: '-'
      description: >-
        Muestra autor, licencia, ruta del archivo .ko.xz, dependencias y
        parámetros configurables.
    - flag: '-'
      description: Muestra únicamente la descripción textual del módulo (description).
    - flag: '-'
      description: Lista todos los parámetros que acepta el módulo con sus tipos de datos.
    - flag: '-F field'
      description: >-
        Filtra un campo específico de la cabecera (ej: filename, license,
        depends).
- id: modprobe
  name: modprobe
  synopsis: sudo modprobe -v usb_storage
  description: >-
    modprobe resuelve dependencias leyendo modules.dep; insmod es de bajo nivel
    y no gestiona dependencias:
  category: Determinar y configurar los ajustes de hardware
  subtopicIds:
    - '101.1'
  example: sudo modprobe -v usb_storage
  flags:
    - flag: '-'
      description: Carga automática con dependencias de modules.dep.
    - flag: '-r / --remove'
      description: '🎯 Examen: Descarga el módulo y sus dependencias no usadas.'
    - flag: '-v / --verbose'
      description: Muestra los insmod ejecutados en orden de dependencia.
    - flag: '-c / --showconfig'
      description: Muestra la unión consolidada de /etc/ y /lib/.
- id: linux-boot-vmlinuz-root-uuid-opciones
  name: linux /boot/vmlinuz root=UUID=... [opciones]
  synopsis: cat /proc/cmdline
  description: >-
    Inspeccionar con /proc/cmdline los parámetros reales y saber cuándo añadir
    opciones de emergencia
  category: Arranque del sistema
  subtopicIds:
    - '101.2'
  example: cat /proc/cmdline
  flags:
    - flag: root=UUID=... (o /dev/sda1)
      description: >-
        🎯 Clave de Examen: Indica qué partición del disco contiene el sistema
        operativo real
    - flag: ro
      description: >-
        Monta inicialmente la raíz en Solo Lectura para que el sistema revise el
        disco de forma segura antes de escribir nada.
    - flag: quiet splash
      description: >-
        Silencia los mensajes técnicos del kernel y muestra la pantalla gráfica
        con el logotipo de carga de la distribución.
    - flag: nomodeset
      description: >-
        Ejemplo real: Desactiva los drivers gráficos avanzados si la pantalla se
        queda congelada en negro al arrancar.
    - flag: acpi=off
      description: >-
        Ejemplo real: Desactiva la gestión de energía de la placa base si el
        equipo se bloquea al suspender o encender.
    - flag: mem=2G
      description: >-
        Ejemplo real: Limita la RAM a 2 GB para simular servidores pequeños o
        esquivar un módulo de memoria roto.
- id: init-bin-bash
  name: init=/bin/bash
  synopsis: "# 1. En la consola de root que arranca, re-montar el disco con permisos de escritura:\r\nmount -o remount,rw /\r\n# 2. Ahora sí podemos cambiar la contraseña:\r\npasswd root\r\n# 3. Guardar cambios en disco y reiniciar:\r\nsync && reboot -f"
  description: >-
    Saltarse la pantalla de login para obtener una consola directa de root y
    cambiar la contraseña olvidada
  category: Arranque del sistema
  subtopicIds:
    - '101.2'
  example: "# 1. En la consola de root que arranca, re-montar el disco con permisos de escritura:\r\nmount -o remount,rw /\r\n# 2. Ahora sí podemos cambiar la contraseña:\r\npasswd root\r\n# 3. Guardar cambios en disco y reiniciar:\r\nsync && reboot -f"
  flags:
    - flag: ¿Por qué hacemos esto?
      description: >-
        Porque la pantalla de login normal te exige contraseña. Al decirle al
        kernel
    - flag: 'El tropiezo clásico: ''ro'''
      description: Al entrar con init=/bin/bash, el disco está en solo lectura. Si intentas
    - flag: mount -o remount,rw /
      description: >-
        🎯 Comando de Examen VITAL: Vuelve a montar la partición raíz en modo
        lectura y escritura para permitir guardar la nueva contraseña.
    - flag: systemd.unit=emergency.target
      description: >-
        Alternativa oficial en systemd: Modo de emergencia mínimo (aunque este
        sí te pedirá la clave actual de root si no la has quitado).
- id: dmesg
  name: dmesg
  synopsis: dmesg -T -l err,warn
  description: >-
    Inspeccionar el historial de detección de hardware en la memoria RAM con el
    comando dmesg
  category: Arranque del sistema
  subtopicIds:
    - '101.2'
  example: dmesg -T -l err,warn
  flags:
    - flag: ¿Para qué sirve dmesg en la vida real?
      description: >-
        Es la primera herramienta del SysAdmin cuando algo de hardware falla: un
        disco que da errores de lectura, una tarjeta Wi-Fi que no conecta o un
        puerto USB que no reconoce un dispositivo.
    - flag: dmesg -T (Human-readable time)
      description: >-
        🎯 Clave de Examen: Convierte los segundos incomprensibles [  12.451234]
        en fechas y horas humanas reales (ej:
    - flag: dmesg -l err,warn
      description: >-
        Filtra la salida para no leer miles de líneas y ver únicamente los
        errores y advertencias de hardware.
    - flag: dmesg -w (Follow / En vivo)
      description: >-
        Se queda a la escucha en directo (como tail -f): conectas un pendrive
        USB y ves salir los mensajes del kernel al instante.
- id: journalctl
  name: journalctl
  synopsis: journalctl -b -1 -p err
  description: >-
    Consultar y filtrar en segundos los logs del kernel, del arranque y de los
    servicios en una base de datos indexada
  category: Arranque del sistema
  subtopicIds:
    - '101.2'
  example: journalctl -b -1 -p err
  flags:
    - flag: journalctl -b
      description: >-
        Muestra todos los logs generados desde que encendiste el ordenador en la
        sesión actual.
    - flag: journalctl -b -1
      description: >-
        🎯 Clave de Examen: Muestra los logs del arranque ANTERIOR (vital cuando
        un servidor se reinició inesperadamente y quieres saber por qué cayó).
    - flag: journalctl -u nginx -f
      description: >-
        Filtra por un servicio concreto (ej: servidor web nginx) y se queda en
        directo (-f / follow) viendo accesos o errores.
    - flag: journalctl -k -p err
      description: >-
        Muestra solo mensajes del Kernel (-k) con prioridad de error grave (-p
        err).
    - flag: journalctl --list-boots
      description: >-
        Lista todos los arranques que el sistema tiene guardados en su historial
        con sus fechas y horas exactas.
- id: runlevel-telinit-init
  name: runlevel | telinit | init
  synopsis: runlevel | telinit | init [opciones]
  description: >-
    Consultar el nivel previo y actual, y solicitar la transición hacia un nuevo
    nivel
  category: >-
    Cambiar los niveles de ejecución / objetivos de arranque y apagar o
    reiniciar el sistema
  subtopicIds:
    - '101.3'
  example: runlevel | telinit | init [opciones]
  flags:
    - flag: runlevel
      description: >-
        🎯 Clave de Examen: Muestra dos caracteres: el nivel previo (N = ninguno
        si no ha cambiado desde el arranque) y el nivel actual.
    - flag: '-'
      description: >-
        Solicita a init cambiar al nivel indicado (ej: telinit 1 pasa a
        monousuario; telinit 6 reinicia).
    - flag: telinit q / Q
      description: >-
        🎯 Clave de Examen: Recarga el archivo /etc/inittab sin necesidad de
        reiniciar el sistema.
    - flag: Prefijo 'S' (Start)
      description: >-
        En /etc/rcX.d/, los enlaces que empiezan por S (ej: S01ssh) arrancan el
        servicio pasando el argumento
    - flag: Prefijo 'K' (Kill)
      description: >-
        Los enlaces que empiezan por K (ej: K01apache2) detienen el servicio
        pasando el argumento
