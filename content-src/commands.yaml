- id: rpm
  name: rpm
  synopsis: rpm -i | -U | -F | -e [--nodeps] [--force] [--test]
  description: Instalar, actualizar o desinstalar paquetes .rpm en el sistema local
  category: Gestión de paquetes RPM y YUM
  subtopicIds:
    - '102.5'
  example: rpm -i | -U | -F | -e [--nodeps] [--force] [--test]
  flags:
    - flag: '-i, --install <archivo.rpm>'
      description: >-
        Instala un paquete nuevo en el sistema (habitualmente combinado como
        -ivh: install, verbose, hash bars).
    - flag: '-U, --upgrade <archivo.rpm>'
      description: >-
        🎯 Clave de Examen: Actualiza un paquete existente; SI NO ESTÁ
        INSTALADO, LO INSTALA por primera vez.
    - flag: '-F, --freshen <archivo.rpm>'
      description: >-
        🎯 Clave de Examen: Actualiza un paquete ÚNICAMENTE SI YA ESTÁ
        INSTALADO. Si no existe previamente, NO hace nada.
    - flag: '-e, --erase <paquete>'
      description: >-
        Desinstala un paquete del sistema por su nombre lógico (sin extensión
        .rpm).
    - flag: '--test'
      description: >-
        🎯 Simula la operación (comprueba conflictos y dependencias) sin llegar
        a escribir nada en el disco.
    - flag: '--nodeps'
      description: >-
        ⚠️ ¡Peligro de Examen! Ignora la comprobación de dependencias e instala
        o borra el paquete a la fuerza.
    - flag: '--force'
      description: >-
        Equivale a --replacepkgs y --replacefiles: sobrescribe ficheros
        existentes de otros paquetes.
- id: rpm2cpio
  name: rpm2cpio
  synopsis: rpm2cpio <archivo.rpm> | cpio -idmv [archivo]
  description: >-
    Recuperar binarios o librerías críticas de un archivo .rpm en situaciones de
    emergencia sin usar el comando rpm ni tocar la base de datos del sistema.
  category: Gestión de paquetes RPM y YUM
  subtopicIds:
    - '102.5'
  example: rpm2cpio <archivo.rpm> | cpio -idmv [archivo]
  flags:
    - flag: rpm2cpio pkg.rpm
      description: >-
        Lee el archivo .rpm y vuelca por la salida estándar (stdout) el flujo de
        datos en formato de archivador cpio.
    - flag: cpio -i
      description: Modo extracción de ficheros desde el flujo recibido por la tubería (|).
    - flag: cpio -d
      description: >-
        🎯 Crea automáticamente los directorios padre necesarios según la
        estructura del paquete.
    - flag: cpio -m
      description: >-
        Conserva la fecha y hora original de modificación de los ficheros
        extraídos.
    - flag: cpio -v
      description: Muestra por pantalla en tiempo real los ficheros extraídos.
- id: yum
  name: yum
  synopsis: yum / dnf install | update | remove | clean all
  description: >-
    Ciclo de vida automatizado en Red Hat/Fedora: instalación resolviendo
    librerías, actualización transaccional y limpieza de caché.
  category: Gestión de paquetes RPM y YUM
  subtopicIds:
    - '102.5'
  example: yum / dnf install | update | remove | clean all
  flags:
    - flag: install [-y] <paquete>
      description: >-
        Descarga e instala el paquete resolviendo automáticamente todo el árbol
        de librerías.
    - flag: update [paquete]
      description: >-
        Actualiza el paquete indicado o todo el sistema si no se especifica
        nombre.
    - flag: check-update
      description: >-
        🎯 Clave de Examen: Comprueba si existen actualizaciones sin instalar
        nada (devuelve código 100 si las hay).
    - flag: remove <paquete>
      description: >-
        Desinstala el paquete y retira las dependencias no utilizadas que
        quedaron huérfanas.
    - flag: clean all
      description: >-
        🎯 Borra todos los paquetes descargados y vacía los metadatos de
        /var/cache/dnf/.
- id: zypper
  name: zypper
  synopsis: zypper refresh | install | remove | update | lr | ar | mr
  description: >-
    El gestor nativo de SUSE Linux y openSUSE: resolución SAT ultra-rápida
    (libzypp) y comandos cortos de 2 letras.
  category: Gestión de paquetes RPM y YUM
  subtopicIds:
    - '102.5'
  example: zypper refresh | install | remove | update | lr | ar | mr
  flags:
    - flag: refresh, ref
      description: >-
        🎯 Descarga los metadatos frescos de todos los repositorios remotos
        (equivalente a apt-get update).
    - flag: install, in <paquete>
      description: >-
        Instala paquetes y resuelve dependencias automáticamente con algoritmo
        SAT.
    - flag: remove, rm <paquete>
      description: Desinstala un paquete del sistema.
    - flag: update, up [paquete]
      description: Actualiza los paquetes a su versión más reciente disponible.
    - flag: repos, lr
      description: >-
        🎯 Clave de Examen: Lista todos los repositorios configurados en
        /etc/zypp/repos.d/.
    - flag: modifyrepo, mr -d/-e
      description: >-
        🎯 Clave de Examen: Deshabilita (-d) o habilita (-e) un repositorio
        existente sin borrar el fichero.
    - flag: what-provides, wp <archivo>
      description: Averigua qué paquete proporciona un archivo o comando en openSUSE.
- id: grep
  name: grep
  synopsis: grep -E --color '(vmx|svm)' /proc/cpuinfo | lscpu
  description: >-
    Detectar si el procesador físico soporta virtualización asistida por
    hardware y si está habilitada en la BIOS/UEFI antes de desplegar KVM.
  category: Linux como sistema virtualizado
  subtopicIds:
    - '102.6'
    - '103.7'
  example: grep -E --color '(vmx|svm)' /proc/cpuinfo | lscpu
  flags:
    - flag: vmx
      description: >-
        🎯 Virtual Machine eXtensions. Indica soporte nativo de KVM en
        procesadores Intel (Core, Xeon).
    - flag: svm
      description: >-
        🎯 Secure Virtual Machine. Indica soporte nativo de KVM en procesadores
        AMD (Ryzen, EPYC).
    - flag: lscpu
      description: 'Muestra el campo ''Virtualization: VT-x'' o ''AMD-V'' de forma legible.'
    - flag: lsmod | grep kvm
      description: >-
        Confirma que los módulos 'kvm' y 'kvm_intel' o 'kvm_amd' están activos
        en memoria.
- id: virt-install
  name: virt-install
  synopsis: virt-install --name <nombre> --vcpus <n> --memory <MB> --disk <ruta> ...
  description: >-
    Aprovisionar máquinas virtuales desde terminal y gobernar su ciclo de vida
    en servidores remotos sin entorno gráfico.
  category: Linux como sistema virtualizado
  subtopicIds:
    - '102.6'
  example: virt-install --name <nombre> --vcpus <n> --memory <MB> --disk <ruta> ...
  flags:
    - flag: virt-install
      description: >-
        🎯 Comando CLI para crear dominios libvirt especificando vCPUs, RAM,
        disco ISO y red.
    - flag: virsh list [--all]
      description: >-
        🎯 'virsh list' muestra solo las VMs encendidas; '--all' lista también
        las apagadas.
    - flag: virsh start <vm>
      description: Arranca el dominio libvirt indicado.
    - flag: virsh shutdown <vm>
      description: >-
        🎯 Envía una señal ACPI al kernel invitado para realizar un apagado
        limpio y seguro.
    - flag: virsh destroy <vm>
      description: >-
        🎯 Clave de Examen: Corta la corriente de golpe (hard reset). ¡NO borra
        el disco ni la VM!
- id: systemd-machine-id-setup
  name: systemd-machine-id-setup
  synopsis: systemd-machine-id-setup | dbus-uuidgen --ensure
  description: >-
    Garantizar la identidad unívoca de cada instancia Linux: cómo evitar
    conflictos de red y colisiones de logs al clonar máquinas virtuales.
  category: Linux como sistema virtualizado
  subtopicIds:
    - '102.6'
  example: systemd-machine-id-setup | dbus-uuidgen --ensure
  flags:
    - flag: /etc/machine-id
      description: >-
        🎯 Archivo de texto plano con 32 caracteres hexadecimales generado
        durante la instalación del sistema.
    - flag: truncate -s 0
      description: >-
        🎯 Clave de Examen: Deja el archivo con 0 bytes antes de apagar la
        plantilla dorada para clonar.
    - flag: systemd-machine-id-setup
      description: >-
        🎯 Genera un identificador nuevo y único leyendo el UUID del hipervisor
        o creando uno criptográfico.
    - flag: dbus-uuidgen --ensure
      description: >-
        Comando alternativo histórico para garantizar la identidad en
        /var/lib/dbus/machine-id.
- id: ssh-keygen
  name: ssh-keygen
  synopsis: ssh-keygen -t rsa -b 4096 | ssh-copy-id usuario@servidor
  description: >-
    Criptografía asimétrica para servidores virtuales y en la nube: generación
    de pares de claves, despliegue y permisos estrictos.
  category: Linux como sistema virtualizado
  subtopicIds:
    - '102.6'
  example: ssh-keygen -t rsa -b 4096 | ssh-copy-id usuario@servidor
  flags:
    - flag: ssh-keygen
      description: 'Crea el par criptográfico: clave privada secreta y clave pública.'
    - flag: id_rsa (Clave Privada)
      description: >-
        ⚠️ NUNCA debe salir de tu máquina local. Permisos obligatorios: 0600
        (-rw-------).
    - flag: id_rsa.pub (Clave Pública)
      description: Se distribuye libremente a los servidores donde quieras acceder.
    - flag: ssh-copy-id usuario@host
      description: >-
        🎯 Clave de Examen: Copia tu clave pública e inyecta su contenido en
        ~/.ssh/authorized_keys remoto.
    - flag: ~/.ssh/authorized_keys
      description: >-
        🎯 Fichero en el servidor donde se registran las claves autorizadas.
        Permisos obligatorios: 0600.
- id: uname
  name: uname
  synopsis: uname -a | -r | -m | pwd | cd [-|~]
  description: Auditoría inicial de kernel, hardware y rutas antes de operar en consola
  category: Trabajar en la línea de comandos
  subtopicIds:
    - '103.1'
  example: uname -a | -r | -m | pwd | cd [-|~]
  flags:
    - flag: uname -a
      description: >-
        🎯 Imprime nombre de SO, hostname, versión kernel, arquitectura y
        plataforma.
    - flag: uname -r
      description: >-
        🎯 Versión exacta de release del kernel (ej: 6.1.0-21-amd64). ¡Dato
        clave para compilar drivers!
    - flag: uname -m
      description: >-
        🎯 Arquitectura de hardware (x86_64 para 64 bits PC, aarch64 para ARM,
        i686 para 32 bits).
    - flag: pwd
      description: >-
        Print Working Directory: muestra la ruta absoluta del directorio donde
        estás parado.
    - flag: cd ~ / cd
      description: >-
        Sin argumentos o con virgulilla (~), vuelve de golpe al directorio
        personal del usuario.
    - flag: cd -
      description: >-
        🎯 Regresa al directorio inmediatamente anterior usando la variable
        interna $OLDPWD.
- id: type
  name: type
  synopsis: type [-a] | which | whereis | hash [-r]
  description: Averiguar la naturaleza exacta de un comando y su ubicación en el sistema
  category: Trabajar en la línea de comandos
  subtopicIds:
    - '103.1'
    - '104.7'
  example: type [-a] | which | whereis | hash [-r]
  flags:
    - flag: type <cmd>
      description: >-
        🎯 Comando interno de Bash. Descubre si es builtin, alias, función o
        archivo en disco.
    - flag: type -a <cmd>
      description: >-
        🎯 Muestra todas las versiones de la orden en orden estricto de
        prioridad de ejecución.
    - flag: which <cmd>
      description: >-
        🎯 Busca ejecutables en disco según $PATH. ¡No encuentra builtins como
        cd o exit!
    - flag: whereis <cmd>
      description: >-
        Localiza el archivo ejecutable, el código fuente y las páginas man en
        rutas estándar.
    - flag: hash [-r]
      description: >-
        Muestra la tabla hash en RAM con rutas ya ejecutadas. 'hash -r' la vacía
        por completo.
- id: history
  name: history
  synopsis: history [N] | !! | !n | !cadena | Ctrl+R
  description: Ahorrar tiempo y evitar errores repitiendo y buscando órdenes ejecutadas
  category: Trabajar en la línea de comandos
  subtopicIds:
    - '103.1'
  example: history [N] | !! | !n | !cadena | Ctrl+R
  flags:
    - flag: history [N]
      description: >-
        🎯 Muestra la lista numerada de comandos ejecutados (opcionalmente solo
        los últimos N).
    - flag: '!!'
      description: >-
        🎯 Vuelve a ejecutar la última orden tecleada. Imprescindible: 'sudo !!'
        al olvidar permisos.
    - flag: '!n'
      description: >-
        🎯 Ejecuta directamente la orden con el número de índice 'n' del
        historial (ej: !1050).
    - flag: '!-n'
      description: >-
        Ejecuta el comando tecleado hace 'n' pasos atrás (ej: !-1 es idéntico a
        !!).
    - flag: '!cadena'
      description: >-
        Ejecuta el comando más reciente que empiece por 'cadena' (ej:
        !systemctl).
    - flag: Ctrl + R
      description: >-
        Búsqueda incremental inversa en el historial mientras vas escribiendo
        caracteres.
- id: cat
  name: cat
  synopsis: cat [-n] | tac | head [-n] | tail [-n|-f]
  description: Inspeccionar archivos completos, invertidos o solo sus cabeceras y colas
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
  example: cat [-n] | tac | head [-n] | tail [-n|-f]
  flags:
    - flag: cat -n
      description: 🎯 Numera todas las líneas de salida de la primera a la última.
    - flag: cat -s
      description: Reduce múltiples líneas consecutivas en blanco a una sola.
    - flag: tac <fichero>
      description: '🎯 Invierte las líneas: muestra el archivo empezando por el final.'
    - flag: head -n <N>
      description: 🎯 Muestra las primeras N líneas (por defecto 10 si no indicas número).
    - flag: tail -n <N>
      description: 🎯 Muestra las últimas N líneas del fichero (por defecto 10).
    - flag: tail -f
      description: >-
        🎯 Modo follow: no se cierra, monitoriza nuevas líneas añadidas al log
        en tiempo real.
- id: wc
  name: wc
  synopsis: wc [-l|-w|-c|-m] | nl [-ba]
  description: Contar elementos de texto y formatear números de línea profesionales
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
  example: wc [-l|-w|-c|-m] | nl [-ba]
  flags:
    - flag: wc (sin flags)
      description: 'Imprime 3 cifras: total líneas, total palabras y total bytes.'
    - flag: wc -l
      description: >-
        🎯 Cuenta únicamente los saltos de línea. El comodín en tuberías: 'cat
        arch | wc -l'.
    - flag: wc -w
      description: Cuenta palabras delimitadas por espacios en blanco o tabuladores.
    - flag: wc -c
      description: 🎯 Cuenta el tamaño total del archivo medido en bytes.
    - flag: wc -m
      description: >-
        Cuenta caracteres lógicos (diferencia caracteres acentuados o emojis de
        sus bytes).
    - flag: nl -ba
      description: 🎯 Numera absolutamente todas las líneas (incluso las líneas vacías).
- id: cut
  name: cut
  synopsis: cut -d<delim> -f<campos> | paste -d<delim> [-s]
  description: >-
    Recortar campos verticales de texto o unir archivos horizontalmente en
    columnas
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
  example: cut -d<delim> -f<campos> | paste -d<delim> [-s]
  flags:
    - flag: cut -d<delim>
      description: >-
        🎯 Define el carácter separador de columnas (por defecto tabulador). En
        /etc/passwd es ':'.
    - flag: cut -f<campos>
      description: >-
        🎯 Número de columnas a recortar: '-f1' (primera), '-f1,7' (primera y
        séptima), '-f1-3' (rango).
    - flag: cut -c<rango>
      description: >-
        🎯 Extrae por posición fija de caracteres: 'cut -c 1-8' (de la letra 1 a
        la 8).
    - flag: paste arch1 arch2
      description: 🎯 Junta archivos lado a lado, línea 1 con línea 1, línea 2 con línea 2.
    - flag: paste -s
      description: >-
        Convierte todas las líneas verticales de un mismo archivo en una sola
        línea horizontal.
- id: sort
  name: sort
  synopsis: sort [-n|-r|-k|-t|-u]
  description: Reorganizar registros alfabética o numéricamente por columnas
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
  example: sort [-n|-r|-k|-t|-u]
  flags:
    - flag: sort (sin flags)
      description: 'Ordena alfabéticamente. ⚠️ Atención: ''10'' va antes que ''2''.'
    - flag: sort -n
      description: >-
        🎯 Clave de Examen: Compara los valores como números reales (2 antes que
        10).
    - flag: sort -r
      description: 🎯 Invierte el criterio de ordenación (de mayor a menor o de Z a A).
    - flag: sort -k <N>
      description: '🎯 Key: selecciona la columna N por la que se ordenará la tabla.'
    - flag: sort -t <delim>
      description: >-
        🎯 Define el separador de campos para usar con '-k' (ej: '-t:' en
        /etc/passwd).
    - flag: sort -u
      description: Elimina líneas duplicadas durante la propia ordenación.
- id: tr
  name: tr
  synopsis: tr [-d|-s|-c] <conjunto1> [conjunto2]
  description: >-
    Traducir, sustituir, exprimir o borrar caracteres individuales mediante
    stdin
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
  example: tr [-d|-s|-c] <conjunto1> [conjunto2]
  flags:
    - flag: tr 'a-z' 'A-Z'
      description: >-
        🎯 Reemplaza cada carácter del conjunto 1 por el correspondiente del
        conjunto 2.
    - flag: tr -d <SET>
      description: >-
        🎯 Delete: elimina de la salida todos los caracteres especificados en
        SET.
    - flag: tr -s <SET>
      description: >-
        🎯 Comprime secuencias consecutivas repetidas del mismo carácter en uno
        solo.
    - flag: tr -c <SET>
      description: Aplica la operación sobre todos los caracteres que NO están en SET.
- id: sed
  name: sed
  synopsis: sed [-e|-n|-i] 's/buscar/reemplazo/[g]'
  description: Transformar, sustituir y filtrar flujos de texto de forma no interactiva
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
    - '103.7'
  example: sed [-e|-n|-i] 's/buscar/reemplazo/[g]'
  flags:
    - flag: s/antiguo/nuevo/g
      description: >-
        🎯 's' (substitute), busca 'antiguo' y lo cambia por 'nuevo'. 'g' lo
        hace en toda la línea.
    - flag: sed -n 'Np'
      description: >-
        🎯 '-n' suprime la salida por defecto; 'Np' le ordena imprimir
        exclusivamente la línea N.
    - flag: sed -i 's/.../'
      description: >-
        🎯 Peligro: Modifica el archivo físico directamente en el disco en lugar
        de solo mostrarlo.
    - flag: sed '/patrón/d'
      description: >-
        Elimina de la salida todas las líneas que coincidan con la expresión
        regular.
- id: sha256sum
  name: sha256sum
  synopsis: sha256sum | md5sum | sha512sum [-c fichero]
  description: Garantizar que un archivo no ha sido corrompido ni alterado maliciosamente
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
  example: sha256sum | md5sum | sha512sum [-c fichero]
  flags:
    - flag: sha256sum <file>
      description: >-
        🎯 Calcula un hash de 256 bits (64 caracteres hex). El estándar moderno
        oficial.
    - flag: md5sum <file>
      description: >-
        Calcula un hash de 128 bits (32 caracteres hex). Rápido pero inseguro
        criptográficamente.
    - flag: '-c, --check'
      description: >-
        🎯 Clave de Examen: Lee el archivo de hashes y comprueba los ficheros
        devolviendo 'OK' o 'FAILED'.
    - flag: '--status'
      description: >-
        No imprime nada; solo devuelve código de salida 0 si todos los hashes
        son válidos.
- id: od
  name: od
  synopsis: od [-c|-x] <file> | split [-b|-l|-d] <file> [prefijo]
  description: Examinar bytes ocultos en archivos y dividir ficheros gigantescos en trozos
  category: Procesar flujos de texto usando filtros
  subtopicIds:
    - '103.2'
  example: od [-c|-x] <file> | split [-b|-l|-d] <file> [prefijo]
  flags:
    - flag: od -c
      description: >-
        🎯 Octal Dump: revela caracteres no imprimibles (saltos de línea \n,
        retornos \r, tabuladores \t).
    - flag: split -b <tamaño>
      description: >-
        🎯 Fragmenta el archivo por tamaño en bytes (ej: '-b 50M', '-b 1G', '-b
        700M').
    - flag: split -l <líneas>
      description: '🎯 Divide un archivo de texto en trozos de N líneas (ej: ''-l 1000'').'
    - flag: split -d
      description: >-
        🎯 Utiliza números (00, 01, 02) en vez de letras alfabéticas (aa, ab,
        ac).
- id: ls
  name: ls
  synopsis: ls [-l|-a|-h|-d|-i|-R|-t|-S] [ruta]
  description: >-
    Consultar permisos, propietarios, tamaños reales y metadatos de archivos y
    carpetas
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
  example: ls [-l|-a|-h|-d|-i|-R|-t|-S] [ruta]
  flags:
    - flag: ls -l
      description: >-
        🎯 Imprime 8 columnas: tipo, 9 permisos, enlaces, dueño UID, grupo GID,
        tamaño, fecha y nombre.
    - flag: ls -a
      description: >-
        🎯 Clave de Examen: Muestra todos los ficheros, incluidos los ocultos
        que inician por punto (.) y '.' / '..'
    - flag: ls -d
      description: >-
        🎯 Clave de Examen: Lista las propiedades de la carpeta en sí, sin
        entrar a listar su contenido.
    - flag: ls -h
      description: >-
        🎯 Convierte los bytes en unidades entendibles (K, M, G, T) junto con la
        opción -l.
    - flag: ls -i
      description: 🎯 Muestra el identificador numérico de inodo en la primera columna.
    - flag: ls -t / -S
      description: >-
        '-t' ordena cronológicamente (más recientes primero); '-S' por tamaño
        descendente.
- id: mkdir
  name: mkdir
  synopsis: mkdir -p | touch [-t MMDDhhmm] | rmdir
  description: >-
    Crear ficheros vacíos, modificar fechas de acceso/modificación y construir
    árboles de carpetas
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
  example: mkdir -p | touch [-t MMDDhhmm] | rmdir
  flags:
    - flag: mkdir -p
      description: >-
        🎯 Clave de Examen: Crea directorios padre intermedios automáticamente
        sin error si ya existían.
    - flag: mkdir -m <modo>
      description: >-
        Define permisos octales al crear la carpeta (ej: 'mkdir -m 700
        secreta').
    - flag: touch <archivo>
      description: >-
        🎯 Si el archivo no existe lo crea vacío (0 bytes); si ya existe,
        actualiza su fecha al segundo actual.
    - flag: touch -t YYYYMMDDhhmm
      description: >-
        🎯 Clave de Examen: Sobrescribe la marca temporal con una fecha y hora
        exacta arbitraria.
    - flag: rmdir <directorio>
      description: >-
        🎯 Comando defensivo: borra la carpeta ÚNICAMENTE si está 100% vacía.
        Falla si contiene archivos.
- id: cp
  name: cp
  synopsis: cp [-a|-r|-p] | mv [-i] | rm [-rf]
  description: >-
    Duplicar árboles preservando permisos de seguridad, renombrar y purgar
    ficheros
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
  example: cp [-a|-r|-p] | mv [-i] | rm [-rf]
  flags:
    - flag: cp -a
      description: >-
        🎯 Clave Absoluta de Examen: Equivale a '-dpR'. Preserva permisos,
        dueños UID/GID, timestamps y enlaces simbólicos.
    - flag: cp -r, -R
      description: >-
        🎯 Copia carpetas pero cambia el dueño al usuario que ejecuta el comando
        y actualiza las fechas al momento actual.
    - flag: cp -p
      description: >-
        🎯 Preserva permisos originales, dueño y sellos de tiempo (incluido
        dentro de -a).
    - flag: mv origen dest
      description: >-
        🎯 Si el destino es la misma carpeta, renombra. Si es otra carpeta,
        traslada el archivo.
    - flag: rm -rf <dir>
      description: >-
        🎯 '-r' desciende por todas las carpetas; '-f' fuerza el borrado sin
        preguntar ni avisar de errores.
- id: find
  name: find
  synopsis: find [ruta] [-name|-type|-size|-maxdepth]
  description: >-
    Rastrear recursivamente el árbol de archivos en tiempo real según criterios
    precisos
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
    - '103.4'
    - '104.6'
  example: find [ruta] [-name|-type|-size|-maxdepth]
  flags:
    - flag: find <ruta>
      description: Punto de partida recursivo (por defecto '.' si no indicas ruta).
    - flag: '-name ''<patrón>'''
      description: >-
        🎯 Sensible a mayúsculas. ¡OBLIGATORIO entrecomillar los comodines
        ('*.log')!
    - flag: '-iname ''<patrón>'''
      description: 'Case-insensitive: coincide tanto con ''.log'' como con ''.LOG'' o ''.Log''.'
    - flag: '-type [f|d|l]'
      description: >-
        🎯 Clave de Examen: 'f' = fichero regular, 'd' = carpeta/directorio, 'l'
        = enlace simbólico.
    - flag: '-size [+|-]N[k|M|G]'
      description: >-
        🎯 Clave de Examen: '+50M' = mayor de 50 MB, '-100k' = menor de 100 KB,
        '500c' = exactamente 500 bytes.
    - flag: '-maxdepth N'
      description: >-
        🎯 Limita el rastreo a N niveles de subcarpetas (evita búsquedas
        infinitas).
- id: tar
  name: tar
  synopsis: tar -[c|x|t][v][f archivo.tar] [-z|-j|-J] [rutas]
  description: >-
    Crear, listar y restaurar archivos empaquetados preservando permisos y
    directorios
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
  example: tar -[c|x|t][v][f archivo.tar] [-z|-j|-J] [rutas]
  flags:
    - flag: tar -c / -x / -t
      description: >-
        🎯 Operaciones: '-c' (Create / nuevo tar), '-x' (eXtract / restaurar),
        '-t' (Test / listar contenido sin extraer).
    - flag: tar -f <archivo>
      description: >-
        🎯 ¡OBLIGATORIO! Especifica el fichero contenedor. Debe ir siempre
        inmediatamente pegado al nombre del archivo.
    - flag: tar -z
      description: '🎯 Compresión gzip estándar: rápida y ultracompatible en todos los Unix.'
    - flag: tar -j
      description: '🎯 Compresión bzip2: archivos más pequeños a costa de mayor uso de CPU.'
    - flag: tar -J (Mayúscula)
      description: '🎯 Compresión xz: máxima tasa de compresión moderna con algoritmo LZMA2.'
    - flag: tar -C <directorio>
      description: >-
        🎯 Cambia a la carpeta indicada antes de extraer (ej: 'tar -xvf
        bkp.tar.gz -C /var/www').
- id: cpio
  name: cpio
  synopsis: cpio -o | cpio -i | cpio -p
  description: >-
    Archivar, restaurar o migrar árboles de archivos leídos desde la entrada
    estándar (stdin)
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
  example: cpio -o | cpio -i | cpio -p
  flags:
    - flag: cpio -o, --create
      description: >-
        🎯 Lee la lista de rutas por 'stdin' y escribe el archivo empaquetado
        resultante en 'stdout'.
    - flag: cpio -i, --extract
      description: >-
        🎯 Lee el archivo empaquetado por 'stdin' y extrae los archivos en el
        disco duro.
    - flag: cpio -p
      description: >-
        🎯 Copia un árbol de directorios directamente a otra carpeta sin crear
        fichero intermedio.
    - flag: cpio -d
      description: >-
        🎯 Crea automáticamente las carpetas intermedias necesarias al restaurar
        los ficheros.
    - flag: cpio -t
      description: >-
        Muestra la lista de ficheros contenidos en el archivo sin extraerlos en
        disco.
- id: dd
  name: dd
  synopsis: dd if=<origen> of=<destino> [bs=<bloque>] [count=<n>]
  description: >-
    Clonar discos, crear imágenes binarias idénticas y respaldar el MBR sector a
    sector
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
  example: dd if=<origen> of=<destino> [bs=<bloque>] [count=<n>]
  flags:
    - flag: if=<ruta>
      description: >-
        🎯 Fichero o dispositivo físico origen (ej: 'if=/dev/sda',
        'if=/dev/zero', 'if=debian.iso').
    - flag: of=<ruta>
      description: >-
        🎯 Fichero o dispositivo físico destino (ej: 'of=/dev/sdb',
        'of=/backup/disco.img').
    - flag: bs=<tamaño>
      description: '🎯 Tamaño de cada bloque a transferir (ej: ''bs=512'', ''bs=4k'', ''bs=1M'').'
    - flag: count=<N>
      description: '🎯 Número total de bloques a copiar antes de detenerse (ej: ''count=1'').'
    - flag: status=progress
      description: Muestra la velocidad de transferencia y bytes copiados en directo.
- id: file
  name: file
  synopsis: file [-b|-i|-z] <fichero>
  description: >-
    Inspeccionar las cabeceras (Magic Numbers) para descubrir el formato real de
    cualquier archivo
  category: Administración básica de archivos
  subtopicIds:
    - '103.3'
  example: file [-b|-i|-z] <fichero>
  flags:
    - flag: file <archivo>
      description: >-
        🎯 Lee los primeros bytes (números mágicos) comparándolos con la base de
        datos de firmas (/etc/magic).
    - flag: file -b, --brief
      description: >-
        🎯 Omite el nombre del archivo al inicio de la salida, imprimiendo solo
        el tipo de archivo.
    - flag: file -i, --mime
      description: >-
        🎯 Clave de Examen: Devuelve el tipo MIME estándar (ej: 'text/plain',
        'application/x-executable').
    - flag: file -z, --uncompress
      description: >-
        Intenta examinar el interior de ficheros comprimidos para averiguar qué
        formato albergan.
- id: cmd
  name: cmd
  synopsis: cmd > archivo | cmd >> archivo | cmd > /dev/null
  description: >-
    Sobreescribir o concatenar el flujo de salida estándar (stdout / 1) en
    archivos
  category: Uso de secuencias de texto, tuberías y redireccionamientos
  subtopicIds:
    - '103.4'
    - '103.5'
  example: cmd > archivo | cmd >> archivo | cmd > /dev/null
  flags:
    - flag: '> archivo (o 1>)'
      description: >-
        🎯 Sobreescribe el archivo por completo. Si ya existía, trunca y borra
        todo su contenido.
    - flag: '>> archivo (o 1>>)'
      description: 🎯 Añade datos al final del fichero existente sin borrar lo anterior.
    - flag: '> /dev/null'
      description: '🎯 El agujero negro: descarta los datos de forma silenciosa e inmediata.'
- id: set
  name: set
  synopsis: set -o noclobber | set +o noclobber | cmd >| archivo
  description: >-
    Activar la protección de shell que impide sobreescribir archivos existentes
    con el operador >
  category: Uso de secuencias de texto, tuberías y redireccionamientos
  subtopicIds:
    - '103.4'
  example: set -o noclobber | set +o noclobber | cmd >| archivo
  flags:
    - flag: set -o noclobber
      description: 🎯 Activa la protección contra sobreescritura accidental con '>'.
    - flag: '>| archivo'
      description: >-
        🎯 Clave de Examen: Operador 'clobber' que fuerza sobreescribir
        ignorando la protección.
    - flag: set +o noclobber
      description: 🎯 Desactiva la protección permitiendo de nuevo '>' normal.
    - flag: '>> (concatenar)'
      description: >-
        La concatenación '>>' nunca destruye datos, por lo que noclobber la
        permite siempre.
- id: comando1
  name: comando1
  synopsis: comando1 | comando2 | comando3
  description: >-
    Procesar datos en streaming mediante memoria RAM sin crear molestos archivos
    temporales en disco
  category: Uso de secuencias de texto, tuberías y redireccionamientos
  subtopicIds:
    - '103.4'
  example: comando1 | comando2 | comando3
  flags:
    - flag: Operador tubería (|)
      description: >-
        🎯 Conecta directamente la salida del comando izquierdo a la entrada del
        derecho mediante un búfer circular en RAM (64 KB). Cero I/O en disco.
    - flag: Streaming Concurrente
      description: >-
        Los comandos no esperan a que el anterior termine: el segundo va
        procesando líneas según el primero las va emitiendo.
    - flag: ⚠️ Exclusión de stderr
      description: >-
        🎯 Clave Absoluta de Examen: La tubería '|' solo transporta stdout (1).
        Los errores (stderr / 2) saltan directos a la pantalla.
    - flag: '|& (Pipe de error Bash)'
      description: >-
        🎯 Atajo moderno de Bash equivalente a '2>&1 |': envía tanto la salida
        exitosa como los errores al siguiente filtro.
- id: comando
  name: comando
  synopsis: comando $(subcomando) | comando `subcomando`
  description: >-
    Inyectar dinámicamente fechas, rutas, PIDs o parámetros calculados dentro de
    una orden de terminal
  category: Uso de secuencias de texto, tuberías y redireccionamientos
  subtopicIds:
    - '103.4'
  example: comando $(subcomando) | comando `subcomando`
  flags:
    - flag: $(comando)
      description: >-
        🎯 Recomendada por LPI y administradores: legible, limpia y permite
        anidar comandos infinitamente sin errores.
    - flag: '`comando` (Backticks)'
      description: >-
        Heredada de la shell Bourne original. Se confunde fácilmente con
        comillas simples (') y es muy difícil de anidar.
    - flag: Anidamiento limpio
      description: >-
        🎯 Con $(...) se anida directo: 'echo $(basename $(pwd))'. Con backticks
        requiere engorrosos escapes: '`basename \`pwd\``'.
    - flag: Ejecución en Subshell
      description: >-
        El comando interno se ejecuta en un proceso hijo independiente; las
        variables creadas dentro se destruyen al terminar.
- id: cmd-origen
  name: cmd_origen
  synopsis: cmd_origen | xargs [-n <N>] [-I {}] <cmd_destino>
  description: >-
    Hacer de puente entre programas que emiten texto por tubería y programas que
    exigen parámetros en su llamada
  category: Uso de secuencias de texto, tuberías y redireccionamientos
  subtopicIds:
    - '103.4'
  example: cmd_origen | xargs [-n <N>] [-I {}] <cmd_destino>
  flags:
    - flag: xargs <comando>
      description: >-
        🎯 Lee elementos de stdin y los concatena como una única lista gigante
        al final del comando ('rm f1 f2 f3...').
    - flag: xargs -n <N>
      description: >-
        🎯 Clave de Examen: Ejecuta el comando en grupos de N elementos (ej: '-n
        1' ejecuta el comando una vez por cada línea).
    - flag: xargs -I {}
      description: >-
        🎯 Clave de Examen: Reemplaza '{}' por cada argumento donde tú elijas
        (esencial para 'cp {} /backup/' o 'mv').
    - flag: xargs -p
      description: >-
        Pregunta antes de cada ejecución '¿ejecutar comando? [y/N]' para evitar
        desastres al borrar archivos.
- id: nohup
  name: nohup
  synopsis: nohup <cmd> & | disown -h [%n] | watch [-n <seg>] <cmd>
  description: >-
    Hacer un proceso inmune al cierre de terminal, rescatar jobs sin nohup y
    refrescar comandos en pantalla
  category: Crear, monitorizar y matar procesos
  subtopicIds:
    - '103.5'
  example: nohup <cmd> & | disown -h [%n] | watch [-n <seg>] <cmd>
  flags:
    - flag: nohup <cmd> &
      description: >-
        🎯 No Hangup: lanza el proceso ignorando SIGHUP (1). Si cierras la
        terminal o cae la red SSH, NO se detiene.
    - flag: nohup.out
      description: >-
        🎯 Fichero automático donde nohup guarda stdout/stderr. Se inspecciona
        sin interrumpir con 'head' o 'tail -f'.
    - flag: disown -h [%n]
      description: >-
        🎯 Clave de Examen: Si olvidaste poner nohup, 'disown' retira el job de
        la tabla de la shell para que no reciba SIGHUP.
    - flag: watch -n <seg> <cmd>
      description: >-
        🎯 Ejecuta un comando en bucle cada N segundos (defecto: 2s) a pantalla
        limpia para supervisar cambios.
- id: kill
  name: kill
  synopsis: kill [-s <señal>|-<señal>] <PID|%job>
  description: Transmitir señales de software por PID numérico o por Job ID de la shell
  category: Crear, monitorizar y matar procesos
  subtopicIds:
    - '103.5'
  example: kill [-s <señal>|-<señal>] <PID|%job>
  flags:
    - flag: kill <PID>
      description: >-
        🎯 Clave de Examen: Sin opciones, envía siempre la señal 15 para un
        cierre ordenado.
    - flag: kill -9 <PID>
      description: >-
        🎯 Cierre forzado inmediato por el kernel. Úsalo solo si el proceso no
        responde a SIGTERM.
    - flag: kill -1 <PID>
      description: >-
        🎯 Ordena al demonio recargar su archivo de configuración sin reiniciar
        (ej: Nginx o Apache).
    - flag: kill %N
      description: >-
        🎯 Clave de Examen: Anteponer '%' envía la señal al JOB N de la shell en
        vez de al PID N del sistema.
    - flag: kill -l
      description: Muestra los nombres y números de las 64 señales disponibles en Linux.
- id: killall
  name: killall
  synopsis: killall <nombre> | pkill <patrón> | pgrep <patrón> | pidof <nombre>
  description: >-
    Averiguar PIDs o matar grupos de procesos según su nombre exacto, patrón
    regex o dueño
  category: Crear, monitorizar y matar procesos
  subtopicIds:
    - '103.5'
  example: killall <nombre> | pkill <patrón> | pgrep <patrón> | pidof <nombre>
  flags:
    - flag: pidof <binario>
      description: >-
        🎯 Devuelve los números PID del ejecutable exacto en una sola línea
        (ideal para scripts).
    - flag: pgrep [-l] <patrón>
      description: >-
        🎯 Clave de Examen: Busca PIDs que coincidan con un patrón. Con '-l'
        muestra PID y nombre.
    - flag: killall <nombre_exacto>
      description: >-
        🎯 Mata todos los procesos cuyo ejecutable coincida exactamente (ej:
        'killall nginx').
    - flag: pkill [-9] <patrón>
      description: >-
        🎯 Envía señales a procesos por expresión regular o patrón sin exigir
        nombre exacto.
    - flag: pkill -u <usuario>
      description: >-
        🎯 Clave de Examen: Mata todos los procesos pertenecientes al usuario
        especificado.
- id: ps
  name: ps
  synopsis: ps aux (BSD sin guión) | ps -ef (Unix con guión)
  description: >-
    Consultar la lista completa de procesos, consumo de CPU/RAM, usuarios y
    estados en un microsegundo
  category: Crear, monitorizar y matar procesos
  subtopicIds:
    - '103.5'
    - '103.6'
  example: ps aux (BSD sin guión) | ps -ef (Unix con guión)
  flags:
    - flag: ps aux
      description: >-
        🎯 Clave de Examen: 'a' = todos con terminal; 'u' = formato usuario
        (%CPU, %MEM, RSS); 'x' = demonios sin terminal.
    - flag: ps -ef
      description: >-
        🎯 Clave de Examen: '-e' = todos los procesos; '-f' = formato completo
        mostrando la columna PPID (proceso padre).
    - flag: VSZ frente a RSS
      description: >-
        🎯 VSZ = memoria virtual total reservada; RSS = memoria RAM física real
        ocupada en chips.
    - flag: ps --sort=-%cpu
      description: Ordena de mayor a menor uso de procesador (-%cpu) o de memoria (-%mem).
- id: top
  name: top
  synopsis: top [-d <seg>] [-u <usuario>] [-p <PID>] [-b -n 1]
  description: >-
    Monitorizar en tiempo real el consumo de recursos y ordenar o matar procesos
    interactivamente
  category: Crear, monitorizar y matar procesos
  subtopicIds:
    - '103.5'
    - '103.6'
  example: top [-d <seg>] [-u <usuario>] [-p <PID>] [-b -n 1]
  flags:
    - flag: Tecla M (Mayúscula)
      description: '🎯 Clave de Examen: Reordena la lista de mayor a menor consumo de RAM.'
    - flag: Tecla P (Mayúscula)
      description: '🎯 Clave de Examen: Ordenación por defecto: procesos que más CPU gastan.'
    - flag: Tecla k (Kill)
      description: >-
        🎯 Clave de Examen: Pide un PID y el número de señal para matar el
        proceso sin salir de top.
    - flag: Tecla r (Renice)
      description: >-
        🎯 Solicita un PID y un nuevo valor nice para ajustar su prioridad en
        caliente.
    - flag: Tecla 1 (Uno)
      description: >-
        Alterna entre ver el uso de CPU combinado o desglosado núcleo a núcleo
        (CPU0, CPU1...).
    - flag: top -b -n 1
      description: Ejecuta 1 iteración y sale como texto plano sin pantalla interactiva.
- id: uptime
  name: uptime
  synopsis: uptime | free [-h|-m|-g]
  description: >-
    Evaluar la saturación de los procesadores y diagnosticar el espacio real
    disponible en RAM
  category: Crear, monitorizar y matar procesos
  subtopicIds:
    - '103.5'
  example: uptime | free [-h|-m|-g]
  flags:
    - flag: load average (1, 5, 15)
      description: >-
        🎯 Promedio de procesos ejecutándose o en cola esperando CPU/disco en 1,
        5 y 15 minutos.
    - flag: free -h
      description: >-
        Muestra cifras en GiB, MiB o KiB en lugar de bytes planos difíciles de
        leer.
    - flag: Columna available
      description: >-
        🎯 Clave de Examen: Memoria real que pueden solicitar nuevas
        aplicaciones sin recurrir a swap.
    - flag: buff/cache
      description: >-
        Memoria usada para acelerar lecturas de disco que se cede
        automáticamente si las apps la necesitan.
- id: screen
  name: screen
  synopsis: screen [-S <nombre>] [-r] [-ls] | tmux [new|attach|ls]
  description: >-
    Crear consolas virtuales persistentes en el servidor que no mueren si cae el
    SSH y recuperar su pantalla
  category: Crear, monitorizar y matar procesos
  subtopicIds:
    - '103.5'
  example: screen [-S <nombre>] [-r] [-ls] | tmux [new|attach|ls]
  flags:
    - flag: screen -S <nombre>
      description: >-
        🎯 Inicia una consola virtual persistente e independiente vinculada al
        nombre que elijas.
    - flag: Ctrl + A y luego d
      description: >-
        🎯 Clave de Examen: Desengancha tu terminal de la sesión; el proceso
        sigue trabajando en el servidor.
    - flag: screen -ls
      description: >-
        🎯 Muestra las sesiones abiertas en el servidor y su estado: Detached
        (disponible) o Attached (en uso).
    - flag: screen -r <nombre>
      description: >-
        🎯 Clave de Examen: Vuelve a conectar tu pantalla a una sesión
        desacoplada previamente.
    - flag: tmux attach -t <nombre>
      description: >-
        🎯 Comando homólogo en tmux (con el atajo de desacople universal
        'Ctrl+B' seguido de 'd').
- id: nice
  name: nice
  synopsis: nice [-n <incremento>] <comando> [argumentos...]
  description: Arrancar un proceso NUEVO con un valor de niceness diferente al estándar 0
  category: Modificar la prioridad de ejecución de los procesos
  subtopicIds:
    - '103.6'
  example: nice [-n <incremento>] <comando> [argumentos...]
  flags:
    - flag: nice cmd (sin número)
      description: >-
        🎯 Pregunta Fija de Certificación: Si ejecutas 'nice comando' a secas,
        arranca con nice = 10.
    - flag: nice -n <valor> cmd
      description: >-
        🎯 Sintaxis oficial recomendada: 'nice -n 5 script.sh' (+5) o 'nice -n
        -10 script.sh' (-10).
    - flag: nice -5 cmd (Histórico)
      description: >-
        ⚠️ Trampa de Examen: El guión es el indicador de opción, no el signo
        menos: asigna +5.
    - flag: nice --5 cmd (Histórico)
      description: >-
        ⚠️ Trampa de Examen: 1er guión = opción; 2º guión = signo matemático
        negativo (exige root).
- id: renice
  name: renice
  synopsis: renice [-n] <nuevo_nice> -p <PID> | -u <usuario> | -g <PGID>
  description: >-
    Reasignar el valor absoluto de niceness a procesos activos por PID, por
    usuario o por grupo
  category: Modificar la prioridad de ejecución de los procesos
  subtopicIds:
    - '103.6'
  example: renice [-n] <nuevo_nice> -p <PID> | -u <usuario> | -g <PGID>
  flags:
    - flag: renice -n <val> -p <PID>
      description: >-
        🎯 Fija el valor ABSOLUTO de niceness del proceso indicado (la opción -p
        es el modo por defecto).
    - flag: renice -n <val> -u <user>
      description: >-
        🎯 Clave de Examen: Aplica el nuevo valor a la totalidad de procesos del
        usuario indicado.
    - flag: renice -n <val> -g <PGID>
      description: Modifica la prioridad de un grupo de procesos completo a la vez.
    - flag: Valor Absoluto
      description: >-
        🎯 Clave de Examen: 'renice 5' asigna exactamente nice = 5 (no suma 5 a
        la prioridad anterior).
- id: less
  name: less
  synopsis: less /var/log/syslog (dentro de less usar '/' o '?')
  description: >-
    Ejecutar búsquedas interactivas con soporte nativo de expresiones regulares
    en el visor less
  category: Realizar búsquedas en archivos de texto usando expresiones regulares
  subtopicIds:
    - '103.7'
  example: less /var/log/syslog (dentro de less usar '/' o '?')
  flags:
    - flag: /<patrón>
      description: >-
        🎯 Clave de Examen: Busca hacia ADELANTE (hacia el final del fichero) el
        patrón de expresión regular indicado.
    - flag: '?<patrón>'
      description: >-
        🎯 Clave de Examen: Busca hacia ATRÁS (hacia el inicio del fichero) el
        patrón de expresión regular indicado.
    - flag: 'n'
      description: >-
        🎯 Siguiente coincidencia: salta al siguiente resultado en la misma
        dirección de la búsqueda.
    - flag: 'N'
      description: >-
        🎯 Coincidencia anterior: salta al resultado anterior en dirección
        opuesta.
    - flag: q
      description: 🎯 Salir inmediatamente de less regresando al prompt de la shell.
- id: vi
  name: vi
  synopsis: vi [+<línea>] <archivo> (Navegación en Modo Normal)
  description: >-
    Abrir archivos en líneas específicas y desplazarse rápidamente por el
    documento
  category: Edición básica de archivos
  subtopicIds:
    - '103.8'
  example: vi [+<línea>] <archivo> (Navegación en Modo Normal)
  flags:
    - flag: vi +<N> <archivo>
      description: 🎯 Abre el archivo posicionando el cursor directamente en la línea N.
    - flag: h, j, k, l
      description: 🎯 'h' izquierda, 'j' abajo, 'k' arriba, 'l' derecha.
    - flag: w / b
      description: >-
        🎯 'w' salta a la palabra siguiente (word); 'b' salta a la anterior
        (back).
    - flag: 0 / $
      description: 🎯 '0' salta al inicio de línea; '$' salta al final exacto.
    - flag: 1G (o gg) / G
      description: >-
        🎯 '1G' o 'gg' salta a la primera línea; 'G' mayúscula a la última
        línea.
- id: yy
  name: yy
  synopsis: yy | <N>yy | p | P | u | Ctrl+R
  description: Copiar líneas al portapapeles interno, pegarlas y revertir modificaciones
  category: Edición básica de archivos
  subtopicIds:
    - '103.8'
  example: yy | <N>yy | p | P | u | Ctrl+R
  flags:
    - flag: yy (Yank)
      description: 🎯 Copia la línea actual al portapapeles de vi sin borrarla.
    - flag: <N>yy
      description: 'Copia N líneas consecutivas hacia abajo (ej: ''3yy'').'
    - flag: p / P (Put)
      description: 🎯 'p' pega debajo de la línea actual; 'P' pega encima.
    - flag: u (Undo)
      description: 🎯 Deshace la última modificación realizada en el archivo.
    - flag: Ctrl + R (Redo)
      description: 🎯 Rehace el cambio que se acaba de deshacer con 'u'.
- id: export
  name: export
  synopsis: >-
    export VISUAL=vim | export EDITOR=nano | sudo update-alternatives --config
    editor
  description: >-
    Definir el editor predeterminado a nivel de sesión ($VISUAL, $EDITOR) o para
    todo el sistema (update-alternatives)
  category: Edición básica de archivos
  subtopicIds:
    - '103.8'
  example: >-
    export VISUAL=vim | export EDITOR=nano | sudo update-alternatives --config
    editor
  flags:
    - flag: $VISUAL
      description: >-
        🎯 Máxima Prioridad: Variable pensada para terminales de pantalla
        completa. Si está definida, los programas interactivos (crontab, visudo,
        git) la usan ANTES que $EDITOR.
    - flag: $EDITOR
      description: >-
        🎯 Estándar POSIX: Variable histórica para editores de texto. Se utiliza
        si $VISUAL no está definida o en utilidades en línea de comandos.
    - flag: update-alternatives
      description: >-
        🎯 Configuración Global del Sistema: Comando de Debian/Ubuntu para
        cambiar el enlace simbólico maestro /usr/bin/editor entre nano,
        vim.basic o vim.tiny.
    - flag: select-editor
      description: >-
        Comando interactivo para usuarios sin privilegios de root que guarda la
        preferencia personal en ~/.selected_editor.
- id: sudo
  name: sudo
  synopsis: sudo fdisk /dev/sdb | sudo fdisk -l /dev/sdb
  description: >-
    Gestionar particiones en discos MBR de forma interactiva con confirmación
    obligatoria al guardar
  category: Creación de particiones y sistemas de archivos
  subtopicIds:
    - '104.1'
    - '104.2'
    - '104.3'
    - '104.5'
  example: sudo fdisk /dev/sdb | sudo fdisk -l /dev/sdb
  flags:
    - flag: m
      description: Ayuda
    - flag: p
      description: Imprimir
    - flag: 'n'
      description: Nueva
    - flag: t
      description: Tipo
    - flag: d
      description: Borrar
    - flag: w
      description: Guardar
    - flag: q
      description: Salir
- id: df
  name: df
  synopsis: df [-h|-T|-i|-t <tipo>] [ruta]
  description: >-
    Disk Free: reportar el uso del espacio de almacenamiento y consumo de inodos
    de los sistemas montados
  category: Mantener la integridad de los sistemas de archivos
  subtopicIds:
    - '104.2'
  example: df [-h|-T|-i|-t <tipo>] [ruta]
  flags:
    - flag: df -h
      description: >-
        🎯 Clave de Examen: Muestra tamaños en potencias de 1024 con sufijos
        legibles (K, M, G, T).
    - flag: df -T
      description: >-
        🎯 Clave de Examen: Añade una columna mostrando el TIPO de sistema de
        archivos (ext4, xfs, btrfs, vfat).
    - flag: df -i
      description: >-
        🎯 Clave Absoluta de Examen: Muestra la información de INODOS (usados,
        libres y porcentaje) en lugar de bloques de disco.
    - flag: df -t <tipo>
      description: >-
        🎯 Filtra la salida para mostrar ÚNICAMENTE los sistemas de archivos del
        tipo especificado (ej: 'df -t ext4').
    - flag: df -x <tipo>
      description: >-
        Excluye de la salida los sistemas de archivos del tipo indicado (ej: 'df
        -x tmpfs').
- id: du
  name: du
  synopsis: du [-h|-s|-a|-d <n>|--max-depth=<n>] [ruta]
  description: >-
    Disk Usage: estimar el espacio real en disco ocupado por archivos y
    directorios
  category: Mantener la integridad de los sistemas de archivos
  subtopicIds:
    - '104.2'
  example: du [-h|-s|-a|-d <n>|--max-depth=<n>] [ruta]
  flags:
    - flag: du -h
      description: Muestra los tamaños en formato legible para humanos (K, M, G).
    - flag: du -s
      description: >-
        🎯 Clave de Examen: Muestra ÚNICAMENTE el total acumulado del argumento,
        sin desglosar subdirectorios.
    - flag: du -sh <dir>
      description: >-
        🎯 El combo estrella: resumen en formato humano (ej: 'du -sh /home'
        devuelve '45G /home').
    - flag: du -a
      description: >-
        Muestra el tamaño de absolutamente todos los archivos individuales, no
        solo de los directorios.
    - flag: '-d <N>'
      description: >-
        🎯 Clave de Examen: Limita la profundidad de exploración a N niveles de
        carpetas (ej: 'du -h -d 1 /var').
    - flag: du -c
      description: >-
        Añade una línea final con la suma total (Grand Total) de todos los
        elementos analizados.
- id: chmod
  name: chmod
  synopsis: chmod [-R] <modo_octal|modo_simbólico> <archivo_o_dir>
  description: 'Change Mode: modificar los bits de permiso discrecionales en el inodo'
  category: Administración de los permisos y los propietarios de los archivos
  subtopicIds:
    - '104.5'
  example: chmod [-R] <modo_octal|modo_simbólico> <archivo_o_dir>
  flags:
    - flag: chmod 755
      description: >-
        🎯 Modo Octal: fija los permisos exactos directos (ej: chmod 644
        documento.txt).
    - flag: Categorías u/g/o/a
      description: >-
        🎯 'u' = user (dueño); 'g' = group (grupo); 'o' = others (otros); 'a' =
        all (todos, u+g+o).
    - flag: Operadores +/-/=
      description: >-
        🎯 '+' añade el permiso; '-' retira el permiso; '=' fija exactamente el
        permiso sustituyendo el anterior.
    - flag: chmod -R
      description: >-
        🎯 Clave de Examen: Aplica la modificación de permisos de forma
        RECURSIVA a todo el directorio y sus contenidos.
    - flag: chmod a+X
      description: >-
        'X' (mayúscula) condicional: añade ejecución ÚNICAMENTE a directorios o
        a archivos que ya tenían 'x' previo.
- id: ln
  name: ln
  synopsis: ln <origen> <enlace_duro> | ln -s <origen> <enlace_simbólico>
  description: Crear enlaces duros o simbólicos hacia archivos y directorios existentes
  category: Crear y cambiar enlaces duros y simbólicos
  subtopicIds:
    - '104.6'
  example: ln <origen> <enlace_duro> | ln -s <origen> <enlace_simbólico>
  flags:
    - flag: ln origen destino
      description: >-
        🎯 Crea un enlace duro: ambos comparten el mismo número de inodo y el
        Link Count sube a 2.
    - flag: ln -s origen destino
      description: >-
        🎯 Clave de Examen: Crea un enlace simbólico con su propio inodo
        apuntando a la ruta de origen.
    - flag: ln -f
      description: >-
        Force: elimina el archivo destino si ya existía antes de crear el nuevo
        enlace.
    - flag: Ruta Absoluta
      description: >-
        Enlace simbólico absoluto: funcionará siempre sin importar desde dónde
        se invoque.
    - flag: Ruta Relativa
      description: >-
        Enlace simbólico relativo: depende de la ubicación del propio enlace (si
        se mueve de carpeta, se rompe).
- id: readlink
  name: readlink
  synopsis: readlink [-f] <enlace> | unlink <enlace> | cp -d <enlace> <destino>
  description: >-
    Resolver rutas de symlinks, eliminar entradas de directorio y copiar enlaces
    sin desreferenciar
  category: Crear y cambiar enlaces duros y simbólicos
  subtopicIds:
    - '104.6'
  example: readlink [-f] <enlace> | unlink <enlace> | cp -d <enlace> <destino>
  flags:
    - flag: readlink <enlace>
      description: >-
        🎯 Clave de Examen: Imprime en la consola el valor exacto del texto al
        que apunta el enlace simbólico.
    - flag: readlink -f <enlace>
      description: >-
        🎯 Resuelve recursivamente todos los symlinks intermedios devolviendo la
        ruta física final absoluta.
    - flag: unlink <enlace>
      description: >-
        Llama directamente a la llamada al sistema unlink() para eliminar la
        entrada de directorio.
    - flag: cp -d <enlace>
      description: >-
        🎯 Clave de Examen: Copia el enlace simbólico en sí mismo en lugar del
        archivo original al que apunta.
    - flag: cp -a
      description: >-
        Modo archivo completo: incluye '-d' para preservar enlaces simbólicos
        sin expandirlos.
- id: locate
  name: locate
  synopsis: locate [-i|-b|-c|-r] <patrón>
  description: >-
    Consultar la base de datos indexada local para localizar nombres de archivo
    al instante
  category: Encontrar archivos de sistema y ubicar archivos en el lugar correspondiente
  subtopicIds:
    - '104.7'
  example: locate [-i|-b|-c|-r] <patrón>
  flags:
    - flag: locate <patrón>
      description: >-
        Busca el patrón en cualquier parte de la ruta completa dentro de la base
        de datos indexada.
    - flag: '-i, --ignore-case'
      description: 🎯 Ignora mayúsculas y minúsculas en la búsqueda.
    - flag: '-b, --basename'
      description: >-
        🎯 Clave de Examen: Busca coincidencias ÚNICAMENTE en el nombre final
        del archivo, ignorando carpetas padre.
    - flag: '-c, --count'
      description: 🎯 Muestra únicamente el número total de archivos encontrados.
    - flag: '-e, --existing'
      description: >-
        Comprueba si el archivo existe realmente en disco antes de imprimirlo
        (omite archivos borrados).
    - flag: updatedb previo
      description: 🎯 No ve archivos creados después de la última ejecución de updatedb.
- id: which
  name: which
  synopsis: which <comando> | whereis [-b|-m|-s] <comando>
  description: Localizar rutas de ejecutables en PATH o encontrar código fuente y manuales
  category: Encontrar archivos de sistema y ubicar archivos en el lugar correspondiente
  subtopicIds:
    - '104.7'
  example: which <comando> | whereis [-b|-m|-s] <comando>
  flags:
    - flag: which <cmd>
      description: >-
        🎯 Clave de Examen: Busca ÚNICAMENTE en las carpetas de la variable
        $PATH y devuelve el primer ejecutable.
    - flag: which -a <cmd>
      description: Muestra todas las coincidencias en $PATH, no solo la primera.
    - flag: whereis <cmd>
      description: >-
        🎯 Busca en un conjunto fijo de rutas estándar del sistema binarios,
        manuales y fuentes.
    - flag: whereis -b
      description: >-
        🎯 Clave de Examen: Muestra ÚNICAMENTE las rutas de archivos binarios
        ejecutables.
    - flag: whereis -m
      description: >-
        🎯 Clave de Examen: Muestra ÚNICAMENTE las rutas de páginas del manual
        man.
    - flag: whereis -s
      description: Muestra únicamente el código fuente del comando si está presente.
- id: alias
  name: alias
  synopsis: alias nombre='comando' | unalias nombre | function mi_func() { ...; }
  description: >-
    Ahorrar pulsaciones creando atajos y definir funciones reutilizables con
    parámetros dentro del shell
  category: Personalizar y usar el entorno de shell
  subtopicIds:
    - '105.1'
  example: alias nombre='comando' | unalias nombre | function mi_func() { ...; }
  flags:
    - flag: alias
      description: Listar Alias
    - flag: alias n='cmd'
      description: Definir Alias
    - flag: unalias <nombre>
      description: Eliminar Alias
    - flag: unalias -a
      description: Eliminar Todos
    - flag: function f() {}
      description: Función de Shell
- id: source
  name: source
  synopsis: source archivo.sh | . archivo.sh
  description: >-
    Leer y ejecutar un archivo de comandos dentro del proceso actual de shell
    sin lanzar un subshell
  category: Personalizar y usar el entorno de shell
  subtopicIds:
    - '105.1'
  example: source archivo.sh | . archivo.sh
  flags:
    - flag: source <archivo>
      description: Comando source
    - flag: . <archivo>
      description: Atajo Punto (.)
    - flag: ./archivo.sh
      description: Ejecución Normal
- id: case
  name: case
  synopsis: case "$1" in start) ... ;; stop) ... ;; *) ... ;; esac
  description: Selección Múltiple con case ... in ... esac
  category: Personalizar y escribir scripts sencillos
  subtopicIds:
    - '105.2'
  example: case "$1" in start) ... ;; stop) ... ;; *) ... ;; esac
  flags:
    - flag: '-'
      description: Termina la cláusula actual y sale del bloque case.
