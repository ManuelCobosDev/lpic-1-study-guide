        🎯 La Navaja Suiza: Imprime ÚNICAMENTE el trozo de texto coincidente con
        la regex en lugar de la línea entera (ideal para extraer IPs/tokens).
- id: grep-rn-serverroot-etc-apache2-grep-b-1-a-2-fatal-var-log-app-log
  name: >-
    grep -rn 'ServerRoot' /etc/apache2/ | grep -B 1 -A 2 'FATAL'
    /var/log/app.log
  synopsis: >-
    grep -rn -C 1 'ServerRoot' /etc/apache2/ 2>/dev/null || grep -B 1 -A 1
    '127.0.0.1' /etc/hosts
  description: >-
    Rastrear directorios (-r) y extraer líneas de contexto previo (Before),
    posterior (After) o combinado (Context)
  category: Realizar búsquedas en archivos de texto usando expresiones regulares
  subtopicIds:
    - '103.7'
  example: >-
    grep -rn -C 1 'ServerRoot' /etc/apache2/ 2>/dev/null || grep -B 1 -A 1
    '127.0.0.1' /etc/hosts
  flags:
    - flag: '-r, --recursive'
      description: >-
        🎯 Clave de Examen: Busca de forma recursiva en todos los subdirectorios
        y ficheros del directorio indicado.
    - flag: '-R, --dereference-recursive'
      description: >-
        Búsqueda recursiva que además sigue y desreferencia todos los enlaces
        simbólicos (symlinks).
    - flag: '-'
      description: >-
        🎯 Imprime N líneas de contexto POSTERIORES (After) a la línea
        coincidente (para ver el mensaje de error).
    - flag: '-'
      description: >-
        🎯 Imprime N líneas de contexto ANTERIORES (Before) a la línea
        coincidente (para ver el comando causante).
    - flag: '-'
      description: >-
        🎯 Imprime N líneas de contexto tanto anteriores como posteriores
        simultáneamente (Before + After).
- id: less-var-log-syslog-dentro-de-less-usar-o
  name: less /var/log/syslog (dentro de less usar '/' o '?')
  synopsis: "# Al abrir un log masivo con 'less /var/log/syslog':\r\n/kernel.*error\r\n# Salta instantáneamente a la primera coincidencia hacia adelante."
  description: >-
    Ejecutar búsquedas interactivas con soporte nativo de expresiones regulares
    en el visor less
  category: Realizar búsquedas en archivos de texto usando expresiones regulares
  subtopicIds:
    - '103.7'
  example: "# Al abrir un log masivo con 'less /var/log/syslog':\r\n/kernel.*error\r\n# Salta instantáneamente a la primera coincidencia hacia adelante."
  flags:
    - flag: '-'
      description: >-
        🎯 Clave de Examen: Busca hacia ADELANTE (hacia el final del fichero) el
        patrón de expresión regular indicado.
    - flag: '-'
      description: >-
        🎯 Clave de Examen: Busca hacia ATRÁS (hacia el inicio del fichero) el
        patrón de expresión regular indicado.
    - flag: 'n'
      description: >-
        🎯 Siguiente coincidencia: salta al siguiente resultado en la misma
        dirección de la búsqueda.
    - flag: 'N'
      description: >-
        🎯 Coincidencia anterior: salta al resultado anterior en dirección
        opuesta.
    - flag: q
      description: 🎯 Salir inmediatamente de less regresando al prompt de la shell.
- id: i-i-a-a-o-o-desde-modo-normal
  name: i | I | a | A | o | O (desde Modo Normal)
  synopsis: "# En modo normal pulsas 'o' y vi abre una línea en blanco debajo:\r\n-- INSERT --"
  description: >-
    Entrar en Modo Inserción para escribir texto en diferentes posiciones
    relativas al cursor
  category: Edición básica de archivos
  subtopicIds:
    - '103.8'
  example: "# En modo normal pulsas 'o' y vi abre una línea en blanco debajo:\r\n-- INSERT --"
  flags:
    - flag: i / I
      description: 🎯
    - flag: a / A
      description: 🎯
    - flag: o (Open below)
      description: >-
        🎯 Clave de Examen: Abre una nueva línea en blanco DEBAJO de la actual y
        entra en inserción.
    - flag: O (Open above)
      description: >-
        🎯 Clave de Examen: Abre una nueva línea en blanco ENCIMA de la actual y
        entra en inserción.
- id: w-q-q-wq-x-zz-zq
  name: ':w | :q | :q! | :wq | :x | ZZ | ZQ'
