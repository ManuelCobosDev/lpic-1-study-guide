- id: tee
  name: tee
  synopsis: tee [OPCIÓN]... [ARCHIVO]...
  description: >-
    Copia la entrada estándar a cada ARCHIVO indicado y también a la salida
    estándar simultáneamente.
  category: Redirecciones y Tuberías
  subtopicIds:
    - '103.4'
  example: ls -l /etc | tee lista.txt | wc -l
  flags:
    - flag: '-a, --append'
      description: Añade a los archivos dados sin sobrescribir su contenido anterior.
    - flag: '-i, --ignore-interrupts'
      description: Ignora las señales de interrupción (SIGINT).
- id: xargs
  name: xargs
  synopsis: xargs [OPCIÓN]... [COMANDO [ARGUMENTO-INICIAL]...]
  description: >-
    Construye y ejecuta líneas de comando leyendo elementos desde la entrada
    estándar delimitados por espacios o nulos.
  category: Procesamiento y Argumentos
  subtopicIds:
    - '103.4'
  example: find . -name "*.log" -print0 | xargs -0 rm -f
  flags:
    - flag: '-0, --null'
      description: >-
        Los elementos de entrada se terminan con un byte nulo en lugar de
        espacios en blanco.
    - flag: '-I REEMPLAZO'
      description: >-
        Sustituye las apariciones de REEMPLAZO en los argumentos iniciales por
        nombres de stdin.
    - flag: '-n NÚMERO'
      description: Utiliza a lo sumo NÚMERO argumentos por cada invocación del comando.
- id: cat
  name: cat
  synopsis: cat [OPCIÓN]... [ARCHIVO]...
  description: >-
    Concatena el contenido de los ARCHIVOS indicados y los imprime en la salida
    estándar.
  category: Visualización y Concatenación
  subtopicIds:
    - '103.4'
    - '103.3'
  example: cat /etc/os-release
  flags:
    - flag: '-n, --number'
      description: Enumera todas las líneas de la salida comenzando en 1.
    - flag: '-b, --number-nonblank'
      description: Enumera solo las líneas de salida no vacías.
    - flag: '-E, --show-ends'
      description: Muestra un símbolo $ al final de cada línea.
- id: head
  name: head
  synopsis: head [OPCIÓN]... [ARCHIVO]...
  description: Imprime las primeras 10 líneas de cada ARCHIVO en la salida estándar.
  category: Filtros de Texto
  subtopicIds:
    - '103.4'
    - '103.2'
  example: head -n 5 /etc/passwd
  flags:
    - flag: '-n, --lines=K'
      description: Imprime las primeras K líneas en lugar de las 10 habituales.
    - flag: '-c, --bytes=K'
      description: Imprime los primeros K bytes de cada archivo.
- id: tail
  name: tail
  synopsis: tail [OPCIÓN]... [ARCHIVO]...
  description: Imprime las últimas 10 líneas de cada ARCHIVO en la salida estándar.
  category: Filtros de Texto
  subtopicIds:
    - '103.4'
    - '103.2'
  example: tail -f /var/log/syslog
  flags:
    - flag: '-f, --follow'
      description: Sigue la adición de datos al archivo a medida que crece en tiempo real.
    - flag: '-n, --lines=K'
      description: Muestra las últimas K líneas del archivo.
- id: wc
  name: wc
  synopsis: wc [OPCIÓN]... [ARCHIVO]...
  description: >-
    Imprime el número de saltos de línea, palabras y bytes para cada archivo
    especificado.
  category: Conteo y Estadísticas
  subtopicIds:
    - '103.4'
    - '103.2'
  example: wc -l < /etc/passwd
  flags:
    - flag: '-l, --lines'
      description: Imprime únicamente el conteo total de líneas.
    - flag: '-w, --words'
      description: Imprime el conteo de palabras.
    - flag: '-c, --bytes'
      description: Imprime el conteo total de bytes.
- id: grep
  name: grep
  synopsis: grep [OPCIÓN]... PATRÓN [ARCHIVO]...
  description: >-
    Busca el PATRÓN indicado en cada ARCHIVO o entrada estándar e imprime las
    líneas coincidentes.
  category: Búsqueda y Filtros
  subtopicIds:
    - '103.4'
    - '103.7'
  example: grep -i "root" /etc/passwd
  flags:
    - flag: '-i, --ignore-case'
      description: Ignora diferencias entre mayúsculas y minúsculas.
    - flag: '-v, --invert-match'
      description: Invierte el sentido del filtro para seleccionar líneas no coincidentes.
    - flag: '-n, --line-number'
      description: Muestra el número de línea de cada coincidencia.
- id: sort
  name: sort
  synopsis: sort [OPCIÓN]... [ARCHIVO]...
  description: >-
    Ordena las líneas de todos los ARCHIVOS indicados en orden alfabético o
    numérico.
  category: Ordenación y Filtros
  subtopicIds:
    - '103.4'
    - '103.2'
  example: 'sort -k 3 -n -t: /etc/passwd'
  flags:
    - flag: '-n, --numeric-sort'
      description: Compara según el valor numérico de la cadena.
    - flag: '-r, --reverse'
      description: Invierte el orden de la comparación.
    - flag: '-t, --field-separator=SEP'
      description: Utiliza SEP en lugar de espacios como delimitador de campos.
- id: uniq
  name: uniq
  synopsis: uniq [OPCIÓN]... [ENTRADA [SALIDA]]
  description: >-
    Filtra las líneas repetidas y consecutivas de la entrada, escribiendo en la
    salida.
  category: Filtros de Duplicados
  subtopicIds:
    - '103.4'
    - '103.2'
  example: sort lista.txt | uniq -c
  flags:
    - flag: '-c, --count'
      description: Prefija las líneas con el número de apariciones detectadas.
    - flag: '-d, --repeated'
      description: Imprime solo las líneas duplicadas.
    - flag: '-u, --unique'
      description: Imprime solo las líneas únicas que no tienen duplicados.
- id: tr
  name: tr
  synopsis: tr [OPCIÓN]... CONJUNTO1 [CONJUNTO2]
  description: >-
    Traduce, comprime y/o elimina caracteres leídos de la entrada estándar,
    escribiendo en la salida estándar.
  category: Transformación de Caracteres
  subtopicIds:
    - '103.4'
    - '103.2'
  example: cat archivo.txt | tr "a-z" "A-Z"
  flags:
    - flag: '-d, --delete'
      description: Elimina los caracteres indicados en CONJUNTO1.
    - flag: '-s, --squeeze-repeats'
      description: Reemplaza secuencias repetidas de un carácter por una sola aparición.
- id: sed
  name: sed
  synopsis: sed [OPCIÓN]... {script} [archivo-entrada]...
  description: >-
    Editor de flujo de texto programable para filtrar y transformar texto de
    entrada.
  category: Edición de Flujos de Texto
  subtopicIds:
    - '103.4'
    - '103.2'
  example: sed "s/antiguo/nuevo/g" archivo.txt
  flags:
    - flag: '-i, --in-place'
      description: Edita los archivos directamente en disco sin volcarlos a la salida.
    - flag: '-e script'
      description: Añade el script a los comandos que se van a ejecutar.
- id: cut
  name: cut
  synopsis: cut OPCIÓN... [ARCHIVO]...
  description: >-
    Elimina secciones seleccionadas de cada línea de los archivos y las envía a
    stdout.
  category: Extracción de Campos
  subtopicIds:
    - '103.4'
    - '103.2'
  example: 'cut -d: -f1,7 /etc/passwd'
  flags:
    - flag: '-d, --delimiter=DELIM'
      description: Usa DELIM en lugar de tabulador para delimitar campos.
    - flag: '-f, --fields=LISTA'
      description: Selecciona solo los campos indicados en LISTA.
- id: paste
  name: paste
  synopsis: paste [OPCIÓN]... [ARCHIVO]...
  description: >-
    Escribe líneas consistentes en las líneas secuenciales correspondientes de
    cada ARCHIVO, separadas por tabuladores.
  category: Unión de Flujos
  subtopicIds:
    - '103.4'
    - '103.2'
  example: paste -d, nombres.txt apellidos.txt
  flags:
    - flag: '-d, --delimiters=LISTA'
      description: Reutiliza los caracteres de LISTA como delimitadores.
    - flag: '-s, --serial'
      description: Pega un archivo cada vez en lugar de hacerlo en paralelo.
- id: split
  name: split
  synopsis: split [OPCIÓN]... [ARCHIVO [PREFIJO]]
  description: Divide un ARCHIVO en piezas de tamaño fijo con un prefijo designado.
  category: División de Archivos
  subtopicIds:
    - '103.4'
    - '103.2'
  example: split -b 100M archivo_grande.iso parte_
  flags:
    - flag: '-b, --bytes=TAMAÑO'
      description: Pone TAMAÑO bytes por cada archivo de salida generado.
    - flag: '-l, --lines=NÚMERO'
      description: Pone NÚMERO líneas por cada archivo de salida.
- id: od
  name: od
  synopsis: od [OPCIÓN]... [ARCHIVO]...
  description: >-
    Vuelca los archivos en formatos octal, hexadecimal o con caracteres
    legibles.
  category: Volcado Octal y Binario
  subtopicIds:
    - '103.4'
    - '103.2'
  example: od -c archivo.bin
  flags:
    - flag: '-c'
      description: Muestra caracteres ASCII legibles o secuencias de escape.
    - flag: '-t, --format=TIPO'
      description: Selecciona el formato de volcado de salida (ej. x1, o2).
- id: pr
  name: pr
  synopsis: pr [OPCIÓN]... [ARCHIVO]...
  description: >-
    Pagina o formatea archivos de texto plano para su impresión o visualización
    en columnas.
  category: Paginación y Formato
  subtopicIds:
    - '103.4'
    - '103.2'
  example: pr -2 -h "Reporte de Usuarios" usuarios.txt
  flags:
    - flag: '-COLUMN, --columns=COLUMN'
      description: Produce una salida formateada en tantas columnas como se indique.
    - flag: '-h CABECERA'
      description: >-
        Utiliza CABECERA en lugar del nombre del archivo en la cabecera de
        página.
- id: tac
  name: tac
  synopsis: tac [OPCIÓN]... [ARCHIVO]...
  description: >-
    Concatena e imprime los archivos en orden inverso línea por línea (última
    línea primero).
  category: Inversión de Líneas
  subtopicIds:
    - '103.4'
    - '103.3'
  example: tac /var/log/auth.log | head -n 20
  flags:
    - flag: '-b, --before'
      description: Coloca el separador antes de la cadena en lugar de después.
    - flag: '-r, --regex'
      description: Interpreta el separador como una expresión regular.
- id: find
  name: find
  synopsis: find [RUTA...] [EXPRESIÓN]
  description: >-
    Busca archivos en una jerarquía de directorios evaluando la expresión dada
    de izquierda a derecha.
  category: Búsqueda de Archivos
  subtopicIds:
    - '103.4'
    - '104.7'
  example: find /tmp -type f -name "*.tmp" -print0 | xargs -0 rm -f
  flags:
    - flag: '-print0'
      description: >-
        Imprime el nombre completo del archivo en la salida estándar seguido de
        un byte nulo.
    - flag: '-name PATRÓN'
      description: Coincide con el nombre del archivo ignorando directorios previos.
    - flag: '-type TIPO'
      description: >-
        Filtra por tipo de archivo: f para regular, d para directorio, l para
        enlace.
- id: echo
  name: echo
  synopsis: echo [OPCIÓN-CORTA]... [CADENA]...
  description: Muestra las CADENAS de texto en la salida estándar separadas por espacios.
  category: Salida y Generación de Texto
  subtopicIds:
    - '103.4'
    - '103.1'
  example: echo "Configuración aplicada" >> /tmp/log.txt
  flags:
    - flag: '-n'
      description: No imprime el salto de línea final.
    - flag: '-e'
      description: Habilita la interpretación de secuencias de escape con barra invertida.
- id: set
  name: set
  synopsis: set [--opciones] [argumento...]
  description: Configura o desactiva atributos de shell y parámetros posicionales en Bash.
  category: Configuración de Shell (noclobber)
  subtopicIds:
    - '103.4'
    - '105.1'
  example: set -o noclobber
  flags:
    - flag: '-o noclobber'
      description: >-
        Evita la sobrescritura accidental de archivos existentes mediante el
        operador >.
    - flag: +o noclobber
      description: Desactiva la protección noclobber permitiendo sobrescribir con >.
- id: zcat
  name: zcat
  synopsis: zcat [ARCHIVO]...
  description: >-
    Descomprime y muestra en la salida estándar el contenido de archivos
    comprimidos con gzip.
  category: Archivos Comprimidos
  subtopicIds:
    - '103.4'
    - '103.2'
  example: zcat /var/log/syslog.2.gz | grep "kernel"
  flags:
    - flag: '-f, --force'
      description: Fuerza la descompresión incluso si el archivo no termina en .gz.
- id: bzcat
  name: bzcat
  synopsis: bzcat [ARCHIVO]...
  description: >-
    Descomprime archivos comprimidos con bzip2 directamente hacia la salida
    estándar.
  category: Archivos Comprimidos
  subtopicIds:
    - '103.4'
    - '103.2'
  example: bzcat archivo.tar.bz2 | tar -tvf -
  flags: []
- id: xzcat
  name: xzcat
  synopsis: xzcat [ARCHIVO]...
  description: >-
    Descomprime archivos comprimidos con xz o lzma volcando el resultado en la
    salida estándar.
  category: Archivos Comprimidos
  subtopicIds:
    - '103.4'
    - '103.2'
  example: xzcat kernel-config.xz
  flags: []
- id: date
  name: date
  synopsis: date [OPCIÓN]... [+FORMATO]
  description: Muestra o ajusta la fecha y hora del sistema en el formato especificado.
  category: Información de Sistema
  subtopicIds:
    - '103.4'
    - '108.1'
  example: tar -czf backup-$(date +%Y%m%d).tar.gz /home
  flags:
    - flag: '-u, --utc'
      description: Imprime la hora coordinada universal (UTC).
    - flag: +FORMATO
      description: Controla el formato de salida mediante directivas (ej. %Y-%m-%d).
- id: uname
  name: uname
  synopsis: uname [OPCIÓN]...
  description: >-
    Imprime información sobre la arquitectura del equipo y el núcleo del sistema
    operativo.
  category: Información de Kernel
  subtopicIds:
    - '103.4'
    - '101.1'
  example: uname -r
  flags:
    - flag: '-a, --all'
      description: >-
        Imprime toda la información disponible en el siguiente orden: kernel,
        hostname, versión y arquitectura.
    - flag: '-r, --kernel-release'
      description: Imprime el número de versión y compilación del núcleo Linux.
    - flag: '-m, --machine'
      description: Imprime el tipo de arquitectura de hardware de la máquina (ej. x86_64).
