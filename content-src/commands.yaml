- id: dpkg-instalacion-eliminacion-y-ciclo-de-vida-de-paquetes
  name: 'dpkg: Instalación, Eliminación y Ciclo de Vida de Paquetes'
  synopsis: dpkg [opciones_accion]
  description: >-
    Motor de bajo nivel en Debian: manipula ficheros .deb locales en disco. No
    accede a red ni resuelve dependencias automáticamente.
  category: Gestión de paquetes Debian
  subtopicIds:
    - '102.4'
  example: dpkg [opciones_accion]
  flags:
    - flag: '-i, --install'
      description: Desempaqueta y configura un archivo .deb local en el disco.
    - flag: '-r, --remove'
      description: >-
        🎯 Elimina binarios y librerías, pero CONSERVA los ficheros de
        configuración en /etc/ (estado rc).
    - flag: '-P, --purge'
      description: >-
        🎯 Eliminación total: borra binarios Y destruye toda la configuración en
        /etc/ (estado un).
    - flag: '--unpack'
      description: >-
        Extrae los ficheros en disco sin ejecutar los scripts de configuración
        debconf/postinst.
    - flag: '--configure'
      description: >-
        Configura un paquete previamente desempaquetado con --unpack ejecutando
        scripts postinst.
    - flag: '-C, --audit'
      description: >-
        Busca paquetes a medio instalar o con dependencias y configuraciones
        rotas en el sistema.
- id: dpkg-y-dpkg-query-inspeccion-de-paquetes-y-pertenencias
  name: 'dpkg y dpkg-query: Inspección de Paquetes y Pertenencias'
  synopsis: dpkg [-L | -l | -s | -c | -I]   |  dpkg-query -S
  description: >-
    Inspeccionar metadatos y ficheros en la base de datos local
    (/var/lib/dpkg/): averiguar qué instaló un paquete o qué paquete es dueño de
    un archivo existente en disco.
  category: Gestión de paquetes Debian
  subtopicIds:
    - '102.4'
  example: dpkg [-L | -l | -s | -c | -I]   |  dpkg-query -S
  flags:
    - flag: '-'
      description: >-
        🎯 Lista todos los archivos y directorios que el paquete ha instalado en
        el disco.
    - flag: '-'
      description: >-
        🎯 dpkg -S o dpkg-query -S: averigua qué paquete instalado proporcionó
        un archivo o ruta existente.
    - flag: '-l, --list [patrón]'
      description: >-
        Muestra tabla de paquetes con su código de estado (ii = instalado OK, rc
        = borrado con config).
    - flag: '-'
      description: >-
        Muestra estado detallado, dependencias y versión de un paquete ya
        presente en el sistema.
    - flag: '-'
      description: >-
        🎯 Lista los archivos contenidos dentro de un archivo .deb sin necesidad
        de instalarlo.
    - flag: '-'
      description: >-
        Muestra la ficha técnica de un paquete .deb almacenado en disco antes de
        instalarlo.
- id: apt-get-ciclo-de-vida-dependencias-y-actualizaciones
  name: 'apt-get: Ciclo de Vida, Dependencias y Actualizaciones'
  synopsis: apt-get
  description: >-
    Gestor de alto nivel para servidores y scripts: descarga por red, resuelve
    dependencias transitivas e invoca a dpkg automáticamente.
  category: Gestión de paquetes Debian
  subtopicIds:
    - '102.4'
  example: apt-get
  flags:
    - flag: update
      description: >-
        🎯 Sincroniza los catálogos locales en /var/lib/apt/lists/ desde
        sources.list. NO actualiza ningún software.
    - flag: '-'
      description: Descarga e instala el paquete y todas sus dependencias. -y responde
    - flag: upgrade
      description: >-
        Actualiza todos los paquetes instalados a su última versión SIN
        desinstalar jamás ningún paquete existente.
    - flag: dist-upgrade
      description: >-
        🎯 Resuelve dependencias complejas, teniendo permiso para INSTALAR
        nuevos paquetes o ELIMINAR paquetes obsoletos.
    - flag: '-'
      description: >-
        remove borra ejecutables; purge destruye también todos los ficheros de
        configuración en /etc/.
    - flag: install -f, --fix-broken
      description: >-
        🎯 Clave de Examen: Arregla dependencias rotas tras una instalación
        fallida con dpkg -i.
    - flag: clean / autoclean
      description: >-
        🎯 clean borra el 100% de .deb en /var/cache/apt/archives/; autoclean
        solo paquetes viejos ya no descargables.
- id: apt-cache-consultas-en-la-cache-de-repositorios
  name: 'apt-cache: Consultas en la Caché de Repositorios'
  synopsis: apt-cache  [paquete]
  description: >-
    Herramienta de SOLO LECTURA para explorar metadatos, descripciones,
    dependencias y prioridades. NO requiere privilegios de root (no usa sudo).
  category: Gestión de paquetes Debian
  subtopicIds:
    - '102.4'
  example: apt-cache  [paquete]
  flags:
    - flag: '-'
      description: >-
        🎯 Busca en los nombres y descripciones de todos los paquetes
        disponibles en los repositorios.
    - flag: '-'
      description: >-
        🎯 Muestra la ficha técnica completa del paquete: descripción,
        mantenedor, tamaño y dependencias.
    - flag: '-'
      description: >-
        Muestra la lista de paquetes o librerías de los cuales depende este
        paquete para funcionar.
    - flag: '-'
      description: >-
        Lista qué otros paquetes del repositorio necesitan a este paquete para
        funcionar.
    - flag: policy [paquete]
      description: >-
        🎯 Muestra la versión instalada, la versión candidata y las prioridades
        de repositorios (APT Pinning).
    - flag: pkgnames [prefijo]
      description: >-
        Lista rápida de los nombres de todos los paquetes disponibles en el
        sistema.
