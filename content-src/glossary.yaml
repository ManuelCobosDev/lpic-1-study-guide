- id: stdin
  term: stdin
  definition: >-
    Descriptor de archivo 0: flujo estándar de entrada a través del cual los
    procesos reciben datos (por defecto, teclado).
  related:
    - stdout
    - stderr
    - descriptor de archivo
  subtopicIds:
    - '103.4'
- id: stdout
  term: stdout
  definition: >-
    Descriptor de archivo 1: flujo estándar de salida por donde un proceso emite
    resultados exitosos de ejecución.
  related:
    - stdin
    - stderr
    - redirección
  subtopicIds:
    - '103.4'
- id: stderr
  term: stderr
  definition: >-
    Descriptor de archivo 2: flujo estándar de errores reservado para mensajes
    de diagnóstico y advertencias.
  related:
    - stdin
    - stdout
    - fusión de flujos
  subtopicIds:
    - '103.4'
- id: descriptor-de-archivo
  term: descriptor de archivo
  definition: >-
    Índice entero asignado por el kernel a una tabla de archivos abiertos por un
    proceso (0 stdin, 1 stdout, 2 stderr).
  related:
    - stdin
    - stdout
    - stderr
  subtopicIds:
    - '103.4'
- id: tuberia
  term: tubería
  definition: >-
    Mecanismo de comunicación interproceso representado por | que conecta el
    stdout de un comando con el stdin del siguiente.
  related:
    - filtro
    - tee
    - flujo estándar
  subtopicIds:
    - '103.4'
- id: redireccion
  term: redirección
  definition: >-
    Acción de desviar los flujos de entrada o salida de un comando hacia un
    archivo, dispositivo o descriptor distinto.
  related:
    - stdout
    - stderr
    - noclobber
  subtopicIds:
    - '103.4'
- id: dev-null
  term: /dev/null
  definition: >-
    Dispositivo especial de caracteres en Linux que descarta todos los datos
    escritos en él y devuelve fin de archivo al leerlo.
  related:
    - redirección
    - stderr
  subtopicIds:
    - '103.4'
- id: noclobber
  term: noclobber
  definition: >-
    Opción de shell (set -o noclobber) que impide sobrescribir archivos
    existentes con el operador de redirección >.
  related:
    - redirección
    - truncamiento
  subtopicIds:
    - '103.4'
- id: here-document
  term: Here Document
  definition: >-
    Sintaxis de redirección (<<) que permite suministrar un bloque de texto
    multilínea a un comando hasta encontrar un delimitador.
  related:
    - here-string
    - stdin
  subtopicIds:
    - '103.4'
- id: here-string
  term: Here String
  definition: >-
    Sintaxis de redirección (<<<) soportada por Bash que pasa una cadena literal
    directamente a la entrada estándar.
  related:
    - here-document
    - stdin
  subtopicIds:
    - '103.4'
- id: bifurcacion-tee
  term: bifurcación (tee)
  definition: >-
    Capacidad de clonar un flujo de datos para enviarlo simultáneamente a la
    salida estándar y a uno o más ficheros.
  related:
    - tuberia
    - stdout
  subtopicIds:
    - '103.4'
- id: sustitucion-de-comandos
  term: sustitución de comandos
  definition: >-
    Técnica de shell mediante $(comando) o `comando` que ejecuta una instrucción
    e inserta su salida como texto en la línea de comandos.
  related:
    - xargs
    - bash
  subtopicIds:
    - '103.4'
- id: xargs-termino
  term: xargs
  definition: >-
    Utilidad que convierte líneas recibidas por la entrada estándar en listas de
    argumentos para invocar otros comandos.
  related:
    - tuberia
    - caracter-nulo
  subtopicIds:
    - '103.4'
- id: caracter-nulo
  term: carácter nulo (-print0)
  definition: >-
    Delimitador de byte cero (\0) empleado para separar nombres de archivos de
    forma segura frente a espacios o saltos de línea.
  related:
    - find
    - xargs
  subtopicIds:
    - '103.4'
- id: filtro
  term: filtro
  definition: >-
    Programa que recibe un flujo de datos por stdin, realiza un procesamiento o
    transformación y emite el resultado por stdout.
  related:
    - tuberia
    - cat
    - grep
    - sort
  subtopicIds:
    - '103.4'
- id: flujo-estandar
  term: flujo estándar
  definition: >-
    Canal de comunicación predeterminado provisto por el entorno del sistema
    operativo al iniciar cualquier programa.
  related:
    - stdin
    - stdout
    - stderr
  subtopicIds:
    - '103.4'
- id: truncamiento
  term: truncamiento
  definition: >-
    Operación que vacía por completo el contenido de un fichero existente
    dejándolo en 0 bytes antes de escribir.
  related:
    - redireccion
    - noclobber
  subtopicIds:
    - '103.4'
- id: concatenacion
  term: concatenación
  definition: >-
    Operación que añade nuevos datos al final de un fichero (operador >>)
    respetando el contenido preexistente.
  related:
    - redireccion
    - truncamiento
  subtopicIds:
    - '103.4'
- id: fusion-de-flujos
  term: fusión de flujos (2>&1)
  definition: >-
    Sintaxis que redirige un descriptor hacia el destino de otro (ej. stderr
    hacia stdout o viceversa).
  related:
    - stderr
    - stdout
    - redireccion
  subtopicIds:
    - '103.4'
- id: buffer-de-es
  term: buffer de E/S
  definition: >-
    Zona de memoria intermedia utilizada por el sistema operativo para optimizar
    transferencias de datos entre procesos y dispositivos.
  related:
    - flujo-estandar
  subtopicIds:
    - '103.4'
- id: pipeline
  term: pipeline
  definition: >-
    Secuencia lineal de comandos encadenados a través de múltiples tuberías
    consecutivas.
  related:
    - tuberia
    - filtro
  subtopicIds:
    - '103.4'
- id: escape-de-caracteres
  term: escape de caracteres
  definition: >-
    Uso del carácter barra invertida \ para impedir que la shell interprete
    caracteres especiales como operadores.
  related:
    - bash
    - redireccion
  subtopicIds:
    - '103.4'
