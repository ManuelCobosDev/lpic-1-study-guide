topicId: '103'
questions:
  - id: q-103-28
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál es el valor máximo de niceness que un usuario regular sin
      privilegios de root puede asignar a un proceso con el comando nice al
      ejecutarlo?
    options:
      - id: a
        text: '9'
      - id: b
        text: '15'
      - id: c
        text: '19'
      - id: d
        text: '49'
      - id: e
        text: '99'
    correct:
      - c
    explanation: >-
      Los valores de niceness en Linux van desde -20 (máxima prioridad de
      planificación) hasta 19 (mínima prioridad de planificación). Los usuarios
      normales solo pueden disminuir la prioridad de sus procesos asignando
      valores positivos hasta el máximo de 19 ( man 1 nice ).
    difficulty: medium
    placeholder: false
  - id: q-103-30
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      ¿Cuáles de los siguientes son operadores válidos de redirección de flujos
      en Bash? (Selecciona DOS respuestas)
    options:
      - id: a
        text: '#>'
      - id: b
        text: '%>'
      - id: c
        text: '>>>'
      - id: d
        text: 2>&1
    correct:
      - a
      - d
    explanation: >-
      En Bash ( man 1 bash ), es el operador estándar de redirección de entrada,
      y 2>&1 redirige el descriptor de archivo 2 ( standard error ) al mismo
      destino al que apunta el descriptor 1 ( standard output ). El operador >>>
      no existe en Bash (existe para here-strings ).
    difficulty: medium
    placeholder: false
  - id: q-103-31
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos del editor vi elimina dos líneas: la
      línea actual y la siguiente?
    options:
      - id: a
        text: d2
      - id: b
        text: 2d
      - id: c
        text: 2dd
      - id: d
        text: dd2
      - id: e
        text: de12
    correct:
      - c
    explanation: >-
      En el modonormal de vi / vim , el comando para eliminar una línea completa
      es dd . Al anteponer el multiplicador numérico 2 ( 2dd ), la operación se
      aplica a 2 líneas consecutivas empezando por la línea actual (también es
      válido d2d , pero de las opciones dadas solo 2dd es correcta).
    difficulty: medium
    placeholder: false
  - id: q-103-32
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      Desde una shell Bash, ¿cuáles de los siguientes comandos ejecutan
      directamente un nuevo proceso en segundo plano? (Selecciona DOS
      respuestas)
    options:
      - id: a
        text: source /usr/local/bin/runme.sh
      - id: b
        text: /usr/local/bin/runme.sh
      - id: c
        text: /bin/bash /usr/local/bin/runme.sh
      - id: d
        text: . /usr/local/bin/runme.sh
      - id: e
        text: run /usr/local/bin/runme.sh
    correct:
      - a
      - b
    explanation: >-
      En Bash, el comando interno . (punto) y su sinónimo source leen y ejecutan
      los comandos del archivo especificado dentro del entorno de la shell
      actual sin crear un proceso hijo ( subshell ).
    difficulty: medium
    placeholder: false
  - id: q-103-33
    topicId: '103'
    subtopicId: '103.4'
    type: fill
    prompt: >-
      ¿Qué programa ejecuta periódicamente un comando a intervalos especificados
      y actualiza su salida en pantalla completa?
    correct:
      - watch
    acceptedAnswers:
      - watch
    explanation: >-
      El comando watch ( man 1 watch ) ejecuta un programa periódicamente (cada
      2 segundos por defecto) mostrando su salida a pantalla completa para poder
      observar sus cambios a lo largo del tiempo.
    difficulty: medium
    placeholder: false
  - id: q-103-34
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      Inmediatamente después de borrar 3 líneas en el editor vi y mover el
      cursor, ¿qué comando pega el texto borrado?
    options:
      - id: a
        text: i (lowercase)
      - id: b
        text: p (lowercase)
      - id: c
        text: P (uppercase)
      - id: d
        text: U (uppercase)
      - id: e
        text: u (lowercase)
    correct:
      - b
    explanation: >-
      En vi , eliminar líneas las guarda en el registro (búfer) por defecto. El
      comando p (minúscula, put ) pega el contenido de líneas completas justo
      debajo de la línea actual, mientras que P (mayúscula) lo pega por encima.
    difficulty: medium
    placeholder: false
  - id: q-103-35
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos elimina todos los retornos de carro
      (CR-LF de Windows) convirtiéndolos a saltos de línea de Linux?
    options:
      - id: a
        text: tr -d '\r' < userlist.txt > newlist.txt
      - id: b
        text: tr -c '\n\r' '' < userlist.txt > newlist.txt
      - id: c
        text: tr '\r\n' '' < userlist.txt > newlist.txt
      - id: d
        text: tr '\r' '\n' < userlist.txt > newlist.txt
      - id: e
        text: tr -s '/^M/^J/' userlist.txt newlist.txt
    correct:
      - a
    explanation: >-
      Los saltos de línea DOS/Windows se componen de Retorno de Carro ( \r , CR)
      seguido de Salto de Línea ( \n , LF), mientras que Linux usa únicamente \n
      (LF). El comando tr lee exclusivamente de la entrada estándar ( ), elimina
      ( -d ) los caracteres \r y redirige la salida a newlist.txt .
    difficulty: medium
    placeholder: false
  - id: q-103-36
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Qué comando debe introducirse en el editor vi para guardar los cambios en
      el archivo actual antes de salir?
    options:
      - id: a
        text: '%s filea.txt'
      - id: b
        text: '%w filea.txt'
      - id: c
        text: ':save filea.txt'
      - id: d
        text: ':w filea.txt'
      - id: e
        text: ':s filea.txt'
    correct:
      - d
    explanation: >-
      En el modo de línea de comandos de vi , :w ( write ) guarda el contenido
      del búfer actual con el nombre de archivo especificado.
    difficulty: medium
    placeholder: false
  - id: q-103-37
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos muestra la salida del comando foo en
      pantalla y a la vez la escribe en el archivo /tmp/foodata?
    options:
      - id: a
        text: foo
      - id: b
        text: less /tmp/foodata
      - id: c
        text: foo
      - id: d
        text: cp /tmp/foodata
      - id: e
        text: foo > /tmp/foodata
      - id: f
        text: foo
      - id: g
        text: tee /tmp/foodata
      - id: h
        text: foo > stdout >> /tmp/foodata
    correct:
      - g
    explanation: >-
      El comando tee ( man 1 tee ) lee de la entrada estándar y escribe
      simultáneamente tanto en la salida estándar (pantalla) como en uno o más
      archivos especificados.
    difficulty: medium
    placeholder: false
  - id: q-103-38
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Qué salida se mostrará cuando el usuario fred ejecute el comando en la
      terminal?
    options:
      - id: a
        text: fred fred
      - id: b
        text: red /home/fred/
      - id: c
        text: '''fred $USER'''
      - id: d
        text: fred $USER
      - id: e
        text: '''fred fred'''
    correct:
      - d
    explanation: >-
      El comando evalúa la instrucción con comillas simples echo 'fred $USER'.
      En Bash, las comillas simples impiden la interpolación de variables y
      caracteres especiales, por lo que la cadena se muestra literalmente: fred
      $USER.
    difficulty: medium
    placeholder: false
  - id: q-103-39
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos muestra la ruta completa hacia el archivo
      ejecutable de un comando en el PATH?
    options:
      - id: a
        text: lsattr foo
      - id: b
        text: apropos foo
      - id: c
        text: locate foo
      - id: d
        text: whatis foo
      - id: e
        text: which foo
    correct:
      - e
    explanation: >-
      El comando which ( man 1 which ) busca en los directorios definidos en la
      variable de entorno $PATH y devuelve la ruta completa del ejecutable que
      se invocaría al escribir dicho comando.
    difficulty: medium
    placeholder: false
  - id: q-103-41
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      ¿Cuál de los siguientes comandos se utiliza para determinar cuánto tiempo
      lleva encendido y en funcionamiento el sistema?
    options:
      - id: a
        text: uptime
      - id: b
        text: up
      - id: c
        text: time --up
      - id: d
        text: uname -u
      - id: e
        text: top
    correct:
      - a
      - e
    explanation: >-
      El comando uptime muestra directamente el tiempo que lleva encendido el
      sistema. Asimismo, la primera línea de cabecera del comando interactivo
      top muestra exactamente la misma información de tiempo de actividad (
      uptime ).
    difficulty: medium
    placeholder: false
  - id: q-103-44
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos redirige la salida del comando ls al
      archivo lista.txt sobrescribiendo su contenido?
    options:
      - id: a
        text: ls >-1
      - id: b
        text: ls ls
      - id: c
        text: '>&2'
      - id: d
        text: ls >>2
      - id: e
        text: ls
      - id: f
        text: error
    correct:
      - c
    explanation: >-
      En Bash, el descriptor de archivo por defecto para la redirección de
      salida > es 1 ( stdout ), y 2 corresponde a stderr ( standard error ). Por
      tanto, >&2 (equivalente a 1>&2 ) redirige la salida estándar hacia el
      descriptor de error estándar.
    difficulty: medium
    placeholder: false
  - id: q-103-47
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de las siguientes expresiones regulares representa exactamente
      cualquier carácter individual?
    options:
      - id: a
        text: ':UPPER:'
      - id: b
        text: '[A-Z]'
      - id: c
        text: '!a-z'
      - id: d
        text: '%C'
      - id: e
        text: '{AZ}'
    correct:
      - b
    explanation: >-
      En expresiones regulares, los corchetes [] definen una clase de caracteres
      que coincide con un único carácter contenido en el rango especificado.
      [A-Z] coincide con cualquier letra mayúscula individual de la A a la Z.
      (La clase POSIX :upper: requeriría doble corchete [[:upper:]] ).
    difficulty: medium
    placeholder: false
  - id: q-103-49
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      Dado un archivo de registro con fechas, ¿qué comando permite filtrar
      exclusivamente los eventos de un mes determinado?
    options:
      - id: a
        text: grep -E ':08:[0-9]+:[0-9]+' loga.log
      - id: b
        text: grep -E ':08:[0-9]+' loga.log
      - id: c
        text: grep -E loga.log ':08:[0-9]+:[0-9]+'
      - id: d
        text: grep loga.log ':08:[0-9]:[0-9]'
      - id: e
        text: grep -E ':08:[0-9]+:[0-9]+' loga.log
    correct:
      - a
    explanation: >-
      La opción -E activa expresiones regulares extendidas (necesarias para el
      cuantificador + , que significa "uno o más dígitos"). El patrón
      :08:[0-9]+:[0-9]+ busca la hora 08 seguida de cualquier minuto y segundo
      entre 08:00:00 y 08:59:59 , seguido del nombre del archivo loga.log .
    difficulty: medium
    placeholder: false
  - id: q-103-59
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      ¿Cuáles de los siguientes comandos son válidos en el archivo de
      configuración de GRUB 2? (Selecciona DOS respuestas)
    options:
      - id: a
        text: menuentry
      - id: b
        text: uefi
      - id: c
        text: pxe-ifconfig
      - id: d
        text: insmod
      - id: e
        text: kpartx
    correct:
      - a
      - d
    explanation: >-
      Dentro de /boot/grub/grub.cfg , la directiva menuentry define cada una de
      las entradas del menú de arranque, e insmod carga módulos dinámicos de
      GRUB (como soporte para LVM, RAID o sistemas de archivos).
    difficulty: medium
    placeholder: false
  - id: q-103-61
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      ¿Para qué propósitos se puede utilizar LVM (Logical Volume Manager)?
      (Selecciona DOS respuestas)
    options:
      - id: a
        text: To create snapshots.
      - id: b
        text: To dynamically change the size of logical volumes.
      - id: c
        text: To dynamically create or delete logical volumes.
      - id: d
        text: To create RAID 9 arrays.
      - id: e
        text: To encrypt logical volumes.
    correct:
      - a
      - b
      - c
    explanation: >-
      LVM permite crear, redimensionar y eliminar volúmenes lógicos en caliente,
      así como tomar instantáneas ( snapshots ) del estado de un volumen. No
      existe un nivel "RAID 9", y el cifrado de bloques en Linux lo realiza
      LUKS/ dm-crypt , no LVM por sí mismo.
    difficulty: medium
    placeholder: false
  - id: q-103-65
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuántos campos separados por dos puntos contiene una línea
      sintácticamente correcta del fichero /etc/passwd?
    options:
      - id: a
        text: '3'
      - id: b
        text: '4'
      - id: c
        text: '5'
      - id: d
        text: '6'
      - id: e
        text: '7'
    correct:
      - d
    explanation: >-
      De acuerdo con man 5 fstab , cada línea consta de 6 campos separados por
      espacios o tabuladores: 1) Dispositivo ( fs_spec ), 2) Punto de montaje (
      fs_file ), 3) Tipo de sistema de archivos ( fs_vfstype ), 4) Opciones de
      montaje ( fs_mntops ), 5) Frecuencia de volcado dump ( fs_freq ) y 6)
      Orden de chequeo fsck ( fs_passno ).
    difficulty: medium
    placeholder: false
  - id: q-103-68
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos asigna el permiso especial SetUID al
      archivo ejecutable binario?
    options:
      - id: a
        text: chmod 4755 /bin/foo
      - id: b
        text: chmod 1755 /bin/foo
      - id: c
        text: chmod u-s /bin/foo
      - id: d
        text: chmod 755+s /bin/foo
      - id: e
        text: chmod 2755 /bin/foo
    correct:
      - a
    explanation: >-
      En notación octal, el primer dígito de cuatro cifras corresponde a los
      permisos especiales: 4 para SetUID (SUID), 2 para SetGID (SGID) y 1 para
      el Sticky bit . Por tanto, 4755 activa el bit SetUID junto con los
      permisos rwxr-xr-x .
    difficulty: medium
    placeholder: false
  - id: q-103-73
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos indica cómo interpretará la shell un
      comando (alias, función interna o ejecutable en disco)?
    options:
      - id: a
        text: where
      - id: b
        text: type
      - id: c
        text: stat
      - id: d
        text: case
      - id: e
        text: fileinfo
    correct:
      - b
    explanation: >-
      El comando interno de Bash type indica cómo interpretaría la shell un
      nombre de comando si se ejecutara: si es un alias, una palabra reservada (
      keyword ), una función, un comando interno ( builtin ) o un archivo
      ejecutable en disco.
    difficulty: medium
    placeholder: false
  - id: q-103-74
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos muestra la página del manual oficial que
      coincide exactamente con el nombre indicado?
    options:
      - id: a
        text: man command(1)
      - id: b
        text: man command@1
      - id: c
        text: man 1 command
      - id: d
        text: man 1.command
      - id: e
        text: man -s 1 command
    correct:
      - c
    explanation: >-
      Según man 1 man, para consultar una página del manual de una sección
      específica se indica el número de sección como argumento antes del nombre
      del comando (man 1 command).
    difficulty: medium
    placeholder: false
  - id: q-103-76
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos se utiliza para cambiar opciones internas
      del entorno de la shell actual?
    options:
      - id: a
        text: history
      - id: b
        text: setsh
      - id: c
        text: bashconf
      - id: d
        text: set
      - id: e
        text: envsetup
    correct:
      - d
    explanation: >-
      El comando interno set ( help set en Bash) permite activar o desactivar
      opciones del comportamiento de la shell en ejecución (como set -e o set -x
      ) y definir los parámetros posicionales ( $1 , $2 , etc.).
    difficulty: medium
    placeholder: false
  - id: q-103-78
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      ¿Cuáles de las siguientes secuencias en el editor vi guardan las
      modificaciones del archivo actual y salen del editor? (Selecciona DOS
      respuestas)
    options:
      - id: a
        text: Ctrl XX
      - id: b
        text: Ctrl :W
      - id: c
        text: Esc zz
      - id: d
        text: Esc :wq
      - id: e
        text: Esc ZZ
    correct:
      - c
      - d
    explanation: >-
      En vi , pulsar Esc asegura estar en modonormal; desde ahí, tanto el
      comando :wq ( write and quit ) como el atajo en mayúsculas ZZ guardan el
      archivo y cierran el editor.
    difficulty: medium
    placeholder: false
  - id: q-103-79
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: ¿Cuál es el efecto de la opción -v en el comando grep?
    options:
      - id: a
        text: I t enables color to highlight matching parts.
      - id: b
        text: It shows the command's version information.
      - id: c
        text: It only outputs non-matching lines.
      - id: d
        text: It changes the output order showing the last matching line first.
      - id: e
        text: It outputs all lines and prefixes matching lines with a+.
    correct:
      - c
    explanation: >-
      De acuerdo con man 1 grep , la opción -v (o --invert-match ) invierte el
      sentido de la búsqueda, seleccionando e imprimiendo únicamente las líneas
      que no coinciden con el patrón especificado.
    difficulty: medium
    placeholder: false
  - id: q-103-81
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál es el resultado de aplicar una sustitución por expresión regular con
      sed sobre un flujo de entrada?
    options:
      - id: a
        text: ABxxbc
      - id: b
        text: xxCxxc
      - id: c
        text: xxxxxx
      - id: d
        text: ABCabc
      - id: e
        text: Axxaxx
    correct:
      - a
    explanation: >-
      Al evaluarse sobre ABCabc, la expresión regular s/[ABC][abc]/xx/ busca un
      carácter en mayúscula del conjunto [ABC] seguido inmediatamente de un
      carácter en minúscula del conjunto [abc]. Dicha coincidencia exacta ocurre
      en los caracteres centrales Ca. Al sustituir Ca por xx, la cadena
      resultante es ABxxbc.
    difficulty: medium
    placeholder: false
  - id: q-103-82
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      ¿Cuáles de los siguientes comandos imprimen en la terminal la ruta
      absoluta del directorio de trabajo actual? (Selecciona DOS respuestas)
    options:
      - id: a
        text: echo "${PWD}"
      - id: b
        text: echo "${WD}"
      - id: c
        text: printwd
      - id: d
        text: pwd
      - id: e
        text: echo "${pwd}"
    correct:
      - a
      - e
    explanation: >-
      El comando pwd ( print working directory ) muestra el directorio de
      trabajo actual, y Bash mantiene siempre actualizada la variable de entorno
      en mayúsculas $PWD con esa misma ruta.
    difficulty: medium
    placeholder: false
  - id: q-103-83
    topicId: '103'
    subtopicId: '103.4'
    type: fill
    prompt: >-
      ¿Qué comando estándar de Linux permite volcar el contenido de texto hacia
      la salida de la shell?
    correct:
      - cat
    acceptedAnswers:
      - cat
    explanation: El operador
    difficulty: medium
    placeholder: false
  - id: q-103-84
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál es el valor por defecto de prioridad nice que se le asigna a un
      nuevo proceso al iniciarlo en Linux?
    options:
      - id: a
        text: '-10'
      - id: b
        text: '0'
      - id: c
        text: '1'
      - id: d
        text: '10'
      - id: e
        text: '15'
      - id: f
        text: '20'
    correct:
      - d
    explanation: >-
      Según man 1 nice, cuando se ejecuta el comandonice sin especificar un
      ajuste mediante la opción -n, por defecto aplica un incremento de niceness
      de 10.
    difficulty: medium
    placeholder: false
  - id: q-103-86
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos permite realizar búsquedas de texto plano
      mediante expresiones regulares en archivos?
    options:
      - id: a
        text: find
      - id: b
        text: locate
      - id: c
        text: grep
      - id: d
        text: reggrep
      - id: e
        text: pgrep
    correct:
      - c
    explanation: >-
      A diferencia de find y locate (que buscan nombres y metadatos de archivos)
      o pgrep (que busca procesos), grep ( Global Regular Expression Print )
      busca patrones de expresiones regulares dentro del contenido de los
      archivos.
    difficulty: medium
    placeholder: false
  - id: q-103-87
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      En una estructura anidada de directorios, ¿qué opción de find limita la
      profundidad de búsqueda a un nivel específico?
    options:
      - id: a
        text: '-maxdepth'
      - id: b
        text: '-dirmax'
      - id: c
        text: '-maxlevels'
      - id: d
        text: '-s'
      - id: e
        text: '-n'
    correct:
      - a
    explanation: >-
      Según man 1 find , la opción -maxdepth limita el descenso en la jerarquía
      de directorios a como máximo niveles por debajo de los puntos de partida.
    difficulty: medium
    placeholder: false
  - id: q-103-88
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos genera una lista con únicamente los
      nombres de usuario extraídos de /etc/passwd?
    options:
      - id: a
        text: 'column -s : 1,7 /etc/passwd'
      - id: b
        text: chop -c 1,7 /etc/passwd
      - id: c
        text: colrm 1,7 /etc/passwd
      - id: d
        text: 'sort -t: -k1,7 /etc/passwd'
      - id: e
        text: 'cut -d: -f1,7 /etc/passwd'
    correct:
      - e
    explanation: >-
      En /etc/passwd , los campos están separados por : ( -d: ), donde el campo
      1 es el nombre de usuario y el campo 7 es el intérprete de comandos (
      login shell ). cut -d: -f1,7 /etc/passwd extrae ambos campos.
    difficulty: medium
    placeholder: false
  - id: q-103-90
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      En el editor vi, ¿cómo se puede repetir un comando de movimiento o borrado
      varias veces consecutivas?
    options:
      - id: a
        text: By using the command :repeat followed by the number and the command.
      - id: b
        text: >-
          By specifying the number right in front of a command such as 41 or
          2yj.
      - id: c
        text: >-
          By selecting all affected lines using the shit and cursor keys before
          applying the command.
      - id: d
        text: >-
          By is suing a command such as :set repetition=4 with repeats every
          subsequent command 4 times.
      - id: e
        text: >-
          By specifying the number after a command such as 14 or yj2 followed by
          escape.
    correct:
      - b
    explanation: >-
      En vi , cualquier comando de movimiento o edición en modonormal puede
      repetirse N N N veces escribiendo el número justo delante del comando (por
      ejemplo, 4l para avanzar 4 caracteres o 2yj para copiar la línea actual y
      las siguientes hacia abajo).
    difficulty: medium
    placeholder: false
  - id: q-103-91
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de las siguientes afirmaciones es correcta respecto a un comando
      ejecutado con el carácter & al final?
    options:
      - id: a
        text: The command's output is redirected to /dev/null.
      - id: b
        text: The command is run in background of the current shell.
      - id: c
        text: T he command's output is executed by the shell.
      - id: d
        text: The command is run as a direct child of the init process.
      - id: e
        text: The command's input is read from /dev/null.
    correct:
      - b
    explanation: >-
      En Bash ( man 1 bash ), terminar un comando con el operador de control &
      hace que la shell ejecute dicho comando de forma asíncrona en una subshell
      en segundo plano ( background ), devolviendo inmediatamente el control de
      la terminal al usuario.
    difficulty: medium
    placeholder: false
  - id: q-103-92
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos divide un archivo grande en piezas más
      pequeñas de tamaño fijo?
    options:
      - id: a
        text: ar
      - id: b
        text: cat
      - id: c
        text: break
      - id: d
        text: split
      - id: e
        text: parted
    correct:
      - d
    explanation: >-
      El comando split ( man 1 split ) divide un archivo de entrada en múltiples
      fragmentos más pequeños según un número determinado de líneas, bytes o
      trozos.
    difficulty: medium
    placeholder: false
  - id: q-103-93
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: ¿Cuál es el propósito principal del comando xargs?
    options:
      - id: a
        text: It passes arguments to an X server.
      - id: b
        text: >-
          It repeats the execution of a command using different parameters for
          each invocation.
      - id: c
        text: It reads standard input and builds up commands to execute.
      - id: d
        text: It asks a question, graphically, and returns the answer to the shell.
      - id: e
        text: >-
          It allows specifying long options (like --help) for commands that
          normally only accept short options (like -h).
    correct:
      - c
    explanation: >-
      Según man 1 xargs , xargs lee elementos desde la entrada estándar
      (delimitados por espacios, saltos de línea onulos) y construye y ejecuta
      líneas de comandos pasándoles dichos elementos como argumentos.
    difficulty: medium
    placeholder: false
  - id: q-103-94
    topicId: '103'
    subtopicId: '103.4'
    type: fill
    prompt: >-
      ¿Qué comando se utiliza para modificar la prioridad de planificación
      (nice) de un proceso que ya está en ejecución?
    correct:
      - renice
    acceptedAnswers:
      - renice
    explanation: >-
      Mientras que nice inicia un proceso nuevo con una prioridad dada, renice (
      man 1 renice ) altera la prioridad de planificación ( niceness ) de uno o
      más procesos que ya están en ejecución .
    difficulty: medium
    placeholder: false
  - id: q-103-97
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál es la forma correcta de fijar el objetivo de arranque gráfico por
      defecto en un sistema gestionado con systemd?
    options:
      - id: a
        text: systemctl isolate multi-user.target
      - id: b
        text: systemctl set-runlevel multi-user.target
      - id: c
        text: systemctl set-boot multi-user.target
      - id: d
        text: systemctl set-default multi-user.target
      - id: e
        text: systemctl boot -p multi-user.target
    correct:
      - d
    explanation: >-
      Según man 1 systemctl , el subcomando set-default establece el objetivo de
      arranque predeterminado creando el enlace simbólico
      /etc/systemd/system/default.target hacia el archivo de unidad indicado. (
      isolate solo cambia el estado actual sin hacerlo persistente para el
      próximo arranque).
    difficulty: medium
    placeholder: false
  - id: q-103-109
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes ficheros en el directorio personal del usuario se
      ejecuta al iniciar una nueva shell interactiva que no es de login?
    options:
      - id: a
        text: .bashrc_history
      - id: b
        text: .bash_histfile
      - id: c
        text: .history
      - id: d
        text: .bash_history
      - id: e
        text: .history_bash
    correct:
      - d
    explanation: >-
      Por defecto en Bash ( man 1 bash ), el valor predeterminado de la variable
      HISTFILE donde se guarda el historial de comandos al salir de la sesión es
      ~/.bash_history .
    difficulty: medium
    placeholder: false
  - id: q-103-111
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Qué valor de umask garantiza que los archivos nuevos creados tengan
      permisos de lectura y escritura para el propietario y ningún permiso para
      el resto?
    options:
      - id: a
        text: '0017'
      - id: b
        text: '0640'
      - id: c
        text: '0038'
      - id: d
        text: '0227'
      - id: e
        text: '0027'
    correct:
      - e
    explanation: >-
      Los permisos base de creación para archivos regulares son 0666 ( rw-rw-rw-
      ). Queremos obtener -rw-r----- ( 0640 ). Con umask 0027 , se enmascaran
      (desactivan) el permiso de escritura del grupo ( 2 ) y todos los permisos
      de otros ( 7 ), dando como resultado 0640 .
    difficulty: medium
    placeholder: false
  - id: q-103-113
    topicId: '103'
    subtopicId: '103.4'
    type: multiple
    prompt: >-
      ¿Cuáles de las siguientes utilidades localizan y muestran la ruta completa
      del fichero ejecutable en el PATH? (Selecciona DOS respuestas)
    options:
      - id: a
        text: find
      - id: b
        text: pwd
      - id: c
        text: which
      - id: d
        text: locate
      - id: e
        text: type
    correct:
      - c
      - e
    explanation: >-
      Tanto el comando externo which como el comando interno de la shell type
      buscan en la variable $PATH y muestran la ruta completa al archivo
      ejecutable que se invocaría.
    difficulty: medium
    placeholder: false
  - id: q-103-114
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Cuál de los siguientes comandos examina un archivo y determina su tipo
      real mediante números mágicos de cabecera?
    options:
      - id: a
        text: type
      - id: b
        text: file
      - id: c
        text: magic
      - id: d
        text: pmagic
      - id: e
        text: hash
    correct:
      - b
    explanation: >-
      El comando file ( man 1 file ) examina el contenido y los encabezados
      binarios ( magic numbers ) de un archivo contrastándolos con una base de
      datos de firmas ( /usr/share/misc/magic ) para determinar su formato real,
      sin depender de su extensión.
    difficulty: medium
    placeholder: false
  - id: q-103-115
    topicId: '103'
    subtopicId: '103.4'
    type: fill
    prompt: >-
      ¿Qué comando interno de la shell muestra la lista de todos los trabajos en
      segundo plano activos en la sesión actual?
    correct:
      - jobs
    acceptedAnswers:
      - jobs
    explanation: >-
      El comando interno de la shell jobs ( help jobs ) lista todas las tareas
      iniciadas desde la sesión actual de la shell que se encuentran en segundo
      plano o suspendidas.
    difficulty: medium
    placeholder: false
  - id: q-103-120
    topicId: '103'
    subtopicId: '103.4'
    type: single
    prompt: >-
      ¿Qué señal de terminación limpia y ordenada se envía por defecto a un
      proceso cuando se invoca kill sin especificar parámetros?
    options:
      - id: a
        text: SIGTERM
      - id: b
        text: SIGCONT
      - id: c
        text: SIGSTOP
      - id: d
        text: SIGKILL
      - id: e
        text: SIGINT
    correct:
      - e
    explanation: >-
      Según man 7 signal , al presionar la combinación de teclas de interrupción
      Ctrl+C en la terminal, el controlador de la terminal envía la señal SIGINT
      ( Interrupt from keyboard , señal número 2) al proceso que se encuentra en
      primer plano.
    difficulty: medium
    placeholder: false
