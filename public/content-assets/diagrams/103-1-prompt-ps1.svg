<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-prompt-title p1031-prompt-desc">
  <title id="p1031-prompt-title">Anatomía del prompt PS1 de Bash (LPIC-1 103.1)</title>
  <desc id="p1031-prompt-desc">El prompt PS1 de Bash se descompone en cinco segmentos: el usuario alumno, el host servidor01, la ruta :~ donde la virgulilla representa el HOME del usuario, el privilegio $ para un usuario normal y # para root, y la orden uptime que se teclea a continuación del prompt. El usuario y el host mostrados coinciden con $USER y $HOSTNAME, y el PS1 por defecto los genera con escapes de Bash; cada segmento se explica en una tarjeta inferior.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .seg-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .seg-out { fill: #F1F5F9; stroke: #475569; stroke-width: 2; stroke-dasharray: 7 5; }
      .prompt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .prompt-out { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 500; fill: #334155; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .card-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; text-anchor: middle; }
      .card-head-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #BE123C; letter-spacing: 0.06em; text-anchor: middle; }
      .card-head-muted { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; text-anchor: middle; }
      .body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .var { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #1E36AF; text-anchor: middle; }
      .var-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 500; fill: #1E36AF; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .guide { fill: none; stroke: #94A3B8; stroke-width: 1.5; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">BASH · PROMPT PS1 · 103.1</text>
    <text class="title" x="40" y="78">Qué te dice el prompt antes de escribir</text>
    <text class="subtitle" x="40" y="102">PS1 muestra usuario, host, ruta y privilegio;</text>
    <text class="subtitle" x="40" y="122">el PS1 por defecto usa escapes de Bash.</text>
  </g>

  <g id="diagram-nodes">
    <g id="seg-user">
      <rect class="seg-cmd" x="40" y="160" width="152" height="72" rx="10"/>
      <text class="prompt" x="116" y="205">alumno</text>
    </g>

    <g id="seg-host">
      <rect class="seg-cmd" x="198" y="160" width="232" height="72" rx="10"/>
      <text class="prompt" x="314" y="205">@servidor01</text>
    </g>

    <g id="seg-route">
      <rect class="seg-cmd" x="436" y="160" width="172" height="72" rx="10"/>
      <text class="prompt" x="522" y="205">:~</text>
    </g>

    <g id="seg-priv">
      <rect class="seg-cmd" x="614" y="160" width="144" height="72" rx="10"/>
      <text class="prompt" x="686" y="205">$</text>
    </g>

    <g id="seg-order">
      <rect class="seg-out" x="764" y="160" width="156" height="72" rx="10"/>
      <text class="prompt-out" x="842" y="205">uptime</text>
    </g>

    <g id="card-user">
      <rect class="card" x="40" y="310" width="152" height="140" rx="10"/>
      <text class="card-head" x="116" y="338">USUARIO</text>
      <line class="divider" x1="56" y1="352" x2="176" y2="352"/>
      <text class="body" x="116" y="378">cuenta activa</text>
      <text class="body" x="116" y="400">de la sesión</text>
      <text class="var-sm" x="116" y="426">coincide con $USER</text>
    </g>

    <g id="card-host">
      <rect class="card" x="198" y="310" width="232" height="140" rx="10"/>
      <text class="card-head" x="314" y="338">HOST</text>
      <line class="divider" x1="214" y1="352" x2="414" y2="352"/>
      <text class="body" x="314" y="378">nombre del equipo</text>
      <text class="body" x="314" y="400">en la red</text>
      <text class="var-sm" x="314" y="426">coincide con $HOSTNAME</text>
    </g>

    <g id="card-route">
      <rect class="card" x="436" y="310" width="172" height="140" rx="10"/>
      <text class="card-head" x="522" y="338">DIRECTORIO</text>
      <line class="divider" x1="452" y1="352" x2="592" y2="352"/>
      <text class="body" x="522" y="378">ruta actual</text>
      <text class="body" x="522" y="400">~ = $HOME</text>
      <text class="var" x="522" y="426">/home/alumno</text>
    </g>

    <g id="card-priv">
      <rect class="card" x="614" y="310" width="144" height="140" rx="10"/>
      <text class="card-head-warn" x="686" y="338">PRIVILEGIO</text>
      <line class="divider" x1="630" y1="352" x2="742" y2="352"/>
      <text class="body" x="686" y="378">$ = usuario</text>
      <text class="body" x="686" y="400"># = root</text>
      <text class="body" x="686" y="426">tras sudo -i</text>
    </g>

    <g id="card-order">
      <rect class="card" x="764" y="310" width="156" height="140" rx="10"/>
      <text class="card-head-muted" x="842" y="338">ORDEN</text>
      <line class="divider" x1="780" y1="352" x2="904" y2="352"/>
      <text class="body" x="842" y="378">comando que</text>
      <text class="body" x="842" y="400">tecleas después</text>
      <text class="body" x="842" y="426">no forma PS1</text>
    </g>
  </g>

  <g id="diagram-relations">
    <line class="guide" x1="116" y1="232" x2="116" y2="310"/>
    <line class="guide" x1="314" y1="232" x2="314" y2="310"/>
    <line class="guide" x1="522" y1="232" x2="522" y2="310"/>
    <line class="guide" x1="686" y1="232" x2="686" y2="310"/>
    <line class="guide" x1="842" y1="232" x2="842" y2="310"/>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="486">Bash lee la línea, expande comodines y variables</text>
    <text class="note" x="40" y="508">y pide al kernel ejecutar el programa o el builtin.</text>
  </g>
</svg>
