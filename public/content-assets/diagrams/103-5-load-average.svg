<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="load-title load-desc">
  <title id="load-title">Lectura del load average según el número de núcleos: 1 CPU frente a 4 CPU (LPIC-1 103.5)</title>
  <desc id="load-desc">El load average mide cuántos procesos están en ejecución o esperando CPU o disco, promediado en 1, 5 y 15 minutos. Su significado depende del número de núcleos. En un servidor de un solo núcleo, 0,50 es la mitad de la capacidad, 1,00 es el tope y 2,00 indica tope cubierto con un proceso en cola. En un servidor de cuatro núcleos, 1,00 sólo ocupa un cuarto, 4,00 es el cien por cien de la capacidad y 8,00 es sobrecarga crítica con cuatro procesos esperando.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .bar-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .bar-over { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
      .tick { stroke: #1E293B; stroke-width: 2; }
      .scale-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .core-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .core-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .node-note { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .note-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LOAD AVERAGE · CAPACIDAD REAL</text>
    <text class="title" x="40" y="78">La misma cifra, dos lecturas</text>
    <text class="subtitle" x="40" y="102">El número sólo se entiende contra los núcleos.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-un-nucleo">
      <rect class="bar-ok" x="180" y="190" width="350" height="16" rx="4"/>
      <rect class="bar-over" x="530" y="190" width="350" height="16" rx="4"/>
    </g>

    <g id="node-cuatro-nucleos">
      <rect class="bar-ok" x="180" y="280" width="350" height="16" rx="4"/>
      <rect class="bar-over" x="530" y="280" width="350" height="16" rx="4"/>
    </g>

    <g id="node-nota">
      <rect class="node-note" x="40" y="376" width="880" height="120" rx="10"/>
      <text class="note-head" x="64" y="404">CÓMO SE LEE LA CARGA</text>
      <text class="note" x="64" y="432">Cuenta procesos en ejecución o esperando CPU o disco.</text>
      <text class="note" x="64" y="456">El promedio se da en 1, 5 y 15 minutos: si sube, el sistema empeora.</text>
      <text class="note" x="64" y="480">Compara siempre con los núcleos: 4,00 en 4 CPU es el 100 %.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="core-label" x="60" y="204">1 núcleo</text>
    <text class="core-sub" x="60" y="226">0 a 100 % de la capacidad</text>
    <text class="core-label" x="60" y="294">4 núcleos</text>
    <text class="core-sub" x="60" y="316">0 a 100 % de la capacidad</text>

    <line class="tick" x1="355" y1="182" x2="355" y2="212"/>
    <line class="tick" x1="530" y1="182" x2="530" y2="212"/>
    <line class="tick" x1="878" y1="182" x2="878" y2="212"/>

    <text class="scale-label" x="355" y="176" text-anchor="middle">0,50 · 50 %</text>
    <text class="scale-label" x="530" y="176" text-anchor="middle">1,00 · 100 %</text>
    <text class="scale-label" x="880" y="176" text-anchor="end">2,00 · saturada, 1 en cola</text>

    <line class="tick" x1="267" y1="272" x2="267" y2="302"/>
    <line class="tick" x1="530" y1="272" x2="530" y2="302"/>
    <line class="tick" x1="878" y1="272" x2="878" y2="302"/>

    <text class="scale-label" x="267" y="266" text-anchor="middle">1,00 · 25 %</text>
    <text class="scale-label" x="530" y="266" text-anchor="middle">4,00 · 100 %</text>
    <text class="scale-label" x="880" y="266" text-anchor="end">8,00 · sobrecarga, 4 en cola</text>
  </g>
</svg>
