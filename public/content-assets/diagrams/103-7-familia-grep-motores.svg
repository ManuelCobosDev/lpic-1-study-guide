<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="famgrep-title famgrep-desc">
  <title id="famgrep-title">Los tres motores de la familia grep: grep BRE, egrep ERE y fgrep de texto fijo (LPIC-1 103.7)</title>
  <desc id="famgrep-desc">Un mismo patrón, 192.168.1.1, entra en tres motores distintos. grep usa BRE y trata +, ?, |, ( ) y { } como texto ordinario, así que exige barra invertida. egrep o grep -E usa ERE y activa esos metacaracteres de forma nativa. fgrep o grep -F interpreta el patrón como cadena fija, sin expresiones regulares, y por eso es el más rápido y el único inmune a los metacaracteres.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-data { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; }
      .card-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .data-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .data-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .mini { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; }
      .badge { fill: #FFFFFF; stroke: #475569; stroke-width: 1.5; }
      .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; text-anchor: middle; letter-spacing: 0.04em; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #0F172A; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="famgrep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LA FAMILIA grep · TRES MOTORES</text>
    <text class="title" x="40" y="78">Tres motores, tres lecturas del patrón</text>
    <text class="subtitle" x="40" y="102">Elegir el motor cambia lo que el patrón significa.</text>
  </g>

  <g id="diagram-relations">
    <path id="famgrep-rel-patron-bre" class="edge"
          data-from="node-patron" data-to="node-grep" data-relation="interpreta-como-bre"
          d="M 260 313 H 300 V 201 H 340" marker-end="url(#famgrep-arrow)"/>
    <path id="famgrep-rel-patron-ere" class="edge"
          data-from="node-patron" data-to="node-egrep" data-relation="interpreta-como-ere"
          d="M 260 313 H 340" marker-end="url(#famgrep-arrow)"/>
    <path id="famgrep-rel-patron-fixed" class="edge"
          data-from="node-patron" data-to="node-fgrep" data-relation="interpreta-como-fijo"
          d="M 260 313 H 300 V 425 H 340" marker-end="url(#famgrep-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-patron">
      <rect class="node-data" x="40" y="263" width="220" height="100" rx="10"/>
      <text class="data-mono" x="64" y="302">'192.168.1.1'</text>
      <text class="data-sub" x="64" y="326">Patrón escrito por</text>
      <text class="data-sub" x="64" y="344">el administrador</text>
    </g>

    <g id="node-grep">
      <rect class="node-cmd" x="340" y="150" width="580" height="102" rx="10"/>
      <text class="card-mono" x="364" y="192">grep</text>
      <text class="card-body" x="364" y="222">BRE: los operadores +, ?, |, ( ) y { } son texto</text>
      <text class="card-body" x="364" y="242">ordinario y exigen barra invertida para actuar.</text>
      <rect class="badge" x="800" y="166" width="100" height="26" rx="7"/>
      <text class="badge-text" x="850" y="184">1 · BRE</text>
    </g>

    <g id="node-egrep">
      <rect class="node-cmd" x="340" y="262" width="580" height="102" rx="10"/>
      <text class="card-mono" x="364" y="304">egrep · grep -E</text>
      <text class="card-body" x="364" y="334">ERE: +, ?, |, ( ) y { } actúan de forma nativa,</text>
      <text class="card-body" x="364" y="354">sin escapar ningún metacarácter.</text>
      <rect class="badge" x="800" y="278" width="100" height="26" rx="7"/>
      <text class="badge-text" x="850" y="296">2 · ERE</text>
    </g>

    <g id="node-fgrep">
      <rect class="node-cmd" x="340" y="374" width="580" height="102" rx="10"/>
      <text class="card-mono" x="364" y="416">fgrep · grep -F</text>
      <text class="card-body" x="364" y="446">Texto fijo: cero expresiones regulares, busca</text>
      <text class="card-body" x="364" y="466">la cadena literal exacta a máxima velocidad.</text>
      <rect class="badge" x="800" y="390" width="100" height="26" rx="7"/>
      <text class="badge-text" x="850" y="408">3 · FIXED</text>
    </g>

    <g id="node-banda">
      <rect class="band" x="40" y="490" width="880" height="30" rx="8"/>
      <text class="band-text" x="480" y="510" text-anchor="middle">grep y egrep leen los puntos como comodines; fgrep los toma como texto literal.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="mini" x="40" y="252">PATRÓN DE ENTRADA</text>
  </g>
</svg>
