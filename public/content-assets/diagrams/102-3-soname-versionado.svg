<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="soname-title soname-desc">
  <title id="soname-title">El soname como puente entre el programa y el archivo físico de la librería (LPIC-1 102.3)</title>
  <desc id="soname-desc">Un programa compilado como curl solo guarda en su cabecera el soname libssl.so.3 y nunca el nombre del archivo con la versión completa. Ayer el enlace libssl.so.3 apuntaba a libssl.so.3.0.1, que contenía una vulnerabilidad; tras instalar el parche y ejecutar sudo ldconfig, el mismo enlace apunta a libssl.so.3.0.2 y el programa ejecuta el código seguro sin recompilar. Si cambia la versión mayor, OpenSSL 4.0, los programas nuevos piden libssl.so.4 y se resuelve contra libssl.so.4.0.0, de modo que ambos sonames conviven en /usr/lib.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .node-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .name-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .name-file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .name-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; }
      .name-ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #065F46; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .sub-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
      .sub-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #065F46; }
      .band { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-rose { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
    </style>

    <marker id="soname-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="soname-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
    <marker id="soname-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SONAME · VERSIONADO DE LIBRERÍAS</text>
    <text class="title" x="40" y="78">El soname desacopla programa y archivo</text>
    <text class="subtitle" x="40" y="102">El binario solo conoce el soname libssl.so.3,</text>
    <text class="subtitle" x="40" y="122">nunca el archivo físico con la versión completa.</text>
  </g>

  <g id="diagram-relations">
    <path id="soname-rel-programa-soname" class="edge-blue"
          data-from="node-programa" data-to="node-soname" data-relation="pide-soname"
          d="M 240 236 H 300" marker-end="url(#soname-arrow-blue)"/>

    <path id="soname-rel-soname-antiguo" class="edge-rose"
          data-from="node-soname" data-to="node-archivo-antiguo" data-relation="apuntaba-ayer"
          d="M 520 204 H 550 V 184 H 580" marker-end="url(#soname-arrow-rose)"/>

    <path id="soname-rel-soname-nuevo" class="edge-blue"
          data-from="node-soname" data-to="node-archivo-nuevo" data-relation="apunta-hoy"
          d="M 520 268 H 550 V 288 H 580" marker-end="url(#soname-arrow-blue)"/>

    <path id="soname-rel-ldconfig-soname" class="edge-slate"
          data-from="node-ldconfig" data-to="node-soname" data-relation="mueve-enlace"
          d="M 410 348 V 292" marker-end="url(#soname-arrow-slate)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-programa">
      <rect class="node-cmd" x="40" y="180" width="200" height="112" rx="10"/>
      <text class="name-cmd" x="64" y="216">curl</text>
      <text class="sub" x="64" y="242">pide en cabecera</text>
      <text class="mono-sm" x="64" y="266">libssl.so.3</text>
    </g>

    <g id="node-soname">
      <rect class="node-file" x="300" y="180" width="220" height="112" rx="10"/>
      <text class="name-file" x="324" y="216">libssl.so.3</text>
      <text class="sub" x="324" y="242">soname: enlace</text>
      <text class="sub" x="324" y="266">simbólico puente</text>
    </g>

    <g id="node-archivo-antiguo">
      <rect class="node-warn" x="580" y="140" width="340" height="88" rx="10"/>
      <text class="name-warn" x="604" y="176">libssl.so.3.0.1</text>
      <text class="sub-warn" x="604" y="202">ayer: vulnerabilidad conocida</text>
    </g>

    <g id="node-archivo-nuevo">
      <rect class="node-ok" x="580" y="244" width="340" height="88" rx="10"/>
      <text class="name-ok" x="604" y="280">libssl.so.3.0.2</text>
      <text class="sub-ok" x="604" y="306">hoy: código ya parcheado</text>
    </g>

    <g id="node-ldconfig">
      <rect class="node-cmd" x="300" y="348" width="220" height="72" rx="10"/>
      <text class="name-file" x="324" y="378" style="font-size:18px">sudo ldconfig</text>
      <text class="sub" x="324" y="402">rehace el enlace</text>
    </g>

    <g id="node-convivencia">
      <rect class="band" x="40" y="436" width="880" height="72" rx="10"/>
      <text class="band-text" x="64" y="464">Versión mayor nueva (OpenSSL 4.0): los nuevos piden libssl.so.4 → libssl.so.4.0.0</text>
      <text class="band-text" x="64" y="492">Los antiguos siguen con libssl.so.3 → 3.0.2: ambos sonames conviven en /usr/lib.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="edge-label" x="424" y="316">mueve el enlace</text>
  </g>
</svg>
