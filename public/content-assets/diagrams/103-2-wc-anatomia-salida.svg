<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="wc-title wc-desc">
  <title id="wc-title">Anatomía de la salida por defecto de wc sobre /etc/issue (LPIC-1 103.2)</title>
  <desc id="wc-desc">El comando wc /etc/issue imprime tres cifras en orden fijo —dos líneas, seis palabras y cuarenta bytes— seguidas del nombre del fichero. Cada cifra corresponde a una columna de la salida: líneas, palabras, bytes y nombre. La banda inferior recuerda que wc -l cuenta saltos de línea, wc -c cuenta bytes y wc -m cuenta caracteres lógicos, por lo que una palabra acentuada como año ocupa cuatro bytes pero solo tres caracteres.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .prompt { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .prompt-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .out-band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .seg { fill: #EFF4FF; }
      .divider { stroke: #94A3B8; stroke-width: 1.5; }
      .num { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .note { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .note-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #92400E; }
      .note-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #44403C; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">CONTAR Y NUMERAR · wc</text>
    <text class="title" x="40" y="78">La salida de wc, campo a campo</text>
    <text class="subtitle" x="40" y="102">Sin opciones: líneas, palabras y bytes, en ese orden.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-prompt">
      <rect class="prompt" x="40" y="128" width="880" height="48" rx="8"/>
      <text class="prompt-text" x="64" y="159">$ wc /etc/issue</text>
    </g>

    <g id="node-output">
      <rect class="out-band" x="140" y="252" width="680" height="72" rx="8"/>
      <rect class="seg" x="140" y="252" width="180" height="72" rx="8"/>
      <rect class="seg" x="320" y="252" width="180" height="72"/>
      <rect class="seg" x="500" y="252" width="160" height="72"/>
      <rect class="seg" x="660" y="252" width="160" height="72" rx="8"/>
      <rect x="140" y="252" width="680" height="72" rx="8" fill="none" stroke="#475569" stroke-width="2"/>
      <line class="divider" x1="320" y1="252" x2="320" y2="324"/>
      <line class="divider" x1="500" y1="252" x2="500" y2="324"/>
      <line class="divider" x1="660" y1="252" x2="660" y2="324"/>
      <text class="num" x="230" y="297">2</text>
      <text class="num" x="410" y="297">6</text>
      <text class="num" x="580" y="297">40</text>
      <text class="file" x="740" y="295">/etc/issue</text>
    </g>

    <g id="node-counter">
      <rect class="note" x="40" y="368" width="880" height="124" rx="10"/>
      <text class="note-title" x="64" y="400">El orden de las tres cifras nunca cambia</text>
      <text class="note-body" x="64" y="430">wc -l cuenta saltos de línea; wc -c, bytes; wc -m, caracteres lógicos.</text>
      <text class="note-body" x="64" y="456">Una palabra acentuada como «año» ocupa 4 bytes y solo 3 caracteres.</text>
      <text class="note-body" x="64" y="482">Si no se indica fichero, wc lee el flujo desde la entrada estándar.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="tag" x="230" y="200">líneas</text>
    <text class="tag" x="410" y="200">palabras</text>
    <text class="tag" x="580" y="200">bytes</text>
    <text class="tag" x="740" y="200">fichero</text>
    <line class="guide" x1="230" y1="212" x2="230" y2="252"/>
    <line class="guide" x1="410" y1="212" x2="410" y2="252"/>
    <line class="guide" x1="580" y1="212" x2="580" y2="252"/>
    <line class="guide" x1="740" y1="212" x2="740" y2="252"/>
  </g>
</svg>
