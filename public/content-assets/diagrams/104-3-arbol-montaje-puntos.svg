<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="arbol-montaje-title arbol-montaje-desc">
  <title id="arbol-montaje-title">Árbol único de Linux con la raíz y tres puntos de montaje (LPIC-1 104.3)</title>
  <desc id="arbol-montaje-desc">La raíz / es el disco principal, UUID=a1b2..., y de ella cuelgan tres puntos de montaje: /home en /dev/sdb1 con UUID=4f3b..., /boot/efi en /dev/sda1 con UUID=c12a..., que es la partición ESP FAT32, y /mnt/backup en el disco externo USB /dev/sdc1 con UUID=8e9f... Una banda inferior advierte de que montar una partición sobre un directorio que ya tenía archivos los oculta hasta desmontar, sin borrarlos.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-root { fill: #F1F5F9; stroke: #334155; stroke-width: 2.5; }
      .mono-root { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .mono-path { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .mono-uuid { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #1E36AF; text-anchor: middle; }
      .mono-dev { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .edge-tree { fill: none; stroke: #475569; stroke-width: 2; }
      .band { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #881337; }
      .band-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15.5px; font-weight: 400; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.3 · MONTAJE DE SISTEMAS DE ARCHIVOS</text>
    <text class="title" x="40" y="78">Un solo árbol, muchos discos</text>
    <text class="subtitle" x="40" y="102">Los discos no llevan letra: cuelgan de un único árbol</text>
    <text class="subtitle" x="40" y="122">con raíz en / y se acoplan a puntos de montaje.</text>
  </g>

  <g id="diagram-relations">
    <line id="arbol-trunk" class="edge-tree" x1="480" y1="214" x2="480" y2="240"/>
    <line id="arbol-rail" class="edge-tree" x1="176" y1="240" x2="784" y2="240"/>
    <line id="arbol-drop-home" class="edge-tree" x1="176" y1="240" x2="176" y2="264"/>
    <line id="arbol-drop-efi" class="edge-tree" x1="480" y1="240" x2="480" y2="264"/>
    <line id="arbol-drop-backup" class="edge-tree" x1="784" y1="240" x2="784" y2="264"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-root">
      <rect class="node-root" x="360" y="136" width="240" height="78" rx="10"/>
      <text class="mono-root" x="480" y="166">/ (raíz)</text>
      <text class="role" x="480" y="188">Disco principal</text>
      <text class="mono-uuid" x="480" y="208">UUID=a1b2… · /dev/sda2</text>
    </g>

    <g id="node-home">
      <rect class="node-file" x="40" y="264" width="272" height="132" rx="10"/>
      <text class="mono-path" x="176" y="294">/home</text>
      <text class="role" x="176" y="318">Partición de usuarios</text>
      <text class="mono-uuid" x="176" y="346">UUID=4f3b…</text>
      <text class="mono-dev" x="176" y="370">/dev/sdb1</text>
    </g>

    <g id="node-boot-efi">
      <rect class="node-file" x="344" y="264" width="272" height="132" rx="10"/>
      <text class="mono-path" x="480" y="294">/boot/efi</text>
      <text class="role" x="480" y="318">Partición ESP FAT32</text>
      <text class="mono-uuid" x="480" y="346">UUID=c12a…</text>
      <text class="mono-dev" x="480" y="370">/dev/sda1</text>
    </g>

    <g id="node-mnt-backup">
      <rect class="node-file" x="648" y="264" width="272" height="132" rx="10"/>
      <text class="mono-path" x="784" y="294">/mnt/backup</text>
      <text class="role" x="784" y="318">Disco externo USB</text>
      <text class="mono-uuid" x="784" y="346">UUID=8e9f…</text>
      <text class="mono-dev" x="784" y="370">/dev/sdc1</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="band" x="40" y="412" width="880" height="88" rx="10"/>
    <text class="band-title" x="64" y="442">Montar oculta, no borra</text>
    <text class="band-body" x="64" y="468">Si /mnt/fotos ya tenía archivos, al montar encima</text>
    <text class="band-body" x="64" y="490">quedan ocultos hasta umount: no se borran, se tapan.</text>
  </g>
</svg>
