<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hold-title hold-desc">
  <title id="hold-title">dpkg-reconfigure frente a apt-mark hold: reconfigurar o congelar un paquete (LPIC-1 102.4)</title>
  <desc id="hold-desc">dpkg-reconfigure vuelve a abrir el asistente debconf de un paquete ya instalado, de modo que la nueva respuesta se escribe en /etc/ sin desinstalar ni reinstalar nada; con -p critical solo pregunta lo imprescindible. apt-mark hold pone un candado al paquete para que apt-get upgrade y dist-upgrade no lo actualicen, y se gestiona con apt-mark unhold y apt-mark showhold.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .zone { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .zone-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-safe { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .node-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #1E293B; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .note-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #475569; }
    </style>

    <marker id="hold-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">POST-INSTALACIÓN · RECONFIGURAR O CONGELAR</text>
    <text class="title" x="40" y="78">Dos herramientas, dos urgencias</text>
    <text class="subtitle" x="40" y="102">Reabrir la configuración o blindar una versión.</text>
  </g>

  <g id="diagram-groups">
    <rect class="zone" x="40" y="124" width="420" height="306" rx="12"/>
    <text class="zone-head" x="64" y="152">RECONFIGURAR SIN REINSTALAR</text>

    <rect class="zone" x="500" y="124" width="420" height="306" rx="12"/>
    <text class="zone-head" x="524" y="152">CONGELAR EN PRODUCCIÓN</text>
  </g>

  <g id="diagram-relations">
    <path id="hold-rel-debconf-etc" class="edge-blue"
          data-from="node-debconf" data-to="node-etc" data-relation="reescribe-configuracion"
          d="M 250 332 V 360" marker-end="url(#hold-arrow-blue)"/>
    <path id="hold-rel-tzdata-debconf" class="edge-blue"
          data-from="node-reconfigure" data-to="node-debconf" data-relation="abre-el-asistente"
          d="M 250 240 V 268" marker-end="url(#hold-arrow-blue)"/>
    <path id="hold-rel-hold-candado" class="edge-blue"
          data-from="node-apt-mark" data-to="node-candado" data-relation="marca-retenido"
          d="M 710 240 V 268" marker-end="url(#hold-arrow-blue)"/>
    <path id="hold-rel-candado-upgrade" class="edge-blue"
          data-from="node-candado" data-to="node-upgrade" data-relation="ignorado-por-upgrade"
          d="M 710 332 V 360" marker-end="url(#hold-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-reconfigure">
      <rect class="node-cmd" x="64" y="176" width="372" height="64" rx="10"/>
      <text class="mono" x="86" y="214">sudo dpkg-reconfigure tzdata</text>
    </g>

    <g id="node-debconf">
      <rect class="node-iface" x="64" y="268" width="372" height="64" rx="10"/>
      <text class="node-text" x="86" y="306">El asistente debconf vuelve a preguntar</text>
    </g>

    <g id="node-etc">
      <rect class="node-file" x="64" y="360" width="372" height="64" rx="10"/>
      <text class="node-text" x="86" y="398">/etc/ actualizado sin reinstalar</text>
    </g>

    <g id="node-apt-mark">
      <rect class="node-cmd" x="524" y="176" width="372" height="64" rx="10"/>
      <text class="mono" x="546" y="214">sudo apt-mark hold linux-image-amd64</text>
    </g>

    <g id="node-candado">
      <rect class="node-safe" x="524" y="268" width="372" height="64" rx="10"/>
      <text class="node-text" x="546" y="306">Candado: el paquete queda retenido</text>
    </g>

    <g id="node-upgrade">
      <rect class="node-safe" x="524" y="360" width="372" height="64" rx="10"/>
      <text class="node-text" x="546" y="398">upgrade y dist-upgrade lo ignoran</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="456">Casos: tzdata · locales · keyboard-configuration</text>
    <text class="note" x="40" y="480">Opción -p critical: solo lo imprescindible.</text>
    <text class="note-mono" x="500" y="456">apt-mark unhold · apt-mark showhold</text>
    <text class="note-mono" x="500" y="480">Clásico de tuberías: dpkg --set-selections</text>
  </g>
</svg>
