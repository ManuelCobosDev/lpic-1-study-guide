<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sed-title sed-desc">
  <title id="sed-title">El ciclo de ejecución de sed: leer, ejecutar órdenes, imprimir y pasar a la línea siguiente (LPIC-1 103.2)</title>
  <desc id="sed-desc">sed procesa el flujo en un ciclo que se repite una vez por línea: lee una línea de la entrada estándar o del fichero, ejecuta las órdenes del script —sustituciones como s/antiguo/nuevo/g, borrados como /patrón/d o impresiones como 3p— e imprime la línea por stdout de forma automática, salvo que la opción -n suprima esa salida. Después pasa a la línea siguiente y repite el ciclo hasta agotar el flujo. La banda inferior recuerda que -e encadena órdenes y que -i reescribe el fichero original, mientras que -i.backup guarda antes una copia.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-out { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #1E36AF; }
      .loop-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; text-anchor: middle; }
      .rule { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .rule-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #44403C; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="sed-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">EDITOR DE FLUJO · sed</text>
    <text class="title" x="40" y="78">El ciclo de sed, línea a línea</text>
    <text class="subtitle" x="40" y="102">sed no abre un editor: transforma el flujo al vuelo.</text>
  </g>

  <g id="diagram-relations">
    <path id="sed-rel-leer-editar" class="edge" data-from="node-leer" data-to="node-editar" data-relation="pasa-la-linea"
          d="M 440 194 H 520" marker-end="url(#sed-arrow)"/>
    <path id="sed-rel-editar-imprimir" class="edge" data-from="node-editar" data-to="node-imprimir" data-relation="emite-resultado"
          d="M 720 236 V 300" marker-end="url(#sed-arrow)"/>
    <path id="sed-rel-imprimir-siguiente" class="edge" data-from="node-imprimir" data-to="node-siguiente" data-relation="avanza"
          d="M 520 342 H 440" marker-end="url(#sed-arrow)"/>
    <path id="sed-rel-siguiente-leer" class="edge" data-from="node-siguiente" data-to="node-leer" data-relation="repite-el-ciclo"
          d="M 240 300 V 236" marker-end="url(#sed-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-leer">
      <rect class="node-file" x="40" y="152" width="400" height="84" rx="10"/>
      <text class="node-title" x="64" y="186">Lee una línea</text>
      <text class="node-sub" x="64" y="212">de stdin o del fichero indicado</text>
    </g>

    <g id="node-editar">
      <rect class="node-cmd" x="520" y="152" width="400" height="84" rx="10"/>
      <text class="node-title" x="544" y="186">Ejecuta las órdenes</text>
      <text class="mono-sm" x="544" y="212">s/…/…/g · /patrón/d · 3p</text>
    </g>

    <g id="node-imprimir">
      <rect class="node-out" x="520" y="300" width="400" height="84" rx="10"/>
      <text class="node-title" x="544" y="334">Imprime la línea</text>
      <text class="node-sub" x="544" y="360">auto-print, salvo que uses -n</text>
    </g>

    <g id="node-siguiente">
      <rect class="node-file" x="40" y="300" width="400" height="84" rx="10"/>
      <text class="node-title" x="64" y="334">Pasa a la siguiente</text>
      <text class="node-sub" x="64" y="360">y repite hasta agotar el flujo</text>
    </g>

    <g id="node-rule">
      <rect class="rule" x="40" y="432" width="880" height="66" rx="10"/>
      <text class="rule-body" x="64" y="460">Con -e se encadenan órdenes: sed -n -e '1p' -e '10p' -e '$p' /etc/passwd;</text>
      <text class="rule-body" x="64" y="484">-i reescribe el fichero y -i.backup deja antes una copia (names.csv.backup).</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="loop-note" x="480" y="272">una iteración por línea</text>
  </g>
</svg>
