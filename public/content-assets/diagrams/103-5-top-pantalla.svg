<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="top-title top-desc">
  <title id="top-title">Anatomía de la pantalla de top: resumen, tareas, CPU y tabla de procesos (LPIC-1 103.5)</title>
  <desc id="top-desc">La pantalla de top se lee en cuatro bandas. La primera muestra la hora, el tiempo encendido y el load average de 1, 5 y 15 minutos. La segunda cuenta las tareas por estado, incluidos los zombis. La tercera desglosa el uso de CPU en us de usuario, sy de kernel, id de ocioso y wa de espera de disco. La cuarta es la tabla de procesos, que se ordena en caliente con la P por CPU, la M por memoria, la N por PID y la T por tiempo, y donde la tecla k envía una señal y la W guarda la vista en ~/.toprc.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .band { fill: #F8FAFC; stroke: #475569; stroke-width: 1.5; }
      .band-main { fill: #FFFFFF; stroke: #1D40D8; stroke-width: 2; }
      .screen-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .screen-head { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1E36AF; }
      .band-div { stroke: #CBD5E1; stroke-width: 1.5; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .anno-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .anno-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .node-note { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">TOP · LA PANTALLA EN CUATRO BANDAS</text>
    <text class="title" x="40" y="78">Qué mirar y en qué orden</text>
    <text class="subtitle" x="40" y="102">De la carga global al proceso concreto.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-resumen">
      <rect class="band" x="40" y="140" width="580" height="46" rx="8"/>
      <text class="screen-mono" x="60" y="169">top - 09:14:02 up 3 days,  load average: 0,42 0,51 0,60</text>
    </g>

    <g id="node-tareas">
      <rect class="band" x="40" y="194" width="580" height="46" rx="8"/>
      <text class="screen-mono" x="60" y="223">Tasks: 128 total, 1 running, 127 sleeping, 0 zombie</text>
    </g>

    <g id="node-cpu">
      <rect class="band" x="40" y="248" width="580" height="46" rx="8"/>
      <text class="screen-mono" x="60" y="277">%Cpu(s): 3,2 us, 1,1 sy, 94,8 id, 0,9 wa</text>
    </g>

    <g id="node-tabla">
      <rect class="band-main" x="40" y="302" width="580" height="128" rx="8"/>
      <text class="screen-head" x="60" y="332" xml:space="preserve">  PID USER       S  %CPU  %MEM  COMMAND</text>
      <line class="band-div" x1="60" y1="344" x2="600" y2="344"/>
      <text class="screen-mono" x="60" y="370" xml:space="preserve"> 1187 www-data   S   3,0   1,2  nginx</text>
      <text class="screen-mono" x="60" y="396" xml:space="preserve">41205 alumno     R  12,5   0,1  tar</text>
    </g>

    <g id="node-nota">
      <rect class="node-note" x="40" y="452" width="880" height="60" rx="10"/>
      <text class="note" x="62" y="486">La tecla q sale de top; la W guarda los ajustes de la vista en ~/.toprc.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="guide" x1="620" y1="163" x2="644" y2="163"/>
    <line class="guide" x1="620" y1="217" x2="644" y2="217"/>
    <line class="guide" x1="620" y1="271" x2="644" y2="271"/>
    <line class="guide" x1="620" y1="336" x2="644" y2="336"/>

    <text class="anno-head" x="654" y="158">uptime y load average</text>
    <text class="anno-sub" x="654" y="180">de 1, 5 y 15 minutos</text>

    <text class="anno-head" x="654" y="212">tareas por estado</text>
    <text class="anno-sub" x="654" y="234">incluye los zombis</text>

    <text class="anno-head" x="654" y="266">us, sy, id y wa</text>
    <text class="anno-sub" x="654" y="288">usuario, kernel, ocioso, iowait</text>

    <text class="anno-head" x="654" y="330">la tabla de procesos</text>
    <text class="anno-sub" x="654" y="352">se ordena con P, M, N o T</text>
  </g>
</svg>
