<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lspci-title lspci-desc">
  <title id="lspci-title">Anatomía de la salida de lspci -nnk y qué opción revela cada dato (LPIC-1 101.1)</title>
  <desc id="lspci-desc">La salida de lspci -nnk se despieza en cuatro datos numerados: la dirección física del bus 00:02.0, que responde al formato dominio:bus:dispositivo.función y se filtra con -s; el identificador [8086:9bc5] en hexadecimal, donde 8086 es Intel, que se muestra con -nn y se filtra con -d; el driver activo de la línea Kernel driver in use: i915, que se obtiene con -k; y los controladores disponibles de la línea Kernel modules: i915.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .output-card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .prompt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #475569; }
      .out-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .out-line-dim { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #334155; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .legend-card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .legend-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .legend-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">BUS PCI · LECTURA DE LA SALIDA</text>
    <text class="title" x="40" y="78">La salida de lspci, despiezada</text>
    <text class="subtitle" x="40" y="102">Cada dato de la línea se obtiene con una opción distinta.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-salida">
      <rect class="output-card" x="40" y="124" width="880" height="200" rx="10"/>
      <text class="prompt" x="64" y="154">$ lspci -nnk -s 00:02.0</text>
      <text class="out-line" x="88" y="188">00:02.0 VGA compatible controller [0300]:</text>
      <text class="out-line" x="88" y="216">  Intel Corporation CometLake-S GT2 [UHD Graphics 630] [8086:9bc5] (rev 05)</text>
      <text class="out-line-dim" x="88" y="244">  Subsystem: Dell Device [1028:099e]</text>
      <text class="out-line" x="88" y="272">  Kernel driver in use: i915</text>
      <text class="out-line" x="88" y="300">  Kernel modules: i915</text>
    </g>

    <g id="node-leyenda-1">
      <rect class="legend-card" x="40" y="340" width="420" height="72" rx="8"/>
      <text class="legend-title" x="76" y="364">Dirección del bus físico</text>
      <text class="legend-text" x="76" y="386">00:02.0 = dominio:bus:dispositivo.función.</text>
      <text class="legend-text" x="76" y="404">Se filtra con la opción -s.</text>
    </g>

    <g id="node-leyenda-2">
      <rect class="legend-card" x="480" y="340" width="440" height="72" rx="8"/>
      <text class="legend-title" x="516" y="364">ID Vendor:Device</text>
      <text class="legend-text" x="516" y="386">[8086:9bc5] en hexadecimal: 8086 = Intel.</text>
      <text class="legend-text" x="516" y="404">Se muestra con -nn y se filtra con -d.</text>
    </g>

    <g id="node-leyenda-3">
      <rect class="legend-card" x="40" y="424" width="420" height="72" rx="8"/>
      <text class="legend-title" x="76" y="448">Driver activo (-k)</text>
      <text class="legend-text" x="76" y="470">Kernel driver in use: i915 es el driver que</text>
      <text class="legend-text" x="76" y="488">controla la tarjeta ahora mismo.</text>
    </g>

    <g id="node-leyenda-4">
      <rect class="legend-card" x="480" y="424" width="440" height="72" rx="8"/>
      <text class="legend-title" x="516" y="448">Módulos disponibles</text>
      <text class="legend-text" x="516" y="470">Kernel modules: i915 enumera los controladores</text>
      <text class="legend-text" x="516" y="488">compilados compatibles con el dispositivo.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="66" cy="182" r="10"/>
    <text class="badge-num" x="66" y="186">1</text>
    <circle class="badge" cx="66" cy="210" r="10"/>
    <text class="badge-num" x="66" y="214">2</text>
    <circle class="badge" cx="66" cy="266" r="10"/>
    <text class="badge-num" x="66" y="270">3</text>
    <circle class="badge" cx="66" cy="294" r="10"/>
    <text class="badge-num" x="66" y="298">4</text>

    <circle class="badge" cx="56" cy="357" r="11"/>
    <text class="badge-num" x="56" y="361">1</text>
    <circle class="badge" cx="496" cy="357" r="11"/>
    <text class="badge-num" x="496" y="361">2</text>
    <circle class="badge" cx="56" cy="441" r="11"/>
    <text class="badge-num" x="56" y="445">3</text>
    <circle class="badge" cx="496" cy="441" r="11"/>
    <text class="badge-num" x="496" y="445">4</text>
  </g>
</svg>
