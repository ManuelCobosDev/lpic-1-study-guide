<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-quoting-title p1031-quoting-desc">
  <title id="p1031-quoting-title">Comillas simples, dobles, barra invertida y sustitución de comandos (LPIC-1 103.1)</title>
  <desc id="p1031-quoting-desc">Cuatro mecanismos de quoting. Las comillas simples desactivan todos los caracteres especiales: echo '$USER gana $100' imprime el texto literal. Las comillas dobles protegen los espacios pero expanden variables y sustitución de comandos: echo "Hola $USER" imprime Hola sysadmin. La barra invertida no se expande: escapa un solo carácter, y echo "Precio: \$50" imprime Precio: $50. La sustitución de comandos $(cmd) o con backticks ejecuta el comando en una subshell y reemplaza la expresión por su salida: echo "Hoy es $(date +%A)" imprime Hoy es lunes.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-a { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-b { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .card-c { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-d { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #B45309; letter-spacing: 0.06em; }
      .head-c { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .head-d { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .syntax { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .rule { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .example { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #0F172A; }
      .output { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #475569; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">QUOTING · EXPANSIÓN EN BASH</text>
    <text class="title" x="40" y="78">Cuatro formas de controlar la expansión</text>
    <text class="subtitle" x="40" y="102">Las comillas deciden qué expande Bash antes de</text>
    <text class="subtitle" x="40" y="122">ejecutar el comando: no son decorativas.</text>
  </g>

  <g id="diagram-nodes">
    <g id="card-simple">
      <rect class="card-a" x="40" y="130" width="440" height="170" rx="10"/>
      <text class="head-a" x="64" y="158">COMILLAS SIMPLES</text>
      <text class="syntax" x="64" y="188">'texto literal'</text>
      <text class="rule" x="64" y="214">Desactiva todos los caracteres especiales.</text>
      <line class="divider" x1="64" y1="226" x2="456" y2="226"/>
      <text class="example" x="64" y="252">echo '$USER gana $100'</text>
      <text class="output" x="64" y="274">imprime: $USER gana $100</text>
    </g>

    <g id="card-double">
      <rect class="card-b" x="500" y="130" width="420" height="170" rx="10"/>
      <text class="head-b" x="524" y="158">COMILLAS DOBLES</text>
      <text class="syntax" x="524" y="188">"texto $VAR"</text>
      <text class="rule" x="524" y="214">Protege espacios y expande $ y $(cmd).</text>
      <line class="divider" x1="524" y1="226" x2="896" y2="226"/>
      <text class="example" x="524" y="252">echo "Hola $USER"</text>
      <text class="output" x="524" y="274">imprime: Hola sysadmin</text>
    </g>

    <g id="card-escape">
      <rect class="card-c" x="40" y="316" width="440" height="170" rx="10"/>
      <text class="head-c" x="64" y="344">BARRA INVERTIDA</text>
      <text class="syntax" x="64" y="374">\carácter</text>
      <text class="rule" x="64" y="400">Desactiva un solo carácter inmediato.</text>
      <line class="divider" x1="64" y1="412" x2="456" y2="412"/>
      <text class="example" x="64" y="438">echo "Precio: \$50"</text>
      <text class="output" x="64" y="460">imprime: Precio: $50</text>
    </g>

    <g id="card-subst">
      <rect class="card-d" x="500" y="316" width="420" height="170" rx="10"/>
      <text class="head-d" x="524" y="344">SUSTITUCIÓN DE COMANDOS</text>
      <text class="syntax" x="524" y="374">$(cmd)  o  `cmd`</text>
      <text class="rule" x="524" y="400">Ejecuta en una subshell y usa su salida.</text>
      <line class="divider" x1="524" y1="412" x2="896" y2="412"/>
      <text class="example" x="524" y="434">echo "Hoy es $(date +%A)"</text>
      <text class="output" x="524" y="454">imprime: Hoy es lunes</text>
      <text class="output" x="524" y="474">guarda la fecha: HOY=$(date +%F)</text>
    </g>
  </g>
</svg>
