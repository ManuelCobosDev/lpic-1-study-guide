<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cloudinit-title cloudinit-desc">
  <title id="cloudinit-title">cloud-init lee el user-data en el primer arranque y aplica la configuración (LPIC-1 102.6)</title>
  <desc id="cloudinit-desc">Flujo de aprovisionamiento. El archivo user-data en formato YAML empieza por la cabecera #cloud-config y declara hostname, usuarios con sudo, claves públicas SSH, paquetes y comandos runcmd. En el primer arranque, el servicio cloud-init lee esos metadatos del proveedor y aplica la configuración: crea el usuario, inyecta la clave, instala paquetes y ejecuta los comandos finales sin intervención manual. Es independiente del proveedor y también preconfigura contenedores LXD.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .file-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .file-head { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1E36AF; }
      .file-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #334155; }
      .svc-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #065F46; }
      .svc-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .out-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .out-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .band-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; }
      .band-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #BE123C; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="cloudinit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">CLOUD-INIT · PRIMER ARRANQUE</text>
    <text class="title" x="40" y="78">Del user-data al sistema configurado</text>
    <text class="subtitle" x="40" y="102">#cloud-config en la primera línea, sin espacios.</text>
  </g>

  <g id="diagram-relations">
    <path id="cloudinit-rel-file-service" class="edge-blue" data-from="node-userdata" data-to="node-service" data-relation="is-read-by"
          d="M 290 230 H 350" marker-end="url(#cloudinit-arrow)"/>
    <path id="cloudinit-rel-service-result" class="edge-blue" data-from="node-service" data-to="node-result" data-relation="applies-config"
          d="M 570 230 H 630" marker-end="url(#cloudinit-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-userdata">
      <rect class="node-file" x="40" y="150" width="250" height="176" rx="10"/>
      <text class="file-title" x="62" y="178">user-data (YAML)</text>
      <text class="file-head" x="62" y="204">#cloud-config</text>
      <text class="file-line" x="62" y="226">hostname: web-node-01</text>
      <text class="file-line" x="62" y="246">users: sysadmin + sudo</text>
      <text class="file-line" x="62" y="266">ssh_authorized_keys:</text>
      <text class="file-line" x="62" y="286">packages: nginx, curl</text>
      <text class="file-line" x="62" y="306">runcmd: arranca nginx</text>
    </g>

    <g id="node-service">
      <rect class="node-kernel" x="350" y="150" width="220" height="176" rx="10"/>
      <text class="svc-title" x="372" y="186">cloud-init</text>
      <text class="svc-line" x="372" y="214">servicio de primer</text>
      <text class="svc-line" x="372" y="234">arranque: lee los</text>
      <text class="svc-line" x="372" y="254">metadatos del</text>
      <text class="svc-line" x="372" y="274">proveedor</text>
    </g>

    <g id="node-result">
      <rect class="node-cmd" x="630" y="150" width="290" height="176" rx="10"/>
      <text class="out-title" x="652" y="186">Aplica la configuración</text>
      <text class="out-line" x="652" y="214">usuario y sudo</text>
      <text class="out-line" x="652" y="236">clave SSH pública</text>
      <text class="out-line" x="652" y="258">paquetes y runcmd</text>
      <text class="out-line" x="652" y="280">sin login manual</text>
    </g>

    <g id="node-band">
      <rect class="band" x="40" y="344" width="880" height="132" rx="10"/>
      <text class="band-head" x="62" y="370">EN CADA ARRANQUE Y EN CADA PROVEEDOR</text>
      <text class="band-line" x="62" y="394">Independiente del proveedor: también preconfigura</text>
      <text class="band-line" x="62" y="414">contenedores LXD antes de desplegarlos.</text>
      <text class="band-line" x="62" y="438">La primera línea debe ser exactamente</text>
      <text class="band-mono" x="368" y="438">#cloud-config</text>
      <text class="band-line" x="62" y="460">sin espacio entre # y cloud-config.</text>
    </g>
  </g>
</svg>
