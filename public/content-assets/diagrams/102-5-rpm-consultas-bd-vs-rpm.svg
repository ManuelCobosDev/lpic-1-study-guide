<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rqc-title rqc-desc">
  <title id="rqc-title">Consultas de rpm: base de datos local frente a un archivo .rpm en disco (LPIC-1 102.5)</title>
  <desc id="rqc-desc">La familia de consultas rpm -q se bifurca según el objeto consultado. Sin la opción -p se interroga la base de datos local /var/lib/rpm/ del software ya instalado: rpm -qa lista todos los paquetes, rpm -ql lista los ficheros de un paquete, rpm -qc solo sus ficheros de configuración y rpm -qf dice qué paquete instaló una ruta. Con la opción -p se lee directamente la cabecera de un archivo .rpm descargado que no está instalado, lo que se ve en el campo Install Date: (not installed) de rpm -qpi, y se combina con -l y -c como rpm -qpl o rpm -qpc.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-query { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-db { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-file { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .mono-root { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #334155; }
      .sub-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="rqc-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">RPM · CONSULTAS</text>
    <text class="title" x="40" y="78">La consulta cambia según el objeto</text>
    <text class="subtitle" x="40" y="102">Paquete ya instalado o archivo .rpm descargado</text>
  </g>

  <g id="diagram-relations">
    <path id="rqc-rel-query-db" class="edge-blue"
          data-from="node-query" data-to="node-installed" data-relation="consulta-base-local"
          d="M 480 206 V 238 H 254 V 268" marker-end="url(#rqc-arrow-blue)"/>
    <path id="rqc-rel-query-file" class="edge-blue"
          data-from="node-query" data-to="node-rpm-file" data-relation="consulta-archivo-disco"
          d="M 480 206 V 238 H 706 V 268" marker-end="url(#rqc-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-query">
      <rect class="node-query" x="330" y="118" width="300" height="88" rx="10"/>
      <text class="mono-root" x="480" y="158">rpm -q…</text>
      <text class="sub-center" x="480" y="186">la opción decide qué se lee</text>
    </g>

    <g id="node-installed">
      <rect class="panel-db" x="40" y="268" width="428" height="224" rx="10"/>
      <text class="panel-head" x="64" y="294">BASE DE DATOS LOCAL</text>
      <text class="sub" x="64" y="316">El software ya está instalado</text>
      <text class="mono-cmd" x="64" y="344">rpm -q[a|i|l|c|f]</text>
      <line class="divider" x1="64" y1="358" x2="444" y2="358"/>
      <text class="mono-sm" x="64" y="382">/var/lib/rpm/</text>
      <text class="sub" x="64" y="406">rpm -qa: todos los instalados</text>
      <text class="sub" x="64" y="428">rpm -ql nginx: sus ficheros</text>
      <text class="sub" x="64" y="450">rpm -qc nginx: solo /etc/</text>
      <text class="sub" x="64" y="472">rpm -qf /bin/ls: quién lo puso</text>
    </g>

    <g id="node-rpm-file">
      <rect class="panel-file" x="492" y="268" width="428" height="224" rx="10"/>
      <text class="panel-head" x="516" y="294">FICHERO .RPM EN DISCO</text>
      <text class="sub" x="516" y="316">El software no está instalado</text>
      <text class="mono-cmd" x="516" y="344">rpm -qp[i|l|c]</text>
      <line class="divider" x1="516" y1="358" x2="896" y2="358"/>
      <text class="mono-sm" x="516" y="382">Install Date: (not installed)</text>
      <text class="sub" x="516" y="406">rpm -qpi /tmp/tree.rpm: metadatos</text>
      <text class="sub" x="516" y="428">rpm -qpl /tmp/tree.rpm: qué instalará</text>
      <text class="sub" x="516" y="450">rpm -qpc /tmp/tree.rpm: sus ficheros</text>
      <text class="sub" x="516" y="472">La -p lee el archivo, no la base</text>
    </g>
  </g>
</svg>
