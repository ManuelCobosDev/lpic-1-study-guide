<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lc-dir-title lc-dir-desc">
  <title id="lc-dir-title">Contador de enlaces en directorios y fórmula de subdirectorios (LPIC-1 104.6)</title>
  <desc id="lc-dir-desc">Todo directorio nace con dos enlaces: la entrada con su nombre dentro del directorio padre y el enlace especial punto que apunta a sí mismo. Cada subdirectorio que se crea añade uno más al contador del padre, porque su entrada doble punto apunta de vuelta a él, de modo que el número de subdirectorios directos se obtiene restando dos al link count mostrado por ls -ld. Con un contador de 14 el directorio contiene 12 subdirectorios directos.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-dir { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2.5; }
      .node-ref { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-formula { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .sub-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .formula-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.08em; text-anchor: middle; }
      .formula-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .formula-example { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #047857; text-anchor: middle; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>

    <marker id="lc-dir-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.6 · LINK COUNT EN DIRECTORIOS</text>
    <text class="title" x="40" y="78">La fórmula que el examen pregunta</text>
    <text class="subtitle" x="40" y="102">Link count − 2 = subdirectorios directos</text>
  </g>

  <g id="diagram-relations">
    <path id="lc-dir-rel-padre" class="edge-blue"
          data-from="node-padre" data-to="node-dir" data-relation="name-entry-in-parent"
          d="M 270 244 H 360" marker-end="url(#lc-dir-arrow)"/>

    <path id="lc-dir-rel-punto" class="edge-blue"
          data-from="node-punto" data-to="node-dir" data-relation="self-reference"
          d="M 490 168 V 200" marker-end="url(#lc-dir-arrow)"/>

    <path id="lc-dir-rel-subcarpeta" class="edge-blue"
          data-from="node-subcarpeta" data-to="node-dir" data-relation="parent-entry"
          d="M 490 330 V 290" marker-end="url(#lc-dir-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-padre">
      <rect class="node-ref" x="40" y="212" width="230" height="64" rx="9"/>
      <text class="mono-sm" x="64" y="238">/home</text>
      <text class="sub" x="64" y="260">entrada «alumno»</text>
    </g>

    <g id="node-punto">
      <rect class="node-ref" x="380" y="112" width="220" height="56" rx="9"/>
      <text class="mono-sm" x="404" y="136">. (punto)</text>
      <text class="sub" x="404" y="156">apunta a sí mismo</text>
    </g>

    <g id="node-dir">
      <rect class="node-dir" x="360" y="200" width="260" height="90" rx="10"/>
      <text class="mono" x="384" y="230">/home/alumno</text>
      <text class="sub" x="384" y="254">inodo 7001 · link count 3</text>
      <text class="sub" x="384" y="272">2 fijas + 1 subcarpeta</text>
    </g>

    <g id="node-subcarpeta">
      <rect class="node-ref" x="360" y="330" width="260" height="64" rx="9"/>
      <text class="mono-sm" x="384" y="356">proyectos/..</text>
      <text class="sub" x="384" y="378">cada subcarpeta suma +1</text>
    </g>

    <g id="node-formula">
      <rect class="node-formula" x="660" y="190" width="260" height="170" rx="10"/>
      <text class="formula-label" x="790" y="218">SUBDIRECTORIOS DIRECTOS</text>
      <text class="formula-text" x="790" y="256">LC − 2</text>
      <text class="formula-example" x="790" y="292">ls -ld /var/log → 14</text>
      <text class="formula-example" x="790" y="316">14 − 2 = 12 subcarpetas</text>
    </g>

    <g id="node-banda">
      <rect class="band" x="40" y="424" width="880" height="76" rx="10"/>
      <text class="band-text" x="64" y="454">Todo directorio nace con dos enlaces: su nombre en el directorio padre y su propio «.».</text>
      <text class="band-text" x="64" y="478">Los demás enlaces los aporta el «..» de cada subdirectorio que contiene.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="315" cy="224" r="11"/>
    <text class="badge-num" x="315" y="228">1</text>
    <circle class="badge" cx="452" cy="180" r="11"/>
    <text class="badge-num" x="452" y="184">2</text>
    <circle class="badge" cx="452" cy="314" r="11"/>
    <text class="badge-num" x="452" y="318">3</text>
  </g>
</svg>
