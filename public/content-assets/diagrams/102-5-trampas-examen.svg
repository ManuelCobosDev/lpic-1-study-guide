<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="trp-title trp-desc">
  <title id="trp-title">Las cuatro trampas clásicas de examen en el ecosistema RPM, con el error y la respuesta correcta (LPIC-1 102.5)</title>
  <desc id="trp-desc">Cuatro tarjetas de trampas de examen, cada una con el error marcado como MAL y la respuesta correcta marcada como BIEN. La primera confunde rpm -F con rpm -U: -F solo actualiza un paquete ya instalado y -U lo instala si falta. La segunda olvida la opción -p al consultar un archivo .rpm descargado: rpm -qpl tree.rpm frente a rpm -ql tree.rpm. La tercera pone la extensión .rpm al desinstalar: rpm -e tree y no rpm -e tree-1.8.2.rpm. La cuarta responde rpm -qf cuando el archivo no está en disco, y la respuesta correcta es yum provides o dnf provides.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-warn { fill: #FFFFFF; stroke: #E11D48; stroke-width: 1.5; }
      .card-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .mal { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
      .bien-strip { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .bien { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #065F46; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">TRAMPAS DE EXAMEN · ECOSISTEMA RPM</text>
    <text class="title" x="40" y="78">Cuatro trampas que cuestan puntos</text>
    <text class="subtitle" x="40" y="102">El error y la respuesta correcta, una al lado de otra</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-trampa-1">
      <rect class="card-warn" x="40" y="126" width="424" height="172" rx="10"/>
      <text class="card-head" x="64" y="152">TRAMPA 1 · UPGRADE Y FRESHEN</text>
      <text class="card-title" x="64" y="178">¿-F instala si el paquete falta?</text>
      <text class="mal" x="64" y="204">MAL: dar por hecho que -F lo instala</text>
      <rect class="bien-strip" x="56" y="220" width="392" height="30" rx="7"/>
      <text class="bien" x="72" y="240">BIEN: -F solo actualiza; -U sí instala</text>
      <text class="mono-cmd" x="64" y="276">rpm -Fvh pkg.rpm  ·  rpm -Uvh pkg.rpm</text>
    </g>

    <g id="node-trampa-2">
      <rect class="card-warn" x="496" y="126" width="424" height="172" rx="10"/>
      <text class="card-head" x="520" y="152">TRAMPA 2 · FALTA LA OPCIÓN -p</text>
      <text class="card-title" x="520" y="178">¿rpm -ql lista un .rpm descargado?</text>
      <text class="mal" x="520" y="204">MAL: rpm -ql tree.rpm, sin la opción -p</text>
      <rect class="bien-strip" x="512" y="220" width="392" height="30" rx="7"/>
      <text class="bien" x="528" y="240">BIEN: rpm -qpl tree.rpm lee el archivo</text>
      <text class="mono-cmd" x="520" y="276">rpm -qpl tree.rpm</text>
    </g>

    <g id="node-trampa-3">
      <rect class="card-warn" x="40" y="312" width="424" height="172" rx="10"/>
      <text class="card-head" x="64" y="338">TRAMPA 3 · rpm -e CON .rpm</text>
      <text class="card-title" x="64" y="364">¿Desinstalar con la extensión .rpm?</text>
      <text class="mal" x="64" y="390">MAL: rpm -e tree-1.8.2.rpm</text>
      <rect class="bien-strip" x="56" y="406" width="392" height="30" rx="7"/>
      <text class="bien" x="72" y="426">BIEN: rpm -e tree, el nombre lógico</text>
      <text class="mono-cmd" x="64" y="462">rpm -e tree</text>
    </g>

    <g id="node-trampa-4">
      <rect class="card-warn" x="496" y="312" width="424" height="172" rx="10"/>
      <text class="card-head" x="520" y="338">TRAMPA 4 · QUIÉN PROVEE</text>
      <text class="card-title" x="520" y="364">¿rpm -qf si el archivo no está?</text>
      <text class="mal" x="520" y="390">MAL: rpm -qf /ruta sin el fichero en disco</text>
      <rect class="bien-strip" x="512" y="406" width="392" height="30" rx="7"/>
      <text class="bien" x="528" y="426">BIEN: dnf provides /ruta (o zypper wp)</text>
      <text class="mono-cmd" x="520" y="462">rpm -qf /ruta  ·  yum provides /ruta</text>
    </g>
  </g>
</svg>
