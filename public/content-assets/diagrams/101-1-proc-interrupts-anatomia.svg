<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="irq-title irq-desc">
  <title id="irq-title">Anatomía de una línea de /proc/interrupts y qué es una IRQ (LPIC-1 101.1)</title>
  <desc id="irq-desc">La fila de /proc/interrupts se lee por columnas: el número de IRQ, el contador de avisos recibidos en cada CPU (CPU0 y CPU1), el controlador IO-APIC que reparte la señal y el dispositivo que la genera, en este caso el teclado PS/2 i8042. Una banda inferior recuerda que una IRQ es un aviso del periférico a la CPU y que, sin ella, el procesador tendría que preguntar en bucle a cada dispositivo mediante polling.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .output-card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .col-head { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .field { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .field-dim { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .note-band { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .guide { fill: none; stroke: #94A3B8; stroke-width: 1.5; }
      .label-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .label-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PSEUDO-SISTEMA /proc · INTERRUPCIONES</text>
    <text class="title" x="40" y="78">Cómo se lee una línea de /proc/interrupts</text>
    <text class="subtitle" x="40" y="102">IRQ, contador por CPU y dispositivo en una fila.</text>
  </g>

  <g id="diagram-relations">
    <path id="irq-guide-numero" class="guide" d="M 112 232 V 296"/>
    <path id="irq-guide-contador" class="guide" d="M 224 232 V 280 H 306 V 232"/>
    <path id="irq-guide-contador-drop" class="guide" d="M 265 280 V 296"/>
    <path id="irq-guide-controlador" class="guide" d="M 422 232 V 296"/>
    <path id="irq-guide-dispositivo" class="guide" d="M 630 232 V 296"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-salida-proc">
      <rect class="output-card" x="40" y="124" width="880" height="140" rx="10"/>
      <text class="col-head" x="224" y="160">CPU0</text>
      <text class="col-head" x="306" y="160">CPU1</text>
      <text class="field" x="100" y="212">1:</text>
      <text class="field" x="200" y="212">9542</text>
      <text class="field" x="300" y="212">0</text>
      <text class="field-dim" x="380" y="212">IO-APIC</text>
      <text class="field" x="600" y="212">i8042</text>
    </g>

    <g id="node-banda-irq">
      <rect class="note-band" x="40" y="390" width="880" height="110" rx="10"/>
      <text class="band-title" x="64" y="420">Una IRQ es un timbre, no un sondeo</text>
      <text class="band-text" x="64" y="448">El periférico avisa a la CPU solo cuando tiene datos listos.</text>
      <text class="band-text" x="64" y="470">Sin IRQ, la CPU preguntaría en bucle a cada dispositivo (polling).</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="label-title" x="112" y="318">Número de IRQ</text>
    <text class="label-text" x="112" y="340">IRQ 1 = teclado PS/2</text>

    <text class="label-title" x="265" y="318">Avisos recibidos</text>
    <text class="label-text" x="265" y="340">un contador por CPU</text>

    <text class="label-title" x="422" y="318">Controlador</text>
    <text class="label-text" x="422" y="340">IO-APIC reparte la señal</text>

    <text class="label-title" x="630" y="318">Dispositivo</text>
    <text class="label-text" x="630" y="340">i8042 = teclado PS/2</text>
  </g>
</svg>
