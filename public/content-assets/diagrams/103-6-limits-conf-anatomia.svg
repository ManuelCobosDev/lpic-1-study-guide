<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lim-title lim-desc">
  <title id="lim-title">Anatomía de una línea de /etc/security/limits.conf con las cuatro columnas (LPIC-1 103.6)</title>
  <desc id="lim-desc">Cada línea de /etc/security/limits.conf tiene cuatro campos. El primero es el grupo o el usuario al que se aplica, aquí el grupo @devs. El segundo es el tipo de límite, hard para el techo infranqueable. El tercero es el recurso que se limita, aquí nice. El cuarto es el límite asignado, en este caso -10. Con esa directiva, el nice negativo deja de exigir sudo: pam_limits.so lee el archivo al iniciar sesión y aplica el techo en cada login del usuario.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .conf { fill: #FFFFFF; stroke: #475569; stroke-width: 2.5; }
      .token { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .token-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .token-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PAM · /etc/security/limits.conf</text>
    <text class="title" x="40" y="78">Anatomía de una línea de límites</text>
    <text class="subtitle" x="40" y="102">Cuatro campos por línea: quién, tipo de límite,</text>
    <text class="subtitle" x="40" y="122">recurso afectado y valor asignado.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-linea">
      <rect class="conf" x="40" y="160" width="880" height="170" rx="10"/>
      <circle class="badge" cx="150" cy="200" r="14"/>
      <text class="badge-num" x="150" y="205">1</text>
      <circle class="badge" cx="370" cy="200" r="14"/>
      <text class="badge-num" x="370" y="205">2</text>
      <circle class="badge" cx="590" cy="200" r="14"/>
      <text class="badge-num" x="590" y="205">3</text>
      <circle class="badge" cx="810" cy="200" r="14"/>
      <text class="badge-num" x="810" y="205">4</text>
      <text class="token" x="150" y="256">@devs</text>
      <text class="token-label" x="150" y="286">grupo o usuario</text>
      <text class="token-sub" x="150" y="308">a quien se aplica</text>
      <text class="token" x="370" y="256">hard</text>
      <text class="token-label" x="370" y="286">techo infranqueable</text>
      <text class="token-sub" x="370" y="308">no se puede superar</text>
      <text class="token" x="590" y="256">nice</text>
      <text class="token-label" x="590" y="286">recurso a limitar</text>
      <text class="token-sub" x="590" y="308">prioridad del proceso</text>
      <text class="token" x="810" y="256">-10</text>
      <text class="token-label" x="810" y="286">límite asignado</text>
      <text class="token-sub" x="810" y="308">valor concedido</text>
    </g>

    <g id="node-aviso">
      <rect class="warn" x="40" y="350" width="880" height="112" rx="10"/>
      <text class="warn-title" x="64" y="386">Sin esta directiva, el nice negativo exige sudo</text>
      <text class="warn-body" x="64" y="412">pam_limits.so lee /etc/security/limits.conf al iniciar sesión</text>
      <text class="warn-body" x="64" y="434">y aplica el techo de nice en cada login del usuario.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="260" y1="176" x2="260" y2="314"/>
    <line class="divider" x1="480" y1="176" x2="480" y2="314"/>
    <line class="divider" x1="700" y1="176" x2="700" y2="314"/>
  </g>
</svg>
