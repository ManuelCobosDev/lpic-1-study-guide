<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="find-anatomia-title find-anatomia-desc">
  <title id="find-anatomia-title">Anatomía de un comando find con ruta, tipo, nombre y tamaño (LPIC-1 103.3)</title>
  <desc id="find-anatomia-desc">El comando find /var/log -type f -name '*.log' -size +10M se lee de izquierda a derecha: la ruta de inicio /var/log es el punto de partida recursivo y si se omite se usa el directorio actual; -type f limita la búsqueda a ficheros regulares, con d para directorios y l para enlaces simbólicos; -name '*.log' filtra por nombre y debe ir entre comillas para que la shell no expanda el patrón; y -size +10M selecciona los mayores de 10 MB, mientras que -100k pide los menores de 100 KB y 500c los de exactamente 500 bytes. La ruta de inicio va siempre antes que las opciones.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .ribbon { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
      .command { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .bar-blue { fill: #2550EB; }
      .bar-amber { fill: #D97706; }
      .bar-emerald { fill: #059669; }
      .bar-slate { fill: #475569; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .card-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">find · RUTA, TIPO, NOMBRE Y TAMAÑO</text>
    <text class="title" x="40" y="78">Una ruta y cuatro filtros</text>
    <text class="subtitle" x="40" y="102">Cada opción añade una condición a la búsqueda.</text>
    <rect class="ribbon" x="40" y="146" width="880" height="64" rx="8"/>
    <text class="command" x="480" y="186">find /var/log -type f -name '*.log' -size +10M</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-ruta">
      <rect class="card" x="40" y="246" width="214" height="150" rx="8"/>
      <rect class="bar-blue" x="40" y="246" width="214" height="6" rx="3"/>
      <text class="card-mono" x="60" y="288">/var/log</text>
      <text class="card-body" x="60" y="318">Punto de partida.</text>
      <text class="card-body" x="60" y="342">Si se omite, find usa</text>
      <text class="card-body" x="60" y="366">el directorio actual.</text>
    </g>

    <g id="node-tipo">
      <rect class="card" x="262" y="246" width="214" height="150" rx="8"/>
      <rect class="bar-amber" x="262" y="246" width="214" height="6" rx="3"/>
      <text class="card-mono" x="282" y="288">-type f</text>
      <text class="card-body" x="282" y="318">Solo ficheros regulares</text>
      <text class="card-body" x="282" y="342">d = directorio,</text>
      <text class="card-body" x="282" y="366">l = enlace simbólico.</text>
    </g>

    <g id="node-nombre">
      <rect class="card" x="484" y="246" width="214" height="150" rx="8"/>
      <rect class="bar-emerald" x="484" y="246" width="214" height="6" rx="3"/>
      <text class="card-mono" x="504" y="288">-name '*.log'</text>
      <text class="card-body" x="504" y="318">Siempre entre comillas:</text>
      <text class="card-body" x="504" y="342">la shell no expande</text>
      <text class="card-body" x="504" y="366">el patrón.</text>
    </g>

    <g id="node-tamano">
      <rect class="card" x="706" y="246" width="214" height="150" rx="8"/>
      <rect class="bar-slate" x="706" y="246" width="214" height="6" rx="3"/>
      <text class="card-mono" x="726" y="288">-size +10M</text>
      <text class="card-body" x="726" y="318">Mayores de 10 MB (+);</text>
      <text class="card-body" x="726" y="342">menores de 100k (-);</text>
      <text class="card-body" x="726" y="366">500c son 500 bytes.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="448">La ruta de inicio va siempre antes que las opciones.</text>
    <text class="note" x="40" y="472">Sin comillas, la shell expande el patrón antes.</text>
  </g>
</svg>
