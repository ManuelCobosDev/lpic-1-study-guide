<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vi-buffer-title vi-buffer-desc">
  <title id="vi-buffer-title">Flujo de copia y pegado en vi: yy y dd llenan el búfer y p o P lo pegan (LPIC-1 103.8)</title>
  <desc id="vi-buffer-desc">En vi copiar y cortar comparten el mismo búfer interno. yy copia la línea actual sin borrarla, N veces yy copia N líneas consecutivas y dd corta la línea y la guarda en el búfer; las dos acciones almacenan el texto. Después, p pega el contenido debajo de la línea actual y P lo pega encima. El historial de cambios se controla con u, que deshace el último cambio, y Ctrl+R, que rehace lo deshecho. Además del búfer sin nombre existen registros con nombre, a los que se copia y de los que se pega con comillas dobles y la letra del registro, y marcas de posición que se crean con m y se recuperan con el apóstrofo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-buffer { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .mono-name-big { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .node-sub-slate { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .band-header { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .band-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="vbuf-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">VI · YANK, PUT, UNDO Y REGISTROS</text>
    <text class="title" x="40" y="78">Copiar y cortar comparten el mismo búfer</text>
    <text class="subtitle" x="40" y="102">Copiar y cortar dejan el texto en el mismo búfer.</text>
  </g>

  <g id="diagram-relations">
    <path id="vbuf-rel-yy-buffer" class="edge" data-from="node-yy" data-to="node-buffer" data-relation="yank-guarda-en-bufer"
          d="M 312 188 H 336 V 225 H 360" marker-end="url(#vbuf-arrow-blue)"/>

    <path id="vbuf-rel-dd-buffer" class="edge" data-from="node-dd" data-to="node-buffer" data-relation="delete-guarda-en-bufer"
          d="M 312 284 H 336 V 265 H 360" marker-end="url(#vbuf-arrow-blue)"/>

    <path id="vbuf-rel-buffer-put" class="edge" data-from="node-buffer" data-to="node-put" data-relation="put-inserta-el-texto"
          d="M 620 245 H 676" marker-end="url(#vbuf-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-yy">
      <rect class="node-cmd" x="40" y="150" width="272" height="76" rx="10"/>
      <text class="mono-name" x="64" y="182">yy · &lt;N&gt;yy</text>
      <text class="node-sub" x="64" y="208">copia sin borrar la línea</text>
    </g>

    <g id="node-dd">
      <rect class="node-cmd" x="40" y="246" width="272" height="76" rx="10"/>
      <text class="mono-name" x="64" y="278">dd</text>
      <text class="node-sub" x="64" y="304">corta y guarda en el búfer</text>
    </g>

    <g id="node-buffer">
      <rect class="node-buffer" x="360" y="180" width="260" height="130" rx="10"/>
      <text class="mono-name-big" x="384" y="216">búfer</text>
      <text class="node-sub-slate" x="384" y="246">almacena la línea</text>
      <text class="node-sub-slate" x="384" y="268">copiada o cortada</text>
      <text class="node-sub-slate" x="384" y="290">hasta que la pegas</text>
    </g>

    <g id="node-put">
      <rect class="node-cmd" x="676" y="180" width="244" height="130" rx="10"/>
      <text class="mono-name-big" x="700" y="216">p · P</text>
      <text class="node-sub" x="700" y="246">p pega debajo</text>
      <text class="node-sub" x="700" y="268">P pega encima</text>
      <text class="node-sub" x="700" y="290">de la línea actual</text>
    </g>

    <g id="node-historial">
      <rect class="node-band" x="40" y="348" width="880" height="140" rx="10"/>
      <text class="band-header" x="64" y="376">HISTORIAL DE CAMBIOS Y PORTAPAPELES MÚLTIPLE</text>
      <text class="band-mono" x="64" y="412">u · Ctrl+R</text>
      <text class="band-sub" x="64" y="438">deshace el último cambio</text>
      <text class="band-sub" x="64" y="462">Ctrl+R rehace lo deshecho</text>
      <text class="band-mono" x="380" y="412">"ay · "ap</text>
      <text class="band-sub" x="380" y="438">registros con nombre</text>
      <text class="band-sub" x="380" y="462">el registro a copia y pega</text>
      <text class="band-mono" x="680" y="412">m / '</text>
      <text class="band-sub" x="680" y="438">marcas de posición</text>
      <text class="band-sub" x="680" y="462">ma marca; 'a salta</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="352" y1="392" x2="352" y2="472"/>
    <line class="divider" x1="660" y1="392" x2="660" y2="472"/>
  </g>
</svg>

