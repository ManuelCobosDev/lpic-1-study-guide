<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-uname-title p1031-uname-desc">
  <title id="p1031-uname-title">Anatomía de la salida de uname -a (LPIC-1 103.1)</title>
  <desc id="p1031-uname-desc">La salida de uname -a se divide en seis campos: Linux (-s), servidor01 (-n), 6.1.0-21-amd64 (-r), #1 SMP Debian (-v), x86_64 (-m) y GNU/Linux (-o). Cada campo lleva debajo la opción que lo imprime y su nombre. Dos tarjetas inferiores detallan el release del kernel, necesario para linux-headers y DKMS, y la arquitectura x86_64 frente a aarch64.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .seg-out { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .out { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .chip { fill: #EFF4FF; stroke: #2550EB; stroke-width: 1.5; }
      .chip-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .field { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .card-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .card-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">UNAME · AUDITORÍA DEL SISTEMA</text>
    <text class="title" x="40" y="78">La salida de uname -a, campo por campo</text>
    <text class="subtitle" x="40" y="102">uname -a imprime todos los campos en una línea;</text>
    <text class="subtitle" x="40" y="122">cada uno lo controla una opción distinta.</text>
  </g>

  <g id="diagram-nodes">
    <g id="out-s">
      <rect class="seg-out" x="43" y="160" width="100" height="68" rx="8"/>
      <text class="out" x="93" y="203">Linux</text>
    </g>
    <g id="out-n">
      <rect class="seg-out" x="149" y="160" width="150" height="68" rx="8"/>
      <text class="out" x="224" y="203">servidor01</text>
    </g>
    <g id="out-r">
      <rect class="seg-out" x="305" y="160" width="174" height="68" rx="8"/>
      <text class="out" x="392" y="203">6.1.0-21-amd64</text>
    </g>
    <g id="out-v">
      <rect class="seg-out" x="485" y="160" width="170" height="68" rx="8"/>
      <text class="out" x="570" y="203">#1 SMP Debian</text>
    </g>
    <g id="out-m">
      <rect class="seg-out" x="661" y="160" width="110" height="68" rx="8"/>
      <text class="out" x="716" y="203">x86_64</text>
    </g>
    <g id="out-o">
      <rect class="seg-out" x="777" y="160" width="140" height="68" rx="8"/>
      <text class="out" x="847" y="203">GNU/Linux</text>
    </g>

    <g id="flag-s">
      <rect class="chip" x="63" y="246" width="60" height="28" rx="7"/>
      <text class="chip-text" x="93" y="266">-s</text>
    </g>
    <g id="flag-n">
      <rect class="chip" x="194" y="246" width="60" height="28" rx="7"/>
      <text class="chip-text" x="224" y="266">-n</text>
    </g>
    <g id="flag-r">
      <rect class="chip" x="362" y="246" width="60" height="28" rx="7"/>
      <text class="chip-text" x="392" y="266">-r</text>
    </g>
    <g id="flag-v">
      <rect class="chip" x="540" y="246" width="60" height="28" rx="7"/>
      <text class="chip-text" x="570" y="266">-v</text>
    </g>
    <g id="flag-m">
      <rect class="chip" x="686" y="246" width="60" height="28" rx="7"/>
      <text class="chip-text" x="716" y="266">-m</text>
    </g>
    <g id="flag-o">
      <rect class="chip" x="817" y="246" width="60" height="28" rx="7"/>
      <text class="chip-text" x="847" y="266">-o</text>
    </g>

    <g id="card-r">
      <rect class="card" x="43" y="340" width="434" height="112" rx="10"/>
      <text class="card-head" x="63" y="372">-r · release del kernel</text>
      <text class="card-mono" x="63" y="404">6.1.0-21-amd64</text>
      <text class="card-note" x="63" y="432">Base para linux-headers y módulos DKMS.</text>
    </g>

    <g id="card-m">
      <rect class="card" x="483" y="340" width="434" height="112" rx="10"/>
      <text class="card-head" x="503" y="372">-m · arquitectura de CPU</text>
      <text class="card-mono" x="503" y="404">x86_64</text>
      <text class="card-note" x="503" y="432">64 bits Intel/AMD; una Raspberry Pi daría aarch64.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="field" x="93" y="304">nombre del kernel</text>
    <text class="field" x="224" y="304">nombre de host</text>
    <text class="field" x="392" y="304">release del kernel</text>
    <text class="field" x="570" y="304">compilación</text>
    <text class="field" x="716" y="304">arquitectura</text>
    <text class="field" x="847" y="304">sistema operativo</text>
    <text class="note" x="43" y="478">(-p y -i suelen devolver «unknown»</text>
    <text class="note" x="43" y="500">en GNU/Linux y no aparecen aquí)</text>
  </g>
</svg>
