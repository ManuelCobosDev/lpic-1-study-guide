<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visu-title visu-desc">
  <title id="visu-title">Tres familias de comandos para ver texto: volcado, paginador y comprimidos (LPIC-1 103.2)</title>
  <desc id="visu-desc">El volcado directo escribe todo el flujo en la pantalla: cat -n numera las líneas, tac invierte el orden, head -n muestra las primeras N y tail -n o tail -f las últimas o las nuevas. El paginador less no desborda la pantalla: avanza con flechas y espacio, busca con /patrón y se abandona con q. La familia de comprimidos, zcat para .gz, bzcat para .bz2 y xzcat para .xz, descomprime a stdout en memoria y nunca escribe el fichero extraído en disco, por lo que se encadena con tuberías a head o grep.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-c { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .head-c { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #92400E; }
      .key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">VISUALIZACIÓN · TRES FAMILIAS</text>
    <text class="title" x="40" y="78">Ver texto sin desbordar la pantalla</text>
    <text class="subtitle" x="40" y="102">Volcar, paginar o descomprimir en el flujo.</text>
  </g>

  <g id="diagram-nodes">
    <g id="panel-volcado">
      <rect class="panel-a" x="40" y="140" width="282" height="292" rx="10"/>
      <text class="head-a" x="62" y="172">Volcado directo</text>
      <line class="divider" x1="62" y1="186" x2="300" y2="186"/>
      <text class="key" x="62" y="214">cat -n srv.txt</text>
      <text class="desc" x="62" y="232">numera todas las líneas</text>
      <text class="key" x="62" y="270">tac</text>
      <text class="desc" x="62" y="288">invierte el orden: de abajo arriba</text>
      <text class="key" x="62" y="326">head -n / tail -n</text>
      <text class="desc" x="62" y="344">primeras o últimas N líneas</text>
      <text class="key" x="62" y="382">tail -f /var/log/syslog</text>
      <text class="desc" x="62" y="400">en vivo: espera líneas nuevas</text>
    </g>

    <g id="panel-paginador">
      <rect class="panel-b" x="339" y="140" width="282" height="292" rx="10"/>
      <text class="head-b" x="361" y="172">Paginador interactivo</text>
      <line class="divider" x1="361" y1="186" x2="599" y2="186"/>
      <text class="key" x="361" y="214">less fichero</text>
      <text class="desc" x="361" y="232">no desborda la pantalla</text>
      <text class="key" x="361" y="270">flechas y espacio</text>
      <text class="desc" x="361" y="288">avanzan y retroceden</text>
      <text class="key" x="361" y="326">/patrón</text>
      <text class="desc" x="361" y="344">busca dentro del fichero</text>
      <text class="key" x="361" y="382">q</text>
      <text class="desc" x="361" y="400">vuelve al prompt</text>
    </g>

    <g id="panel-comprimidos">
      <rect class="panel-c" x="638" y="140" width="282" height="292" rx="10"/>
      <text class="head-c" x="660" y="172">Comprimidos sin extraer</text>
      <line class="divider" x1="660" y1="186" x2="898" y2="186"/>
      <text class="key" x="660" y="214">zcat arch.gz</text>
      <text class="desc" x="660" y="232">gzip directo a stdout</text>
      <text class="key" x="660" y="270">bzcat arch.bz2</text>
      <text class="desc" x="660" y="288">bzip2 directo a stdout</text>
      <text class="key" x="660" y="326">xzcat arch.xz</text>
      <text class="desc" x="660" y="344">xz / LZMA directo a stdout</text>
      <text class="key" x="660" y="382">head -n 3</text>
      <text class="desc" x="660" y="400">recibe el flujo por tubería</text>
    </g>

    <g id="node-equivalencia">
      <rect class="verdict" x="40" y="448" width="880" height="52" rx="10"/>
      <text class="verdict-label" x="62" y="480">EQUIVALENCIA</text>
      <text class="verdict-text" x="186" y="480">zcat arch.gz equivale a gzip -dc arch.gz: descomprime al flujo, nunca al disco.</text>
    </g>
  </g>
</svg>
