<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="eco-title eco-desc">
  <title id="eco-title">Arquitectura de dos capas de Debian: APT sobre dpkg (LPIC-1 102.4)</title>
  <desc id="eco-desc">APT ocupa la capa de alto nivel: consulta los repositorios definidos en /etc/apt/sources.list, calcula el árbol completo de dependencias transitivas, descarga los paquetes .deb en /var/cache/apt/archives/ e invoca a dpkg para instalarlos en el orden correcto. dpkg ocupa la capa de bajo nivel: solo instala, borra y consulta ficheros .deb que ya están en el disco, no tiene acceso a la red, no resuelve dependencias y mantiene el estado de cada paquete en /var/lib/dpkg/status.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .layer-apt { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .layer-dpkg { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .layer-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .layer-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .layer-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #1E293B; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .label-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #1D40D8; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="eco-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ECOSISTEMA DEBIAN · ARQUITECTURA EN DOS CAPAS</text>
    <text class="title" x="40" y="78">Una resuelve en red, el otro ejecuta</text>
    <text class="subtitle" x="40" y="102">APT calcula y descarga; dpkg instala en el disco local.</text>
  </g>

  <g id="diagram-relations">
    <path id="eco-rel-apt-dpkg" class="edge-blue"
          data-from="node-capa-apt" data-to="node-capa-dpkg" data-relation="invoca-dpkg"
          d="M 480 272 V 312" marker-end="url(#eco-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-capa-apt">
      <rect class="layer-apt" x="40" y="132" width="880" height="140" rx="12"/>
      <text class="layer-head" x="64" y="162">CAPA DE ALTO NIVEL · RED Y DEPENDENCIAS</text>
      <text class="layer-name" x="64" y="194">APT · apt-get · apt-cache · apt</text>
      <text class="layer-text" x="64" y="224">Consulta /etc/apt/sources.list y calcula el árbol de dependencias.</text>
      <text class="layer-text" x="64" y="250">Descarga los .deb en /var/cache/apt/archives/ e invoca a dpkg.</text>
    </g>

    <g id="node-capa-dpkg">
      <rect class="layer-dpkg" x="40" y="312" width="880" height="156" rx="12"/>
      <text class="layer-head" x="64" y="342">CAPA DE BAJO NIVEL · MOTOR LOCAL .DEB</text>
      <text class="layer-name" x="64" y="374">dpkg · Debian Package Manager</text>
      <text class="layer-text" x="64" y="400">Instala, borra y consulta solo ficheros .deb locales.</text>
      <text class="layer-text" x="64" y="424">No usa la red ni resuelve dependencias: aborta si falta una.</text>
      <text class="layer-text" x="64" y="448">Estado de cada paquete en /var/lib/dpkg/status.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="label-bg" x="500" y="280" width="282" height="24" rx="6"/>
    <text class="label-text" x="514" y="297">APT ejecuta internamente a dpkg</text>
    <text class="note" x="40" y="488">El examen separa siempre las dos capas:</text>
    <text class="note" x="40" y="510">red y dependencias frente a disco local.</text>
  </g>
</svg>
