<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="letras-title letras-desc">
  <title id="letras-title">Lectura de la columna de estado de dpkg -l: estado deseado y estado real (LPIC-1 102.4)</title>
  <desc id="letras-desc">La salida de dpkg -l empieza por una columna de dos letras. La primera letra es el estado deseado: i de Install, h de Hold. La segunda letra es el estado real: i de Installed, c de Config-files, que indica paquete eliminado pero con la configuración conservada en /etc/. Después vienen las columnas de nombre, versión, arquitectura y descripción.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .out-panel { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .out-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .out-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 600; fill: #0F172A; }
      .mark-rect { fill: none; stroke: #D97706; stroke-width: 2; }
      .group-head-a { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; }
      .group-head-b { fill: #EFF4FF; stroke: #A9BCF5; stroke-width: 1.5; }
      .group-head-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .cell-a { fill: #FFFFFF; stroke: #475569; stroke-width: 1.5; }
      .cell-b { fill: #FFFFFF; stroke: #2550EB; stroke-width: 1.5; }
      .letter-a { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #475569; }
      .letter-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #2550EB; }
      .cell-name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .cell-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">DPKG · LEER LA COLUMNA DE ESTADO</text>
    <text class="title" x="40" y="78">Dos letras que lo dicen todo</text>
    <text class="subtitle" x="40" y="102">La salida de dpkg -l codifica el estado en dos caracteres.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-salida">
      <rect class="out-panel" x="40" y="126" width="880" height="68" rx="10"/>
      <text class="out-label" x="60" y="148">SALIDA DE dpkg -l bash</text>
      <text class="out-mono" x="60" xml:space="preserve" y="176">ii  bash  5.2.15-2+b7  amd64  GNU Bourne Again SHell</text>
      <rect class="mark-rect" x="54" y="156" width="34" height="26" rx="4"/>
    </g>

    <g id="node-cabecera-deseado">
      <rect class="group-head-a" x="40" y="210" width="420" height="34" rx="6"/>
      <text class="group-head-text" x="60" y="232">1.ª LETRA · ESTADO DESEADO</text>
    </g>

    <g id="node-cabecera-real">
      <rect class="group-head-b" x="500" y="210" width="420" height="34" rx="6"/>
      <text class="group-head-text" x="520" y="232">2.ª LETRA · ESTADO REAL</text>
    </g>

    <g id="node-celda-deseado-i">
      <rect class="cell-a" x="40" y="252" width="200" height="104" rx="8"/>
      <text class="letter-a" x="62" y="298">i</text>
      <text class="cell-name" x="102" y="286">Install</text>
      <text class="cell-line" x="102" y="312">se desea</text>
      <text class="cell-line" x="102" y="334">instalado</text>
    </g>

    <g id="node-celda-deseado-h">
      <rect class="cell-a" x="260" y="252" width="200" height="104" rx="8"/>
      <text class="letter-a" x="282" y="298">h</text>
      <text class="cell-name" x="322" y="286">Hold</text>
      <text class="cell-line" x="322" y="312">retenido:</text>
      <text class="cell-line" x="322" y="334">no se actualiza</text>
    </g>

    <g id="node-celda-real-i">
      <rect class="cell-b" x="500" y="252" width="200" height="104" rx="8"/>
      <text class="letter-b" x="522" y="298">i</text>
      <text class="cell-name" x="562" y="286">Installed</text>
      <text class="cell-line" x="562" y="312">instalado y</text>
      <text class="cell-line" x="562" y="334">configurado</text>
    </g>

    <g id="node-celda-real-c">
      <rect class="cell-b" x="720" y="252" width="200" height="104" rx="8"/>
      <text class="letter-b" x="742" y="298">c</text>
      <text class="cell-name" x="782" y="286">Config-files</text>
      <text class="cell-line" x="782" y="312">eliminado,</text>
      <text class="cell-line" x="782" y="334">conserva /etc/</text>
    </g>

    <g id="node-consulta-s">
      <rect class="out-panel" x="40" y="444" width="880" height="64" rx="10"/>
      <text class="out-mono" x="60" xml:space="preserve" y="472">dpkg-query -S /bin/ls  →  coreutils: /bin/ls</text>
      <text class="cell-line" x="60" y="494">Busca en /var/lib/dpkg/info/*.list; si la ruta no existe en disco, da error.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="396">La primera letra dice lo deseado; la segunda, lo real.</text>
    <text class="note" x="40" y="420">Después vienen nombre, versión, arquitectura y descripción.</text>
  </g>
</svg>
