<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rpo-title rpo-desc">
  <title id="rpo-title">Anatomía de un archivo .repo de /etc/yum.repos.d/ en YUM y DNF (LPIC-1 102.5)</title>
  <desc id="rpo-desc">Un archivo .repo como rocky.repo declara cada canal de software con siete directivas: el identificador único entre corchetes como [baseos], el nombre legible que ve el usuario, la baseurl con los paquetes y los metadatos repodata, la mirrorlist que devuelve la lista de espejos, enabled con 1 activo y 0 deshabilitado, gpgcheck con 1 para exigir la firma GPG y gpgkey con la ruta de la clave pública. YUM y DNF expanden además las variables releasever, la versión del sistema operativo, y basearch, la arquitectura del procesador.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .file-card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .file-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #475569; }
      .file-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .callout-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #334155; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .var-note { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">REPOSITORIOS YUM Y DNF · ARCHIVO .REPO</text>
    <text class="title" x="40" y="78">Anatomía de un archivo .repo</text>
    <text class="subtitle" x="40" y="102">Un archivo por canal dentro de /etc/yum.repos.d/</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-repo-file">
      <rect class="file-card" x="40" y="140" width="440" height="306" rx="10"/>
      <text class="file-name" x="64" y="166">rocky.repo</text>
      <line class="divider" x1="64" y1="176" x2="456" y2="176"/>
      <text class="file-line" x="64" y="210">[baseos]</text>
      <text class="file-line" x="64" y="246">name=Rocky Linux $releasever</text>
      <text class="file-line" x="64" y="282">baseurl=http://dl.rockylinux.org/…</text>
      <text class="file-line" x="64" y="318">mirrorlist=https://mirrors…</text>
      <text class="file-line" x="64" y="354">enabled=1</text>
      <text class="file-line" x="64" y="390">gpgcheck=1</text>
      <text class="file-line" x="64" y="426">gpgkey=file:///etc/pki/rpm-gpg/…</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="guide" x1="481" y1="205" x2="516" y2="205"/>
    <text class="callout-label" x="520" y="210">Identificador único, sin espacios</text>
    <line class="guide" x1="481" y1="241" x2="516" y2="241"/>
    <text class="callout-label" x="520" y="246">Nombre legible que ve el usuario</text>
    <line class="guide" x1="481" y1="277" x2="516" y2="277"/>
    <text class="callout-label" x="520" y="282">URL de paquetes y metadatos repodata/</text>
    <line class="guide" x1="481" y1="313" x2="516" y2="313"/>
    <text class="callout-label" x="520" y="318">URL que devuelve la lista de espejos</text>
    <line class="guide" x1="481" y1="349" x2="516" y2="349"/>
    <text class="callout-label" x="520" y="354">1 = activo · 0 = ignorado por completo</text>
    <line class="guide" x1="481" y1="385" x2="516" y2="385"/>
    <text class="callout-label" x="520" y="390">1 = firma GPG obligatoria antes de instalar</text>
    <line class="guide" x1="481" y1="421" x2="516" y2="421"/>
    <text class="callout-label" x="520" y="426">Clave pública que valida los paquetes</text>
    <line class="divider" x1="40" y1="462" x2="920" y2="462"/>
    <text class="var-note" x="40" y="490">$releasever: versión del sistema</text>
    <text class="var-note" x="470" y="490">$basearch: arquitectura (x86_64)</text>
  </g>
</svg>
