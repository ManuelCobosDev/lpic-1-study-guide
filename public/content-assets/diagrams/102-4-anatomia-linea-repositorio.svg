<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="repo-title repo-desc">
  <title id="repo-title">Anatomía de una línea de repositorio APT: tipo, URI, distribución y componentes (LPIC-1 102.4)</title>
  <desc id="repo-desc">Cada línea de /etc/apt/sources.list se divide en cuatro campos en este orden: el tipo deb para binarios o deb-src para código fuente, la URI del espejo por HTTP/HTTPS, FTP, file: o cdrom:, la distribución como codename bookworm o suite stable, y los componentes main, contrib, non-free y non-free-firmware en Debian. El orden es obligatorio y el tipo deb-src es imprescindible para descargar código fuente con apt-get source.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .seg { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .seg-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .seg-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .seg-mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .divider { stroke: #64748B; stroke-width: 1.5; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">APT · SINTAXIS DE UNA LÍNEA DE REPOSITORIO</text>
    <text class="title" x="40" y="78">Cuatro campos, en este orden</text>
    <text class="subtitle" x="40" y="102">Tipo, URI, distribución y componentes: T-U-D-C.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-campo-tipo">
      <rect class="seg" x="40" y="214" width="150" height="80" rx="8"/>
      <text class="seg-head" x="64" y="244">1 · TIPO</text>
      <text class="seg-mono" x="64" y="276">deb</text>
    </g>

    <g id="node-campo-uri">
      <rect class="seg" x="190" y="214" width="300" height="80" rx="0"/>
      <text class="seg-head" x="214" y="244">2 · URI O ESPEJO</text>
      <text class="seg-mono-sm" x="214" y="276">https://deb.debian.org/debian</text>
    </g>

    <g id="node-campo-dist">
      <rect class="seg" x="490" y="214" width="170" height="80" rx="0"/>
      <text class="seg-head" x="514" y="244">3 · DISTRO</text>
      <text class="seg-mono" x="514" y="276">bookworm</text>
    </g>

    <g id="node-campo-comp">
      <rect class="seg" x="660" y="214" width="260" height="80" rx="8"/>
      <text class="seg-head" x="684" y="244">4 · COMPONENTES</text>
      <text class="seg-mono-sm" x="684" y="276">main contrib non-free</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="label" x="40" y="154">deb = binarios · deb-src = código fuente</text>
    <line class="guide" x1="100" y1="166" x2="100" y2="214"/>

    <line class="guide" x1="214" y1="294" x2="214" y2="330"/>
    <text class="label" x="214" y="350">HTTP/HTTPS, FTP, file:, cdrom:</text>

    <line class="guide" x1="514" y1="294" x2="514" y2="330"/>
    <text class="label" x="514" y="350">codename o suite</text>

    <line class="guide" x1="684" y1="294" x2="684" y2="330"/>
    <text class="label" x="684" y="350">main, contrib, non-free</text>

    <text class="note" x="40" y="406">La distribución es un codename (bookworm, bullseye)</text>
    <text class="note" x="40" y="428">o una suite (stable, testing).</text>
    <text class="note" x="40" y="462">El tipo deb-src es obligatorio para apt-get source.</text>
    <text class="note" x="40" y="484">El orden importa: si cambias los campos, APT falla.</text>
  </g>
</svg>
