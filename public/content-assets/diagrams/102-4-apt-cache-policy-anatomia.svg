<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="policy-title policy-desc">
  <title id="policy-title">Lectura de la salida de apt-cache policy: versión instalada, candidata y prioridades (LPIC-1 102.4)</title>
  <desc id="policy-desc">apt-cache policy nginx muestra en la línea Installed la versión que ya está instalada y en Candidate la versión que apt-get install instalaría según la prioridad del repositorio. La tabla de versiones marca con tres asteriscos la versión activa y con 500 la prioridad estándar de los repositorios oficiales; el 100 corresponde al estado local de /var/lib/dpkg/status. En las dependencias, Depends es obligatorio y Recommends es opcional aunque se instala por defecto.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .out { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .ann { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">APT-CACHE · LEER LA POLÍTICA DE VERSIONES</text>
    <text class="title" x="40" y="78">Qué versión se instalará y de dónde</text>
    <text class="subtitle" x="40" y="102">La salida de apt-cache policy, campo por campo.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-salida-policy">
      <rect class="panel" x="40" y="158" width="560" height="220" rx="10"/>
      <text class="panel-head" x="60" y="180">SALIDA REAL</text>
      <text class="cmd" x="60" y="202">$ apt-cache policy nginx</text>
      <line class="divider" x1="60" y1="212" x2="580" y2="212"/>
      <text class="out" x="60" y="236">nginx:</text>
      <text class="out" x="60" y="258">  Installed: 1.22.1-9</text>
      <text class="out" x="60" y="280">  Candidate: 1.22.1-9</text>
      <text class="out" x="60" y="302">  Version table:</text>
      <text class="out" x="60" y="324"> *** 1.22.1-9 500</text>
      <text class="out" x="60" y="346">      500 https://deb.debian.org/debian bookworm/main amd64 Packages</text>
      <text class="out" x="60" y="368">      100 /var/lib/dpkg/status</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="guide" x1="600" y1="258" x2="618" y2="258"/>
    <line class="guide" x1="600" y1="280" x2="618" y2="280"/>
    <line class="guide" x1="600" y1="324" x2="618" y2="324"/>
    <line class="guide" x1="600" y1="368" x2="618" y2="368"/>

    <text class="ann" x="624" y="263">Installed · la versión ya instalada</text>
    <text class="ann" x="624" y="285">Candidate · la que instalará apt-get install</text>
    <text class="ann" x="624" y="329">*** 500 · versión activa del repositorio</text>
    <text class="ann" x="624" y="373">100 · estado local en /var/lib/dpkg/status</text>

    <text class="note" x="40" y="410">Depends es obligatorio para el paquete;</text>
    <text class="note" x="40" y="432">Recommends es opcional y se instala por defecto.</text>
    <text class="note" x="40" y="470">apt-cache solo lee la caché local: no necesita sudo.</text>
  </g>
</svg>
