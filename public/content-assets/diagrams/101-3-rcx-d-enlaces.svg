<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rcxd-title rcxd-desc">
  <title id="rcxd-title">Enlaces K y S de /etc/rcX.d hacia los scripts reales de /etc/init.d (LPIC-1 101.3)</title>
  <desc id="rcxd-desc">El directorio /etc/rcX.d, donde la X es el número del runlevel, no guarda scripts: contiene enlaces simbólicos que apuntan a los scripts reales de /etc/init.d. Los enlaces que empiezan por K reciben el argumento stop y se ejecutan los primeros para detener los servicios que no pertenecen al nuevo nivel; los que empiezan por S reciben el argumento start y arrancan después. Los dos dígitos que siguen a la letra, de K01 a K99 y de S01 a S99, fijan el orden exacto de ejecución.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .zone { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .zone-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #334155; }
      .script { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .link { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .mono-k { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #881337; }
      .sub-13 { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .sub-k { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #881337; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2; }
      .edge-k { fill: none; stroke: #E11D48; stroke-width: 2; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #1E36AF; text-anchor: middle; }
    </style>

    <marker id="rcxd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="rcxd-arrow-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SYSVINIT · /etc/rcX.d</text>
    <text class="title" x="40" y="78">Enlaces K y S, no scripts</text>
    <text class="subtitle" x="40" y="102">Los rangos K01–K99 y S01–S99 fijan el orden</text>
  </g>

  <g id="diagram-groups">
    <g id="node-zone-initd">
      <rect class="zone" x="40" y="150" width="300" height="264" rx="14"/>
      <text class="zone-label" x="64" y="176">/etc/init.d/ · scripts reales</text>
    </g>
    <g id="node-zone-rc3d">
      <rect class="zone" x="620" y="150" width="300" height="264" rx="14"/>
      <text class="zone-label" x="644" y="176">/etc/rc3.d/ · solo enlaces</text>
    </g>
  </g>

  <g id="diagram-nodes">
    <g id="node-script-apache2">
      <rect class="script" x="64" y="196" width="252" height="52" rx="8"/>
      <text class="mono-name" x="86" y="218">apache2</text>
      <text class="sub-13" x="86" y="236">script de shell</text>
    </g>
    <g id="node-script-ssh">
      <rect class="script" x="64" y="268" width="252" height="52" rx="8"/>
      <text class="mono-name" x="86" y="290">ssh</text>
      <text class="sub-13" x="86" y="308">script de shell</text>
    </g>
    <g id="node-script-cron">
      <rect class="script" x="64" y="340" width="252" height="52" rx="8"/>
      <text class="mono-name" x="86" y="362">cron</text>
      <text class="sub-13" x="86" y="380">script de shell</text>
    </g>

    <g id="node-link-k01">
      <rect class="link" x="644" y="196" width="252" height="52" rx="8"/>
      <text class="mono-k" x="666" y="218">K01apache2</text>
      <text class="sub-k" x="666" y="236">argumento stop</text>
    </g>
    <g id="node-link-s01">
      <rect class="link" x="644" y="268" width="252" height="52" rx="8"/>
      <text class="mono-name" x="666" y="290">S01ssh</text>
      <text class="sub-13" x="666" y="308">argumento start</text>
    </g>
    <g id="node-link-s02">
      <rect class="link" x="644" y="340" width="252" height="52" rx="8"/>
      <text class="mono-name" x="666" y="362">S02cron</text>
      <text class="sub-13" x="666" y="380">argumento start</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="rcxd-rel-k01-apache2" class="edge-k" data-from="node-link-k01" data-to="node-script-apache2" data-relation="symlink-stop"
          d="M 644 222 H 316" marker-end="url(#rcxd-arrow-k)"/>
    <path id="rcxd-rel-s01-ssh" class="edge" data-from="node-link-s01" data-to="node-script-ssh" data-relation="symlink-start"
          d="M 644 294 H 316" marker-end="url(#rcxd-arrow)"/>
    <path id="rcxd-rel-s02-cron" class="edge" data-from="node-link-s02" data-to="node-script-cron" data-relation="symlink-start"
          d="M 644 366 H 316" marker-end="url(#rcxd-arrow)"/>
  </g>

  <g id="diagram-labels">
    <text class="edge-label" x="480" y="210">enlace simbólico</text>
    <text class="note" x="40" y="452">Orden: primero los K (K01–K99, stop),</text>
    <text class="note" x="40" y="474">después los S (S01–S99, start).</text>
    <text class="note" x="40" y="496">Cada enlace apunta a ../init.d/&lt;servicio&gt;.</text>
  </g>
</svg>
