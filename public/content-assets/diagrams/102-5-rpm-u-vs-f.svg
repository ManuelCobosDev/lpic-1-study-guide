<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ruf-title ruf-desc">
  <title id="ruf-title">rpm -U (upgrade) frente a rpm -F (freshen): comportamiento con el paquete ausente (LPIC-1 102.5)</title>
  <desc id="ruf-desc">Comparativa de las dos opciones de actualización de rpm. Con -Uvh, si el paquete ya está instalado se actualiza a la nueva versión borrando los binarios antiguos y, si no existe, se instala por primera vez, por lo que es la opción estándar del administrador. Con -Fvh, si el paquete ya está instalado se actualiza igual, pero si no existe no hace nada y lo ignora en silencio, lo que la hace idónea para aplicar parches masivos con rpm -Fvh *.rpm sin instalar software nuevo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-b { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .mono-cmd-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #334155; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">RPM · UPGRADE FRENTE A FRESHEN</text>
    <text class="title" x="40" y="78">-U actualiza o instala; -F solo actualiza</text>
    <text class="subtitle" x="40" y="102">La clave está en el paquete que no está instalado</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-upgrade">
      <rect class="panel-a" x="40" y="124" width="420" height="316" rx="10"/>
      <text class="panel-head" x="64" y="152">UPGRADE</text>
      <text class="mono-cmd" x="64" y="184">rpm -Uvh pkg.rpm</text>
      <text class="sub" x="64" y="208">Actualiza o instala si no existe</text>
      <line class="divider" x1="64" y1="226" x2="436" y2="226"/>
      <text class="row-label" x="64" y="258">PAQUETE YA INSTALADO</text>
      <text class="row-value" x="64" y="282">Lo actualiza y borra los binarios viejos</text>
      <line class="divider" x1="64" y1="298" x2="436" y2="298"/>
      <text class="row-label" x="64" y="330">PAQUETE AUSENTE</text>
      <text class="row-value" x="64" y="354">Lo instala por primera vez</text>
      <line class="divider" x1="64" y1="370" x2="436" y2="370"/>
      <text class="row-label" x="64" y="402">USO RECOMENDADO</text>
      <text class="row-value" x="64" y="426">La opción estándar del administrador</text>
    </g>

    <g id="node-freshen">
      <rect class="panel-b" x="500" y="124" width="420" height="316" rx="10"/>
      <text class="panel-head" x="524" y="152">FRESHEN</text>
      <text class="mono-cmd-b" x="524" y="184">rpm -Fvh pkg.rpm</text>
      <text class="sub" x="524" y="208">Solo actualiza si ya existe</text>
      <line class="divider" x1="524" y1="226" x2="896" y2="226"/>
      <text class="row-label" x="524" y="258">PAQUETE YA INSTALADO</text>
      <text class="row-value" x="524" y="282">Lo actualiza a la nueva versión</text>
      <line class="divider" x1="524" y1="298" x2="896" y2="298"/>
      <text class="row-label" x="524" y="330">PAQUETE AUSENTE</text>
      <text class="row-value" x="524" y="354">No hace nada: lo ignora en silencio</text>
      <line class="divider" x1="524" y1="370" x2="896" y2="370"/>
      <text class="row-label" x="524" y="402">USO RECOMENDADO</text>
      <text class="row-value" x="524" y="426">rpm -Fvh *.rpm: parches de seguridad</text>
    </g>

    <g id="node-verdict">
      <rect class="verdict" x="40" y="456" width="880" height="52" rx="10"/>
      <text class="verdict-label" x="64" y="488">VEREDICTO</text>
      <text class="verdict-text" x="168" y="488">-F nunca instala software nuevo; -U sí lo hace si falta</text>
    </g>
  </g>
</svg>
