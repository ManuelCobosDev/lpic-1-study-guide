<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="erp-title erp-desc">
  <title id="erp-title">Ecosistema RPM: dos front-ends de alto nivel sobre el motor rpm (LPIC-1 102.5)</title>
  <desc id="erp-desc">YUM y DNF en Red Hat, Fedora, CentOS, RHEL, Rocky y Alma, y Zypper sobre libzypp en openSUSE y SUSE Linux, son los dos front-ends de alto nivel del ecosistema RPM. Cada uno lee sus repositorios, en /etc/yum.repos.d/*.repo o en /etc/zypp/repos.d/*.repo, y resuelve automáticamente las dependencias remotas antes de invocar por debajo al mismo motor de bajo nivel: el comando rpm, que solo opera con archivos .rpm locales y con la base de datos /var/lib/rpm/, no tiene acceso a la red y aborta con error si falta una dependencia.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-front { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-motor { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #334155; }
      .sub-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="erp-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ECOSISTEMA RPM · DOS FRONT-ENDS</text>
    <text class="title" x="40" y="78">Dos front-ends sobre un mismo motor</text>
    <text class="subtitle" x="40" y="102">Cada familia lee su propio directorio de repositorios</text>
  </g>

  <g id="diagram-relations">
    <path id="erp-rel-redhat-motor" class="edge-blue"
          data-from="node-frontend-redhat" data-to="node-motor" data-relation="invoca-por-debajo"
          d="M 254 300 V 344" marker-end="url(#erp-arrow-blue)"/>
    <path id="erp-rel-suse-motor" class="edge-blue"
          data-from="node-frontend-suse" data-to="node-motor" data-relation="invoca-por-debajo"
          d="M 706 300 V 344" marker-end="url(#erp-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-frontend-redhat">
      <rect class="panel-front" x="40" y="124" width="428" height="176" rx="10"/>
      <text class="panel-head" x="64" y="150">RED HAT · FEDORA · CENTOS</text>
      <text class="mono-name" x="64" y="180">YUM y DNF</text>
      <text class="sub" x="64" y="202">RHEL · Rocky · Alma</text>
      <line class="divider" x1="64" y1="216" x2="444" y2="216"/>
      <text class="mono-sm" x="64" y="240">/etc/yum.repos.d/*.repo</text>
      <text class="sub" x="64" y="262">Resuelven dependencias remotas</text>
      <text class="mono-sm" x="64" y="284">yum provides &lt;archivo&gt;</text>
    </g>

    <g id="node-frontend-suse">
      <rect class="panel-front" x="492" y="124" width="428" height="176" rx="10"/>
      <text class="panel-head" x="516" y="150">OPENSUSE · SUSE LINUX</text>
      <text class="mono-name" x="516" y="180">Zypper (libzypp)</text>
      <text class="sub" x="516" y="202">SLES · Leap · Tumbleweed</text>
      <line class="divider" x1="516" y1="216" x2="896" y2="216"/>
      <text class="mono-sm" x="516" y="240">/etc/zypp/repos.d/*.repo</text>
      <text class="sub" x="516" y="262">SAT solver para dependencias</text>
      <text class="mono-sm" x="516" y="284">ref · in · up · rm · lr · mr</text>
    </g>

    <g id="node-motor">
      <rect class="panel-motor" x="40" y="344" width="880" height="152" rx="10"/>
      <text class="panel-head" x="64" y="372">MOTOR COMÚN DE BAJO NIVEL</text>
      <text class="mono-name" x="64" y="400">rpm (RPM Package Manager)</text>
      <text class="sub" x="64" y="426">Solo archivos .rpm locales y la base /var/lib/rpm/</text>
      <text class="sub" x="64" y="450">No tiene acceso a red ni descarga de paquetes</text>
      <text class="sub" x="64" y="474">Si falta una dependencia, aborta con error</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="sub-center" x="480" y="330">ambos invocan rpm por debajo</text>
  </g>
</svg>
