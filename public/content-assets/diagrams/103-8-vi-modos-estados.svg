<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vi-modos-title vi-modos-desc">
  <title id="vi-modos-title">Máquina de estados de vi: modo normal, modo inserción y modo Ex (LPIC-1 103.8)</title>
  <desc id="vi-modos-desc">vi es una máquina de estados de tres modos. El modo normal es el estado de arranque y el centro de la navegación: con h, j, k, l se mueve el cursor y con yy o dd se copia y se borra. Desde el modo normal, las teclas i, I, a, A, o y O abren el modo inserción, donde se teclea texto directo y la línea de estado muestra el aviso -- INSERT --; Esc devuelve al modo normal. Desde el modo normal, los dos puntos abren el modo Ex, la línea inferior donde se ejecutan :w, :q!, :wq y :%s para guardar, salir o sustituir; Esc o Enter regresan al modo normal. Desde inserción no se salta directamente al modo Ex: primero hay que salir con Esc.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-ins { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-ex { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-normal { fill: #EFF4FF; stroke: #2550EB; stroke-width: 3; }
      .name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .name-strong { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
      .mono-strong { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .status-chip { fill: #1E293B; stroke: #0F172A; stroke-width: 1; }
      .status-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-2 { fill: none; stroke: #475569; stroke-width: 2; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .initial-badge { fill: #DBE6FE; stroke: #2550EB; stroke-width: 1.5; }
      .initial-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; text-anchor: middle; }
    </style>

    <marker id="vim-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="vim-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">VI · TRES MODOS, DOS TECLAS DE ESCAPE</text>
    <text class="title" x="40" y="78">Las teclas significan otra cosa en cada modo</text>
    <text class="subtitle" x="40" y="102">Normal es el estado de arranque.</text>
    <text class="subtitle" x="40" y="122">Inserción y Ex se abren siempre desde él.</text>
  </g>

  <g id="diagram-relations">
    <path id="vim-rel-ins-normal" class="edge-2" data-from="node-insercion" data-to="node-normal" data-relation="esc-vuelve-a-normal"
          d="M 250 250 V 330" marker-end="url(#vim-arrow-slate)"/>

    <path id="vim-rel-normal-ins" class="edge" data-from="node-normal" data-to="node-insercion" data-relation="i-I-a-A-o-O-abren-insercion"
          d="M 310 330 V 250" marker-end="url(#vim-arrow-blue)"/>

    <path id="vim-rel-ex-normal" class="edge-2" data-from="node-ex" data-to="node-normal" data-relation="esc-o-enter-vuelven-a-normal"
          d="M 710 250 V 330" marker-end="url(#vim-arrow-slate)"/>

    <path id="vim-rel-normal-ex" class="edge" data-from="node-normal" data-to="node-ex" data-relation="dos-puntos-abren-ex"
          d="M 650 330 V 250" marker-end="url(#vim-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-insercion">
      <rect class="node-ins" x="40" y="140" width="300" height="110" rx="10"/>
      <text class="name" x="64" y="170">MODO INSERCIÓN</text>
      <text class="line" x="64" y="196">Escribes texto directo</text>
      <rect class="status-chip" x="64" y="206" width="156" height="26" rx="5"/>
      <text class="status-text" x="78" y="224">-- INSERT --</text>
    </g>

    <g id="node-ex">
      <rect class="node-ex" x="620" y="140" width="300" height="110" rx="10"/>
      <text class="name" x="644" y="170">MODO EX</text>
      <text class="mono" x="644" y="196">:w · :q! · :wq · :%s</text>
      <text class="line" x="644" y="220">Guardado y salida</text>
      <text class="line" x="644" y="242">Comandos avanzados</text>
    </g>

    <g id="node-normal">
      <rect class="node-normal" x="200" y="330" width="560" height="110" rx="10"/>
      <rect class="initial-badge" x="612" y="346" width="132" height="24" rx="6"/>
      <text class="initial-text" x="678" y="362">ESTADO INICIAL</text>
      <text class="name-strong" x="224" y="370">MODO NORMAL</text>
      <text class="line" x="224" y="396">Estado por defecto: aquí se navega y se dan las órdenes</text>
      <text class="mono-strong" x="224" y="420">h, j, k, l · yy · dd</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="edge-label" x="258" y="296">Esc</text>
    <text class="edge-label" x="318" y="296">i, I, a, A, o, O</text>
    <text class="edge-label" x="658" y="296">:</text>
    <text class="edge-label" x="718" y="296">Esc o Enter</text>

    <text class="note" x="40" y="476">De inserción a Ex no se salta: primero Esc, luego :</text>
    <text class="note" x="40" y="500">Si dudas, pulsa Esc dos veces: vuelves a Normal.</text>
  </g>
</svg>

