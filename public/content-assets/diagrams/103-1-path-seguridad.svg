<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-path-title p1031-path-desc">
  <title id="p1031-path-title">La variable PATH y el peligro del punto (LPIC-1 103.1)</title>
  <desc id="p1031-path-desc">La variable PATH es una cadena de directorios separados por dos puntos: /usr/local/bin, /usr/bin, /bin y /usr/local/games. Bash los recorre de izquierda a derecha y se detiene en el primero que contiene el ejecutable. El panel inferior muestra el peligro del punto: al poner export PATH=".:$PATH", un atacante deja un script /tmp/ls, root teclea ls dentro de /tmp y se ejecuta el binario del atacante con permisos de root en lugar del comando real.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .path-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .dir { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .dir-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .colon { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .panel-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #881337; }
      .warn-code { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #BE123C; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
      .step { fill: #FFFFFF; stroke: #E11D48; stroke-width: 2; }
      .step-num { fill: #E11D48; }
      .step-num-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .step-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #881337; text-anchor: middle; }
      .edge-warn { fill: none; stroke: #E11D48; stroke-width: 2; }
    </style>

    <marker id="p1031-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PATH · ORDEN DE BÚSQUEDA Y SEGURIDAD</text>
    <text class="title" x="40" y="78">La cadena PATH y el peligro del punto</text>
    <text class="subtitle" x="40" y="102">PATH es una lista de directorios separada por dos puntos;</text>
    <text class="subtitle" x="40" y="122">el orden en que se recorren decide qué programa se ejecuta.</text>
  </g>

  <g id="diagram-nodes">
    <g id="path-chain">
      <text class="path-label" x="40" y="173">PATH=</text>
      <g id="dir-local-bin">
        <rect class="dir" x="120" y="148" width="190" height="44" rx="8"/>
        <text class="dir-text" x="215" y="176">/usr/local/bin</text>
      </g>
      <text class="colon" x="320" y="176">:</text>
      <g id="dir-usr-bin">
        <rect class="dir" x="330" y="148" width="130" height="44" rx="8"/>
        <text class="dir-text" x="395" y="176">/usr/bin</text>
      </g>
      <text class="colon" x="470" y="176">:</text>
      <g id="dir-bin">
        <rect class="dir" x="480" y="148" width="90" height="44" rx="8"/>
        <text class="dir-text" x="525" y="176">/bin</text>
      </g>
      <text class="colon" x="580" y="176">:</text>
      <g id="dir-games">
        <rect class="dir" x="590" y="148" width="210" height="44" rx="8"/>
        <text class="dir-text" x="695" y="176">/usr/local/games</text>
      </g>
      <text class="note" x="40" y="212">Bash los recorre de izquierda a derecha</text>
      <text class="note" x="40" y="234">y para en el primero que acierta.</text>
    </g>

    <g id="panel-warn">
      <rect class="panel-warn" x="40" y="262" width="880" height="244" rx="10"/>
      <text class="warn-title" x="60" y="296">El punto (.) en PATH: un caballo de Troya</text>
      <text class="warn-code" x="60" y="326">export PATH=".:$PATH"</text>
      <text class="warn-body" x="60" y="354">Si el punto va primero, Bash busca el ejecutable en el directorio actual.</text>

      <g id="step-plant">
        <rect class="step" x="60" y="376" width="260" height="44" rx="8"/>
        <circle class="step-num" cx="86" cy="398" r="12"/>
        <text class="step-num-text" x="86" y="402">1</text>
        <text class="step-text" x="204" y="402">un atacante deja /tmp/ls</text>
      </g>
      <g id="step-run">
        <rect class="step" x="360" y="376" width="260" height="44" rx="8"/>
        <circle class="step-num" cx="386" cy="398" r="12"/>
        <text class="step-num-text" x="386" y="402">2</text>
        <text class="step-text" x="504" y="402">root teclea ls en /tmp</text>
      </g>
      <g id="step-trojan">
        <rect class="step" x="660" y="376" width="240" height="44" rx="8"/>
        <circle class="step-num" cx="686" cy="398" r="12"/>
        <text class="step-num-text" x="686" y="402">3</text>
        <text class="step-text" x="790" y="402">se ejecuta /tmp/ls como root</text>
      </g>

      <text class="warn-body" x="60" y="456">El binario real del sistema nunca llega a ejecutarse.</text>
      <text class="warn-body" x="60" y="480">Por eso el punto nunca debe estar en el PATH de root.</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="rel-step-1-2" class="edge-warn" data-from="step-plant" data-to="step-run" data-relation="then" d="M 320 398 H 360" marker-end="url(#p1031-path-arrow)"/>
    <path id="rel-step-2-3" class="edge-warn" data-from="step-run" data-to="step-trojan" data-relation="then" d="M 620 398 H 660" marker-end="url(#p1031-path-arrow)"/>
  </g>
</svg>
