<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="capas-title capas-desc">
  <title id="capas-title">Arquitectura de cuatro capas entre el hardware y el usuario (LPIC-1 101.1)</title>
  <desc id="capas-desc">Pila de cuatro capas con el hardware abajo: el firmware BIOS o UEFI inicializa el chipset y ejecuta el POST, el kernel detecta los buses y carga los módulos desde /lib/modules, los pseudo-sistemas /proc y /sys exponen el estado del hardware en RAM y el espacio de usuario con udev, D-Bus y /dev crea y anuncia los nodos de dispositivo. Ninguna aplicación salta capas: siempre pide el acceso al kernel mediante llamadas al sistema.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .layer-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .layer-name-hw { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #F8FAFC; }
      .layer-detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .layer-detail-hw { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #E2E8F0; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-hw { fill: #F8FAFC; stroke: #64748B; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .badge-num-dark { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ARQUITECTURA · CUATRO CAPAS</text>
    <text class="title" x="40" y="78">Del firmware a la aplicación, sin atajos</text>
    <text class="subtitle" x="40" y="102">Ningún programa toca el hardware directamente.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-capa-4">
      <rect class="node-cmd" x="40" y="120" width="880" height="84" rx="10"/>
      <text class="layer-name" x="96" y="147">Espacio de usuario: udev, D-Bus y /dev</text>
      <text class="layer-detail" x="96" y="172">udevd escucha los uevents y crea nodos en /dev aplicando reglas.</text>
      <text class="layer-detail" x="96" y="193">D-Bus avisa al escritorio y a las aplicaciones del cambio de hardware.</text>
    </g>

    <g id="node-capa-3">
      <rect class="node-iface" x="40" y="214" width="880" height="84" rx="10"/>
      <text class="layer-name" x="96" y="241">/proc y /sys (sysfs)</text>
      <text class="layer-detail" x="96" y="266">Pseudo-sistemas en RAM: estado del hardware, IRQ y jerarquía de buses.</text>
      <text class="layer-detail" x="96" y="287">No ocupan disco: leerlos es consultar el kernel en vivo.</text>
    </g>

    <g id="node-capa-2">
      <rect class="node-kernel" x="40" y="308" width="880" height="84" rx="10"/>
      <text class="layer-name" x="96" y="335">Kernel y módulos (/lib/modules)</text>
      <text class="layer-detail" x="96" y="360">Escanea los buses PCI y USB, asigna IRQ y DMA y carga drivers.</text>
      <text class="layer-detail" x="96" y="381">Los .ko viven en /lib/modules/$(uname -r)/ y se ejecutan en Ring 0.</text>
    </g>

    <g id="node-capa-1">
      <rect class="node-hw" x="40" y="402" width="880" height="84" rx="10"/>
      <text class="layer-name-hw" x="96" y="429">Firmware: BIOS / UEFI</text>
      <text class="layer-detail-hw" x="96" y="454">Inicializa el chipset, ejecuta el POST y carga la tabla ACPI.</text>
      <text class="layer-detail-hw" x="96" y="475">Lee el orden de arranque en la NVRAM o el CMOS y cede el control a GRUB.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="67" cy="142" r="15"/>
    <text class="badge-num" x="67" y="147">4</text>
    <circle class="badge" cx="67" cy="236" r="15"/>
    <text class="badge-num" x="67" y="241">3</text>
    <circle class="badge" cx="67" cy="330" r="15"/>
    <text class="badge-num" x="67" y="335">2</text>
    <circle class="badge-hw" cx="67" cy="424" r="15"/>
    <text class="badge-num-dark" x="67" y="429">1</text>
    <text class="subtitle" x="40" y="512">Capa 1 abajo (hardware); capa 4 arriba (usuario).</text>
  </g>
</svg>
