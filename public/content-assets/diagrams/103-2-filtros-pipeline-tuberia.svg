<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="filtros-title filtros-desc">
  <title id="filtros-title">Tubería de filtros de texto: de /etc/passwd a stdout sin tocar el disco (LPIC-1 103.2)</title>
  <desc id="filtros-desc">Un fichero de texto en disco, /etc/passwd, entra en una cadena de tres filtros especializados: cut -d: -f7 selecciona el campo de la shell, sort agrupa las líneas idénticas y uniq -c cuenta cuántas veces aparece cada una. El resultado sale por stdout como un informe en memoria. Ningún filtro reescribe el fichero de origen: cada uno lee de stdin o del fichero, procesa en RAM y entrega el flujo al siguiente.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .stage { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; text-anchor: middle; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-out { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .rule { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .rule-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .rule-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #334155; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="filtros-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">FILOSOFÍA UNIX · FILTROS EN CADENA</text>
    <text class="title" x="40" y="78">El dato fluye, el disco no se toca</text>
    <text class="subtitle" x="40" y="102">Cada filtro lee, transforma y entrega el flujo al siguiente.</text>
  </g>

  <g id="diagram-relations">
    <path id="filtros-rel-1" class="edge" data-from="node-passwd" data-to="node-cut" data-relation="stdin-del-fichero"
          d="M 184 246 H 224" marker-end="url(#filtros-arrow)"/>
    <path id="filtros-rel-2" class="edge" data-from="node-cut" data-to="node-sort" data-relation="pasa-el-flujo"
          d="M 368 246 H 408" marker-end="url(#filtros-arrow)"/>
    <path id="filtros-rel-3" class="edge" data-from="node-sort" data-to="node-uniq" data-relation="pasa-el-flujo"
          d="M 552 246 H 592" marker-end="url(#filtros-arrow)"/>
    <path id="filtros-rel-4" class="edge" data-from="node-uniq" data-to="node-stdout" data-relation="escribe-stdout"
          d="M 736 246 H 776" marker-end="url(#filtros-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-passwd">
      <rect class="node-file" x="40" y="190" width="144" height="112" rx="10"/>
      <text class="mono-name" x="112" y="224">/etc/passwd</text>
      <text class="node-sub" x="112" y="252">texto crudo</text>
      <text class="node-sub" x="112" y="276">original</text>
    </g>

    <g id="node-cut">
      <rect class="node-cmd" x="224" y="190" width="144" height="112" rx="10"/>
      <text class="mono-name" x="296" y="224">cut -d: -f7</text>
      <text class="node-sub" x="296" y="252">solo la shell</text>
      <text class="node-sub" x="296" y="276">campo 7</text>
    </g>

    <g id="node-sort">
      <rect class="node-cmd" x="408" y="190" width="144" height="112" rx="10"/>
      <text class="mono-name" x="480" y="224">sort</text>
      <text class="node-sub" x="480" y="252">agrupa las</text>
      <text class="node-sub" x="480" y="276">shells iguales</text>
    </g>

    <g id="node-uniq">
      <rect class="node-cmd" x="592" y="190" width="144" height="112" rx="10"/>
      <text class="mono-name" x="664" y="224">uniq -c</text>
      <text class="node-sub" x="664" y="252">cuenta</text>
      <text class="node-sub" x="664" y="276">frecuencias</text>
    </g>

    <g id="node-stdout">
      <rect class="node-out" x="776" y="190" width="144" height="112" rx="10"/>
      <text class="mono-name" x="848" y="224">stdout</text>
      <text class="node-sub" x="848" y="252">informe final</text>
      <text class="node-sub" x="848" y="276">en la RAM</text>
    </g>

    <g id="node-rule">
      <rect class="rule" x="40" y="336" width="880" height="140" rx="10"/>
      <text class="rule-title" x="64" y="372">Regla de oro Unix</text>
      <text class="rule-body" x="64" y="402">Ningún filtro guarda datos de forma permanente ni modifica el fichero de origen:</text>
      <text class="rule-body" x="64" y="426">cada herramienta hace una sola tarea, muy rápida, sobre el flujo en memoria.</text>
      <text class="rule-body" x="64" y="450">Leen de stdin o de un fichero, procesan en RAM y expulsan el resultado por stdout.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="stage" x="112" y="166">DISCO INTACTO</text>
    <text class="stage" x="296" y="166">SELECCIONAR</text>
    <text class="stage" x="480" y="166">ORDENAR</text>
    <text class="stage" x="664" y="166">CONTAR</text>
    <text class="stage" x="848" y="166">PANTALLA</text>
  </g>
</svg>
