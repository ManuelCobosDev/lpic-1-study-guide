<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-export-title p1031-export-desc">
  <title id="p1031-export-title">Variable local frente a variable exportada en Bash (LPIC-1 103.1)</title>
  <desc id="p1031-export-desc">Comparativa de dos paneles: la variable local VAR=hola solo vive en la terminal donde se escribe, los procesos hijos como ./backup.sh o python app.py no la ven y aparece en set pero no en env. La variable exportada con export VAR forma parte del entorno de la sesión, los procesos hijos reciben una copia de su valor y aparece en env, printenv y set. El veredicto recuerda que set | grep VAR la muestra y env | grep VAR no hasta exportarla.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .code-a { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .code-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .row-value-muted { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .row-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">VARIABLES · ÁMBITO Y HERENCIA</text>
    <text class="title" x="40" y="78">Local o exportada: qué hereda el proceso hijo</text>
    <text class="subtitle" x="40" y="102">Una variable local muere contigo; al exportarla,</text>
    <text class="subtitle" x="40" y="122">cada proceso hijo recibe una copia de su valor.</text>
  </g>

  <g id="diagram-nodes">
    <g id="panel-local">
      <rect class="panel-a" x="40" y="140" width="420" height="290" rx="10"/>
      <text class="head-a" x="64" y="170">VARIABLE LOCAL</text>
      <text class="code-a" x="64" y="202">VAR="hola"</text>
      <line class="divider" x1="64" y1="216" x2="436" y2="216"/>

      <text class="row-label" x="64" y="240">ÁMBITO</text>
      <text class="row-value" x="64" y="262">Vive solo en esta terminal</text>
      <line class="divider" x1="64" y1="292" x2="436" y2="292"/>

      <text class="row-label" x="64" y="316">SUBPROCESOS</text>
      <text class="row-value-muted" x="64" y="338">./backup.sh o python app.py</text>
      <text class="row-value" x="64" y="360">no la ven: el hijo nace ciego</text>
      <line class="divider" x1="64" y1="376" x2="436" y2="376"/>

      <text class="row-label" x="64" y="400">VISIBLE EN</text>
      <text class="row-mono" x="64" y="422">set sí · env no</text>
    </g>

    <g id="panel-export">
      <rect class="panel-b" x="500" y="140" width="420" height="290" rx="10"/>
      <text class="head-b" x="524" y="170">VARIABLE EXPORTADA</text>
      <text class="code-b" x="524" y="202">export VAR</text>
      <line class="divider" x1="524" y1="216" x2="896" y2="216"/>

      <text class="row-label" x="524" y="240">ÁMBITO</text>
      <text class="row-value" x="524" y="262">Pasa al entorno de la sesión</text>
      <line class="divider" x1="524" y1="292" x2="896" y2="292"/>

      <text class="row-label" x="524" y="316">SUBPROCESOS</text>
      <text class="row-value" x="524" y="338">Los hijos reciben una copia</text>
      <text class="row-value-muted" x="524" y="360">de su valor</text>
      <line class="divider" x1="524" y1="376" x2="896" y2="376"/>

      <text class="row-label" x="524" y="400">VISIBLE EN</text>
      <text class="row-mono" x="524" y="422">env · printenv · set</text>
    </g>

    <g id="verdict">
      <rect class="verdict" x="40" y="446" width="880" height="54" rx="10"/>
      <text class="verdict-label" x="64" y="475">VEREDICTO</text>
      <text class="verdict-text" x="168" y="475">set | grep VAR sí la muestra; env | grep VAR no, hasta que la exportas.</text>
    </g>
  </g>
</svg>
