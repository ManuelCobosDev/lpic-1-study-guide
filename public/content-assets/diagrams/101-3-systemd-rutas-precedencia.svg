<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="paths-title paths-desc">
  <title id="paths-title">Precedencia de los directorios de unidades de systemd (LPIC-1 101.3)</title>
  <desc id="paths-desc">systemd busca las unidades en tres directorios y, si el mismo nombre aparece en varios, gana el de mayor prioridad. /etc/systemd/system es el primero: lo crea el administrador y sobrescribe a los demás. /run/systemd/system es el segundo y contiene unidades volátiles generadas en memoria durante el arranque. /lib/systemd/system o /usr/lib/systemd es la base: las unidades que instalan los paquetes de la distribución. Tras editar una unidad en /etc/systemd/system hay que recargar el gestor con systemctl daemon-reload.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .band-etc { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .band-run { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .band-lib { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .mono-path { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .band-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .badge { fill: #1D40D8; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .arrow-line { fill: none; stroke: #475569; stroke-width: 2; }
      .arrow-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; text-anchor: middle; letter-spacing: 0.04em; }
      .reload { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .reload-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #065F46; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SYSTEMD · PRECEDENCIA DE UNIDADES</text>
    <text class="title" x="40" y="78">Tres directorios, una sola unidad</text>
    <text class="subtitle" x="40" y="102">Mismo nombre en tres sitios: gana el primero.</text>
  </g>

  <g id="diagram-relations">
    <path id="paths-rel-priority" class="arrow-line" d="M 856 388 V 196"/>
    <path id="paths-rel-priority-head" class="arrow-line" d="M 849 208 L 856 194 L 863 208"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-etc">
      <rect class="band-etc" x="120" y="150" width="680" height="76" rx="10"/>
      <text class="mono-path" x="144" y="190">/etc/systemd/system/</text>
      <text class="band-sub" x="144" y="214">Creado por el administrador · máxima prioridad</text>
    </g>

    <g id="node-run">
      <rect class="band-run" x="120" y="250" width="680" height="76" rx="10"/>
      <text class="mono-path" x="144" y="290">/run/systemd/system/</text>
      <text class="band-sub" x="144" y="314">Volátil: se genera en RAM durante el arranque</text>
    </g>

    <g id="node-lib">
      <rect class="band-lib" x="120" y="350" width="680" height="76" rx="10"/>
      <text class="mono-path" x="144" y="390">/lib/systemd/system/</text>
      <text class="band-sub" x="144" y="414">Base: lo instala el paquete .deb o .rpm</text>
    </g>

    <g id="node-reload">
      <rect class="reload" x="40" y="436" width="880" height="70" rx="10"/>
      <text class="reload-line" x="64" y="466">Tras editar una unidad en /etc/systemd/system/:</text>
      <text class="mono-cmd" x="64" y="494">systemctl daemon-reload</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="84" cy="188" r="15"/>
    <text class="badge-num" x="84" y="193">1</text>
    <circle class="badge" cx="84" cy="288" r="15"/>
    <text class="badge-num" x="84" y="293">2</text>
    <circle class="badge" cx="84" cy="388" r="15"/>
    <text class="badge-num" x="84" y="393">3</text>
    <text class="arrow-label" x="856" y="178">sobrescribe</text>
  </g>
</svg>
