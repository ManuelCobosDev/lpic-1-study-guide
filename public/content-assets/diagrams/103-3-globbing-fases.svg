<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="globbing-title globbing-desc">
  <title id="globbing-title">Expansión del globbing en tres fases: patrón, búsqueda en disco y ejecución (LPIC-1 103.3)</title>
  <desc id="globbing-desc">El usuario escribe un patrón con comodín, por ejemplo rm *.log. La shell, antes de llamar al comando, busca en el disco los nombres que coinciden con ese patrón y encuentra access.log, error.log y auth.log; después ejecuta rm con la lista de nombres ya resuelta, de modo que el comando nunca recibe el asterisco. Si ningún nombre coincide, la shell entrega el patrón literal, y la expansión de llaves fabrica cadenas sin consultar el disco.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-shell { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-cmd { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .step-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .mono-big { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; }
      .mono-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #1E36AF; }
      .mono-line-ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #065F46; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .band-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="globbing-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SHELL · GLOBBING</text>
    <text class="title" x="40" y="78">El globbing ocurre antes de ejecutar</text>
    <text class="subtitle" x="40" y="102">Fases 1 y 2: la shell. Fase 3: el comando.</text>
  </g>

  <g id="diagram-relations">
    <path id="globbing-rel-1-2" class="edge-blue"
          data-from="node-fase-1" data-to="node-fase-2" data-relation="expands"
          d="M 290 265 H 355" marker-end="url(#globbing-arrow-blue)"/>
    <path id="globbing-rel-2-3" class="edge-blue"
          data-from="node-fase-2" data-to="node-fase-3" data-relation="passes-list"
          d="M 605 265 H 670" marker-end="url(#globbing-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-fase-1">
      <rect class="card-shell" x="40" y="150" width="250" height="230" rx="10"/>
      <text class="step-label" x="62" y="180">FASE 1</text>
      <text class="card-title" x="62" y="206">El patrón en la línea</text>
      <text class="mono-big" x="62" y="256">rm *.log</text>
      <text class="sub" x="62" y="306">un solo comodín en</text>
      <text class="sub" x="62" y="328">lugar de cada nombre.</text>
    </g>

    <g id="node-fase-2">
      <rect class="card-shell" x="355" y="150" width="250" height="230" rx="10"/>
      <text class="step-label" x="377" y="180">FASE 2</text>
      <text class="card-title" x="377" y="206">La shell busca en disco</text>
      <text class="mono-line" x="377" y="242">access.log</text>
      <text class="mono-line" x="377" y="264">error.log</text>
      <text class="mono-line" x="377" y="286">auth.log</text>
      <text class="sub" x="377" y="320">sustituye el patrón antes</text>
      <text class="sub" x="377" y="342">de llamar al comando.</text>
    </g>

    <g id="node-fase-3">
      <rect class="card-cmd" x="670" y="150" width="250" height="230" rx="10"/>
      <text class="step-label" x="692" y="180">FASE 3</text>
      <text class="card-title" x="692" y="206">El comando se ejecuta</text>
      <text class="mono-line-ok" x="692" y="242">rm access.log</text>
      <text class="mono-line-ok" x="692" y="264">error.log auth.log</text>
      <text class="sub" x="692" y="320">recibe la lista ya resuelta</text>
      <text class="sub" x="692" y="342">y nunca ve el asterisco.</text>
    </g>

    <g id="node-sin-coincidencia">
      <rect class="band" x="40" y="400" width="880" height="108" rx="10"/>
      <text class="band-title" x="62" y="432">Si nada coincide, el patrón llega literal</text>
      <text class="band-body" x="62" y="460">La shell solo expande nombres que existen en el disco; las llaves {…} fabrican texto sin consultarlo.</text>
      <text class="band-body" x="62" y="484">El asterisco nunca llega al comando: lo consume la shell antes de ejecutarlo.</text>
    </g>
  </g>
</svg>
