<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="xar-title xar-desc">
  <title id="xar-title">xargs como puente entre un flujo de texto y los argumentos de un comando (LPIC-1 103.4)</title>
  <desc id="xar-desc">El texto que llega por stdout, una línea por elemento, entra en xargs, que lo traduce a una lista de argumentos y construye la orden real. La tarjeta inferior izquierda muestra el error: cat lista.txt | rm no funciona porque rm no lee de stdin; la derecha muestra la solución, cat lista.txt | xargs rm, que ejecuta rm con todas las rutas como argumentos.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-text { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-xargs { fill: #FFFBEB; stroke: #D97706; stroke-width: 2.5; }
      .card-argv { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-bad { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-good { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .mono-big { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #B45309; text-anchor: middle; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .sub-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .bad-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #881337; }
      .bad-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #881337; }
      .good-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #065F46; }
      .good-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #065F46; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>
    <marker id="xar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · XARGS: DE FLUJO A ARGUMENTOS</text>
    <text class="title" x="40" y="78">El puente traductor</text>
    <text class="subtitle" x="40" y="102">Convierte líneas de texto en parámetros de una orden</text>
  </g>

  <g id="diagram-relations">
    <path id="xar-rel-texto-xargs" class="edge"
          data-from="node-texto" data-to="node-xargs" data-relation="lineas-a-entrada"
          d="M 300 240 H 340" marker-end="url(#xar-arrow)"/>
    <path id="xar-rel-xargs-argv" class="edge"
          data-from="node-xargs" data-to="node-argumentos" data-relation="lista-a-argv"
          d="M 560 240 H 600" marker-end="url(#xar-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-texto">
      <rect class="card-text" x="40" y="150" width="260" height="180" rx="10"/>
      <text class="head" x="64" y="180">TEXTO POR STDOUT</text>
      <text class="mono" x="64" y="212">/tmp/a.tmp</text>
      <text class="mono" x="64" y="238">/tmp/b.tmp</text>
      <text class="mono" x="64" y="264">/tmp/c.tmp</text>
      <text class="sub" x="64" y="300">una línea por elemento</text>
    </g>

    <g id="node-xargs">
      <rect class="node-xargs" x="340" y="170" width="220" height="140" rx="10"/>
      <text class="mono-big" x="450" y="228">xargs</text>
      <text class="sub-center" x="450" y="256">traduce cada línea</text>
      <text class="sub-center" x="450" y="276">a un argumento</text>
    </g>

    <g id="node-argumentos">
      <rect class="card-argv" x="600" y="150" width="320" height="180" rx="10"/>
      <text class="head" x="624" y="180">ARGUMENTOS (ARGV)</text>
      <text class="mono" x="624" y="212">rm /tmp/a.tmp</text>
      <text class="mono" x="624" y="238">/tmp/b.tmp /tmp/c.tmp</text>
      <text class="sub" x="624" y="272">una sola invocación: rm ya</text>
      <text class="sub" x="624" y="292">entiende las rutas como argv</text>
    </g>

    <g id="node-sin-xargs">
      <rect class="card-bad" x="40" y="360" width="420" height="112" rx="10"/>
      <text class="bad-title" x="64" y="392">cat lista.txt | rm</text>
      <text class="bad-text" x="64" y="420">rm no lee de stdin: se queda esperando</text>
      <text class="bad-text" x="64" y="442">o falla con un error de sintaxis.</text>
    </g>

    <g id="node-con-xargs">
      <rect class="card-good" x="500" y="360" width="420" height="112" rx="10"/>
      <text class="good-title" x="524" y="392">cat lista.txt | xargs rm</text>
      <text class="good-text" x="524" y="420">xargs construye la orden real con los</text>
      <text class="good-text" x="524" y="442">argumentos: rm arch1.tmp arch2.tmp</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="492">-n 1: una ejecución del comando por cada elemento.</text>
    <text class="note" x="40" y="514">-I {}: coloca el argumento justo donde tú elijas.</text>
  </g>
</svg>
