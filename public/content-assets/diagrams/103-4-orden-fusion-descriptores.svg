<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ofd-title ofd-desc">
  <title id="ofd-title">Orden de evaluación de la fusión de stdout y stderr (LPIC-1 103.4)</title>
  <desc id="ofd-desc">La redirección se evalúa de izquierda a derecha. Con cmd &gt; log.txt 2&gt;&amp;1 el operador &gt; apunta primero el canal 1 al archivo y después 2&gt;&amp;1 copia ese destino al canal 2, de modo que éxitos y errores acaban unidos en el log. Con cmd 2&gt;&amp;1 &gt; log.txt el canal 2 copia antes el destino actual del canal 1, que todavía es la pantalla, y solo el canal 1 va al archivo: los errores se escapan.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .panel-bad { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .plate { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .kicker-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #065F46; letter-spacing: 0.08em; }
      .kicker-bad { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.08em; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #0F172A; }
      .step { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #0F172A; }
      .result { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #334155; }
      .badge-ok { fill: #059669; }
      .badge-bad { fill: #E11D48; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · FUSIÓN DE FLUJOS (POSIX)</text>
    <text class="title" x="40" y="78">El orden se lee de izquierda a derecha</text>
    <text class="subtitle" x="40" y="102">Primero se apunta el destino, después se copia al otro canal</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-orden-valido">
      <rect class="panel-ok" x="40" y="118" width="880" height="160" rx="12"/>
      <text class="kicker-ok" x="64" y="144">ORDEN VÁLIDO</text>
      <rect class="plate" x="64" y="156" width="330" height="52" rx="8"/>
      <text class="cmd" x="86" y="190">cmd &gt; log.txt 2&gt;&amp;1</text>
      <circle class="badge-ok" cx="430" cy="171" r="11"/>
      <text class="badge-num" x="430" y="175">1</text>
      <text class="step" x="450" y="175">El operador &gt; apunta el canal 1 al archivo.</text>
      <circle class="badge-ok" cx="430" cy="209" r="11"/>
      <text class="badge-num" x="430" y="213">2</text>
      <text class="step" x="450" y="213">2&gt;&amp;1 copia ese destino al canal 2.</text>
      <text class="result" x="64" y="252">Resultado: éxitos y errores unidos en log.txt, en orden.</text>
    </g>

    <g id="node-orden-invertido">
      <rect class="panel-bad" x="40" y="292" width="880" height="160" rx="12"/>
      <text class="kicker-bad" x="64" y="318">ORDEN INVERTIDO</text>
      <rect class="plate" x="64" y="330" width="330" height="52" rx="8"/>
      <text class="cmd" x="86" y="364">cmd 2&gt;&amp;1 &gt; log.txt</text>
      <circle class="badge-bad" cx="430" cy="345" r="11"/>
      <text class="badge-num" x="430" y="349">1</text>
      <text class="step" x="450" y="349">2&gt;&amp;1 copia el destino actual del canal 1:</text>
      <text class="step" x="450" y="367">que todavía es la pantalla.</text>
      <circle class="badge-bad" cx="430" cy="395" r="11"/>
      <text class="badge-num" x="430" y="399">2</text>
      <text class="step" x="450" y="399">&gt; redirige solo el canal 1 al archivo.</text>
      <text class="result" x="64" y="430">Resultado: los errores se escapan y siguen en pantalla.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="480">El ampersand va pegado al número: 2&gt;&amp;1, nunca 2&gt; &amp;1.</text>
    <text class="note" x="40" y="504">Con espacio, Bash aborta con un error de sintaxis.</text>
  </g>
</svg>
