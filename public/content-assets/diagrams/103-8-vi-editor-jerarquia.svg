<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vi-editor-jerarquia-title vi-editor-jerarquia-desc">
  <title id="vi-editor-jerarquia-title">Jerarquía del editor por defecto: $VISUAL, $EDITOR, /usr/bin/editor y /bin/vi (LPIC-1 103.8)</title>
  <desc id="vi-editor-jerarquia-desc">Cuando crontab -e o visudo abren un editor, lo eligen en este orden. Primero miran la variable VISUAL, pensada para terminales de pantalla completa, y si existe la usan antes que cualquier otra cosa. Después miran la variable EDITOR, el estándar POSIX que se exporta en ~/.bash_profile o en ~/.bashrc. Si no hay ninguna de las dos, usan el enlace /usr/bin/editor, que update-alternatives configura entre nano, vim.basic y vim.tiny. Como último recurso queda /bin/vi, presente incluso en un sistema en rescate. El comando sudo update-alternatives --config editor cambia ese enlace para todo el sistema y select-editor guarda la preferencia de un usuario.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-var { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-link { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-last { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .spine { stroke: #1D40D8; stroke-width: 2; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .footer { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .footer-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">EDITOR · VARIABLES Y ALTERNATIVAS</text>
    <text class="title" x="40" y="78">Cuatro candidatos, en orden de prioridad</text>
    <text class="subtitle" x="40" y="102">Gana la primera que exista, de arriba abajo.</text>
  </g>

  <g id="diagram-relations">
    <line id="vjer-spine-1" class="spine" x1="44" y1="177" x2="44" y2="231"/>
    <line id="vjer-spine-2" class="spine" x1="44" y1="261" x2="44" y2="315"/>
    <line id="vjer-spine-3" class="spine" x1="44" y1="345" x2="44" y2="399"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-visual">
      <rect class="node-var" x="72" y="128" width="568" height="68" rx="10"/>
      <text class="mono-name" x="104" y="160">$VISUAL</text>
      <text class="node-sub" x="104" y="184">si existe, se usa antes que $EDITOR</text>
    </g>

    <g id="node-editor">
      <rect class="node-var" x="72" y="212" width="568" height="68" rx="10"/>
      <text class="mono-name" x="104" y="244">$EDITOR</text>
      <text class="node-sub" x="104" y="268">estándar POSIX; se evalúa si falta $VISUAL</text>
    </g>

    <g id="node-enlace">
      <rect class="node-link" x="72" y="296" width="568" height="68" rx="10"/>
      <text class="mono-name" x="104" y="328">/usr/bin/editor</text>
      <text class="node-sub" x="104" y="352">enlace simbólico que gestiona update-alternatives</text>
    </g>

    <g id="node-vi">
      <rect class="node-last" x="72" y="380" width="568" height="68" rx="10"/>
      <text class="mono-name" x="104" y="412">/bin/vi</text>
      <text class="node-sub" x="104" y="436">último recurso del sistema, siempre presente</text>
    </g>

    <g id="node-pie">
      <rect class="footer" x="40" y="462" width="880" height="48" rx="10"/>
      <text class="footer-mono" x="64" y="492">sudo update-alternatives --config editor</text>
      <text class="note" x="470" y="492">select-editor guarda la preferencia en ~/.selected_editor</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="44" cy="162" r="15"/>
    <text class="badge-num" x="44" y="167">1</text>
    <text class="note" x="668" y="156">Pensada para terminales</text>
    <text class="note" x="668" y="178">de pantalla completa.</text>

    <circle class="badge" cx="44" cy="246" r="15"/>
    <text class="badge-num" x="44" y="251">2</text>
    <text class="note" x="668" y="240">Se exporta en ~/.bash_profile</text>
    <text class="note" x="668" y="262">o en ~/.bashrc.</text>

    <circle class="badge" cx="44" cy="330" r="15"/>
    <text class="badge-num" x="44" y="335">3</text>
    <text class="note" x="668" y="324">Elige entre nano, vim.basic</text>
    <text class="note" x="668" y="346">o vim.tiny.</text>

    <circle class="badge" cx="44" cy="414" r="15"/>
    <text class="badge-num" x="44" y="419">4</text>
    <text class="note" x="668" y="408">Siempre presente, también</text>
    <text class="note" x="668" y="430">en el modo de rescate.</text>
  </g>
</svg>

