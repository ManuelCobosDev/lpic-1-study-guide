<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="especiales-title especiales-desc">
  <title id="especiales-title">SUID, SGID y sticky bit: octal, efecto y ejemplo (LPIC-1 104.5)</title>
  <desc id="especiales-desc">Tres tarjetas explican los bits especiales. SUID vale 4000 y hace que un binario ejecutable corra con los privilegios de su propietario, como /usr/bin/passwd, que aparece como -rwsr-xr-x y se activa con chmod 4755 o chmod u+s. SGID vale 2000: en un binario usa el grupo del archivo y en un directorio hace que los archivos creados hereden su grupo, como /shared/devs con drwxrwsr-x, chmod 2775 o g+s. El sticky bit vale 1000 y protege del borrado ajeno en directorios compartidos como /tmp y /var/tmp, con drwxrwxrwt, chmod 1777 o +t. La banda inferior muestra el formato octal de cuatro dígitos y descompone chmod 2775.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .bit-suid { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .bit-sgid { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #047857; text-anchor: middle; }
      .bit-sticky { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #B45309; text-anchor: middle; }
      .octal-suid { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; text-anchor: middle; }
      .octal-sgid { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #047857; letter-spacing: 0.06em; text-anchor: middle; }
      .octal-sticky { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #B45309; letter-spacing: 0.06em; text-anchor: middle; }
      .body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .example { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #334155; }
      .command { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #1E36AF; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .format-band { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .format-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .format-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PERMISOS ESPECIALES · CUARTO DÍGITO OCTAL</text>
    <text class="title" x="40" y="78">Tres bits que cambian las reglas</text>
    <text class="subtitle" x="40" y="102">Modifican la identidad, la herencia y el borrado</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-suid">
      <rect class="card" x="40" y="128" width="288" height="256" rx="10"/>
      <text class="bit-suid" x="184" y="166">SUID</text>
      <text class="octal-suid" x="184" y="188">OCTAL 4000</text>
      <line class="divider" x1="64" y1="200" x2="304" y2="200"/>
      <text class="body" x="64" y="230">en binarios ejecutables:</text>
      <text class="body" x="64" y="252">corre con los privilegios</text>
      <text class="body" x="64" y="274">del propietario (root).</text>
      <text class="example" x="64" y="306">/usr/bin/passwd</text>
      <text class="example" x="64" y="330">-rwsr-xr-x root:root</text>
      <text class="command" x="64" y="354">chmod 4755 · chmod u+s</text>
      <text class="note" x="64" y="374">así se edita /etc/shadow</text>
    </g>

    <g id="node-sgid">
      <rect class="card" x="336" y="128" width="288" height="256" rx="10"/>
      <text class="bit-sgid" x="480" y="166">SGID</text>
      <text class="octal-sgid" x="480" y="188">OCTAL 2000</text>
      <line class="divider" x1="360" y1="200" x2="600" y2="200"/>
      <text class="body" x="360" y="230">en binarios: grupo del</text>
      <text class="body" x="360" y="252">archivo; en directorios,</text>
      <text class="body" x="360" y="274">el grupo se hereda.</text>
      <text class="example" x="360" y="306">/shared/devs/</text>
      <text class="example" x="360" y="330">drwxrwsr-x root:devs</text>
      <text class="command" x="360" y="354">chmod 2775 · chmod g+s</text>
      <text class="note" x="360" y="374">trabajo colaborativo</text>
    </g>

    <g id="node-sticky">
      <rect class="card" x="632" y="128" width="288" height="256" rx="10"/>
      <text class="bit-sticky" x="776" y="166">STICKY BIT</text>
      <text class="octal-sticky" x="776" y="188">OCTAL 1000</text>
      <line class="divider" x1="656" y1="200" x2="896" y2="200"/>
      <text class="body" x="656" y="230">en directorios compartidos:</text>
      <text class="body" x="656" y="252">todos crean, pero solo el</text>
      <text class="body" x="656" y="274">dueño o root borra.</text>
      <text class="example" x="656" y="306">/tmp y /var/tmp</text>
      <text class="example" x="656" y="330">drwxrwxrwt root:root</text>
      <text class="command" x="656" y="354">chmod 1777 · chmod +t</text>
      <text class="note" x="656" y="374">bit adhesivo</text>
    </g>

    <g id="node-formato">
      <rect class="format-band" x="40" y="420" width="880" height="84" rx="10"/>
      <text class="format-title" x="64" y="450">Formato de 4 dígitos: [especiales] [dueño] [grupo] [otros]</text>
      <text class="format-body" x="64" y="480">chmod 2775 = 2 (SGID) + 7 + 7 + 5</text>
    </g>
  </g>
</svg>
