<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="opciones-title opciones-desc">
  <title id="opciones-title">Dos combinaciones de opciones de grep y su salida real (LPIC-1 103.7)</title>
  <desc id="opciones-desc">Dos filtros reales muestran el efecto de las opciones sobre el flujo de líneas. En el primero, grep -vn 'nologin' /etc/passwd invierte la selección para descartar las cuentas nologin y numera cada línea que sobrevive con su número original. En el segundo, grep -ci 'failed password' /var/log/auth.log cuenta las líneas coincidentes ignorando mayúsculas y devuelve un único número en lugar de las líneas. Una banda recuerda que sin -H no hay nombre de fichero, que -f lee los patrones de un fichero y que -z separa registros por byte nulo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-out { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-count { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .cmd-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .file-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .out-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .count-num { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 44px; font-weight: 700; fill: #065F46; }
      .count-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #065F46; }
      .count-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="opciones-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">OPCIONES DE grep · DOS FILTROS REALES</text>
    <text class="title" x="40" y="78">Qué hace cada opción al flujo de líneas</text>
    <text class="subtitle" x="40" y="102">Dos combinaciones de opciones y su salida real.</text>
  </g>

  <g id="diagram-relations">
    <path id="opciones-rel-vn" class="edge"
          data-from="node-cmd-vn" data-to="node-out-vn" data-relation="filtra-y-numera"
          d="M 420 210 H 460" marker-end="url(#opciones-arrow)"/>
    <path id="opciones-rel-ci" class="edge"
          data-from="node-cmd-ci" data-to="node-out-ci" data-relation="cuenta-coincidencias"
          d="M 420 380 H 460" marker-end="url(#opciones-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-cmd-vn">
      <rect class="node-cmd" x="40" y="150" width="380" height="120" rx="10"/>
      <text class="cmd-mono" x="64" y="184">grep -vn 'nologin'</text>
      <text class="file-mono" x="64" y="208">/etc/passwd</text>
      <text class="sub" x="64" y="234">-v descarta las cuentas nologin;</text>
      <text class="sub" x="64" y="254">-n antepone el número de línea.</text>
    </g>

    <g id="node-out-vn">
      <rect class="node-out" x="460" y="150" width="460" height="120" rx="10"/>
      <text class="out-mono" x="484" y="186">1:root:x:0:0:root:/root:/bin/bash</text>
      <text class="out-mono" x="484" y="214">24:sync:x:4:65534:sync:/bin:/bin/sync</text>
      <text class="out-mono" x="484" y="242">39:debian:x:1000:1000:…</text>
    </g>

    <g id="node-cmd-ci">
      <rect class="node-cmd" x="40" y="320" width="380" height="120" rx="10"/>
      <text class="cmd-mono" x="64" y="356">grep -ci 'failed password'</text>
      <text class="file-mono" x="64" y="380">/var/log/auth.log</text>
      <text class="sub" x="64" y="406">-c cuenta las líneas, no las imprime;</text>
      <text class="sub" x="64" y="426">-i ignora mayúsculas y minúsculas.</text>
    </g>

    <g id="node-out-ci">
      <rect class="node-count" x="460" y="320" width="460" height="120" rx="10"/>
      <text class="count-num" x="484" y="396">42</text>
      <text class="count-label" x="560" y="368">líneas coincidentes</text>
      <text class="count-note" x="560" y="396">-c sustituye a la tubería grep | wc -l</text>
    </g>

    <g id="node-banda">
      <rect class="band" x="40" y="456" width="880" height="58" rx="10"/>
      <text class="band-text" x="64" y="482">Sin -H, grep no antepone el nombre del fichero cuando recibe una sola ruta: crítico con find.</text>
      <text class="band-text" x="64" y="504">-f lee los patrones de un fichero externo; -z separa los registros por byte nulo (find -print0).</text>
    </g>
  </g>
</svg>
