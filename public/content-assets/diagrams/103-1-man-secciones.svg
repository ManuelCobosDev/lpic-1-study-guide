<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-man-title p1031-man-desc">
  <title id="p1031-man-title">Secciones 1, 5 y 8 del manual man (LPIC-1 103.1)</title>
  <desc id="p1031-man-desc">El manual man se organiza en ocho tomos temáticos. La sección 1 documenta los comandos de usuario como ls, cp y passwd; la sección 5 documenta los formatos de ficheros de configuración como /etc/passwd, /etc/fstab y /etc/shadow; y la sección 8 documenta los comandos de administración reservados a root como fdisk, useradd, mkfs y mount. Apropos equivale a man -k y whatis equivale a man -f.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .vol { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; }
      .vol-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #64748B; text-anchor: middle; }
      .vol-on-1 { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .vol-on-5 { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .vol-on-8 { fill: #F8FAFC; stroke: #2550EB; stroke-width: 2; }
      .vol-text-on { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .panel-a { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-b { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-c { fill: #F8FAFC; stroke: #2550EB; stroke-width: 2; }
      .head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .head-c { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .panel-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .examples { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #1E36AF; }
      .examples-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #334155; }
      .examples-c { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #334155; }
      .panel-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; }
      .badge { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.04em; text-anchor: middle; }
      .band { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .equiv { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .equiv-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">MAN · SECCIONES DEL MANUAL</text>
    <text class="title" x="40" y="78">Ocho tomos y tres secciones de examen</text>
    <text class="subtitle" x="40" y="102">man passwd abre la sección 1 por defecto;</text>
    <text class="subtitle" x="40" y="122">el formato de /etc/passwd exige man 5 passwd.</text>
  </g>

  <g id="diagram-nodes">
    <g id="vol-lab">
      <text class="body" x="40" y="153">El manual tiene 8 tomos:</text>
    </g>
    <g id="vol-1"><rect class="vol-on-1" x="320" y="132" width="56" height="32" rx="6"/><text class="vol-text-on" x="348" y="153">1</text></g>
    <g id="vol-2"><rect class="vol" x="382" y="132" width="56" height="32" rx="6"/><text class="vol-text" x="410" y="153">2</text></g>
    <g id="vol-3"><rect class="vol" x="444" y="132" width="56" height="32" rx="6"/><text class="vol-text" x="472" y="153">3</text></g>
    <g id="vol-4"><rect class="vol" x="506" y="132" width="56" height="32" rx="6"/><text class="vol-text" x="534" y="153">4</text></g>
    <g id="vol-5"><rect class="vol-on-5" x="568" y="132" width="56" height="32" rx="6"/><text class="vol-text-on" x="596" y="153">5</text></g>
    <g id="vol-6"><rect class="vol" x="630" y="132" width="56" height="32" rx="6"/><text class="vol-text" x="658" y="153">6</text></g>
    <g id="vol-7"><rect class="vol" x="692" y="132" width="56" height="32" rx="6"/><text class="vol-text" x="720" y="153">7</text></g>
    <g id="vol-8"><rect class="vol-on-8" x="754" y="132" width="56" height="32" rx="6"/><text class="vol-text-on" x="782" y="153">8</text></g>

    <g id="panel-1">
      <rect class="panel-a" x="40" y="180" width="280" height="230" rx="10"/>
      <text class="head-a" x="60" y="206">SECCIÓN 1</text>
      <text class="cmd" x="60" y="234">man 1 passwd</text>
      <text class="panel-title" x="60" y="264">Comandos de usuario</text>
      <text class="body" x="60" y="290">Sintaxis y opciones de los</text>
      <text class="body" x="60" y="310">programas que invocas: ls, cp</text>
      <text class="examples" x="60" y="338">passwd cambia tu clave</text>
      <text class="panel-note" x="60" y="384">Sección por defecto de man passwd.</text>
    </g>

    <g id="panel-5">
      <rect class="panel-b" x="340" y="180" width="280" height="230" rx="10"/>
      <text class="head-b" x="360" y="206">SECCIÓN 5</text>
      <rect class="badge" x="476" y="188" width="124" height="24" rx="6"/>
      <text class="badge-text" x="538" y="205">TOP EXAMEN</text>
      <text class="cmd" x="360" y="234">man 5 passwd</text>
      <text class="panel-title" x="360" y="264">Formatos de ficheros</text>
      <text class="body" x="360" y="290">Estructura interna, campos</text>
      <text class="body" x="360" y="310">y sintaxis de un fichero de /etc/</text>
      <text class="examples-b" x="360" y="338">/etc/passwd · /etc/fstab</text>
      <text class="examples-b" x="360" y="356">/etc/shadow</text>
      <text class="panel-note" x="360" y="384">No es un comando: es el formato.</text>
    </g>

    <g id="panel-8">
      <rect class="panel-c" x="640" y="180" width="280" height="230" rx="10"/>
      <text class="head-c" x="660" y="206">SECCIÓN 8</text>
      <text class="cmd" x="660" y="234">man 8 fdisk</text>
      <text class="panel-title" x="660" y="264">Administración (root)</text>
      <text class="body" x="660" y="290">Mantenimiento de hardware,</text>
      <text class="body" x="660" y="310">discos y demonios</text>
      <text class="examples-c" x="660" y="338">fdisk · useradd</text>
      <text class="examples-c" x="660" y="356">mkfs · mount</text>
      <text class="panel-note" x="660" y="384">Reservada al superusuario root.</text>
    </g>

    <g id="band-search">
      <rect class="band" x="40" y="430" width="880" height="62" rx="10"/>
      <text class="equiv" x="60" y="456">apropos palabra ≡ man -k palabra</text>
      <text class="equiv-note" x="60" y="478">busca por palabra clave si no recuerdas el comando</text>
      <line class="divider" x1="480" y1="442" x2="480" y2="480"/>
      <text class="equiv" x="500" y="456">whatis comando ≡ man -f comando</text>
      <text class="equiv-note" x="500" y="478">resumen de una sola línea</text>
    </g>
  </g>
</svg>
