<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="priv-title priv-desc">
  <title id="priv-title">Matriz de privilegios de planificación: usuario estándar frente a root (LPIC-1 103.6)</title>
  <desc id="priv-desc">La matriz cruza cuatro reglas con los dos niveles de privilegio. Un usuario estándar solo puede moverse entre 0 y +19, es decir, solo puede ceder CPU y no puede perjudicar a otros usuarios; si intenta un nice negativo recibe el mensaje nice: cannot set niceness: Permission denied; además la regla es de sentido único, porque si sube su nice a 15 ya no puede volver a 0. Root, con sudo, usa todo el rango de -20 a +19, sube o baja la prioridad a su antojo, rescata y acelera procesos en caliente y alcanza a sus propios procesos o a los de cualquier usuario.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .matrix { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .head-user { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .head-root { fill: #EFF4FF; stroke: #2550EB; stroke-width: 1.5; }
      .head-label { fill: #F8FAFC; stroke: #475569; stroke-width: 1.5; }
      .head-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; letter-spacing: 0.04em; }
      .head-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.05em; }
      .cell { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .cell-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #881337; }
      .cell-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .cell-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
      .grid { stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PRIVILEGIOS · NICE Y RENICE</text>
    <text class="title" x="40" y="78">Quién puede tocar la prioridad</text>
    <text class="subtitle" x="40" y="102">Un usuario solo puede ceder CPU;</text>
    <text class="subtitle" x="40" y="122">root reparte en ambos sentidos.</text>
  </g>

  <g id="diagram-groups">
    <rect class="matrix" x="40" y="140" width="880" height="344"/>
    <rect class="head-label" x="40" y="140" width="236" height="56"/>
    <rect class="head-user" x="276" y="140" width="320" height="56"/>
    <rect class="head-root" x="596" y="140" width="324" height="56"/>
    <rect class="cell-warn" x="276" y="340" width="320" height="72"/>
    <rect class="cell-ok" x="596" y="340" width="324" height="72"/>
    <line class="grid" x1="40" y1="196" x2="920" y2="196"/>
    <line class="grid" x1="40" y1="268" x2="920" y2="268"/>
    <line class="grid" x1="40" y1="340" x2="920" y2="340"/>
    <line class="grid" x1="40" y1="412" x2="920" y2="412"/>
    <line class="grid" x1="276" y1="196" x2="276" y2="484"/>
    <line class="grid" x1="596" y1="196" x2="596" y2="484"/>
  </g>

  <g id="diagram-labels">
    <text class="head-title" x="158" y="170">REGLA</text>
    <text class="head-title" x="436" y="166">USUARIO ESTÁNDAR</text>
    <text class="head-sub" x="436" y="184">sin sudo</text>
    <text class="head-title" x="758" y="166">ROOT / SUDO</text>
    <text class="head-sub" x="758" y="184">privilegios totales</text>

    <text class="row-label" x="64" y="222">VALORES PERMITIDOS</text>
    <text class="cell" x="296" y="222">De 0 a +19 (solo más amable)</text>
    <text class="cell" x="616" y="222">Todo el rango: -20 a +19</text>

    <text class="row-label" x="64" y="292">ACCIÓN</text>
    <text class="cell" x="296" y="290">Solo puede ceder CPU; no</text>
    <text class="cell" x="296" y="310">puede perjudicar a otros.</text>
    <text class="cell" x="616" y="290">Sube o baja su prioridad</text>
    <text class="cell" x="616" y="310">a su antojo, en ambos sentidos.</text>

    <text class="row-label" x="64" y="362">NICE NEGATIVO</text>
    <text class="cell-mono" x="296" y="360">nice: cannot set niceness:</text>
    <text class="cell-mono" x="296" y="380">Permission denied</text>
    <text class="cell" x="616" y="370">Permitido: -1 a -20</text>

    <text class="row-label" x="64" y="432">ALCANCE Y SENTIDO</text>
    <text class="cell" x="296" y="430">Si sube a 15, no puede</text>
    <text class="cell" x="296" y="450">volver a 0.</text>
    <text class="cell" x="616" y="428">Rescata y acelera procesos</text>
    <text class="cell" x="616" y="446">en caliente: los suyos o</text>
    <text class="cell" x="616" y="464">los de cualquier usuario.</text>
  </g>
</svg>
