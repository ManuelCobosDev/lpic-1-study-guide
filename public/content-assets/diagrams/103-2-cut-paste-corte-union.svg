<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cutpaste-title cutpaste-desc">
  <title id="cutpaste-title">Corte vertical de columnas con cut frente a la unión horizontal de paste (LPIC-1 103.2)</title>
  <desc id="cutpaste-desc">Matriz de los siete campos de /etc/passwd separados por dos puntos: usuario, x, UID, GID, nombre completo, home y shell. El comando cut -d: -f1,7 conserva únicamente los campos primero y séptimo, el usuario y su shell, y descarta los demás. Debajo, dos tarjetas resumen el modelo mental: cut es una guillotina vertical que corta columnas enteras y paste es una cinta adhesiva horizontal que une la línea uno de un fichero con la línea uno del otro, por ejemplo con paste -d, nombres.txt ips.txt.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .cmd-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .grid { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .cell-keep { fill: #EFF4FF; }
      .cell-drop { fill: #F8FAFC; }
      .cell-head { fill: #F1F5F9; }
      .col-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; text-anchor: middle; }
      .col-name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .val-keep { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .val-drop { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 400; fill: #94A3B8; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .card-a { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-b { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-title-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .card-title-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .card-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">CORTE Y UNIÓN · cut Y paste</text>
    <text class="title" x="40" y="78">Cortar en vertical, pegar en horizontal</text>
    <text class="subtitle" x="40" y="102">Los siete campos de /etc/passwd separados por dos puntos.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-grid">
      <rect class="grid" x="54" y="190" width="812" height="148" rx="6"/>
      <rect class="cell-head" x="54" y="190" width="812" height="52"/>
      <rect class="cell-keep" x="54" y="242" width="116" height="48"/>
      <rect class="cell-drop" x="170" y="242" width="464" height="48"/>
      <rect class="cell-keep" x="750" y="242" width="116" height="48"/>
      <rect class="cell-keep" x="54" y="290" width="116" height="48"/>
      <rect class="cell-drop" x="170" y="290" width="464" height="48"/>
      <rect class="cell-keep" x="750" y="290" width="116" height="48"/>
      <rect x="54" y="190" width="812" height="148" rx="6" fill="none" stroke="#475569" stroke-width="2"/>
      <line class="divider" x1="170" y1="190" x2="170" y2="338"/>
      <line class="divider" x1="286" y1="190" x2="286" y2="338"/>
      <line class="divider" x1="402" y1="190" x2="402" y2="338"/>
      <line class="divider" x1="518" y1="190" x2="518" y2="338"/>
      <line class="divider" x1="634" y1="190" x2="634" y2="338"/>
      <line class="divider" x1="750" y1="190" x2="750" y2="338"/>
      <line class="divider" x1="60" y1="242" x2="860" y2="242"/>
      <line class="divider" x1="60" y1="290" x2="860" y2="290"/>
      <text class="col-num" x="112" y="210">1</text>
      <text class="col-num" x="228" y="210">2</text>
      <text class="col-num" x="344" y="210">3</text>
      <text class="col-num" x="460" y="210">4</text>
      <text class="col-num" x="576" y="210">5</text>
      <text class="col-num" x="692" y="210">6</text>
      <text class="col-num" x="808" y="210">7</text>
      <text class="col-name" x="112" y="230">usuario</text>
      <text class="col-name" x="228" y="230">x</text>
      <text class="col-name" x="344" y="230">UID</text>
      <text class="col-name" x="460" y="230">GID</text>
      <text class="col-name" x="576" y="230">nombre</text>
      <text class="col-name" x="692" y="230">home</text>
      <text class="col-name" x="808" y="230">shell</text>
      <text class="val-keep" x="112" y="272">ana</text>
      <text class="val-drop" x="228" y="272">x</text>
      <text class="val-drop" x="344" y="272">1000</text>
      <text class="val-drop" x="460" y="272">1000</text>
      <text class="val-drop" x="576" y="272">Ana Ruiz</text>
      <text class="val-drop" x="692" y="272">/home/ana</text>
      <text class="val-keep" x="808" y="272">/bin/bash</text>
      <text class="val-keep" x="112" y="320">root</text>
      <text class="val-drop" x="228" y="320">x</text>
      <text class="val-drop" x="344" y="320">0</text>
      <text class="val-drop" x="460" y="320">0</text>
      <text class="val-drop" x="576" y="320">root</text>
      <text class="val-drop" x="692" y="320">/root</text>
      <text class="val-keep" x="808" y="320">/bin/bash</text>
    </g>

    <g id="node-guillotina">
      <rect class="card-a" x="40" y="364" width="430" height="120" rx="10"/>
      <text class="card-title-a" x="64" y="396">Guillotina vertical</text>
      <text class="card-cmd" x="64" y="424">cut -d: -f1,7</text>
      <text class="card-text" x="64" y="450">Corta columnas enteras y conserva</text>
      <text class="card-text" x="64" y="472">usuario y shell; el resto se descarta.</text>
    </g>

    <g id="node-cinta">
      <rect class="card-b" x="490" y="364" width="430" height="120" rx="10"/>
      <text class="card-title-b" x="514" y="396">Cinta adhesiva horizontal</text>
      <text class="card-cmd" x="514" y="424">paste -d, nombres.txt ips.txt</text>
      <text class="card-text" x="514" y="450">Une la línea 1 de un fichero con la</text>
      <text class="card-text" x="514" y="472">línea 1 del otro: monta un CSV.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="cmd" x="40" y="150">cut -d: -f1,7 /etc/passwd</text>
    <text class="cmd-note" x="40" y="174">conserva solo los campos 1 y 7; el resto se descarta</text>
  </g>
</svg>
