<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="tee-title tee-desc">
  <title id="tee-title">Bifurcación del flujo con tee: pantalla y archivo a la vez (LPIC-1 103.4)</title>
  <desc id="tee-desc">El flujo de entrada llega a tee, que lo duplica sin detenerlo: una rama sigue hacia la pantalla o hacia el siguiente comando de la tubería y la otra se escribe en uno o varios archivos. La variante tee -a añade al final en lugar de truncar y sudo tee escribe como root en rutas protegidas. La banda inferior explica por qué sudo echo 1 &gt; /proc/sys/... falla: sudo solo eleva el echo y la redirección la ejecuta la shell sin privilegios.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-in { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-tee { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2.5; }
      .card-screen { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-stop { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .tee-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .sub-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .out-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .out-title-file { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .out-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .stop-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .stop-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-file { fill: none; stroke: #475569; stroke-width: 2.5; }
    </style>
    <marker id="tee-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="tee-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · TEE: UNA ENTRADA, DOS SALIDAS</text>
    <text class="title" x="40" y="78">La pieza en T de la fontanería</text>
    <text class="subtitle" x="40" y="102">Ve el resultado en pantalla y guárdalo en disco a la vez</text>
  </g>

  <g id="diagram-relations">
    <path id="tee-rel-entrada-tee" class="edge"
          data-from="node-entrada" data-to="node-tee" data-relation="entrada-del-flujo"
          d="M 260 255 H 320" marker-end="url(#tee-arrow-blue)"/>
    <path id="tee-rel-tee-pantalla" class="edge"
          data-from="node-tee" data-to="node-pantalla" data-relation="rama-stdout"
          d="M 500 225 H 545 V 185 H 580" marker-end="url(#tee-arrow-blue)"/>
    <path id="tee-rel-tee-archivo" class="edge-file"
          data-from="node-tee" data-to="node-archivo" data-relation="rama-fichero"
          d="M 500 285 H 545 V 325 H 580" marker-end="url(#tee-arrow-slate)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-entrada">
      <rect class="card-in" x="40" y="210" width="220" height="90" rx="10"/>
      <text class="cmd" x="64" y="246">dd &lt; /dev/sda1</text>
      <text class="sub" x="64" y="270">flujo de entrada</text>
    </g>

    <g id="node-tee">
      <rect class="node-tee" x="320" y="195" width="180" height="120" rx="10"/>
      <text class="tee-name" x="410" y="240">tee</text>
      <text class="sub-center" x="410" y="264">duplica el flujo</text>
      <text class="sub-center" x="410" y="284">sin detenerlo</text>
    </g>

    <g id="node-pantalla">
      <rect class="card-screen" x="580" y="140" width="340" height="90" rx="10"/>
      <text class="out-title" x="604" y="176">Pantalla</text>
      <text class="out-text" x="604" y="202">el flujo sigue hacia el siguiente comando</text>
    </g>

    <g id="node-archivo">
      <rect class="card-file" x="580" y="280" width="340" height="90" rx="10"/>
      <text class="out-title-file" x="604" y="316">Archivo en disco</text>
      <text class="out-text" x="604" y="342">-a añade al final en lugar de truncar</text>
    </g>

    <g id="node-trampa-sudo">
      <rect class="band-stop" x="40" y="400" width="880" height="84" rx="10"/>
      <text class="stop-title" x="64" y="432">Trampa de root: sudo echo 1 &gt; /proc/sys/... falla</text>
      <text class="stop-text" x="64" y="458">sudo solo eleva echo; la redirección la hace la shell sin privilegios. sudo tee sí escribe como root.</text>
    </g>
  </g>
</svg>
