<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="demo-title demo-desc">
  <title id="demo-title">Por qué un demonio muestra TTY '?' y quién adopta a los huérfanos (LPIC-1 101.3)</title>
  <desc id="demo-desc">En la salida de ps, un shell interactivo tiene asignada una terminal, tty1 o pts/0, porque se abrió sobre un teclado y una pantalla. Un demonio como sshd o cron muestra un signo de interrogación en la columna TTY porque nadie le abrió una terminal: corre en segundo plano. Su PPID vale 1 porque lo lanzó init o systemd. Si el proceso padre termina antes que el hijo, el hijo queda huérfano y el PID 1 lo adopta para poder recoger su código de salida y evitar procesos zombis en la memoria.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .kicker { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .kicker-blue { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .kicker-green { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .panel-cli { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-svc { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .mono-xl { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #1E36AF; }
      .mono-q { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 32px; font-weight: 700; fill: #065F46; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .sub-dark { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .node-step { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
    </style>

    <marker id="demo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">DEMONIOS · TERMINAL Y PID 1</text>
    <text class="title" x="40" y="78">Por qué un demonio muestra TTY '?'</text>
    <text class="subtitle" x="40" y="102">ps y pstree: la terminal ausente y el padre adoptivo</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-shell">
      <rect class="panel-cli" x="40" y="128" width="420" height="200" rx="10"/>
      <text class="kicker-blue" x="64" y="164">SHELL INTERACTIVA</text>
      <text class="mono-xl" x="64" y="202">pts/0</text>
      <text class="sub" x="64" y="236">Atada a teclado y pantalla</text>
      <text class="sub" x="64" y="258">ps muestra pts/0 o tty1</text>
      <text class="sub" x="64" y="286">Es hija del login que la abrió</text>
    </g>

    <g id="node-daemon">
      <rect class="panel-svc" x="500" y="128" width="420" height="200" rx="10"/>
      <text class="kicker-green" x="524" y="164">DEMONIO EN SEGUNDO PLANO</text>
      <text class="mono-q" x="524" y="206">?</text>
      <text class="sub" x="524" y="236">Sin terminal: nadie se la abrió</text>
      <text class="sub" x="524" y="258">ps muestra ? en la columna TTY</text>
      <text class="sub" x="524" y="286">PPID 1: lo lanzó init/systemd</text>
    </g>

    <g id="node-padre">
      <rect class="node-step" x="40" y="376" width="260" height="64" rx="8"/>
      <text class="mono" x="64" y="402">El padre termina</text>
      <text class="sub-dark" x="64" y="424">y el hijo queda huérfano</text>
    </g>

    <g id="node-adopta">
      <rect class="node-step" x="360" y="376" width="260" height="64" rx="8"/>
      <text class="mono" x="384" y="402">PID 1 lo adopta</text>
      <text class="sub-dark" x="384" y="424">el PPID pasa a valer 1</text>
    </g>

    <g id="node-init">
      <rect class="node-step" x="680" y="376" width="240" height="64" rx="8"/>
      <text class="mono" x="704" y="402">init recoge el fin</text>
      <text class="sub-dark" x="704" y="424">y evita procesos zombis</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="demo-rel-padre-adopta" class="edge" data-from="node-padre" data-to="node-adopta" data-relation="orphan-adopted"
          d="M 300 408 H 360" marker-end="url(#demo-arrow)"/>
    <path id="demo-rel-adopta-init" class="edge" data-from="node-adopta" data-to="node-init" data-relation="reaps-exit"
          d="M 620 408 H 680" marker-end="url(#demo-arrow)"/>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="356">Si el padre muere antes que el hijo:</text>
    <text class="note" x="40" y="480">Ningún proceso se queda sin padre en Linux.</text>
    <text class="note" x="40" y="502">TTY '?' y PPID 1 son la firma de un demonio.</text>
  </g>
</svg>
