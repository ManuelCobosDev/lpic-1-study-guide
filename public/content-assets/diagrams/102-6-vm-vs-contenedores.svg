<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vm-ctr-title vm-ctr-desc">
  <title id="vm-ctr-title">Comparativa de examen entre máquinas virtuales y contenedores (LPIC-1 102.6)</title>
  <desc id="vm-ctr-desc">Dos paneles enfrentados con cinco filas. La máquina virtual, con KVM, QEMU o Xen, ejecuta un kernel propio e independiente que puede ser Windows o BSD sobre Linux, se aísla por hardware a nivel de silicio con un hipervisor Tipo 1, usa las extensiones Intel VT-x (vmx) o AMD-V (svm), pesa gigabytes y tarda minutos o decenas de segundos, y tiene UUID propio en /etc/machine-id y MAC dedicada. El contenedor comparte el kernel del host, por lo que todos son Linux; se aísla de forma lógica en espacio de usuario con cgroups y namespaces, arranca en milisegundos, ocupa megabytes y su identidad la gestiona el runtime.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #FFFFFF; stroke: #2550EB; stroke-width: 2; }
      .panel-head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .panel-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.04em; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .row-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .verdict { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">COMPARATIVA DE EXAMEN · VM FRENTE A CONTENEDOR</text>
    <text class="title" x="40" y="78">El kernel es la frontera</text>
    <text class="subtitle" x="40" y="102">Kernel propio frente a kernel compartido.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-vm">
      <rect class="panel-a" x="40" y="118" width="420" height="300" rx="10"/>
      <text class="panel-head-a" x="64" y="146">MÁQUINAS VIRTUALES · KVM/QEMU/XEN</text>
      <line class="divider" x1="64" y1="162" x2="436" y2="162"/>
      <text class="row-label" x="64" y="190">KERNEL</text>
      <text class="row-value" x="64" y="210">Propio e independiente: admite Windows o BSD</text>
      <text class="row-label" x="64" y="238">AISLAMIENTO</text>
      <text class="row-value" x="64" y="258">Por hardware, a nivel de silicio, con hipervisor</text>
      <text class="row-label" x="64" y="286">MECANISMO DE CPU</text>
      <text class="row-mono" x="64" y="306">Intel VT-x (vmx) / AMD-V (svm)</text>
      <text class="row-label" x="64" y="334">ARRANQUE Y PESO</text>
      <text class="row-value" x="64" y="354">Minutos o decenas de segundos; gigabytes</text>
      <text class="row-label" x="64" y="382">IDENTIDAD</text>
      <text class="row-value" x="64" y="402">UUID en /etc/machine-id y MAC dedicada</text>
    </g>

    <g id="node-panel-ctr">
      <rect class="panel-b" x="500" y="118" width="420" height="300" rx="10"/>
      <text class="panel-head-b" x="524" y="146">CONTENEDORES · LXC/DOCKER/PODMAN</text>
      <line class="divider" x1="524" y1="162" x2="896" y2="162"/>
      <text class="row-label" x="524" y="190">KERNEL</text>
      <text class="row-value" x="524" y="210">Compartido: el kernel del host; todos Linux</text>
      <text class="row-label" x="524" y="238">AISLAMIENTO</text>
      <text class="row-value" x="524" y="258">Lógico en espacio de usuario, sin hipervisor</text>
      <text class="row-label" x="524" y="286">MECANISMO DEL KERNEL</text>
      <text class="row-mono" x="524" y="306">cgroups (CPU/RAM) + namespaces (PID, red)</text>
      <text class="row-label" x="524" y="334">ARRANQUE Y PESO</text>
      <text class="row-value" x="524" y="354">Milisegundos; megabytes de disco</text>
      <text class="row-label" x="524" y="382">IDENTIDAD</text>
      <text class="row-value" x="524" y="402">ID del runtime (Docker o Podman)</text>
    </g>

    <g id="node-verdict">
      <rect class="verdict" x="40" y="434" width="880" height="56" rx="10"/>
      <text class="verdict-label" x="62" y="467">FRONTERA</text>
      <text class="verdict-text" x="160" y="467">kernel propio en la VM; kernel del host en el contenedor.</text>
    </g>
  </g>
</svg>
