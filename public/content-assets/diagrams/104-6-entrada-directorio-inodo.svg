<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="inodo-dir-title inodo-dir-desc">
  <title id="inodo-dir-title">Entradas de directorio e inodos: el nombre no vive en el inodo (LPIC-1 104.6)</title>
  <desc id="inodo-dir-desc">El directorio es una tabla que asocia cada nombre con un número de inodo: doc.txt y duro.txt apuntan al inodo 184520, que guarda permisos, propietario, tamaño, fechas y punteros a los bloques de datos, mientras suave.txt apunta a un inodo propio, el 184525, que solo contiene la ruta doc.txt. Como el nombre nunca se almacena en el inodo, un enlace duro es una segunda entrada de directorio al mismo inodo y no existe original ni copia; un enlace simbólico tiene inodo propio y se resuelve leyendo la ruta que guarda.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .zone-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; }
      .node-dir { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-ino { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-data { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; stroke-dasharray: 6 5; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .legend { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .mono-ino { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .mono-data { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #334155; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .sub-ino { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #1E36AF; }
      .sub-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #881337; }
      .badge { fill: #DBE6FE; stroke: #2550EB; stroke-width: 1.5; }
      .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.04em; text-anchor: middle; }
      .legend-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .legend-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="inodo-dir-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.6 · ENTRADAS DE DIRECTORIO E INODOS</text>
    <text class="title" x="40" y="78">El nombre vive en el directorio</text>
    <text class="subtitle" x="40" y="102">Dos nombres pueden compartir el mismo inodo</text>
    <text class="zone-label" x="40" y="134">DIRECTORIO /home/alumno</text>
    <text class="zone-label" x="372" y="134">TABLA DE INODOS</text>
    <text class="zone-label" x="700" y="134">DATOS EN DISCO</text>
  </g>

  <g id="diagram-relations">
    <path id="inodo-dir-rel-doc" class="edge-blue"
          data-from="node-entry-doc" data-to="node-inodo-184520" data-relation="name-to-inode"
          d="M 290 173 H 331 V 200 H 372" marker-end="url(#inodo-dir-arrow-blue)"/>

    <path id="inodo-dir-rel-duro" class="edge-blue"
          data-from="node-entry-duro" data-to="node-inodo-184520" data-relation="name-to-inode"
          d="M 290 237 H 331 V 220 H 372" marker-end="url(#inodo-dir-arrow-blue)"/>

    <path id="inodo-dir-rel-suave" class="edge-blue"
          data-from="node-entry-suave" data-to="node-inodo-184525" data-relation="name-to-inode"
          d="M 290 301 H 331 V 340 H 372" marker-end="url(#inodo-dir-arrow-blue)"/>

    <path id="inodo-dir-rel-bloques" class="edge-blue"
          data-from="node-inodo-184520" data-to="node-bloques" data-relation="points-to-data"
          d="M 622 200 H 700" marker-end="url(#inodo-dir-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-entry-doc">
      <rect class="node-dir" x="40" y="146" width="250" height="54" rx="8"/>
      <text class="mono" x="64" y="170">doc.txt</text>
      <text class="sub" x="64" y="190">→ inodo 184520</text>
    </g>

    <g id="node-entry-duro">
      <rect class="node-dir" x="40" y="210" width="250" height="54" rx="8"/>
      <text class="mono" x="64" y="234">duro.txt</text>
      <text class="sub" x="64" y="254">→ inodo 184520</text>
    </g>

    <g id="node-entry-suave">
      <rect class="node-dir" x="40" y="274" width="250" height="54" rx="8"/>
      <text class="mono" x="64" y="298">suave.txt</text>
      <text class="sub" x="64" y="318">→ inodo 184525</text>
    </g>

    <g id="node-inodo-184520">
      <rect class="node-ino" x="372" y="140" width="250" height="120" rx="10"/>
      <text class="mono-ino" x="396" y="166">Inodo 184520</text>
      <text class="sub-ino" x="396" y="188">permisos, UID/GID, fechas</text>
      <text class="sub-ino" x="396" y="206">punteros a los bloques</text>
      <rect class="badge" x="396" y="220" width="156" height="24" rx="6"/>
      <text class="badge-text" x="474" y="237">LINK COUNT = 2</text>
    </g>

    <g id="node-inodo-184525">
      <rect class="node-ino" x="372" y="300" width="250" height="110" rx="10"/>
      <text class="mono-ino" x="396" y="326">Inodo 184525</text>
      <text class="sub-ino" x="396" y="348">tipo: enlace simbólico</text>
      <text class="sub-ino" x="396" y="368">guarda la ruta «doc.txt»</text>
    </g>

    <g id="node-bloques">
      <rect class="node-data" x="700" y="140" width="220" height="120" rx="10"/>
      <text class="mono-data" x="724" y="168">Bloques de datos</text>
      <text class="mono-data" x="724" y="192">«Linux»</text>
      <text class="sub" x="724" y="214">contenido del fichero</text>
    </g>

    <g id="node-borrado">
      <rect class="node-warn" x="700" y="300" width="220" height="110" rx="10"/>
      <text class="sub-warn" x="724" y="326">Si borras doc.txt</text>
      <text class="sub-warn" x="724" y="350">duro.txt sigue intacto</text>
      <text class="sub-warn" x="724" y="368">suave.txt queda roto</text>
    </g>

    <g id="node-regla">
      <rect class="legend" x="40" y="436" width="880" height="68" rx="10"/>
      <text class="legend-label" x="64" y="458">REGLA DE ORO DEL EXAMEN</text>
      <text class="legend-text" x="64" y="478">El inodo nunca almacena el nombre: la entrada de directorio asocia el texto</text>
      <text class="legend-text" x="64" y="496">«doc.txt» con el número 184520, y varias entradas pueden compartirlo.</text>
    </g>
  </g>
</svg>
