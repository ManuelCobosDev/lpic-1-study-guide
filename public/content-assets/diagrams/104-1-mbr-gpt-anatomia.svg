<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mbr-gpt-title mbr-gpt-desc">
  <title id="mbr-gpt-title">Anatomía del sector de arranque: MBR frente a GPT (LPIC-1 104.1)</title>
  <desc id="mbr-gpt-desc">Dos paneles enfrentan la anatomía de la tabla de particiones. En MBR todo cabe en el sector 0 de 512 bytes: 446 bytes de bootloader que carga la BIOS, una tabla de 64 bytes con 4 casillas de 16 bytes y la firma 55AA de 2 bytes; si se daña el sector 0 se pierde la tabla. En GPT, el LBA 0 contiene el Protective MBR, el LBA 1 la cabecera con el GUID del disco y las sumas CRC32, el LBA 2-33 las 128 entradas de partición y los últimos 33 sectores una copia idéntica de respaldo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 2; }
      .panel-b { fill: #F8FAFC; stroke: #059669; stroke-width: 2; }
      .seg-a { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .seg-b { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .badge-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
      .badge-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .panel-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; }
      .panel-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .badge-warn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; text-anchor: middle; }
      .badge-ok-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .seg-size { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .seg-name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .row-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .row-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #475569; }
      .warn-box { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #881337; }
      .warn-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #881337; }
      .backup-box { fill: #FFFFFF; stroke: #059669; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .backup-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; }
      .backup-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #065F46; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.1 · ANATOMÍA DE LA TABLA DE PARTICIONES</text>
    <text class="title" x="40" y="78">MBR y GPT: qué guarda cada sector</text>
    <text class="subtitle" x="40" y="102">MBR: todo cabe en el sector 0 de 512 bytes.</text>
    <text class="subtitle" x="40" y="122">GPT: estructuras en LBA 0-33 y copia espejo al final.</text>
  </g>

  <g id="diagram-groups"></g>
  <g id="diagram-relations"></g>

  <g id="diagram-nodes">
    <g id="node-panel-mbr">
      <rect class="panel-a" x="40" y="136" width="420" height="352" rx="12"/>
      <text class="panel-title" x="60" y="172">MBR</text>
      <text class="panel-sub" x="60" y="194">sector 0 · 512 bytes</text>
      <rect class="badge-warn" x="320" y="156" width="120" height="26" rx="7"/>
      <text class="badge-warn-text" x="380" y="174">SIN RESPALDO</text>

      <rect class="seg-a" x="60" y="210" width="246" height="44"/>
      <rect class="seg-a" x="306" y="210" width="90" height="44"/>
      <rect class="seg-a" x="396" y="210" width="44" height="44"/>
      <text class="seg-size" x="183" y="228">446 B</text>
      <text class="seg-name" x="183" y="244">bootloader</text>
      <text class="seg-size" x="351" y="228">64 B</text>
      <text class="seg-name" x="351" y="244">tabla</text>
      <text class="seg-size" x="418" y="228">2 B</text>
      <text class="seg-name" x="418" y="244">55AA</text>

      <text class="row-title" x="60" y="280">Bootloader (446 bytes)</text>
      <text class="row-desc" x="60" y="302">código inicial que carga la BIOS.</text>
      <text class="row-title" x="60" y="326">Tabla (64 bytes)</text>
      <text class="row-desc" x="60" y="348">4 casillas de 16 bytes cada una.</text>
      <text class="row-title" x="60" y="372">Firma 55AA (2 bytes)</text>
      <text class="row-desc" x="60" y="394">identificador mágico de disco arrancable.</text>
      <rect class="warn-box" x="60" y="408" width="380" height="52" rx="8"/>
      <text class="warn-title" x="76" y="430">Punto único de fallo</text>
      <text class="warn-desc" x="76" y="450">si se daña el sector 0, se pierde la tabla.</text>
    </g>

    <g id="node-panel-gpt">
      <rect class="panel-b" x="500" y="136" width="420" height="352" rx="12"/>
      <text class="panel-title" x="520" y="172">GPT</text>
      <text class="panel-sub" x="520" y="194">LBA 0 a 33 · 128 particiones</text>
      <rect class="badge-ok" x="780" y="156" width="120" height="26" rx="7"/>
      <text class="badge-ok-text" x="840" y="174">COPIA ESPEJO</text>

      <rect class="seg-b" x="520" y="210" width="110" height="44"/>
      <rect class="seg-b" x="630" y="210" width="100" height="44"/>
      <rect class="seg-b" x="730" y="210" width="170" height="44"/>
      <text class="seg-size" x="575" y="228">LBA 0</text>
      <text class="seg-name" x="575" y="244">Prot MBR</text>
      <text class="seg-size" x="680" y="228">LBA 1</text>
      <text class="seg-name" x="680" y="244">cabecera</text>
      <text class="seg-size" x="815" y="228">LBA 2-33</text>
      <text class="seg-name" x="815" y="244">128 entradas</text>

      <rect class="backup-box" x="520" y="266" width="380" height="46" rx="8"/>
      <text class="backup-title" x="536" y="286">Backup GPT</text>
      <text class="backup-desc" x="536" y="304">copia idéntica en los últimos 33 sectores.</text>

      <text class="row-title" x="520" y="340">Protective MBR (LBA 0)</text>
      <text class="row-desc" x="520" y="362">evita que software antiguo destruya la tabla GPT.</text>
      <text class="row-title" x="520" y="386">Cabecera (LBA 1)</text>
      <text class="row-desc" x="520" y="408">GUID del disco y sumas CRC32 de integridad.</text>
      <text class="row-title" x="520" y="432">Entradas (LBA 2-33)</text>
      <text class="row-desc" x="520" y="454">espacio para 128 particiones directas.</text>
    </g>
  </g>

  <g id="diagram-labels"></g>
</svg>
