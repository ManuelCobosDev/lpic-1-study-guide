<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hash-title hash-desc">
  <title id="hash-title">Generar y verificar el message digest de un fichero con sha256sum y la opción -c (LPIC-1 103.2)</title>
  <desc id="hash-desc">La generación del hash parte del fichero descargado debian.iso, pasa por sha256sum y produce HASHES.txt con el resumen de 64 caracteres hexadecimales. La verificación ejecuta sha256sum -c HASHES.txt, que vuelve a calcular el resumen de cada fichero y lo compara con el guardado: si coincide imprime debian.iso: OK y si no coincide imprime debian.iso: FAILED con el aviso WARNING: 1 computed checksum did NOT match. Un solo byte añadido al fichero cambia el resumen por completo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .card-fail { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; }
      .tag-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .tag-fail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .out-ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #065F46; }
      .out-fail { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #881337; }
      .out-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="hash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">INTEGRIDAD · SUMAS HASH</text>
    <text class="title" x="40" y="78">La huella digital de un fichero</text>
    <text class="subtitle" x="40" y="102">Generar el resumen y verificarlo después.</text>
  </g>

  <g id="diagram-relations">
    <path id="hash-rel-iso-suma" class="edge" data-from="node-iso" data-to="node-sum" data-relation="calcula-digest"
          d="M 250 180 H 300" marker-end="url(#hash-arrow)"/>
    <path id="hash-rel-suma-hashes" class="edge" data-from="node-sum" data-to="node-hashes" data-relation="escribe-fichero"
          d="M 500 180 H 550" marker-end="url(#hash-arrow)"/>
    <path id="hash-rel-hashes-check" class="edge" data-from="node-hashes" data-to="node-check" data-relation="lo-lee-la-verificacion"
          d="M 675 220 V 245 H 480 V 270" marker-end="url(#hash-arrow)"/>
    <path id="hash-rel-check-ok" class="edge" data-from="node-check" data-to="node-ok" data-relation="coincide"
          d="M 400 350 V 374 H 255 V 400" marker-end="url(#hash-arrow)"/>
    <path id="hash-rel-check-fail" class="edge" data-from="node-check" data-to="node-fail" data-relation="no-coincide"
          d="M 560 350 V 374 H 705 V 400" marker-end="url(#hash-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-iso">
      <rect class="node-file" x="40" y="140" width="210" height="80" rx="10"/>
      <text class="mono" x="64" y="174">debian.iso</text>
      <text class="sub" x="64" y="198">fichero descargado</text>
    </g>

    <g id="node-sum">
      <rect class="node-cmd" x="300" y="140" width="200" height="80" rx="10"/>
      <text class="mono" x="324" y="174">sha256sum</text>
      <text class="sub" x="324" y="198">64 caracteres hex</text>
    </g>

    <g id="node-hashes">
      <rect class="node-file" x="550" y="140" width="250" height="80" rx="10"/>
      <text class="mono" x="574" y="174">HASHES.txt</text>
      <text class="sub" x="574" y="198">resumen + nombre</text>
    </g>

    <g id="node-check">
      <rect class="node-cmd" x="300" y="270" width="360" height="80" rx="10"/>
      <text class="mono-cmd" x="324" y="304">sha256sum -c HASHES.txt</text>
      <text class="sub" x="324" y="328">recalcula y compara</text>
    </g>

    <g id="node-ok">
      <rect class="card-ok" x="40" y="400" width="430" height="80" rx="10"/>
      <text class="tag-ok" x="64" y="424">VERIFICACIÓN CORRECTA</text>
      <text class="out-ok" x="64" y="450">debian.iso: OK</text>
      <text class="out-sub" x="64" y="470">el resumen coincide bit a bit</text>
    </g>

    <g id="node-fail">
      <rect class="card-fail" x="490" y="400" width="430" height="80" rx="10"/>
      <text class="tag-fail" x="514" y="424">FALLO DETECTADO</text>
      <text class="out-fail" x="514" y="450">debian.iso: FAILED</text>
      <text class="out-sub" x="514" y="470">WARNING: 1 computed checksum did NOT match</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="tag" x="40" y="128">1. generar</text>
    <text class="tag" x="300" y="256">2. verificar</text>
  </g>
</svg>
