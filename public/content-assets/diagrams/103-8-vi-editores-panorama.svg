<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vi-panorama-title vi-panorama-desc">
  <title id="vi-panorama-title">Panorama de editores en LPIC-1: nano, vi/vim y Emacs (objetivo 103.8)</title>
  <desc id="vi-panorama-desc">Tres editores conviven en Linux y solo uno está garantizado. nano es no modal, muestra en su barra inferior las combinaciones Ctrl como ^O para guardar y ^X para salir, pero no siempre existe en un entorno de rescate. vi y vim son modales, cumplen el estándar POSIX y están presentes en rescate y en modo single-user; se practican con vimtutor. Emacs es un editor extensible que combina Ctrl y Meta/Alt y funciona como IDE completo y como lector de correo y RSS. El veredicto del examen es que vi es el editor que el sistema garantiza siempre.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-neutral { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-win { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .card-alt { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; }
      .card-name-win { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #065F46; }
      .card-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .card-line-win { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #065F46; }
      .badge-neutral { fill: #E2E8F0; stroke: #475569; stroke-width: 1.5; }
      .badge-win { fill: #D1FAE5; stroke: #059669; stroke-width: 1.5; }
      .badge-alt { fill: #DBE6FE; stroke: #2550EB; stroke-width: 1.5; }
      .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; text-anchor: middle; }
      .badge-text-win { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; text-anchor: middle; }
      .badge-text-alt { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; text-anchor: middle; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">OBJETIVO 103.8 · PANORAMA DE EDITORES</text>
    <text class="title" x="40" y="78">Tres editores, un solo estándar garantizado</text>
    <text class="subtitle" x="40" y="102">Qué aporta cada uno y cuál encuentras en un sistema roto.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-nano">
      <rect class="card-neutral" x="40" y="136" width="280" height="236" rx="10"/>
      <rect class="badge-neutral" x="64" y="156" width="150" height="24" rx="6"/>
      <text class="badge-text" x="139" y="172">NO GARANTIZADO</text>
      <text class="card-name" x="64" y="216">nano</text>
      <text class="card-line" x="64" y="248">No modal: la barra inferior</text>
      <text class="card-line" x="64" y="270">muestra las combinaciones</text>
      <text class="card-line" x="64" y="292">Ctrl: ^O guardar, ^X salir.</text>
      <text class="card-line" x="64" y="314">No siempre está en rescate.</text>
    </g>

    <g id="node-vi">
      <rect class="card-win" x="340" y="136" width="280" height="236" rx="10"/>
      <rect class="badge-win" x="364" y="156" width="160" height="24" rx="6"/>
      <text class="badge-text-win" x="444" y="172">SIEMPRE DISPONIBLE</text>
      <text class="card-name-win" x="364" y="216">vi / vim</text>
      <text class="card-line-win" x="364" y="248">Estándar POSIX y modal.</text>
      <text class="card-line-win" x="364" y="270">Presente en rescate y en</text>
      <text class="card-line-win" x="364" y="292">el modo single-user.</text>
      <text class="card-line-win" x="364" y="314">Se practica con vimtutor.</text>
    </g>

    <g id="node-emacs">
      <rect class="card-alt" x="660" y="136" width="260" height="236" rx="10"/>
      <rect class="badge-alt" x="684" y="156" width="110" height="24" rx="6"/>
      <text class="badge-text-alt" x="739" y="172">OPCIONAL</text>
      <text class="card-name" x="684" y="216">Emacs</text>
      <text class="card-line" x="684" y="248">Editor extensible con</text>
      <text class="card-line" x="684" y="270">combinaciones Ctrl y</text>
      <text class="card-line" x="684" y="292">Meta/Alt.</text>
      <text class="card-line" x="684" y="314">IDE completo y lector</text>
      <text class="card-line" x="684" y="336">de correo y RSS.</text>
    </g>

    <g id="node-veredicto">
      <rect class="verdict" x="40" y="392" width="880" height="92" rx="10"/>
      <text class="verdict-label" x="64" y="420">VEREDICTO</text>
      <text class="verdict-text" x="64" y="448">El editor que todo Unix garantiza, también en rescate, es vi.</text>
      <text class="verdict-text" x="64" y="472">En una instalación mínima vi está en /bin y nano puede no estar.</text>
    </g>
  </g>
</svg>

