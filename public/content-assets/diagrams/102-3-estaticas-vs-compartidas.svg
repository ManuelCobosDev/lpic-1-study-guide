<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="a-so-title a-so-desc">
  <title id="a-so-title">Librerías estáticas .a frente a librerías compartidas .so (LPIC-1 102.3)</title>
  <desc id="a-so-desc">La librería estática .a, empaquetada con ar, copia su código dentro de cada binario en el momento de compilar: el ejecutable pesa entre 20 y 40 MB, diez programas abiertos cargan diez copias idénticas en RAM y cualquier parche obliga a recompilar cada binario. La librería compartida .so se enlaza en ejecución con el enlazador dinámico ld.so: el binario solo guarda la referencia NEEDED, pesa entre 30 y 60 KB, una sola copia en RAM se comparte entre cientos de procesos y basta sustituir el archivo .so para parchear. Las estáticas se reservan para rescate de emergencia y sistemas embebidos; las compartidas son el 99,9 % del software moderno.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .panel-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .panel-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #475569; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LIBRERÍAS · FORMATO Y MOMENTO DEL ENLACE</text>
    <text class="title" x="40" y="78">Estáticas (.a) frente a compartidas (.so)</text>
    <text class="subtitle" x="40" y="102">Qué se copia dentro del binario y qué se carga al ejecutar</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-estaticas">
      <rect class="panel-a" x="40" y="120" width="420" height="388" rx="10"/>
      <text class="panel-head-a" x="64" y="152">Estáticas</text>
      <text class="panel-sub" x="64" y="174">.a · Archive (ar) · se enlazan al compilar</text>
      <line class="divider" x1="64" y1="186" x2="436" y2="186"/>

      <text class="row-label" x="64" y="208">MOMENTO DEL ENLACE</text>
      <text class="row-value" x="64" y="230">Al compilar: el código se copia en el binario</text>
      <line class="divider" x1="64" y1="250" x2="436" y2="250"/>

      <text class="row-label" x="64" y="270">TAMAÑO DEL BINARIO</text>
      <text class="row-value" x="64" y="292">20–40 MB por ejecutable</text>
      <line class="divider" x1="64" y1="312" x2="436" y2="312"/>

      <text class="row-label" x="64" y="332">COPIA EN RAM</text>
      <text class="row-value" x="64" y="354">10 programas, 10 copias idénticas</text>
      <line class="divider" x1="64" y1="374" x2="436" y2="374"/>

      <text class="row-label" x="64" y="394">PARCHEAR UN FALLO</text>
      <text class="row-value" x="64" y="416">Recompilar cada binario del sistema</text>
      <line class="divider" x1="64" y1="436" x2="436" y2="436"/>

      <text class="row-label" x="64" y="456">USO TÍPICO</text>
      <text class="row-value" x="64" y="478">Rescate (/sbin/sln) y sistemas embebidos</text>
    </g>

    <g id="node-panel-compartidas">
      <rect class="panel-b" x="500" y="120" width="420" height="388" rx="10"/>
      <text class="panel-head-b" x="524" y="152">Compartidas</text>
      <text class="panel-sub" x="524" y="174">.so · Shared Object · enlaza ld.so</text>
      <line class="divider" x1="524" y1="186" x2="896" y2="186"/>

      <text class="row-label" x="524" y="208">MOMENTO DEL ENLACE</text>
      <text class="row-value" x="524" y="230">Al ejecutar: solo guarda la ref. (NEEDED)</text>
      <line class="divider" x1="524" y1="250" x2="896" y2="250"/>

      <text class="row-label" x="524" y="270">TAMAÑO DEL BINARIO</text>
      <text class="row-value" x="524" y="292">30–60 KB por ejecutable</text>
      <line class="divider" x1="524" y1="312" x2="896" y2="312"/>

      <text class="row-label" x="524" y="332">COPIA EN RAM</text>
      <text class="row-value" x="524" y="354">1 sola copia compartida por 100 procesos</text>
      <line class="divider" x1="524" y1="374" x2="896" y2="374"/>

      <text class="row-label" x="524" y="394">PARCHEAR UN FALLO</text>
      <text class="row-value" x="524" y="416">Sustituir el archivo .so y listo</text>
      <line class="divider" x1="524" y1="436" x2="896" y2="436"/>

      <text class="row-label" x="524" y="456">USO TÍPICO</text>
      <text class="row-value" x="524" y="478">El 99,9 % del software: ls, bash, python</text>
    </g>
  </g>
</svg>
