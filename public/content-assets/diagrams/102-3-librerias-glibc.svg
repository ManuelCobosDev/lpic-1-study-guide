<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="glibc-title glibc-desc">
  <title id="glibc-title">Las cuatro librerías fundamentales de glibc en LPIC-1 (libc, libm, libpthread y libdl)</title>
  <desc id="glibc-desc">libc.so.6 es la GNU C Library: aporta malloc, printf y read, la usan ls, bash o cp y sin ella el sistema queda inoperativo. libm.so.6 contiene el cálculo matemático de coma flotante, sin, cos y sqrt, y se enlaza en gcc con -lm. libpthread.so.0 permite varios hilos simultáneos dentro de un proceso y se activa con -pthread. libdl.so.2 hace la carga dinámica de plugins .so en caliente mediante dlopen y dlsym, y sus letras dl vienen de dynamic loading.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-hi { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .card-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .card-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .card-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .pill { fill: #DBE6FE; stroke: #2550EB; stroke-width: 1.5; }
      .pill-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">GLIBC · LAS CUATRO DE SIEMPRE</text>
    <text class="title" x="40" y="78">Las cuatro librerías que pregunta el examen</text>
    <text class="subtitle" x="40" y="102">Qué hace cada una y con qué opción de gcc se enlaza</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-libc">
      <rect class="card-hi" x="40" y="136" width="430" height="182" rx="10"/>
      <text class="card-tag" x="64" y="164">1 · LA MÁS IMPORTANTE</text>
      <text class="card-name" x="64" y="192">libc.so.6</text>
      <text class="card-sub" x="64" y="216">GNU C Library (glibc)</text>
      <text class="card-text" x="64" y="244">malloc, printf, read: memoria, E/S y texto.</text>
      <text class="card-text" x="64" y="268">Si desaparece, el sistema queda inoperativo.</text>
      <rect class="pill" x="64" y="284" width="186" height="28" rx="14"/>
      <text class="pill-text" x="76" y="303">la usan ls, bash y cp</text>
    </g>

    <g id="node-libm">
      <rect class="card" x="490" y="136" width="430" height="182" rx="10"/>
      <text class="card-tag" x="514" y="164">2 · MATEMÁTICAS</text>
      <text class="card-name" x="514" y="192">libm.so.6</text>
      <text class="card-sub" x="514" y="216">Cálculo matemático (Math)</text>
      <text class="card-text" x="514" y="244">Trigonometría (sin, cos), potencias y</text>
      <text class="card-text" x="514" y="268">raíces cuadradas (sqrt).</text>
      <rect class="pill" x="514" y="284" width="96" height="28" rx="14"/>
      <text class="pill-text" x="526" y="303">gcc -lm</text>
    </g>

    <g id="node-libpthread">
      <rect class="card" x="40" y="330" width="430" height="182" rx="10"/>
      <text class="card-tag" x="64" y="358">3 · HILOS PARALELOS</text>
      <text class="card-name" x="64" y="386">libpthread.so.0</text>
      <text class="card-sub" x="64" y="410">Hilos de ejecución POSIX</text>
      <text class="card-text" x="64" y="438">Varios hilos simultáneos en un proceso</text>
      <text class="card-text" x="64" y="462">para aprovechar todos los núcleos.</text>
      <rect class="pill" x="64" y="478" width="138" height="28" rx="14"/>
      <text class="pill-text" x="76" y="497">gcc -pthread</text>
    </g>

    <g id="node-libdl">
      <rect class="card" x="490" y="330" width="430" height="182" rx="10"/>
      <text class="card-tag" x="514" y="358">4 · PLUGINS EN CALIENTE</text>
      <text class="card-name" x="514" y="386">libdl.so.2</text>
      <text class="card-sub" x="514" y="410">Carga dinámica (Dynamic Loading)</text>
      <text class="card-text" x="514" y="438">Carga plugins .so en caliente con</text>
      <text class="card-text" x="514" y="462">dlopen() y dlsym().</text>
      <rect class="pill" x="514" y="478" width="176" height="28" rx="14"/>
      <text class="pill-text" x="526" y="497">dl = Dynamic Loading</text>
    </g>
  </g>
</svg>
