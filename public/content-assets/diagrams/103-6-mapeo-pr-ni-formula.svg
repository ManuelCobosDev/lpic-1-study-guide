<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Mapeo entre la prioridad del kernel PR y el niceness NI: cuatro conversiones directas (LPIC-1 103.6)</title>
  <desc id="map-desc">La fórmula que relaciona las dos escalas es PR = 20 + NI. Con niceness 0 la prioridad que muestra top es 20; con niceness -5 es 15, de modo que el proceso se atiende antes; con niceness -20 es 0, el tope de los procesos CFS; y con niceness +19 es 39, la máxima amabilidad. La columna PR de top va de 0 a 39 y un proceso de tiempo real muestra rt o un PR negativo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .band-formula { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .formula { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .formula-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .card { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .tag { fill: #E2E8F0; stroke: #475569; stroke-width: 1.5; }
      .tag-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.04em; text-anchor: middle; }
      .ni { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .sum { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .pr { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .footer { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">MAPEO DE ESCALAS · PR FRENTE A NI</text>
    <text class="title" x="40" y="78">PR = 20 + NI: dos escalas, un número</text>
    <text class="subtitle" x="40" y="102">En top se ve PR (20 por defecto); en ps se ve NI.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-formula">
      <rect class="band-formula" x="40" y="130" width="880" height="84" rx="10"/>
      <text class="formula" x="480" y="180">PR = 20 + NI</text>
      <text class="formula-note" x="480" y="204">menor PR significa que el proceso se atiende antes</text>
    </g>

    <g id="node-defecto">
      <rect class="card" x="40" y="240" width="200" height="212" rx="10"/>
      <rect class="tag" x="56" y="252" width="168" height="26" rx="6"/>
      <text class="tag-text" x="140" y="270">DEFECTO</text>
      <text class="ni" x="140" y="310">NI = 0</text>
      <text class="sum" x="140" y="336">20 + 0</text>
      <text class="pr" x="140" y="372">PR = 20</text>
      <text class="role" x="140" y="404">Prioridad</text>
      <text class="role" x="140" y="424">estándar</text>
    </g>

    <g id="node-urgente">
      <rect class="card" x="264" y="240" width="200" height="212" rx="10"/>
      <rect class="tag" x="280" y="252" width="168" height="26" rx="6"/>
      <text class="tag-text" x="364" y="270">URGENTE</text>
      <text class="ni" x="364" y="310">NI = -5</text>
      <text class="sum" x="364" y="336">20 + (-5)</text>
      <text class="pr" x="364" y="372">PR = 15</text>
      <text class="role" x="364" y="404">Atendido</text>
      <text class="role" x="364" y="424">antes</text>
    </g>

    <g id="node-maxima">
      <rect class="card" x="488" y="240" width="200" height="212" rx="10"/>
      <rect class="tag" x="504" y="252" width="168" height="26" rx="6"/>
      <text class="tag-text" x="588" y="270">MÁXIMA (ROOT)</text>
      <text class="ni" x="588" y="310">NI = -20</text>
      <text class="sum" x="588" y="336">20 + (-20)</text>
      <text class="pr" x="588" y="372">PR = 0</text>
      <text class="role" x="588" y="404">Tope de los</text>
      <text class="role" x="588" y="424">procesos CFS</text>
    </g>

    <g id="node-minima">
      <rect class="card" x="712" y="240" width="200" height="212" rx="10"/>
      <rect class="tag" x="728" y="252" width="168" height="26" rx="6"/>
      <text class="tag-text" x="812" y="270">MÍNIMA</text>
      <text class="ni" x="812" y="310">NI = +19</text>
      <text class="sum" x="812" y="336">20 + 19</text>
      <text class="pr" x="812" y="372">PR = 39</text>
      <text class="role" x="812" y="404">Máxima</text>
      <text class="role" x="812" y="424">amabilidad</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="footer" x="40" y="484">La columna PR de top va de 0 a 39;</text>
    <text class="footer" x="40" y="506">un proceso de tiempo real muestra rt o un PR negativo.</text>
  </g>
</svg>
