<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pn0-title pn0-desc">
  <title id="pn0-title">Fragmentación por espacios frente a separación por byte nulo con find -print0 y xargs -0 (LPIC-1 103.4)</title>
  <desc id="pn0-desc">Sin la pareja -print0 y -0, un nombre con espacios como Factura Mayo 2026.pdf se parte en tres trozos y xargs cree que son tres archivos distintos, así que el comando falla o actúa sobre lo incorrecto. Con find -print0 y xargs -0 el separador es el byte nulo, de modo que el nombre viaja como un único argumento atómico aunque contenga espacios, acentos o saltos de línea. La banda inferior recuerda el equivalente en tar, --null con -T -, y que el byte nulo es el único que el kernel prohíbe dentro de un nombre de archivo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-bad { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .panel-good { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .chip-bad { fill: #FFFFFF; stroke: #E11D48; stroke-width: 1.5; }
      .chip-good { fill: #FFFFFF; stroke: #059669; stroke-width: 2; }
      .band { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .kicker-bad { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .kicker-good { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .chip-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 500; fill: #881337; }
      .chip-text-ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #065F46; text-anchor: middle; }
      .text-bad { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #881337; }
      .text-good { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #065F46; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #0F172A; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · FIND -PRINT0 Y XARGS -0</text>
    <text class="title" x="40" y="78">El nombre partido en trozos</text>
    <text class="subtitle" x="40" y="102">El byte nulo no aparece nunca dentro de un nombre de archivo</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-sin-cero">
      <rect class="panel-bad" x="40" y="130" width="430" height="250" rx="12"/>
      <text class="kicker-bad" x="64" y="160">SIN -0: SEPARA POR ESPACIOS</text>
      <text class="file" x="64" y="194">Factura Mayo 2026.pdf</text>
      <rect class="chip-bad" x="64" y="212" width="110" height="32" rx="6"/>
      <text class="chip-text" x="80" y="233">Factura</text>
      <rect class="chip-bad" x="190" y="212" width="110" height="32" rx="6"/>
      <text class="chip-text" x="206" y="233">Mayo</text>
      <rect class="chip-bad" x="316" y="212" width="110" height="32" rx="6"/>
      <text class="chip-text" x="332" y="233">2026.pdf</text>
      <text class="text-bad" x="64" y="286">xargs cree que son tres archivos</text>
      <text class="text-bad" x="64" y="308">distintos y el comando falla o</text>
      <text class="text-bad" x="64" y="330">borra lo que no debe.</text>
    </g>

    <g id="node-con-cero">
      <rect class="panel-good" x="490" y="130" width="430" height="250" rx="12"/>
      <text class="kicker-good" x="514" y="160">CON -print0 | xargs -0</text>
      <text class="file" x="514" y="194">Factura Mayo 2026.pdf\0</text>
      <rect class="chip-good" x="514" y="212" width="382" height="32" rx="6"/>
      <text class="chip-text-ok" x="705" y="233">Factura Mayo 2026.pdf</text>
      <text class="text-good" x="514" y="286">Un único argumento, atómico y</text>
      <text class="text-good" x="514" y="308">completo, aunque el nombre lleve</text>
      <text class="text-good" x="514" y="330">espacios, acentos o saltos de línea.</text>
    </g>

    <g id="node-tar-null">
      <rect class="band" x="40" y="400" width="880" height="70" rx="10"/>
      <text class="band-text" x="64" y="428">En tar: find /etc -type f -print0 | tar -cJ -f etc.tar.xz --null -T -</text>
      <text class="band-text" x="64" y="452">El byte nulo (ASCII 0) es el único prohibido en un nombre de archivo.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="500">Regla mnemotécnica: el cero siempre va con el cero.</text>
  </g>
</svg>
