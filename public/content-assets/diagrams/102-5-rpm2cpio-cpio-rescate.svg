<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rcp-title rcp-desc">
  <title id="rcp-title">Extracción de un archivo de un paquete .rpm con rpm2cpio y cpio sin instalarlo (LPIC-1 102.5)</title>
  <desc id="rcp-desc">La tubería rpm2cpio archivo.rpm | cpio -idmv convierte el payload de un paquete en un flujo cpio por la salida estándar y lo extrae en el directorio actual. El flujo recorre cuatro pasos: el archivo .rpm local, rpm2cpio que lo vuelca como stream, cpio -idmv que extrae los ficheros del flujo y el binario restaurado ./usr/bin/ls. La operación no requiere root y no toca la base de datos /var/lib/rpm/, y la ruta debe empezar por ./ porque cpio guarda rutas relativas.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-out { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .mono-name-out { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #065F46; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .warn-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.08em; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 400; fill: #881337; }
      .warn-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 600; fill: #881337; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="rcp-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">RPM2CPIO Y CPIO · RESCATE QUIRÚRGICO</text>
    <text class="title" x="40" y="78">Extraer un binario sin instalar el paquete</text>
    <text class="subtitle" x="40" y="102">El .rpm se convierte en flujo cpio y se filtra por ruta</text>
  </g>

  <g id="diagram-relations">
    <path id="rcp-rel-rpm-rpm2cpio" class="edge-blue"
          data-from="node-rpm-file" data-to="node-rpm2cpio" data-relation="alimenta-la-tuberia"
          d="M 236 188 H 268" marker-end="url(#rcp-arrow-blue)"/>
    <path id="rcp-rel-rpm2cpio-cpio" class="edge-blue"
          data-from="node-rpm2cpio" data-to="node-cpio" data-relation="vuelca-el-payload"
          d="M 464 188 H 496" marker-end="url(#rcp-arrow-blue)"/>
    <path id="rcp-rel-cpio-out" class="edge-blue"
          data-from="node-cpio" data-to="node-extracted" data-relation="extrae-el-fichero"
          d="M 692 188 H 724" marker-end="url(#rcp-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-rpm-file">
      <rect class="node-file" x="40" y="146" width="196" height="84" rx="10"/>
      <text class="mono-name" x="64" y="176">pkg.rpm</text>
      <text class="node-sub" x="64" y="202">coreutils.rpm</text>
    </g>

    <g id="node-rpm2cpio">
      <rect class="node-cmd" x="268" y="146" width="196" height="84" rx="10"/>
      <text class="mono-name" x="292" y="176">rpm2cpio</text>
      <text class="node-sub" x="292" y="202">vuelca el payload</text>
    </g>

    <g id="node-cpio">
      <rect class="node-cmd" x="496" y="146" width="196" height="84" rx="10"/>
      <text class="mono-name" x="520" y="176">cpio -idmv</text>
      <text class="node-sub" x="520" y="202">extrae del flujo</text>
    </g>

    <g id="node-extracted">
      <rect class="node-out" x="724" y="146" width="196" height="84" rx="10"/>
      <text class="mono-name-out" x="748" y="176">./usr/bin/ls</text>
      <text class="node-sub" x="748" y="202">binario restaurado</text>
    </g>

    <g id="node-escenario">
      <rect class="node-warn" x="40" y="272" width="880" height="220" rx="10"/>
      <text class="warn-head" x="64" y="302">ESCENARIO DE RESCATE</text>
      <text class="warn-title" x="64" y="332">Ni rpm ni dnf arrancan si /bin/rpm o libc.so.6 están rotos</text>
      <text class="warn-body" x="64" y="364">La tubería convierte el .rpm en un flujo cpio en memoria:</text>
      <text class="warn-body" x="64" y="390">no requiere root y no modifica la base de datos /var/lib/rpm/.</text>
      <text class="warn-body" x="64" y="416">cpio guarda rutas relativas: la ruta debe empezar por ./ o falla.</text>
      <text class="warn-mono" x="64" y="448">cpio -idmv "./usr/bin/ls"   →   36248 blocks</text>
    </g>
  </g>
</svg>
