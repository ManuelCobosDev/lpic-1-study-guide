<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ls-larga-title ls-larga-desc">
  <title id="ls-larga-title">Anatomía de una línea del listado largo de ls -l (LPIC-1 103.3)</title>
  <desc id="ls-larga-desc">La salida de ls -l se lee como un registro de campos fijos: el primer carácter es el tipo de archivo (guion para un archivo regular), después vienen los nueve caracteres de permisos (rw-r--r--, que equivalen a 644), el número de enlaces, el dueño, el grupo, el tamaño en bytes o en K, M y G con la opción -h, la fecha y la hora de modificación, y por último el nombre del fichero. El ejemplo muestra la línea menos permisos-enlaces-root-adm-120K-oct 24 11:30-syslog, donde 120K solo aparece si se usa ls -lh.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .terminal { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .prompt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 600; fill: #1E36AF; }
      .chip { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .chip-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.04em; text-anchor: middle; }
      .detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .note-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #1E36AF; }
      .type-card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .type-glyph { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #1E36AF; }
      .type-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #0F172A; }
      .type-detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ls · FORMATO LARGO</text>
    <text class="title" x="40" y="78">Cada columna de ls -l dice una cosa</text>
    <text class="subtitle" x="40" y="102">Una línea de ls -l, bloque a bloque.</text>
    <text class="prompt" x="40" y="150">$ ls -l</text>
    <rect class="terminal" x="28" y="164" width="904" height="80" rx="8"/>
  </g>

  <g id="diagram-relations">
    <line class="guide" x1="72" y1="232" x2="72" y2="284"/>
    <line class="guide" x1="190" y1="232" x2="190" y2="284"/>
    <line class="guide" x1="304" y1="232" x2="304" y2="284"/>
    <line class="guide" x1="385" y1="232" x2="385" y2="284"/>
    <line class="guide" x1="476" y1="232" x2="476" y2="284"/>
    <line class="guide" x1="567" y1="232" x2="567" y2="284"/>
    <line class="guide" x1="708" y1="232" x2="708" y2="284"/>
    <line class="guide" x1="861" y1="232" x2="861" y2="284"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-tipo">
      <rect class="chip" x="40" y="176" width="64" height="56" rx="6"/>
      <text class="chip-mono" x="72" y="211">-</text>
    </g>
    <g id="node-permisos">
      <rect class="chip" x="115" y="176" width="150" height="56" rx="6"/>
      <text class="chip-mono" x="190" y="211">rw-r--r--</text>
    </g>
    <g id="node-enlaces">
      <rect class="chip" x="276" y="176" width="56" height="56" rx="6"/>
      <text class="chip-mono" x="304" y="211">1</text>
    </g>
    <g id="node-dueno">
      <rect class="chip" x="343" y="176" width="84" height="56" rx="6"/>
      <text class="chip-mono" x="385" y="211">root</text>
    </g>
    <g id="node-grupo">
      <rect class="chip" x="438" y="176" width="76" height="56" rx="6"/>
      <text class="chip-mono" x="476" y="211">adm</text>
    </g>
    <g id="node-tamano">
      <rect class="chip" x="525" y="176" width="84" height="56" rx="6"/>
      <text class="chip-mono" x="567" y="211">120K</text>
    </g>
    <g id="node-fecha">
      <rect class="chip" x="620" y="176" width="176" height="56" rx="6"/>
      <text class="chip-mono" x="708" y="211">oct 24 11:30</text>
    </g>
    <g id="node-nombre">
      <rect class="chip" x="807" y="176" width="108" height="56" rx="6"/>
      <text class="chip-mono" x="861" y="211">syslog</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="label" x="72" y="302">TIPO</text>
    <text class="detail" x="72" y="326">regular (-)</text>

    <text class="label" x="190" y="302">PERMISOS</text>
    <text class="detail" x="190" y="326">equivale a 644</text>

    <text class="label" x="304" y="302">ENLACES</text>
    <text class="detail" x="304" y="326">nlink = 1</text>

    <text class="label" x="385" y="302">DUEÑO</text>
    <text class="detail" x="385" y="326">root</text>

    <text class="label" x="476" y="302">GRUPO</text>
    <text class="detail" x="476" y="326">adm</text>

    <text class="label" x="567" y="302">TAMAÑO</text>
    <text class="detail" x="567" y="326">120K con -h</text>

    <text class="label" x="708" y="302">FECHA Y HORA</text>
    <text class="detail" x="708" y="326">mtime del inodo</text>

    <text class="label" x="861" y="302">NOMBRE</text>
    <text class="detail" x="861" y="326">el fichero</text>

    <text class="note" x="40" y="380">El tipo es el primer carácter del campo de permisos.</text>

    <g id="node-tipo-regular">
      <rect class="type-card" x="40" y="400" width="280" height="88" rx="8"/>
      <text class="type-glyph" x="70" y="458">-</text>
      <text class="type-title" x="112" y="432">archivo regular</text>
      <text class="type-detail" x="112" y="456">el caso habitual</text>
    </g>

    <g id="node-tipo-directorio">
      <rect class="type-card" x="340" y="400" width="280" height="88" rx="8"/>
      <text class="type-glyph" x="370" y="458">d</text>
      <text class="type-title" x="412" y="432">directorio</text>
      <text class="type-detail" x="412" y="456">contiene otros nombres</text>
    </g>

    <g id="node-tipo-especial">
      <rect class="type-card" x="640" y="400" width="280" height="88" rx="8"/>
      <text class="type-glyph" x="670" y="458">c</text>
      <text class="type-title" x="712" y="432">archivo especial</text>
      <text class="type-detail" x="712" y="456">dispositivo de caracteres</text>
    </g>

    <text class="note-mono" x="40" y="512">ls -ld /ruta</text>
    <text class="note" x="180" y="512">muestra la carpeta, no su contenido.</text>
  </g>
</svg>
