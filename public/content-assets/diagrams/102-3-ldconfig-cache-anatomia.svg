<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ldcache-title ldcache-desc">
  <title id="ldcache-title">Anatomía de una línea de la salida de ldconfig -p (LPIC-1 102.3)</title>
  <desc id="ldcache-desc">La opción -p de ldconfig vuelca la caché binaria /etc/ld.so.cache en texto legible. La cabecera de la salida anuncia el total de librerías encontradas y el archivo de caché; cada línea tiene tres campos: el soname que pide el binario, el formato ELF con la arquitectura y la versión de kernel compatible, y la ruta física absoluta que se cargará en memoria RAM. El símbolo => separa el nombre lógico de la ruta resuelta en disco.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .out-band { fill: #1E293B; stroke: #0F172A; stroke-width: 2; }
      .out-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #F8FAFC; }
      .out-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #E2E8F0; letter-spacing: 0.06em; }
      .chip { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .chip-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .field-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LDCONFIG -P · LA CACHÉ EN TEXTO</text>
    <text class="title" x="40" y="78">Qué dice cada campo de la caché</text>
    <text class="subtitle" x="40" y="102">Una línea de ldconfig -p, desmontada campo a campo</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-cabecera">
      <rect class="out-band" x="40" y="126" width="880" height="50" rx="8"/>
      <text class="out-mono" x="64" y="157">894 libs found in cache `/etc/ld.so.cache'</text>
      <text class="out-tag" x="896" y="157" text-anchor="end">SALIDA DE LDCONFIG -P</text>
    </g>

    <g id="node-campo-soname">
      <rect class="chip" x="40" y="196" width="380" height="64" rx="8"/>
      <text class="field-num" x="64" y="220">CAMPO 1</text>
      <text class="chip-mono" x="64" y="244">libssl.so.3</text>
    </g>

    <g id="node-campo-formato">
      <rect class="chip" x="40" y="268" width="380" height="64" rx="8"/>
      <text class="field-num" x="64" y="292">CAMPO 2</text>
      <text class="chip-mono" x="64" y="316" style="font-size:14px">(libc6,x86-64, OS ABI: Linux 3.2.0)</text>
    </g>

    <g id="node-campo-ruta">
      <rect class="chip" x="40" y="340" width="380" height="64" rx="8"/>
      <text class="field-num" x="64" y="364">CAMPO 3</text>
      <text class="chip-mono" x="64" y="388" style="font-size:14px">/usr/lib/x86_64-linux-gnu/libssl.so.3</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="desc" x="448" y="228">soname y versión mayor</text>
    <text class="desc" x="448" y="248">que pide el binario</text>
    <text class="desc" x="448" y="300">formato ELF, arquitectura</text>
    <text class="desc" x="448" y="320">y kernel compatible</text>
    <text class="desc" x="448" y="372">ruta física absoluta que</text>
    <text class="desc" x="448" y="392">se carga en la memoria RAM</text>
    <text class="note" x="40" y="444">Cada línea es una librería ya indexada en la caché.</text>
    <text class="note" x="40" y="468">El símbolo =&gt; separa el soname de la ruta física.</text>
    <text class="note" x="40" y="496">La caché solo se reescribe al ejecutar ldconfig.</text>
  </g>
</svg>
