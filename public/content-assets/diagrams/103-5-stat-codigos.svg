<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="stat-title stat-desc">
  <title id="stat-title">Anatomía del código STAT de ps: estado base y modificadores en Ss+ (LPIC-1 103.5)</title>
  <desc id="stat-desc">La columna STAT de ps puede mostrar varios caracteres. El primero es el estado base y sólo puede ser uno: R en ejecución, S en espera interrumpible, D en espera crítica de disco, T detenido o Z zombi. Los siguientes son modificadores de contexto que se acumulan: la s indica líder de sesión, el signo más indica que el proceso controla el teclado en primer plano, la l indica multihilo, el signo menor que indica prioridad alta y la N prioridad baja. Los ejemplos Ss+ de una shell interactiva, R+ de un comando en primer plano y Sl de un proceso multihilo en segundo plano combinan ambas partes.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .cell-base { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .cell-mod { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .glyph-base { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 72px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .glyph-mod { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 72px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .part-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; text-anchor: middle; }
      .part-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .legend-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .legend-glyph { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .legend-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .legend-div { stroke: #E2E8F0; stroke-width: 1.5; }
      .card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">STAT · UN ESTADO Y VARIOS MODIFICADORES</text>
    <text class="title" x="40" y="78">Por qué aparecen dos o más letras</text>
    <text class="subtitle" x="40" y="102">El primer carácter es el estado; el resto, contexto.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-pos-1">
      <rect class="cell-base" x="140" y="140" width="150" height="140" rx="10"/>
      <text class="glyph-base" x="215" y="236">S</text>
    </g>

    <g id="node-pos-2">
      <rect class="cell-mod" x="300" y="140" width="150" height="140" rx="10"/>
      <text class="glyph-mod" x="375" y="236">s</text>
    </g>

    <g id="node-pos-3">
      <rect class="cell-mod" x="460" y="140" width="150" height="140" rx="10"/>
      <text class="glyph-mod" x="535" y="236">+</text>
    </g>

    <g id="node-ejemplo-1">
      <rect class="card" x="40" y="396" width="280" height="74" rx="10"/>
      <text class="card-mono" x="64" y="428">Ss+</text>
      <text class="card-text" x="120" y="428">shell del login</text>
      <text class="card-text" x="64" y="454">Esperando teclas en el prompt.</text>
    </g>

    <g id="node-ejemplo-2">
      <rect class="card" x="340" y="396" width="280" height="74" rx="10"/>
      <text class="card-mono" x="364" y="428">R+</text>
      <text class="card-text" x="406" y="428">comando activo</text>
      <text class="card-text" x="364" y="454">Por ejemplo top o find.</text>
    </g>

    <g id="node-ejemplo-3">
      <rect class="card" x="640" y="396" width="280" height="74" rx="10"/>
      <text class="card-mono" x="664" y="428">Sl</text>
      <text class="card-text" x="706" y="428">multihilo (ele)</text>
      <text class="card-text" x="664" y="454">En segundo plano: nginx.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="guide" x1="215" y1="280" x2="215" y2="312"/>
    <line class="guide" x1="375" y1="280" x2="375" y2="312"/>
    <line class="guide" x1="535" y1="280" x2="535" y2="312"/>

    <text class="part-label" x="215" y="334">ESTADO BASE</text>
    <text class="part-text" x="215" y="358">R, S, D, T o Z</text>

    <text class="part-label" x="375" y="334">MODIFICADOR</text>
    <text class="part-text" x="375" y="358">s: líder de sesión</text>

    <text class="part-label" x="535" y="334">MODIFICADOR</text>
    <text class="part-text" x="535" y="358">+: primer plano</text>

    <text class="legend-head" x="660" y="160">OTROS MODIFICADORES</text>
    <line class="legend-div" x1="660" y1="172" x2="912" y2="172"/>
    <text class="legend-glyph" x="680" y="202">&lt;</text>
    <text class="legend-text" x="712" y="202">prioridad alta</text>
    <text class="legend-glyph" x="680" y="230">N</text>
    <text class="legend-text" x="712" y="230">prioridad baja</text>
    <text class="legend-glyph" x="680" y="258">l</text>
    <text class="legend-text" x="712" y="258">multihilo (ele)</text>
    <line class="legend-div" x1="660" y1="272" x2="912" y2="272"/>
    <text class="legend-text" x="660" y="298">Se acumulan tras el estado.</text>
  </g>
</svg>
