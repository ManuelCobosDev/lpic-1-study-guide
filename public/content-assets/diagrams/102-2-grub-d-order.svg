<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="grub-d-order-title grub-d-order-desc">
  <title id="grub-d-order-title">Orden de ejecución de los scripts de /etc/grub.d y su bloque en grub.cfg (LPIC-1 102.2)</title>
  <desc id="grub-d-order-desc">Los scripts de /etc/grub.d se ejecutan en orden alfabético ascendente: 00_header añade los ajustes globales, 10_linux las entradas de cada kernel instalado, 30_os-prober los otros sistemas operativos y 40_custom las entradas manuales, que quedan al final del menú de GRUB.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .script-card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .menu-box { fill: #FFFFFF; stroke: #475569; stroke-width: 2.5; }
      .script-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .card-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .card-detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .menu-file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #475569; }
      .menu-file-end { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #64748B; }
      .menu-item { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
    </style>

    <marker id="gd-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="gd-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">GRUB 2 · SCRIPTS DE /etc/grub.d</text>
    <text class="title" x="40" y="78">/etc/grub.d fija el orden del menú</text>
    <text class="subtitle" x="40" y="102">Cada script añade un bloque al menú;</text>
    <text class="subtitle" x="40" y="122">el nombre numérico fija su posición.</text>
  </g>

  <g id="diagram-relations">
    <path id="gd-rel-00-10" class="edge-blue"
          data-from="node-00-header" data-to="node-10-linux" data-relation="runs-after"
          d="M 240 212 H 272" marker-end="url(#gd-arrow-blue)"/>

    <path id="gd-rel-10-30" class="edge-blue"
          data-from="node-10-linux" data-to="node-30-os-prober" data-relation="runs-after"
          d="M 472 212 H 504" marker-end="url(#gd-arrow-blue)"/>

    <path id="gd-rel-30-40" class="edge-blue"
          data-from="node-30-os-prober" data-to="node-40-custom" data-relation="runs-after"
          d="M 704 212 H 736" marker-end="url(#gd-arrow-blue)"/>

    <path id="gd-rel-00-menu" class="edge-slate"
          data-from="node-00-header" data-to="node-menu" data-relation="adds-settings"
          d="M 140 274 V 330" marker-end="url(#gd-arrow-slate)"/>

    <path id="gd-rel-10-menu" class="edge-slate"
          data-from="node-10-linux" data-to="node-menu" data-relation="adds-kernels"
          d="M 372 274 V 330" marker-end="url(#gd-arrow-slate)"/>

    <path id="gd-rel-30-menu" class="edge-slate"
          data-from="node-30-os-prober" data-to="node-menu" data-relation="adds-systems"
          d="M 604 274 V 330" marker-end="url(#gd-arrow-slate)"/>

    <path id="gd-rel-40-menu" class="edge-slate"
          data-from="node-40-custom" data-to="node-menu" data-relation="adds-custom"
          d="M 836 274 V 330" marker-end="url(#gd-arrow-slate)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-00-header">
      <rect class="script-card" x="40" y="150" width="200" height="124" rx="10"/>
      <text class="script-name" x="140" y="190">00_header</text>
      <text class="card-sub" x="140" y="216">Ajustes globales:</text>
      <text class="card-detail" x="140" y="236">timeout, resolución</text>
    </g>

    <g id="node-10-linux">
      <rect class="script-card" x="272" y="150" width="200" height="124" rx="10"/>
      <text class="script-name" x="372" y="190">10_linux</text>
      <text class="card-sub" x="372" y="216">Una entrada por kernel</text>
      <text class="card-detail" x="372" y="236">instalado en /boot</text>
    </g>

    <g id="node-30-os-prober">
      <rect class="script-card" x="504" y="150" width="200" height="124" rx="10"/>
      <text class="script-name" x="604" y="190">30_os-prober</text>
      <text class="card-sub" x="604" y="216">Otros sistemas:</text>
      <text class="card-detail" x="604" y="236">Windows, otras distros</text>
    </g>

    <g id="node-40-custom">
      <rect class="script-card" x="736" y="150" width="200" height="124" rx="10"/>
      <text class="script-name" x="836" y="190">40_custom</text>
      <text class="card-sub" x="836" y="216">Entradas propias</text>
      <text class="card-detail" x="836" y="236">al final del menú</text>
    </g>

    <g id="node-menu">
      <rect class="menu-box" x="40" y="330" width="896" height="124" rx="10"/>
      <text class="menu-file" x="60" y="352">grub.cfg</text>
      <text class="menu-file-end" x="916" y="352" text-anchor="end">orden final del menú</text>
      <text class="menu-item" x="140" y="404">ajustes y timeout</text>
      <text class="menu-item" x="372" y="404">kernels instalados</text>
      <text class="menu-item" x="604" y="404">otros sistemas</text>
      <text class="menu-item" x="836" y="404">tus entradas</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="56" y1="364" x2="920" y2="364"/>
    <line class="divider" x1="240" y1="364" x2="240" y2="442"/>
    <line class="divider" x1="472" y1="364" x2="472" y2="442"/>
    <line class="divider" x1="704" y1="364" x2="704" y2="442"/>
    <text class="note" x="40" y="486">El nombre empieza por dos cifras para fijar el orden;</text>
    <text class="note" x="40" y="508">GRUB los ejecuta de menor a mayor, en orden alfabético.</text>
  </g>
</svg>
