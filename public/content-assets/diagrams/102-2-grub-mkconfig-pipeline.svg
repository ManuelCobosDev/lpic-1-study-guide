<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="grub-pipe-title grub-pipe-desc">
  <title id="grub-pipe-title">Generación de /boot/grub/grub.cfg con grub-mkconfig (LPIC-1 102.2)</title>
  <desc id="grub-pipe-desc">Dos fuentes de configuración, /etc/default/grub con las variables globales y los scripts ejecutables de /etc/grub.d, se compilan con grub-mkconfig en el archivo final /boot/grub/grub.cfg. El archivo generado no se edita a mano porque se sobrescribe en cada compilación.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-out { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .mono-name-center { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .mono-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; text-anchor: middle; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-sub-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .warn-badge { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .warn-badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.04em; text-anchor: middle; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 400; fill: #881337; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
      .edge-rose { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .edge-label-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #E11D48; text-anchor: middle; }
    </style>

    <marker id="gp-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="gp-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="gp-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">GRUB 2 · GENERACIÓN DEL MENÚ</text>
    <text class="title" x="40" y="78">De dos fuentes a un solo archivo</text>
    <text class="subtitle" x="40" y="102">/etc/default/grub + /etc/grub.d/* → /boot/grub/grub.cfg</text>
  </g>

  <g id="diagram-relations">
    <path id="gp-rel-default-mkconfig" class="edge-blue"
          data-from="node-default-grub" data-to="node-mkconfig" data-relation="reads-variables"
          d="M 312 170 H 336 V 190 H 360" marker-end="url(#gp-arrow-blue)"/>

    <path id="gp-rel-grubd-mkconfig" class="edge-slate"
          data-from="node-grub-d" data-to="node-mkconfig" data-relation="reads-scripts"
          d="M 312 290 H 336 V 246 H 360" marker-end="url(#gp-arrow-slate)"/>

    <path id="gp-rel-mkconfig-output" class="edge-blue"
          data-from="node-mkconfig" data-to="node-grub-cfg" data-relation="writes"
          d="M 620 218 H 676" marker-end="url(#gp-arrow-blue)"/>

    <path id="gp-rel-output-warning" class="edge-rose"
          data-from="node-grub-cfg" data-to="node-warning" data-relation="overwrites"
          d="M 798 296 V 372" marker-end="url(#gp-arrow-rose)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-default-grub">
      <rect class="node-file" x="40" y="128" width="272" height="92" rx="10"/>
      <text class="mono-name" x="62" y="160">/etc/default/grub</text>
      <text class="node-sub" x="62" y="184">Variables globales del menú</text>
      <text class="node-sub" x="62" y="204">timeout, kernel, opciones</text>
    </g>

    <g id="node-grub-d">
      <rect class="node-file" x="40" y="240" width="272" height="92" rx="10"/>
      <text class="mono-name" x="62" y="272">/etc/grub.d/*</text>
      <text class="node-sub" x="62" y="296">Scripts ejecutables</text>
      <text class="node-sub" x="62" y="316">un bloque por script</text>
    </g>

    <g id="node-mkconfig">
      <rect class="node-cmd" x="360" y="140" width="260" height="156" rx="10"/>
      <text class="mono-cmd" x="490" y="184">grub-mkconfig</text>
      <text class="mono-line" x="490" y="210">-o /boot/grub/grub.cfg</text>
      <text class="node-sub-center" x="490" y="238">Compilador del menú</text>
    </g>

    <g id="node-grub-cfg">
      <rect class="node-out" x="676" y="140" width="244" height="156" rx="10"/>
      <text class="mono-name-center" x="798" y="184">/boot/grub/grub.cfg</text>
      <text class="node-sub-center" x="798" y="212">Archivo final</text>
      <text class="node-sub-center" x="798" y="232">que lee GRUB</text>
      <rect class="warn-badge" x="700" y="252" width="196" height="26" rx="7"/>
      <text class="warn-badge-text" x="798" y="270">NO SE EDITA A MANO</text>
    </g>

    <g id="node-warning">
      <rect class="node-warn" x="40" y="372" width="880" height="112" rx="10"/>
      <text class="warn-title" x="62" y="408">No edites /boot/grub/grub.cfg a mano</text>
      <text class="warn-body" x="62" y="436">grub-mkconfig lo reescribe completo en cada ejecución:</text>
      <text class="warn-body" x="62" y="460">lo que cambies a mano se pierde en la siguiente compilaci�n.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="label-bg" x="804" y="318" width="114" height="24" rx="6"/>
    <text class="edge-label-rose" x="861" y="335">se sobrescribe</text>
  </g>
</svg>
