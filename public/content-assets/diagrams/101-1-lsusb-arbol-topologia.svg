<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="usb-title usb-desc">
  <title id="usb-title">Árbol de lsusb -t: controladoras, concentradores y periféricos USB (LPIC-1 101.1)</title>
  <desc id="usb-desc">El árbol de lsusb -t muestra dos concentradores raíz: el Bus 02 con el driver xhci_hcd y cuatro puertos a 10000M, y el Bus 01 con xhci_hcd y diez puertos a 480M. Del Bus 01 cuelgan dos dispositivos: en el puerto 1 un Human Interface Device controlado por usbhid a 12M y en el puerto 2 un Mass Storage controlado por usb-storage a 480M. La sangría del árbol indica a qué concentrador cuelga cada dispositivo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .node-dev { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .hub-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #F8FAFC; }
      .hub-detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #E2E8F0; }
      .dev-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .dev-class { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #334155; }
      .dev-driver { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #B45309; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
    </style>

    <marker id="usb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">BUS USB · TOPOLOGÍA EN ÁRBOL</text>
    <text class="title" x="40" y="78">lsusb -t: el árbol de buses y puertos</text>
    <text class="subtitle" x="40" y="102">Cada rama añade clase, driver y velocidad.</text>
  </g>

  <g id="diagram-relations">
    <path id="usb-rel-bus01-dev2" class="edge"
          data-from="node-bus-01" data-to="node-dev-2" data-relation="hosts-device"
          d="M 600 218 V 310" marker-end="url(#usb-arrow)"/>
    <path id="usb-rel-bus01-dev3" class="edge"
          data-from="node-bus-01" data-to="node-dev-3" data-relation="hosts-device"
          d="M 820 218 V 310" marker-end="url(#usb-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-bus-02">
      <rect class="node-hw" x="60" y="132" width="380" height="86" rx="10"/>
      <text class="hub-name" x="84" y="166">Bus 02 · root_hub</text>
      <text class="hub-detail" x="84" y="192">Dev 1 · xhci_hcd · 4 puertos · 10000M</text>
    </g>

    <g id="node-bus-01">
      <rect class="node-hw" x="520" y="132" width="380" height="86" rx="10"/>
      <text class="hub-name" x="544" y="166">Bus 01 · root_hub</text>
      <text class="hub-detail" x="544" y="192">Dev 1 · xhci_hcd · 10 puertos · 480M</text>
    </g>

    <g id="node-dev-2">
      <rect class="node-dev" x="500" y="310" width="200" height="116" rx="10"/>
      <text class="dev-name" x="522" y="342">Port 1 · Dev 2</text>
      <text class="dev-class" x="522" y="368">Human Interface Device</text>
      <text class="dev-driver" x="522" y="392">usbhid · 12M</text>
    </g>

    <g id="node-dev-3">
      <rect class="node-dev" x="720" y="310" width="200" height="116" rx="10"/>
      <text class="dev-name" x="742" y="342">Port 2 · Dev 3</text>
      <text class="dev-class" x="742" y="368">Mass Storage</text>
      <text class="dev-driver" x="742" y="392">usb-storage · 480M</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="84" y="262">Solo aparece el concentrador raíz: sin periféricos.</text>
    <text class="note" x="40" y="470">La sangría indica de qué concentrador cuelga cada uno.</text>
    <text class="note" x="40" y="492">La velocidad mostrada es la negociada en ese puerto.</text>
  </g>
</svg>
