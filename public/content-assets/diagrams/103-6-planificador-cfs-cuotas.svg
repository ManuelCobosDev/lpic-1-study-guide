<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cfs-title cfs-desc">
  <title id="cfs-title">Multitarea preventiva y planificador CFS: cuotas de tiempo, desalojo y niceness (LPIC-1 103.6)</title>
  <desc id="cfs-desc">El planificador CFS toma los procesos listos de la cola de ejecución, concede a cada uno una cuota de tiempo medida en milisegundos y lo pone en la CPU. Cuando la cuota expira, el kernel desaloja el proceso y lo devuelve a la cola. Si un proceso intenta acaparar el 100 % de la CPU, el desalojo preventivo lo expulsa y rota al siguiente. El factor niceness no cambia la política: los valores negativos reciben cuotas grandes y los positivos reciben las sobras.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .card { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .node-name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .card-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #1D40D8; text-anchor: middle; }
      .footer { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="cfs-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PLANIFICADOR DEL KERNEL · MULTITAREA PREVENTIVA</text>
    <text class="title" x="40" y="78">El kernel decide cuándo desaloja</text>
    <text class="subtitle" x="40" y="102">CFS reparte cuotas de tiempo y peso;</text>
    <text class="subtitle" x="40" y="122">niceness solo inclina la balanza.</text>
  </g>

  <g id="diagram-relations">
    <path id="cfs-rel-cola-planificador" class="edge-blue"
          data-from="node-cola" data-to="node-planificador" data-relation="toma-el-siguiente"
          d="M 312 194 H 344" marker-end="url(#cfs-arrow-blue)"/>

    <path id="cfs-rel-planificador-cpu" class="edge-blue"
          data-from="node-planificador" data-to="node-cpu" data-relation="entrega-la-cpu"
          d="M 616 194 H 664" marker-end="url(#cfs-arrow-blue)"/>

    <path id="cfs-rel-cpu-cola" class="edge-blue"
          data-from="node-cpu" data-to="node-cola" data-relation="desalojo-al-expirar"
          d="M 792 248 V 300 H 176 V 248" marker-end="url(#cfs-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-cola">
      <rect class="node-kernel" x="40" y="140" width="272" height="108" rx="10"/>
      <text class="node-name" x="64" y="170">Cola de ejecución</text>
      <text class="node-sub" x="64" y="196">Procesos listos que</text>
      <text class="node-sub" x="64" y="216">esperan su turno de CPU</text>
    </g>

    <g id="node-planificador">
      <rect class="node-kernel" x="344" y="140" width="272" height="108" rx="10"/>
      <text class="node-name" x="368" y="170">Planificador CFS</text>
      <text class="node-sub" x="368" y="196">Reparte la CPU por tiempo</text>
      <text class="node-sub" x="368" y="216">consumido y por peso</text>
    </g>

    <g id="node-cpu">
      <rect class="node-kernel" x="664" y="140" width="256" height="108" rx="10"/>
      <text class="node-name" x="688" y="170">Proceso en la CPU</text>
      <text class="node-sub" x="688" y="196">Ejecuta su cuota</text>
      <text class="node-sub" x="688" y="216">hasta que expira</text>
    </g>

    <g id="node-cuota">
      <rect class="card" x="40" y="340" width="272" height="112" rx="10"/>
      <text class="card-title" x="64" y="368">Cuota de tiempo</text>
      <text class="card-sub" x="64" y="396">Ráfagas breves de</text>
      <text class="card-sub" x="64" y="418">milisegundos a cada</text>
      <text class="card-sub" x="64" y="440">tarea activa.</text>
    </g>

    <g id="node-desalojo">
      <rect class="card" x="344" y="340" width="272" height="112" rx="10"/>
      <text class="card-title" x="368" y="368">Desalojo preventivo</text>
      <text class="card-sub" x="368" y="396">Si acapara el 100 %</text>
      <text class="card-sub" x="368" y="418">de la CPU, el kernel</text>
      <text class="card-sub" x="368" y="440">lo expulsa y rota.</text>
    </g>

    <g id="node-niceness">
      <rect class="card" x="664" y="340" width="256" height="112" rx="10"/>
      <text class="card-title" x="688" y="368">Factor niceness</text>
      <text class="card-sub" x="688" y="396">-20 recibe cuotas</text>
      <text class="card-sub" x="688" y="418">grandes; +19 recibe</text>
      <text class="card-sub" x="688" y="440">las sobras.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <g id="lbl-desalojo">
      <rect class="label-bg" x="360" y="266" width="400" height="26" rx="6"/>
      <text class="edge-label" x="560" y="284">desalojo al expirar la cuota (time slice)</text>
    </g>
    <text class="footer" x="40" y="492">nice y renice solo modulan los procesos de política normal.</text>
  </g>
</svg>
