<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lc-ciclo-title lc-ciclo-desc">
  <title id="lc-ciclo-title">Ciclo de vida del contador de enlaces de un archivo (LPIC-1 104.6)</title>
  <desc id="lc-ciclo-desc">Un archivo nace con un solo enlace: touch doc.txt deja el contador en 1. Al crear un enlace duro con ln doc.txt duro.txt el contador del mismo inodo sube a 2 sin duplicar los datos, y al borrar una de las dos entradas con rm doc.txt el contador baja a 1 y el contenido sigue accesible por duro.txt, porque rm ejecuta unlink y no destruye los bloques. Solo cuando el contador llega a 0 y ningún proceso mantiene el archivo abierto se liberan los bloques de disco.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-slate { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-blue { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-green { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .count { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 38px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .count-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; text-anchor: middle; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .note-green { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #065F46; text-anchor: middle; }
      .ls-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #0F172A; }
      .ls-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #1E36AF; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="lc-ciclo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.6 · LINK COUNT EN ARCHIVOS</text>
    <text class="title" x="40" y="78">El contador decide cuándo mueren los datos</text>
    <text class="subtitle" x="40" y="102">rm es unlink: resta uno y no destruye los bloques</text>
  </g>

  <g id="diagram-relations">
    <path id="lc-ciclo-rel-1-2" class="edge-blue"
          data-from="node-paso-1" data-to="node-paso-2" data-relation="adds-hard-link"
          d="M 242 215 H 266" marker-end="url(#lc-ciclo-arrow)"/>

    <path id="lc-ciclo-rel-2-3" class="edge-blue"
          data-from="node-paso-2" data-to="node-paso-3" data-relation="removes-one-name"
          d="M 468 215 H 492" marker-end="url(#lc-ciclo-arrow)"/>

    <path id="lc-ciclo-rel-3-4" class="edge-blue"
          data-from="node-paso-3" data-to="node-paso-4" data-relation="removes-last-name"
          d="M 694 215 H 718" marker-end="url(#lc-ciclo-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-paso-1">
      <rect class="card-slate" x="40" y="140" width="202" height="150" rx="10"/>
      <text class="mono-cmd" x="141" y="168">touch doc.txt</text>
      <text class="count" x="141" y="222">1</text>
      <text class="count-label" x="141" y="242">ENLACES</text>
      <text class="note" x="141" y="266">nace con un enlace</text>
      <text class="note" x="141" y="282">no hay copia</text>
    </g>

    <g id="node-paso-2">
      <rect class="card-blue" x="266" y="140" width="202" height="150" rx="10"/>
      <text class="mono-cmd" x="367" y="168">ln doc.txt duro.txt</text>
      <text class="count" x="367" y="222">2</text>
      <text class="count-label" x="367" y="242">ENLACES</text>
      <text class="note" x="367" y="266">suma uno al inodo</text>
      <text class="note" x="367" y="282">no duplica datos</text>
    </g>

    <g id="node-paso-3">
      <rect class="card-green" x="492" y="140" width="202" height="150" rx="10"/>
      <text class="mono-cmd" x="593" y="168">rm doc.txt</text>
      <text class="count" x="593" y="222">1</text>
      <text class="count-label" x="593" y="242">ENLACES</text>
      <text class="note-green" x="593" y="266">datos intactos</text>
      <text class="note-green" x="593" y="282">vivos en duro.txt</text>
    </g>

    <g id="node-paso-4">
      <rect class="card-slate" x="718" y="140" width="202" height="150" rx="10"/>
      <text class="mono-cmd" x="819" y="168">rm duro.txt</text>
      <text class="count" x="819" y="222">0</text>
      <text class="count-label" x="819" y="242">ENLACES</text>
      <text class="note" x="819" y="266">bloques liberados</text>
      <text class="note" x="819" y="282">espacio reutilizable</text>
    </g>

    <g id="node-ls">
      <rect class="band" x="40" y="312" width="880" height="88" rx="10"/>
      <text class="ls-line" x="64" y="348">-rw-r--r-- 2 alumno alumno 6 oct 20 11:45 doc.txt</text>
      <text class="ls-note" x="168" y="374">columna 2 = link count</text>
    </g>

    <g id="node-liberacion">
      <rect class="band" x="40" y="414" width="880" height="90" rx="10"/>
      <text class="band-text" x="64" y="444">Cada rm resta uno al contador; el inodo y sus bloques solo desaparecen</text>
      <text class="band-text" x="64" y="468">cuando el contador llega a 0 y ningún proceso tiene el archivo abierto.</text>
    </g>
  </g>
</svg>
