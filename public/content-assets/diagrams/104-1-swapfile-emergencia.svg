<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="swapfile-title swapfile-desc">
  <title id="swapfile-title">Swapfile de emergencia en cinco pasos, sin reiniciar (LPIC-1 104.1)</title>
  <desc id="swapfile-desc">Secuencia vertical numerada para crear un archivo de intercambio cuando la RAM está al 98%, el OOM Killer mata procesos con SIGKILL y no quedan particiones libres. El paso 1 reserva 2 GB con dd if=/dev/zero of=/swapfile bs=1M count=2048; el paso 2 restringe los permisos con chmod 600 /swapfile; el paso 3 formatea con mkswap /swapfile; el paso 4 activa con swapon /swapfile; el paso 5 persiste la línea /swapfile none swap sw 0 0 en /etc/fstab para el próximo arranque.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .step-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1E36AF; }
      .cmd-file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #475569; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .spine { stroke: #1D40D8; stroke-width: 2; opacity: 0.35; }
      .divider { stroke: #E2E8F0; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.1 · SWAPFILE DE EMERGENCIA</text>
    <text class="title" x="40" y="78">Rescate en caliente: de la RAM al swapfile</text>
    <text class="subtitle" x="40" y="102">RAM al 98%: el OOM Killer mata con SIGKILL.</text>
    <text class="subtitle" x="40" y="122">Sin particiones libres: cinco pasos, sin reiniciar.</text>
  </g>

  <g id="diagram-groups"></g>

  <g id="diagram-relations">
    <line class="spine" x1="56" y1="194" x2="56" y2="234"/>
    <line class="spine" x1="56" y1="264" x2="56" y2="304"/>
    <line class="spine" x1="56" y1="334" x2="56" y2="374"/>
    <line class="spine" x1="56" y1="404" x2="56" y2="444"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-step-1">
      <rect class="card-cmd" x="88" y="146" width="572" height="66" rx="10"/>
      <text class="step-title" x="110" y="174">Reservar</text>
      <text class="cmd" x="110" y="198">dd if=/dev/zero of=/swapfile bs=1M count=2048</text>
    </g>
    <g id="node-step-2">
      <rect class="card-cmd" x="88" y="216" width="572" height="66" rx="10"/>
      <text class="step-title" x="110" y="244">Permisos 0600</text>
      <text class="cmd" x="110" y="268">chmod 600 /swapfile</text>
    </g>
    <g id="node-step-3">
      <rect class="card-cmd" x="88" y="286" width="572" height="66" rx="10"/>
      <text class="step-title" x="110" y="314">Formatear</text>
      <text class="cmd" x="110" y="338">mkswap /swapfile</text>
    </g>
    <g id="node-step-4">
      <rect class="card-cmd" x="88" y="356" width="572" height="66" rx="10"/>
      <text class="step-title" x="110" y="384">Activar</text>
      <text class="cmd" x="110" y="408">swapon /swapfile</text>
    </g>
    <g id="node-step-5">
      <rect class="card-file" x="88" y="426" width="572" height="66" rx="10"/>
      <text class="step-title" x="110" y="454">Persistir</text>
      <text class="cmd-file" x="110" y="478">/swapfile none swap sw 0 0</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="56" cy="179" r="15"/>
    <text class="badge-num" x="56" y="184">1</text>
    <circle class="badge" cx="56" cy="249" r="15"/>
    <text class="badge-num" x="56" y="254">2</text>
    <circle class="badge" cx="56" cy="319" r="15"/>
    <text class="badge-num" x="56" y="324">3</text>
    <circle class="badge" cx="56" cy="389" r="15"/>
    <text class="badge-num" x="56" y="394">4</text>
    <circle class="badge" cx="56" cy="459" r="15"/>
    <text class="badge-num" x="56" y="464">5</text>

    <line class="divider" x1="672" y1="150" x2="672" y2="488"/>

    <text class="note" x="684" y="174">if=/dev/zero, bs=1M</text>
    <text class="note" x="684" y="192">y count=2048.</text>

    <text class="note" x="684" y="244">La swap guarda datos</text>
    <text class="note" x="684" y="262">de la RAM: 0600.</text>

    <text class="note" x="684" y="314">Firma el área de</text>
    <text class="note" x="684" y="332">intercambio.</text>

    <text class="note" x="684" y="384">Activa el archivo</text>
    <text class="note" x="684" y="402">en caliente.</text>

    <text class="note" x="684" y="454">Línea de /etc/fstab</text>
    <text class="note" x="684" y="472">en el próximo arranque.</text>
  </g>
</svg>
