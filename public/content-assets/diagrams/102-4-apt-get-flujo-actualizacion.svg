<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="aptget-title aptget-desc">
  <title id="aptget-title">Flujo de apt-get: de sources.list a la actualización conservadora o agresiva (LPIC-1 102.4)</title>
  <desc id="aptget-desc">apt-get update lee /etc/apt/sources.list y descarga los catálogos en /var/lib/apt/lists/ sin instalar ni actualizar ningún paquete. Después, apt-get upgrade actualiza los paquetes instalados sin eliminar nunca ninguno: lo que no encaja queda retenido como kept back. apt-get dist-upgrade resuelve dependencias complejas y puede instalar paquetes nuevos y eliminar los obsoletos, por ejemplo en un salto de Debian 11 a 12.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-safe { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-warn { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-trap { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .card-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .card-role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #065F46; }
      .card-role-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #B45309; }
      .card-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #1E293B; }
      .warn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #881337; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="aptget-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">APT-GET · REFRESCAR Y ACTUALIZAR</text>
    <text class="title" x="40" y="78">Primero los índices, después los paquetes</text>
    <text class="subtitle" x="40" y="102">update no instala; upgrade sí cambia el sistema.</text>
  </g>

  <g id="diagram-relations">
    <path id="aptget-rel-sources-update" class="edge-blue"
          data-from="node-sources" data-to="node-update" data-relation="lee-los-repositorios"
          d="M 300 180 H 340" marker-end="url(#aptget-arrow-blue)"/>

    <path id="aptget-rel-update-lists" class="edge-blue"
          data-from="node-update" data-to="node-lists" data-relation="descarga-catalogos"
          d="M 620 180 H 660" marker-end="url(#aptget-arrow-blue)"/>

    <path id="aptget-rel-lists-upgrade" class="edge-blue"
          data-from="node-lists" data-to="node-upgrade" data-relation="alimenta-upgrade"
          d="M 790 220 V 255 H 370 V 290" marker-end="url(#aptget-arrow-blue)"/>

    <path id="aptget-rel-lists-dist" class="edge-blue"
          data-from="node-lists" data-to="node-dist-upgrade" data-relation="alimenta-dist-upgrade"
          d="M 790 220 V 290" marker-end="url(#aptget-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-sources">
      <rect class="node-file" x="40" y="140" width="260" height="80" rx="10"/>
      <text class="mono-name" x="64" y="172">/etc/apt/sources.list</text>
      <text class="node-sub" x="64" y="198">repositorios configurados</text>
    </g>

    <g id="node-update">
      <rect class="node-cmd" x="340" y="140" width="280" height="80" rx="10"/>
      <text class="mono-cmd" x="364" y="172">apt-get update</text>
      <text class="node-sub" x="364" y="198">refresca los índices</text>
    </g>

    <g id="node-lists">
      <rect class="node-file" x="660" y="140" width="260" height="80" rx="10"/>
      <text class="mono-name" x="684" y="172">/var/lib/apt/lists/</text>
      <text class="node-sub" x="684" y="198">catálogos descargados</text>
    </g>

    <g id="node-upgrade">
      <rect class="node-safe" x="180" y="290" width="380" height="140" rx="10"/>
      <text class="card-title" x="204" y="322">apt-get upgrade</text>
      <text class="card-role" x="204" y="346">Conservadora</text>
      <text class="card-line" x="204" y="372">Actualiza a la última versión.</text>
      <text class="card-line" x="204" y="394">Nunca elimina paquetes:</text>
      <text class="card-line" x="204" y="416">lo que no encaja queda retenido (kept back).</text>
    </g>

    <g id="node-dist-upgrade">
      <rect class="node-warn" x="600" y="290" width="320" height="140" rx="10"/>
      <text class="card-title" x="624" y="322">apt-get dist-upgrade</text>
      <text class="card-role-warn" x="624" y="346">Agresiva</text>
      <text class="card-line" x="624" y="372">Saltos mayores (Debian 11 a 12)</text>
      <text class="card-line" x="624" y="394">Puede instalar nuevas</text>
      <text class="card-line" x="624" y="416">dependencias y eliminar obsoletos.</text>
    </g>

    <g id="node-trampa">
      <rect class="node-trap" x="40" y="450" width="880" height="58" rx="10"/>
      <text class="warn-text" x="64" y="485">update solo refresca /var/lib/apt/lists/: no instala ni actualiza nada.</text>
    </g>
  </g>
</svg>
