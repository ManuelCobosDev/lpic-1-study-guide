<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="octal-title octal-desc">
  <title id="octal-title">Los nueve bits del modo de permiso y su conversión a octal (LPIC-1 104.5)</title>
  <desc id="octal-desc">Anatomía del modo de permiso: nueve celdas agrupadas en tres tríos de dueño, grupo y otros. Cada celda muestra la letra del permiso con su peso binario, r igual a 4, w igual a 2 y x igual a 1. El ejemplo activa rwx en el dueño y r-x en grupo y otros, de modo que los dígitos octales son 7, 5 y 5. Sumando los pesos activos de cada trío se obtiene un dígito entre 0 y 7: rwxr-xr-x es 755, rw-r--r-- es 644 y rwx------ o rw------- son 700 y 600. La banda inferior recuerda que el dígito octal es la suma de los pesos activos del trío.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .group-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.07em; text-anchor: middle; }
      .bit-cell { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .bit-cell-off { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .bit-letter { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .bit-letter-off { fill: #94A3B8; }
      .bit-weight { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .octal-box { fill: #FFFFFF; stroke: #2550EB; stroke-width: 2; }
      .octal-digit { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 28px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .examples { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .col-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .example-sym { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .example-oct { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; }
      .example-use { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .formula-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .formula { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #1E36AF; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .spine { stroke: #2550EB; stroke-width: 2; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">NOTACIÓN OCTAL · PESOS 4, 2, 1</text>
    <text class="title" x="40" y="78">Nueve bits, tres dígitos octales</text>
    <text class="subtitle" x="40" y="102">Cada trío rwx se convierte en un dígito del 0 al 7</text>
    <text class="group-label" x="240" y="140">DUEÑO (u)</text>
    <text class="group-label" x="480" y="140">GRUPO (g)</text>
    <text class="group-label" x="720" y="140">OTROS (o)</text>
  </g>

  <g id="diagram-nodes">
    <g>
      <rect class="bit-cell" x="124" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter" x="160" y="191">r</text>
      <text class="bit-weight" x="160" y="213">4</text>
      <rect class="bit-cell" x="204" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter" x="240" y="191">w</text>
      <text class="bit-weight" x="240" y="213">2</text>
      <rect class="bit-cell" x="284" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter" x="320" y="191">x</text>
      <text class="bit-weight" x="320" y="213">1</text>

      <rect class="bit-cell" x="364" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter" x="400" y="191">r</text>
      <text class="bit-weight" x="400" y="213">4</text>
      <rect class="bit-cell-off" x="444" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter bit-letter-off" x="480" y="191">-</text>
      <text class="bit-weight" x="480" y="213">2</text>
      <rect class="bit-cell" x="524" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter" x="560" y="191">x</text>
      <text class="bit-weight" x="560" y="213">1</text>

      <rect class="bit-cell" x="604" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter" x="640" y="191">r</text>
      <text class="bit-weight" x="640" y="213">4</text>
      <rect class="bit-cell-off" x="684" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter bit-letter-off" x="720" y="191">-</text>
      <text class="bit-weight" x="720" y="213">2</text>
      <rect class="bit-cell" x="764" y="158" width="72" height="64" rx="8"/>
      <text class="bit-letter" x="800" y="191">x</text>
      <text class="bit-weight" x="800" y="213">1</text>
    </g>

    <g>
      <rect class="octal-box" x="184" y="246" width="112" height="48" rx="8"/>
      <text class="octal-digit" x="240" y="282">7</text>
      <rect class="octal-box" x="424" y="246" width="112" height="48" rx="8"/>
      <text class="octal-digit" x="480" y="282">5</text>
      <rect class="octal-box" x="664" y="246" width="112" height="48" rx="8"/>
      <text class="octal-digit" x="720" y="282">5</text>
    </g>

    <g id="node-ejemplos">
      <rect class="examples" x="40" y="306" width="880" height="142" rx="10"/>
      <text class="col-label" x="64" y="328">SIMBÓLICO</text>
      <text class="col-label" x="344" y="328">OCTAL</text>
      <text class="col-label" x="480" y="328">USO TÍPICO</text>
      <line class="divider" x1="64" y1="336" x2="896" y2="336"/>
      <text class="example-sym" x="64" y="364">rwxr-xr-x</text>
      <text class="example-oct" x="344" y="364">755</text>
      <text class="example-use" x="480" y="364">directorios y programas ejecutables</text>
      <line class="divider" x1="64" y1="380" x2="896" y2="380"/>
      <text class="example-sym" x="64" y="408">rw-r--r--</text>
      <text class="example-oct" x="344" y="408">644</text>
      <text class="example-use" x="480" y="408">archivos de configuración y documentos</text>
      <line class="divider" x1="64" y1="424" x2="896" y2="424"/>
      <text class="example-sym" x="64" y="446">rwx------ / rw-------</text>
      <text class="example-oct" x="344" y="446">700 / 600</text>
      <text class="example-use" x="480" y="446">acceso privado: id_rsa, swapfile</text>
    </g>

    <g id="node-formula">
      <rect class="formula-band" x="40" y="462" width="880" height="46" rx="8"/>
      <text class="formula" x="64" y="490">r = 4 (100) · w = 2 (010) · x = 1 (001): el octal suma los pesos activos.</text>
    </g>
  </g>

  <g id="diagram-relations">
    <line class="spine" x1="240" y1="222" x2="240" y2="246"/>
    <line class="spine" x1="480" y1="222" x2="480" y2="246"/>
    <line class="spine" x1="720" y1="222" x2="720" y2="246"/>
  </g>
</svg>
