<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rol-title rol-desc">
  <title id="rol-title">Esquemas de particionado recomendados según el uso del equipo (LPIC-1 102.1)</title>
  <desc id="rol-desc">Cuatro tarjetas con el esquema típico de cada rol. El portátil separa una ESP de 512 MB, una raíz de 50 GB, /home con el resto y swap al menos igual a la RAM. El servidor web o de base de datos usa /boot de 1 GB, una raíz de 30 GB, /var de 200 GB en LVM y swap de 4 a 8 GB. El servidor de aula reparte /home con cuotas y monta /tmp con noexec. El router o la microSD monta la raíz en solo lectura, deja /var/log en RAM y no usa swap.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .role-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .chips { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #1E36AF; }
      .reason { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .divider { stroke: #E2E8F0; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · ESQUEMAS POR ROL</text>
    <text class="title" x="40" y="78">Cuatro equipos, cuatro esquemas</text>
    <text class="subtitle" x="40" y="102">El uso manda: escritorio, servidor, aula y embebido</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-role-desktop">
      <rect class="card" x="40" y="124" width="430" height="176" rx="10"/>
      <text class="role-title" x="64" y="152">Portátil o PC de casa</text>
      <line class="divider" x1="64" y1="164" x2="446" y2="164"/>
      <text class="chips" x="64" y="188">ESP 512M · / 50G · /home resto</text>
      <text class="chips" x="64" y="208">swap ≥ RAM (hibernar)</text>
      <text class="reason" x="64" y="242">Separas /home para que tus archivos sobrevivan</text>
      <text class="reason" x="64" y="262">a reinstalar el sistema; swap = RAM para hibernar</text>
    </g>

    <g id="node-role-server">
      <rect class="card" x="490" y="124" width="430" height="176" rx="10"/>
      <text class="role-title" x="514" y="152">Servidor web o base de datos</text>
      <line class="divider" x1="514" y1="164" x2="896" y2="164"/>
      <text class="chips" x="514" y="188">/boot 1G · / 30G · /var LVM 200G</text>
      <text class="chips" x="514" y="208">swap 4-8G</text>
      <text class="reason" x="514" y="242">Si un ataque DoS llena /var de logs, solo cae</text>
      <text class="reason" x="514" y="262">/var; el servidor sigue vivo para entrar por SSH</text>
    </g>

    <g id="node-role-school">
      <rect class="card" x="40" y="320" width="430" height="176" rx="10"/>
      <text class="role-title" x="64" y="348">Servidor de universidad o escuela</text>
      <line class="divider" x1="64" y1="360" x2="446" y2="360"/>
      <text class="chips" x="64" y="384">/ · /home con cuotas · /tmp noexec</text>
      <text class="chips" x="64" y="404">/var en su propia partición</text>
      <text class="reason" x="64" y="438">Las cuotas impiden que un alumno sature el disco</text>
      <text class="reason" x="64" y="458">común y noexec evita ejecutar programas raros</text>
    </g>

    <g id="node-role-embedded">
      <rect class="card" x="490" y="320" width="430" height="176" rx="10"/>
      <text class="role-title" x="514" y="348">Router, firewall o microSD</text>
      <line class="divider" x1="514" y1="360" x2="896" y2="360"/>
      <text class="chips" x="514" y="384">/ en solo lectura (ro)</text>
      <text class="chips" x="514" y="404">/var/log en RAM · sin swap</text>
      <text class="reason" x="514" y="438">La tarjeta nunca escribe: sobrevive a apagones</text>
      <text class="reason" x="514" y="458">y cortes de luz sin corromper el sistema</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect x="40" y="124" width="6" height="176" rx="3" fill="#2550EB"/>
    <rect x="490" y="124" width="6" height="176" rx="3" fill="#059669"/>
    <rect x="40" y="320" width="6" height="176" rx="3" fill="#D97706"/>
    <rect x="490" y="320" width="6" height="176" rx="3" fill="#475569"/>
  </g>
</svg>
