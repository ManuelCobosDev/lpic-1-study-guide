<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pwr-title pwr-desc">
  <title id="pwr-title">Suspensión, hibernación e hibernación híbrida: qué pasa con la RAM, la swap y la batería (LPIC-1 101.3)</title>
  <desc id="pwr-desc">En la suspensión, ACPI S3, la RAM sigue alimentada a 1,2 V y las aplicaciones quedan vivas mientras la CPU, los discos y los ventiladores se apagan; el equipo despierta en un segundo, gasta entre un uno y un dos por ciento de batería por hora y pierde la sesión si la batería llega a cero o se corta la corriente. En la hibernación, ACPI S4, la RAM se vuelca completa a la swap y el equipo queda apagado con cero vatios: despierta en diez o quince segundos y puede estar meses sin batería. La hibernación híbrida hace las dos cosas, alimenta la RAM y guarda una copia en la swap, de modo que despierta rápido y recupera la sesión del disco si se acaba la corriente. Para hibernar hace falta una swap igual o mayor que la RAM física: con 4 GB de swap y 8 GB de RAM el núcleo cancela el volcado.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-s3 { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .panel-s4 { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .panel-hy { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .mono-cmd-a { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #B45309; }
      .mono-cmd-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #065F46; }
      .mono-cmd-c { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .badge-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #B45309; letter-spacing: 0.06em; }
      .badge-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .badge-c { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .row { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .band { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #881337; }
      .band-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ACPI · ESTADOS DE AHORRO</text>
    <text class="title" x="40" y="78">A dónde va la RAM en cada estado</text>
    <text class="subtitle" x="40" y="102">Consumo, tiempo de despertar y riesgo de perder la sesión</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-s3">
      <rect class="panel-s3" x="40" y="130" width="276" height="282" rx="10"/>
      <text class="mono-cmd-a" x="64" y="168">systemctl suspend</text>
      <text class="badge-a" x="64" y="196">ACPI S3 · SUSPENSIÓN</text>
      <text class="row" x="64" y="232">RAM: alimentada (1,2 V)</text>
      <text class="row" x="64" y="264">CPU y discos: dormidos (0 W)</text>
      <text class="row" x="64" y="296">Ventiladores: off</text>
      <text class="row" x="64" y="328">Despertar: 1 s</text>
      <text class="row" x="64" y="360">Drenaje: 1–2 %/h</text>
      <text class="row" x="64" y="392">Riesgo: RAM sin corriente al 0 %</text>
    </g>

    <g id="node-s4">
      <rect class="panel-s4" x="342" y="130" width="276" height="282" rx="10"/>
      <text class="mono-cmd-b" x="366" y="168">systemctl hibernate</text>
      <text class="badge-b" x="366" y="196">ACPI S4 · HIBERNACIÓN</text>
      <text class="row" x="366" y="232">RAM: copia 100 % en swap</text>
      <text class="row" x="366" y="264">Equipo: apagado, 0 W</text>
      <text class="row" x="366" y="296">Despertar: 10–15 s</text>
      <text class="row" x="366" y="328">Drenaje: 0 % (0 W)</text>
      <text class="row" x="366" y="360">Batería fuera: aguanta meses</text>
      <text class="row" x="366" y="392">Riesgo: nulo si hay swap</text>
    </g>

    <g id="node-hybrid">
      <rect class="panel-hy" x="644" y="130" width="276" height="282" rx="10"/>
      <text class="mono-cmd-c" x="668" y="168">systemctl hybrid-sleep</text>
      <text class="badge-c" x="668" y="196">S3 + S4 · HÍBRIDA</text>
      <text class="row" x="668" y="232">RAM: alimentada (1,2 V)</text>
      <text class="row" x="668" y="264">Swap: copia de seguridad</text>
      <text class="row" x="668" y="296">Despertar: 1 s</text>
      <text class="row" x="668" y="328">Si falla: swap, 0 pérdida</text>
      <text class="row" x="668" y="360">Riesgo: doble salvavidas</text>
      <text class="row" x="668" y="392">Ejemplo: portátil al 15 %</text>
    </g>

    <g id="node-swap-rule">
      <rect class="band" x="40" y="430" width="880" height="74" rx="10"/>
      <text class="band-title" x="64" y="462">Requisito para hibernar: swap ≥ RAM</text>
      <text class="band-line" x="64" y="486">free -h: Mem 7,7 GiB y Swap 8,0 GiB; con 4 GB de swap y 8 GB de RAM el volcado se cancela.</text>
    </g>
  </g>
</svg>
