<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="nic-title nic-desc">
  <title id="nic-title">Escala de niceness de -20 a +19: tres zonas de prioridad (LPIC-1 103.6)</title>
  <desc id="nic-desc">La escala de niceness tiene 40 valores posibles. El tramo de -20 a -1 es la alta prioridad: el proceso es menos amable, exige la máxima cuota de CPU y solo root puede asignarlo. El valor 0 es la prioridad estándar con la que nace todo proceso ordinario. El tramo de +1 a +19 es la baja prioridad: el proceso es más amable, cede CPU voluntariamente y cualquier usuario puede asignarlo. La regla es contraintuitiva: el número menor gana la CPU. -20 es el tope de la política normal y no equivale a tiempo real: un proceso RT de prioridad 0 a 99 se ejecuta antes aunque su nice sea -20.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-alta { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-cero { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-baja { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 8 5; }
      .range { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .range-slate { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #334155; }
      .zone-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .zone-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .badge-root { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-root-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.04em; text-anchor: middle; }
      .badge-user { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .badge-user-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.04em; text-anchor: middle; }
      .badge-neutral { fill: #E2E8F0; stroke: #475569; stroke-width: 1.5; }
      .badge-neutral-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.04em; text-anchor: middle; }
      .seg-alta { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .seg-cero { fill: #E2E8F0; stroke: #475569; stroke-width: 2; }
      .seg-baja { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 2; }
      .tick { stroke: #475569; stroke-width: 1.5; }
      .tick-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .axis-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ESCALA DE NICENESS · DE -20 A +19</text>
    <text class="title" x="40" y="78">Nice alto, prioridad baja</text>
    <text class="subtitle" x="40" y="102">El número menor gana la CPU;</text>
    <text class="subtitle" x="40" y="122">el mayor cede el turno.</text>
  </g>

  <g id="diagram-groups">
    <rect class="seg-alta" x="60" y="330" width="420" height="30" rx="4"/>
    <rect class="seg-cero" x="480" y="330" width="21" height="30" rx="2"/>
    <rect class="seg-baja" x="501" y="330" width="399" height="30" rx="4"/>
    <line class="tick" x1="70" y1="360" x2="70" y2="368"/>
    <line class="tick" x1="280" y1="360" x2="280" y2="368"/>
    <line class="tick" x1="490" y1="360" x2="490" y2="368"/>
    <line class="tick" x1="700" y1="360" x2="700" y2="368"/>
    <line class="tick" x1="889" y1="360" x2="889" y2="368"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-alta">
      <rect class="card-alta" x="40" y="140" width="296" height="150" rx="10"/>
      <text class="range" x="64" y="172">-20 a -1</text>
      <text class="zone-title" x="64" y="202">ALTA PRIORIDAD</text>
      <text class="zone-body" x="64" y="230">Menos amable (egoísta):</text>
      <text class="zone-body" x="64" y="252">exige la máxima cuota.</text>
      <rect class="badge-root" x="64" y="258" width="112" height="24" rx="6"/>
      <text class="badge-root-text" x="120" y="275">SOLO ROOT</text>
    </g>

    <g id="node-cero">
      <rect class="card-cero" x="352" y="140" width="256" height="150" rx="10"/>
      <text class="range-slate" x="376" y="172">0</text>
      <text class="zone-title" x="376" y="202">POR DEFECTO</text>
      <text class="zone-body" x="376" y="230">Todo proceso ordinario</text>
      <text class="zone-body" x="376" y="252">nace en 0.</text>
      <rect class="badge-neutral" x="376" y="258" width="160" height="24" rx="6"/>
      <text class="badge-neutral-text" x="456" y="275">EQUILIBRIO NORMAL</text>
    </g>

    <g id="node-baja">
      <rect class="card-baja" x="624" y="140" width="296" height="150" rx="10"/>
      <text class="range" x="648" y="172">+1 a +19</text>
      <text class="zone-title" x="648" y="202">BAJA PRIORIDAD</text>
      <text class="zone-body" x="648" y="230">Más amable (generoso):</text>
      <text class="zone-body" x="648" y="252">cede CPU voluntariamente.</text>
      <rect class="badge-user" x="648" y="258" width="180" height="24" rx="6"/>
      <text class="badge-user-text" x="738" y="275">CUALQUIER USUARIO</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="tick-label" x="70" y="384">-20</text>
    <text class="tick-label" x="280" y="384">-10</text>
    <text class="tick-label" x="490" y="384">0</text>
    <text class="tick-label" x="700" y="384">+10</text>
    <text class="tick-label" x="889" y="384">+19</text>
    <text class="axis-note" x="270" y="412">acapara la CPU</text>
    <text class="axis-note" x="700" y="412">cede la CPU</text>

    <g id="node-aviso">
      <rect class="warn" x="40" y="424" width="880" height="80" rx="10"/>
      <text class="warn-title" x="64" y="452">-20 no es tiempo real: es el tope normal</text>
      <text class="warn-body" x="64" y="476">Un proceso de tiempo real (prioridad 0-99) se ejecuta antes</text>
      <text class="warn-body" x="64" y="498">aunque su NI sea -20.</text>
    </g>
  </g>
</svg>
