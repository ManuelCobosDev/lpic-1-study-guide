<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dirs-title dirs-desc">
  <title id="dirs-title">Directorios críticos de Debian: fuentes, caché y estado de los paquetes (LPIC-1 102.4)</title>
  <desc id="dirs-desc">Las fuentes de APT viven en /etc/apt/: sources.list para los repositorios principales y sources.list.d/ para los ficheros .list de terceros. La caché de descargas está en /var/cache/apt/archives/, con archives/partial/ para las descargas interrumpidas, y se vacía con apt-get clean. El estado está en /var/lib/: dpkg/status guarda el estado de cada paquete, dpkg/info/ los scripts y listas .list, y apt/lists/ los índices descargados por apt-get update.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .root { fill: #1E293B; stroke: #0F172A; stroke-width: 2; }
      .root-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; }
      .card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-head { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .file-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
      .note-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #881337; }
    </style>

    <marker id="dirs-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">DEBIAN · DÓNDE VIVE CADA COSA</text>
    <text class="title" x="40" y="78">Tres zonas, tres preguntas de examen</text>
    <text class="subtitle" x="40" y="102">Fuentes, caché y estado: rutas de examen.</text>
  </g>

  <g id="diagram-relations">
    <path id="dirs-rel-root-etc" class="edge-slate"
          data-from="node-raiz" data-to="node-etc" data-relation="contiene-fuentes"
          d="M 480 184 V 216 H 170 V 248" marker-end="url(#dirs-arrow-slate)"/>

    <path id="dirs-rel-root-cache" class="edge-slate"
          data-from="node-raiz" data-to="node-cache" data-relation="contiene-cache"
          d="M 480 184 V 248" marker-end="url(#dirs-arrow-slate)"/>

    <path id="dirs-rel-root-lib" class="edge-slate"
          data-from="node-raiz" data-to="node-lib" data-relation="contiene-estado"
          d="M 480 184 V 216 H 790 V 248" marker-end="url(#dirs-arrow-slate)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-raiz">
      <rect class="root" x="320" y="120" width="320" height="64" rx="10"/>
      <text class="root-text" x="480" y="158">Sistema de ficheros</text>
    </g>

    <g id="node-etc">
      <rect class="card" x="40" y="248" width="260" height="190" rx="10"/>
      <text class="card-head" x="64" y="282">/etc/apt/</text>
      <line class="divider" x1="64" y1="294" x2="276" y2="294"/>
      <text class="file" x="64" y="312">sources.list</text>
      <text class="file-desc" x="64" y="332">lista principal (deb y deb-src)</text>
      <text class="file" x="64" y="360">sources.list.d/*.list</text>
      <text class="file-desc" x="64" y="380">terceros: Docker, Chrome, Nginx</text>
      <text class="file-desc" x="64" y="408">sin editar el archivo maestro</text>
    </g>

    <g id="node-cache">
      <rect class="card" x="350" y="248" width="260" height="190" rx="10"/>
      <text class="card-head" x="374" y="282">/var/cache/apt/</text>
      <line class="divider" x1="374" y1="294" x2="586" y2="294"/>
      <text class="file" x="374" y="312">archives/</text>
      <text class="file-desc" x="374" y="332">los .deb descargados</text>
      <text class="file" x="374" y="360">archives/partial/</text>
      <text class="file-desc" x="374" y="380">descargas a medias (corte de red)</text>
      <text class="file-desc" x="374" y="408">apt-get clean vacía la caché</text>
    </g>

    <g id="node-lib">
      <rect class="card" x="660" y="248" width="260" height="190" rx="10"/>
      <text class="card-head" x="684" y="282">/var/lib/</text>
      <line class="divider" x1="684" y1="294" x2="896" y2="294"/>
      <text class="file" x="684" y="312">dpkg/status</text>
      <text class="file-desc" x="684" y="332">estados ii, rc y un</text>
      <text class="file" x="684" y="360">dpkg/info/</text>
      <text class="file-desc" x="684" y="380">.list, .postinst, .prerm</text>
      <text class="file" x="684" y="408">apt/lists/</text>
      <text class="file-desc" x="684" y="428">índices tras apt-get update</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note-warn" x="40" y="474">Si /var se llena al 100 %,</text>
    <text class="note-warn" x="40" y="498">la primera medida es apt-get clean.</text>
  </g>
</svg>
