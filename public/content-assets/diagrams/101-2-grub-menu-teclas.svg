<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="grub-menu-title grub-menu-desc">
  <title id="grub-menu-title">Interacción con el menú de GRUB 2: teclas e, c y Ctrl+X o F10 (LPIC-1 101.2)</title>
  <desc id="grub-menu-desc">Con el menú de GRUB 2 en pantalla, la tecla e abre el editor de la entrada seleccionada y permite cambiar parámetros del kernel solo para ese arranque; Ctrl+X o F10 arranca el sistema con esos cambios, que se descartan al reiniciar. La tecla c abre la consola grub&gt; para inspeccionar discos con ls o cargar un kernel a mano cuando la configuración falla. Si el menú está oculto porque el timeout es 0, se muestra manteniendo pulsado Shift en BIOS o pulsando Esc en UEFI.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .menu { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .menu-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .menu-item { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .menu-sel { fill: #EFF4FF; stroke: #2550EB; stroke-width: 1.5; }
      .menu-item-sel { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .menu-foot { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #64748B; }
      .card-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-console { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .card-boot { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .key { fill: #FFFFFF; stroke: #475569; stroke-width: 1.5; }
      .key-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .hidden-band { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .hidden-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .hidden-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #881337; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
    </style>

    <marker id="gmenu-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="gmenu-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">GRUB 2 · TECLAS DEL MENÚ</text>
    <text class="title" x="40" y="78">Tres teclas abren tres caminos</text>
    <text class="subtitle" x="40" y="102">Del menú a la edición temporal, al arranque o al rescate.</text>
  </g>

  <g id="diagram-relations">
    <path id="gmenu-rel-edit" class="edge" data-from="node-menu" data-to="node-edit" data-relation="key-e-opens-editor"
          d="M 380 168 H 420" marker-end="url(#gmenu-arrow-blue)"/>
    <path id="gmenu-rel-console" class="edge-slate" data-from="node-menu" data-to="node-console" data-relation="key-c-opens-console"
          d="M 380 300 H 400 V 384 H 420" marker-end="url(#gmenu-arrow-slate)"/>
    <path id="gmenu-rel-boot" class="edge" data-from="node-edit" data-to="node-boot" data-relation="ctrl-x-boots"
          d="M 670 212 V 232" marker-end="url(#gmenu-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-menu">
      <rect class="menu" x="40" y="124" width="340" height="240" rx="10"/>
      <text class="menu-head" x="64" y="152">Menú de GRUB 2</text>
      <line class="divider" x1="64" y1="164" x2="356" y2="164"/>

      <rect class="menu-sel" x="56" y="176" width="308" height="30" rx="6"/>
      <text class="menu-item-sel" x="68" y="196">Debian GNU/Linux</text>

      <text class="menu-item" x="68" y="228">Debian (recovery mode)</text>
      <text class="menu-item" x="68" y="258">Prueba de memoria</text>

      <text class="menu-foot" x="64" y="300">timeout 5 s: arranca la primera entrada</text>
      <text class="menu-foot" x="64" y="322">timeout 0: el menú queda oculto</text>
    </g>

    <g id="node-edit">
      <rect class="card-cmd" x="420" y="124" width="500" height="88" rx="10"/>
      <rect class="key" x="436" y="138" width="32" height="30" rx="5"/>
      <text class="key-text" x="452" y="158">e</text>
      <text class="card-title" x="484" y="160">Editar la entrada seleccionada</text>
      <text class="card-text" x="440" y="188">Cambia parámetros del kernel solo para este arranque.</text>
    </g>

    <g id="node-boot">
      <rect class="card-boot" x="420" y="232" width="500" height="88" rx="10"/>
      <rect class="key" x="436" y="246" width="72" height="30" rx="5"/>
      <text class="key-text" x="472" y="266">Ctrl+X</text>
      <rect class="key" x="516" y="246" width="52" height="30" rx="5"/>
      <text class="key-text" x="542" y="266">F10</text>
      <text class="card-title" x="586" y="268">Arrancar con los cambios</text>
      <text class="card-text" x="440" y="296">Al reiniciar, la edición se descarta por completo.</text>
    </g>

    <g id="node-console">
      <rect class="card-console" x="420" y="340" width="500" height="88" rx="10"/>
      <rect class="key" x="436" y="354" width="32" height="30" rx="5"/>
      <text class="key-text" x="452" y="374">c</text>
      <text class="card-title" x="484" y="376">Consola de rescate grub&gt;</text>
      <text class="card-text" x="440" y="404">ls para ver discos y cargar el kernel a mano.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <g id="node-menu-oculto">
      <rect class="hidden-band" x="40" y="448" width="880" height="52" rx="10"/>
      <text class="hidden-title" x="64" y="470">MENÚ OCULTO</text>
      <text class="hidden-text" x="64" y="492">Shift en BIOS; Esc en UEFI. Con timeout 0 no hay otra forma de verlo.</text>
    </g>
  </g>
</svg>
