<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="grec-title grec-desc">
  <title id="grec-title">Secuencia de arranque manual desde la consola grub&gt; (LPIC-1 102.2)</title>
  <desc id="grec-desc">Cuando GRUB no encuentra grub.cfg aparece el prompt grub&gt; y hay que arrancar a mano en cuatro pasos ordenados: set root fija la partición donde están el kernel y /boot, linux copia el kernel a la RAM y recibe el parámetro root=, initrd copia a la RAM los drivers necesarios para montar el disco y boot cede el procesador al kernel. Antes conviene listar con ls los discos y particiones que GRUB reconoce.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-note { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .spine { stroke: #1D40D8; stroke-width: 2; opacity: 0.35; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · CONSOLA grub&gt;</text>
    <text class="title" x="40" y="78">Arrancar a mano en cuatro pasos</text>
    <text class="subtitle" x="40" y="102">GRUB está vivo, pero no encuentra grub.cfg.</text>
  </g>

  <g id="diagram-relations">
    <line id="grec-spine-1" class="spine" x1="44" y1="177" x2="44" y2="223"/>
    <line id="grec-spine-2" class="spine" x1="44" y1="253" x2="44" y2="299"/>
    <line id="grec-spine-3" class="spine" x1="44" y1="329" x2="44" y2="375"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-set-root">
      <rect class="node-cmd" x="72" y="132" width="428" height="60" rx="10"/>
      <text class="cmd" x="96" y="168">set root=(hd0,gpt2)</text>
    </g>
    <g id="node-linux">
      <rect class="node-cmd" x="72" y="208" width="428" height="60" rx="10"/>
      <text class="cmd" x="96" y="244">linux /boot/vmlinuz-6.1 root=/dev/sda2 ro</text>
    </g>
    <g id="node-initrd">
      <rect class="node-cmd" x="72" y="284" width="428" height="60" rx="10"/>
      <text class="cmd" x="96" y="320">initrd /boot/initrd.img-6.1</text>
    </g>
    <g id="node-boot">
      <rect class="node-cmd" x="72" y="360" width="428" height="60" rx="10"/>
      <text class="cmd" x="96" y="396">boot</text>
    </g>

    <g id="node-band-ls">
      <rect class="node-note" x="40" y="444" width="880" height="60" rx="10"/>
      <text class="band-mono" x="64" y="470">Paso previo: grub&gt; ls  →  (hd0)  (hd0,gpt1)  (hd0,gpt2)</text>
      <text class="band-text" x="64" y="492">Lista los discos y particiones que GRUB reconoce antes de fijar root.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="44" cy="162" r="15"/>
    <text class="badge-num" x="44" y="167">1</text>
    <text class="note" x="540" y="158">Indica a GRUB en qué partición</text>
    <text class="note" x="540" y="180">están /boot y el kernel.</text>

    <circle class="badge" cx="44" cy="238" r="15"/>
    <text class="badge-num" x="44" y="243">2</text>
    <text class="note" x="540" y="234">Copia el kernel a la RAM y le</text>
    <text class="note" x="540" y="256">pasa el parámetro root=.</text>

    <circle class="badge" cx="44" cy="314" r="15"/>
    <text class="badge-num" x="44" y="319">3</text>
    <text class="note" x="540" y="310">Copia a la RAM los drivers</text>
    <text class="note" x="540" y="332">necesarios para montar el disco.</text>

    <circle class="badge" cx="44" cy="390" r="15"/>
    <text class="badge-num" x="44" y="395">4</text>
    <text class="note" x="540" y="386">Cede el procesador al kernel;</text>
    <text class="note" x="540" y="408">Linux inicia el arranque.</text>
  </g>
</svg>
