<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pscols-title pscols-desc">
  <title id="pscols-title">Cabeceras de ps aux (BSD) frente a ps -ef (Unix): columnas y letras de opción (LPIC-1 103.5)</title>
  <desc id="pscols-desc">Las dos escuelas de ps imprimen cabeceras distintas. ps aux, de estilo BSD y escrito sin guión, muestra USER, PID, %CPU, %MEM, VSZ, RSS, STAT y COMMAND: la a lista los procesos con terminal, la u añade el formato de usuario con recursos y la x incluye los demonios sin terminal. ps -ef, escrito con guión, muestra UID, PID, PPID, STIME, TIME y CMD: la e lista todos los procesos y la f usa formato completo con la columna PPID, que permite rastrear el proceso padre.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .label-box { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .label-box-alt { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .label-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .label-mono-alt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .label-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .strip { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .tint { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.5; }
      .cell-div { stroke: #CBD5E1; stroke-width: 1; }
      .field { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .node-note { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PS · DOS ESCUELAS, DOS CABECERAS</text>
    <text class="title" x="40" y="78">Las columnas delatan el estilo</text>
    <text class="subtitle" x="40" y="102">Recursos con ps aux, genealogía con ps -ef.</text>
  </g>

  <g id="diagram-groups">
    <rect class="strip" x="200" y="132" width="720" height="60" rx="6"/>
    <rect class="tint" x="380" y="132" width="360" height="60"/>
    <line class="cell-div" x1="290" y1="134" x2="290" y2="190"/>
    <line class="cell-div" x1="380" y1="134" x2="380" y2="190"/>
    <line class="cell-div" x1="470" y1="134" x2="470" y2="190"/>
    <line class="cell-div" x1="560" y1="134" x2="560" y2="190"/>
    <line class="cell-div" x1="650" y1="134" x2="650" y2="190"/>
    <line class="cell-div" x1="740" y1="134" x2="740" y2="190"/>
    <line class="cell-div" x1="830" y1="134" x2="830" y2="190"/>

    <rect class="strip" x="200" y="300" width="720" height="60" rx="6"/>
    <rect class="tint" x="440" y="300" width="120" height="60"/>
    <line class="cell-div" x1="320" y1="302" x2="320" y2="358"/>
    <line class="cell-div" x1="440" y1="302" x2="440" y2="358"/>
    <line class="cell-div" x1="560" y1="302" x2="560" y2="358"/>
    <line class="cell-div" x1="680" y1="302" x2="680" y2="358"/>
    <line class="cell-div" x1="800" y1="302" x2="800" y2="358"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-ps-aux">
      <rect class="label-box" x="40" y="132" width="150" height="60" rx="8"/>
      <text class="label-mono" x="60" y="158">ps aux</text>
      <text class="label-sub" x="60" y="180">BSD sin guión</text>
    </g>

    <g id="node-ps-ef">
      <rect class="label-box-alt" x="40" y="300" width="150" height="60" rx="8"/>
      <text class="label-mono-alt" x="60" y="326">ps -ef</text>
      <text class="label-sub" x="60" y="348">Unix con guión</text>
    </g>

    <g id="node-nota">
      <rect class="node-note" x="40" y="452" width="880" height="60" rx="10"/>
      <text class="note" x="62" y="476">VSZ es memoria virtual reservada; RSS es la RAM física que ocupa.</text>
      <text class="note" x="62" y="500">ps -o elige columnas y ps --sort=-%cpu ordena por consumo.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="field" x="245" y="168">USER</text>
    <text class="field" x="335" y="168">PID</text>
    <text class="field" x="425" y="168">%CPU</text>
    <text class="field" x="515" y="168">%MEM</text>
    <text class="field" x="605" y="168">VSZ</text>
    <text class="field" x="695" y="168">RSS</text>
    <text class="field" x="785" y="168">STAT</text>
    <text class="field" x="875" y="168">COMMAND</text>

    <text class="field" x="260" y="336">UID</text>
    <text class="field" x="380" y="336">PID</text>
    <text class="field" x="500" y="336">PPID</text>
    <text class="field" x="620" y="336">STIME</text>
    <text class="field" x="740" y="336">TIME</text>
    <text class="field" x="860" y="336">CMD</text>

    <text class="note" x="200" y="216">a: todos los procesos con terminal (tty)</text>
    <text class="note" x="200" y="238">u: formato de usuario con %CPU, %MEM, VSZ y RSS</text>
    <text class="note" x="200" y="260">x: también los demonios sin terminal</text>

    <text class="note" x="200" y="384">-e: todos los procesos del sistema (every)</text>
    <text class="note" x="200" y="406">-f: formato completo con UID, PID, PPID y STIME</text>
    <text class="note" x="200" y="428">PPID permite rastrear al proceso padre</text>
  </g>
</svg>
