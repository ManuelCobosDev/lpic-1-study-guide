<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rutas-title rutas-desc">
  <title id="rutas-title">Rutas FHS de librerías compartidas y modelos bi-arch y multiarch (LPIC-1 102.3)</title>
  <desc id="rutas-desc">El FHS ordena las librerías en tres niveles: /lib guarda las imprescindibles para el arranque temprano y para los binarios de /bin y /sbin antes de montar /usr, /usr/lib las de las aplicaciones instaladas por el gestor de paquetes y /usr/local/lib el software compilado a mano con make install, que el gestor de paquetes no toca. Para convivir con dos arquitecturas, RHEL, CentOS, Fedora y openSUSE usan el sufijo 64 y reservan /lib y /usr/lib para 32 bits, mientras Debian y Ubuntu usan tripletas bajo /usr/lib, como x86_64-linux-gnu e i386-linux-gnu. El enlazador dinámico consulta /lib y /usr/lib siempre por defecto, sin necesidad de estar en /etc/ld.so.conf.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .layer { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .layer-hi { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .layer-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .layer-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .panel { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .panel-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .panel-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.04em; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">RUTAS DE LIBRERÍAS · FHS Y MULTIARCH</text>
    <text class="title" x="40" y="78">Tres rutas FHS y dos modelos de arquitectura</text>
    <text class="subtitle" x="40" y="102">Por defecto el enlazador solo consulta /lib y /usr/lib</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-ruta-lib">
      <rect class="layer" x="40" y="140" width="500" height="104" rx="10"/>
      <text class="layer-name" x="64" y="174">/lib</text>
      <text class="layer-text" x="64" y="202">Sistema base: arranque temprano y binarios</text>
      <text class="layer-text" x="64" y="226">de /bin y /sbin, antes de montar /usr.</text>
    </g>

    <g id="node-ruta-usr-lib">
      <rect class="layer" x="40" y="252" width="500" height="104" rx="10"/>
      <text class="layer-name" x="64" y="286">/usr/lib</text>
      <text class="layer-text" x="64" y="314">Distribución: aplicaciones y servicios del</text>
      <text class="layer-text" x="64" y="338">gestor de paquetes (apt, dnf, pacman).</text>
    </g>

    <g id="node-ruta-local-lib">
      <rect class="layer-hi" x="40" y="364" width="500" height="104" rx="10"/>
      <text class="layer-name" x="64" y="398">/usr/local/lib</text>
      <text class="layer-text" x="64" y="426">Local: compilado e instalado a mano con</text>
      <text class="layer-text" x="64" y="450">make install; el gestor no lo toca.</text>
    </g>

    <g id="node-biarch">
      <rect class="panel" x="580" y="140" width="340" height="166" rx="10"/>
      <text class="panel-head" x="604" y="168">BI-ARCH · RHEL / CENTOS</text>
      <line class="divider" x1="604" y1="180" x2="896" y2="180"/>
      <text class="panel-mono" x="604" y="206">/lib64 y /usr/lib64</text>
      <text class="panel-text" x="604" y="232">Rutas para las librerías de 64 bits.</text>
      <text class="panel-text" x="604" y="258">/lib y /usr/lib quedan para 32 bits.</text>
      <text class="tag" x="604" y="284">EL SUFIJO 64 VA EN LA RUTA</text>
    </g>

    <g id="node-multiarch">
      <rect class="panel" x="580" y="322" width="340" height="166" rx="10"/>
      <text class="panel-head" x="604" y="350">MULTIARCH · DEBIAN / UBUNTU</text>
      <line class="divider" x1="604" y1="362" x2="896" y2="362"/>
      <text class="panel-mono" x="604" y="388">x86_64-linux-gnu/</text>
      <text class="panel-text" x="604" y="412">Tripletas bajo /usr/lib: 64 bits nativo.</text>
      <text class="panel-mono" x="604" y="438">i386-linux-gnu/</text>
      <text class="panel-text" x="604" y="462">32 bits; conviven sin colisionar.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="panel-text" x="40" y="500">Ambos modelos instalan 32 y 64 bits a la vez.</text>
  </g>
</svg>
