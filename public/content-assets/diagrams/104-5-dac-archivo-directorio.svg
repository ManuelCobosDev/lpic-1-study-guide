<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dac-title dac-desc">
  <title id="dac-title">Permisos DAC: el mismo bit sobre un archivo y sobre un directorio (LPIC-1 104.5)</title>
  <desc id="dac-desc">Comparativa del modelo DAC en dos paneles. Sobre un archivo, r permite leer su contenido con cat o less, w modificarlo o truncarlo y x ejecutarlo como binario o script. Sobre un directorio, r solo lista los nombres con ls, w permite crear, borrar o renombrar entradas y x permite atravesarlo con cd y llegar a sus inodos. Una banda de alerta recuerda la trampa de examen: borrar un archivo depende del permiso w del directorio padre, no de los permisos del propio archivo, y w sin x no basta para crear ni borrar.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-dir { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .panel-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .perm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; }
      .perm-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .band-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .badge-warn { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; text-anchor: middle; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">MODELO DAC · ARCHIVO Y DIRECTORIO</text>
    <text class="title" x="40" y="78">El mismo bit, dos efectos distintos</text>
    <text class="subtitle" x="40" y="102">El significado de r, w y x cambia según el objeto</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-archivo">
      <rect class="panel-file" x="40" y="134" width="420" height="214" rx="10"/>
      <text class="panel-head" x="64" y="164">ARCHIVO ORDINARIO</text>
      <text class="panel-sub" x="64" y="186">contenido de datos</text>
      <line class="divider" x1="64" y1="200" x2="436" y2="200"/>
      <text class="perm" x="64" y="232">r</text>
      <text class="perm-desc" x="100" y="232">leer el contenido (cat, less)</text>
      <line class="divider" x1="64" y1="252" x2="436" y2="252"/>
      <text class="perm" x="64" y="272">w</text>
      <text class="perm-desc" x="100" y="272">modificar, sobrescribir o truncar</text>
      <line class="divider" x1="64" y1="292" x2="436" y2="292"/>
      <text class="perm" x="64" y="312">x</text>
      <text class="perm-desc" x="100" y="312">ejecutar el binario o script bash</text>
    </g>

    <g id="node-panel-directorio">
      <rect class="panel-dir" x="500" y="134" width="420" height="214" rx="10"/>
      <text class="panel-head" x="524" y="164">DIRECTORIO</text>
      <text class="panel-sub" x="524" y="186">nombres e inodos</text>
      <line class="divider" x1="524" y1="200" x2="896" y2="200"/>
      <text class="perm" x="524" y="232">r</text>
      <text class="perm-desc" x="560" y="232">listar los nombres (ls)</text>
      <line class="divider" x1="524" y1="252" x2="896" y2="252"/>
      <text class="perm" x="524" y="272">w</text>
      <text class="perm-desc" x="560" y="272">crear, borrar o renombrar dentro</text>
      <line class="divider" x1="524" y1="292" x2="896" y2="292"/>
      <text class="perm" x="524" y="312">x</text>
      <text class="perm-desc" x="560" y="312">entrar con cd y ver sus inodos</text>
    </g>

    <g id="node-trampa">
      <rect class="band-warn" x="40" y="372" width="880" height="128" rx="10"/>
      <rect class="badge-warn" x="64" y="392" width="92" height="24" rx="6"/>
      <text class="badge-text" x="110" y="409">TRAMPA</text>
      <text class="warn-title" x="176" y="411">Borrar depende del directorio padre</text>
      <text class="warn-body" x="64" y="446">Un archivo con 0000 se borra si el directorio padre concede w.</text>
      <text class="warn-body" x="64" y="472">Con w solo no basta: también hace falta x para crear, borrar o renombrar.</text>
    </g>
  </g>
</svg>
