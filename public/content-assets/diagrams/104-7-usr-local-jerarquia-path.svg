<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="usrlocal-title usrlocal-desc">
  <title id="usrlocal-title">Jerarquía de /usr/local y prioridad de /usr/local/bin en la variable PATH (LPIC-1 104.7)</title>
  <desc id="usrlocal-desc">El estándar FHS reserva /usr/local para el software que compila e instala el administrador, con un árbol propio en miniatura: /usr/local/bin para los ejecutables, /usr/local/etc para su configuración, /usr/local/lib para sus bibliotecas y /usr/local/share/man para sus páginas de manual. En la variable PATH, /usr/local/bin aparece antes que /usr/bin, de modo que la primera coincidencia es la versión compilada por el administrador y no la del paquete de la distribución.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .root-box { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2.5; }
      .child-box { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .path-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .root-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; }
      .root-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .child-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .child-role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .path-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .path-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="usrlocal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">FHS · EL ÁRBOL DE /usr/local</text>
    <text class="title" x="40" y="78">El feudo del administrador local</text>
    <text class="subtitle" x="40" y="102">El FHS lo reserva al software compilado a mano</text>
    <text class="subtitle" x="40" y="124">y lo aísla del gestor de paquetes.</text>
  </g>

  <g id="diagram-relations">
    <path id="usrlocal-rel-bin" class="edge-blue" data-from="node-usr-local" data-to="node-local-bin" data-relation="contains"
          d="M 280 296 H 305 V 182 H 330" marker-end="url(#usrlocal-arrow)"/>
    <path id="usrlocal-rel-etc" class="edge-blue" data-from="node-usr-local" data-to="node-local-etc" data-relation="contains"
          d="M 280 296 H 305 V 258 H 330" marker-end="url(#usrlocal-arrow)"/>
    <path id="usrlocal-rel-lib" class="edge-blue" data-from="node-usr-local" data-to="node-local-lib" data-relation="contains"
          d="M 280 296 H 305 V 334 H 330" marker-end="url(#usrlocal-arrow)"/>
    <path id="usrlocal-rel-man" class="edge-blue" data-from="node-usr-local" data-to="node-local-man" data-relation="contains"
          d="M 280 296 H 305 V 410 H 330" marker-end="url(#usrlocal-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-usr-local">
      <rect class="root-box" x="40" y="222" width="240" height="148" rx="10"/>
      <text class="root-name" x="64" y="260">/usr/local</text>
      <text class="root-sub" x="64" y="292">software compilado</text>
      <text class="root-sub" x="64" y="314">a mano por el administrador</text>
    </g>

    <g id="node-local-bin">
      <rect class="child-box" x="330" y="150" width="590" height="64" rx="10"/>
      <text class="child-name" x="354" y="182">/usr/local/bin</text>
      <text class="child-role" x="354" y="202">Ejecutables compilados a mano con make install</text>
    </g>

    <g id="node-local-etc">
      <rect class="child-box" x="330" y="226" width="590" height="64" rx="10"/>
      <text class="child-name" x="354" y="258">/usr/local/etc</text>
      <text class="child-role" x="354" y="278">Configuración propia de ese software</text>
    </g>

    <g id="node-local-lib">
      <rect class="child-box" x="330" y="302" width="590" height="64" rx="10"/>
      <text class="child-name" x="354" y="334">/usr/local/lib</text>
      <text class="child-role" x="354" y="354">Bibliotecas que necesita el programa</text>
    </g>

    <g id="node-local-man">
      <rect class="child-box" x="330" y="378" width="590" height="64" rx="10"/>
      <text class="child-name" x="354" y="410">/usr/local/share/man</text>
      <text class="child-role" x="354" y="430">Sus páginas de manual</text>
    </g>

    <g id="node-path">
      <rect class="path-band" x="40" y="456" width="880" height="56" rx="10"/>
      <text class="path-mono" x="64" y="478">PATH=/usr/local/bin:/usr/bin:/bin</text>
      <text class="path-note" x="64" y="500">La primera coincidencia gana: se ejecuta la versión del administrador.</text>
    </g>
  </g>
</svg>
