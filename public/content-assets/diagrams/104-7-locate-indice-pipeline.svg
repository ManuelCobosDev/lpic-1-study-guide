<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="locate-title locate-desc">
  <title id="locate-title">locate consulta la base de datos que construye updatedb en /var/lib/mlocate/mlocate.db (LPIC-1 104.7)</title>
  <desc id="locate-desc">updatedb recorre el sistema de archivos y escribe el índice en /var/lib/mlocate/mlocate.db; locate solo consulta ese archivo, por eso responde en milisegundos y con cero carga de entrada y salida en disco. El resultado tiene la antigüedad del último updatedb: un archivo creado después no aparece hasta la siguiente ejecución, mientras que find recorre el disco en vivo y sí lo encuentra. El patrón encaja en cualquier parte de la ruta completa y con -b solo en el nombre final del archivo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-db { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .cmd-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .db-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .warn-band { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #881337; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="locate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LOCATE · BÚSQUEDA INDEXADA</text>
    <text class="title" x="40" y="78">locate lee un índice, no el disco</text>
    <text class="subtitle" x="40" y="102">updatedb construye la base de datos y locate la consulta.</text>
    <text class="subtitle" x="40" y="124">Sin recorrer el disco en cada búsqueda.</text>
  </g>

  <g id="diagram-relations">
    <path id="locate-rel-updatedb-db" class="edge-blue" data-from="node-updatedb" data-to="node-mlocate-db" data-relation="writes-index"
          d="M 240 212 H 292" marker-end="url(#locate-arrow)"/>
    <path id="locate-rel-db-locate" class="edge-blue" data-from="node-mlocate-db" data-to="node-locate" data-relation="reads-index"
          d="M 592 212 H 644" marker-end="url(#locate-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-updatedb">
      <rect class="node-cmd" x="40" y="156" width="200" height="112" rx="10"/>
      <text class="cmd-name" x="62" y="196">updatedb</text>
      <text class="node-sub" x="62" y="222">recorre el disco</text>
      <text class="node-sub" x="62" y="242">y escribe el índice</text>
    </g>

    <g id="node-mlocate-db">
      <rect class="node-db" x="292" y="156" width="300" height="112" rx="10"/>
      <text class="db-name" x="314" y="196">/var/lib/mlocate/mlocate.db</text>
      <text class="node-sub" x="314" y="222">base de datos del índice</text>
      <text class="node-sub" x="314" y="242">nombre y ruta de cada archivo</text>
    </g>

    <g id="node-locate">
      <rect class="node-cmd" x="644" y="156" width="276" height="112" rx="10"/>
      <text class="cmd-name" x="666" y="196">locate &lt;patrón&gt;</text>
      <text class="node-sub" x="666" y="222">consulta el índice</text>
      <text class="node-sub" x="666" y="242">sin abrir el disco</text>
    </g>

    <g id="node-retraso">
      <rect class="warn-band" x="40" y="352" width="880" height="112" rx="10"/>
      <text class="warn-title" x="64" y="384">El índice va con retraso</text>
      <text class="warn-body" x="64" y="412">locate no ve nada creado después del último updatedb.</text>
      <text class="warn-body" x="64" y="436">find recorre el disco en vivo y sí lo encuentra.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="300">Responde en milisegundos, con cero carga de entrada y salida.</text>
    <text class="note" x="40" y="322">El resultado tiene la antigüedad del último updatedb.</text>
    <text class="note" x="40" y="490">El patrón encaja en cualquier parte de la ruta completa;</text>
    <text class="note" x="40" y="512">con -b, solo en el nombre final del archivo.</text>
  </g>
</svg>
