<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-tools-title p1031-tools-desc">
  <title id="p1031-tools-title">Matriz de type, which, whereis, hash y help (LPIC-1 103.1)</title>
  <desc id="p1031-tools-desc">Matriz que cruza cinco herramientas de clasificación con cuatro capacidades. type reconoce builtins, alias y binarios en PATH e informa si el comando está en la caché. which solo encuentra binarios en PATH y falla con los builtins como cd. whereis localiza el binario, las fuentes y la página man fuera de PATH. hash muestra la caché de rutas en RAM y solo conoce lo ya ejecutado. help documenta únicamente los builtins de Bash.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .head-row { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; }
      .head-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .tool { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .tool-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; }
      .cell-yes { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1; }
      .cell-no { fill: #FFF1F2; stroke: #FECDD3; stroke-width: 1; }
      .cell-part { fill: #FFFBEB; stroke: #FDE68A; stroke-width: 1; }
      .val-yes { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #047857; text-anchor: middle; }
      .val-no { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #BE123C; text-anchor: middle; }
      .val-part { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #B45309; text-anchor: middle; }
      .divider { stroke: #E2E8F0; stroke-width: 1.5; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">TYPE · WHICH · WHEREIS · HASH · HELP</text>
    <text class="title" x="40" y="78">Qué ve cada herramienta de clasificación</text>
    <text class="subtitle" x="40" y="102">Cinco órdenes responden a preguntas distintas</text>
    <text class="subtitle" x="40" y="122">sobre una misma orden: no son intercambiables.</text>
  </g>

  <g id="diagram-nodes">
    <g id="matrix-head">
      <rect class="head-row" x="40" y="150" width="880" height="40" rx="6"/>
      <text class="head-text" x="345" y="175">builtin / alias</text>
      <text class="head-text" x="525" y="175">binario en disco</text>
      <text class="head-text" x="705" y="175">página man</text>
      <text class="head-text" x="860" y="175">caché RAM</text>
    </g>

    <g id="row-type">
      <text class="tool" x="40" y="213">type</text>
      <text class="tool-sub" x="40" y="231">clasifica la orden</text>
      <g id="cell-type-builtin"><rect class="cell-yes" x="263" y="193" width="164" height="44" rx="5"/><text class="val-yes" x="345" y="220">sí</text></g>
      <g id="cell-type-path"><rect class="cell-yes" x="443" y="193" width="164" height="44" rx="5"/><text class="val-yes" x="525" y="220">sí</text></g>
      <g id="cell-type-man"><rect class="cell-no" x="623" y="193" width="164" height="44" rx="5"/><text class="val-no" x="705" y="220">no</text></g>
      <g id="cell-type-hash"><rect class="cell-part" x="803" y="193" width="114" height="44" rx="5"/><text class="val-part" x="860" y="220">informa</text></g>
    </g>

    <g id="row-which">
      <text class="tool" x="40" y="263">which</text>
      <text class="tool-sub" x="40" y="281">ruta en $PATH</text>
      <g id="cell-which-builtin"><rect class="cell-no" x="263" y="243" width="164" height="44" rx="5"/><text class="val-no" x="345" y="270">no</text></g>
      <g id="cell-which-path"><rect class="cell-yes" x="443" y="243" width="164" height="44" rx="5"/><text class="val-yes" x="525" y="270">sí</text></g>
      <g id="cell-which-man"><rect class="cell-no" x="623" y="243" width="164" height="44" rx="5"/><text class="val-no" x="705" y="270">no</text></g>
      <g id="cell-which-hash"><rect class="cell-no" x="803" y="243" width="114" height="44" rx="5"/><text class="val-no" x="860" y="270">no</text></g>
    </g>

    <g id="row-whereis">
      <text class="tool" x="40" y="313">whereis</text>
      <text class="tool-sub" x="40" y="331">binario, fuentes, man</text>
      <g id="cell-whereis-builtin"><rect class="cell-no" x="263" y="293" width="164" height="44" rx="5"/><text class="val-no" x="345" y="320">no</text></g>
      <g id="cell-whereis-path"><rect class="cell-yes" x="443" y="293" width="164" height="44" rx="5"/><text class="val-yes" x="525" y="320">sí</text></g>
      <g id="cell-whereis-man"><rect class="cell-yes" x="623" y="293" width="164" height="44" rx="5"/><text class="val-yes" x="705" y="320">sí</text></g>
      <g id="cell-whereis-hash"><rect class="cell-no" x="803" y="293" width="114" height="44" rx="5"/><text class="val-no" x="860" y="320">no</text></g>
    </g>

    <g id="row-hash">
      <text class="tool" x="40" y="363">hash</text>
      <text class="tool-sub" x="40" y="381">caché de rutas</text>
      <g id="cell-hash-builtin"><rect class="cell-no" x="263" y="343" width="164" height="44" rx="5"/><text class="val-no" x="345" y="370">no</text></g>
      <g id="cell-hash-path"><rect class="cell-part" x="443" y="343" width="164" height="44" rx="5"/><text class="val-part" x="525" y="370">solo cacheados</text></g>
      <g id="cell-hash-man"><rect class="cell-no" x="623" y="343" width="164" height="44" rx="5"/><text class="val-no" x="705" y="370">no</text></g>
      <g id="cell-hash-hash"><rect class="cell-yes" x="803" y="343" width="114" height="44" rx="5"/><text class="val-yes" x="860" y="370">sí</text></g>
    </g>

    <g id="row-help">
      <text class="tool" x="40" y="413">help</text>
      <text class="tool-sub" x="40" y="431">builtins de Bash</text>
      <g id="cell-help-builtin"><rect class="cell-part" x="263" y="393" width="164" height="44" rx="5"/><text class="val-part" x="345" y="420">solo builtins</text></g>
      <g id="cell-help-path"><rect class="cell-no" x="443" y="393" width="164" height="44" rx="5"/><text class="val-no" x="525" y="420">no</text></g>
      <g id="cell-help-man"><rect class="cell-no" x="623" y="393" width="164" height="44" rx="5"/><text class="val-no" x="705" y="420">no</text></g>
      <g id="cell-help-hash"><rect class="cell-no" x="803" y="393" width="114" height="44" rx="5"/><text class="val-no" x="860" y="420">no</text></g>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="40" y1="240" x2="920" y2="240"/>
    <line class="divider" x1="40" y1="290" x2="920" y2="290"/>
    <line class="divider" x1="40" y1="340" x2="920" y2="340"/>
    <line class="divider" x1="40" y1="390" x2="920" y2="390"/>
    <line class="divider" x1="40" y1="440" x2="920" y2="440"/>
    <text class="note" x="40" y="470">which solo busca binarios en $PATH: which cd no devuelve nada.</text>
    <text class="note" x="40" y="492">Para los builtins usa type o help; hash -r vacía la tabla entera.</text>
  </g>
</svg>
