<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="st-title st-desc">
  <title id="st-title">Minúsculas s y t frente a mayúsculas S y T en la salida de ls -l (LPIC-1 104.5)</title>
  <desc id="st-desc">Seis cadenas de permisos comparan los bits especiales. En la fila superior, la s del dueño en -rwsr-xr-x indica SUID con ejecución, la s del grupo en -rwxr-sr-x indica SGID con ejecución y la t de otros en drwxrwxrwt indica sticky bit con travesía. En la fila inferior, la S mayúscula de -rwSr-xr-x y de -rwxr-Sr-x indica que el bit especial está activo pero falta la x, y la T de drwxrwxrwT indica sticky bit sin permiso de travesía para otros. La banda inferior resume la regla: minúscula convive con la x y mayúscula la sustituye.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-good { fill: #FFFFFF; stroke: #059669; stroke-width: 2; }
      .card-bad { fill: #FFFFFF; stroke: #E11D48; stroke-width: 2; }
      .badge-good { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .badge-bad { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
      .badge-good-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; text-anchor: middle; }
      .badge-bad-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; text-anchor: middle; }
      .perm-string { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; }
      .card-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .rule-band { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .rule-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ls -l · s, t FRENTE A S, T</text>
    <text class="title" x="40" y="78">La letra delata si falta la x</text>
    <text class="subtitle" x="40" y="102">Minúscula y mayúscula en el campo de ejecución</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-bien-suid">
      <rect class="card-good" x="40" y="128" width="288" height="158" rx="10"/>
      <rect class="badge-good" x="56" y="142" width="64" height="20" rx="6"/>
      <text class="badge-good-text" x="88" y="157">BIEN</text>
      <text class="perm-string" x="64" y="192">-rwsr-xr-x</text>
      <text class="card-body" x="64" y="222">La s ocupa el campo x del dueño:</text>
      <text class="card-body" x="64" y="246">SUID activo y ejecutable.</text>
    </g>

    <g id="node-bien-sgid">
      <rect class="card-good" x="336" y="128" width="288" height="158" rx="10"/>
      <rect class="badge-good" x="352" y="142" width="64" height="20" rx="6"/>
      <text class="badge-good-text" x="384" y="157">BIEN</text>
      <text class="perm-string" x="360" y="192">-rwxr-sr-x</text>
      <text class="card-body" x="360" y="222">La s ocupa el campo x del grupo:</text>
      <text class="card-body" x="360" y="246">SGID activo y ejecutable.</text>
    </g>

    <g id="node-bien-sticky">
      <rect class="card-good" x="632" y="128" width="288" height="158" rx="10"/>
      <rect class="badge-good" x="648" y="142" width="64" height="20" rx="6"/>
      <text class="badge-good-text" x="680" y="157">BIEN</text>
      <text class="perm-string" x="656" y="192">drwxrwxrwt</text>
      <text class="card-body" x="656" y="222">La t ocupa el campo x de otros:</text>
      <text class="card-body" x="656" y="246">sticky activo y otros atraviesan.</text>
    </g>

    <g id="node-mal-suid">
      <rect class="card-bad" x="40" y="304" width="288" height="158" rx="10"/>
      <rect class="badge-bad" x="56" y="318" width="64" height="20" rx="6"/>
      <text class="badge-bad-text" x="88" y="333">MAL</text>
      <text class="perm-string" x="64" y="368">-rwSr-xr-x</text>
      <text class="card-body" x="64" y="398">La S ocupa el campo x del dueño:</text>
      <text class="card-body" x="64" y="422">SUID activo, pero no se ejecuta.</text>
    </g>

    <g id="node-mal-sgid">
      <rect class="card-bad" x="336" y="304" width="288" height="158" rx="10"/>
      <rect class="badge-bad" x="352" y="318" width="64" height="20" rx="6"/>
      <text class="badge-bad-text" x="384" y="333">MAL</text>
      <text class="perm-string" x="360" y="368">-rwxr-Sr-x</text>
      <text class="card-body" x="360" y="398">La S ocupa el campo x del grupo:</text>
      <text class="card-body" x="360" y="422">SGID activo, sin x de grupo.</text>
    </g>

    <g id="node-mal-sticky">
      <rect class="card-bad" x="632" y="304" width="288" height="158" rx="10"/>
      <rect class="badge-bad" x="648" y="318" width="64" height="20" rx="6"/>
      <text class="badge-bad-text" x="680" y="333">MAL</text>
      <text class="perm-string" x="656" y="368">drwxrwxrwT</text>
      <text class="card-body" x="656" y="398">La T ocupa el campo x de otros:</text>
      <text class="card-body" x="656" y="422">activo, pero otros no atraviesan.</text>
    </g>

    <g id="node-regla">
      <rect class="rule-band" x="40" y="478" width="880" height="30" rx="8"/>
      <text class="rule-text" x="64" y="499">Minúscula = s o t con x · Mayúscula = S o T sin x</text>
    </g>
  </g>
</svg>
