<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="initbash-title initbash-desc">
  <title id="initbash-title">Recuperación con init=/bin/bash: cuatro pasos para resetear la contraseña de root (LPIC-1 101.2)</title>
  <desc id="initbash-desc">El procedimiento de recuperación encadena cuatro pasos: editar la entrada de GRUB con la tecla e, añadir init=/bin/bash al final de la línea linux y arrancar con Ctrl+X; obtener una consola de root sin contraseña con el prompt root@(none):/#; remontar la raíz en escritura con mount -o remount,rw / porque si no passwd falla con Authentication token manipulation error; y por último ejecutar passwd root, escribir la nueva contraseña y reiniciar con sync &amp;&amp; reboot -f.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .step { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .step-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .step-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .step-title-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .step-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .step-text-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
      .side { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #475569; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-warn { fill: #E11D48; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="initbash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">RECUPERACIÓN · init=/bin/bash</text>
    <text class="title" x="40" y="78">Cuatro pasos hasta la nueva contraseña</text>
    <text class="subtitle" x="40" y="102">Editar, entrar, remontar y cambiar la clave de root.</text>
  </g>

  <g id="diagram-relations">
    <path id="initbash-rel-1-2" class="edge" data-from="node-paso-1" data-to="node-paso-2" data-relation="ctrl-x-boots"
          d="M 320 200 V 224" marker-end="url(#initbash-arrow)"/>
    <path id="initbash-rel-2-3" class="edge" data-from="node-paso-2" data-to="node-paso-3" data-relation="console-ready"
          d="M 320 300 V 324" marker-end="url(#initbash-arrow)"/>
    <path id="initbash-rel-3-4" class="edge" data-from="node-paso-3" data-to="node-paso-4" data-relation="root-writable"
          d="M 320 400 V 424" marker-end="url(#initbash-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-paso-1">
      <rect class="step" x="40" y="124" width="560" height="76" rx="10"/>
      <circle class="badge" cx="68" cy="162" r="15"/>
      <text class="badge-num" x="68" y="167">1</text>
      <text class="step-title" x="96" y="154">Editar la línea linux</text>
      <text class="step-text" x="96" y="180">Pulsa e, añade init=/bin/bash y arranca con Ctrl+X.</text>
    </g>

    <g id="node-paso-2">
      <rect class="step" x="40" y="224" width="560" height="76" rx="10"/>
      <circle class="badge" cx="68" cy="262" r="15"/>
      <text class="badge-num" x="68" y="267">2</text>
      <text class="step-title" x="96" y="254">Consola de root sin contraseña</text>
      <text class="step-text" x="96" y="280">Aparece el prompt root@(none):/# y ya eres root.</text>
    </g>

    <g id="node-paso-3">
      <rect class="step-warn" x="40" y="324" width="560" height="76" rx="10"/>
      <circle class="badge-warn" cx="68" cy="362" r="15"/>
      <text class="badge-num" x="68" y="367">3</text>
      <text class="step-title-warn" x="96" y="354">Remontar la raíz en escritura</text>
      <text class="step-text-warn" x="96" y="380">mount -o remount,rw / — sin esto, passwd fallará.</text>
    </g>

    <g id="node-paso-4">
      <rect class="step" x="40" y="424" width="560" height="76" rx="10"/>
      <circle class="badge" cx="68" cy="462" r="15"/>
      <text class="badge-num" x="68" y="467">4</text>
      <text class="step-title" x="96" y="454">Cambiar la clave y reiniciar</text>
      <text class="step-text" x="96" y="480">passwd root, nueva clave y sync &amp;&amp; reboot -f.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="side" x="632" y="154">Solo afecta a este arranque</text>
    <text class="side" x="632" y="176">No toca /boot/grub/grub.cfg</text>

    <text class="side" x="632" y="254">Sin autenticación previa</text>
    <text class="side" x="632" y="276">systemd no llega a arrancar</text>

    <text class="side" x="632" y="354">La raíz viene en solo lectura</text>
    <text class="side" x="632" y="376">Sin escritura no se guarda nada</text>

    <text class="side" x="632" y="454">sync vuelca los datos a disco</text>
    <text class="side" x="632" y="476">reboot -f fuerza el reinicio</text>
  </g>
</svg>
