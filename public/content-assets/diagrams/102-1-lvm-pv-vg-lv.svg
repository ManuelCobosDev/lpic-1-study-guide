<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lvm-title lvm-desc">
  <title id="lvm-title">Arquitectura de LVM en tres capas: PV, VG y LV (LPIC-1 102.1)</title>
  <desc id="lvm-desc">LVM apila tres capas. Abajo, los volúmenes físicos PV /dev/sdb1 de 1 TB y /dev/sdc1 de 2 TB, marcados con pvcreate y con tipo de partición 8e en MBR o 8e00 en GPT. Encima, el grupo de volúmenes VG vg_empresa que suma ambos discos en una bolsa de 3 TB y la trocea en Physical Extents de 4 MiB. Arriba, los volúmenes lógicos LV lv_web de 500 GB y lv_mysql de 200 GB, que se crean con lvcreate y se ven como /dev/vg_empresa/lv_web.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .band-lv { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-vg { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .band-pv { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .layer-lv { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .layer-vg { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #065F46; }
      .layer-pv { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .layer-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .layer-sub-vg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #047857; }
      .layer-sub-pv { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #E2E8F0; }
      .card-lv { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .card-vg { fill: #FFFFFF; stroke: #059669; stroke-width: 2; }
      .card-pv { fill: #334155; stroke: #CBD5E1; stroke-width: 2; }
      .mono-card { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .mono-card-light { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
      .card-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .card-sub-light { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #E2E8F0; }
      .fact-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #1E36AF; }
      .fact { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .fact-mono-light { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #DBE6FE; }
      .fact-light { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #CBD5E1; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #1D40D8; }
      .foot { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
    </style>

    <marker id="lvm-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · LVM: TRES CAPAS</text>
    <text class="title" x="40" y="78">De discos rígidos a volúmenes elásticos</text>
    <text class="subtitle" x="40" y="102">PV → VG → LV: el espacio se trocea en PE de 4 MiB</text>
  </g>

  <g id="diagram-groups"></g>

  <g id="diagram-relations">
    <path id="lvm-rel-pv-vg" class="edge" data-from="node-band-pv" data-to="node-band-vg" data-relation="vgcreate"
          d="M 480 360 V 330" marker-end="url(#lvm-arrow-blue)"/>
    <path id="lvm-rel-vg-lv" class="edge" data-from="node-band-vg" data-to="node-band-lv" data-relation="lvcreate"
          d="M 480 242 V 212" marker-end="url(#lvm-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-band-lv">
      <rect class="band-lv" x="40" y="124" width="880" height="88" rx="10"/>
      <text class="layer-lv" x="64" y="162">LV</text>
      <text class="layer-sub" x="64" y="184">volumen lógico</text>
      <rect class="card-lv" x="260" y="140" width="180" height="56" rx="8"/>
      <text class="mono-card" x="276" y="164">lv_web</text>
      <text class="card-sub" x="276" y="184">500 GB para la web</text>
      <rect class="card-lv" x="456" y="140" width="180" height="56" rx="8"/>
      <text class="mono-card" x="472" y="164">lv_mysql</text>
      <text class="card-sub" x="472" y="184">200 GB para la base</text>
      <text class="fact-mono" x="660" y="162">/dev/vg_empresa/lv_web</text>
      <text class="fact" x="660" y="184">enlace udev a /dev/mapper</text>
    </g>

    <g id="node-band-vg">
      <rect class="band-vg" x="40" y="242" width="880" height="88" rx="10"/>
      <text class="layer-vg" x="64" y="280">VG</text>
      <text class="layer-sub-vg" x="64" y="302">grupo de volúmenes</text>
      <rect class="card-vg" x="260" y="258" width="376" height="56" rx="8"/>
      <text class="mono-card" x="276" y="282">vg_empresa</text>
      <text class="card-sub" x="276" y="302">1 TB + 2 TB = 3 TB · PE de 4 MiB</text>
      <text class="fact-mono" x="660" y="280">vgcreate -s 4M</text>
      <text class="fact" x="660" y="302">el PE solo cambia al crear</text>
    </g>

    <g id="node-band-pv">
      <rect class="band-pv" x="40" y="360" width="880" height="88" rx="10"/>
      <text class="layer-pv" x="64" y="398">PV</text>
      <text class="layer-sub-pv" x="64" y="420">volumen físico</text>
      <rect class="card-pv" x="260" y="376" width="180" height="56" rx="8"/>
      <text class="mono-card-light" x="276" y="400">/dev/sdb1</text>
      <text class="card-sub-light" x="276" y="420">1 TB</text>
      <rect class="card-pv" x="456" y="376" width="180" height="56" rx="8"/>
      <text class="mono-card-light" x="472" y="400">/dev/sdc1</text>
      <text class="card-sub-light" x="472" y="420">2 TB</text>
      <text class="fact-mono-light" x="660" y="398">pvcreate /dev/sdb1</text>
      <text class="fact-light" x="660" y="420">tipo 8e en MBR · 8e00 en GPT</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="edge-label-bg" x="492" y="334" width="66" height="22" rx="5"/>
    <text class="edge-label" x="500" y="349">vgcreate</text>
    <rect class="edge-label-bg" x="492" y="216" width="62" height="22" rx="5"/>
    <text class="edge-label" x="500" y="231">lvcreate</text>
    <text class="foot" x="40" y="490">El LV se formatea con mkfs.ext4 y se monta como cualquier partición</text>
  </g>
</svg>
