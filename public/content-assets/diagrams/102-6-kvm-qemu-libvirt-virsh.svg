<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="kvm-stack-title kvm-stack-desc">
  <title id="kvm-stack-title">Arquitectura por capas de KVM, QEMU, libvirt y virsh (LPIC-1 102.6)</title>
  <desc id="kvm-stack-desc">Pila de responsabilidades de una máquina virtual en Linux. Arriba, virsh o virt-manager es lo que teclea el administrador. libvirt y su demonio libvirtd guardan la API y el XML de cada dominio. QEMU, en espacio de usuario, emula el disco, la red y la tarjeta gráfica. KVM, como módulo del kernel, acelera la CPU y la memoria conectando el invitado al procesador físico Intel o AMD. Abajo queda el hardware. Cada capa depende de la inferior y aporta una pieza que las demás no cubren.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .band-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .band-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .band-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .band-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .band-name-hw { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #F8FAFC; }
      .band-role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #334155; }
      .band-role-hw { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #E2E8F0; }
      .band-cons { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #475569; }
      .band-cons-hw { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #CBD5E1; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
    </style>

    <marker id="kvm-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="kvm-stack-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">KVM · QEMU · LIBVIRT · VIRSH</text>
    <text class="title" x="40" y="78">Cuatro piezas, una sola máquina virtual</text>
    <text class="subtitle" x="40" y="102">Cada capa hace una cosa; el XML de libvirt las une.</text>
  </g>

  <g id="diagram-relations">
    <path id="kvm-rel-virsh-libvirt" class="edge-blue" data-from="node-virsh" data-to="node-libvirt" data-relation="calls-api"
          d="M 480 180 V 198" marker-end="url(#kvm-stack-arrow)"/>
    <path id="kvm-rel-libvirt-qemu" class="edge-blue" data-from="node-libvirt" data-to="node-qemu" data-relation="manages"
          d="M 480 252 V 270" marker-end="url(#kvm-stack-arrow)"/>
    <path id="kvm-rel-qemu-kvm" class="edge-blue" data-from="node-qemu" data-to="node-kvm" data-relation="uses-hypervisor"
          d="M 480 324 V 342" marker-end="url(#kvm-stack-arrow)"/>
    <path id="kvm-rel-kvm-hw" class="edge-slate" data-from="node-kvm" data-to="node-hw" data-relation="runs-on"
          d="M 480 396 V 414" marker-end="url(#kvm-stack-arrow-slate)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-virsh">
      <rect class="band-cmd" x="40" y="126" width="880" height="54" rx="9"/>
      <text class="band-name" x="64" y="159">virsh · virt-manager</text>
      <text class="band-role" x="320" y="159">CLI y GUI: lo que teclea el SysAdmin</text>
      <text class="band-cons" x="650" y="159">virsh start debian</text>
    </g>

    <g id="node-libvirt">
      <rect class="band-file" x="40" y="198" width="880" height="54" rx="9"/>
      <text class="band-name" x="64" y="231">libvirt (libvirtd)</text>
      <text class="band-role" x="320" y="231">API y XML de cada dominio</text>
      <text class="band-cons" x="650" y="231">sin libvirt: comandos eternos</text>
    </g>

    <g id="node-qemu">
      <rect class="band-cmd" x="40" y="270" width="880" height="54" rx="9"/>
      <text class="band-name" x="64" y="303">QEMU</text>
      <text class="band-role" x="320" y="303">Emula disco, red y tarjeta gráfica</text>
      <text class="band-cons" x="650" y="303">sin QEMU: ni disco ni red</text>
    </g>

    <g id="node-kvm">
      <rect class="band-kernel" x="40" y="342" width="880" height="54" rx="9"/>
      <text class="band-name" x="64" y="375">KVM (kvm.ko)</text>
      <text class="band-role" x="320" y="375">Acelera la CPU y la memoria</text>
      <text class="band-cons" x="650" y="375">sin KVM: paso de tortuga</text>
    </g>

    <g id="node-hw">
      <rect class="band-hw" x="40" y="414" width="880" height="54" rx="9"/>
      <text class="band-name-hw" x="64" y="447">Hardware físico</text>
      <text class="band-role-hw" x="320" y="447">CPU Intel/AMD y RAM</text>
      <text class="band-cons-hw" x="650" y="447">el silicio</text>
    </g>
  </g>
</svg>
