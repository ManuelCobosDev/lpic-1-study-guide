<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="targets-title targets-desc">
  <title id="targets-title">Equivalencias entre los runlevels de SysVinit y los targets de systemd (LPIC-1 101.3)</title>
  <desc id="targets-desc">Cada runlevel de SysVinit tiene un target equivalente en systemd: el 0 corresponde a poweroff.target, el 1 y la S a rescue.target, los niveles 2, 3 y 4 a multi-user.target, el 5 a graphical.target y el 6 a reboot.target. Las dos parejas que el examen pregunta siempre son multi-user.target con el nivel 3, el servidor en modo texto, y graphical.target con el nivel 5, el escritorio gráfico. Un target no es solo un modo de arranque: es un grupo de dependencias que arrastra a otras unidades.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .panel-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .row-sysv { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .row-target { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #0F172A; }
    </style>

    <marker id="targets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SYSVINIT ⇄ SYSTEMD</text>
    <text class="title" x="40" y="78">De runlevels a targets</text>
    <text class="subtitle" x="40" y="102">Cinco parejas que el examen da por sabidas</text>
  </g>

  <g id="diagram-relations">
    <path id="targets-rel-0" class="edge" data-from="node-panel-sysv" data-to="node-panel-systemd" data-relation="equivale-a" d="M 450 226 H 506" marker-end="url(#targets-arrow)"/>
    <path id="targets-rel-1" class="edge" data-from="node-panel-sysv" data-to="node-panel-systemd" data-relation="equivale-a" d="M 450 272 H 506" marker-end="url(#targets-arrow)"/>
    <path id="targets-rel-2" class="edge" data-from="node-panel-sysv" data-to="node-panel-systemd" data-relation="equivale-a" d="M 450 318 H 506" marker-end="url(#targets-arrow)"/>
    <path id="targets-rel-3" class="edge" data-from="node-panel-sysv" data-to="node-panel-systemd" data-relation="equivale-a" d="M 450 364 H 506" marker-end="url(#targets-arrow)"/>
    <path id="targets-rel-4" class="edge" data-from="node-panel-sysv" data-to="node-panel-systemd" data-relation="equivale-a" d="M 450 410 H 506" marker-end="url(#targets-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-sysv">
      <rect class="panel-a" x="40" y="130" width="410" height="320" rx="10"/>
      <text class="panel-head-a" x="64" y="164">SysVinit · runlevel</text>
      <line class="divider" x1="64" y1="182" x2="426" y2="182"/>
      <text class="row-sysv" x="64" y="220">0 — apaga el equipo</text>
      <text class="row-sysv" x="64" y="266">1 / S — rescate monousuario</text>
      <text class="row-sysv" x="64" y="312">2, 3, 4 — servidor en texto</text>
      <text class="row-sysv" x="64" y="358">5 — escritorio gráfico</text>
      <text class="row-sysv" x="64" y="404">6 — reinicia la máquina</text>
      <line class="divider" x1="64" y1="240" x2="426" y2="240"/>
      <line class="divider" x1="64" y1="286" x2="426" y2="286"/>
      <line class="divider" x1="64" y1="332" x2="426" y2="332"/>
      <line class="divider" x1="64" y1="378" x2="426" y2="378"/>
    </g>

    <g id="node-panel-systemd">
      <rect class="panel-b" x="506" y="130" width="414" height="320" rx="10"/>
      <text class="panel-head-b" x="530" y="164">systemd · target</text>
      <line class="divider" x1="530" y1="182" x2="896" y2="182"/>
      <text class="row-target" x="530" y="220">poweroff.target</text>
      <text class="row-target" x="530" y="266">rescue.target</text>
      <text class="row-target" x="530" y="312">multi-user.target</text>
      <text class="row-target" x="530" y="358">graphical.target</text>
      <text class="row-target" x="530" y="404">reboot.target</text>
      <line class="divider" x1="530" y1="240" x2="896" y2="240"/>
      <line class="divider" x1="530" y1="286" x2="896" y2="286"/>
      <line class="divider" x1="530" y1="332" x2="896" y2="332"/>
      <line class="divider" x1="530" y1="378" x2="896" y2="378"/>
    </g>

    <g id="node-verdict">
      <rect class="verdict" x="40" y="462" width="880" height="46" rx="10"/>
      <text class="verdict-label" x="64" y="491">VEREDICTO</text>
      <text class="verdict-text" x="196" y="491">multi-user.target = nivel 3 · graphical.target = nivel 5</text>
    </g>
  </g>

</svg>
