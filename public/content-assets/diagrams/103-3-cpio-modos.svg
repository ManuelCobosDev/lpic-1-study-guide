<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cpio-modos-title cpio-modos-desc">
  <title id="cpio-modos-title">Los tres modos de cpio: copy-out, copy-in y pass-through (LPIC-1 103.3)</title>
  <desc id="cpio-modos-desc">cpio trabaja siempre con flujos: en el modo -o (copy-out) lee por la entrada estándar una lista de rutas, por ejemplo la que produce find ., y escribe el paquete en la salida estándar hacia un archivo; en el modo -i (copy-in) lee el paquete por la entrada estándar y extrae los ficheros en el disco, creando las carpetas intermedias con -d; y en el modo -p (pass-through) copia un árbol de directorios directamente a otra carpeta sin crear un archivo contenedor intermedio. Los tres modos se encadenan con tuberías y redirecciones.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .bar-blue { fill: #2550EB; }
      .bar-amber { fill: #D97706; }
      .bar-emerald { fill: #059669; }
      .flag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #1E36AF; }
      .mode-name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .command { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #065F46; }
      .body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .spine { stroke: #CBD5E1; stroke-width: 2; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">cpio · MODOS OPERATIVOS</text>
    <text class="title" x="40" y="78">Tres modos, tres direcciones</text>
    <text class="subtitle" x="40" y="102">Leer rutas, extraer ficheros o copiar en vuelo.</text>
  </g>

  <g id="diagram-relations">
    <line class="spine" x1="60" y1="203" x2="60" y2="287"/>
    <line class="spine" x1="60" y1="317" x2="60" y2="401"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-copy-out">
      <rect class="card" x="100" y="136" width="820" height="104" rx="10"/>
      <rect class="bar-blue" x="100" y="136" width="6" height="104" rx="3"/>
      <text class="flag" x="122" y="176">-o</text>
      <text class="mode-name" x="170" y="176">Copy-out (crear)</text>
      <text class="command" x="122" y="208">find . | cpio -ov &gt; arch.cpio</text>
      <text class="body" x="470" y="176">Lee la lista de rutas por stdin</text>
      <text class="body" x="470" y="200">y escribe el paquete en stdout.</text>
    </g>

    <g id="node-copy-in">
      <rect class="card" x="100" y="250" width="820" height="104" rx="10"/>
      <rect class="bar-amber" x="100" y="250" width="6" height="104" rx="3"/>
      <text class="flag" x="122" y="290">-i</text>
      <text class="mode-name" x="170" y="290">Copy-in (extraer)</text>
      <text class="command" x="122" y="322">cpio -idv &lt; arch.cpio</text>
      <text class="body" x="470" y="290">Lee el paquete por stdin y</text>
      <text class="body" x="470" y="314">extrae los ficheros en disco.</text>
    </g>

    <g id="node-pass">
      <rect class="card" x="100" y="364" width="820" height="104" rx="10"/>
      <rect class="bar-emerald" x="100" y="364" width="6" height="104" rx="3"/>
      <text class="flag" x="122" y="404">-p</text>
      <text class="mode-name" x="170" y="404">Pass-through (en vuelo)</text>
      <text class="command" x="122" y="436">find . | cpio -pdm /backup/</text>
      <text class="body" x="470" y="404">Copia un árbol a otra carpeta</text>
      <text class="body" x="470" y="428">sin crear archivo intermedio.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="60" cy="188" r="15"/>
    <text class="badge-num" x="60" y="193">1</text>
    <circle class="badge" cx="60" cy="302" r="15"/>
    <text class="badge-num" x="60" y="307">2</text>
    <circle class="badge" cx="60" cy="416" r="15"/>
    <text class="badge-num" x="60" y="421">3</text>
    <text class="note" x="40" y="490">El initramfs del arranque es un archivo cpio</text>
    <text class="note" x="40" y="512">que el kernel descomprime en RAM.</text>
  </g>
</svg>
