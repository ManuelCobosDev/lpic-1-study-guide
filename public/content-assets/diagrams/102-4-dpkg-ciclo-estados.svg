<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ciclo-title ciclo-desc">
  <title id="ciclo-title">Ciclo de vida de un paquete Debian con dpkg: ii, rc y un (LPIC-1 102.4)</title>
  <desc id="ciclo-desc">Un paquete Debian recorre tres estados guardados en /var/lib/dpkg/status. dpkg -i deja el estado ii con binarios en /usr/bin/, librerías, manuales y configuración en /etc/. dpkg -r elimina binarios y manuales pero conserva la configuración y deja el estado rc. dpkg -P borra además todos los ficheros de /etc/ y deja el estado un.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-installed { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .card-removed { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-purged { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .state-name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .card-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .label-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #1D40D8; text-anchor: middle; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="ciclo-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">DPKG · CICLO DE VIDA DEL PAQUETE</text>
    <text class="title" x="40" y="78">Tres estados, dos comandos</text>
    <text class="subtitle" x="40" y="102">Instalar, retirar y purgar cambian el estado.</text>
  </g>

  <g id="diagram-relations">
    <path id="ciclo-rel-entrada" class="edge-blue"
          data-from="node-entrada" data-to="node-estado-ii" data-relation="instala"
          d="M 150 146 V 190" marker-end="url(#ciclo-arrow-blue)"/>

    <path id="ciclo-rel-ii-rc" class="edge-blue"
          data-from="node-estado-ii" data-to="node-estado-rc" data-relation="remove"
          d="M 260 320 H 370" marker-end="url(#ciclo-arrow-blue)"/>

    <path id="ciclo-rel-rc-un" class="edge-blue"
          data-from="node-estado-rc" data-to="node-estado-un" data-relation="purge"
          d="M 590 320 H 700" marker-end="url(#ciclo-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-entrada">
      <rect class="label-bg" x="40" y="112" width="220" height="34" rx="8"/>
      <text class="label-mono" x="150" y="134">dpkg -i pkg.deb</text>
    </g>

    <g id="node-estado-ii">
      <rect class="card-installed" x="40" y="190" width="220" height="220" rx="12"/>
      <circle class="badge" cx="80" cy="234" r="18"/>
      <text class="badge-text" x="80" y="240">ii</text>
      <text class="state-name" x="108" y="241">Instalado</text>
      <line class="divider" x1="60" y1="256" x2="240" y2="256"/>
      <text class="card-line" x="64" y="286">Binarios en /usr/bin/</text>
      <text class="card-line" x="64" y="310">Librerías y manuales</text>
      <text class="card-line" x="64" y="334">Configuración en /etc/</text>
    </g>

    <g id="node-estado-rc">
      <rect class="card-removed" x="370" y="190" width="220" height="220" rx="12"/>
      <circle class="badge" cx="410" cy="234" r="18"/>
      <text class="badge-text" x="410" y="240">rc</text>
      <text class="state-name" x="438" y="241">Desinstalado</text>
      <line class="divider" x1="390" y1="256" x2="570" y2="256"/>
      <text class="card-line" x="394" y="286">Binarios y manuales</text>
      <text class="card-line" x="394" y="310">eliminados</text>
      <text class="card-line" x="394" y="334">Conserva /etc/ y su</text>
      <text class="card-line" x="394" y="358">configuración</text>
    </g>

    <g id="node-estado-un">
      <rect class="card-purged" x="700" y="190" width="220" height="220" rx="12"/>
      <circle class="badge" cx="740" cy="234" r="18"/>
      <text class="badge-text" x="740" y="240">un</text>
      <text class="state-name" x="768" y="241">Purgado</text>
      <line class="divider" x1="720" y1="256" x2="900" y2="256"/>
      <text class="card-line" x="724" y="286">Binarios y manuales</text>
      <text class="card-line" x="724" y="310">eliminados</text>
      <text class="card-line" x="724" y="334">Destruye también la</text>
      <text class="card-line" x="724" y="358">configuración de /etc/</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="label-bg" x="267" y="282" width="96" height="24" rx="6"/>
    <text class="label-mono" x="315" y="299">dpkg -r pkg</text>
    <rect class="label-bg" x="597" y="282" width="96" height="24" rx="6"/>
    <text class="label-mono" x="645" y="299">dpkg -P pkg</text>
    <text class="note" x="40" y="456">El estado vive en /var/lib/dpkg/status.</text>
    <text class="note" x="40" y="480">ii = instalado · rc = eliminado · un = purgado</text>
  </g>
</svg>
