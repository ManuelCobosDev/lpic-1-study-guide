<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="grubconf-title grubconf-desc">
  <title id="grubconf-title">De /etc/default/grub a /boot/grub/grub.cfg con grub-mkconfig (LPIC-1 101.2)</title>
  <desc id="grubconf-desc">El administrador edita el archivo sencillo /etc/default/grub, de unas diez líneas, con variables como timeout y las opciones del kernel. Después ejecuta grub-mkconfig -o /boot/grub/grub.cfg, o su atajo update-grub en Debian y Ubuntu, que compila ese fuente en el archivo final /boot/grub/grub.cfg, un script autogenerado de más de 300 líneas. Ese archivo generado es el que lee GRUB al arrancar y nunca se edita a mano porque se sobrescribe completo en cada regeneración.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-out { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 400; fill: #881337; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-rose { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .edge-label-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #E11D48; text-anchor: middle; }
    </style>

    <marker id="grubconf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="grubconf-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">CONFIGURACIÓN DE GRUB · DOS ARCHIVOS</text>
    <text class="title" x="40" y="78">Editas uno y arranca el otro</text>
    <text class="subtitle" x="40" y="102">/etc/default/grub se compila en /boot/grub/grub.cfg.</text>
  </g>

  <g id="diagram-relations">
    <path id="grubconf-rel-source" class="edge" data-from="node-default" data-to="node-mkconfig" data-relation="compiles"
          d="M 300 220 H 340" marker-end="url(#grubconf-arrow)"/>
    <path id="grubconf-rel-output" class="edge" data-from="node-mkconfig" data-to="node-grubcfg" data-relation="writes"
          d="M 640 220 H 680" marker-end="url(#grubconf-arrow)"/>
    <path id="grubconf-rel-warn" class="edge-rose" data-from="node-grubcfg" data-to="node-warning" data-relation="overwrites"
          d="M 800 300 V 348" marker-end="url(#grubconf-arrow-rose)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-default">
      <rect class="node-file" x="40" y="140" width="260" height="160" rx="10"/>
      <text class="mono-name" x="62" y="176">/etc/default/grub</text>
      <text class="sub" x="62" y="208">texto de ~10 líneas</text>
      <text class="sub" x="62" y="232">timeout, opciones, resolución</text>
      <text class="sub" x="62" y="256">lo que edita el humano</text>
    </g>

    <g id="node-mkconfig">
      <rect class="node-cmd" x="340" y="140" width="300" height="160" rx="10"/>
      <text class="mono-cmd" x="362" y="180">grub-mkconfig</text>
      <text class="mono-sm" x="362" y="208">-o /boot/grub/grub.cfg</text>
      <text class="sub" x="362" y="240">o el atajo update-grub</text>
      <text class="sub" x="362" y="264">compila el menú</text>
    </g>

    <g id="node-grubcfg">
      <rect class="node-out" x="680" y="140" width="240" height="160" rx="10"/>
      <text class="mono-name" x="702" y="176">/boot/grub/grub.cfg</text>
      <text class="sub" x="702" y="208">autogenerado por GRUB</text>
      <text class="sub" x="702" y="232">más de 300 líneas</text>
      <text class="sub" x="702" y="256">el que lee el arranque</text>
    </g>

    <g id="node-warning">
      <rect class="node-warn" x="40" y="348" width="880" height="122" rx="10"/>
      <text class="warn-title" x="64" y="384">No edites /boot/grub/grub.cfg a mano</text>
      <text class="warn-body" x="64" y="412">grub-mkconfig lo reescribe completo en cada ejecución.</text>
      <text class="warn-body" x="64" y="440">Lo que cambies a mano se pierde en el siguiente arranque.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="label-bg" x="808" y="312" width="104" height="24" rx="6"/>
    <text class="edge-label-rose" x="860" y="329">se sobrescribe</text>
  </g>
</svg>
