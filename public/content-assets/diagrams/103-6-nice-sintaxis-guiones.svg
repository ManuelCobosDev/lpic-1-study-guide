<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dash-title dash-desc">
  <title id="dash-title">Anatomía de la sintaxis antigua de nice: el guion de opción y el signo negativo (LPIC-1 103.6)</title>
  <desc id="dash-desc">En la sintaxis antigua de nice, el primer guion de la opción y el signo negativo del valor son caracteres distintos. En nice --5 comando, el primer guion presenta la opción, el segundo guion es el signo negativo y el 5 es el valor: el proceso nace con nice -5 y hace falta root. En nice -5 comando solo hay un guion, que es la bandera de la opción, así que el proceso nace con nice +5 y lo puede lanzar cualquier usuario.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .token-card { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .token { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 28px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .token-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .band { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .why { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .result { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .badge-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .badge-ok-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.04em; text-anchor: middle; }
      .badge-root { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-root-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.04em; text-anchor: middle; }
      .footer { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">NICE · LA TRAMPA DE LOS GUIONES</text>
    <text class="title" x="40" y="78">Dos guiones, dos significados</text>
    <text class="subtitle" x="40" y="102">El guion de opción y el signo negativo</text>
    <text class="subtitle" x="40" y="122">no son el mismo carácter.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-token-nice">
      <rect class="token-card" x="40" y="150" width="200" height="146" rx="10"/>
      <text class="token" x="140" y="200">nice</text>
      <line class="divider" x1="64" y1="218" x2="216" y2="218"/>
      <text class="token-label" x="140" y="246">el comando</text>
      <text class="token-label" x="140" y="268">nice</text>
    </g>

    <g id="node-token-opcion">
      <rect class="token-card" x="264" y="150" width="200" height="146" rx="10"/>
      <text class="token" x="364" y="200">-</text>
      <line class="divider" x1="288" y1="218" x2="440" y2="218"/>
      <text class="token-label" x="364" y="246">guion de opción:</text>
      <text class="token-label" x="364" y="268">presenta el valor</text>
    </g>

    <g id="node-token-signo">
      <rect class="token-card" x="488" y="150" width="200" height="146" rx="10"/>
      <text class="token" x="588" y="200">-5</text>
      <line class="divider" x1="512" y1="218" x2="664" y2="218"/>
      <text class="token-label" x="588" y="246">guion de signo:</text>
      <text class="token-label" x="588" y="268">valor negativo 5</text>
    </g>

    <g id="node-token-comando">
      <rect class="token-card" x="712" y="150" width="200" height="146" rx="10"/>
      <text class="token" x="812" y="200">comando</text>
      <line class="divider" x1="736" y1="218" x2="888" y2="218"/>
      <text class="token-label" x="812" y="246">programa que</text>
      <text class="token-label" x="812" y="268">se ejecuta</text>
    </g>

    <g id="node-caso-un-guion">
      <rect class="band" x="40" y="322" width="880" height="62" rx="10"/>
      <text class="cmd" x="64" y="360">nice -5 comando</text>
      <text class="why" x="300" y="360">un guion es la bandera, no el signo</text>
      <text class="result" x="620" y="360">nice = +5</text>
      <rect class="badge-ok" x="760" y="338" width="136" height="24" rx="6"/>
      <text class="badge-ok-text" x="828" y="355">SIN SUDO</text>
    </g>

    <g id="node-caso-dos-guiones">
      <rect class="band" x="40" y="394" width="880" height="62" rx="10"/>
      <text class="cmd" x="64" y="432">nice --5 comando</text>
      <text class="why" x="300" y="432">dos guiones: opción y signo negativo</text>
      <text class="result" x="620" y="432">nice = -5</text>
      <rect class="badge-root" x="760" y="410" width="136" height="24" rx="6"/>
      <text class="badge-root-text" x="828" y="427">SOLO ROOT</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="footer" x="40" y="492">nice -n -5 es la forma moderna de escribir nice --5.</text>
  </g>
</svg>
