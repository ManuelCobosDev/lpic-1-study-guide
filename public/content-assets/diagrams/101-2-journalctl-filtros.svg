<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="journalctl-filtros-title journalctl-filtros-desc">
  <title id="journalctl-filtros-title">Los cuatro filtros de journalctl que se usan a diario (LPIC-1 101.2)</title>
  <desc id="journalctl-filtros-desc">Cuatro consultas de journalctl se combinan sobre el mismo journal indexado: journalctl -b -1 lee el arranque anterior para saber qué provocó una caída, journalctl -u ssh -f sigue en directo un servicio concreto, journalctl -k -p err deja solo los errores del kernel y la opción --since "1 hour ago" limita la búsqueda a la última hora. journalctl aplica todos los filtros a la vez y devuelve únicamente las entradas que casan con ellos.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .chip { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .chip-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .chip-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .core { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .core-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .core-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .out { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .out-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .out-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="journalctl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">JOURNALCTL · CUATRO FILTROS</text>
    <text class="title" x="40" y="78">Cuatro preguntas, un solo journal</text>
    <text class="subtitle" x="40" y="102">Cada opción filtra un campo distinto del mismo registro.</text>
  </g>

  <g id="diagram-relations">
    <path id="journalctl-rel-1" class="edge" data-from="node-filtro-1" data-to="node-core" data-relation="filters-by-boot"
          d="M 300 164 H 340 V 265 H 380" marker-end="url(#journalctl-arrow)"/>
    <path id="journalctl-rel-2" class="edge" data-from="node-filtro-2" data-to="node-core" data-relation="filters-by-unit"
          d="M 300 230 H 340 V 265 H 380" marker-end="url(#journalctl-arrow)"/>
    <path id="journalctl-rel-3" class="edge" data-from="node-filtro-3" data-to="node-core" data-relation="filters-by-priority"
          d="M 300 296 H 340 V 265 H 380" marker-end="url(#journalctl-arrow)"/>
    <path id="journalctl-rel-4" class="edge" data-from="node-filtro-4" data-to="node-core" data-relation="filters-by-time"
          d="M 300 362 H 340 V 265 H 380" marker-end="url(#journalctl-arrow)"/>
    <path id="journalctl-rel-out" class="edge" data-from="node-core" data-to="node-salida" data-relation="returns"
          d="M 660 265 H 720" marker-end="url(#journalctl-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-filtro-1">
      <rect class="chip" x="40" y="136" width="260" height="56" rx="8"/>
      <text class="chip-mono" x="60" y="160">journalctl -b -1</text>
      <text class="chip-sub" x="60" y="182">la caída del arranque previo</text>
    </g>

    <g id="node-filtro-2">
      <rect class="chip" x="40" y="202" width="260" height="56" rx="8"/>
      <text class="chip-mono" x="60" y="226">journalctl -u ssh -f</text>
      <text class="chip-sub" x="60" y="248">quién entra por SSH, en vivo</text>
    </g>

    <g id="node-filtro-3">
      <rect class="chip" x="40" y="268" width="260" height="56" rx="8"/>
      <text class="chip-mono" x="60" y="292">journalctl -k -p err</text>
      <text class="chip-sub" x="60" y="314">errores de hardware y kernel</text>
    </g>

    <g id="node-filtro-4">
      <rect class="chip" x="40" y="334" width="260" height="56" rx="8"/>
      <text class="chip-mono" x="60" y="358">--since "1 hour ago"</text>
      <text class="chip-sub" x="60" y="380">solo la última hora</text>
    </g>

    <g id="node-core">
      <rect class="core" x="380" y="170" width="280" height="190" rx="10"/>
      <text class="core-mono" x="520" y="226">journalctl</text>
      <text class="core-text" x="520" y="258">journal único e indexado</text>
      <text class="core-text" x="520" y="282">arranque, unidad,</text>
      <text class="core-text" x="520" y="306">prioridad y fecha</text>
    </g>

    <g id="node-salida">
      <rect class="out" x="720" y="170" width="200" height="190" rx="10"/>
      <text class="out-title" x="820" y="226">salida filtrada</text>
      <text class="out-text" x="820" y="258">solo las entradas</text>
      <text class="out-text" x="820" y="282">que casan con</text>
      <text class="out-text" x="820" y="306">todos los filtros</text>
    </g>

    <g id="node-band">
      <rect class="band" x="40" y="400" width="880" height="100" rx="10"/>
      <text class="band-title" x="64" y="430">Los filtros se suman, no se sustituyen</text>
      <text class="band-text" x="64" y="458"><tspan class="band-mono">-b</tspan>, <tspan class="band-mono">-u</tspan>, <tspan class="band-mono">-p</tspan> y <tspan class="band-mono">--since</tspan> se pueden combinar en la misma llamada: journalctl devuelve lo que cumple todos.</text>
      <text class="band-text" x="64" y="484"><tspan class="band-mono">-f</tspan> mantiene la consulta abierta y va mostrando las entradas nuevas.</text>
    </g>
  </g>
</svg>
