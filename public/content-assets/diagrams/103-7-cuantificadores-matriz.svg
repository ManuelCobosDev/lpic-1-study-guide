<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cuant-title cuant-desc">
  <title id="cuant-title">Matriz de coincidencias de los cuantificadores * + y ? sobre las palabras color, colour y colouur (LPIC-1 103.7)</title>
  <desc id="cuant-desc">La matriz cruza tres patrones sobre la misma raíz colou...r con las tres grafías posibles. El patrón colou*r acepta color, colour y colouur porque admite cero o más repeticiones de la u; colou+r rechaza color porque exige al menos una u; colou?r acepta color y colour pero rechaza colouur porque permite como máximo una u. En todos los casos el cuantificador solo afecta al carácter situado justo antes de él.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .head-band { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; }
      .head-col { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .row-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #1E36AF; }
      .row-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .cell-ok { fill: #ECFDF5; }
      .cell-no { fill: #FFF1F2; }
      .cell-text-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #065F46; text-anchor: middle; }
      .cell-text-no { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #9F1239; text-anchor: middle; }
      .grid { stroke: #CBD5E1; stroke-width: 1.5; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">CUANTIFICADORES · MATRIZ DE COINCIDENCIAS</text>
    <text class="title" x="40" y="78">Qué grafía acepta cada cuantificador</text>
    <text class="subtitle" x="40" y="102">Solo afecta al elemento inmediatamente anterior: la u.</text>
  </g>

  <g id="diagram-nodes">
    <rect class="head-band" x="40" y="150" width="880" height="46" rx="8"/>
    <text class="head-col" x="386" y="181">color</text>
    <text class="head-col" x="599" y="181">colour</text>
    <text class="head-col" x="812" y="181">colouur</text>

    <rect class="cell-ok" x="280" y="196" width="213" height="92"/>
    <rect class="cell-ok" x="493" y="196" width="213" height="92"/>
    <rect class="cell-ok" x="706" y="196" width="213" height="92"/>
    <text class="cell-text-ok" x="386" y="247">coincide</text>
    <text class="cell-text-ok" x="599" y="247">coincide</text>
    <text class="cell-text-ok" x="812" y="247">coincide</text>

    <rect class="cell-no" x="280" y="288" width="213" height="92"/>
    <rect class="cell-ok" x="493" y="288" width="213" height="92"/>
    <rect class="cell-ok" x="706" y="288" width="213" height="92"/>
    <text class="cell-text-no" x="386" y="339">no coincide</text>
    <text class="cell-text-ok" x="599" y="339">coincide</text>
    <text class="cell-text-ok" x="812" y="339">coincide</text>

    <rect class="cell-ok" x="280" y="380" width="213" height="92"/>
    <rect class="cell-ok" x="493" y="380" width="213" height="92"/>
    <rect class="cell-no" x="706" y="380" width="213" height="92"/>
    <text class="cell-text-ok" x="386" y="431">coincide</text>
    <text class="cell-text-ok" x="599" y="431">coincide</text>
    <text class="cell-text-no" x="812" y="431">no coincide</text>

    <g id="node-banda-pie">
      <rect class="band" x="40" y="480" width="880" height="34" rx="8"/>
      <text class="band-text" x="480" y="502" text-anchor="middle">Solo afecta al elemento que tiene justo delante: la u.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="row-mono" x="64" y="240">colou*r</text>
    <text class="row-sub" x="64" y="262">0 o más veces la u</text>
    <text class="row-mono" x="64" y="332">colou+r</text>
    <text class="row-sub" x="64" y="354">al menos 1 vez la u</text>
    <text class="row-mono" x="64" y="424">colou?r</text>
    <text class="row-sub" x="64" y="446">máximo 1 vez la u</text>
    <line class="grid" x1="40" y1="472" x2="920" y2="472"/>
    <line class="grid" x1="40" y1="288" x2="920" y2="288"/>
    <line class="grid" x1="40" y1="380" x2="920" y2="380"/>
    <line class="grid" x1="280" y1="150" x2="280" y2="472"/>
    <line class="grid" x1="493" y1="150" x2="493" y2="472"/>
    <line class="grid" x1="706" y1="150" x2="706" y2="472"/>
  </g>
</svg>
