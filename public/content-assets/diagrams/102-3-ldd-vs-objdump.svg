<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="objdump-title objdump-desc">
  <title id="objdump-title">ldd y objdump -p: dos formas de leer las dependencias de un binario (LPIC-1 102.3)</title>
  <desc id="objdump-desc">Sobre el mismo binario /bin/cat, ldd trabaja con el motor en marcha: simula la carga invocando al enlazador dinámico y devuelve la ruta actual de cada librería o un not found, con el riesgo de ejecutar código si el archivo es sospechoso. objdump -p trabaja con el motor apagado: lee las cabeceras ELF escritas en disco y muestra las etiquetas NEEDED que grabó el compilador y el SONAME que declara cada librería, sin ejecutar nada y sirviendo para cualquier arquitectura. readelf -d ofrece la misma información desde la sección dinámica del ELF.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-bin { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-dyn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .node-static { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .bin-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .bin-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .card-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; }
      .card-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; }
      .band { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="objdump-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">OBJDUMP -P · LECTURA ESTÁTICA DEL ELF</text>
    <text class="title" x="40" y="78">Dos formas de leer el mismo binario</text>
    <text class="subtitle" x="40" y="102">Motor en marcha frente a motor apagado</text>
  </g>

  <g id="diagram-relations">
    <path id="objdump-rel-bin-ldd" class="edge-blue"
          data-from="node-binario" data-to="node-ldd" data-relation="analiza-con-ldd"
          d="M 440 208 V 228 H 240 V 250" marker-end="url(#objdump-arrow-blue)"/>

    <path id="objdump-rel-bin-objdump" class="edge-blue"
          data-from="node-binario" data-to="node-objdump" data-relation="analiza-con-objdump"
          d="M 520 208 V 228 H 720 V 250" marker-end="url(#objdump-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-binario">
      <rect class="node-bin" x="380" y="136" width="200" height="72" rx="10"/>
      <text class="bin-name" x="480" y="170">/bin/cat</text>
      <text class="bin-sub" x="480" y="192">caja negra binaria</text>
    </g>

    <g id="node-ldd">
      <rect class="node-dyn" x="40" y="250" width="400" height="146" rx="10"/>
      <text class="card-title" x="64" y="284" fill="#881337">ldd /bin/cat</text>
      <text class="card-tag" x="64" y="308" fill="#E11D48">MOTOR EN MARCHA · DINÁMICO</text>
      <text class="card-text" x="64" y="334" fill="#881337">Simula la carga con el enlazador dinámico.</text>
      <text class="card-text" x="64" y="356" fill="#881337">Dice dónde están hoy o si falta alguna.</text>
      <text class="card-text" x="64" y="378" fill="#881337">Riesgo: puede ejecutar código ajeno.</text>
    </g>

    <g id="node-objdump">
      <rect class="node-static" x="520" y="250" width="400" height="146" rx="10"/>
      <text class="card-title" x="544" y="284" fill="#065F46">objdump -p /bin/cat</text>
      <text class="card-tag" x="544" y="308" fill="#059669">MOTOR APAGADO · ESTÁTICO</text>
      <text class="card-text" x="544" y="334" fill="#065F46">Lee las cabeceras ELF escritas en disco.</text>
      <text class="card-text" x="544" y="356" fill="#065F46">Muestra NEEDED y el SONAME grabados.</text>
      <text class="card-text" x="544" y="378" fill="#065F46">Seguro: no ejecuta nada del binario.</text>
    </g>

    <g id="node-banda-readelf">
      <rect class="band" x="40" y="414" width="880" height="80" rx="10"/>
      <text class="band-mono" x="64" y="444">readelf -d /bin/cat</text>
      <text class="band-text" x="64" y="470">Comando hermano: lee la sección dinámica ELF y lista NEEDED y SONAME sin desensamblar.</text>
    </g>
  </g>
</svg>
