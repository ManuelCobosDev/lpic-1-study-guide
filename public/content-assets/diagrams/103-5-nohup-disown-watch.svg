<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="nohup-title nohup-desc">
  <title id="nohup-title">nohup preventivo frente a disown reactivo, con watch como monitor cíclico (LPIC-1 103.5)</title>
  <desc id="nohup-desc">Dos formas de sobrevivir al cierre de la terminal. nohup se escribe antes de lanzar el proceso, ignora la señal SIGHUP (1) y redirige stdout y stderr a nohup.out, que se inspecciona con head o tail -f. disown -h se aplica después de lanzar el trabajo con &amp;: retira el job de la tabla de la shell para que al cerrar la sesión SSH no le llegue SIGHUP. Como cierre, watch repite un comando cada N segundos, dos por defecto, a pantalla limpia y dinamiza la salida estática de ps.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-b { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .panel-head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .panel-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #065F46; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .row-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #0F172A; }
      .verdict-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PERSISTENCIA FRENTE A SIGHUP</text>
    <text class="title" x="40" y="78">Preventivo antes, reactivo después</text>
    <text class="subtitle" x="40" y="102">Dos caminos distintos para que el proceso sobreviva al cierre.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-nohup">
      <rect class="panel-a" x="40" y="124" width="420" height="300" rx="10"/>
      <text class="panel-head-a" x="64" y="154">nohup · preventivo</text>
      <line class="divider" x1="64" y1="166" x2="436" y2="166"/>

      <text class="row-label" x="64" y="190">SINTAXIS</text>
      <text class="row-mono" x="64" y="212">nohup ./backup.sh &amp;</text>
      <line class="divider" x1="64" y1="226" x2="436" y2="226"/>

      <text class="row-label" x="64" y="254">MOMENTO</text>
      <text class="row-value" x="64" y="276">Antes de lanzar el proceso</text>
      <line class="divider" x1="64" y1="290" x2="436" y2="290"/>

      <text class="row-label" x="64" y="318">MECANISMO</text>
      <text class="row-value" x="64" y="340">Ignora la señal SIGHUP (1)</text>
      <line class="divider" x1="64" y1="354" x2="436" y2="354"/>

      <text class="row-label" x="64" y="382">SALIDA</text>
      <text class="row-value" x="64" y="404">stdout y stderr a nohup.out</text>
    </g>

    <g id="node-disown">
      <rect class="panel-b" x="500" y="124" width="420" height="300" rx="10"/>
      <text class="panel-head-b" x="524" y="154">disown -h · reactivo</text>
      <line class="divider" x1="524" y1="166" x2="896" y2="166"/>

      <text class="row-label" x="524" y="190">SINTAXIS</text>
      <text class="row-mono" x="524" y="212">disown -h %1</text>
      <line class="divider" x1="524" y1="226" x2="896" y2="226"/>

      <text class="row-label" x="524" y="254">MOMENTO</text>
      <text class="row-value" x="524" y="276">Después de lanzarlo con &amp;</text>
      <line class="divider" x1="524" y1="290" x2="896" y2="290"/>

      <text class="row-label" x="524" y="318">MECANISMO</text>
      <text class="row-value" x="524" y="340">Saca el job de la tabla</text>
      <line class="divider" x1="524" y1="354" x2="896" y2="354"/>

      <text class="row-label" x="524" y="382">EFECTO</text>
      <text class="row-value" x="524" y="404">Al cerrar SSH no llega SIGHUP</text>
    </g>

    <g id="node-watch">
      <rect class="verdict" x="40" y="436" width="880" height="72" rx="10"/>
      <text class="verdict-label" x="64" y="480">WATCH</text>
      <text class="verdict-mono" x="150" y="464">watch -n 2 'cmd'</text>
      <text class="verdict-text" x="300" y="464">repite el comando cada 2 s a pantalla limpia.</text>
      <text class="verdict-text" x="150" y="490">El monitor no protege de SIGHUP: sólo refresca la salida en pantalla.</text>
    </g>
  </g>
</svg>
