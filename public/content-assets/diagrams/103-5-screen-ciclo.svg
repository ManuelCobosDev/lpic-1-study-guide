<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="screen-title screen-desc">
  <title id="screen-title">Ciclo de vida de una sesión de GNU screen: crear, desacoplar y reanudar (LPIC-1 103.5)</title>
  <desc id="screen-desc">Una sesión de screen sobrevive al cierre del SSH en tres pasos. Primero se crea con screen -S seguido de un nombre, y la opción -t nombra la ventana inicial; dentro se abren editores, compilaciones o migraciones. Después se desacopla con Ctrl+A y la tecla d: la pantalla se desengancha, se puede cerrar la conexión y los programas siguen vivos en el servidor, con screen -ls mostrándolos como Detached. Por último se reanuda con screen -r nombre desde cualquier equipo, y la sesión vuelve intacta donde se dejó; la variante -d -r fuerza la reconexión.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-mid { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .card-mono-slate { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .anno-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .anno-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .node-note { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="screen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">GNU SCREEN · SESIÓN PERSISTENTE</text>
    <text class="title" x="40" y="78">Sobrevivir al cierre del SSH</text>
    <text class="subtitle" x="40" y="102">Crear, desenganchar y volver a la misma pantalla.</text>
  </g>

  <g id="diagram-relations">
    <path id="screen-rel-1-2" class="edge" data-from="node-crear" data-to="node-desacoplar" data-relation="ctrl-a-d" d="M 348 208 V 240" marker-end="url(#screen-arrow)"/>
    <path id="screen-rel-2-3" class="edge" data-from="node-desacoplar" data-to="node-reanudar" data-relation="screen-r" d="M 348 328 V 360" marker-end="url(#screen-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-crear">
      <rect class="card" x="96" y="120" width="504" height="88" rx="10"/>
      <text class="card-mono" x="120" y="152">screen -S backup</text>
      <text class="card-text" x="120" y="180">Abres vi, compilas o migras la BD</text>
      <text class="card-text" x="120" y="202">La terminal queda enganchada a la sesión</text>
    </g>

    <g id="node-desacoplar">
      <rect class="card-mid" x="96" y="240" width="504" height="88" rx="10"/>
      <text class="card-mono-slate" x="120" y="272">Ctrl+A d</text>
      <text class="card-text" x="120" y="300">La pantalla se desengancha y cae el SSH</text>
      <text class="card-text" x="120" y="322">Los programas siguen vivos en el servidor</text>
    </g>

    <g id="node-reanudar">
      <rect class="card" x="96" y="360" width="504" height="88" rx="10"/>
      <text class="card-mono" x="120" y="392">screen -r backup</text>
      <text class="card-text" x="120" y="420">Reconectas por SSH desde otro equipo</text>
      <text class="card-text" x="120" y="442">La pantalla vuelve donde la dejaste</text>
    </g>

    <g id="node-nota">
      <rect class="node-note" x="40" y="464" width="880" height="44" rx="10"/>
      <text class="note" x="62" y="492">screen -ls lista las sesiones; screen -S backup -X quit la cierra sin reengancharte.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="64" cy="164" r="15"/>
    <text class="badge-num" x="64" y="169">1</text>
    <circle class="badge" cx="64" cy="284" r="15"/>
    <text class="badge-num" x="64" y="289">2</text>
    <circle class="badge" cx="64" cy="404" r="15"/>
    <text class="badge-num" x="64" y="409">3</text>

    <text class="anno-head" x="624" y="158">Crear la sesión</text>
    <text class="anno-sub" x="624" y="180">-t &lt;título&gt; nombra la ventana</text>

    <text class="anno-head" x="624" y="278">Desacoplar (detach)</text>
    <text class="anno-sub" x="624" y="300">screen -ls la muestra Detached</text>

    <text class="anno-head" x="624" y="398">Reanudar (resume)</text>
    <text class="anno-sub" x="624" y="420">-d -r fuerza la reconexión</text>
  </g>
</svg>
