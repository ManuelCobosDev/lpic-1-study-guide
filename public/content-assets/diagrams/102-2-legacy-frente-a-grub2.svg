<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="glg-title glg-desc">
  <title id="glg-title">GRUB Legacy frente a GRUB 2: archivo de menú, sintaxis e índice de partición (LPIC-1 102.2)</title>
  <desc id="glg-desc">Dos paneles enfrentados con cinco filas comparables. A la izquierda, GRUB Legacy (versión 0.9x) se configura a mano en /boot/grub/menu.lst o grub.conf, declara las entradas con title, carga el núcleo con kernel y numera las particiones desde cero, de modo que la primera es (hd0,0). A la derecha, GRUB 2 (versiones 1.9x y 2.x) genera /boot/grub/grub.cfg con grub-mkconfig, declara las entradas con menuentry, carga el núcleo con linux y numera las particiones desde uno, de modo que la primera es (hd0,1).</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 21px; font-weight: 700; fill: #0F172A; }
      .head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 21px; font-weight: 700; fill: #1E36AF; }
      .head-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #475569; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .val { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .val-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · GESTORES DE ARRANQUE</text>
    <text class="title" x="40" y="78">GRUB Legacy frente a GRUB 2</text>
    <text class="subtitle" x="40" y="102">Cinco filas, cinco respuestas de examen.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-legacy">
      <rect class="panel-a" x="40" y="124" width="420" height="312" rx="10"/>
      <text class="head-a" x="64" y="156">GRUB Legacy</text>
      <text class="head-sub" x="64" y="176">versión 0.9x · heredado</text>
      <line class="divider" x1="64" y1="188" x2="436" y2="188"/>

      <text class="row-label" x="64" y="208">ARCHIVO DE MENÚ</text>
      <text class="val-mono" x="64" y="229">/boot/grub/menu.lst (o grub.conf)</text>
      <line class="divider" x1="64" y1="240" x2="436" y2="240"/>

      <text class="row-label" x="64" y="256">EDICIÓN</text>
      <text class="val" x="64" y="277">Se edita a mano con nano o vim</text>
      <line class="divider" x1="64" y1="288" x2="436" y2="288"/>

      <text class="row-label" x="64" y="304">ENTRADA DE MENÚ</text>
      <text class="val-mono" x="64" y="325">title Debian GNU/Linux</text>
      <line class="divider" x1="64" y1="336" x2="436" y2="336"/>

      <text class="row-label" x="64" y="352">CARGAR EL NÚCLEO</text>
      <text class="val-mono" x="64" y="373">kernel /vmlinuz...</text>
      <line class="divider" x1="64" y1="384" x2="436" y2="384"/>

      <text class="row-label" x="64" y="400">PRIMERA PARTICIÓN</text>
      <text class="val-mono" x="64" y="421">(hd0,0)</text>
    </g>

    <g id="node-panel-grub2">
      <rect class="panel-b" x="500" y="124" width="420" height="312" rx="10"/>
      <text class="head-b" x="524" y="156">GRUB 2</text>
      <text class="head-sub" x="524" y="176">versiones 1.9x y 2.x · estándar</text>
      <line class="divider" x1="524" y1="188" x2="896" y2="188"/>

      <text class="row-label" x="524" y="208">ARCHIVO DE MENÚ</text>
      <text class="val-mono" x="524" y="229">/boot/grub/grub.cfg</text>
      <line class="divider" x1="524" y1="240" x2="896" y2="240"/>

      <text class="row-label" x="524" y="256">EDICIÓN</text>
      <text class="val" x="524" y="277">Nunca: lo regenera grub-mkconfig</text>
      <line class="divider" x1="524" y1="288" x2="896" y2="288"/>

      <text class="row-label" x="524" y="304">ENTRADA DE MENÚ</text>
      <text class="val-mono" x="524" y="325">menuentry "Debian GNU/Linux" {</text>
      <line class="divider" x1="524" y1="336" x2="896" y2="336"/>

      <text class="row-label" x="524" y="352">CARGAR EL NÚCLEO</text>
      <text class="val-mono" x="524" y="373">linux /boot/vmlinuz...</text>
      <line class="divider" x1="524" y1="384" x2="896" y2="384"/>

      <text class="row-label" x="524" y="400">PRIMERA PARTICIÓN</text>
      <text class="val-mono" x="524" y="421">(hd0,1)</text>
    </g>

    <g id="node-verdict">
      <rect class="verdict" x="40" y="448" width="880" height="56" rx="10"/>
      <text class="verdict-label" x="64" y="482">EN UNA LÍNEA</text>
      <text class="verdict-text" x="190" y="482">Legacy: menu.lst, title, kernel, (hd0,0). GRUB 2: grub.cfg, menuentry, linux, (hd0,1).</text>
    </g>
  </g>
</svg>
