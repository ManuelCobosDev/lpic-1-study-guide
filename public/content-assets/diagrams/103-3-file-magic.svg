<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="file-magic-title file-magic-desc">
  <title id="file-magic-title">Los números mágicos que identifican el formato de un fichero (LPIC-1 103.3)</title>
  <desc id="file-magic-desc">file no se fía de la extensión: lee los primeros 2 a 8 bytes del archivo, llamados números mágicos, y los compara con su base de firmas. Un script empieza por #!, cuyos bytes son 0x23 0x21, y lo ejecuta la shell; un ejecutable Linux empieza por los bytes \x7FELF del formato ELF; y una imagen PNG empieza por \x89PNG. El resto del archivo no se inspecciona para identificarlo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .file-box { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .file-head { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .file-rest { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .head-bytes { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #B45309; }
      .head-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #B45309; }
      .body-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .magic { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .card-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">file · NÚMEROS MÁGICOS</text>
    <text class="title" x="40" y="78">Los primeros bytes delatan el formato</text>
    <text class="subtitle" x="40" y="102">2 a 8 bytes de cabecera que no dependen del nombre.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-fichero">
      <rect class="file-box" x="60" y="160" width="240" height="280" rx="8"/>
      <rect class="file-head" x="72" y="172" width="216" height="62" rx="6"/>
      <rect class="file-rest" x="72" y="246" width="216" height="182" rx="6"/>
      <text class="head-bytes" x="90" y="200">2–8 bytes</text>
      <text class="head-note" x="90" y="222">cabecera</text>
      <text class="body-note" x="80" y="300">el resto del archivo</text>
      <text class="body-note" x="80" y="322">no se inspecciona</text>
      <text class="body-note" x="80" y="344">para identificarlo.</text>
    </g>

    <g id="node-script">
      <rect class="card" x="330" y="160" width="590" height="84" rx="8"/>
      <text class="magic" x="352" y="196">#!</text>
      <text class="card-title" x="470" y="192">script de shell</text>
      <text class="card-body" x="470" y="218">0x23 0x21 · el texto que ejecuta la shell</text>
    </g>

    <g id="node-elf">
      <rect class="card" x="330" y="258" width="590" height="84" rx="8"/>
      <text class="magic" x="352" y="294">\x7FELF</text>
      <text class="card-title" x="470" y="290">ejecutable de Linux</text>
      <text class="card-body" x="470" y="316">formato ELF que el kernel puede cargar</text>
    </g>

    <g id="node-png">
      <rect class="card" x="330" y="356" width="590" height="84" rx="8"/>
      <text class="magic" x="352" y="392">\x89PNG</text>
      <text class="card-title" x="470" y="388">imagen PNG</text>
      <text class="card-body" x="470" y="414">cabecera de imagen, no de texto</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="474">Renombrar foto.jpg a foto.mp3 no engaña a file: lee los bytes.</text>
    <text class="note" x="40" y="498">Con file -i se obtiene el MIME: image/jpeg o application/pdf.</text>
  </g>
</svg>
