<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rl-title rl-desc">
  <title id="rl-title">Niveles de ejecución de SysVinit del 0 al 6 y sus transiciones (LPIC-1 101.3)</title>
  <desc id="rl-desc">SysVinit define siete niveles de ejecución. El nivel 0 apaga el equipo, el 1 es el modo monousuario de rescate, el 2 una consola básica sin NFS, el 3 el modo texto multiusuario con red, el 4 queda libre para el administrador, el 5 arranca el entorno gráfico completo y el 6 reinicia la máquina. La orden telinit N pide a init cambiar de nivel en caliente: desde el 1 se sube al 3 y al 5, y desde el 5 se puede apagar en el 0 o reiniciar en el 6. Los niveles 0 y 6 nunca deben ser el nivel predeterminado.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .level { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .level-top { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .level-end { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono-lvl { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .sub-13 { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .sub-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-warn { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>

    <marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="rl-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SYSVINIT · SIETE ESTADOS</text>
    <text class="title" x="40" y="78">Siete niveles, un solo init</text>
    <text class="subtitle" x="40" y="102">telinit N cambia el nivel; 0 apaga y 6 reinicia</text>
  </g>

  <g id="diagram-relations">
    <path id="rl-rel-1-3" class="edge" data-from="node-rl1" data-to="node-rl3" data-relation="telinit-3"
          d="M 260 279 H 305 V 165 H 370" marker-end="url(#rl-arrow)"/>
    <path id="rl-rel-3-5" class="edge" data-from="node-rl3" data-to="node-rl5" data-relation="telinit-5"
          d="M 590 165 H 650 V 279 H 700" marker-end="url(#rl-arrow)"/>
    <path id="rl-rel-5-0" class="edge-warn" data-from="node-rl5" data-to="node-rl0" data-relation="telinit-0"
          d="M 810 314 V 350 H 290 V 400" marker-end="url(#rl-arrow-warn)"/>
    <path id="rl-rel-5-6" class="edge-warn" data-from="node-rl5" data-to="node-rl6" data-relation="telinit-6"
          d="M 870 314 V 433 H 740" marker-end="url(#rl-arrow-warn)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-rl1">
      <rect class="level" x="40" y="248" width="220" height="66" rx="10"/>
      <text class="mono-lvl" x="64" y="272">1 · rescate</text>
      <text class="sub-13" x="64" y="292">monousuario</text>
      <text class="sub-13" x="64" y="308">solo root, sin red</text>
    </g>

    <g id="node-rl3">
      <rect class="level-top" x="370" y="134" width="220" height="66" rx="10"/>
      <text class="mono-lvl" x="394" y="158">3 · servidor</text>
      <text class="sub-13" x="394" y="178">texto multiusuario</text>
      <text class="sub-13" x="394" y="194">con red</text>
    </g>

    <g id="node-rl5">
      <rect class="level-top" x="700" y="248" width="220" height="66" rx="10"/>
      <text class="mono-lvl" x="724" y="272">5 · escritorio</text>
      <text class="sub-13" x="724" y="292">entorno gráfico</text>
      <text class="sub-13" x="724" y="308">completo</text>
    </g>

    <g id="node-rl0">
      <rect class="level-end" x="180" y="400" width="220" height="66" rx="10"/>
      <text class="mono-lvl" x="204" y="424">0 · apagado</text>
      <text class="sub-13" x="204" y="444">corta la corriente</text>
      <text class="sub-13" x="204" y="460">del equipo</text>
    </g>

    <g id="node-rl6">
      <rect class="level-end" x="520" y="400" width="220" height="66" rx="10"/>
      <text class="mono-lvl" x="544" y="424">6 · reinicio</text>
      <text class="sub-13" x="544" y="444">reinicio ordenado</text>
      <text class="sub-13" x="544" y="460">del sistema</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="mono-cmd" x="480" y="300">telinit N</text>
    <text class="sub-center" x="480" y="322">cambia de nivel en caliente</text>
    <text class="note" x="40" y="482">Nivel 2: consola básica sin NFS.</text>
    <text class="note" x="40" y="502">Nivel 4: personalizado, libre para el admin.</text>
  </g>
</svg>
