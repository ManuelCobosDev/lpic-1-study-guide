<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mbr-512-title mbr-512-desc">
  <title id="mbr-512-title">Anatomía de los 512 bytes del MBR copiados con dd (LPIC-1 103.3)</title>
  <desc id="mbr-512-desc">El primer sector del disco mide 512 bytes y se divide en tres zonas: los primeros 446 bytes contienen el cargador de arranque (GRUB), los 64 bytes siguientes son la tabla de particiones con cuatro entradas de 16 bytes cada una, y los últimos 2 bytes son la firma 0x55AA. El comando dd if=/dev/sda of=mbr.bin bs=512 count=1 copia exactamente ese sector, y para restaurarlo se invierte el sentido con dd if=mbr.bin of=/dev/sda bs=512 count=1.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .ribbon { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
      .command { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .seg-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .seg-table { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .seg-sign { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .bytes-hw { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; }
      .bytes { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .band-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 600; fill: #881337; }
      .scale-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">dd · PRIMER SECTOR</text>
    <text class="title" x="40" y="78">Los 512 bytes del MBR</text>
    <text class="subtitle" x="40" y="102">446 de cargador, 64 de tabla y 2 de firma.</text>
    <rect class="ribbon" x="40" y="140" width="880" height="52" rx="8"/>
    <text class="command" x="480" y="173">dd if=/dev/sda of=mbr.bin bs=512 count=1</text>
    <text class="scale-note" x="920" y="203" text-anchor="end">esquema no a escala</text>
  </g>

  <g id="diagram-relations">
    <line class="guide" x1="300" y1="290" x2="300" y2="318"/>
    <line class="guide" x1="680" y1="290" x2="680" y2="318"/>
    <line class="guide" x1="860" y1="290" x2="860" y2="318"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-bootloader">
      <rect class="seg-hw" x="40" y="210" width="520" height="80" rx="6"/>
      <text class="bytes-hw" x="300" y="258">446 bytes</text>
    </g>
    <g id="node-tabla">
      <rect class="seg-table" x="560" y="210" width="240" height="80" rx="6"/>
      <text class="bytes" x="680" y="258">64 bytes</text>
    </g>
    <g id="node-firma">
      <rect class="seg-sign" x="800" y="210" width="120" height="80" rx="6"/>
      <text class="bytes" x="860" y="258">2 bytes</text>
    </g>

    <g id="node-restaurar">
      <rect class="band" x="40" y="392" width="880" height="116" rx="10"/>
      <text class="band-title" x="62" y="424">Respalda el MBR antes de tocar las particiones</text>
      <text class="band-body" x="62" y="452">Si el arranque se daña, se restaura invirtiendo el sentido en un segundo:</text>
      <text class="band-mono" x="62" y="478">dd if=mbr.bin of=/dev/sda bs=512 count=1</text>
      <text class="band-body" x="62" y="500">Úsalo antes de particionar con fdisk o de instalar un arranque dual.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="label" x="300" y="340">Bootloader (GRUB)</text>
    <text class="detail" x="300" y="362">salta al sector de arranque</text>
    <text class="label" x="680" y="340">Tabla de particiones</text>
    <text class="detail" x="680" y="362">4 entradas de 16 bytes</text>
    <text class="label" x="860" y="340">Firma 0x55AA</text>
    <text class="detail" x="860" y="362">marca de arranque</text>
  </g>
</svg>
