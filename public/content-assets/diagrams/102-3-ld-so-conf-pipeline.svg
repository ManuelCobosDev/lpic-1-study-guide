<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ldconf-title ldconf-desc">
  <title id="ldconf-title">Flujo de cuatro pasos para registrar una ruta de librerías con /etc/ld.so.conf.d y ldconfig (LPIC-1 102.3)</title>
  <desc id="ldconf-desc">El programa falla porque la librería está instalada en /opt/oracle/lib y el sistema solo busca en /lib y /usr/lib. El administrador crea /etc/ld.so.conf.d/oracle.conf con una única línea que apunta a ese directorio, sin tocar el archivo maestro. El programa sigue fallando porque el enlazador dinámico no lee archivos de texto al arrancar: solo consulta la caché binaria /etc/ld.so.cache. El cuarto paso, sudo ldconfig, compila esa caché y el programa arranca. /etc/ld.so.conf contiene la directiva include /etc/ld.so.conf.d/*.conf.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .card-title-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .card-text-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
      .band-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .band-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #881337; }
      .warn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #881337; }
      .file-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="ldconf-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">RUTAS NUEVAS · CONFIGURACIÓN Y LDCONFIG</text>
    <text class="title" x="40" y="78">Cuatro pasos para registrar /opt/oracle/lib</text>
    <text class="subtitle" x="40" y="102">Escribir la ruta no basta: hay que compilar la caché</text>
  </g>

  <g id="diagram-relations">
    <path id="ldconf-rel-1-2" class="edge-blue" data-from="node-paso-falla" data-to="node-paso-conf" data-relation="siguiente-paso"
          d="M 239 210 H 267" marker-end="url(#ldconf-arrow-blue)"/>
    <path id="ldconf-rel-2-3" class="edge-blue" data-from="node-paso-conf" data-to="node-paso-trampa" data-relation="siguiente-paso"
          d="M 466 210 H 494" marker-end="url(#ldconf-arrow-blue)"/>
    <path id="ldconf-rel-3-4" class="edge-blue" data-from="node-paso-trampa" data-to="node-paso-ldconfig" data-relation="siguiente-paso"
          d="M 693 210 H 721" marker-end="url(#ldconf-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-paso-falla">
      <rect class="card-warn" x="40" y="150" width="199" height="120" rx="10"/>
      <circle class="badge" cx="64" cy="178" r="14"/>
      <text class="badge-num" x="64" y="183">1</text>
      <text class="card-title" x="64" y="212">El programa falla</text>
      <text class="card-mono" x="64" y="238">/opt/oracle/lib</text>
      <text class="card-text-warn" x="64" y="260">fuera de /lib y /usr/lib</text>
    </g>

    <g id="node-paso-conf">
      <rect class="card" x="267" y="150" width="199" height="120" rx="10"/>
      <circle class="badge" cx="291" cy="178" r="14"/>
      <text class="badge-num" x="291" y="183">2</text>
      <text class="card-title" x="291" y="212">Avisar al sistema</text>
      <text class="card-mono" x="291" y="238">/etc/ld.so.conf.d/</text>
      <text class="card-text" x="291" y="260">oracle.conf con la ruta</text>
    </g>

    <g id="node-paso-trampa">
      <rect class="card-warn" x="494" y="150" width="199" height="120" rx="10"/>
      <circle class="badge" cx="518" cy="178" r="14"/>
      <text class="badge-num" x="518" y="183">3</text>
      <text class="card-title" x="518" y="212">Aún no funciona</text>
      <text class="card-text-warn" x="518" y="238">el enlazador no lee</text>
      <text class="card-text-warn" x="518" y="260">texto al arrancar</text>
    </g>

    <g id="node-paso-ldconfig">
      <rect class="card-ok" x="721" y="150" width="199" height="120" rx="10"/>
      <circle class="badge" cx="745" cy="178" r="14"/>
      <text class="badge-num" x="745" y="183">4</text>
      <text class="card-title-mono" x="745" y="212">sudo ldconfig</text>
      <text class="card-mono" x="745" y="238">/etc/ld.so.cache</text>
      <text class="card-text" x="745" y="260">arranca y funciona</text>
    </g>

    <g id="node-banda-trampa">
      <rect class="band-warn" x="40" y="300" width="880" height="100" rx="10"/>
      <text class="warn-title" x="64" y="332">Por qué el paso 3 es la trampa de examen</text>
      <text class="warn-text" x="64" y="360">El archivo .conf ya está escrito, pero el programa sigue fallando: ld.so no lee</text>
      <text class="warn-text" x="64" y="384">texto al arrancar, solo la caché binaria /etc/ld.so.cache.</text>
    </g>

    <g id="node-banda-ficheros">
      <rect class="band-file" x="40" y="418" width="880" height="90" rx="10"/>
      <text class="file-text" x="64" y="448">/etc/ld.so.conf guarda la línea: include /etc/ld.so.conf.d/*.conf</text>
      <text class="file-text" x="64" y="476">/etc/ld.so.conf.d/*.conf: un fichero por programa, sin tocar el maestro.</text>
    </g>
  </g>
</svg>
