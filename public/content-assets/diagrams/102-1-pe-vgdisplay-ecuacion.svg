<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pe-title pe-desc">
  <title id="pe-title">La ecuación del Physical Extent en vgdisplay (LPIC-1 102.1)</title>
  <desc id="pe-desc">El grupo de volúmenes vg_datos tiene un PE Size de 4.00 MiB y un Total PE de 25596. La barra reparte esas piezas entre 19200 Alloc PE (75.00 GiB, ocupados por lv_root de 50 GB y lv_var de 25 GB) y 6396 Free PE (24.98 GiB). La ecuación de examen es Total PE = Alloc PE + Free PE: 19200 + 6396 = 25596 piezas, y 25596 por 4 MiB da 102384 MiB, unos 100 GB de capacidad.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .bar-alloc { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .bar-free { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .bar-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .bar-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .card-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; text-anchor: middle; }
      .card-value { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 28px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .card-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .op { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .top-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #334155; }
      .top-label-end { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #334155; text-anchor: end; }
      .note-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #1E36AF; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · INSPECCIÓN DE LVM</text>
    <text class="title" x="40" y="78">La ecuación del Physical Extent</text>
    <text class="subtitle" x="40" y="102">vgdisplay resume el grupo en piezas de 4 MiB</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-bar-alloc">
      <rect class="bar-alloc" x="40" y="176" width="660" height="76" rx="8"/>
      <text class="bar-name" x="370" y="206">Alloc PE 19200 · 75.00 GiB</text>
      <text class="bar-sub" x="370" y="228">lv_root 50.00g + lv_var 25.00g</text>
    </g>

    <g id="node-bar-free">
      <rect class="bar-free" x="700" y="176" width="220" height="76" rx="8"/>
      <text class="bar-name" x="810" y="206">Free PE 6396</text>
      <text class="bar-sub" x="810" y="228">24.98 GiB</text>
    </g>

    <g id="node-eq-alloc">
      <rect class="card" x="60" y="300" width="240" height="94" rx="10"/>
      <text class="card-label" x="180" y="326">ALLOC PE</text>
      <text class="card-value" x="180" y="360">19200</text>
      <text class="card-sub" x="180" y="382">75.00 GiB en uso</text>
    </g>

    <g id="node-eq-free">
      <rect class="card" x="350" y="300" width="240" height="94" rx="10"/>
      <text class="card-label" x="470" y="326">FREE PE</text>
      <text class="card-value" x="470" y="360">6396</text>
      <text class="card-sub" x="470" y="382">24.98 GiB libres</text>
    </g>

    <g id="node-eq-total">
      <rect class="card" x="640" y="300" width="260" height="94" rx="10"/>
      <text class="card-label" x="770" y="326">TOTAL PE</text>
      <text class="card-value" x="770" y="360">25596</text>
      <text class="card-sub" x="770" y="382">≈ 100 GB de capacidad</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="top-label" x="40" y="160">PE Size 4.00 MiB</text>
    <text class="top-label-end" x="920" y="160">Total PE 25596</text>
    <text class="op" x="320" y="357">+</text>
    <text class="op" x="610" y="357">=</text>
    <text class="note-mono" x="40" y="436">25596 PE × 4 MiB = 102384 MiB ≈ 100 GB</text>
    <text class="note" x="40" y="462">Puedes ampliar /var como máximo 24.98 GiB: el Free PE restante</text>
  </g>
</svg>
