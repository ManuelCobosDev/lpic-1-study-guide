<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="orden-title orden-desc">
  <title id="orden-title">Orden de búsqueda del enlazador dinámico ld.so (LPIC-1 102.3)</title>
  <desc id="orden-desc">Ante un binario ELF, el enlazador dinámico consulta cuatro fuentes en un orden inflexible: primero RPATH o RUNPATH incrustado en la cabecera ELF al compilar con gcc -Wl,-rpath, después la variable de sesión LD_LIBRARY_PATH, que se ignora si el binario es SUID o SGID, en tercer lugar la caché binaria /etc/ld.so.cache generada por ldconfig desde /etc/ld.so.conf, y por último los directorios base /lib y /usr/lib, que actúan como red de seguridad aunque la caché esté vacía o corrupta.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="orden-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LD.SO · ORDEN DE BÚSQUEDA</text>
    <text class="title" x="40" y="78">El orden inflexible del enlazador</text>
    <text class="subtitle" x="40" y="102">Cuatro fuentes, siempre en este orden</text>
  </g>

  <g id="diagram-relations">
    <path id="orden-rel-1-2" class="edge-blue" data-from="node-rpath" data-to="node-ldpath" data-relation="consulta-despues"
          d="M 296 196 V 222" marker-end="url(#orden-arrow-blue)"/>
    <path id="orden-rel-2-3" class="edge-blue" data-from="node-ldpath" data-to="node-cache" data-relation="consulta-despues"
          d="M 296 286 V 312" marker-end="url(#orden-arrow-blue)"/>
    <path id="orden-rel-3-4" class="edge-blue" data-from="node-cache" data-to="node-base" data-relation="consulta-despues"
          d="M 296 376 V 402" marker-end="url(#orden-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-rpath">
      <rect class="node-cmd" x="72" y="132" width="448" height="64" rx="10"/>
      <text class="name" x="96" y="158">RPATH / RUNPATH</text>
      <text class="role" x="96" y="182">incrustado en la cabecera ELF</text>
    </g>

    <g id="node-ldpath">
      <rect class="node-iface" x="72" y="222" width="448" height="64" rx="10"/>
      <text class="name" x="96" y="248">LD_LIBRARY_PATH</text>
      <text class="role" x="96" y="272">variable de entorno del usuario</text>
    </g>

    <g id="node-cache">
      <rect class="node-file" x="72" y="312" width="448" height="64" rx="10"/>
      <text class="name" x="96" y="338">/etc/ld.so.cache</text>
      <text class="role" x="96" y="362">caché binaria indexada</text>
    </g>

    <g id="node-base">
      <rect class="node-kernel" x="72" y="402" width="448" height="64" rx="10"/>
      <text class="name" x="96" y="428">/lib y /usr/lib</text>
      <text class="role" x="96" y="452">directorios base del sistema</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="44" cy="164" r="15"/>
    <text class="badge-num" x="44" y="169">1</text>
    <text class="note" x="548" y="158">Fijadas al compilar con gcc -Wl,-rpath.</text>
    <text class="note" x="548" y="182">Va primero: el software de /opt usa las suyas.</text>

    <circle class="badge" cx="44" cy="254" r="15"/>
    <text class="badge-num" x="44" y="259">2</text>
    <text class="note" x="548" y="248">Directorios temporales de la sesión.</text>
    <text class="note" x="548" y="272">Se ignora si el binario es SUID o SGID.</text>

    <circle class="badge" cx="44" cy="344" r="15"/>
    <text class="badge-num" x="44" y="349">3</text>
    <text class="note" x="548" y="338">Índice binario hecho por ldconfig desde</text>
    <text class="note" x="548" y="362">/etc/ld.so.conf: resuelve el 99 % de los casos.</text>

    <circle class="badge" cx="44" cy="434" r="15"/>
    <text class="badge-num" x="44" y="439">4</text>
    <text class="note" x="548" y="428">Red de seguridad: se consultan siempre,</text>
    <text class="note" x="548" y="452">aunque la caché esté vacía o corrupta.</text>
  </g>
</svg>
