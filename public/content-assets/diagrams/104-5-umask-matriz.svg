<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="umatriz-title umatriz-desc">
  <title id="umatriz-title">Escala de privacidad de las umask 022, 002, 027 y 077 (LPIC-1 104.5)</title>
  <desc id="umatriz-desc">Cuatro perfiles de umask ordenados de menos a más restrictiva. La máscara 022 deja los archivos en 644 y los directorios en 755; la 002, propia de grupos privados de usuario, deja 664 y 775; la 027 deja 640 y 750, con el grupo solo en lectura y otros sin acceso; y la 077 deja 600 y 700, con acceso exclusivo del propietario. La banda inferior resume que al subir la máscara el grupo y otros pierden permisos, y aplica el cálculo a 027.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .level-card { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .level-mask { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 28px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .level-file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #0F172A; text-anchor: middle; }
      .level-dir { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #334155; text-anchor: middle; }
      .note-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .note-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #1E36AF; }
      .note-body { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">umask · MATRIZ DE VALORES</text>
    <text class="title" x="40" y="78">Cuanto más alta, más privada</text>
    <text class="subtitle" x="40" y="102">Cuatro máscaras y sus dos resultados</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-level-022">
      <rect class="level-card" x="60" y="248" width="200" height="100" rx="10"/>
      <text class="level-mask" x="160" y="280">022</text>
      <text class="level-file" x="160" y="306">archivo 644</text>
      <text class="level-dir" x="160" y="328">directorio 755</text>
    </g>

    <g id="node-level-002">
      <rect class="level-card" x="280" y="214" width="200" height="100" rx="10"/>
      <text class="level-mask" x="380" y="246">002</text>
      <text class="level-file" x="380" y="272">archivo 664</text>
      <text class="level-dir" x="380" y="294">directorio 775</text>
    </g>

    <g id="node-level-027">
      <rect class="level-card" x="500" y="180" width="200" height="100" rx="10"/>
      <text class="level-mask" x="600" y="212">027</text>
      <text class="level-file" x="600" y="238">archivo 640</text>
      <text class="level-dir" x="600" y="260">directorio 750</text>
    </g>

    <g id="node-level-077">
      <rect class="level-card" x="720" y="146" width="200" height="100" rx="10"/>
      <text class="level-mask" x="820" y="178">077</text>
      <text class="level-file" x="820" y="204">archivo 600</text>
      <text class="level-dir" x="820" y="226">directorio 700</text>
    </g>

    <g id="node-nota">
      <rect class="note-band" x="40" y="384" width="880" height="84" rx="10"/>
      <text class="note-title" x="64" y="416">De 022 a 077 el acceso baja: el grupo y otros pierden permisos.</text>
      <text class="note-body" x="64" y="446">Con 027: 666 - 027 = 640 y 777 - 027 = 750.</text>
    </g>
  </g>
</svg>
