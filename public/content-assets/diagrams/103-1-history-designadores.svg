<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-history-title p1031-history-desc">
  <title id="p1031-history-title">Designadores de expansión del historial de Bash (LPIC-1 103.1)</title>
  <desc id="p1031-history-desc">El historial de Bash numera las órdenes ejecutadas de la 1046 a la 1050. Cada designador recupera una línea distinta: !1046 la recupera por número, !systemctl por prefijo del comando, !-3 y !-2 por posición relativa hacia atrás, y !! la última orden ejecutada. La banda inferior recuerda que sudo !! repite la última orden con sudo delante y que Ctrl+R abre una búsqueda inversa incremental.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .col-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #64748B; }
      .row { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .row-last { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .hist { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .hist-num { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #64748B; }
      .chip { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .chip-last { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .designator { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .chip-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; text-anchor: end; }
      .band { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="p1031-history-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">HISTORY · DESIGNADORES DE EXPANSIÓN</text>
    <text class="title" x="40" y="78">Cómo se recupera una orden del historial</text>
    <text class="subtitle" x="40" y="102">Bash numera cada orden ejecutada; los designadores</text>
    <text class="subtitle" x="40" y="122">la recuperan sin volver a escribirla.</text>
  </g>

  <g id="diagram-nodes">
    <g id="hist-1046">
      <rect class="row" x="40" y="160" width="430" height="44" rx="8"/>
      <text class="hist-num" x="60" y="188">1046</text>
      <text class="hist" x="120" y="188">ls -la /var/log</text>
    </g>
    <g id="hist-1047">
      <rect class="row" x="40" y="212" width="430" height="44" rx="8"/>
      <text class="hist-num" x="60" y="240">1047</text>
      <text class="hist" x="120" y="240">systemctl status nginx</text>
    </g>
    <g id="hist-1048">
      <rect class="row" x="40" y="264" width="430" height="44" rx="8"/>
      <text class="hist-num" x="60" y="292">1048</text>
      <text class="hist" x="120" y="292">tail -f /var/log/syslog</text>
    </g>
    <g id="hist-1049">
      <rect class="row" x="40" y="316" width="430" height="44" rx="8"/>
      <text class="hist-num" x="60" y="344">1049</text>
      <text class="hist" x="120" y="344">cd /etc/nginx</text>
    </g>
    <g id="hist-1050">
      <rect class="row-last" x="40" y="368" width="430" height="44" rx="8"/>
      <text class="hist-num" x="60" y="396">1050</text>
      <text class="hist" x="120" y="396">apt-get update</text>
    </g>

    <g id="des-1046">
      <rect class="chip" x="560" y="160" width="360" height="44" rx="8"/>
      <text class="designator" x="580" y="188">!1046</text>
      <text class="chip-desc" x="900" y="188">por número de línea</text>
    </g>
    <g id="des-systemctl">
      <rect class="chip" x="560" y="212" width="360" height="44" rx="8"/>
      <text class="designator" x="580" y="240">!systemctl</text>
      <text class="chip-desc" x="900" y="240">por prefijo</text>
    </g>
    <g id="des-minus3">
      <rect class="chip" x="560" y="264" width="360" height="44" rx="8"/>
      <text class="designator" x="580" y="292">!-3</text>
      <text class="chip-desc" x="900" y="292">tres pasos atrás</text>
    </g>
    <g id="des-minus2">
      <rect class="chip" x="560" y="316" width="360" height="44" rx="8"/>
      <text class="designator" x="580" y="344">!-2</text>
      <text class="chip-desc" x="900" y="344">dos pasos atrás</text>
    </g>
    <g id="des-last">
      <rect class="chip-last" x="560" y="368" width="360" height="44" rx="8"/>
      <text class="designator" x="580" y="396">!!</text>
      <text class="chip-desc" x="900" y="396">la última orden</text>
    </g>

    <g id="band-extra">
      <rect class="band" x="40" y="438" width="880" height="58" rx="10"/>
      <text class="band-mono" x="60" y="462">sudo !!</text>
      <text class="band-text" x="140" y="462">repite la última orden anteponiendo sudo.</text>
      <text class="band-mono" x="60" y="484">Ctrl+R</text>
      <text class="band-text" x="140" y="484">abre la búsqueda inversa incremental mientras escribes.</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="rel-1046" class="edge" data-from="des-1046" data-to="hist-1046" data-relation="expands-to" d="M 560 182 H 470" marker-end="url(#p1031-history-arrow)"/>
    <path id="rel-systemctl" class="edge" data-from="des-systemctl" data-to="hist-1047" data-relation="expands-to" d="M 560 234 H 470" marker-end="url(#p1031-history-arrow)"/>
    <path id="rel-minus3" class="edge" data-from="des-minus3" data-to="hist-1048" data-relation="expands-to" d="M 560 286 H 470" marker-end="url(#p1031-history-arrow)"/>
    <path id="rel-minus2" class="edge" data-from="des-minus2" data-to="hist-1049" data-relation="expands-to" d="M 560 338 H 470" marker-end="url(#p1031-history-arrow)"/>
    <path id="rel-last" class="edge" data-from="des-last" data-to="hist-1050" data-relation="expands-to" d="M 560 390 H 470" marker-end="url(#p1031-history-arrow)"/>
  </g>

  <g id="diagram-labels">
    <text class="col-label" x="40" y="148">history</text>
    <text class="col-label" x="560" y="148">designador</text>
  </g>
</svg>
