<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gpg-title gpg-desc">
  <title id="gpg-title">Los tres pasos de la firma GPG en RPM: importar la clave, comprobar con -K y auditar con -V (LPIC-1 102.5)</title>
  <desc id="gpg-desc">Secuencia de tres pasos numerados. Primero rpm --import instala la clave pública oficial del distribuidor, como RPM-GPG-KEY-Rocky-9, en /var/lib/rpm/ para validar firmas futuras. Después rpm -K, o --checksig, comprueba el hash SHA256 y la firma GPG del archivo .rpm antes de instalarlo, y muestra digests signatures OK. Por último rpm -V, o --verify, audita los paquetes ya instalados comparando los ficheros de disco con la base de datos, con las letras S de tamaño, 5 de hash MD5, T de fecha y c de fichero de configuración. La firma garantiza autenticidad del fabricante e integridad del contenido.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .spine { stroke: #1D40D8; stroke-width: 2; opacity: 0.35; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .why-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .why-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .why-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 400; fill: #1E3A8A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">FIRMAS GPG · INTEGRIDAD DE PAQUETES</text>
    <text class="title" x="40" y="78">Importar, comprobar y auditar</text>
    <text class="subtitle" x="40" y="102">La firma se comprueba antes; la integridad, después</text>
  </g>

  <g id="diagram-relations">
    <line id="gpg-spine-1" class="spine" x1="44" y1="171" x2="44" y2="217"/>
    <line id="gpg-spine-2" class="spine" x1="44" y1="247" x2="44" y2="293"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-import">
      <rect class="node-cmd" x="72" y="124" width="370" height="64" rx="10"/>
      <text class="name" x="96" y="150">rpm --import &lt;key&gt;</text>
      <text class="role" x="96" y="174">clave oficial del distribuidor</text>
    </g>

    <g id="node-checksig">
      <rect class="node-cmd" x="72" y="200" width="370" height="64" rx="10"/>
      <text class="name" x="96" y="226">rpm -K</text>
      <text class="role" x="96" y="250">--checksig: comprueba la firma</text>
    </g>

    <g id="node-verify">
      <rect class="node-cmd" x="72" y="276" width="370" height="64" rx="10"/>
      <text class="name" x="96" y="302">rpm -V</text>
      <text class="role" x="96" y="326">--verify: audita lo instalado</text>
    </g>

    <g id="node-porque">
      <rect class="why-band" x="40" y="368" width="880" height="116" rx="10"/>
      <text class="why-head" x="64" y="396">POR QUÉ SON INDISPENSABLES</text>
      <text class="why-body" x="64" y="426">La firma garantiza autenticidad del fabricante (Red Hat, Rocky) e integridad: si un</text>
      <text class="why-body" x="64" y="450">solo byte cambia en el camino, la firma se invalida y la instalación se bloquea.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="44" cy="156" r="15"/>
    <text class="badge-num" x="44" y="161">1</text>
    <text class="note" x="466" y="150">Clave pública oficial del distribuidor,</text>
    <text class="note" x="466" y="172">guardada en /var/lib/rpm/ para validar.</text>

    <circle class="badge" cx="44" cy="232" r="15"/>
    <text class="badge-num" x="44" y="237">2</text>
    <text class="note" x="466" y="226">Comprueba el hash SHA256 y la firma GPG</text>
    <text class="note" x="466" y="248">del .rpm antes de instalarlo.</text>

    <circle class="badge" cx="44" cy="308" r="15"/>
    <text class="badge-num" x="44" y="313">3</text>
    <text class="note" x="466" y="302">Compara los ficheros de disco con la BD.</text>
    <text class="note" x="466" y="324">S tamaño · 5 MD5 · T fecha · c config</text>
  </g>
</svg>
