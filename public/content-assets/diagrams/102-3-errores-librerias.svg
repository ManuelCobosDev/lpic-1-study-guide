<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="errores-title errores-desc">
  <title id="errores-title">Diagnóstico de los cuatro errores de librerías más frecuentes (LPIC-1 102.3)</title>
  <desc id="errores-desc">Cada mensaje de error tiene su pareja de diagnóstico y arreglo. Cuando el cargador dice cannot open shared object file y ldd muestra not found, falta el archivo o su ruta: se localiza con find o apt-file search y se registra en /etc/ld.so.conf.d antes de ejecutar ldconfig. Si la librería está en /usr/local/lib pero la caché no la conoce, basta sudo ldconfig y comprobarlo con ldconfig -p. Un wrong ELF class ELFCLASS32 delata una mezcla de 32 y 64 bits que se confirma con file o objdump -f, y un Permission denied se resuelve con ls -l y chmod 755.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-fix { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .tag-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #BE123C; letter-spacing: 0.05em; }
      .tag-fix { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.05em; }
      .msg-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #881337; }
      .msg-fix { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #065F46; }
      .text-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
      .text-fix { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #065F46; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
    </style>

    <marker id="errores-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">DIAGNÓSTICO · CUATRO ERRORES TÍPICOS</text>
    <text class="title" x="40" y="78">Del mensaje de error a la solución</text>
    <text class="subtitle" x="40" y="102">Síntoma a la izquierda, arreglo a la derecha</text>
  </g>

  <g id="diagram-relations">
    <path id="errores-rel-1" class="edge-slate" data-from="node-error-notfound" data-to="node-fix-notfound" data-relation="se-resuelve-con"
          d="M 450 174 H 490" marker-end="url(#errores-arrow-slate)"/>
    <path id="errores-rel-2" class="edge-slate" data-from="node-error-ldconfig" data-to="node-fix-ldconfig" data-relation="se-resuelve-con"
          d="M 450 266 H 490" marker-end="url(#errores-arrow-slate)"/>
    <path id="errores-rel-3" class="edge-slate" data-from="node-error-bits" data-to="node-fix-bits" data-relation="se-resuelve-con"
          d="M 450 358 H 490" marker-end="url(#errores-arrow-slate)"/>
    <path id="errores-rel-4" class="edge-slate" data-from="node-error-permisos" data-to="node-fix-permisos" data-relation="se-resuelve-con"
          d="M 450 450 H 490" marker-end="url(#errores-arrow-slate)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-error-notfound">
      <rect class="card-warn" x="40" y="132" width="410" height="84" rx="10"/>
      <text class="tag-warn" x="64" y="154">ERROR 1 · NOT FOUND</text>
      <text class="msg-warn" x="64" y="178">libfoo.so.1: cannot open shared object file</text>
      <text class="text-warn" x="64" y="200">Falta el archivo o su ruta no está indexada.</text>
    </g>

    <g id="node-fix-notfound">
      <rect class="card-fix" x="490" y="132" width="430" height="84" rx="10"/>
      <text class="tag-fix" x="514" y="154">DIAGNÓSTICO Y ARREGLO</text>
      <text class="msg-fix" x="514" y="178">ldd /ruta/binario → not found</text>
      <text class="text-fix" x="514" y="200">find / -name libfoo.so.1 · apt-file search · ldconfig</text>
    </g>

    <g id="node-error-ldconfig">
      <rect class="card-warn" x="40" y="224" width="410" height="84" rx="10"/>
      <text class="tag-warn" x="64" y="246">ERROR 2 · CACHÉ DESACTUALIZADA</text>
      <text class="msg-warn" x="64" y="270">el .so está en /usr/local/lib</text>
      <text class="text-warn" x="64" y="292">pero la caché aún no lo tiene.</text>
    </g>

    <g id="node-fix-ldconfig">
      <rect class="card-fix" x="490" y="224" width="430" height="84" rx="10"/>
      <text class="tag-fix" x="514" y="246">SOLUCIÓN INMEDIATA</text>
      <text class="msg-fix" x="514" y="270">sudo ldconfig</text>
      <text class="text-fix" x="514" y="292">Verifica con ldconfig -p | grep libfoo</text>
    </g>

    <g id="node-error-bits">
      <rect class="card-warn" x="40" y="316" width="410" height="84" rx="10"/>
      <text class="tag-warn" x="64" y="338">ERROR 3 · 32 FRENTE A 64 BITS</text>
      <text class="msg-warn" x="64" y="362">wrong ELF class: ELFCLASS32</text>
      <text class="text-warn" x="64" y="384">Binario de 64 bits con un .so de 32 bits.</text>
    </g>

    <g id="node-fix-bits">
      <rect class="card-fix" x="490" y="316" width="430" height="84" rx="10"/>
      <text class="tag-fix" x="514" y="338">DIAGNÓSTICO Y ARREGLO</text>
      <text class="msg-fix" x="514" y="362">file /ruta/libfoo.so · objdump -f</text>
      <text class="text-fix" x="514" y="384">Instala libfoo.x86_64 o libfoo:i386</text>
    </g>

    <g id="node-error-permisos">
      <rect class="card-warn" x="40" y="408" width="410" height="84" rx="10"/>
      <text class="tag-warn" x="64" y="430">ERROR 4 · PERMISOS DENEGADOS</text>
      <text class="msg-warn" x="64" y="454">libfoo.so.1: Permission denied</text>
      <text class="text-warn" x="64" y="476">El archivo solo lo lee root (chmod 600).</text>
    </g>

    <g id="node-fix-permisos">
      <rect class="card-fix" x="490" y="408" width="430" height="84" rx="10"/>
      <text class="tag-fix" x="514" y="430">DIAGNÓSTICO Y ARREGLO</text>
      <text class="msg-fix" x="514" y="454">ls -l /usr/local/lib/libfoo*</text>
      <text class="text-fix" x="514" y="476">sudo chmod 755 /ruta/libfoo.so.*</text>
    </g>
  </g>
</svg>
