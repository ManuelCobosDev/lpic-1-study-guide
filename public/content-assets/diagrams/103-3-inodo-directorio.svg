<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="inodo-dir-title inodo-dir-desc">
  <title id="inodo-dir-title">Directorio, inodo y bloques de datos: dónde vive cada parte de un fichero (LPIC-1 103.3)</title>
  <desc id="inodo-dir-desc">El directorio es una tabla que asocia cada nombre con un número de inodo: informe.pdf apunta al inodo 4012, backup.tar al 4013 y script.sh al 5120. El inodo 4012 guarda los metadatos del fichero (tipo regular, permisos 0644, dueño UID 1000, grupo GID 1000, tamaño 8192 bytes, marcas atime, mtime y ctime, un enlace y punteros a los bloques 501 y 502), pero nunca el nombre. Los bloques 501 y 502 contienen los bytes reales en el disco, 4 KB cada uno. Renombrar un fichero solo cambia el nombre en el directorio: ni el inodo ni los bloques se mueven.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .eyebrow-light { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #CBD5E1; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .mono-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .field { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .name-hw { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #F8FAFC; }
      .sub-hw { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #E2E8F0; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .band-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .badge-warn { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-warn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.04em; text-anchor: middle; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="inodo-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SISTEMA DE ARCHIVOS · INODO Y DIRECTORIO</text>
    <text class="title" x="40" y="78">El nombre vive en el directorio, no en el inodo</text>
    <text class="subtitle" x="40" y="102">Tres piezas guardan un fichero: entrada, inodo y bloques.</text>
  </g>

  <g id="diagram-relations">
    <path id="inodo-rel-dir-inodo" class="edge-blue"
          data-from="node-directorio" data-to="node-inodo" data-relation="points-to"
          d="M 312 258 H 348" marker-end="url(#inodo-arrow-blue)"/>
    <path id="inodo-rel-inodo-bloques" class="edge-blue"
          data-from="node-inodo" data-to="node-bloques" data-relation="points-to"
          d="M 620 258 H 656" marker-end="url(#inodo-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-directorio">
      <rect class="node-file" x="40" y="136" width="272" height="244" rx="10"/>
      <text class="eyebrow" x="62" y="168">DIRECTORIO</text>
      <text class="sub" x="62" y="194">tabla de nombres</text>
      <text class="mono-line" x="62" y="228">informe.pdf → #4012</text>
      <text class="mono-line" x="62" y="254">backup.tar → #4013</text>
      <text class="mono-line" x="62" y="280">script.sh  → #5120</text>
      <text class="sub" x="62" y="318">Solo asocia un nombre</text>
      <text class="sub" x="62" y="340">con un número de inodo.</text>
    </g>

    <g id="node-inodo">
      <rect class="node-kernel" x="348" y="136" width="272" height="244" rx="10"/>
      <text class="eyebrow" x="370" y="168">INODO</text>
      <text class="mono-name" x="370" y="194">Inodo #4012</text>
      <text class="field" x="370" y="222">Tipo: regular (-)</text>
      <text class="field" x="370" y="242">Permisos: 0644 (rw-r--r--)</text>
      <text class="field" x="370" y="262">Dueño: UID 1000 (alumno)</text>
      <text class="field" x="370" y="282">Grupo: GID 1000 (alumnos)</text>
      <text class="field" x="370" y="302">Tamaño: 8.192 bytes</text>
      <text class="field" x="370" y="322">Marcas: atime, mtime, ctime</text>
      <text class="field" x="370" y="342">Enlaces: 1 (nlink)</text>
      <text class="field" x="370" y="362">Punteros: bloques 501 y 502</text>
    </g>

    <g id="node-bloques">
      <rect class="node-hw" x="656" y="136" width="264" height="244" rx="10"/>
      <text class="eyebrow-light" x="678" y="168">BLOQUES</text>
      <text class="name-hw" x="678" y="196">Bloque 501</text>
      <text class="sub-hw" x="678" y="218">4 KB · 01011001…</text>
      <text class="name-hw" x="678" y="250">Bloque 502</text>
      <text class="sub-hw" x="678" y="272">4 KB · 11001010…</text>
      <text class="sub-hw" x="678" y="314">Los bytes que lees</text>
      <text class="sub-hw" x="678" y="336">al abrir el fichero.</text>
    </g>

    <g id="node-renombrar">
      <rect class="band" x="40" y="396" width="880" height="120" rx="10"/>
      <text class="band-title" x="62" y="430">Renombrar no mueve ni un byte</text>
      <text class="band-body" x="62" y="458">mv peli.mkv peli_final.mkv en el mismo disco no copia nada:</text>
      <text class="band-body" x="62" y="482">solo cambia el nombre en el directorio padre; el inodo y sus bloques no se tocan.</text>
      <text class="band-body" x="62" y="506">Compruébalo con ls -i.</text>
      <rect class="badge-warn" x="680" y="414" width="220" height="28" rx="7"/>
      <text class="badge-warn-text" x="790" y="432">EL NOMBRE NO VIVE AQUÍ</text>
    </g>
  </g>
</svg>
