<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ln-anat-title ln-anat-desc">
  <title id="ln-anat-title">Anatomía de la línea ln -s: origen primero y nombre del enlace después (LPIC-1 104.6)</title>
  <desc id="ln-anat-desc">La orden ln -s doc.txt enlace.txt se descompone en tres piezas: el comando ln, la opción -s que elige enlace simbólico (sin ella se crea un enlace duro) y sus dos argumentos en orden estricto, primero el origen existente y después el nombre del enlace nuevo. Si se invierten los argumentos, el enlace apunta a una ruta inexistente o la orden falla; si se omite el nombre nuevo, el enlace toma el nombre del objetivo y se crea en el directorio actual. La opción -f elimina el destino que ya existiera antes de crear el enlace.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .cmd-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .cmd-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .card-opt { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .card-mal { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-bien { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .card-title-opt { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #B45309; letter-spacing: 0.08em; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .mono-opt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #92400E; }
      .mono-mal { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #881337; }
      .mono-bien { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #065F46; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .sub-mal { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
      .sub-bien { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #065F46; }
      .tag-mal { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #BE123C; letter-spacing: 0.08em; }
      .tag-bien { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #047857; letter-spacing: 0.08em; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.6 · SINTAXIS DE LN</text>
    <text class="title" x="40" y="78">Origen primero, enlace después</text>
    <text class="subtitle" x="40" y="102">ln [-s] origen_existente nombre_nuevo_enlace</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-orden-completa">
      <rect class="cmd-band" x="40" y="124" width="880" height="64" rx="10"/>
      <text class="cmd-text" x="480" y="166">ln -s doc.txt enlace.txt</text>
    </g>

    <g id="node-arg-origen">
      <rect class="card" x="40" y="216" width="260" height="112" rx="10"/>
      <circle class="badge" cx="68" cy="242" r="13"/>
      <text class="badge-num" x="68" y="247">1</text>
      <text class="card-title" x="92" y="247">ORIGEN</text>
      <text class="mono" x="64" y="278">doc.txt</text>
      <text class="sub" x="64" y="300">el fichero que ya existe</text>
    </g>

    <g id="node-arg-nombre">
      <rect class="card" x="320" y="216" width="260" height="112" rx="10"/>
      <circle class="badge" cx="348" cy="242" r="13"/>
      <text class="badge-num" x="348" y="247">2</text>
      <text class="card-title" x="372" y="247">NOMBRE NUEVO</text>
      <text class="mono" x="344" y="278">enlace.txt</text>
      <text class="sub" x="344" y="300">el enlace que se crea</text>
    </g>

    <g id="node-opcion">
      <rect class="card-opt" x="600" y="216" width="320" height="112" rx="10"/>
      <text class="card-title-opt" x="624" y="247">OPCIÓN -s</text>
      <text class="mono-opt" x="624" y="278">enlace simbólico</text>
      <text class="sub" x="624" y="300">sin -s se crea un enlace duro</text>
    </g>

    <g id="node-mal">
      <rect class="card-mal" x="40" y="352" width="420" height="80" rx="10"/>
      <text class="tag-mal" x="64" y="376">MAL</text>
      <text class="mono-mal" x="64" y="400">ln -s enlace.txt doc.txt</text>
      <text class="sub-mal" x="64" y="420">apunta a una ruta vacía o falla</text>
    </g>

    <g id="node-bien">
      <rect class="card-bien" x="500" y="352" width="420" height="80" rx="10"/>
      <text class="tag-bien" x="524" y="376">BIEN</text>
      <text class="mono-bien" x="524" y="400">ln -s doc.txt enlace.txt</text>
      <text class="sub-bien" x="524" y="420">el enlace se resuelve al abrirlo</text>
    </g>

    <g id="node-banda">
      <rect class="band" x="40" y="448" width="880" height="56" rx="10"/>
      <text class="band-text" x="64" y="481">Si omites el nombre nuevo, el enlace toma el nombre del objetivo.</text>
    </g>
  </g>
</svg>
