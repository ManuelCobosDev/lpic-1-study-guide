<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ypr-title ypr-desc">
  <title id="ypr-title">dnf search frente a dnf provides: qué zona del paquete mira cada búsqueda (LPIC-1 102.5)</title>
  <desc id="ypr-desc">Un paquete de los repositorios expone dos zonas distintas. dnf search semanage solo lee la zona de nombre y resumen, donde el paquete aparece como policycoreutils-python-utils con el resumen SELinux management Python utilities, y por eso no hay coincidencia. dnf provides */semanage, también llamado whatprovides, lee la lista completa de archivos del paquete y encuentra /usr/sbin/semanage, de modo que revela que hay que instalar policycoreutils-python-utils.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .zone-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .zone-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #94A3B8; letter-spacing: 0.08em; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .zone-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .zone-b { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .res-no { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .res-si { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
      .mono-value { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .no-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #881337; text-anchor: middle; }
      .no-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #881337; text-anchor: middle; }
      .si-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .si-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #065F46; text-anchor: middle; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
      .edge-rose { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
      .edge-green { fill: none; stroke: #059669; stroke-width: 2; }
    </style>

    <marker id="ypr-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="ypr-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
    <marker id="ypr-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">BÚSQUEDA INVERSA · SEARCH Y PROVIDES</text>
    <text class="title" x="40" y="78">Qué zona del paquete mira cada uno</text>
    <text class="subtitle" x="40" y="102">El nombre del paquete no contiene el del comando</text>
  </g>

  <g id="diagram-groups">
    <rect class="zone-box" x="344" y="130" width="392" height="308" rx="14"/>
    <text class="zone-label" x="368" y="156">UN PAQUETE DEL REPOSITORIO</text>
  </g>

  <g id="diagram-relations">
    <path id="ypr-rel-search-zona" class="edge-blue"
          data-from="node-search" data-to="node-zona-resumen" data-relation="lee-nombre-y-resumen"
          d="M 324 214 H 360" marker-end="url(#ypr-arrow-blue)"/>
    <path id="ypr-rel-provides-zona" class="edge-blue"
          data-from="node-provides" data-to="node-zona-ficheros" data-relation="lee-lista-de-archivos"
          d="M 324 355 H 360" marker-end="url(#ypr-arrow-blue)"/>
    <path id="ypr-rel-zona-no" class="edge-rose"
          data-from="node-zona-resumen" data-to="node-resultado-no" data-relation="sin-coincidencia"
          d="M 720 214 H 760" marker-end="url(#ypr-arrow-rose)"/>
    <path id="ypr-rel-zona-si" class="edge-green"
          data-from="node-zona-ficheros" data-to="node-resultado-si" data-relation="coincidencia"
          d="M 720 355 H 760" marker-end="url(#ypr-arrow-green)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-search">
      <rect class="node-cmd" x="40" y="166" width="284" height="96" rx="10"/>
      <text class="mono-name" x="64" y="196">dnf search</text>
      <text class="mono-sm" x="64" y="220">semanage</text>
      <text class="sub" x="64" y="244">mira el nombre y el resumen</text>
    </g>

    <g id="node-provides">
      <rect class="node-cmd" x="40" y="290" width="284" height="130" rx="10"/>
      <text class="mono-name" x="64" y="322">dnf provides</text>
      <text class="mono-sm" x="64" y="346">*/semanage</text>
      <text class="sub" x="64" y="372">mira los archivos internos</text>
      <text class="sub" x="64" y="394">de todos los paquetes</text>
    </g>

    <g id="node-zona-resumen">
      <rect class="zone-a" x="360" y="166" width="360" height="96" rx="10"/>
      <text class="mono-value" x="384" y="196">policycoreutils-python-utils</text>
      <text class="value" x="384" y="220">SELinux management Python utilities</text>
      <text class="value" x="384" y="242">aquí no aparece «semanage»</text>
    </g>

    <g id="node-zona-ficheros">
      <rect class="zone-b" x="360" y="290" width="360" height="130" rx="10"/>
      <text class="mono-value" x="384" y="320">/usr/sbin/semanage</text>
      <text class="value" x="384" y="344">la lista completa de archivos</text>
      <text class="value" x="384" y="366">del paquete sí lo contiene</text>
      <text class="mono-value" x="384" y="398">/usr/share/man/man8/semanage.8.gz</text>
    </g>

    <g id="node-resultado-no">
      <rect class="res-no" x="760" y="166" width="160" height="96" rx="10"/>
      <text class="no-title" x="840" y="204">Sin resultado</text>
      <text class="no-sub" x="840" y="228">no está en el nombre</text>
    </g>

    <g id="node-resultado-si">
      <rect class="res-si" x="760" y="290" width="160" height="130" rx="10"/>
      <text class="si-title" x="840" y="336">Coincide</text>
      <text class="si-sub" x="840" y="360">está en el paquete</text>
      <text class="si-sub" x="840" y="382">que hay que instalar</text>
    </g>
  </g>

  <g id="diagram-labels">
    <g id="node-veredicto">
      <rect class="verdict" x="40" y="452" width="880" height="56" rx="10"/>
      <text class="verdict-label" x="64" y="486">REGLA</text>
      <text class="verdict-text" x="140" y="486">provides (alias whatprovides) busca en los archivos</text>
    </g>
  </g>
</svg>
