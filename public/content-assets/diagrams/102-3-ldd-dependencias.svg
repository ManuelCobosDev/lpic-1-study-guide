<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ldd-title ldd-desc">
  <title id="ldd-title">Lectura de la salida de ldd sobre /usr/bin/curl (LPIC-1 102.3)</title>
  <desc id="ldd-desc">ldd muestra las dependencias dinámicas de un binario resolviendo cada soname contra su archivo físico y la dirección virtual que ocupará en RAM. En la salida de ejemplo, linux-vdso.so.1 es una librería virtual que inyecta el kernel y no existe en disco, libcurl.so.4 y libc.so.6 se resuelven con flecha a su ruta, libcustom.so.2 aparece como not found, que impide arrancar el programa, y /lib64/ld-linux-x86-64.so.2 es el propio cargador dinámico, que no lleva flecha.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .term { fill: #1E293B; stroke: #0F172A; stroke-width: 2; }
      .term-prompt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #94A3B8; }
      .term-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #F8FAFC; }
      .term-vdso { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #FCD34D; }
      .term-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #FDA4AF; }
      .term-loader { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #CBD5E1; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .band { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LDD · DEPENDENCIAS DINÁMICAS</text>
    <text class="title" x="40" y="78">Cómo se lee la salida de ldd</text>
    <text class="subtitle" x="40" y="102">Cada línea dice qué pide el binario y dónde está</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-salida">
      <rect class="term" x="40" y="140" width="580" height="280" rx="10"/>
      <text class="term-prompt" x="64" y="172">$ ldd /usr/bin/curl</text>
      <text class="term-vdso" x="64" y="212">linux-vdso.so.1 (0x7ffe…)</text>
      <text class="term-line" x="64" y="256">libcurl.so.4 =&gt; /lib/x86_64-linux-gnu/libcurl.so.4</text>
      <text class="term-line" x="64" y="300">libc.so.6 =&gt; /lib/x86_64-linux-gnu/libc.so.6</text>
      <text class="term-warn" x="64" y="344">libcustom.so.2 =&gt; not found</text>
      <text class="term-loader" x="64" y="388">/lib64/ld-linux-x86-64.so.2 (0x7f35…)</text>
    </g>

    <g id="node-banda-final">
      <rect class="band" x="40" y="436" width="880" height="72" rx="10"/>
      <text class="band-text" x="64" y="466">ldd simula la carga del binario: invoca al enlazador dinámico.</text>
      <text class="band-text" x="64" y="492">Si aparece not found, el ejecutable no podrá abrirse.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="636" y1="160" x2="636" y2="400"/>
    <text class="note" x="652" y="212">Virtual del kernel: no está en disco</text>
    <text class="note" x="652" y="256">soname =&gt; archivo real y dirección</text>
    <text class="note" x="652" y="300">Dependencia normal: se resuelve</text>
    <text class="note" x="652" y="344">Falta: no está o no está en la caché</text>
    <text class="note" x="652" y="388">El cargador dinámico: sin flecha</text>
  </g>
</svg>
