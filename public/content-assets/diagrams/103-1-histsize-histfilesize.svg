<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-histsize-title p1031-histsize-desc">
  <title id="p1031-histsize-title">HISTSIZE en RAM e HISTFILESIZE en disco (LPIC-1 103.1)</title>
  <desc id="p1031-histsize-desc">La sesión activa guarda los comandos en memoria RAM, limitados por HISTSIZE=1000 y consultables con history o con la flecha arriba; history -c vacía esa memoria. Al salir de la sesión o al forzar history -w se vuelcan en el archivo ~/.bash_history, limitado por HISTFILESIZE=2000 líneas, consultable con tail -n 20 y con descarte de las órdenes más antiguas cuando supera el límite.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .band-ram { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .band-disk { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .band-head-disk { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .var { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; text-anchor: end; }
      .var-disk { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; text-anchor: end; }
      .body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .chip { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .chip-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
      .chip-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #1E36AF; text-anchor: middle; }
      .chip-text-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #BE123C; text-anchor: middle; }
      .chip-text-disk { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .trigger { fill: #FFFFFF; stroke: #1D40D8; stroke-width: 1.5; }
      .trigger-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="p1031-histsize-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">HISTORIAL · HISTSIZE Y HISTFILESIZE</text>
    <text class="title" x="40" y="78">La RAM de la sesión y el archivo del disco</text>
    <text class="subtitle" x="40" y="102">Los comandos viven en RAM y solo se vuelcan</text>
    <text class="subtitle" x="40" y="122">a ~/.bash_history al salir o con history -w.</text>
  </g>

  <g id="diagram-nodes">
    <g id="band-ram">
      <rect class="band-ram" x="40" y="136" width="880" height="140" rx="10"/>
      <text class="band-head" x="60" y="164">MEMORIA RAM · SESIÓN ACTIVA</text>
      <text class="var" x="900" y="164">HISTSIZE=1000</text>
      <line class="divider" x1="60" y1="176" x2="900" y2="176"/>
      <text class="body" x="60" y="204">Los comandos entran al instante; los ves con history</text>
      <text class="body" x="60" y="224">o con la flecha arriba.</text>
      <g id="chip-ram-history">
        <rect class="chip" x="60" y="238" width="270" height="26" rx="6"/>
        <text class="chip-text" x="195" y="256">history 20</text>
      </g>
      <g id="chip-ram-arrow">
        <rect class="chip" x="346" y="238" width="270" height="26" rx="6"/>
        <text class="chip-text" x="481" y="256">flecha arriba</text>
      </g>
      <g id="chip-ram-clear">
        <rect class="chip-warn" x="632" y="238" width="268" height="26" rx="6"/>
        <text class="chip-text-warn" x="766" y="256">history -c vacía la RAM</text>
      </g>
    </g>

    <g id="band-disk">
      <rect class="band-disk" x="40" y="346" width="880" height="140" rx="10"/>
      <text class="band-head-disk" x="60" y="374">ARCHIVO EN DISCO · ~/.bash_history</text>
      <text class="var-disk" x="900" y="374">HISTFILESIZE=2000</text>
      <line class="divider" x1="60" y1="386" x2="900" y2="386"/>
      <text class="body" x="60" y="414">Al salir se vuelcan; si el archivo supera las 2000 líneas,</text>
      <text class="body" x="60" y="434">descarta las órdenes más antiguas.</text>
      <g id="chip-disk-tail">
        <rect class="chip" x="60" y="448" width="380" height="26" rx="6"/>
        <text class="chip-text-disk" x="250" y="466">tail -n 20 ~/.bash_history</text>
      </g>
      <g id="chip-disk-write">
        <rect class="chip" x="460" y="448" width="240" height="26" rx="6"/>
        <text class="chip-text-disk" x="580" y="466">history -w</text>
      </g>
      <text class="body" x="720" y="466">fuerza el volcado</text>
    </g>

    <g id="trigger-write">
      <rect class="trigger" x="500" y="288" width="220" height="30" rx="7"/>
      <text class="trigger-text" x="610" y="308">exit o history -w</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="rel-ram-disk" class="edge" data-from="band-ram" data-to="band-disk" data-relation="writes-on-exit" d="M 480 276 V 346" marker-end="url(#p1031-histsize-arrow)"/>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="480" y1="303" x2="500" y2="303"/>
    <text class="note" x="40" y="512">SIZE es la RAM; FILESIZE contiene FILE, luego es el disco.</text>
  </g>
</svg>
