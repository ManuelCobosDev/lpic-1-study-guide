<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hib-title hib-desc">
  <title id="hib-title">Hibernación: la swap debe ser mayor o igual que la RAM (LPIC-1 102.1)</title>
  <desc id="hib-desc">Para hibernar, el equipo vuelca el contenido completo de la RAM en la swap antes de apagarse, por eso la swap debe ser igual o mayor que la memoria física: con 4 GB de RAM hacen falta de 4 a 8 GB de swap, con 8 GB de RAM de 8 a 11 GB y con 16 GB de RAM de 16 a 24 GB. Si la swap es menor que la RAM, la hibernación se cancela. La swap se prepara sobre una partición dedicada o sobre un archivo /swapfile.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .name-hw { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #F8FAFC; }
      .role-hw { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #E2E8F0; }
      .small-hw { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #CBD5E1; }
      .name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .small { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .small-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #B45309; }
      .warn-name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #881337; }
      .warn-role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #881337; }
      .warn-small { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #9F1239; }
      .chip-role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #334155; }
      .chip-value { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #1E36AF; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #1D40D8; text-anchor: middle; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .band-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
    </style>

    <marker id="hib-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · SWAP E HIBERNACIÓN</text>
    <text class="title" x="40" y="78">Hibernar exige swap mayor o igual que la RAM</text>
    <text class="subtitle" x="40" y="102">El volcado copia toda la memoria al disco antes de apagar</text>
  </g>

  <g id="diagram-relations">
    <path id="hib-rel-volcado" class="edge" data-from="node-ram" data-to="node-swap" data-relation="volcado-completo"
          d="M 310 190 H 430" marker-end="url(#hib-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-ram">
      <rect class="node-hw" x="60" y="128" width="250" height="124" rx="10"/>
      <text class="name-hw" x="84" y="168">RAM 16 GB</text>
      <text class="role-hw" x="84" y="192">mesa de trabajo rápida</text>
      <text class="small-hw" x="84" y="214">páginas activas e inactivas</text>
      <text class="small-hw" x="84" y="236">se pierde al apagar</text>
    </g>

    <g id="node-swap">
      <rect class="node-file" x="430" y="128" width="250" height="124" rx="10"/>
      <text class="name" x="454" y="168">swap 16–24 GB</text>
      <text class="role" x="454" y="192">copia de la memoria</text>
      <text class="small" x="454" y="214">sobrevive al apagado</text>
      <text class="small-mono" x="454" y="236">partición o /swapfile</text>
    </g>

    <g id="node-rule">
      <rect class="node-warn" x="720" y="128" width="200" height="124" rx="10"/>
      <text class="warn-name" x="740" y="166">swap ≥ RAM</text>
      <text class="warn-role" x="740" y="190">para hibernar</text>
      <text class="warn-small" x="740" y="212">si es menor,</text>
      <text class="warn-small" x="740" y="232">no hay hibernación</text>
    </g>

    <g id="node-case-4">
      <rect class="node-cmd" x="60" y="282" width="280" height="80" rx="10"/>
      <text class="chip-role" x="84" y="312">Portátil con 4 GB de RAM</text>
      <text class="chip-value" x="84" y="340">swap de 4 a 8 GB</text>
    </g>

    <g id="node-case-8">
      <rect class="node-cmd" x="350" y="282" width="280" height="80" rx="10"/>
      <text class="chip-role" x="374" y="312">Portátil con 8 GB de RAM</text>
      <text class="chip-value" x="374" y="340">swap de 8 a 11 GB</text>
    </g>

    <g id="node-case-16">
      <rect class="node-cmd" x="640" y="282" width="280" height="80" rx="10"/>
      <text class="chip-role" x="664" y="312">Portátil con 16 GB de RAM</text>
      <text class="chip-value" x="664" y="340">swap de 16 a 24 GB</text>
    </g>

    <g id="node-band">
      <rect class="node-warn" x="40" y="386" width="880" height="94" rx="10"/>
      <text class="band-title" x="62" y="414">Si la swap es más pequeña que la RAM, el equipo cancela la hibernación</text>
      <text class="band-body" x="62" y="440">El volcado tiene que copiar el 100 % de lo que está abierto: si no cabe, no se apaga.</text>
      <text class="band-body" x="62" y="462">En servidores es una red de emergencia: no sustituye a comprar más RAM.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="label-bg" x="316" y="166" width="108" height="22" rx="5"/>
    <text class="edge-label" x="370" y="181">volcado completo</text>
  </g>
</svg>
