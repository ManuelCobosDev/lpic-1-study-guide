<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ren-title ren-desc">
  <title id="ren-title">Los tres selectores de renice: por PID, por usuario y por grupo de procesos (LPIC-1 103.6)</title>
  <desc id="ren-desc">renice cambia el niceness de procesos vivos en la memoria. El selector decide el alcance: -p actúa sobre un único proceso por su PID y es el modo por defecto, -u actúa sobre todos los procesos de un usuario y -g actúa sobre un grupo de procesos completo por su PGID. Con -n se fija el valor absoluto, mientras que un valor con signo suma o resta de forma relativa.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-scope { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .cmd-big { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #1E36AF; }
      .cmd-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
      .scope-sel { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .scope-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .scope-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .scope-example { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #334155; }
      .note-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .footer { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="ren-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">RENICE · SELECTORES DE ALCANCE</text>
    <text class="title" x="40" y="78">Un comando, tres alcances</text>
    <text class="subtitle" x="40" y="102">El selector decide cuántos</text>
    <text class="subtitle" x="40" y="122">procesos cambian de prioridad.</text>
  </g>

  <g id="diagram-relations">
    <path id="ren-rel-pid" class="edge-blue"
          data-from="node-renice" data-to="node-pid" data-relation="cambia-un-proceso"
          d="M 288 264 H 400 V 182 H 520" marker-end="url(#ren-arrow-blue)"/>

    <path id="ren-rel-usuario" class="edge-blue"
          data-from="node-renice" data-to="node-usuario" data-relation="cambia-un-usuario"
          d="M 288 264 H 400 V 292 H 520" marker-end="url(#ren-arrow-blue)"/>

    <path id="ren-rel-grupo" class="edge-blue"
          data-from="node-renice" data-to="node-grupo" data-relation="cambia-un-grupo"
          d="M 288 264 H 400 V 402 H 520" marker-end="url(#ren-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-renice">
      <rect class="node-cmd" x="40" y="196" width="248" height="136" rx="10"/>
      <text class="cmd-big" x="72" y="240">renice</text>
      <text class="cmd-line" x="72" y="266">-n &lt;nuevo_nice&gt;</text>
      <text class="note-sub" x="72" y="292">en caliente, sobre</text>
      <text class="note-sub" x="72" y="312">procesos vivos</text>
    </g>

    <g id="node-pid">
      <rect class="node-scope" x="520" y="140" width="400" height="84" rx="10"/>
      <text class="scope-sel" x="544" y="170">-p 1420</text>
      <text class="scope-line" x="544" y="192">afecta a un único proceso</text>
      <text class="scope-note" x="544" y="212">es el modo por defecto</text>
    </g>

    <g id="node-usuario">
      <rect class="node-scope" x="520" y="250" width="400" height="84" rx="10"/>
      <text class="scope-sel" x="544" y="280">-u alumno</text>
      <text class="scope-line" x="544" y="302">afecta a todos sus procesos</text>
      <text class="scope-example" x="544" y="322">sudo renice 15 -u alumno</text>
    </g>

    <g id="node-grupo">
      <rect class="node-scope" x="520" y="360" width="400" height="84" rx="10"/>
      <text class="scope-sel" x="544" y="390">-g 3000</text>
      <text class="scope-line" x="544" y="412">afecta al grupo completo</text>
      <text class="scope-example" x="544" y="432">sudo renice 5 -g 3000</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="footer" x="40" y="482">Valor absoluto con -n: renice -n 10 -p 4120.</text>
    <text class="footer" x="40" y="504">Valor relativo con signo: +5 suma cinco al nice actual.</text>
  </g>
</svg>
