<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="jctl-title jctl-desc">
  <title id="jctl-title">Máquina de estados del control de trabajos: primer plano, detenido y segundo plano (LPIC-1 103.5)</title>
  <desc id="jctl-desc">Un trabajo de la shell se mueve entre tres estados. En primer plano bloquea el prompt y recibe el teclado; Ctrl+Z envía la señal SIGTSTP (20 o 18 según la plataforma) y lo deja detenido, congelado en memoria y sin consumir CPU; bg lo reanuda en segundo plano y devuelve el prompt; fg lo trae de vuelta al primer plano. El símbolo &amp; al final del comando lo lanza directamente en segundo plano, sin pasar por el estado detenido.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-fg { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2.5; }
      .card-stop { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .card-bg { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .state-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .state-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .state-cmd-amber { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #92400E; }
      .state-cmd-green { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #065F46; }
      .state-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .node-note { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .plate { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .plate-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
    </style>

    <marker id="jctl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">CONTROL DE TRABAJOS · ESTADOS DEL JOB</text>
    <text class="title" x="40" y="78">El triángulo de fg, Ctrl+Z y bg</text>
    <text class="subtitle" x="40" y="102">Tres estados y tres formas de saltar de uno a otro.</text>
  </g>

  <g id="diagram-relations">
    <path id="jctl-rel-fg-stop" class="edge" data-from="node-primer-plano" data-to="node-detenido" data-relation="ctrl-z-sigtstp" d="M 288 226 H 360" marker-end="url(#jctl-arrow)"/>
    <path id="jctl-rel-stop-bg" class="edge" data-from="node-detenido" data-to="node-segundo-plano" data-relation="bg-reanuda" d="M 600 226 H 672" marker-end="url(#jctl-arrow)"/>
    <path id="jctl-rel-bg-fg" class="edge" data-from="node-segundo-plano" data-to="node-primer-plano" data-relation="fg-devuelve" d="M 792 282 V 372 H 168 V 282" marker-end="url(#jctl-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-primer-plano">
      <rect class="card-fg" x="48" y="170" width="240" height="112" rx="10"/>
      <text class="state-title" x="68" y="204">PRIMER PLANO</text>
      <text class="state-cmd" x="68" y="234">fg %1</text>
      <text class="state-sub" x="68" y="258">bloquea el prompt</text>
    </g>

    <g id="node-detenido">
      <rect class="card-stop" x="360" y="170" width="240" height="112" rx="10"/>
      <text class="state-title" x="380" y="204">DETENIDO</text>
      <text class="state-cmd-amber" x="380" y="234">Ctrl+Z</text>
      <text class="state-sub" x="380" y="258">congelado, sin CPU</text>
    </g>

    <g id="node-segundo-plano">
      <rect class="card-bg" x="672" y="170" width="240" height="112" rx="10"/>
      <text class="state-title" x="692" y="204">SEGUNDO PLANO</text>
      <text class="state-cmd-green" x="692" y="234">bg %1 · cmd &amp;</text>
      <text class="state-sub" x="692" y="258">terminal disponible</text>
    </g>

    <g id="node-nota">
      <rect class="node-note" x="40" y="428" width="880" height="88" rx="10"/>
      <text class="note" x="62" y="452">&amp; lanza el comando directamente en segundo plano.</text>
      <text class="note" x="62" y="476">bg sólo reanuda trabajos detenidos: sin Ctrl+Z no hay nada que reanudar.</text>
      <text class="note" x="62" y="500">fg lo devuelve al teclado y vuelve a bloquear el prompt.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="plate" x="234" y="136" width="180" height="24" rx="6"/>
    <text class="plate-mono" x="324" y="153">Ctrl+Z · SIGTSTP (20/18)</text>
    <rect class="plate" x="556" y="136" width="160" height="24" rx="6"/>
    <text class="plate-mono" x="636" y="153">bg [%n] · reanuda</text>
    <rect class="plate" x="372" y="336" width="216" height="24" rx="6"/>
    <text class="plate-mono" x="480" y="353">fg [%n] · vuelve al teclado</text>
  </g>
</svg>
