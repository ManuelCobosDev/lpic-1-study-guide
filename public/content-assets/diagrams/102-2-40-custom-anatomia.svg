<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="g40c-title g40c-desc">
  <title id="g40c-title">Anatomía del fichero /etc/grub.d/40_custom y del truco exec tail -n +3 (LPIC-1 102.2)</title>
  <desc id="g40c-desc">El fichero /etc/grub.d/40_custom mezcla dos cosas. Las dos primeras líneas son un script de shell que GRUB ejecuta: el shebang /bin/sh y la orden exec tail -n +3 $0. Desde la tercera línea todo es texto plano, y tail lo copia tal cual al menú generado: el comentario de plantilla y una entrada menuentry completa con set root, linux e initrd. La línea exec tail -n +3 no se borra porque es la que separa el script del texto del menú.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .file-card { fill: #F1F5F9; stroke: #475569; stroke-width: 2.5; }
      .file-head { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .gutter { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 500; fill: #94A3B8; }
      .code { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #0F172A; }
      .col-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .col-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .brace { fill: none; stroke: #475569; stroke-width: 2; }
      .warn-plaque { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .warn-strong { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #881337; }
      .warn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
      .warn-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · ENTRADAS PROPIAS EN GRUB 2</text>
    <text class="title" x="40" y="78">Anatomía de /etc/grub.d/40_custom</text>
    <text class="subtitle" x="40" y="102">Dos líneas de script y un bloque de menú.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-40-custom">
      <rect class="file-card" x="40" y="124" width="640" height="360" rx="10"/>
      <text class="file-head" x="62" y="156">/etc/grub.d/40_custom</text>
      <line class="divider" x1="62" y1="172" x2="658" y2="172"/>

      <text class="gutter" x="62" y="200">1</text>
      <text class="code" x="96" y="200">#!/bin/sh</text>

      <text class="gutter" x="62" y="236">2</text>
      <text class="code" x="96" y="236">exec tail -n +3 $0</text>

      <text class="gutter" x="62" y="272">3</text>
      <text class="code" x="96" y="272"># This file provides an easy way to add custom menu entries.</text>

      <text class="gutter" x="62" y="308">4</text>
      <text class="code" x="96" y="308">menuentry "Linux Modo Rescate Seguro" {</text>

      <text class="gutter" x="62" y="344">5</text>
      <text class="code" x="96" y="344">set root=(hd0,2)</text>

      <text class="gutter" x="62" y="380">6</text>
      <text class="code" x="96" y="380">linux /boot/vmlinuz-6.1.0-18-amd64 root=/dev/sda2 ro single</text>

      <text class="gutter" x="62" y="416">7</text>
      <text class="code" x="96" y="416">initrd /boot/initrd.img-6.1.0-18-amd64</text>

      <text class="gutter" x="62" y="452">8</text>
      <text class="code" x="96" y="452">}</text>
    </g>

    <g id="node-warning-tail">
      <rect class="warn-plaque" x="710" y="360" width="210" height="124" rx="10"/>
      <text class="warn-strong" x="732" y="392">No borres la línea 2</text>
      <text class="warn-mono" x="732" y="416">exec tail -n +3 $0</text>
      <text class="warn-text" x="732" y="440">es el truco que copia</text>
      <text class="warn-text" x="732" y="460">el texto al menú.</text>
    </g>

    <g id="node-brace-script">
      <text class="col-label" x="710" y="204">LÍNEAS 1 Y 2</text>
      <text class="col-text" x="710" y="226">Script de shell que GRUB</text>
      <text class="col-text" x="710" y="246">ejecuta como programa.</text>
    </g>

    <g id="node-brace-text">
      <text class="col-label" x="710" y="288">LÍNEAS 3 A 8</text>
      <text class="col-text" x="710" y="310">Texto plano: tail -n +3 lo</text>
      <text class="col-text" x="710" y="330">vuelca al menú generado.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <path class="brace" d="M 700 188 H 690 V 248 H 700"/>
    <path class="brace" d="M 700 260 H 690 V 464 H 700"/>
  </g>
</svg>
