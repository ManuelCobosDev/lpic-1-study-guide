<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-traps-title p1031-traps-desc">
  <title id="p1031-traps-title">Cuatro trampas clásicas de examen en la línea de comandos (LPIC-1 103.1)</title>
  <desc id="p1031-traps-desc">Rejilla de cuatro tarjetas con la forma incorrecta y la correcta de cada trampa: los espacios en una asignación, donde A = 5 falla y A=5 es correcto; el signo dólar en unset, donde unset $MI_VAR borra la variable equivocada y unset MI_VAR es lo correcto; which con builtins, donde which cd no devuelve nada y type cd responde is a shell builtin; y las comillas simples con dólar, donde echo '$PATH' imprime el texto literal y echo "$PATH" expande las rutas. Cada tarjeta explica el porqué en una o dos líneas.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .divider { stroke: #E2E8F0; stroke-width: 1.5; }
      .badge-mal { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.2; }
      .badge-bien { fill: #D1FAE5; stroke: #059669; stroke-width: 1.2; }
      .badge-mal-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #BE123C; text-anchor: middle; }
      .badge-bien-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #047857; text-anchor: middle; }
      .cmd-mal { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #BE123C; }
      .cmd-bien { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #047857; }
      .why { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">TRAMPAS DE EXAMEN · 103.1</text>
    <text class="title" x="40" y="78">Cuatro errores que cuestan puntos</text>
    <text class="subtitle" x="40" y="104">MAL frente a BIEN en los cuatro errores del objetivo.</text>
  </g>

  <g id="diagram-nodes">
    <g id="trap-spaces">
      <rect class="card" x="40" y="126" width="434" height="166" rx="10"/>
      <text class="card-title" x="60" y="154">Espacios en la asignación</text>
      <line class="divider" x1="60" y1="166" x2="454" y2="166"/>
      <rect class="badge-mal" x="60" y="180" width="64" height="20" rx="5"/>
      <text class="badge-mal-text" x="92" y="194">MAL</text>
      <text class="cmd-mal" x="136" y="195">A = 5 · A= 5 · A =5</text>
      <rect class="badge-bien" x="60" y="210" width="64" height="20" rx="5"/>
      <text class="badge-bien-text" x="92" y="224">BIEN</text>
      <text class="cmd-bien" x="136" y="225">A=5 (sin ningún espacio)</text>
      <text class="why" x="60" y="252">Bash cree que A es un programa y que =</text>
      <text class="why" x="60" y="272">es su primer argumento.</text>
    </g>

    <g id="trap-unset">
      <rect class="card" x="486" y="126" width="434" height="166" rx="10"/>
      <text class="card-title" x="506" y="154">El signo $ en unset</text>
      <line class="divider" x1="506" y1="166" x2="900" y2="166"/>
      <rect class="badge-mal" x="506" y="180" width="64" height="20" rx="5"/>
      <text class="badge-mal-text" x="538" y="194">MAL</text>
      <text class="cmd-mal" x="582" y="195">unset $MI_VAR</text>
      <rect class="badge-bien" x="506" y="210" width="64" height="20" rx="5"/>
      <text class="badge-bien-text" x="538" y="224">BIEN</text>
      <text class="cmd-bien" x="582" y="225">unset MI_VAR (nombre pelado)</text>
      <text class="why" x="506" y="252">Expande $MI_VAR a «juan» e intenta borrar</text>
      <text class="why" x="506" y="272">la variable juan; la tuya sigue viva.</text>
    </g>

    <g id="trap-which">
      <rect class="card" x="40" y="308" width="434" height="166" rx="10"/>
      <text class="card-title" x="60" y="336">which con builtins</text>
      <line class="divider" x1="60" y1="348" x2="454" y2="348"/>
      <rect class="badge-mal" x="60" y="362" width="64" height="20" rx="5"/>
      <text class="badge-mal-text" x="92" y="376">MAL</text>
      <text class="cmd-mal" x="136" y="377">which cd → vacío o error</text>
      <rect class="badge-bien" x="60" y="392" width="64" height="20" rx="5"/>
      <text class="badge-bien-text" x="92" y="406">BIEN</text>
      <text class="cmd-bien" x="136" y="407">type cd → is a shell builtin</text>
      <text class="why" x="60" y="434">which solo busca ejecutables en $PATH;</text>
      <text class="why" x="60" y="454">cd y exit viven en la RAM de Bash.</text>
    </g>

    <g id="trap-quotes">
      <rect class="card" x="486" y="308" width="434" height="166" rx="10"/>
      <text class="card-title" x="506" y="336">Comillas simples con $</text>
      <line class="divider" x1="506" y1="348" x2="900" y2="348"/>
      <rect class="badge-mal" x="506" y="362" width="64" height="20" rx="5"/>
      <text class="badge-mal-text" x="538" y="376">MAL</text>
      <text class="cmd-mal" x="582" y="377">echo '$PATH' → imprime $PATH</text>
      <rect class="badge-bien" x="506" y="392" width="64" height="20" rx="5"/>
      <text class="badge-bien-text" x="538" y="406">BIEN</text>
      <text class="cmd-bien" x="582" y="407">echo "$PATH" → expande las rutas</text>
      <text class="why" x="506" y="434">Las comillas simples anulan todo:</text>
      <text class="why" x="506" y="454">nada se expande dentro de ellas.</text>
    </g>
  </g>
</svg>
