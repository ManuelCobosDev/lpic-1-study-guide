<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vi-insercion-pos-title vi-insercion-pos-desc">
  <title id="vi-insercion-pos-title">Posiciones de inserción en vi: i, I, a, A, o y O respecto al cursor (LPIC-1 103.8)</title>
  <desc id="vi-insercion-pos-desc">Cada tecla del modo normal abre el modo inserción en un punto distinto. Sobre la línea de ejemplo PermitRootLogin no, la tecla i escribe antes del carácter que ocupa el cursor y la tecla a escribe después; la tecla I salta al principio de la línea y la tecla A al final. La tecla o abre una línea en blanco debajo de la actual y la tecla O la abre encima, y en los cuatro casos el editor entra en modo inserción hasta que se pulsa Esc.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .empty-line { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .empty-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
      .empty-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .line-box { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .line-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 500; fill: #0F172A; }
      .cursor-cell { fill: #DBE6FE; stroke: #1D40D8; stroke-width: 2; }
      .marker { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .legend { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .legend-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">VI · MODO INSERCIÓN · POSICIÓN DEL CURSOR</text>
    <text class="title" x="40" y="78">Seis teclas, seis puntos de escritura</text>
    <text class="subtitle" x="40" y="102">Todas entran en inserción; cambia dónde empieza el texto.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-linea-encima">
      <rect class="empty-line" x="120" y="128" width="780" height="48" rx="8"/>
      <text class="empty-key" x="144" y="158">O</text>
      <text class="empty-text" x="172" y="158">abre una línea en blanco ENCIMA de la actual</text>
    </g>

    <g id="node-linea-actual">
      <rect class="line-box" x="120" y="212" width="780" height="80" rx="8"/>
      <text class="marker" x="148" y="238">I</text>
      <text class="marker" x="210" y="238">i</text>
      <text class="marker" x="234" y="238">a</text>
      <text class="marker" x="356" y="238">A</text>
      <rect class="cursor-cell" x="216" y="246" width="13" height="28" rx="2"/>
      <text class="line-text" x="144" y="268" textLength="204" lengthAdjust="spacingAndGlyphs">PermitRootLogin no</text>
    </g>

    <g id="node-linea-debajo">
      <rect class="empty-line" x="120" y="322" width="780" height="48" rx="8"/>
      <text class="empty-key" x="144" y="352">o</text>
      <text class="empty-text" x="172" y="352">abre una línea en blanco DEBAJO de la actual</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="legend" x="120" y="404">I  principio de línea · i  antes del cursor</text>
    <text class="legend" x="120" y="428">a  después del cursor · A  final de línea</text>
    <text class="legend" x="120" y="472">El cursor marca un carácter: i y a escriben a sus lados.</text>
  </g>
</svg>


