<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hip-tipo-title hip-tipo-desc">
  <title id="hip-tipo-title">Hipervisores Tipo 1 bare-metal frente a Tipo 2 hosted (LPIC-1 102.6)</title>
  <desc id="hip-tipo-desc">Comparación en dos pilas de capas. En el Tipo 1 bare-metal las máquinas virtuales se apoyan directamente en el hipervisor, que es el propio kernel Linux con KVM, y este habla con el hardware físico sin sistema operativo intermedio. En el Tipo 2 hosted las máquinas virtuales pasan por un hipervisor de aplicación como VirtualBox, que se ejecuta como un programa sobre el sistema operativo anfitrión y este sobre el hardware, de modo que cada llamada atraviesa dos kernels.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #FFFFFF; stroke: #2550EB; stroke-width: 2; }
      .panel-head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .panel-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.04em; }
      .panel-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #475569; }
      .panel-sub-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #1E36AF; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .node-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #0F172A; }
      .node-text-hw { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #F8FAFC; }
      .node-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #065F46; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-slate { fill: none; stroke: #475569; stroke-width: 2; }
      .plaque { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .plaque-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #065F46; }
    </style>

    <marker id="hip-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="hip-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">HIPERVISORES · TIPO 1 FRENTE A TIPO 2</text>
    <text class="title" x="40" y="78">Dos capas de diferencia</text>
    <text class="subtitle" x="40" y="102">Tipo 1 directo al silicio; Tipo 2 con SO anfitrión.</text>
  </g>

  <g id="diagram-groups">
    <g id="panel-tipo1">
      <rect class="panel-a" x="40" y="126" width="420" height="344" rx="12"/>
      <text class="panel-head-a" x="60" y="158">TIPO 1 · BARE-METAL</text>
      <text class="panel-sub" x="440" y="158" text-anchor="end">Xen · VMware ESXi</text>
      <line class="divider" x1="60" y1="172" x2="440" y2="172"/>
      <text class="note" x="60" y="440">Sin SO intermedio: máximo</text>
      <text class="note" x="60" y="460">rendimiento de CPU y E/S.</text>
    </g>

    <g id="panel-tipo2">
      <rect class="panel-b" x="500" y="126" width="420" height="344" rx="12"/>
      <text class="panel-head-b" x="520" y="158">TIPO 2 · HOSTED</text>
      <text class="panel-sub-b" x="900" y="158" text-anchor="end">VMware Workstation</text>
      <line class="divider" x1="520" y1="172" x2="900" y2="172"/>
      <text class="note" x="520" y="440">Se ejecuta como aplicación normal:</text>
      <text class="note" x="520" y="460">traduce llamadas al SO anfitrión.</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="hip-rel-vm-hyper" class="edge-blue" data-from="node-t1-vm" data-to="node-t1-hyper" data-relation="runs-on"
          d="M 250 230 V 246" marker-end="url(#hip-arrow-blue)"/>
    <path id="hip-rel-hyper-hw" class="edge-slate" data-from="node-t1-hyper" data-to="node-t1-hw" data-relation="runs-on"
          d="M 250 306 V 358" marker-end="url(#hip-arrow-slate)"/>
    <path id="hip-rel-vm-app" class="edge-blue" data-from="node-t2-vm" data-to="node-t2-app" data-relation="runs-on"
          d="M 710 230 V 246" marker-end="url(#hip-arrow-blue)"/>
    <path id="hip-rel-app-host" class="edge-blue" data-from="node-t2-app" data-to="node-t2-host" data-relation="runs-on"
          d="M 710 286 V 302" marker-end="url(#hip-arrow-blue)"/>
    <path id="hip-rel-host-hw" class="edge-slate" data-from="node-t2-host" data-to="node-t2-hw" data-relation="runs-on"
          d="M 710 342 V 358" marker-end="url(#hip-arrow-slate)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-t1-vm">
      <rect class="node-file" x="60" y="190" width="380" height="40" rx="8"/>
      <text class="node-text" x="84" y="216">Máquinas virtuales (invitado)</text>
    </g>
    <g id="node-t1-hyper">
      <rect class="node-kernel" x="60" y="246" width="380" height="60" rx="8"/>
      <text class="node-text" x="84" y="272">Hipervisor: kernel Linux + KVM</text>
      <text class="node-mono" x="84" y="294">kvm.ko · hipervisor nativo</text>
    </g>
    <g id="node-t1-hw">
      <rect class="node-hw" x="60" y="358" width="380" height="40" rx="8"/>
      <text class="node-text-hw" x="84" y="384">Hardware físico (silicio)</text>
    </g>

    <g id="node-t2-vm">
      <rect class="node-file" x="520" y="190" width="380" height="40" rx="8"/>
      <text class="node-text" x="544" y="216">Máquinas virtuales (invitado)</text>
    </g>
    <g id="node-t2-app">
      <rect class="node-cmd" x="520" y="246" width="380" height="40" rx="8"/>
      <text class="node-text" x="544" y="272">Hipervisor de aplicación (VirtualBox)</text>
    </g>
    <g id="node-t2-host">
      <rect class="node-file" x="520" y="302" width="380" height="40" rx="8"/>
      <text class="node-text" x="544" y="328">SO anfitrión (Host OS)</text>
    </g>
    <g id="node-t2-hw">
      <rect class="node-hw" x="520" y="358" width="380" height="40" rx="8"/>
      <text class="node-text-hw" x="544" y="384">Hardware físico (silicio)</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="plaque" x="270" y="318" width="170" height="24" rx="6"/>
    <text class="plaque-text" x="278" y="334">sin SO intermedio</text>
  </g>
</svg>
