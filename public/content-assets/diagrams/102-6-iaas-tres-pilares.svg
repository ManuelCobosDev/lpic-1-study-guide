<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="iaas-title iaas-desc">
  <title id="iaas-title">Los tres pilares de IaaS y el modelo de responsabilidad compartida (LPIC-1 102.6)</title>
  <desc id="iaas-desc">Tres tarjetas con los pilares de Infraestructura como Servicio: instancias de computación con vCPUs y RAM definidas por flavors, almacenamiento en bloques que se formatea con ext4 o XFS y persiste aunque la instancia se destruya, y redes con VPC, subredes, IPs elásticas o flotantes y grupos de seguridad. Debajo, dos paneles separan responsabilidades: el proveedor cloud aporta centros de datos, servidores, cableado, almacenamiento SAN y el hipervisor KVM o ESXi; el administrador se encarga del sistema operativo, los parches, los usuarios, las claves SSH, el cortafuegos y las aplicaciones.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .pillar { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .card-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .card-example { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1E36AF; }
      .box-prov { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .box-admin { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .box-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .box-head-blue { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.04em; }
      .box-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">CLOUD · INFRAESTRUCTURA COMO SERVICIO</text>
    <text class="title" x="40" y="78">Tres pilares y una frontera</text>
    <text class="subtitle" x="40" y="102">El proveedor pone el hardware; tú, el SO.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-pilar-compute">
      <rect class="card" x="40" y="124" width="280" height="200" rx="10"/>
      <text class="pillar" x="62" y="150">PILAR 1 · COMPUTE</text>
      <text class="card-title" x="62" y="176">Instancias de</text>
      <text class="card-title" x="62" y="196">computación</text>
      <text class="card-line" x="62" y="222">Servidores virtuales elásticos</text>
      <text class="card-line" x="62" y="240">vCPUs y RAM: instance flavors</text>
      <text class="card-line" x="62" y="258">se crean en segundos</text>
      <text class="card-line" x="62" y="276">con plantillas y cloud-init</text>
      <text class="card-example" x="62" y="302">AWS EC2 · Azure VMs · Nova</text>
    </g>

    <g id="node-pilar-storage">
      <rect class="card" x="340" y="124" width="280" height="200" rx="10"/>
      <text class="pillar" x="362" y="150">PILAR 2 · BLOCK STORAGE</text>
      <text class="card-title" x="362" y="176">Almacenamiento</text>
      <text class="card-title" x="362" y="196">en bloques</text>
      <text class="card-line" x="362" y="222">Volúmenes como discos físicos</text>
      <text class="card-line" x="362" y="240">se formatean con ext4 o XFS</text>
      <text class="card-line" x="362" y="258">persisten si la VM se destruye</text>
      <text class="card-line" x="362" y="276">conectados por bus virtual</text>
      <text class="card-example" x="362" y="302">AWS EBS · Cinder · QCOW2</text>
    </g>

    <g id="node-pilar-network">
      <rect class="card" x="640" y="124" width="280" height="200" rx="10"/>
      <text class="pillar" x="662" y="150">PILAR 3 · NETWORKING</text>
      <text class="card-title" x="662" y="176">Redes y direcciones</text>
      <text class="card-title" x="662" y="196">flotantes</text>
      <text class="card-line" x="662" y="222">VPC y subredes aisladas</text>
      <text class="card-line" x="662" y="240">IPs elásticas o flotantes</text>
      <text class="card-line" x="662" y="258">security groups: firewall</text>
      <text class="card-line" x="662" y="276">filtran puertos en el hipervisor</text>
      <text class="card-example" x="662" y="302">AWS VPC · Neutron</text>
    </g>

    <g id="node-responsable-proveedor">
      <rect class="box-prov" x="40" y="348" width="430" height="130" rx="10"/>
      <text class="box-head" x="62" y="374">RESPONSABILIDAD DEL PROVEEDOR</text>
      <text class="box-line" x="62" y="402">Centros de datos, servidores, cableado,</text>
      <text class="box-line" x="62" y="422">almacenamiento SAN y el hipervisor</text>
      <text class="box-line" x="62" y="442">(KVM o ESXi).</text>
    </g>

    <g id="node-responsable-admin">
      <rect class="box-admin" x="490" y="348" width="430" height="130" rx="10"/>
      <text class="box-head-blue" x="512" y="374">RESPONSABILIDAD DEL SYSADMIN</text>
      <text class="box-line" x="512" y="402">Sistema operativo, parches de seguridad,</text>
      <text class="box-line" x="512" y="422">usuarios, claves SSH, reglas de firewall</text>
      <text class="box-line" x="512" y="442">y aplicaciones.</text>
    </g>
  </g>
</svg>
