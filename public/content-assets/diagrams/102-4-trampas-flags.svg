<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="trampas-title trampas-desc">
  <title id="trampas-title">Cuatro trampas clásicas de examen en la gestión de paquetes Debian (LPIC-1 102.4)</title>
  <desc id="trampas-desc">La primera trampa confunde apt-get update, que solo descarga las listas de paquetes, con apt-get upgrade, que es el que cambia las versiones. La segunda confunde las minúsculas de dpkg, que hablan de paquetes, con las mayúsculas, que hablan de archivos. La tercera olvida que -i exige el fichero .deb completo mientras -r y apt exigen solo el nombre lógico. La cuarta usa dpkg -S para un archivo que aún no está instalado, donde hace falta apt-file search.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-trap { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .card-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.04em; }
      .badge-bad { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-good { fill: #D1FAE5; stroke: #059669; stroke-width: 1.5; }
      .badge-text-bad { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; text-anchor: middle; }
      .badge-text-good { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .bad-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #881337; }
      .good-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #065F46; }
      .explain { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .divider { stroke: #E2E8F0; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">LPIC-1 · TRAMPAS CLÁSICAS</text>
    <text class="title" x="40" y="78">Cuatro cambios de una letra</text>
    <text class="subtitle" x="40" y="102">El comando erróneo frente al correcto.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-trampa-1">
      <rect class="card-trap" x="40" y="126" width="420" height="174" rx="10"/>
      <text class="card-head" x="64" y="154">TRAMPA 1 · UPDATE NO ACTUALIZA</text>
      <line class="divider" x1="64" y1="166" x2="436" y2="166"/>
      <rect class="badge-bad" x="64" y="180" width="48" height="22" rx="5"/>
      <text class="badge-text-bad" x="88" y="195">MAL</text>
      <text class="bad-mono" x="124" y="196">apt-get update</text>
      <rect class="badge-good" x="64" y="212" width="52" height="22" rx="5"/>
      <text class="badge-text-good" x="90" y="227">BIEN</text>
      <text class="good-mono" x="130" y="228">apt-get upgrade</text>
      <text class="explain" x="64" y="262">update solo descarga las listas de internet;</text>
      <text class="explain" x="64" y="284">lo que cambia versiones es upgrade o dist-upgrade.</text>
    </g>

    <g id="node-trampa-2">
      <rect class="card-trap" x="500" y="126" width="420" height="174" rx="10"/>
      <text class="card-head" x="524" y="154">TRAMPA 2 · MAYÚSCULAS DE DPKG</text>
      <line class="divider" x1="524" y1="166" x2="896" y2="166"/>
      <rect class="badge-bad" x="524" y="180" width="48" height="22" rx="5"/>
      <text class="badge-text-bad" x="548" y="195">MAL</text>
      <text class="bad-mono" x="584" y="196">dpkg -s /ruta</text>
      <rect class="badge-good" x="524" y="212" width="52" height="22" rx="5"/>
      <text class="badge-text-good" x="550" y="227">BIEN</text>
      <text class="good-mono" x="590" y="228">-s status · -l paquetes</text>
      <text class="explain" x="524" y="262">Minúscula = paquetes; mayúscula = archivos.</text>
      <text class="explain" x="524" y="284">-S busca el dueño y -L lista los ficheros.</text>
    </g>

    <g id="node-trampa-3">
      <rect class="card-trap" x="40" y="324" width="420" height="174" rx="10"/>
      <text class="card-head" x="64" y="352">TRAMPA 3 · .DEB O NOMBRE LÓGICO</text>
      <line class="divider" x1="64" y1="364" x2="436" y2="364"/>
      <rect class="badge-bad" x="64" y="378" width="48" height="22" rx="5"/>
      <text class="badge-text-bad" x="88" y="393">MAL</text>
      <text class="bad-mono" x="124" y="394">dpkg -r tree_1.8.0-1_amd64.deb</text>
      <rect class="badge-good" x="64" y="410" width="52" height="22" rx="5"/>
      <text class="badge-text-good" x="90" y="425">BIEN</text>
      <text class="good-mono" x="130" y="426">dpkg -r tree</text>
      <text class="explain" x="64" y="460">dpkg -i exige el fichero .deb completo;</text>
      <text class="explain" x="64" y="482">dpkg -r y apt exigen solo el nombre.</text>
    </g>

    <g id="node-trampa-4">
      <rect class="card-trap" x="500" y="324" width="420" height="174" rx="10"/>
      <text class="card-head" x="524" y="352">TRAMPA 4 · DPKG -S CONTRA APT-FILE</text>
      <line class="divider" x1="524" y1="364" x2="896" y2="364"/>
      <rect class="badge-bad" x="524" y="378" width="48" height="22" rx="5"/>
      <text class="badge-text-bad" x="548" y="393">MAL</text>
      <text class="bad-mono" x="584" y="394">dpkg -S stdio.h</text>
      <rect class="badge-good" x="524" y="410" width="52" height="22" rx="5"/>
      <text class="badge-text-good" x="550" y="425">BIEN</text>
      <text class="good-mono" x="590" y="426">apt-file search stdio.h</text>
      <text class="explain" x="524" y="460">dpkg -S /bin/ls funciona: el archivo existe;</text>
      <text class="explain" x="524" y="482">para lo no instalado, apt-file search.</text>
    </g>
  </g>
</svg>
