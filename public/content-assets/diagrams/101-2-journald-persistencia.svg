<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="journald-conf-title journald-conf-desc">
  <title id="journald-conf-title">Persistencia del journal de systemd: /run/log/journal volátil frente a /var/log/journal en disco (LPIC-1 101.2)</title>
  <desc id="journald-conf-desc">El demonio systemd-journald guarda sus registros en /run/log/journal cuando está en modo volátil, sobre tmpfs, y todo se borra al reiniciar; con Storage=persistent los escribe en /var/log/journal, en disco, y el historial sobrevive para poder auditar una caída con journalctl -b -1. La opción journalctl -D /mnt/servidor_caido/var/log/journal/ permite leer el journal de un disco montado de otro sistema, que es la vía forense cuando la máquina no arranca.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .panel-b { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .path-a { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; }
      .path-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #065F46; }
      .row-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
      .row-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #065F46; }
      .row-mono-a { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #881337; }
      .row-mono-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #065F46; }
      .divider-a { stroke: #FECDD3; stroke-width: 1.5; }
      .divider-b { stroke: #A7F3D0; stroke-width: 1.5; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">JOURNALD · DÓNDE SE GUARDAN LOS LOGS</text>
    <text class="title" x="40" y="78">El mismo journal, dos destinos</text>
    <text class="subtitle" x="40" y="102">En RAM se pierde; en disco se puede auditar.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-volatil">
      <rect class="panel-a" x="40" y="130" width="420" height="230" rx="10"/>
      <text class="head-a" x="64" y="162">MODO VOLÁTIL · EN RAM</text>
      <text class="path-a" x="64" y="196">/run/log/journal/</text>
      <line class="divider-a" x1="64" y1="212" x2="436" y2="212"/>
      <text class="row-a" x="64" y="242">Sobre tmpfs, en memoria.</text>
      <text class="row-a" x="64" y="272">Todos los logs se borran al apagar.</text>
      <text class="row-mono-a" x="64" y="302">Storage=volatile</text>
      <text class="row-a" x="64" y="332">Historial mínimo: sin pasado que revisar.</text>
    </g>

    <g id="node-persistente">
      <rect class="panel-b" x="500" y="130" width="420" height="230" rx="10"/>
      <text class="head-b" x="524" y="162">MODO PERSISTENTE · EN DISCO</text>
      <text class="path-b" x="524" y="196">/var/log/journal/</text>
      <line class="divider-b" x1="524" y1="212" x2="896" y2="212"/>
      <text class="row-b" x="524" y="242">En el disco duro.</text>
      <text class="row-b" x="524" y="272">Conserva el historial de las caídas.</text>
      <text class="row-mono-b" x="524" y="302">Storage=persistent</text>
      <text class="row-b" x="524" y="332">Permite journalctl -b -1 tras reiniciar.</text>
    </g>

    <g id="node-band">
      <rect class="band" x="40" y="380" width="880" height="120" rx="10"/>
      <text class="band-label" x="64" y="410">RESCATE FORENSE</text>
      <text class="band-mono" x="64" y="438">journalctl -D /mnt/servidor_caido/var/log/journal/</text>
      <text class="band-text" x="64" y="462">Por defecto solo lee el sistema encendido; -D lee el journal de un LiveCD o de un disco montado.</text>
      <text class="band-text" x="64" y="486">Sin /var/log/journal/ ni Storage=persistent, los mensajes van a /run.</text>
    </g>
  </g>
</svg>
