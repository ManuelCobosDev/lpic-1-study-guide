<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="swap-title swap-desc">
  <title id="swap-title">Los cuatro pasos para crear y activar un archivo de swap (LPIC-1 102.1)</title>
  <desc id="swap-desc">Secuencia de cuatro pasos que convierte un fichero normal en espacio de intercambio. Primero se crea /swapfile de 2 GB con dd if=/dev/zero of=/swapfile bs=1M count=2048 o con fallocate -l 2G /swapfile; después se restringen los permisos con chmod 600 porque en la swap se vuelcan claves y contraseñas; a continuación mkswap escribe la cabecera o firma que el kernel reconoce; por último swapon activa el espacio de inmediato y swapoff lo desactiva devolviendo las páginas a la RAM.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .step-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #334155; }
      .step-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .side { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .side-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #B45309; }
      .side-small { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .spine { stroke: #1D40D8; stroke-width: 2; opacity: 0.35; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .foot { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · ESPACIO DE INTERCAMBIO</text>
    <text class="title" x="40" y="78">Cuatro pasos y la swap queda activa</text>
    <text class="subtitle" x="40" y="102">No se monta: se prepara, se activa y se apaga</text>
  </g>

  <g id="diagram-relations">
    <line class="spine" x1="80" y1="181" x2="80" y2="239"/>
    <line class="spine" x1="80" y1="269" x2="80" y2="327"/>
    <line class="spine" x1="80" y1="357" x2="80" y2="415"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-step-1">
      <rect class="node-cmd" x="104" y="128" width="556" height="76" rx="10"/>
      <text class="step-title" x="126" y="154">Crear el archivo de 2 GB</text>
      <text class="step-cmd" x="126" y="180">dd if=/dev/zero of=/swapfile bs=1M count=2048</text>
    </g>

    <g id="node-step-2">
      <rect class="node-cmd" x="104" y="216" width="556" height="76" rx="10"/>
      <text class="step-title" x="126" y="242">Permisos solo para root</text>
      <text class="step-cmd" x="126" y="268">chmod 600 /swapfile</text>
    </g>

    <g id="node-step-3">
      <rect class="node-cmd" x="104" y="304" width="556" height="76" rx="10"/>
      <text class="step-title" x="126" y="330">Escribir la firma de swap</text>
      <text class="step-cmd" x="126" y="356">mkswap /swapfile</text>
    </g>

    <g id="node-step-4">
      <rect class="node-cmd" x="104" y="392" width="556" height="76" rx="10"/>
      <text class="step-title" x="126" y="418">Activarla en el acto</text>
      <text class="step-cmd" x="126" y="444">swapon /swapfile</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="80" cy="166" r="15"/>
    <text class="badge-num" x="80" y="171">1</text>
    <text class="side" x="684" y="158">Reserva 2 GB de ceros</text>
    <text class="side-mono" x="684" y="178">o fallocate -l 2G /swapfile</text>

    <circle class="badge" cx="80" cy="254" r="15"/>
    <text class="badge-num" x="80" y="259">2</text>
    <text class="side" x="684" y="246">Aquí se vuelcan claves</text>
    <text class="side-small" x="684" y="266">sin 600, otro usuario las lee</text>

    <circle class="badge" cx="80" cy="342" r="15"/>
    <text class="badge-num" x="80" y="347">3</text>
    <text class="side" x="684" y="334">Cabecera que el kernel</text>
    <text class="side-small" x="684" y="354">reconoce; sin ella no sirve</text>

    <circle class="badge" cx="80" cy="430" r="15"/>
    <text class="badge-num" x="80" y="435">4</text>
    <text class="side" x="684" y="422">Empieza a usarse ya</text>
    <text class="side-small" x="684" y="442">swapoff la devuelve a la RAM</text>

    <text class="foot" x="40" y="492">Partición dedicada: tipo 82 en MBR o 8200 en GPT</text>
    <text class="foot" x="40" y="512">El archivo /swapfile es lo habitual en servidores y cloud</text>
  </g>
</svg>
