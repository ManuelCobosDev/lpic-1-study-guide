<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gleg-title gleg-desc">
  <title id="gleg-title">Instalación de GRUB Legacy desde su shell interactiva: grub, root (hd0,0) y setup (hd0) (LPIC-1 102.2)</title>
  <desc id="gleg-desc">Cadena de cuatro pasos para instalar el cargador antiguo. Desde la terminal de root se ejecuta el comando grub, que abre su shell interactiva; dentro de ella, root (hd0,0) indica en qué disco y partición están los archivos de la etapa 2 y setup (hd0) escribe el cargador en el MBR del primer disco. Al terminar, quit cierra la shell y devuelve el prompt de bash. En GRUB 2 lo mismo se hace con grub-install /dev/sda desde Linux.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .cmd-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .cmd-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .result-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #065F46; }
      .result-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>

    <marker id="gleg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · INSTALACIÓN DE GRUB LEGACY</text>
    <text class="title" x="40" y="78">La shell grub&gt; instala el cargador</text>
    <text class="subtitle" x="40" y="102">root apunta al stage 2 y setup escribe el MBR.</text>
  </g>

  <g id="diagram-relations">
    <path id="gleg-rel-bash-grub" class="edge-blue" data-from="node-bash" data-to="node-grub" data-relation="opens-shell"
          d="M 240 255 H 267" marker-end="url(#gleg-arrow)"/>
    <path id="gleg-rel-grub-root" class="edge-blue" data-from="node-grub" data-to="node-root" data-relation="sets-stage2"
          d="M 467 255 H 493" marker-end="url(#gleg-arrow)"/>
    <path id="gleg-rel-root-setup" class="edge-blue" data-from="node-root" data-to="node-setup" data-relation="installs-mbr"
          d="M 693 255 H 720" marker-end="url(#gleg-arrow)"/>
    <path id="gleg-rel-setup-mbr" class="edge-blue" data-from="node-setup" data-to="node-band-mbr" data-relation="writes"
          d="M 820 305 V 352" marker-end="url(#gleg-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-bash">
      <rect class="node-cmd" x="40" y="205" width="200" height="100" rx="10"/>
      <text class="cmd-name" x="140" y="248">bash</text>
      <text class="cmd-sub" x="140" y="272">terminal de root</text>
    </g>
    <g id="node-grub">
      <rect class="node-cmd" x="267" y="205" width="200" height="100" rx="10"/>
      <text class="cmd-name" x="367" y="248">grub</text>
      <text class="cmd-sub" x="367" y="272">shell interactiva</text>
    </g>
    <g id="node-root">
      <rect class="node-file" x="493" y="205" width="200" height="100" rx="10"/>
      <text class="cmd-name" x="593" y="248">root (hd0,0)</text>
      <text class="cmd-sub" x="593" y="272">apunta al stage 2</text>
    </g>
    <g id="node-setup">
      <rect class="node-file" x="720" y="205" width="200" height="100" rx="10"/>
      <text class="cmd-name" x="820" y="248">setup (hd0)</text>
      <text class="cmd-sub" x="820" y="272">escribe el MBR</text>
    </g>

    <g id="node-band-mbr">
      <rect class="node-ok" x="40" y="352" width="880" height="100" rx="10"/>
      <text class="result-mono" x="64" y="390">MBR del disco 0 (/dev/sda) escrito</text>
      <text class="result-text" x="64" y="416">stage1, stage1_5 y stage2 quedan instalados en el disco.</text>
      <text class="result-text" x="64" y="438">quit cierra la shell y devuelve el prompt de bash.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="140" cy="178" r="15"/>
    <text class="badge-num" x="140" y="183">1</text>
    <circle class="badge" cx="367" cy="178" r="15"/>
    <text class="badge-num" x="367" y="183">2</text>
    <circle class="badge" cx="593" cy="178" r="15"/>
    <text class="badge-num" x="593" y="183">3</text>
    <circle class="badge" cx="820" cy="178" r="15"/>
    <text class="badge-num" x="820" y="183">4</text>
  </g>
</svg>
