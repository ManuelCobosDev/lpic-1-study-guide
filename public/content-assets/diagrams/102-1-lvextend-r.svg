<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ext-title ext-desc">
  <title id="ext-title">lvextend -r: crecer el volumen lógico y el sistema de archivos a la vez (LPIC-1 102.1)</title>
  <desc id="ext-desc">Comparativa de dos formas de ampliar un volumen lógico. Sin la opción -r, lvextend crece el LV de 20 a 30 GiB pero el sistema de archivos ext4 sigue en 20 GiB y los 10 GiB nuevos quedan sin usar hasta ejecutar resize2fs por separado. Con lvextend -L +10G -r, el volumen y el sistema de archivos crecen en la misma orden y en caliente, sin desmontar, de modo que los usuarios siguen trabajando.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-bad { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .panel-good { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .panel-title-bad { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #881337; }
      .panel-title-good { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #065F46; }
      .cmd-bad { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #9F1239; }
      .cmd-good { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #047857; }
      .bar-lv { fill: #EFF4FF; stroke: #2550EB; stroke-width: 1.5; }
      .bar-fs { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
      .bar-fs-ok { fill: #D1FAE5; stroke: #059669; stroke-width: 1.5; }
      .bar-empty { fill: #FFFFFF; stroke: #E11D48; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .bar-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .bar-text-bad { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #9F1239; text-anchor: middle; }
      .note-bad { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #881337; }
      .note-good { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #065F46; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · LVM AVANZADO</text>
    <text class="title" x="40" y="78">Crecer en caliente sin perder el sistema de archivos</text>
    <text class="subtitle" x="40" y="102">La opción -r marca la diferencia entre crecer y crecer bien</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-bad">
      <rect class="panel-bad" x="40" y="124" width="430" height="230" rx="10"/>
      <text class="panel-title-bad" x="64" y="152">Sin -r: solo crece el volumen</text>
      <text class="cmd-bad" x="64" y="176">lvextend -L +10G /dev/vg0/datos</text>
      <rect class="bar-lv" x="64" y="196" width="360" height="28" rx="5"/>
      <text class="bar-text" x="244" y="215">LV 20 → 30 GiB</text>
      <rect class="bar-fs" x="64" y="244" width="240" height="28" rx="5"/>
      <text class="bar-text" x="184" y="263">ext4 20 GiB</text>
      <rect class="bar-empty" x="308" y="244" width="116" height="28" rx="5"/>
      <text class="bar-text-bad" x="366" y="262">sin usar</text>
      <text class="note-bad" x="64" y="318">El FS no crece: 10 GiB quedan muertos hasta</text>
      <text class="note-bad" x="64" y="338">ejecutar resize2fs a mano</text>
    </g>

    <g id="node-panel-good">
      <rect class="panel-good" x="490" y="124" width="430" height="230" rx="10"/>
      <text class="panel-title-good" x="514" y="152">Con -r: crecen las dos capas</text>
      <text class="cmd-good" x="514" y="176">lvextend -L +10G -r /dev/vg0/datos</text>
      <rect class="bar-lv" x="514" y="196" width="360" height="28" rx="5"/>
      <text class="bar-text" x="694" y="215">LV 20 → 30 GiB</text>
      <rect class="bar-fs-ok" x="514" y="244" width="360" height="28" rx="5"/>
      <text class="bar-text" x="694" y="263">ext4 20 → 30 GiB</text>
      <text class="note-good" x="514" y="318">resize2fs o xfs_growfs se ejecutan en la</text>
      <text class="note-good" x="514" y="338">misma orden, con el volumen montado</text>
    </g>

    <g id="node-verdict">
      <rect class="verdict" x="40" y="376" width="880" height="96" rx="10"/>
      <text class="verdict-label" x="64" y="404">VEREDICTO</text>
      <text class="verdict-title" x="64" y="428">-r redimensiona el volumen lógico y el sistema de archivos a la vez</text>
      <text class="verdict-text" x="64" y="452">Sin desmontar y sin cortar el servicio: los usuarios siguen trabajando mientras el disco crece.</text>
    </g>
  </g>
</svg>
