<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sus-title sus-desc">
  <title id="sus-title">Sustitución de comandos en tres tiempos con subshell (LPIC-1 103.4)</title>
  <desc id="sus-desc">La shell ejecuta primero el subcomando encerrado entre paréntesis en una subshell, un proceso hijo independiente. Después su salida sustituye literalmente al texto de la sustitución y, por último, la orden exterior se ejecuta ya con ese resultado como argumento. El panel derecho muestra el ejemplo tar -czf bkp-$(date +%F).tar.gz convertido en tar -czf bkp-2026-11-13.tar.gz y el anidamiento limpio echo $(basename $(pwd)), que no necesita barras invertidas.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .step { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .step-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .step-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #1E36AF; }
      .panel-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .spine { stroke: #1D40D8; stroke-width: 2; opacity: 0.35; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · SUSTITUCIÓN DE COMANDOS</text>
    <text class="title" x="40" y="78">Sustitución en tres tiempos</text>
    <text class="subtitle" x="40" y="102">El subcomando corre primero; su salida es su texto</text>
  </g>

  <g id="diagram-relations">
    <line id="sus-spine-1" class="spine" x1="44" y1="209" x2="44" y2="279"/>
    <line id="sus-spine-2" class="spine" x1="44" y1="309" x2="44" y2="379"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-paso-ejecuta">
      <rect class="step" x="72" y="150" width="488" height="88" rx="10"/>
      <text class="step-title" x="96" y="184">La shell lanza el subcomando</text>
      <text class="step-sub" x="96" y="212">en una subshell: un proceso hijo aparte</text>
    </g>

    <g id="node-paso-sustituye">
      <rect class="step" x="72" y="250" width="488" height="88" rx="10"/>
      <text class="step-title" x="96" y="284">La salida sustituye al texto</text>
      <text class="step-sub" x="96" y="312">la sustitución desaparece y deja su resultado</text>
    </g>

    <g id="node-paso-ejecuta-orden">
      <rect class="step" x="72" y="350" width="488" height="88" rx="10"/>
      <text class="step-title" x="96" y="384">Se ejecuta la orden exterior</text>
      <text class="step-sub" x="96" y="412">ya con el resultado como argumento</text>
    </g>

    <g id="node-ejemplo">
      <rect class="panel" x="600" y="150" width="320" height="288" rx="10"/>
      <text class="panel-head" x="624" y="178">EL NOMBRE SE CALCULA AL VUELO</text>
      <text class="row-label" x="624" y="206">ORDEN ESCRITA</text>
      <text class="mono" x="624" y="228">tar -czf bkp-$(date +%F).tar.gz</text>
      <line class="divider" x1="624" y1="244" x2="896" y2="244"/>
      <text class="row-label" x="624" y="268">ORDEN EJECUTADA</text>
      <text class="mono" x="624" y="290">tar -czf bkp-2026-11-13.tar.gz</text>
      <line class="divider" x1="624" y1="306" x2="896" y2="306"/>
      <text class="row-label" x="624" y="332">ANIDADO SIN ESCAPES</text>
      <text class="mono" x="624" y="354">echo $(basename $(pwd))</text>
      <text class="panel-note" x="624" y="380">sin barras invertidas ni comillas</text>
      <text class="panel-note" x="624" y="402">sueltas: solo paréntesis anidados</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="44" cy="194" r="15"/>
    <text class="badge-num" x="44" y="199">1</text>
    <circle class="badge" cx="44" cy="294" r="15"/>
    <text class="badge-num" x="44" y="299">2</text>
    <circle class="badge" cx="44" cy="394" r="15"/>
    <text class="badge-num" x="44" y="399">3</text>
    <text class="note" x="40" y="470">Ejecución en subshell: las variables creadas</text>
    <text class="note" x="40" y="492">dentro se destruyen al terminar el proceso hijo.</text>
  </g>
</svg>
