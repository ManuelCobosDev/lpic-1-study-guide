<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ncb-title ncb-desc">
  <title id="ncb-title">Decisión de set -o noclobber ante un archivo existente (LPIC-1 103.4)</title>
  <desc id="ncb-desc">Con la opción noclobber activa, el intento echo 'dato' &gt; f.txt llega a una decisión: si el archivo existe, la shell aborta la operación con el mensaje cannot overwrite existing file; si no existe, lo crea y escribe. La banda inferior recoge las tres excepciones: el operador &gt;| fuerza la sobreescritura sin apagar la protección, &gt;&gt; nunca destruye datos y por eso siempre se permite, y /dev/null es un archivo especial que admite la redirección con set -C activo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-dec { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-stop { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .node-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .band { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .q { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .opt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #B45309; }
      .stop-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .stop-msg { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #BE123C; }
      .ok-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #065F46; }
      .ok-msg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #065F46; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #0F172A; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-stop { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
      .edge-ok { fill: none; stroke: #059669; stroke-width: 2.5; }
    </style>
    <marker id="ncb-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="ncb-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
    <marker id="ncb-arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · PROTECCIÓN NOCLOBBER</text>
    <text class="title" x="40" y="78">Nada se trunca sin permiso</text>
    <text class="subtitle" x="40" y="102">Con set -C activo, &gt; no vacía un archivo existente</text>
  </g>

  <g id="diagram-relations">
    <path id="ncb-rel-intento-decision" class="edge"
          data-from="node-intento" data-to="node-decision" data-relation="comprueba-existencia"
          d="M 320 240 H 390" marker-end="url(#ncb-arrow-blue)"/>
    <path id="ncb-rel-decision-aborta" class="edge-stop"
          data-from="node-decision" data-to="node-aborta" data-relation="archivo-existente"
          d="M 600 225 H 632 V 176 H 664" marker-end="url(#ncb-arrow-rose)"/>
    <path id="ncb-rel-decision-escribe" class="edge-ok"
          data-from="node-decision" data-to="node-escribe" data-relation="archivo-nuevo"
          d="M 600 255 H 632 V 336 H 664" marker-end="url(#ncb-arrow-emerald)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-intento">
      <rect class="node-cmd" x="40" y="196" width="280" height="88" rx="10"/>
      <text class="cmd" x="64" y="232">echo 'dato' &gt; f.txt</text>
      <text class="sub" x="64" y="258">intento de sobreescritura</text>
    </g>

    <g id="node-decision">
      <rect class="node-dec" x="390" y="186" width="210" height="108" rx="10"/>
      <text class="q" x="414" y="222">¿Existe f.txt</text>
      <text class="q" x="414" y="244">con noclobber activo?</text>
      <text class="opt" x="414" y="272">set -C</text>
    </g>

    <g id="node-aborta">
      <rect class="node-stop" x="664" y="126" width="256" height="100" rx="10"/>
      <text class="stop-title" x="688" y="162">Se aborta la operación</text>
      <text class="stop-msg" x="688" y="190">cannot overwrite</text>
      <text class="stop-msg" x="688" y="210">existing file</text>
    </g>

    <g id="node-escribe">
      <rect class="node-ok" x="664" y="286" width="256" height="100" rx="10"/>
      <text class="ok-title" x="688" y="322">Escribe y trunca f.txt</text>
      <text class="ok-msg" x="688" y="348">el archivo queda</text>
      <text class="ok-msg" x="688" y="368">solo con lo nuevo</text>
    </g>

    <g id="node-excepciones">
      <rect class="band" x="40" y="404" width="880" height="104" rx="10"/>
      <text class="band-text" x="64" y="436">Excepciones: &gt;| fuerza la sobreescritura sin apagar la protección.</text>
      <text class="band-text" x="64" y="464">&gt;&gt; nunca destruye datos, así que noclobber la permite siempre.</text>
      <text class="band-text" x="64" y="492">/dev/null es especial: set -C no bloquea cmd &gt; /dev/null.</text>
    </g>
  </g>
</svg>
