<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dt-title dt-desc">
  <title id="dt-title">isolate cambia el target ahora y set-default lo cambia para el próximo arranque (LPIC-1 101.3)</title>
  <desc id="dt-desc">systemctl isolate multi-user.target cambia de objetivo en caliente: arranca las unidades del nuevo target y detiene las que no pertenecen a él, de modo que el escritorio gráfico se cierra. systemctl set-default multi-user.target no toca la sesión actual: reescribe el enlace simbólico /etc/systemd/system/default.target para que el próximo arranque entre en multi-user.target. Para un solo arranque se pasa systemd.unit=rescue.target al núcleo desde GRUB. El objetivo predeterminado nunca debe apuntar a shutdown.target, que equivale al nivel 0.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .chip { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .chip-b { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .mono-chip { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .mono-chip-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #B45309; }
      .effect { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .kicker { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .sub-14 { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-b { fill: none; stroke: #D97706; stroke-width: 2.5; }
      .link { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .mono-link { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .sub-13 { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="dt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="dt-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SYSTEMD · CAMBIO DE TARGET</text>
    <text class="title" x="40" y="78">Ahora, siempre o solo una vez</text>
    <text class="subtitle" x="40" y="102">isolate actúa ya; set-default cambia el próximo arranque</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-isolate">
      <rect class="chip" x="40" y="132" width="440" height="60" rx="10"/>
      <text class="mono-chip" x="64" y="170">systemctl isolate multi-user.target</text>
    </g>

    <g id="node-isolate-effect">
      <rect class="effect" x="530" y="132" width="390" height="80" rx="10"/>
      <text class="kicker" x="554" y="160">EFECTO INMEDIATO</text>
      <text class="sub-14" x="554" y="184">Detiene los servicios que no están en el</text>
      <text class="sub-14" x="554" y="204">target: el escritorio gráfico se cierra.</text>
    </g>

    <g id="node-setdefault">
      <rect class="chip-b" x="40" y="280" width="440" height="60" rx="10"/>
      <text class="mono-chip-b" x="64" y="318">systemctl set-default multi-user.target</text>
    </g>

    <g id="node-setdefault-effect">
      <rect class="effect" x="530" y="280" width="390" height="100" rx="10"/>
      <text class="kicker" x="554" y="308">PRÓXIMO ARRANQUE</text>
      <text class="sub-14" x="554" y="332">Reescribe el enlace /etc/systemd/system/</text>
      <text class="sub-14" x="554" y="352">default.target; no toca la sesión actual.</text>
    </g>

    <g id="node-default-target">
      <rect class="link" x="40" y="402" width="880" height="64" rx="10"/>
      <text class="mono-link" x="64" y="430">default.target → /lib/systemd/system/multi-user.target</text>
      <text class="sub-13" x="64" y="452">enlace simbólico que systemd lee en cada arranque</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="dt-rel-isolate" class="edge" data-from="node-isolate" data-to="node-isolate-effect" data-relation="applies-now"
          d="M 480 162 H 530" marker-end="url(#dt-arrow)"/>
    <path id="dt-rel-setdefault" class="edge-b" data-from="node-setdefault" data-to="node-setdefault-effect" data-relation="applies-next-boot"
          d="M 480 310 H 530" marker-end="url(#dt-arrow-b)"/>
    <path id="dt-rel-setdefault-link" class="edge-b" data-from="node-setdefault" data-to="node-default-target" data-relation="rewrites-symlink"
          d="M 260 340 V 402" marker-end="url(#dt-arrow-b)"/>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="492">Solo un arranque: systemd.unit=rescue.target en la línea de GRUB.</text>
    <text class="note" x="40" y="512">Nunca como default: shutdown.target, que equivale al nivel 0.</text>
  </g>
</svg>
