<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="chmod-title chmod-desc">
  <title id="chmod-title">Anatomía de la orden chmod simbólica y su equivalencia octal (LPIC-1 104.5)</title>
  <desc id="chmod-desc">La orden chmod se descompone en tres partes: el comando, el modo simbólico u=rwx,g=rx,o=r y el objeto archivo.txt. En el modo simbólico la u indica el dueño, la g el grupo, la o los otros y la a todos; los operadores más, menos e igual añaden, retiran o fijan permisos, y r, w y x eligen el permiso. Ese modo equivale a chmod 754, y en el modo octal el cuarto dígito son los permisos especiales: 0755 es igual a 755. La opción mayúscula X añade ejecución solo a directorios o a archivos que ya la tenían.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .cmd-band { fill: #FFFFFF; stroke: #2550EB; stroke-width: 2; }
      .cmd-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; }
      .cmd-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #334155; }
      .cmd-mode { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #1E36AF; }
      .cmd-file { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #475569; }
      .card { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 2; }
      .card-mode { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-head { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #0F172A; }
      .card-head-mode { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .card-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .formula-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .formula { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">chmod · MODO SIMBÓLICO Y OCTAL</text>
    <text class="title" x="40" y="78">La misma orden, dos notaciones</text>
    <text class="subtitle" x="40" y="102">Quién recibe el permiso, cómo se aplica y qué permiso es</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-comando">
      <rect class="cmd-band" x="40" y="136" width="880" height="88" rx="10"/>
      <text class="cmd-label" x="64" y="160">SINTAXIS</text>
      <text class="cmd-name" x="236" y="192">chmod</text>
      <text class="cmd-mode" x="322" y="192">u=rwx,g=rx,o=r</text>
      <text class="cmd-file" x="552" y="192">archivo.txt</text>
    </g>

    <g id="node-card-orden">
      <rect class="card" x="40" y="250" width="280" height="124" rx="10"/>
      <text class="card-head" x="64" y="284">chmod</text>
      <text class="card-body" x="64" y="314">la orden que cambia el modo</text>
      <text class="card-body" x="64" y="338">-R: recursivo en todo el árbol</text>
    </g>

    <g id="node-card-modo">
      <rect class="card-mode" x="340" y="250" width="280" height="124" rx="10"/>
      <text class="card-head-mode" x="364" y="284">u=rwx,g=rx,o=r</text>
      <text class="card-body" x="364" y="314">quién + operador + permiso</text>
      <text class="card-body" x="364" y="338">u,g,o,a · +,-,= · r,w,x</text>
    </g>

    <g id="node-card-objeto">
      <rect class="card" x="640" y="250" width="280" height="124" rx="10"/>
      <text class="card-head" x="664" y="284">archivo.txt</text>
      <text class="card-body" x="664" y="314">el objeto del cambio</text>
      <text class="card-body" x="664" y="338">archivo o directorio</text>
    </g>

    <g id="node-formula">
      <rect class="formula-band" x="40" y="392" width="880" height="116" rx="10"/>
      <text class="formula" x="480" y="422">chmod u=rwx,g=rx,o=r = chmod 754</text>
      <text class="note" x="64" y="454">Modo octal: 4.º dígito = especiales; después dueño, grupo y otros.</text>
      <text class="note" x="64" y="480">0755 = 755. Con +X, la ejecución se añade solo a directorios o a archivos que ya tenían x.</text>
    </g>
  </g>
</svg>
