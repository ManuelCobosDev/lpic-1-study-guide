<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="peb-title peb-desc">
  <title id="peb-title">Particiones estándar: qué se separa de la raíz y qué no (LPIC-1 102.1)</title>
  <desc id="peb-desc">Dos paneles enfrentados. En el panel izquierdo se separan /boot, la ESP montada en /boot/efi y /home porque protegen el arranque, la compatibilidad con la UEFI y los datos personales; la raíz se puede reinstalar (Ubuntu, Debian o Fedora) conservando /home. En el panel derecho permanecen dentro de la raíz /root, /etc, /bin y /lib: el modo de rescate monousuario solo monta la raíz y necesita el directorio de inicio del usuario raíz, la configuración y los binarios esenciales.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-yes { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .panel-no { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .panel-head-yes { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .panel-head-no { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .path { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · PARTICIONES ESTÁNDAR</text>
    <text class="title" x="40" y="78">Qué se separa y qué no</text>
    <text class="subtitle" x="40" y="102">Qué gana una partición propia y qué se queda con la raíz</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-yes">
      <rect class="panel-yes" x="40" y="124" width="428" height="296" rx="10"/>
      <text class="panel-head-yes" x="64" y="154">SEPARA EN SU PROPIA PARTICIÓN</text>
      <text class="path" x="64" y="192">/boot</text>
      <text class="desc" x="64" y="212">kernel vmlinuz e initramfs; 300 MB bastan</text>
      <text class="detail" x="64" y="231">CHS/INT 13h: 1024 cilindros ≈ 528 MB; con LBA, 8,4 GB</text>
      <text class="path" x="64" y="256">/boot/efi (ESP)</text>
      <text class="desc" x="64" y="276">FAT16 o FAT32 obligatorio: la UEFI no lee ext4 ni LVM</text>
      <text class="detail" x="64" y="295">GUID en GPT, 0xEF en MBR · aquí vive grubx64.efi</text>
      <text class="path" x="64" y="320">/home</text>
      <text class="desc" x="64" y="340">tus datos sobreviven a reinstalar la raíz /</text>
      <text class="detail" x="64" y="359">cuotas usrquota limitan el espacio por usuario</text>
      <text class="detail" x="64" y="392">No es obligatorio, pero protege el arranque</text>
    </g>

    <g id="node-panel-no">
      <rect class="panel-no" x="492" y="124" width="428" height="296" rx="10"/>
      <text class="panel-head-no" x="516" y="154">NO SEPARES: VAN DENTRO DE LA RAÍZ /</text>
      <text class="path" x="516" y="192">/root</text>
      <text class="desc" x="516" y="212">directorio de inicio del usuario raíz</text>
      <text class="detail" x="516" y="231">no /home/root · rescate: solo se monta /</text>
      <text class="path" x="516" y="256">/etc</text>
      <text class="desc" x="516" y="276">configuración del sistema, siempre necesaria</text>
      <text class="detail" x="516" y="295">se necesita incluso en el arranque mínimo</text>
      <text class="path" x="516" y="320">/bin, /lib</text>
      <text class="desc" x="516" y="340">binarios y bibliotecas esenciales</text>
      <text class="detail" x="516" y="359">sin ellos no hay shell ni rescate posible</text>
      <text class="detail" x="516" y="392">Si /root vive en otro disco, el rescate no lo monta</text>
    </g>

    <g id="node-verdict">
      <rect class="verdict" x="40" y="436" width="880" height="52" rx="10"/>
      <text class="verdict-label" x="64" y="468">VEREDICTO</text>
      <text class="verdict-text" x="180" y="468">Candidatos a partición propia: /boot, /home y /var</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="64" y1="168" x2="444" y2="168"/>
    <line class="divider" x1="516" y1="168" x2="896" y2="168"/>
  </g>
</svg>
