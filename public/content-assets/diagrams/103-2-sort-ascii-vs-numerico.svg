<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sort-title sort-desc">
  <title id="sort-title">sort -t: -k3 frente a sort -t: -k3 -n sobre la columna UID de /etc/passwd (LPIC-1 103.2)</title>
  <desc id="sort-desc">La misma columna 3 de /etc/passwd, con los valores 10, 2, 1000 y 1, se ordena de dos maneras. sort -t: -k3 compara carácter a carácter, así que deja el orden 1, 10, 1000, 2 porque el código ASCII del carácter 1 es menor que el del 2. sort -t: -k3 -n compara valores numéricos y deja 1, 2, 10, 1000. La opción -t fija los dos puntos como separador de campos y -k3 selecciona el tercer campo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #64748B; letter-spacing: 0.04em; }
      .input-band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .val { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .divider-warm { stroke: #F59E0B; stroke-width: 1.5; }
      .panel-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head-a { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .panel-head-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .result { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .why { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="sort-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ORDENAR · sort</text>
    <text class="title" x="40" y="78">El mismo campo, dos criterios</text>
    <text class="subtitle" x="40" y="102">sort -t: -k3 frente a sort -t: -k3 -n</text>
  </g>

  <g id="diagram-relations">
    <path id="sort-rel-a" class="edge" data-from="node-input" data-to="node-panel-ascii" data-relation="ordena-texto"
          d="M 255 240 V 300" marker-end="url(#sort-arrow)"/>
    <path id="sort-rel-b" class="edge" data-from="node-input" data-to="node-panel-num" data-relation="ordena-numero"
          d="M 705 240 V 300" marker-end="url(#sort-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-input">
      <rect class="input-band" x="140" y="176" width="680" height="64" rx="8"/>
      <line class="divider" x1="310" y1="176" x2="310" y2="240"/>
      <line class="divider" x1="480" y1="176" x2="480" y2="240"/>
      <line class="divider" x1="650" y1="176" x2="650" y2="240"/>
      <text class="val" x="225" y="216">10</text>
      <text class="val" x="395" y="216">2</text>
      <text class="val" x="565" y="216">1000</text>
      <text class="val" x="735" y="216">1</text>
    </g>

    <g id="node-panel-ascii">
      <rect class="panel-a" x="40" y="300" width="430" height="170" rx="10"/>
      <text class="panel-head-a" x="64" y="332">sort -t: -k3</text>
      <line class="divider" x1="64" y1="346" x2="446" y2="346"/>
      <text class="result" x="64" y="384">1   10   1000   2</text>
      <text class="why" x="64" y="418">Compara carácter a carácter: el código</text>
      <text class="why" x="64" y="442">de «1» (49) es menor que el de «2» (50).</text>
    </g>

    <g id="node-panel-num">
      <rect class="panel-b" x="490" y="300" width="430" height="170" rx="10"/>
      <text class="panel-head-b" x="514" y="332">sort -t: -k3 -n</text>
      <line class="divider" x1="514" y1="346" x2="896" y2="346"/>
      <text class="result" x="514" y="384">1   2   10   1000</text>
      <text class="why" x="514" y="418">Compara valores numéricos: el UID 1000</text>
      <text class="why" x="514" y="442">cae al final, detrás de 0, 1 y 2.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="tag" x="140" y="164">campo 3 de /etc/passwd (UID)</text>
  </g>
</svg>
