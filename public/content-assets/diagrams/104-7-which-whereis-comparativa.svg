<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="whichwhereis-title whichwhereis-desc">
  <title id="whichwhereis-title">Comparativa entre which y whereis: rutas de PATH frente a rutas estándar del sistema (LPIC-1 104.7)</title>
  <desc id="whichwhereis-desc">which busca únicamente en los directorios de la variable PATH y devuelve la primera coincidencia, o todas con -a; no ve los comandos internos ni los alias. whereis busca en un conjunto fijo de rutas estándar del sistema y devuelve binarios, páginas de manual y fuentes, acotables con -b para binarios, -m para manuales y -s para fuentes. La orden echo $PATH muestra las rutas exactas que consulta which.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-b { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-head-a { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #1E36AF; }
      .panel-head-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .panel-sub-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #2550EB; }
      .panel-sub-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">WHICH · WHEREIS · DOS MAPAS DE BÚSQUEDA</text>
    <text class="title" x="40" y="78">Dos órdenes y dos mapas de búsqueda</text>
    <text class="subtitle" x="40" y="100">which solo busca ejecutables en las rutas de $PATH.</text>
    <text class="subtitle" x="40" y="120">whereis busca binarios, manuales y fuentes.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-which">
      <rect class="panel-a" x="40" y="132" width="430" height="320" rx="10"/>
      <text class="panel-head-a" x="64" y="168">which</text>
      <text class="panel-sub-a" x="64" y="188">busca en los directorios de $PATH</text>
      <line class="divider" x1="64" y1="200" x2="446" y2="200"/>
      <text class="row-label" x="64" y="228">QUÉ DEVUELVE</text>
      <text class="row-value" x="64" y="250">Solo ejecutables del PATH</text>
      <line class="divider" x1="64" y1="268" x2="446" y2="268"/>
      <text class="row-label" x="64" y="288">DÓNDE MIRA</text>
      <text class="row-value" x="64" y="310">Las rutas de $PATH: echo $PATH</text>
      <line class="divider" x1="64" y1="328" x2="446" y2="328"/>
      <text class="row-label" x="64" y="348">RESULTADO</text>
      <text class="row-value" x="64" y="370">La primera coincidencia; -a todas</text>
      <line class="divider" x1="64" y1="388" x2="446" y2="388"/>
      <text class="row-label" x="64" y="408">LÍMITE</text>
      <text class="row-value" x="64" y="430">No ve builtins ni alias</text>
    </g>

    <g id="node-panel-whereis">
      <rect class="panel-b" x="490" y="132" width="430" height="320" rx="10"/>
      <text class="panel-head-b" x="514" y="168">whereis</text>
      <text class="panel-sub-b" x="514" y="188">busca en un conjunto fijo de rutas</text>
      <line class="divider" x1="514" y1="200" x2="896" y2="200"/>
      <text class="row-label" x="514" y="228">QUÉ DEVUELVE</text>
      <text class="row-value" x="514" y="250">Binarios, manuales y fuentes</text>
      <line class="divider" x1="514" y1="268" x2="896" y2="268"/>
      <text class="row-label" x="514" y="288">DÓNDE MIRA</text>
      <text class="row-value" x="514" y="310">Rutas estándar del sistema</text>
      <line class="divider" x1="514" y1="328" x2="896" y2="328"/>
      <text class="row-label" x="514" y="348">RESULTADO</text>
      <text class="row-value" x="514" y="370">Todas las rutas que encuentra</text>
      <line class="divider" x1="514" y1="388" x2="896" y2="388"/>
      <text class="row-label" x="514" y="408">MODIFICADORES</text>
      <text class="row-value" x="514" y="430">-b binario · -m manual · -s fuentes</text>
    </g>

    <g id="node-veredicto">
      <rect class="verdict" x="40" y="466" width="880" height="46" rx="8"/>
      <text class="verdict-label" x="64" y="495">REGLA</text>
      <text class="verdict-text" x="136" y="495">which responde por $PATH; whereis por su lista fija de rutas.</text>
    </g>
  </g>
</svg>
