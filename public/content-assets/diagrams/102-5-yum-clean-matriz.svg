<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ycl-title ycl-desc">
  <title id="ycl-title">Matriz de yum clean y dnf clean: qué borra cada variante de la caché (LPIC-1 102.5)</title>
  <desc id="ycl-desc">Matriz de tres variantes de limpieza por dos contenidos de la caché. clean packages borra únicamente los paquetes .rpm descargados y conserva los metadatos; clean metadata borra únicamente los metadatos e índices de los repositorios y conserva los paquetes; clean all borra las dos cosas de una vez. La caché vive en /var/cache/yum en YUM y en /var/cache/dnf en DNF, y check-update no vacía nada: solo consulta y devuelve el código 100 si hay actualizaciones pendientes.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .matrix { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .head-cell { fill: #F1F5F9; }
      .mono-head { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .head-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .cell-del { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #065F46; text-anchor: middle; }
      .cell-keep { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .grid { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .cache-note { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">YUM Y DNF · CACHÉ Y MANTENIMIENTO</text>
    <text class="title" x="40" y="78">clean: qué borra cada variante</text>
    <text class="subtitle" x="40" y="102">Tres formas de vaciar la caché local</text>
  </g>

  <g id="diagram-groups">
    <rect class="head-cell" x="42" y="152" width="876" height="62"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-matriz">
      <rect class="matrix" x="40" y="150" width="880" height="216" rx="10"/>
      <text class="mono-head" x="403" y="176">clean packages</text>
      <text class="head-sub" x="403" y="200">solo los .rpm</text>
      <text class="mono-head" x="609" y="176">clean metadata</text>
      <text class="head-sub" x="609" y="200">solo los índices</text>
      <text class="mono-head" x="816" y="176">clean all</text>
      <text class="head-sub" x="816" y="200">paquetes y metadatos</text>
      <text class="row-label" x="64" y="258">Paquetes descargados (.rpm)</text>
      <text class="row-label" x="64" y="332">Metadatos de repositorios</text>
      <text class="cell-del" x="403" y="258">Se borra</text>
      <text class="cell-del" x="816" y="258">Se borra</text>
      <text class="cell-keep" x="609" y="258">Se conserva</text>
      <text class="cell-keep" x="403" y="332">Se conserva</text>
      <text class="cell-del" x="609" y="332">Se borra</text>
      <text class="cell-del" x="816" y="332">Se borra</text>
    </g>

    <g id="node-veredicto">
      <rect class="verdict" x="40" y="392" width="880" height="60" rx="10"/>
      <text class="verdict-label" x="64" y="428">COMPLEMENTO</text>
      <text class="verdict-text" x="200" y="428">check-update solo consulta: devuelve 100 si hay parches</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="grid" x1="40" y1="214" x2="920" y2="214"/>
    <line class="grid" x1="40" y1="290" x2="920" y2="290"/>
    <line class="grid" x1="300" y1="150" x2="300" y2="366"/>
    <line class="grid" x1="506" y1="152" x2="506" y2="366"/>
    <line class="grid" x1="712" y1="152" x2="712" y2="366"/>
    <text class="cache-note" x="40" y="488">/var/cache/yum (YUM) · /var/cache/dnf (DNF)</text>
  </g>
</svg>
