<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="duelo-title duelo-desc">
  <title id="duelo-title">dpkg -S frente a apt-file search: dueño de un archivo instalado o remoto (LPIC-1 102.4)</title>
  <desc id="duelo-desc">dpkg -S busca el paquete que instaló un archivo que ya existe en el disco local, consultando los índices de /var/lib/dpkg/info/*.list, y devuelve error si la ruta no está instalada. apt-file search consulta los índices Contents-*.gz descargados de los repositorios y localiza el paquete que contiene un archivo que aún no está instalado; no hace falta tener ni el paquete ni el archivo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-local { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-remote { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .cmd-local { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .cmd-remote { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; }
      .row { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #1E293B; }
      .row-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .verdict-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">APT-FILE · DUELO DE BÚSQUEDA</text>
    <text class="title" x="40" y="78">¿Dónde está el archivo que buscas?</text>
    <text class="subtitle" x="40" y="102">La respuesta depende de si ya está en el disco.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-dpkg">
      <rect class="panel-local" x="40" y="128" width="420" height="282" rx="10"/>
      <text class="panel-head" x="64" y="158">EN DISCO LOCAL</text>
      <text class="cmd-local" x="64" y="190">dpkg -S /ruta</text>
      <line class="divider" x1="64" y1="204" x2="436" y2="204"/>
      <text class="row" x="64" y="236">El archivo ya existe en tu máquina.</text>
      <text class="row" x="64" y="268">Busca en los índices locales:</text>
      <text class="row-mono" x="64" y="292">/var/lib/dpkg/info/*.list</text>
      <text class="row-mono" x="64" y="324">dpkg -S /bin/ls → coreutils</text>
      <text class="row" x="64" y="356">Si no está en el disco, da error.</text>
    </g>

    <g id="node-panel-aptfile">
      <rect class="panel-remote" x="500" y="128" width="420" height="282" rx="10"/>
      <text class="panel-head" x="524" y="158">EN REPOSITORIOS</text>
      <text class="cmd-remote" x="524" y="190">apt-file search fichero</text>
      <line class="divider" x1="524" y1="204" x2="896" y2="204"/>
      <text class="row" x="524" y="236">El archivo no está instalado.</text>
      <text class="row" x="524" y="268">Consulta los índices remotos:</text>
      <text class="row-mono" x="524" y="292">Contents-*.gz de los repositorios</text>
      <text class="row-mono" x="524" y="324">apt-file search stdio.h → libc6-dev</text>
      <text class="row" x="524" y="356">No hace falta tenerlo instalado.</text>
    </g>

    <g id="node-veredicto">
      <rect class="verdict" x="40" y="430" width="880" height="66" rx="10"/>
      <text class="verdict-label" x="64" y="458">VEREDICTO</text>
      <text class="verdict-text" x="176" y="458">¿Está en disco? dpkg -S. ¿No está? apt-file search.</text>
      <text class="verdict-sub" x="64" y="482">dpkg mira el estado local; apt-file, el catálogo remoto.</text>
    </g>
  </g>
</svg>
