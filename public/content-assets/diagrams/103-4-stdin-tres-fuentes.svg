<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ent-title ent-desc">
  <title id="ent-title">Tres fuentes de entrada estándar: archivo, here document y here string (LPIC-1 103.4)</title>
  <desc id="ent-desc">Tres formas de alimentar el descriptor 0 de un comando convergen en su stdin. cmd &lt; datos.txt convierte un archivo en el teclado del proceso; cat &lt;&lt;EOF &gt; cfg inyecta un bloque multilínea escrito dentro del propio script; bc &lt;&lt;&lt; '10 * 5' pasa una única cadena en memoria. El comando lee de su entrada estándar y desconoce el nombre del archivo, como muestra mysql -u root bdd &lt; copia.sql.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-doc { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .card-str { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .hub { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2.5; }
      .sink { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .band { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .hub-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .hub-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .sink-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .sink-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #0F172A; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>
    <marker id="ent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · ENTRADA ESTÁNDAR (DESCRIPTOR 0)</text>
    <text class="title" x="40" y="78">Tres formas de alimentar stdin</text>
    <text class="subtitle" x="40" y="102">La flecha apunta hacia el comando, no al revés</text>
  </g>

  <g id="diagram-relations">
    <path id="ent-rel-archivo" class="edge"
          data-from="node-fuente-archivo" data-to="node-stdin" data-relation="redirige-archivo"
          d="M 290 188 H 376" marker-end="url(#ent-arrow)"/>
    <path id="ent-rel-heredoc" class="edge"
          data-from="node-fuente-heredoc" data-to="node-stdin" data-relation="inyecta-bloque"
          d="M 290 286 H 376" marker-end="url(#ent-arrow)"/>
    <path id="ent-rel-herestring" class="edge"
          data-from="node-fuente-herestring" data-to="node-stdin" data-relation="inyecta-cadena"
          d="M 290 384 H 376" marker-end="url(#ent-arrow)"/>
    <path id="ent-rel-stdin-comando" class="edge"
          data-from="node-stdin" data-to="node-comando" data-relation="alimenta-proceso"
          d="M 546 289 H 600" marker-end="url(#ent-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-fuente-archivo">
      <rect class="card-file" x="40" y="146" width="250" height="84" rx="10"/>
      <text class="cmd" x="64" y="182">cmd &lt; datos.txt</text>
      <text class="sub" x="64" y="206">el archivo es su teclado</text>
    </g>

    <g id="node-fuente-heredoc">
      <rect class="card-doc" x="40" y="244" width="250" height="84" rx="10"/>
      <text class="cmd" x="64" y="280">cat &lt;&lt;EOF &gt; cfg</text>
      <text class="sub" x="64" y="304">bloque multilínea del script</text>
    </g>

    <g id="node-fuente-herestring">
      <rect class="card-str" x="40" y="342" width="250" height="84" rx="10"/>
      <text class="cmd" x="64" y="378">bc &lt;&lt;&lt; '10 * 5'</text>
      <text class="sub" x="64" y="402">una cadena en memoria</text>
    </g>

    <g id="node-stdin">
      <rect class="hub" x="376" y="182" width="170" height="214" rx="10"/>
      <text class="hub-name" x="461" y="272">stdin</text>
      <text class="hub-name" x="461" y="300">(0)</text>
      <text class="hub-sub" x="461" y="332">canal de entrada</text>
    </g>

    <g id="node-comando">
      <rect class="sink" x="600" y="190" width="320" height="196" rx="10"/>
      <text class="sink-title" x="624" y="238">El comando lee</text>
      <text class="sink-title" x="624" y="260">de su stdin</text>
      <text class="sink-cmd" x="624" y="294">mysql -u root bdd</text>
      <text class="sub" x="624" y="324">no recibe la ruta como argumento</text>
    </g>

    <g id="node-matices">
      <rect class="band" x="40" y="440" width="880" height="68" rx="10"/>
      <text class="band-text" x="64" y="470">Sin espacios entre &lt;&lt; y el delimitador; con &lt;&lt; 'EOF' no se expanden las variables.</text>
      <text class="band-text" x="64" y="494">wc -l archivo imprime «28 archivo»; wc -l &lt; archivo imprime solo «28».</text>
    </g>
  </g>
</svg>
