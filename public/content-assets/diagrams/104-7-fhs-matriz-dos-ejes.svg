<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="fhs-matriz-title fhs-matriz-desc">
  <title id="fhs-matriz-title">Matriz de dos ejes del FHS: compartible o no compartible, estático o variable (LPIC-1 104.7)</title>
  <desc id="fhs-matriz-desc">El estándar FHS clasifica cada directorio cruzando dos ejes. En horizontal, los datos compartibles pueden residir en un servidor NFS y montarse en varias máquinas cliente, como /usr y /opt, mientras que los no compartibles son exclusivos del host, como /etc y /boot. En vertical, los datos estáticos no cambian sin la intervención del administrador y los variables crecen por el propio sistema: /var/mail y /var/spool/news son buzones y colas compartidas, y /var/log, /run y /tmp son logs locales, PIDs, sockets volátiles y temporales.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .head-a { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .head-b { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .head-title-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.04em; text-anchor: middle; }
      .head-title-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #B45309; letter-spacing: 0.04em; text-anchor: middle; }
      .head-sub-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #2550EB; text-anchor: middle; }
      .head-sub-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #B45309; text-anchor: middle; }
      .band-static { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .band-variable { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; }
      .band-static-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #334155; letter-spacing: 0.04em; }
      .band-variable-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #065F46; letter-spacing: 0.04em; }
      .cell { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .cell-path { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .cell-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">FHS · MATRIZ DE DOS EJES</text>
    <text class="title" x="40" y="78">La matriz del FHS: dos ejes, cuatro casillas</text>
    <text class="subtitle" x="40" y="102">Compartible o no compartible; estático o variable.</text>
    <text class="subtitle" x="40" y="124">Cada directorio cae en una de las cuatro casillas.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-head-compartible">
      <rect class="head-a" x="40" y="148" width="430" height="48" rx="8"/>
      <text class="head-title-a" x="255" y="170">COMPARTIBLE</text>
      <text class="head-sub-a" x="255" y="189">apto para montar vía red NFS</text>
    </g>

    <g id="node-head-no-compartible">
      <rect class="head-b" x="490" y="148" width="430" height="48" rx="8"/>
      <text class="head-title-b" x="705" y="170">NO COMPARTIBLE</text>
      <text class="head-sub-b" x="705" y="189">exclusivo de este host físico</text>
    </g>

    <g id="node-banda-estatico">
      <rect class="band-static" x="40" y="204" width="880" height="26" rx="6"/>
      <text class="band-static-text" x="62" y="222">ESTÁTICO · no cambia sin la intervención del administrador</text>
    </g>

    <g id="node-usr-opt">
      <rect class="cell" x="40" y="236" width="430" height="102" rx="8"/>
      <text class="cell-path" x="62" y="270">/usr · /opt</text>
      <text class="cell-desc" x="62" y="296">Binarios de aplicaciones, bibliotecas</text>
      <text class="cell-desc" x="62" y="316">compartidas y documentación (/usr/share).</text>
    </g>

    <g id="node-etc-boot">
      <rect class="cell" x="490" y="236" width="430" height="102" rx="8"/>
      <text class="cell-path" x="512" y="270">/etc · /boot</text>
      <text class="cell-desc" x="512" y="296">Configuración de este equipo y archivos</text>
      <text class="cell-desc" x="512" y="316">del kernel y de GRUB para el arranque.</text>
    </g>

    <g id="node-banda-variable">
      <rect class="band-variable" x="40" y="350" width="880" height="26" rx="6"/>
      <text class="band-variable-text" x="62" y="368">VARIABLE · crece o se modifica por el propio sistema</text>
    </g>

    <g id="node-var-mail-spool">
      <rect class="cell" x="40" y="382" width="430" height="102" rx="8"/>
      <text class="cell-path" x="62" y="416">/var/mail · /var/spool/news</text>
      <text class="cell-desc" x="62" y="442">Buzones de correo de red y colas de</text>
      <text class="cell-desc" x="62" y="462">mensajes compartidas.</text>
    </g>

    <g id="node-var-log-run-tmp">
      <rect class="cell" x="490" y="382" width="430" height="102" rx="8"/>
      <text class="cell-path" x="512" y="416">/var/log · /run · /tmp</text>
      <text class="cell-desc" x="512" y="442">Logs locales, PIDs y sockets volátiles</text>
      <text class="cell-desc" x="512" y="462">(/run) y archivos temporales.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="512">El FHS asegura la interoperabilidad entre distribuciones.</text>
  </g>
</svg>
