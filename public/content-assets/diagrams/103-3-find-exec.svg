<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="find-exec-title find-exec-desc">
  <title id="find-exec-title">Cómo sustituye find la ruta en -exec y repite la orden por cada coincidencia (LPIC-1 103.3)</title>
  <desc id="find-exec-desc">find /var/log -name '*.log' recorre el árbol y entrega cada coincidencia a la cláusula -exec; el hueco '{}' es donde find inyecta la ruta encontrada y la orden externa ls -lh se ejecuta una vez por cada ruta, primero con /var/log/dpkg.log y después con /var/log/auth.log. La cláusula cierra con \; porque la barra invertida frena a la shell para que no interprete el punto y coma como fin de línea.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #065F46; }
      .mono-place { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #B45309; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .band-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #334155; }
      .iter-path { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #1E36AF; }
      .iter-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #065F46; }
      .iter-arrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #64748B; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="find-exec-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">find · -exec</text>
    <text class="title" x="40" y="78">Una orden por cada coincidencia</text>
    <text class="subtitle" x="40" y="102">find recorre, inyecta la ruta y ejecuta el comando.</text>
  </g>

  <g id="diagram-relations">
    <path id="find-exec-rel-find-place" class="edge-blue"
          data-from="node-find" data-to="node-placeholder" data-relation="delivers-path"
          d="M 310 200 H 350" marker-end="url(#find-exec-arrow-blue)"/>
    <path id="find-exec-rel-place-cmd" class="edge-blue"
          data-from="node-placeholder" data-to="node-orden" data-relation="runs-command"
          d="M 610 200 H 650" marker-end="url(#find-exec-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-find">
      <rect class="node-cmd" x="40" y="140" width="270" height="130" rx="10"/>
      <text class="mono-name" x="62" y="176">find /var/log</text>
      <text class="mono-name" x="62" y="202">-name '*.log'</text>
      <text class="sub" x="62" y="236">recorre el árbol</text>
    </g>

    <g id="node-placeholder">
      <rect class="node-iface" x="350" y="140" width="260" height="130" rx="10"/>
      <text class="mono-place" x="372" y="180">'{}'</text>
      <text class="sub" x="372" y="212">aquí se inyecta la</text>
      <text class="sub" x="372" y="234">ruta de cada</text>
      <text class="sub" x="372" y="256">coincidencia.</text>
    </g>

    <g id="node-orden">
      <rect class="node-kernel" x="650" y="140" width="270" height="130" rx="10"/>
      <text class="mono-cmd" x="672" y="180">ls -lh</text>
      <text class="sub" x="672" y="212">la orden externa</text>
      <text class="sub" x="672" y="234">se ejecuta por cada</text>
      <text class="sub" x="672" y="256">ruta encontrada.</text>
    </g>

    <g id="node-iteraciones">
      <rect class="band" x="40" y="298" width="880" height="122" rx="10"/>
      <text class="band-head" x="62" y="326">El bloque se repite por cada coincidencia</text>
      <text class="iter-path" x="62" y="360">/var/log/dpkg.log</text>
      <text class="iter-arrow" x="262" y="360">→</text>
      <text class="iter-cmd" x="292" y="360">ls -lh /var/log/dpkg.log</text>
      <text class="iter-path" x="62" y="392">/var/log/auth.log</text>
      <text class="iter-arrow" x="262" y="392">→</text>
      <text class="iter-cmd" x="292" y="392">ls -lh /var/log/auth.log</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="458">\; frena a la shell para que no se coma el punto y coma final.</text>
    <text class="note" x="40" y="482">Con '{}' entrecomillado, find sustituye la ruta completa.</text>
    <text class="note" x="40" y="506">Al buscar desde /, el comando se lanza con sudo.</text>
  </g>
</svg>
