<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gboot-title gboot-desc">
  <title id="gboot-title">Contenido del directorio /boot: núcleo, initrd, config, System.map y grub (LPIC-1 102.2)</title>
  <desc id="gboot-desc">El directorio /boot contiene los ficheros que el cargador necesita para arrancar. Los cuatro primeros llevan el sufijo -VERSION y cada kernel instalado aporta su propio juego: vmlinuz es el núcleo comprimido, initrd.img es el mini sistema en RAM con los drivers para montar la raíz, config guarda las opciones de compilación y System.map la tabla de símbolos y direcciones. El subdirectorio grub alberga el cargador: grub.cfg, los módulos y las fuentes.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .root-box { fill: #F1F5F9; stroke: #475569; stroke-width: 2.5; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .root-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; }
      .root-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .file-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .file-role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
    </style>

    <marker id="gboot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · EL DIRECTORIO /boot</text>
    <text class="title" x="40" y="78">Qué guarda /boot para arrancar</text>
    <text class="subtitle" x="40" y="102">El núcleo, su disco RAM y el cargador que los elige.</text>
  </g>

  <g id="diagram-relations">
    <path id="gboot-rel-vmlinuz" class="edge-blue" data-from="node-boot-dir" data-to="node-vmlinuz" data-relation="contains"
          d="M 270 276 H 300 V 168 H 330" marker-end="url(#gboot-arrow)"/>
    <path id="gboot-rel-initrd" class="edge-blue" data-from="node-boot-dir" data-to="node-initrd" data-relation="contains"
          d="M 270 276 H 300 V 236 H 330" marker-end="url(#gboot-arrow)"/>
    <path id="gboot-rel-config" class="edge-blue" data-from="node-boot-dir" data-to="node-config" data-relation="contains"
          d="M 270 276 H 300 V 304 H 330" marker-end="url(#gboot-arrow)"/>
    <path id="gboot-rel-systemmap" class="edge-blue" data-from="node-boot-dir" data-to="node-systemmap" data-relation="contains"
          d="M 270 276 H 300 V 372 H 330" marker-end="url(#gboot-arrow)"/>
    <path id="gboot-rel-grub" class="edge-blue" data-from="node-boot-dir" data-to="node-grub" data-relation="contains"
          d="M 270 276 H 300 V 440 H 330" marker-end="url(#gboot-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-boot-dir">
      <rect class="root-box" x="40" y="176" width="230" height="200" rx="10"/>
      <text class="root-name" x="64" y="254">/boot</text>
      <text class="root-sub" x="64" y="284">directorio de arranque</text>
      <text class="root-sub" x="64" y="306">que GRUB lee primero</text>
    </g>

    <g id="node-vmlinuz">
      <rect class="node-kernel" x="330" y="140" width="590" height="56" rx="10"/>
      <text class="file-name" x="354" y="162">vmlinuz-6.1.0-18-amd64</text>
      <text class="file-role" x="354" y="186">Núcleo comprimido: la z final significa comprimido</text>
    </g>

    <g id="node-initrd">
      <rect class="node-kernel" x="330" y="208" width="590" height="56" rx="10"/>
      <text class="file-name" x="354" y="230">initrd.img-6.1.0-18-amd64</text>
      <text class="file-role" x="354" y="254">Mini sistema en RAM con los drivers para montar /</text>
    </g>

    <g id="node-config">
      <rect class="node-file" x="330" y="276" width="590" height="56" rx="10"/>
      <text class="file-name" x="354" y="298">config-6.1.0-18-amd64</text>
      <text class="file-role" x="354" y="322">Opciones de compilación: se lee con cat</text>
    </g>

    <g id="node-systemmap">
      <rect class="node-file" x="330" y="344" width="590" height="56" rx="10"/>
      <text class="file-name" x="354" y="366">System.map-6.1.0-18-amd64</text>
      <text class="file-role" x="354" y="390">Símbolos del kernel y direcciones de memoria</text>
    </g>

    <g id="node-grub">
      <rect class="node-file" x="330" y="412" width="590" height="56" rx="10"/>
      <text class="file-name" x="354" y="434">grub/</text>
      <text class="file-role" x="354" y="458">El cargador: grub.cfg, módulos y fuentes</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="40" y="486"><tspan x="40" y="486">Los ficheros del núcleo llevan el sufijo -VERSION:</tspan><tspan x="40" y="508">cada kernel instalado añade su propio juego en /boot.</tspan></text>
  </g>
</svg>
