<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rso-title rso-desc">
  <title id="rso-title">Sobrescribir con &gt; frente a concatenar con &gt;&gt; sobre la salida estándar (LPIC-1 103.4)</title>
  <desc id="rso-desc">Comparativa de los dos operadores de salida estándar del descriptor 1. El operador &gt; trunca el archivo a cero bytes si ya existía y escribe la salida nueva al inicio; el operador &gt;&gt; conserva todos los datos previos y añade la salida nueva al final. Sin número delante del operador, Bash asume el descriptor 1, y la ruta especial /dev/null descarta la salida de forma silenciosa e inmediata.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-rose { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .panel-emerald { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .chip-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .chip-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .head-rose { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #881337; }
      .head-emerald { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #065F46; }
      .panel-kicker { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
      .kicker-rose { fill: #BE123C; }
      .kicker-emerald { fill: #065F46; }
      .row { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .result { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #334155; }
      .result-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .badge-rose { fill: #E11D48; }
      .badge-emerald { fill: #059669; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .chip-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">103.4 · SALIDA ESTÁNDAR (DESCRIPTOR 1)</text>
    <text class="title" x="40" y="78">Truncar frente a concatenar</text>
    <text class="subtitle" x="40" y="102">El mismo destino, dos efectos opuestos sobre los datos previos</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-operador-truncar">
      <rect class="panel-rose" x="40" y="124" width="420" height="252" rx="12"/>
      <text class="head-rose" x="64" y="162">cmd &gt; archivo</text>
      <text class="panel-kicker kicker-rose" x="64" y="188">TRUNCA Y SOBRESCRIBE</text>
      <line class="divider" x1="64" y1="202" x2="436" y2="202"/>
      <circle class="badge-rose" cx="76" cy="226" r="10"/>
      <text class="badge-num" x="76" y="230">1</text>
      <text class="row" x="96" y="230">Si el archivo no existe, lo crea.</text>
      <circle class="badge-rose" cx="76" cy="256" r="10"/>
      <text class="badge-num" x="76" y="260">2</text>
      <text class="row" x="96" y="260">Si ya existía, borra el 100% de los datos.</text>
      <circle class="badge-rose" cx="76" cy="286" r="10"/>
      <text class="badge-num" x="76" y="290">3</text>
      <text class="row" x="96" y="290">Escribe solo la salida nueva, al inicio.</text>
      <rect class="result-box" x="64" y="312" width="372" height="52" rx="8"/>
      <text class="result" x="80" y="344">Resultado: solo queda la salida nueva.</text>
    </g>

    <g id="node-operador-append">
      <rect class="panel-emerald" x="500" y="124" width="420" height="252" rx="12"/>
      <text class="head-emerald" x="524" y="162">cmd &gt;&gt; archivo</text>
      <text class="panel-kicker kicker-emerald" x="524" y="188">CONSERVA Y AÑADE</text>
      <line class="divider" x1="524" y1="202" x2="896" y2="202"/>
      <circle class="badge-emerald" cx="536" cy="226" r="10"/>
      <text class="badge-num" x="536" y="230">1</text>
      <text class="row" x="556" y="230">Si el archivo no existe, lo crea.</text>
      <circle class="badge-emerald" cx="536" cy="256" r="10"/>
      <text class="badge-num" x="536" y="260">2</text>
      <text class="row" x="556" y="260">Conserva todos los datos previos.</text>
      <circle class="badge-emerald" cx="536" cy="286" r="10"/>
      <text class="badge-num" x="536" y="290">3</text>
      <text class="row" x="556" y="290">Añade la salida al final del fichero.</text>
      <rect class="result-box" x="524" y="312" width="372" height="52" rx="8"/>
      <text class="result" x="540" y="344">Resultado: lo viejo y lo nuevo, en orden.</text>
    </g>

    <g id="node-descriptor-implicito">
      <rect class="chip-cmd" x="40" y="396" width="430" height="80" rx="10"/>
      <text class="chip-text" x="64" y="428">Sin número delante del operador,</text>
      <text class="chip-text" x="64" y="456">Bash asume el descriptor 1 (stdout).</text>
    </g>

    <g id="node-dev-null">
      <rect class="chip-iface" x="490" y="396" width="430" height="80" rx="10"/>
      <text class="chip-text" x="514" y="428">/dev/null es el agujero negro:</text>
      <text class="chip-text" x="514" y="456">descarta los datos al instante.</text>
    </g>
  </g>
</svg>
