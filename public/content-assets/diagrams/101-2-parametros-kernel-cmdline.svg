<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cmdline-anat-title cmdline-anat-desc">
  <title id="cmdline-anat-title">Anatomía de la línea de comandos del kernel en /proc/cmdline (LPIC-1 101.2)</title>
  <desc id="cmdline-anat-desc">La línea con la que arranca el kernel contiene cuatro parámetros clave: root=UUID= identifica la partición raíz, ro la monta en solo lectura para que fsck pueda revisarla, quiet y splash silencian los mensajes y muestran el logotipo, y nomodeset desactiva el kernel mode setting (KMS), es decir, la configuración de modos gráficos del kernel. El archivo /proc/cmdline devuelve exactamente esa misma línea, con el orden y los valores con los que arrancó el kernel actual.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .chip { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .chip-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .capa { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PARÁMETROS DEL KERNEL · /proc/cmdline</text>
    <text class="title" x="40" y="78">Anatomía de la línea de arranque</text>
    <text class="subtitle" x="40" y="102">Cuatro parámetros deciden cómo monta el kernel la raíz.</text>
  </g>

  <g id="diagram-relations">
    <line class="guide" x1="196" y1="202" x2="196" y2="254"/>
    <line class="guide" x1="386" y1="202" x2="386" y2="322"/>
    <line class="guide" x1="495" y1="202" x2="495" y2="254"/>
    <line class="guide" x1="638" y1="202" x2="638" y2="322"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-root">
      <rect class="chip" x="44" y="142" width="305" height="60" rx="8"/>
      <text class="chip-text" x="64" y="179">root=UUID=3a7f-8b91-4c2d</text>
    </g>

    <g id="node-ro">
      <rect class="chip" x="355" y="142" width="63" height="60" rx="8"/>
      <text class="chip-text" x="375" y="179">ro</text>
    </g>

    <g id="node-quiet">
      <rect class="chip" x="422" y="142" width="145" height="60" rx="8"/>
      <text class="chip-text" x="442" y="179">quiet splash</text>
    </g>

    <g id="node-nomodeset">
      <rect class="chip" x="575" y="142" width="126" height="60" rx="8"/>
      <text class="chip-text" x="595" y="179">nomodeset</text>
    </g>

    <g id="node-band">
      <rect class="band" x="40" y="380" width="880" height="100" rx="10"/>
      <text class="band-title" x="64" y="410">Dónde se consulta y por qué importa</text>
      <text class="band-text" x="64" y="440"><tspan class="band-mono">cat /proc/cmdline</tspan> devuelve esta misma línea, tal cual arrancó el kernel.</text>
      <text class="band-text" x="64" y="466">Sin <tspan class="band-mono">ro</tspan>, fsck no puede revisar la raíz antes de montarla en rw.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="capa" x="196" y="270" text-anchor="middle">partición raíz /</text>
    <text class="capa" x="495" y="270" text-anchor="middle">silencia y pone logo</text>
    <text class="capa" x="386" y="338" text-anchor="middle">solo lectura</text>
    <text class="capa" x="638" y="338" text-anchor="middle">sin KMS</text>
  </g>
</svg>
