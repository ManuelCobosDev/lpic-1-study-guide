<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="kill-title kill-desc">
  <title id="kill-title">Anatomía de la orden kill: comando, señal opcional y destino obligatorio (LPIC-1 103.5)</title>
  <desc id="kill-desc">La orden kill se compone de tres partes. El comando kill envía una señal, no siempre termina el proceso. La señal es opcional y se puede escribir como número (-9), nombre corto (-KILL) o nombre completo (-SIGKILL); si se omite, kill envía SIGTERM (15), que es un cierre ordenado. El destino es obligatorio: un PID del sistema o un jobspec con almohadilla, como %1, que apunta al trabajo número uno de la shell actual y no al proceso uno del sistema.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .seg-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .seg-signal { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .seg-dest { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .cmd-center { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .signal-center { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #92400E; text-anchor: middle; }
      .dest-center { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .part-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; text-anchor: middle; }
      .part-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .node-note { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">KILL · ANATOMÍA DE LA ORDEN</text>
    <text class="title" x="40" y="78">Una orden, tres argumentos</text>
    <text class="subtitle" x="40" y="102">La señal es opcional; el destino es obligatorio.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-comando">
      <rect class="seg-cmd" x="80" y="150" width="232" height="88" rx="8"/>
      <text class="cmd-center" x="196" y="204">kill</text>
    </g>

    <g id="node-senal">
      <rect class="seg-signal" x="320" y="150" width="292" height="88" rx="8"/>
      <text class="signal-center" x="466" y="204">-SIGKILL</text>
    </g>

    <g id="node-destino">
      <rect class="seg-dest" x="620" y="150" width="260" height="88" rx="8"/>
      <text class="dest-center" x="750" y="204">41205</text>
    </g>

    <g id="node-nota">
      <rect class="node-note" x="40" y="408" width="880" height="84" rx="10"/>
      <text class="note" x="62" y="436">Las tres grafías de la misma señal: -9, -KILL y -SIGKILL.</text>
      <text class="note" x="62" y="462">kill -l lista las 64 señales con su número y su nombre.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="guide" x1="196" y1="238" x2="196" y2="278"/>
    <line class="guide" x1="466" y1="238" x2="466" y2="278"/>
    <line class="guide" x1="750" y1="238" x2="750" y2="278"/>

    <text class="part-label" x="196" y="300">COMANDO</text>
    <text class="part-text" x="196" y="328">envía una señal;</text>
    <text class="part-text" x="196" y="350">no siempre mata.</text>

    <text class="part-label" x="466" y="300">SEÑAL</text>
    <text class="part-text" x="466" y="328">sin argumento usa</text>
    <text class="part-text" x="466" y="350">SIGTERM (15).</text>

    <text class="part-label" x="750" y="300">DESTINO</text>
    <text class="part-text" x="750" y="328">el PID del sistema</text>
    <text class="part-text" x="750" y="350">o %1 para el job.</text>
  </g>
</svg>
