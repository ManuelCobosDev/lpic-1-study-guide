<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vi-salir-title vi-salir-desc">
  <title id="vi-salir-title">Guardar y salir frente a salir sin guardar en vi (LPIC-1 103.8)</title>
  <desc id="vi-salir-desc">vi ofrece dos grupos de comandos de salida. El grupo seguro guarda y cierra el editor: :wq escribe el archivo y sale, :x guarda y sale solo si hubo cambios reales y ZZ hace lo mismo desde el modo normal sin teclear los dos puntos. El grupo de emergencia descarta el trabajo: :q! abandona el editor descartando el cien por cien de los cambios y ZQ es su atajo directo en modo normal. Sobre un archivo modificado, :q no sale, así que hay que elegir entre conservar con :wq o descartar con :q!.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-save { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .panel-drop { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .panel-head-save { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .panel-head-drop { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .key-save { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #065F46; }
      .key-drop { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #BE123C; }
      .row-save { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #065F46; }
      .row-drop { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">VI · MODO EX · GUARDAR Y SALIR</text>
    <text class="title" x="40" y="78">Dos formas de cerrar el editor</text>
    <text class="subtitle" x="40" y="102">Una conserva el trabajo; la otra lo descarta por completo.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-guardar">
      <rect class="panel-save" x="40" y="140" width="420" height="260" rx="10"/>
      <text class="panel-head-save" x="64" y="174">GUARDAR Y SALIR</text>
      <text class="key-save" x="64" y="222">:wq</text>
      <text class="row-save" x="64" y="246">escribe el archivo y cierra vi</text>
      <text class="key-save" x="64" y="288">:x</text>
      <text class="row-save" x="64" y="312">guarda y sale solo si hubo cambios</text>
      <text class="key-save" x="64" y="354">ZZ</text>
      <text class="row-save" x="64" y="378">en modo normal, sin dos puntos</text>
    </g>

    <g id="node-descartar">
      <rect class="panel-drop" x="500" y="140" width="420" height="260" rx="10"/>
      <text class="panel-head-drop" x="524" y="174">SALIR SIN GUARDAR</text>
      <text class="key-drop" x="524" y="222">:q</text>
      <text class="row-drop" x="524" y="246">falla si hay cambios pendientes</text>
      <text class="key-drop" x="524" y="288">:q!</text>
      <text class="row-drop" x="524" y="312">descarta el 100 % de los cambios</text>
      <text class="key-drop" x="524" y="354">ZQ</text>
      <text class="row-drop" x="524" y="378">atajo directo en modo normal</text>
    </g>

    <g id="node-veredicto">
      <rect class="verdict" x="40" y="412" width="880" height="84" rx="10"/>
      <text class="verdict-label" x="64" y="438">VEREDICTO</text>
      <text class="verdict-text" x="64" y="462">Sobre un archivo modificado, :q no sale: decide con :wq o con :q!.</text>
      <text class="verdict-text" x="64" y="486">:q! es la salida de emergencia si tocaste el archivo por error.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <line class="divider" x1="64" y1="188" x2="436" y2="188"/>
    <line class="divider" x1="524" y1="188" x2="896" y2="188"/>
    <line class="divider" x1="64" y1="262" x2="436" y2="262"/>
    <line class="divider" x1="524" y1="262" x2="896" y2="262"/>
    <line class="divider" x1="64" y1="328" x2="436" y2="328"/>
    <line class="divider" x1="524" y1="328" x2="896" y2="328"/>
  </g>
</svg>
