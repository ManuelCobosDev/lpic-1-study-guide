<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="matar-title matar-desc">
  <title id="matar-title">Matriz de decisión entre pidof, pgrep, killall y pkill (LPIC-1 103.5)</title>
  <desc id="matar-desc">Matriz de decisión de dos por dos. Las filas separan el nombre exacto del ejecutable del patrón o usuario; las columnas separan consultar el PID de enviar una señal. En la fila superior, pidof devuelve los números del binario exacto en una línea y killall mata por nombre exacto de ejecutable. En la fila inferior, pgrep busca por expresión regular y con -l añade el nombre, mientras pkill envía señales por patrón o por usuario con -u.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .col-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; text-anchor: middle; }
      .row-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .card-read { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-signal { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-mono-read { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .card-mono-signal { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">BUSCAR O MATAR · CUATRO HERRAMIENTAS</text>
    <text class="title" x="40" y="78">¿Consultar el PID o enviar la señal?</text>
    <text class="subtitle" x="40" y="102">Y en cada fila, nombre exacto o patrón.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-pidof">
      <rect class="card-read" x="180" y="174" width="360" height="134" rx="10"/>
      <text class="card-mono-read" x="204" y="208">pidof nginx</text>
      <text class="card-text" x="204" y="238">Devuelve los PID del binario</text>
      <text class="card-text" x="204" y="260">exacto, en una sola línea.</text>
      <text class="card-text" x="204" y="282">Ideal para scripts: sólo números.</text>
    </g>

    <g id="node-killall">
      <rect class="card-signal" x="560" y="174" width="360" height="134" rx="10"/>
      <text class="card-mono-signal" x="584" y="208">killall nginx</text>
      <text class="card-text" x="584" y="238">Mata por nombre exacto de</text>
      <text class="card-text" x="584" y="260">ejecutable, todos a la vez.</text>
      <text class="card-text" x="584" y="282">killall -i pide confirmación.</text>
    </g>

    <g id="node-pgrep">
      <rect class="card-read" x="180" y="330" width="360" height="134" rx="10"/>
      <text class="card-mono-read" x="204" y="364">pgrep -l &lt;patrón&gt;</text>
      <text class="card-text" x="204" y="394">Busca por expresión regular</text>
      <text class="card-text" x="204" y="416">y es la base de pkill.</text>
      <text class="card-text" x="204" y="438">Con -l añade el nombre; -u, el dueño.</text>
    </g>

    <g id="node-pkill">
      <rect class="card-signal" x="560" y="330" width="360" height="134" rx="10"/>
      <text class="card-mono-signal" x="584" y="364">pkill -u alumno</text>
      <text class="card-text" x="584" y="394">Mata por patrón o por dueño</text>
      <text class="card-text" x="584" y="416">con la señal que indiques.</text>
      <text class="card-text" x="584" y="438">Admite -9 igual que kill.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="col-head" x="360" y="158">SOLO CONSULTAR EL PID</text>
    <text class="col-head" x="740" y="158">ENVIAR UNA SEÑAL</text>

    <text class="row-head" x="44" y="240">NOMBRE</text>
    <text class="row-head" x="44" y="260">EXACTO</text>
    <text class="row-head" x="44" y="396">PATRÓN</text>
    <text class="row-head" x="44" y="416">O USUARIO</text>

    <text class="note" x="180" y="500">kill $(pgrep sleep) pasa la lista de PID a kill.</text>
  </g>
</svg>
