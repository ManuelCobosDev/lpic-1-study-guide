<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ginst-title ginst-desc">
  <title id="ginst-title">Dónde escribe grub-install: MBR con BIOS y ESP con UEFI (LPIC-1 102.2)</title>
  <desc id="ginst-desc">Dos bandas con el mismo comando y distinto destino. Con BIOS y tabla MBR, grub-install /dev/sda escribe el código de arranque en los 512 bytes del MBR y la segunda etapa en el hueco de 32 KB anterior a la primera partición. Con UEFI y tabla GPT no toca el MBR: copia grubx64.efi o grubia32.efi a la partición del sistema EFI, formateada en FAT32 y montada en /boot/efi. En ambos casos el comando se lanza contra el disco, nunca contra una partición.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .band-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 600; fill: #1E36AF; text-anchor: end; }
      .seg-grub { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .seg-disk { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .seg-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .seg-name-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .seg-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .note-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · INSTALACIÓN DE GRUB 2</text>
    <text class="title" x="40" y="78">Dónde escribe grub-install</text>
    <text class="subtitle" x="40" y="102">El firmware y el esquema de particiones deciden la ubicación.</text>
    <text class="band-title" x="40" y="150">BIOS + tabla MBR</text>
    <text class="band-cmd" x="920" y="150">grub-install /dev/sda</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-mbr">
      <rect class="seg-grub" x="40" y="164" width="210" height="76" rx="8"/>
      <text class="seg-name" x="64" y="196">MBR</text>
      <text class="seg-sub" x="64" y="220">512 B · 446 B código</text>
    </g>
    <g id="node-hueco">
      <rect class="seg-grub" x="250" y="164" width="180" height="76" rx="8"/>
      <text class="seg-name" x="274" y="196">hueco 32 KB</text>
      <text class="seg-sub" x="274" y="220">aquí la etapa 2</text>
    </g>
    <g id="node-particion-bios">
      <rect class="seg-disk" x="430" y="164" width="280" height="76" rx="8"/>
      <text class="seg-name-sans" x="454" y="196">primera partición</text>
      <text class="seg-sub" x="454" y="220">/dev/sda1</text>
    </g>
    <g id="node-resto-bios">
      <rect class="seg-disk" x="710" y="164" width="210" height="76" rx="8"/>
      <text class="seg-name-sans" x="734" y="196">resto del disco</text>
      <text class="seg-sub" x="734" y="220">datos del sistema</text>
    </g>

    <g id="node-esp">
      <rect class="seg-disk" x="40" y="346" width="170" height="76" rx="8"/>
      <text class="seg-name" x="64" y="378">ESP</text>
      <text class="seg-sub" x="64" y="402">FAT32 en /boot/efi</text>
    </g>
    <g id="node-grubx64">
      <rect class="seg-grub" x="210" y="346" width="250" height="76" rx="8"/>
      <text class="seg-name" x="234" y="378">grubx64.efi</text>
      <text class="seg-sub" x="234" y="402">lo carga el firmware</text>
    </g>
    <g id="node-grubia32">
      <rect class="seg-grub" x="460" y="346" width="250" height="76" rx="8"/>
      <text class="seg-name" x="484" y="378">grubia32.efi</text>
      <text class="seg-sub" x="484" y="402">máquinas de 32 bits</text>
    </g>
    <g id="node-resto-uefi">
      <rect class="seg-disk" x="710" y="346" width="210" height="76" rx="8"/>
      <text class="seg-name-sans" x="734" y="378">resto del disco</text>
      <text class="seg-sub" x="734" y="402">tabla GPT</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="band-title" x="40" y="318">UEFI + tabla GPT</text>
    <text class="band-cmd" x="920" y="296">grub-install --target=x86_64-efi</text>
    <text class="band-cmd" x="920" y="318">--efi-directory=/boot/efi</text>
    <text class="note-rose" x="40" y="464"><tspan x="40" y="464">Con BIOS, grub-install /dev/sda1 daña el arranque: el instalador va</tspan><tspan x="40" y="488">contra el disco entero (/dev/sda), nunca contra una partición.</tspan></text>
  </g>
</svg>
