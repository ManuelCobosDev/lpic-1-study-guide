<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="uniq-title uniq-desc">
  <title id="uniq-title">Por qué uniq necesita sort delante: dos carriles sobre frutas.txt (LPIC-1 103.2)</title>
  <desc id="uniq-desc">Sobre el mismo fichero frutas.txt con las líneas pera, pera, manzana y pera, el carril superior ejecuta solo uniq y devuelve tres líneas, pera, manzana y pera, porque únicamente elimina las repeticiones consecutivas. El carril inferior encadena sort y uniq -c: sort agrupa las tres peras y uniq -c cuenta, de modo que devuelve dos líneas con recuento, una manzana y tres peras. La banda inferior resume la regla: uniq solo compara líneas consecutivas y por eso se coloca sort delante.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-bad { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-good { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .bad-eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; }
      .good-eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; }
      .out-bad { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 600; fill: #881337; }
      .out-good { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 600; fill: #065F46; }
      .divider { stroke: #E2E8F0; stroke-width: 1.5; }
      .rule { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .rule-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .rule-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="uniq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">DEDUPLICAR · uniq</text>
    <text class="title" x="40" y="78">uniq solo ve al vecino</text>
    <text class="subtitle" x="40" y="102">La misma entrada, con sort y sin sort.</text>
  </g>

  <g id="diagram-relations">
    <path id="uniq-rel-1" class="edge" data-from="node-file-a" data-to="node-uniq" data-relation="sin-ordenar"
          d="M 200 202 H 250" marker-end="url(#uniq-arrow)"/>
    <path id="uniq-rel-2" class="edge" data-from="node-uniq" data-to="node-out-bad" data-relation="salida-parcial"
          d="M 410 202 H 460" marker-end="url(#uniq-arrow)"/>
    <path id="uniq-rel-3" class="edge" data-from="node-file-b" data-to="node-sort" data-relation="mismo-fichero"
          d="M 200 356 H 250" marker-end="url(#uniq-arrow)"/>
    <path id="uniq-rel-4" class="edge" data-from="node-sort" data-to="node-uniq-c" data-relation="agrupa-vecinos"
          d="M 370 356 H 410" marker-end="url(#uniq-arrow)"/>
    <path id="uniq-rel-5" class="edge" data-from="node-uniq-c" data-to="node-out-good" data-relation="salida-con-recuento"
          d="M 560 356 H 600" marker-end="url(#uniq-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-file-a">
      <rect class="node-file" x="40" y="160" width="160" height="72" rx="10"/>
      <text class="mono" x="64" y="190">frutas.txt</text>
      <text class="sub" x="64" y="212">4 líneas</text>
    </g>

    <g id="node-uniq">
      <rect class="node-cmd" x="250" y="160" width="160" height="72" rx="10"/>
      <text class="mono" x="274" y="190">uniq</text>
      <text class="sub" x="274" y="212">solo adyacentes</text>
    </g>

    <g id="node-out-bad">
      <rect class="card-bad" x="460" y="136" width="460" height="132" rx="10"/>
      <text class="bad-eyebrow" x="484" y="160">SALIDA · 3 LÍNEAS</text>
      <line class="divider" x1="484" y1="168" x2="896" y2="168"/>
      <text class="out-bad" x="484" y="196">pera</text>
      <text class="out-bad" x="484" y="222">manzana</text>
      <text class="out-bad" x="484" y="248">pera</text>
    </g>

    <g id="node-file-b">
      <rect class="node-file" x="40" y="316" width="160" height="72" rx="10"/>
      <text class="mono" x="64" y="346">frutas.txt</text>
      <text class="sub" x="64" y="368">mismo fichero</text>
    </g>

    <g id="node-sort">
      <rect class="node-cmd" x="250" y="316" width="120" height="72" rx="10"/>
      <text class="mono" x="274" y="346">sort</text>
      <text class="sub" x="274" y="368">agrupa</text>
    </g>

    <g id="node-uniq-c">
      <rect class="node-cmd" x="410" y="316" width="150" height="72" rx="10"/>
      <text class="mono" x="434" y="346">uniq -c</text>
      <text class="sub" x="434" y="368">cuenta</text>
    </g>

    <g id="node-out-good">
      <rect class="card-good" x="600" y="292" width="320" height="132" rx="10"/>
      <text class="good-eyebrow" x="624" y="316">SORT | UNIQ -C · 2 LÍNEAS</text>
      <line class="divider" x1="624" y1="324" x2="896" y2="324"/>
      <text class="out-good" x="624" y="352">1  manzana</text>
      <text class="out-good" x="624" y="378">3  pera</text>
    </g>

    <g id="node-rule">
      <rect class="rule" x="40" y="444" width="880" height="56" rx="10"/>
      <text class="rule-label" x="64" y="478">REGLA</text>
      <text class="rule-text" x="132" y="478">uniq solo compara líneas consecutivas: por eso se pone sort delante.</text>
    </g>
  </g>
</svg>
