<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="anclas-title anclas-desc">
  <title id="anclas-title">Anclas de posición ^ y $ y comodín . sobre una línea de /etc/passwd (LPIC-1 103.7)</title>
  <desc id="anclas-desc">Una línea real de /etc/passwd se muestra entre dos anclas: el circunflejo ^ marca el inicio estricto de la línea y el dólar $ marca el final antes del salto de línea. Cuatro notas explican el uso de cada metacarácter: ^root solo coincide si root está pegado al principio, bash$ solo si bash queda al final exacto, ^$ detecta una línea completamente vacía de 0 bytes y el punto coincide con exactamente un carácter, nunca con el salto de línea.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-line { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .node-anchor-in { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-anchor-out { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-card { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .line-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 500; fill: #0F172A; text-anchor: middle; }
      .anchor-glyph-in { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .anchor-glyph-out { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .card-mono-in { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; }
      .card-mono-out { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #065F46; }
      .card-mono-empty { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #9F1239; }
      .card-mono-dot { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 34px; font-weight: 700; fill: #B45309; }
      .card-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .mini { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ANCLAS DE POSICIÓN · ^ $ .</text>
    <text class="title" x="40" y="78">Dónde empieza y dónde acaba la línea</text>
    <text class="subtitle" x="40" y="102">Las anclas no buscan texto: fijan la posición del patrón</text>
    <text class="subtitle" x="40" y="122">dentro de la línea, antes del salto de línea.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-ancla-inicio">
      <rect class="node-anchor-in" x="100" y="168" width="64" height="76" rx="10"/>
      <text class="anchor-glyph-in" x="132" y="218">^</text>
    </g>

    <g id="node-linea">
      <rect class="node-line" x="180" y="168" width="600" height="76" rx="10"/>
      <text class="line-text" x="480" y="215">root:x:0:0:root:/root:/bin/bash</text>
    </g>

    <g id="node-ancla-fin">
      <rect class="node-anchor-out" x="796" y="168" width="64" height="76" rx="10"/>
      <text class="anchor-glyph-out" x="828" y="218">$</text>
    </g>

    <g id="node-nota-inicio">
      <rect class="node-card" x="40" y="268" width="430" height="104" rx="10"/>
      <text class="card-mono-in" x="64" y="296">^root</text>
      <text class="card-body" x="64" y="324">Solo coincide si root está pegado al</text>
      <text class="card-body" x="64" y="344">principio estricto de la línea: ignora</text>
      <text class="card-body" x="64" y="364">menciones intermedias de root.</text>
    </g>

    <g id="node-nota-final">
      <rect class="node-card" x="490" y="268" width="430" height="104" rx="10"/>
      <text class="card-mono-out" x="514" y="296">bash$</text>
      <text class="card-body" x="514" y="324">Solo coincide si bash queda pegado al</text>
      <text class="card-body" x="514" y="344">final exacto de la línea, justo antes</text>
      <text class="card-body" x="514" y="364">del salto de línea.</text>
    </g>

    <g id="node-nota-vacia">
      <rect class="node-card" x="40" y="388" width="430" height="104" rx="10"/>
      <text class="card-mono-empty" x="64" y="416">^$</text>
      <text class="card-body" x="64" y="444">Inicio seguido inmediatamente del final</text>
      <text class="card-body" x="64" y="464">sin ningún carácter en medio: línea</text>
      <text class="card-body" x="64" y="484">completamente vacía, de 0 bytes.</text>
    </g>

    <g id="node-nota-punto">
      <rect class="node-card" x="490" y="388" width="430" height="104" rx="10"/>
      <text class="card-mono-dot" x="514" y="418">.</text>
      <text class="mini" x="544" y="416">COMODÍN</text>
      <text class="card-body" x="514" y="444">Coincide con exactamente un carácter:</text>
      <text class="card-body" x="514" y="464">letra, número, espacio o símbolo. Nunca</text>
      <text class="card-body" x="514" y="484">coincide con el salto de línea.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="mini" x="100" y="152">INICIO DE LÍNEA</text>
    <text class="mini" x="860" y="152" text-anchor="end">FIN DE LÍNEA</text>
  </g>
</svg>
