<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="initramfs-title initramfs-desc">
  <title id="initramfs-title">initramfs: el sistema de archivos temporal en RAM que abre la raíz real (LPIC-1 101.2)</title>
  <desc id="initramfs-desc">Cuatro pasos resuelven la paradoja del disco cerrado: GRUB 2 carga en RAM el kernel y el archivo initramfs; initramfs es un cpio.gz comprimido que contiene solo los drivers mínimos para RAID, NVMe o LUKS; el kernel usa esos drivers, monta la raíz real y libera la memoria del initramfs; por último systemd recibe el mando como PID 1. Los drivers que hacen falta están en /lib/modules, dentro del mismo disco que el kernel todavía no sabe leer.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-svc { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .node-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 400; fill: #881337; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="initramfs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">INITRAMFS · LA LLAVE EN RAM</text>
    <text class="title" x="40" y="78">Abrir un disco con la llave de dentro</text>
    <text class="subtitle" x="40" y="102">Sin initramfs, el kernel no puede leer sus propios drivers.</text>
  </g>

  <g id="diagram-relations">
    <path id="initramfs-rel-1-2" class="edge" data-from="node-grub" data-to="node-ramfs" data-relation="loads"
          d="M 240 212 H 267" marker-end="url(#initramfs-arrow)"/>
    <path id="initramfs-rel-2-3" class="edge" data-from="node-ramfs" data-to="node-kernel" data-relation="provides-drivers"
          d="M 467 212 H 494" marker-end="url(#initramfs-arrow)"/>
    <path id="initramfs-rel-3-4" class="edge" data-from="node-kernel" data-to="node-systemd" data-relation="hands-over"
          d="M 694 212 H 721" marker-end="url(#initramfs-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-grub">
      <rect class="node-cmd" x="40" y="152" width="200" height="120" rx="10"/>
      <text class="node-name" x="140" y="190">GRUB 2</text>
      <text class="node-line" x="140" y="218">carga en RAM</text>
      <text class="node-line" x="140" y="242">kernel + initramfs</text>
    </g>

    <g id="node-ramfs">
      <rect class="node-iface" x="267" y="152" width="200" height="120" rx="10"/>
      <text class="node-name" x="367" y="190">initramfs</text>
      <text class="node-line" x="367" y="218">cpio.gz</text>
      <text class="node-line" x="367" y="242">drivers mínimos</text>
    </g>

    <g id="node-kernel">
      <rect class="node-kernel" x="494" y="152" width="200" height="120" rx="10"/>
      <text class="node-name" x="594" y="190">Kernel</text>
      <text class="node-line" x="594" y="218">monta la raíz /</text>
      <text class="node-line" x="594" y="242">libera la RAM</text>
    </g>

    <g id="node-systemd">
      <rect class="node-svc" x="721" y="152" width="200" height="120" rx="10"/>
      <text class="node-name" x="821" y="190">systemd</text>
      <text class="node-line" x="821" y="218">PID 1</text>
      <text class="node-line" x="821" y="242">recibe el mando</text>
    </g>

    <g id="node-warning">
      <rect class="node-warn" x="40" y="330" width="880" height="140" rx="10"/>
      <text class="warn-title" x="64" y="368">La paradoja que resuelve initramfs</text>
      <text class="warn-body" x="64" y="398">Para leer el disco (RAID, NVMe, cifrado LUKS) el kernel necesita drivers.</text>
      <text class="warn-body" x="64" y="426">Esos drivers viven en /lib/modules, dentro del disco que aún no sabe leer.</text>
      <text class="warn-body" x="64" y="454">GRUB le deja la llave en RAM antes de cederle el control.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="140" cy="136" r="14"/>
    <text class="badge-num" x="140" y="141">1</text>
    <circle class="badge" cx="367" cy="136" r="14"/>
    <text class="badge-num" x="367" y="141">2</text>
    <circle class="badge" cx="594" cy="136" r="14"/>
    <text class="badge-num" x="594" y="141">3</text>
    <circle class="badge" cx="821" cy="136" r="14"/>
    <text class="badge-num" x="821" y="141">4</text>
  </g>
</svg>
