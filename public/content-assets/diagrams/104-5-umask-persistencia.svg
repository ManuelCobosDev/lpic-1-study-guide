<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="upersist-title upersist-desc">
  <title id="upersist-title">Persistencia de la umask en /etc/login.defs, /etc/profile y ~/.bashrc (LPIC-1 104.5)</title>
  <desc id="upersist-desc">Tres niveles configuran la umask en orden de lectura. /etc/login.defs guarda la política global con la directiva UMASK 022 en mayúsculas y actúa al iniciar sesión y al crear usuarios con useradd. /etc/profile es el script global que lee bash en las shells de login con umask 022 para todos los usuarios. ~/.bashrc es el archivo privado de cada cuenta y permite añadir umask 027, que sobrescribe los valores globales solo para ese usuario. La banda inferior recuerda que el último valor leído al iniciar sesión es el que queda activo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #F8FAFC; stroke: #475569; stroke-width: 2; }
      .file-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #0F172A; }
      .directive { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1E36AF; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .spine { stroke: #1D40D8; stroke-width: 2; opacity: 0.35; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .rule-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .rule-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .rule-body { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PERSISTENCIA DE umask · TRES NIVELES</text>
    <text class="title" x="40" y="78">Tres archivos, una sola máscara efectiva</text>
    <text class="subtitle" x="40" y="102">Del archivo global al ~/.bashrc del usuario</text>
  </g>

  <g id="diagram-relations">
    <line class="spine" x1="48" y1="189" x2="48" y2="265"/>
    <line class="spine" x1="48" y1="295" x2="48" y2="371"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-login-defs">
      <rect class="card" x="76" y="130" width="544" height="88" rx="10"/>
      <text class="file-name" x="100" y="162">/etc/login.defs</text>
      <text class="directive" x="100" y="190">UMASK 022</text>
    </g>

    <g id="node-profile">
      <rect class="card" x="76" y="236" width="544" height="88" rx="10"/>
      <text class="file-name" x="100" y="268">/etc/profile</text>
      <text class="directive" x="100" y="296">umask 022</text>
    </g>

    <g id="node-bashrc">
      <rect class="card" x="76" y="342" width="544" height="88" rx="10"/>
      <text class="file-name" x="100" y="374">~/.bashrc</text>
      <text class="directive" x="100" y="402">umask 027</text>
    </g>

    <g id="node-regla">
      <rect class="rule-band" x="40" y="444" width="880" height="64" rx="10"/>
      <text class="rule-title" x="64" y="470">El último valor leído al iniciar sesión gana:</text>
      <text class="rule-body" x="64" y="496">~/.bashrc (umask 027) sobrescribe a /etc/profile y /etc/login.defs.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="48" cy="174" r="15"/>
    <text class="badge-num" x="48" y="179">1</text>
    <circle class="badge" cx="48" cy="280" r="15"/>
    <text class="badge-num" x="48" y="285">2</text>
    <circle class="badge" cx="48" cy="386" r="15"/>
    <text class="badge-num" x="48" y="391">3</text>

    <text class="note" x="644" y="162">política global del sistema</text>
    <text class="note" x="644" y="184">actúa al hacer login y al</text>
    <text class="note" x="644" y="206">crear usuarios con useradd</text>

    <text class="note" x="644" y="268">script global de login</text>
    <text class="note" x="644" y="290">lo lee bash para todos</text>
    <text class="note" x="644" y="312">los usuarios</text>

    <text class="note" x="644" y="374">archivo privado de tu /home</text>
    <text class="note" x="644" y="396">sobrescribe lo global</text>
    <text class="note" x="644" y="418">solo para ese usuario</text>
  </g>
</svg>
