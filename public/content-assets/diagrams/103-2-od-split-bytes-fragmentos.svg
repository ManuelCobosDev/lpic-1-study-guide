<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="od-title od-desc">
  <title id="od-title">Anatomía de una línea de od -c y fragmentación de un fichero con split (LPIC-1 103.2)</title>
  <desc id="od-desc">La salida de od -c se compone de un desplazamiento en octal, los bytes de la línea mostrados con su nombre de escape —A, retorno de carro y salto de línea— y el desplazamiento final. El byte de retorno de carro aparece resaltado porque es el que delata un fichero editado en Windows, el causante del error /bin/bash^M: bad interpreter. Debajo, split -b 50M -d iso part_ corta un único fichero en los fragmentos part_00, part_01 y part_02 de cincuenta megabytes, que se recomponen con cat part_* mayor que original.iso.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .tag-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .col-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; text-anchor: middle; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .cell { fill: #F1F5F9; }
      .cell-warn { fill: #FFF1F2; }
      .out { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .out-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #881337; text-anchor: middle; }
      .divider { stroke: #94A3B8; stroke-width: 1.5; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; }
      .card-a { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-b { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-title-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .card-title-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .chunk-band { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .chunk-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .chunk-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="od-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="42">BYTES Y FRAGMENTOS · od Y split</text>
    <text class="title" x="40" y="74">Ver lo invisible, partir lo enorme</text>
    <text class="subtitle" x="40" y="98">od -c revela bytes ocultos; split -b trocea ficheros.</text>
  </g>

  <g id="diagram-relations">
    <path id="od-rel-split" class="edge" data-from="node-origen" data-to="node-piezas" data-relation="fragmenta"
          d="M 220 436 H 272" marker-end="url(#od-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-volcado">
      <rect class="band" x="120" y="196" width="720" height="62" rx="8"/>
      <rect class="cell" x="120" y="196" width="180" height="62" rx="8"/>
      <rect class="cell" x="300" y="196" width="120" height="62"/>
      <rect class="cell-warn" x="420" y="196" width="120" height="62"/>
      <rect class="cell" x="540" y="196" width="120" height="62"/>
      <rect class="cell" x="660" y="196" width="180" height="62" rx="8"/>
      <rect x="120" y="196" width="720" height="62" rx="8" fill="none" stroke="#475569" stroke-width="2"/>
      <line class="divider" x1="300" y1="196" x2="300" y2="258"/>
      <line class="divider" x1="420" y1="196" x2="420" y2="258"/>
      <line class="divider" x1="540" y1="196" x2="540" y2="258"/>
      <line class="divider" x1="660" y1="196" x2="660" y2="258"/>
      <text class="out" x="210" y="236">0000000</text>
      <text class="out" x="360" y="236">A</text>
      <text class="out-warn" x="480" y="236">\r</text>
      <text class="out" x="600" y="236">\n</text>
      <text class="out" x="750" y="236">0000003</text>
    </g>

    <g id="node-caso">
      <rect class="card-a" x="40" y="278" width="430" height="96" rx="10"/>
      <text class="card-title-a" x="64" y="304">El caso típico de examen</text>
      <text class="card-mono" x="64" y="330">/bin/bash^M: bad interpreter</text>
      <text class="card-text" x="64" y="354">El ^M es un \r de Windows que od -c delata.</text>
    </g>

    <g id="node-variantes">
      <rect class="card-b" x="490" y="278" width="430" height="96" rx="10"/>
      <text class="card-title-b" x="514" y="304">Cambiar el volcado</text>
      <text class="card-mono" x="514" y="330">od -x</text>
      <text class="card-text" x="600" y="330">volcado hexadecimal</text>
      <text class="card-mono" x="514" y="354">od -An</text>
      <text class="card-text" x="600" y="354">sin columna de offset</text>
    </g>

    <g id="node-origen">
      <rect class="node-file" x="40" y="404" width="180" height="64" rx="10"/>
      <text class="chunk-mono" x="130" y="430">iso</text>
      <text class="chunk-sub" x="130" y="452">un solo fichero</text>
    </g>

    <g id="node-piezas">
      <rect class="chunk-band" x="272" y="404" width="648" height="64" rx="8"/>
      <line class="divider" x1="488" y1="404" x2="488" y2="468"/>
      <line class="divider" x1="704" y1="404" x2="704" y2="468"/>
      <text class="chunk-mono" x="380" y="430">part_00</text>
      <text class="chunk-sub" x="380" y="452">50M</text>
      <text class="chunk-mono" x="596" y="430">part_01</text>
      <text class="chunk-sub" x="596" y="452">50M</text>
      <text class="chunk-mono" x="812" y="430">part_02</text>
      <text class="chunk-sub" x="812" y="452">50M</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="tag" x="40" y="132">od -c</text>
    <text class="tag-note" x="110" y="132">cada byte con su nombre de escape</text>
    <text class="col-label" x="210" y="176">offset en octal</text>
    <text class="col-label" x="480" y="176">bytes: A, \r, \n</text>
    <text class="col-label" x="750" y="176">offset final</text>
    <line class="guide" x1="210" y1="184" x2="210" y2="196"/>
    <line class="guide" x1="480" y1="184" x2="480" y2="196"/>
    <line class="guide" x1="750" y1="184" x2="750" y2="196"/>
    <text class="tag" x="40" y="392">split -b 50M -d iso part_</text>
    <text class="tag-note" x="40" y="492">recomponer: cat part_* &gt; original.iso</text>
  </g>
</svg>
