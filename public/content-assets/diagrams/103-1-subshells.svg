<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p1031-subshell-title p1031-subshell-desc">
  <title id="p1031-subshell-title">Herencia de variables entre proceso padre y subshell hija (LPIC-1 103.1)</title>
  <desc id="p1031-subshell-desc">El proceso padre con PID 2400 define la variable local LOCAL="secreto" y exporta GLOBAL="servidor". Al invocar ./script.sh, el kernel hace fork y el proceso hijo con PID 2401 recibe una copia de GLOBAL pero no de LOCAL, porque nace ciego a las variables locales. El hijo puede cambiar GLOBAL="cambiado", pero solo en su propia memoria: la línea discontinua indica que los cambios no vuelven al padre, donde echo $GLOBAL sigue valiendo servidor. La banda inferior recuerda que source script.sh o . script.sh no crean subshell y sus variables sí persisten.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .box-parent { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .box-child { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .box-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .box-head-child { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.06em; }
      .var-local { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #BE123C; }
      .var-global { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .var-changed { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #B45309; }
      .var-run { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .hint { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; }
      .hint-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #BE123C; }
      .hint-blue { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #1E36AF; }
      .state { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-blocked { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
      .plate { fill: #FFFFFF; stroke: #1D40D8; stroke-width: 1.5; }
      .plate-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .plate-warn { fill: #FFFFFF; stroke: #E11D48; stroke-width: 1.5; }
      .plate-warn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #BE123C; text-anchor: middle; }
      .band { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #065F46; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #065F46; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #065F46; }
    </style>

    <marker id="p1031-subshell-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SUBSHELLS · HERENCIA DE VARIABLES</text>
    <text class="title" x="40" y="78">El hijo copia, nunca devuelve</text>
    <text class="subtitle" x="40" y="102">Un script ejecutado con ./script.sh corre en una subshell:</text>
    <text class="subtitle" x="40" y="122">sus cambios mueren con ella y el padre no los ve.</text>
  </g>

  <g id="diagram-nodes">
    <g id="parent-proc">
      <rect class="box-parent" x="40" y="140" width="360" height="220" rx="10"/>
      <text class="box-head" x="62" y="166">PROCESO PADRE · PID 2400</text>
      <line class="divider" x1="62" y1="176" x2="378" y2="176"/>
      <text class="var-local" x="62" y="202">LOCAL="secreto"</text>
      <text class="hint-warn" x="62" y="218">no se hereda</text>
      <text class="var-global" x="62" y="244">export GLOBAL="servidor"</text>
      <text class="hint-blue" x="62" y="260">sí se hereda</text>
      <line class="divider" x1="62" y1="272" x2="378" y2="272"/>
      <text class="var-run" x="62" y="298">./script.sh</text>
      <text class="hint" x="62" y="314">invoca al hijo</text>
      <text class="state" x="62" y="342">echo $GLOBAL → servidor</text>
    </g>

    <g id="child-proc">
      <rect class="box-child" x="560" y="140" width="360" height="220" rx="10"/>
      <text class="box-head-child" x="582" y="166">PROCESO HIJO · PID 2401</text>
      <line class="divider" x1="582" y1="176" x2="898" y2="176"/>
      <text class="var-global" x="582" y="202">GLOBAL="servidor"</text>
      <text class="hint-blue" x="582" y="218">copia de la exportada</text>
      <text class="var-local" x="582" y="244">LOCAL no existe</text>
      <text class="hint-warn" x="582" y="260">nace ciego a las locales</text>
      <line class="divider" x1="582" y1="272" x2="898" y2="272"/>
      <text class="var-changed" x="582" y="298">GLOBAL="cambiado"</text>
      <text class="hint" x="582" y="314">solo en su propia RAM</text>
      <text class="state" x="582" y="342">muere al terminar</text>
    </g>

    <g id="band-source">
      <rect class="band" x="40" y="380" width="880" height="110" rx="10"/>
      <text class="band-title" x="60" y="410">La excepción: source</text>
      <text class="band-mono" x="60" y="440">source script.sh     ·     . script.sh</text>
      <text class="band-text" x="60" y="466">No se crea subshell: se ejecuta en el padre y sus variables persisten.</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="rel-fork" class="edge" data-from="parent-proc" data-to="child-proc" data-relation="forks" d="M 400 210 H 560" marker-end="url(#p1031-subshell-arrow)"/>
    <path id="rel-blocked" class="edge-blocked" data-from="child-proc" data-to="parent-proc" data-relation="cannot-write-back" d="M 560 330 H 400"/>
  </g>

  <g id="diagram-labels">
    <rect class="plate" x="424" y="172" width="112" height="26" rx="6"/>
    <text class="plate-text" x="480" y="190">fork()</text>
    <text class="plate-warn-text" x="480" y="322">los cambios no vuelven</text>
  </g>
</svg>
