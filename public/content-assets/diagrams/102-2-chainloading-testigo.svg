<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gch-title gch-desc">
  <title id="gch-title">Chainloading: cómo GRUB cede el control al cargador de otro sistema (LPIC-1 102.2)</title>
  <desc id="gch-desc">GRUB 2 elige Windows en el menú pero no lee su kernel: ejecuta chainloader +1, que carga el primer sector de la partición de destino, y ese sector contiene el código de Bootmgr, el gestor de arranque de Windows, que toma el control y arranca el sistema. GRUB solo pasa el testigo; el sistema operativo invitado se arranca con su propio cargador.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .name-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #0F172A; }
      .name-mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .name-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .result-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #065F46; }
      .result-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #0F172A; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="gch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · CHAINLOADING</text>
    <text class="title" x="40" y="78">El relevo del testigo de arranque</text>
    <text class="subtitle" x="40" y="102">GRUB no arranca Windows: le pasa el control.</text>
  </g>

  <g id="diagram-relations">
    <path id="gch-rel-grub-chainloader" class="edge-blue" data-from="node-grub2" data-to="node-chainloader" data-relation="orders"
          d="M 320 230 H 360" marker-end="url(#gch-arrow)"/>
    <path id="gch-rel-chainloader-sector" class="edge-blue" data-from="node-chainloader" data-to="node-sector" data-relation="reads-first-sector"
          d="M 620 230 H 660" marker-end="url(#gch-arrow)"/>
    <path id="gch-rel-sector-bootmgr" class="edge-blue" data-from="node-sector" data-to="node-bootmgr" data-relation="runs"
          d="M 790 290 V 340" marker-end="url(#gch-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-grub2">
      <rect class="node-cmd" x="40" y="170" width="280" height="120" rx="10"/>
      <text class="name-mono" x="64" y="212">GRUB 2</text>
      <text class="role" x="64" y="238">Eliges Windows en el menú.</text>
      <text class="role" x="64" y="260">No lee su kernel.</text>
    </g>

    <g id="node-chainloader">
      <rect class="node-cmd" x="360" y="170" width="260" height="120" rx="10"/>
      <text class="name-mono-sm" x="384" y="212">chainloader +1</text>
      <text class="role" x="384" y="238">+1 = primer sector</text>
      <text class="role" x="384" y="260">de la partición</text>
    </g>

    <g id="node-sector">
      <rect class="node-file" x="660" y="170" width="260" height="120" rx="10"/>
      <text class="name-sans" x="684" y="212">sector de arranque</text>
      <text class="role" x="684" y="238">512 bytes con el código</text>
      <text class="role" x="684" y="260">del gestor invitado</text>
    </g>

    <g id="node-bootmgr">
      <rect class="node-ok" x="40" y="340" width="880" height="90" rx="10"/>
      <text class="result-mono" x="64" y="378">Bootmgr toma el control y arranca Windows</text>
      <text class="result-text" x="64" y="404">GRUB solo presta el testigo: el cargador de la otra partición hace el resto.</text>
    </g>
  </g>
</svg>
