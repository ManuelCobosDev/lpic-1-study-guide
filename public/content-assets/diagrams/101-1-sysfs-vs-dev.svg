<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sysdev-title sysdev-desc">
  <title id="sysdev-title">Diferencia entre /sys (sysfs) y /dev (devtmpfs) y anatomía de un nodo (LPIC-1 101.1)</title>
  <desc id="sysdev-desc">Comparación de dos vistas complementarias: /sys es sysfs, la topología que publica el kernel con buses, clases, drivers y atributos modificables, con rutas como /sys/block/sda, /sys/bus/pci/devices/0000:00:02.0 y /sys/class/net/eth0. /dev contiene los nodos de dispositivo que crea y borra udev, como /dev/sda, /dev/tty1 y /dev/urandom. Una banda inferior despieza la salida de ls -l /dev/sda: la letra b indica bloque frente a c de carácter, el major 8 identifica el driver SCSI/SATA y el minor 0 la unidad concreta.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-sys { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .panel-dev { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head-sys { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #B45309; }
      .panel-head-dev { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .panel-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .path { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #0F172A; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .band { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 600; fill: #0F172A; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">JERARQUÍA DE DISPOSITIVOS · SYSFS Y DEVTMPFS</text>
    <text class="title" x="40" y="78">/sys y /dev: el mapa y la puerta</text>
    <text class="subtitle" x="40" y="102">sysfs describe la topología; /dev da acceso de E/S.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-sys">
      <rect class="panel-sys" x="40" y="124" width="425" height="240" rx="10"/>
      <text class="panel-head-sys" x="64" y="156">sysfs · /sys</text>
      <text class="panel-text" x="64" y="182">Topología del kernel: buses, puentes, clases y drivers.</text>
      <text class="panel-text" x="64" y="202">Atributos modificables de cada dispositivo.</text>
      <line class="divider" x1="64" y1="216" x2="441" y2="216"/>
      <text class="path" x="64" y="242">/sys/block/sda/</text>
      <text class="path" x="64" y="266">/sys/bus/pci/devices/0000:00:02.0/</text>
      <text class="path" x="64" y="290">/sys/class/net/eth0/</text>
      <line class="divider" x1="64" y1="304" x2="441" y2="304"/>
      <text class="panel-text" x="64" y="330">Escribir en un atributo cambia el hardware.</text>
      <text class="panel-text" x="64" y="350">Es un sistema de archivos virtual: no ocupa disco.</text>
    </g>

    <g id="node-dev">
      <rect class="panel-dev" x="495" y="124" width="425" height="240" rx="10"/>
      <text class="panel-head-dev" x="519" y="156">devtmpfs · /dev</text>
      <text class="panel-text" x="519" y="182">Nodos de dispositivo: la puerta de E/S.</text>
      <text class="panel-text" x="519" y="202">udev los crea y los borra al conectar hardware.</text>
      <line class="divider" x1="519" y1="216" x2="896" y2="216"/>
      <text class="path" x="519" y="242">/dev/sda · bloque</text>
      <text class="path" x="519" y="266">/dev/tty1 · carácter</text>
      <text class="path" x="519" y="290">/dev/urandom · carácter</text>
      <line class="divider" x1="519" y1="304" x2="896" y2="304"/>
      <text class="panel-text" x="519" y="330">Los programas leen y escriben en el hardware.</text>
      <text class="panel-text" x="519" y="350">Cada nodo apunta a un driver del kernel.</text>
    </g>

    <g id="node-anatomia">
      <rect class="band" x="40" y="380" width="880" height="128" rx="10"/>
      <text class="band-title" x="64" y="410">Anatomía de un nodo: ls -l /dev/sda</text>
      <text class="band-mono" x="64" y="438">brw-rw---- 1 root disk 8, 0 24 oct 10:00 /dev/sda</text>
      <text class="band-text" x="64" y="464">Tipo: b = bloque (con búfer) · c = carácter (flujo secuencial).</text>
      <text class="band-text" x="64" y="486">Major 8 = driver SCSI/SATA · Minor 0 = disco sda (sda1 = 1).</text>
    </g>
  </g>
</svg>
