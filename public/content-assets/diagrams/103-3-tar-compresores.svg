<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="tar-comp-title tar-comp-desc">
  <title id="tar-comp-title">Banderas de compresión de tar: -z gzip, -j bzip2 y -J xz (LPIC-1 103.3)</title>
  <desc id="tar-comp-desc">Cada compresor de tar tiene su bandera y su extensión: -z usa gzip y produce archivos .tar.gz o .tgz, rápidos y universales; -j usa bzip2 y produce .tar.bz2 o .tbz2, con mayor tasa de compresión; y -J, en mayúscula, usa xz y produce .tar.xz, con la máxima compresión moderna. Fuera de tar, las utilidades autónomas hacen el mismo trabajo: gunzip equivale a gzip -d, bunzip2 a bzip2 -d y unxz a xz -d, y gzip borra el original al comprimir.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .bar-blue { fill: #2550EB; }
      .bar-amber { fill: #D97706; }
      .bar-emerald { fill: #059669; }
      .kicker { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; }
      .flag-blue { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 34px; font-weight: 700; fill: #1E36AF; }
      .flag-amber { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 34px; font-weight: 700; fill: #B45309; }
      .flag-emerald { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 34px; font-weight: 700; fill: #065F46; }
      .tool { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .ext { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #334155; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .badge-warn { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-warn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; text-anchor: middle; }
      .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 600; fill: #1E36AF; }
      .band-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">tar · COMPRESIÓN</text>
    <text class="title" x="40" y="78">Tres compresores, tres extensiones</text>
    <text class="subtitle" x="40" y="102">z, j y J: una letra cambia el algoritmo y el nombre.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-gzip">
      <rect class="card" x="40" y="150" width="250" height="200" rx="10"/>
      <rect class="bar-blue" x="40" y="150" width="250" height="6" rx="3"/>
      <text class="kicker" x="62" y="184">COMPRESOR</text>
      <text class="flag-blue" x="62" y="226">-z</text>
      <text class="tool" x="130" y="222">gzip</text>
      <text class="ext" x="62" y="266">.tar.gz · .tgz</text>
      <text class="sub" x="62" y="306">Rápido y estándar</text>
      <text class="sub" x="62" y="328">universal.</text>
    </g>

    <g id="node-bzip2">
      <rect class="card" x="355" y="150" width="250" height="200" rx="10"/>
      <rect class="bar-amber" x="355" y="150" width="250" height="6" rx="3"/>
      <text class="kicker" x="377" y="184">COMPRESOR</text>
      <text class="flag-amber" x="377" y="226">-j</text>
      <text class="tool" x="441" y="222">bzip2</text>
      <text class="ext" x="377" y="266">.tar.bz2 · .tbz2</text>
      <text class="sub" x="377" y="306">Mayor tasa de</text>
      <text class="sub" x="377" y="328">compresión.</text>
    </g>

    <g id="node-xz">
      <rect class="card" x="670" y="150" width="250" height="200" rx="10"/>
      <rect class="bar-emerald" x="670" y="150" width="250" height="6" rx="3"/>
      <text class="kicker" x="692" y="184">COMPRESOR</text>
      <text class="flag-emerald" x="692" y="226">-J</text>
      <text class="tool" x="756" y="222">xz</text>
      <rect class="badge-warn" x="800" y="196" width="102" height="24" rx="6"/>
      <text class="badge-warn-text" x="851" y="213">MAYÚSCULA</text>
      <text class="ext" x="692" y="266">.tar.xz</text>
      <text class="sub" x="692" y="306">Máxima compresión</text>
      <text class="sub" x="692" y="328">moderna.</text>
    </g>

    <g id="node-utilidades">
      <rect class="band" x="40" y="398" width="880" height="110" rx="10"/>
      <text class="band-mono" x="62" y="432">gunzip = gzip -d · bunzip2 = bzip2 -d · unxz = xz -d</text>
      <text class="band-body" x="62" y="460">Cada utilidad autónoma descomprime su formato; gzip borra el original al comprimir.</text>
      <text class="band-body" x="62" y="484">Dentro de tar, una sola operación por invocación: -c, -x o -t.</text>
    </g>
  </g>
</svg>
