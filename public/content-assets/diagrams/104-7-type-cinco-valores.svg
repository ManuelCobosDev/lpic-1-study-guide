<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="type-cinco-title type-cinco-desc">
  <title id="type-cinco-title">Los cinco valores de type -t: builtin, alias, function, keyword y file (LPIC-1 104.7)</title>
  <desc id="type-cinco-desc">type -t devuelve una sola palabra que clasifica la orden. builtin identifica un comando interno del shell como cd, export o history; alias un atajo como ls='ls --color=auto'; function una función de Bash en memoria; keyword una palabra reservada del shell; y file un ejecutable guardado en disco como /usr/bin/find. which solo busca archivos en las rutas de PATH, por eso no encuentra los builtins.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .query-band { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .query-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #1E36AF; }
      .query-result { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; }
      .query-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .card { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-note { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .card-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; }
      .card-key-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; }
      .card-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .card-example { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .card-desc-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">TYPE · CLASIFICACIÓN DE COMANDOS</text>
    <text class="title" x="40" y="78">type dice qué es cada comando</text>
    <text class="subtitle" x="40" y="102">type -t devuelve una sola palabra con la categoría.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-consulta">
      <rect class="query-band" x="40" y="136" width="880" height="56" rx="10"/>
      <text class="query-cmd" x="64" y="171">type -t cd</text>
      <text class="query-cmd" x="220" y="171">→</text>
      <text class="query-result" x="256" y="171">builtin</text>
      <text class="query-note" x="430" y="171">una palabra por comando: la categoría</text>
    </g>

    <g id="node-card-builtin">
      <rect class="card" x="40" y="208" width="424" height="92" rx="10"/>
      <text class="card-key" x="62" y="236">builtin</text>
      <text class="card-desc" x="62" y="262">orden interna del shell</text>
      <text class="card-example" x="62" y="284">cd, export, history</text>
    </g>

    <g id="node-card-alias">
      <rect class="card" x="496" y="208" width="424" height="92" rx="10"/>
      <text class="card-key" x="518" y="236">alias</text>
      <text class="card-desc" x="518" y="262">atajo de la línea de órdenes</text>
      <text class="card-example" x="518" y="284">ls='ls --color=auto'</text>
    </g>

    <g id="node-card-function">
      <rect class="card" x="40" y="312" width="424" height="92" rx="10"/>
      <text class="card-key" x="62" y="340">function</text>
      <text class="card-desc" x="62" y="366">función de Bash en memoria</text>
      <text class="card-desc" x="62" y="388">se define dentro de la shell</text>
    </g>

    <g id="node-card-file">
      <rect class="card" x="496" y="312" width="424" height="92" rx="10"/>
      <text class="card-key" x="518" y="340">file</text>
      <text class="card-desc" x="518" y="366">ejecutable guardado en disco</text>
      <text class="card-example" x="518" y="388">/usr/bin/find</text>
    </g>

    <g id="node-card-keyword">
      <rect class="card" x="40" y="416" width="424" height="92" rx="10"/>
      <text class="card-key" x="62" y="444">keyword</text>
      <text class="card-desc" x="62" y="470">palabra reservada del shell</text>
      <text class="card-desc" x="62" y="492">la reconoce el propio intérprete</text>
    </g>

    <g id="node-card-which">
      <rect class="card-note" x="496" y="416" width="424" height="92" rx="10"/>
      <text class="card-key-warn" x="518" y="444">which falla aquí</text>
      <text class="card-desc-warn" x="518" y="470">solo busca archivos en las rutas de $PATH;</text>
      <text class="card-desc-warn" x="518" y="492">no ve builtins como cd, export o history.</text>
    </g>
  </g>
</svg>
