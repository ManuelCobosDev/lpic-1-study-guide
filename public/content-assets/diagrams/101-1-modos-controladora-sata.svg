<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ctl-title ctl-desc">
  <title id="ctl-title">Modos de controladora de almacenamiento: IDE, AHCI y NVMe (LPIC-1 101.1)</title>
  <desc id="ctl-desc">Tres generaciones de acceso al disco comparadas de izquierda a derecha: IDE o PATA emula controladoras de 16 bits a 133 MB/s con nodos /dev/hda y /dev/hdb, AHCI es el estándar nativo de SATA 3 a 600 MB/s con NCQ y conexión en caliente sobre /dev/sda y /dev/sdb, y NVMe se conecta por cuatro líneas PCIe a más de 7.000 MB/s con 64.000 colas de 64.000 comandos sobre /dev/nvme0n1. Una banda inferior explica que el initramfs debe llevar los módulos SATA, NVMe, RAID y LVM para poder montar la raíz real.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-legacy { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-ahci { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-nvme { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .band-initramfs { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
      .tag-ahci { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.08em; }
      .tag-nvme { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #CBD5E1; letter-spacing: 0.08em; }
      .model { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .model-nvme { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #F8FAFC; }
      .speed { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 700; fill: #0F172A; }
      .speed-nvme { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 700; fill: #F8FAFC; }
      .detail { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .detail-nvme { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #E2E8F0; }
      .dev-node { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1E36AF; }
      .dev-node-nvme { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .band-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .label-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #1E36AF; text-anchor: middle; }
    </style>

    <marker id="ctl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">ALMACENAMIENTO · MODO DE LA CONTROLADORA</text>
    <text class="title" x="40" y="78">Tres modos, tres nomenclaturas y tres techos</text>
    <text class="subtitle" x="40" y="102">IDE emula PATA; AHCI y NVMe cambian bus y nodo.</text>
  </g>

  <g id="diagram-relations">
    <path id="ctl-rel-ide-ahci" class="edge-blue"
          data-from="node-ide" data-to="node-ahci" data-relation="evolves-to"
          d="M 310 200 H 345" marker-end="url(#ctl-arrow)"/>
    <path id="ctl-rel-ahci-nvme" class="edge-blue"
          data-from="node-ahci" data-to="node-nvme" data-relation="evolves-to"
          d="M 615 200 H 650" marker-end="url(#ctl-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-ide">
      <rect class="card-legacy" x="40" y="124" width="270" height="236" rx="10"/>
      <text class="tag" x="64" y="156">LEGACY</text>
      <text class="model" x="64" y="192">IDE / PATA</text>
      <text class="speed" x="64" y="228">133 MB/s</text>
      <line class="divider" x1="64" y1="242" x2="286" y2="242"/>
      <text class="detail" x="64" y="268">Emulación PATA de 16 bits.</text>
      <text class="detail" x="64" y="288">Sin NCQ ni hotplug.</text>
      <text class="detail" x="64" y="308">Muy obsoleto.</text>
      <text class="dev-node" x="64" y="348">/dev/hda · /dev/hdb</text>
    </g>

    <g id="node-ahci">
      <rect class="card-ahci" x="345" y="124" width="270" height="236" rx="10"/>
      <text class="tag-ahci" x="369" y="156">ESTÁNDAR</text>
      <text class="model" x="369" y="192">SATA 3 · AHCI</text>
      <text class="speed" x="369" y="228">600 MB/s</text>
      <line class="divider" x1="369" y1="242" x2="591" y2="242"/>
      <text class="detail" x="369" y="268">SATA 3 nativo con NCQ</text>
      <text class="detail" x="369" y="288">para reordenar lecturas</text>
      <text class="detail" x="369" y="308">y hotplug en caliente.</text>
      <text class="dev-node" x="369" y="348">/dev/sda · /dev/sdb</text>
    </g>

    <g id="node-nvme">
      <rect class="card-nvme" x="650" y="124" width="270" height="236" rx="10"/>
      <text class="tag-nvme" x="674" y="156">PCIE DIRECTO</text>
      <text class="model-nvme" x="674" y="192">NVMe</text>
      <text class="speed-nvme" x="674" y="228">7.000+ MB/s</text>
      <line class="divider" x1="674" y1="242" x2="896" y2="242"/>
      <text class="detail-nvme" x="674" y="268">4 líneas PCIe directas</text>
      <text class="detail-nvme" x="674" y="288">sin cuello de botella SATA</text>
      <text class="detail-nvme" x="674" y="308">64.000 colas, 64.000 comandos</text>
      <text class="dev-node-nvme" x="674" y="348">/dev/nvme0n1</text>
    </g>

    <g id="node-initramfs">
      <rect class="band-initramfs" x="40" y="378" width="880" height="96" rx="10"/>
      <text class="band-title" x="64" y="408">initramfs (Initial RAM File System)</text>
      <text class="band-text" x="64" y="436">Sistema de archivos temporal en RAM con los módulos que el kernel necesita</text>
      <text class="band-text" x="64" y="458">para reconocer el almacenamiento (SATA, NVMe, RAID, LVM) y montar la raíz /.</text>
    </g>
  </g>

  <g id="diagram-labels"/>
</svg>
