<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="modal-title modal-desc">
  <title id="modal-title">Modalidades de virtualización: completa, Guest Additions, VirtIO y contenedores (LPIC-1 102.6)</title>
  <desc id="modal-desc">Progresión de cuatro modalidades, de la emulación completa al contenedor. La virtualización completa hace que el hipervisor emule BIOS/UEFI, tarjeta gráfica y controladoras IDE sin modificar al invitado. Las Guest Additions añaden drivers del hipervisor mediante una ISO virtual para gráficos, ratón y carpetas compartidas. El invitado híbrido usa VirtIO (virtio-blk y virtio-net) para una entrada/salida casi nativa manteniendo la arquitectura completa. Los contenedores no virtualizan hardware: aíslan en espacio de usuario con namespaces y cgroups compartiendo el kernel del host. Abajo se comparan el coste de una máquina virtual (kernel propio, gigabytes, minutos) y el de un contenedor (kernel compartido, megabytes, milisegundos).</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .card-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .card-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .card-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #0F172A; }
      .box-vm { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .box-ctr { fill: #FFFFFF; stroke: #2550EB; stroke-width: 2; }
      .box-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .box-head-blue { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.04em; }
      .box-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .spectrum { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="modal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">MODALIDADES · VIRTUALIZACIÓN FRENTE A CONTENEDORES</text>
    <text class="title" x="40" y="78">De la emulación al kernel compartido</text>
    <text class="subtitle" x="40" y="102">Cuatro formas de aislar; la última comparte kernel.</text>
  </g>

  <g id="diagram-relations">
    <path id="modal-rel-1-2" class="edge-blue" data-from="node-modal-1" data-to="node-modal-2" data-relation="evolves-to"
          d="M 242 215 H 266" marker-end="url(#modal-arrow)"/>
    <path id="modal-rel-2-3" class="edge-blue" data-from="node-modal-2" data-to="node-modal-3" data-relation="evolves-to"
          d="M 468 215 H 492" marker-end="url(#modal-arrow)"/>
    <path id="modal-rel-3-4" class="edge-blue" data-from="node-modal-3" data-to="node-modal-4" data-relation="evolves-to"
          d="M 694 215 H 718" marker-end="url(#modal-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-modal-1">
      <rect class="card-iface" x="40" y="130" width="202" height="170" rx="10"/>
      <text class="card-title" x="62" y="160">Virtualización</text>
      <text class="card-title" x="62" y="180">completa</text>
      <text class="card-body" x="62" y="210">El hipervisor emula</text>
      <text class="card-body" x="62" y="230">BIOS/UEFI, GPU y</text>
      <text class="card-body" x="62" y="250">controladoras IDE.</text>
      <text class="card-body" x="62" y="270">Invitado sin cambios,</text>
      <text class="card-body" x="62" y="290">con sobrecarga.</text>
    </g>

    <g id="node-modal-2">
      <rect class="card-kernel" x="266" y="130" width="202" height="170" rx="10"/>
      <text class="card-title" x="288" y="170">Guest Additions</text>
      <text class="card-body" x="288" y="210">Drivers del hipervisor</text>
      <text class="card-body" x="288" y="230">en una ISO virtual:</text>
      <text class="card-body" x="288" y="250">gráficos, ratón y</text>
      <text class="card-body" x="288" y="270">carpetas compartidas.</text>
    </g>

    <g id="node-modal-3">
      <rect class="card-iface" x="492" y="130" width="202" height="170" rx="10"/>
      <text class="card-title" x="514" y="160">Invitado híbrido</text>
      <text class="card-title" x="514" y="180">VirtIO</text>
      <text class="card-mono" x="514" y="210">virtio-blk y</text>
      <text class="card-mono" x="514" y="230">virtio-net:</text>
      <text class="card-body" x="514" y="256">E/S casi nativa</text>
      <text class="card-body" x="514" y="276">sin tocar la VM.</text>
    </g>

    <g id="node-modal-4">
      <rect class="card-cmd" x="718" y="130" width="202" height="170" rx="10"/>
      <text class="card-title" x="740" y="170">Contenedores</text>
      <text class="card-mono" x="740" y="210">namespaces + cgroups</text>
      <text class="card-body" x="740" y="236">kernel del host,</text>
      <text class="card-body" x="740" y="256">arranque en</text>
      <text class="card-body" x="740" y="276">milisegundos.</text>
    </g>

    <g id="node-coste-vm">
      <rect class="box-vm" x="40" y="340" width="430" height="132" rx="10"/>
      <text class="box-head" x="62" y="366">MÁQUINA VIRTUAL · KVM/QEMU</text>
      <text class="box-line" x="62" y="394">Kernel propio e independiente</text>
      <text class="box-line" x="62" y="416">Ejecuta Windows o BSD sobre Linux</text>
      <text class="box-line" x="62" y="438">Aislamiento por hardware</text>
      <text class="box-line" x="62" y="460">Gigabytes y arranque de minutos</text>
    </g>

    <g id="node-coste-ctr">
      <rect class="box-ctr" x="490" y="340" width="430" height="132" rx="10"/>
      <text class="box-head-blue" x="512" y="366">CONTENEDOR · LXC / DOCKER / PODMAN</text>
      <text class="box-line" x="512" y="394">Kernel del host compartido: solo Linux</text>
      <text class="box-line" x="512" y="416">cgroups: límites de CPU y RAM</text>
      <text class="box-line" x="512" y="438">namespaces: red, procesos y rutas</text>
      <text class="box-line" x="512" y="460">Megabytes y arranque en milisegundos</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="spectrum" x="40" y="322">más emulación</text>
    <text class="spectrum" x="920" y="322" text-anchor="end">más ligero</text>
  </g>
</svg>
