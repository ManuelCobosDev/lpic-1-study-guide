<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="trampas-title trampas-desc">
  <title id="trampas-title">Cuatro trampas clásicas de examen en la gestión de archivos (LPIC-1 103.3)</title>
  <desc id="trampas-desc">Cuatro tarjetas comparan el error y la forma correcta. En tar, -f toma como nombre de archivo el texto que viene detrás, así que -cfz intenta abrir un fichero llamado z y lo correcto es -czf bkp.tar.gz. En find, la cláusula -exec se cierra con \; porque sin la contrabarra la shell se come el punto y coma. Para respaldar /etc o /home se usa cp -a, que conserva UID, GID y fechas, y no cp -r. Y los compresores son -z gzip, -j bzip2 y -J xz, con la J en mayúscula.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .tag-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #E11D48; letter-spacing: 0.06em; }
      .tag-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #059669; letter-spacing: 0.06em; }
      .cmd-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #881337; }
      .cmd-ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #065F46; }
      .why { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">GESTIÓN DE ARCHIVOS · TRAMPAS</text>
    <text class="title" x="40" y="78">Cuatro errores que el examen castiga</text>
    <text class="subtitle" x="40" y="102">MAL frente a BIEN, con el motivo técnico.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-trampa-tar">
      <rect class="card" x="40" y="126" width="440" height="174" rx="10"/>
      <text class="card-title" x="64" y="160">Posición de -f en tar</text>
      <text class="tag-warn" x="64" y="190">MAL</text>
      <text class="cmd-warn" x="110" y="190">tar -cfz bkp.tar.gz /etc</text>
      <text class="tag-ok" x="64" y="216">BIEN</text>
      <text class="cmd-ok" x="110" y="216">tar -czf bkp.tar.gz /etc</text>
      <text class="why" x="64" y="246">-f toma como nombre el texto que</text>
      <text class="why" x="64" y="268">viene detrás: aquí abriría un fichero «z».</text>
    </g>

    <g id="node-trampa-exec">
      <rect class="card" x="480" y="126" width="440" height="174" rx="10"/>
      <text class="card-title" x="504" y="160">La contrabarra de -exec</text>
      <text class="tag-warn" x="504" y="190">MAL</text>
      <text class="cmd-warn" x="550" y="190">find . -exec rm {} ;</text>
      <text class="tag-ok" x="504" y="216">BIEN</text>
      <text class="cmd-ok" x="550" y="216">find . -exec rm {} \;</text>
      <text class="why" x="504" y="246">Sin la contrabarra, la shell se come el</text>
      <text class="why" x="504" y="268">punto y coma y find devuelve error.</text>
    </g>

    <g id="node-trampa-cp">
      <rect class="card" x="40" y="316" width="440" height="174" rx="10"/>
      <text class="card-title" x="64" y="350">cp -r para copias de seguridad</text>
      <text class="tag-warn" x="64" y="380">MAL</text>
      <text class="cmd-warn" x="110" y="380">cp -r /etc /backup</text>
      <text class="tag-ok" x="64" y="406">BIEN</text>
      <text class="cmd-ok" x="110" y="406">cp -a /etc /backup</text>
      <text class="why" x="64" y="436">-r cambia el dueño al usuario que copia;</text>
      <text class="why" x="64" y="458">-a conserva UID, GID y fechas exactas.</text>
    </g>

    <g id="node-trampa-compresores">
      <rect class="card" x="480" y="316" width="440" height="174" rx="10"/>
      <text class="card-title" x="504" y="350">Compresores de tar cruzados</text>
      <text class="tag-warn" x="504" y="380">MAL</text>
      <text class="cmd-warn" x="550" y="380">-J = bzip2 y -j = xz</text>
      <text class="tag-ok" x="504" y="406">BIEN</text>
      <text class="cmd-ok" x="550" y="406">-z gzip · -j bzip2 · -J xz</text>
      <text class="why" x="504" y="436">Opciones casi idénticas en las</text>
      <text class="why" x="504" y="458">respuestas de opción múltiple.</text>
    </g>
  </g>
</svg>
