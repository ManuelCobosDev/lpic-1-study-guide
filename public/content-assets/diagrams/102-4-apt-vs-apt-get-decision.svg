<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="decision-title decision-desc">
  <title id="decision-title">Cuándo usar apt y cuándo apt-get o apt-cache: terminal interactiva frente a scripts (LPIC-1 102.4)</title>
  <desc id="decision-desc">El comando apt unifica las operaciones más frecuentes de apt-get y apt-cache, añade barra de progreso y mensajes claros, pero su formato de salida no es estable y avisa de que no tiene una interfaz CLI estable, por lo que nunca debe usarse en scripts. apt-get y apt-cache son el estándar para scripts, cron, CI/CD y Ansible: su salida es de texto plano y predecible desde 1998, apt-get modifica el sistema con sudo y apt-cache solo lee sin sudo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-question { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-branch { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .branch-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
      .card-apt { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .card-classic { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .mono-apt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 700; fill: #1E36AF; }
      .mono-classic { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .card-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #1E293B; }
      .card-lead { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .warn-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #881337; }
    </style>

    <marker id="decision-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">APT · COMANDO MODERNO FRENTE A CLÁSICO</text>
    <text class="title" x="40" y="78">¿Dónde vas a ejecutarlo?</text>
    <text class="subtitle" x="40" y="102">La respuesta decide entre apt y apt-get.</text>
  </g>

  <g id="diagram-relations">
    <path id="decision-rel-interactiva" class="edge-blue"
          data-from="node-pregunta" data-to="node-interactiva" data-relation="rama-interactiva"
          d="M 480 184 V 208 H 240 V 232" marker-end="url(#decision-arrow-blue)"/>

    <path id="decision-rel-scripts" class="edge-blue"
          data-from="node-pregunta" data-to="node-scripts" data-relation="rama-automatizada"
          d="M 480 184 V 208 H 720 V 232" marker-end="url(#decision-arrow-blue)"/>

    <path id="decision-rel-interactiva-apt" class="edge-blue"
          data-from="node-interactiva" data-to="node-card-apt" data-relation="recomienda-apt"
          d="M 240 292 V 330" marker-end="url(#decision-arrow-blue)"/>

    <path id="decision-rel-scripts-classic" class="edge-blue"
          data-from="node-scripts" data-to="node-card-classic" data-relation="exige-apt-get"
          d="M 720 292 V 330" marker-end="url(#decision-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-pregunta">
      <rect class="node-question" x="330" y="124" width="300" height="60" rx="10"/>
      <text class="branch-text" x="480" y="160">¿Terminal o script?</text>
    </g>

    <g id="node-interactiva">
      <rect class="node-branch" x="40" y="232" width="400" height="60" rx="10"/>
      <text class="branch-text" x="240" y="268">Terminal interactiva</text>
    </g>

    <g id="node-scripts">
      <rect class="node-branch" x="520" y="232" width="400" height="60" rx="10"/>
      <text class="branch-text" x="720" y="268">Scripts: bash, cron, CI/CD, Ansible</text>
    </g>

    <g id="node-card-apt">
      <rect class="card-apt" x="40" y="330" width="400" height="150" rx="10"/>
      <text class="mono-apt" x="64" y="370">apt</text>
      <text class="card-lead" x="64" y="398">Diseñado para el uso humano:</text>
      <text class="card-line" x="64" y="420">unifica apt-get y apt-cache.</text>
      <text class="card-line" x="64" y="442">Progreso coloreado y mensajes claros.</text>
      <text class="card-line" x="64" y="464">Salida NO estable: nunca en scripts.</text>
    </g>

    <g id="node-card-classic">
      <rect class="card-classic" x="520" y="330" width="400" height="150" rx="10"/>
      <text class="mono-classic" x="544" y="370">apt-get · apt-cache</text>
      <text class="card-lead" x="544" y="398">El estándar de los scripts:</text>
      <text class="card-line" x="544" y="420">texto plano y parseable desde 1998.</text>
      <text class="card-line" x="544" y="442">Obligatorio en bash, cron, CI/CD y Ansible.</text>
      <text class="card-line" x="544" y="464">apt-get modifica (sudo); apt-cache, no.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="warn-mono" x="40" y="508">WARNING: apt does not have a stable CLI interface.</text>
  </g>
</svg>
