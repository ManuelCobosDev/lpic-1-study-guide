<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dmesg-ring-title dmesg-ring-desc">
  <title id="dmesg-ring-title">El búfer circular del kernel que consulta dmesg (LPIC-1 101.2)</title>
  <desc id="dmesg-ring-desc">El kernel guarda sus mensajes en un búfer circular en RAM con ocho posiciones y tamaño fijo: cuando se llena, el mensaje nuevo sobrescribe al más antiguo, de modo que el registro nunca crece. Es la única forma de anotar la detección de hardware antes de que los discos estén montados; después systemd copia el búfer a los archivos de /var/log. Todo su contenido se pierde al apagar el equipo o al ejecutar dmesg --clear.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .slot { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .slot-old { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .slot-new { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .slot-num { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .slot-num-old { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #881337; text-anchor: middle; }
      .slot-num-new { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .core { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .annotation { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #E11D48; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 500; fill: #1E36AF; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">DMESG · BÚFER CIRCULAR DEL KERNEL</text>
    <text class="title" x="40" y="78">Un anillo de mensajes en la RAM</text>
    <text class="subtitle" x="40" y="102">Lo nuevo pisa lo viejo: el búfer nunca crece.</text>
  </g>

  <g id="diagram-groups">
    <circle cx="250" cy="300" r="130" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
    <g id="node-card-1">
      <rect class="card" x="450" y="130" width="470" height="100" rx="10"/>
      <text class="card-title" x="474" y="162">1. Antes de montar los discos</text>
      <text class="card-text" x="474" y="190">El kernel anota todo en RAM:</text>
      <text class="card-text" x="474" y="214">los discos todavía no existen.</text>
    </g>

    <g id="node-card-2">
      <rect class="card" x="450" y="250" width="470" height="100" rx="10"/>
      <text class="card-title" x="474" y="282">2. Tamaño fijo: lo nuevo borra lo viejo</text>
      <text class="card-text" x="474" y="310">Al llenarse, los mensajes nuevos</text>
      <text class="card-text" x="474" y="334">sobrescriben a los más antiguos.</text>
    </g>

    <g id="node-card-3">
      <rect class="card" x="450" y="370" width="470" height="100" rx="10"/>
      <text class="card-title" x="474" y="402">3. Traspaso a los archivos de disco</text>
      <text class="card-text" x="474" y="430">Cuando systemd arranca, copia el búfer</text>
      <text class="card-text" x="474" y="454">a los archivos de /var/log/.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="annotation" x="250" y="138">aquí se sobrescribe</text>
    <text class="core" x="250" y="296">búfer circular</text>
    <text class="core" x="250" y="318">tamaño fijo en RAM</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-slot-1">
      <rect class="slot-old" x="212" y="150" width="76" height="40" rx="8"/>
      <text class="slot-num-old" x="250" y="176">1</text>
    </g>
    <g id="node-slot-2">
      <rect class="slot-new" x="304" y="188" width="76" height="40" rx="8"/>
      <text class="slot-num-new" x="342" y="214">2</text>
    </g>
    <g id="node-slot-3">
      <rect class="slot" x="342" y="280" width="76" height="40" rx="8"/>
      <text class="slot-num" x="380" y="306">3</text>
    </g>
    <g id="node-slot-4">
      <rect class="slot" x="304" y="372" width="76" height="40" rx="8"/>
      <text class="slot-num" x="342" y="398">4</text>
    </g>
    <g id="node-slot-5">
      <rect class="slot" x="212" y="410" width="76" height="40" rx="8"/>
      <text class="slot-num" x="250" y="436">5</text>
    </g>
    <g id="node-slot-6">
      <rect class="slot" x="120" y="372" width="76" height="40" rx="8"/>
      <text class="slot-num" x="158" y="398">6</text>
    </g>
    <g id="node-slot-7">
      <rect class="slot" x="82" y="280" width="76" height="40" rx="8"/>
      <text class="slot-num" x="120" y="306">7</text>
    </g>
    <g id="node-slot-8">
      <rect class="slot" x="120" y="188" width="76" height="40" rx="8"/>
      <text class="slot-num" x="158" y="214">8</text>
    </g>

    <g id="node-note">
      <rect class="card" x="40" y="470" width="380" height="34" rx="8"/>
      <text class="card-text" x="64" y="493">Se pierde al apagar o con dmesg --clear.</text>
    </g>
  </g>
</svg>
