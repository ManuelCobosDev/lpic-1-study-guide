<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ssh-title ssh-desc">
  <title id="ssh-title">Par de claves OpenSSH y permisos de authorized_keys (LPIC-1 102.6)</title>
  <desc id="ssh-desc">Anatomía del acceso con claves. En el equipo local, ssh-keygen genera el par: id_rsa es la clave privada con permisos 0600 y no sale nunca del equipo; id_rsa.pub es la clave pública con permisos 0644 y es lo único que viaja. ssh-copy-id -i copia la pública al servidor remoto y la añade a ~/.ssh/authorized_keys, con el directorio en 0700 y el archivo en 0600. Si los permisos son más abiertos, SSH rechaza la conexión; con PasswordAuthentication no solo se entra por clave.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #FFFFFF; stroke: #2550EB; stroke-width: 2; }
      .panel-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .panel-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #1E36AF; letter-spacing: 0.04em; }
      .panel-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #475569; }
      .panel-cmd-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1E36AF; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .key-priv { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .key-pub { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .key-dir { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .key-auth { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .key-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .key-name-rose { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #881337; }
      .key-name-ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #065F46; }
      .key-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .key-sub-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #BE123C; }
      .key-sub-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #047857; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .foot { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #881337; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .plaque { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .plaque-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
    </style>

    <marker id="ssh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">OPENSSH · PAR DE CLAVES Y PERMISOS</text>
    <text class="title" x="40" y="78">La privada se queda; la pública viaja</text>
    <text class="subtitle" x="40" y="102">ssh-keygen genera el par; ssh-copy-id copia la .pub</text>
  </g>

  <g id="diagram-groups">
    <g id="panel-local">
      <rect class="panel-a" x="40" y="138" width="380" height="320" rx="12"/>
      <text class="panel-head" x="64" y="162">TU EQUIPO LOCAL</text>
      <text class="panel-cmd" x="396" y="162" text-anchor="end">ssh-keygen -t rsa -b 4096</text>
      <line class="divider" x1="64" y1="176" x2="396" y2="176"/>
      <text class="note" x="64" y="416">Si el proveedor crea el par,</text>
      <text class="note" x="64" y="436">descarga la clave privada.</text>
    </g>

    <g id="panel-remoto">
      <rect class="panel-b" x="540" y="138" width="380" height="320" rx="12"/>
      <text class="panel-head-b" x="564" y="162">SERVIDOR REMOTO</text>
      <text class="panel-cmd-b" x="896" y="162" text-anchor="end">authorized_keys</text>
      <line class="divider" x1="564" y1="176" x2="896" y2="176"/>
      <text class="note" x="564" y="416">Si los permisos son más abiertos,</text>
      <text class="note" x="564" y="436">SSH rechaza la conexión.</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="ssh-rel-copy" class="edge-blue" data-from="node-pub" data-to="node-authorized" data-relation="copies-public-key"
          d="M 396 343 H 480 V 338 H 564" marker-end="url(#ssh-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-privada">
      <rect class="key-priv" x="64" y="190" width="332" height="86" rx="9"/>
      <text class="key-name-rose" x="86" y="220">id_rsa · 0600</text>
      <text class="key-sub" x="86" y="242">clave privada</text>
      <text class="key-sub-rose" x="86" y="262">nunca sale del equipo</text>
    </g>

    <g id="node-pub">
      <rect class="key-pub" x="64" y="300" width="332" height="86" rx="9"/>
      <text class="key-name" x="86" y="330">id_rsa.pub · 0644</text>
      <text class="key-sub" x="86" y="352">clave pública</text>
      <text class="key-sub-ok" x="86" y="372">es lo único que viaja</text>
    </g>

    <g id="node-directorio">
      <rect class="key-dir" x="564" y="190" width="332" height="70" rx="9"/>
      <text class="key-name" x="586" y="220">~/.ssh · 0700</text>
      <text class="key-sub" x="586" y="242">directorio de claves del usuario</text>
    </g>

    <g id="node-authorized">
      <rect class="key-auth" x="564" y="290" width="332" height="96" rx="9"/>
      <text class="key-name-ok" x="586" y="320">authorized_keys · 0600</text>
      <text class="key-sub" x="586" y="342">clave pública añadida</text>
      <text class="key-sub-ok" x="586" y="364">ssh-copy-id fija los permisos</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="plaque" x="425" y="356" width="130" height="26" rx="6"/>
    <text class="plaque-text" x="490" y="374">ssh-copy-id -i</text>
    <text class="foot" x="40" y="500">PasswordAuthentication no: solo claves SSH.</text>
  </g>
</svg>
