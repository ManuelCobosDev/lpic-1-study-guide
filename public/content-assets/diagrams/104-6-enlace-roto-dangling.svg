<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dangling-title dangling-desc">
  <title id="dangling-title">Enlaces simbólicos rotos: antes y después de borrar el destino (LPIC-1 104.6)</title>
  <desc id="dangling-desc">Mientras doc.txt existe, el enlace simbólico suave.txt tiene su propio inodo 184525 y resuelve la ruta hasta el inodo 184520 para abrir los datos. Al borrar doc.txt con rm, el inodo del enlace sigue intacto pero la ruta que guarda ya no existe y el enlace queda huérfano o dangling: en un ls --color aparece en rojo intermitente y cat suave.txt devuelve No such file or directory. Se localizan con find . -xtype l, o con la variante find . -type l ! -exec test -e {} \; -print.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .zone { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; stroke-dasharray: 8 6; }
      .zone-rose { fill: #FFF7F8; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 8 6; }
      .zone-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
      .zone-label-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #BE123C; letter-spacing: 0.08em; }
      .node-sym { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-target { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-ghost { fill: #FFFFFF; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 5 5; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .mono-blue { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .mono-rose { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #BE123C; }
      .mono-cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .mono-alt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 500; fill: #475569; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .sub-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #881337; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; }
      .note-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #BE123C; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .sym-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #475569; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .edge-rose { fill: none; stroke: #E11D48; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>

    <marker id="dangling-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
    <marker id="dangling-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.6 · ENLACES SIMBÓLICOS ROTOS</text>
    <text class="title" x="40" y="78">El enlace sobrevive, el destino no</text>
    <text class="subtitle" x="40" y="102">suave.txt queda roto cuando desaparece doc.txt</text>
  </g>

  <g id="diagram-groups">
    <rect class="zone" x="40" y="122" width="430" height="196" rx="12"/>
    <rect class="zone-rose" x="490" y="122" width="430" height="196" rx="12"/>
  </g>

  <g id="diagram-relations">
    <path id="dangling-rel-antes" class="edge-blue"
          data-from="node-sym-antes" data-to="node-target-antes" data-relation="resolves-to-target"
          d="M 230 214 H 260" marker-end="url(#dangling-arrow-blue)"/>

    <path id="dangling-rel-despues" class="edge-rose"
          data-from="node-sym-despues" data-to="node-ghost" data-relation="unresolved-path"
          d="M 680 214 H 710" marker-end="url(#dangling-arrow-rose)"/>
  </g>

  <g id="diagram-labels">
    <text class="zone-label" x="60" y="148">ANTES · doc.txt existe</text>
    <text class="zone-label-rose" x="510" y="148">DESPUÉS · rm doc.txt</text>
    <text class="note" x="60" y="292">El enlace resuelve la ruta y abre los datos.</text>
    <text class="note-rose" x="510" y="292">La ruta guardada apunta a la nada: dangling.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-sym-antes">
      <rect class="node-sym" x="60" y="170" width="170" height="88" rx="9"/>
      <text class="mono-blue" x="80" y="198">suave.txt</text>
      <text class="sub" x="80" y="220">inodo 184525</text>
      <text class="sub" x="80" y="240">guarda la ruta</text>
    </g>

    <g id="node-target-antes">
      <rect class="node-target" x="260" y="170" width="190" height="88" rx="9"/>
      <text class="mono" x="280" y="198">doc.txt</text>
      <text class="sub" x="280" y="220">inodo 184520</text>
      <text class="sub" x="280" y="240">sus bloques de datos</text>
    </g>

    <g id="node-sym-despues">
      <rect class="node-sym" x="510" y="170" width="170" height="88" rx="9"/>
      <text class="mono-blue" x="530" y="198">suave.txt</text>
      <text class="sub" x="530" y="220">inodo intacto</text>
      <text class="sub" x="530" y="240">ruta ya inválida</text>
    </g>

    <g id="node-ghost">
      <rect class="node-ghost" x="710" y="170" width="190" height="88" rx="9"/>
      <text class="mono-rose" x="730" y="198">doc.txt</text>
      <text class="sub-rose" x="730" y="220">ya no existe</text>
      <text class="sub-rose" x="730" y="240">sin inodo ni datos</text>
    </g>

    <g id="node-sintomas">
      <rect class="card" x="40" y="342" width="430" height="156" rx="10"/>
      <text class="card-title" x="64" y="368">SÍNTOMAS EN LA TERMINAL</text>
      <text class="sym-line" x="64" y="396">ls --color: rojo intermitente</text>
      <text class="sym-line" x="64" y="420">cat suave.txt: No such file or directory</text>
      <text class="sub" x="64" y="448">El inodo del symlink no ha sufrido daños:</text>
      <text class="sub" x="64" y="468">lo que falta es el destino de la ruta.</text>
    </g>

    <g id="node-find">
      <rect class="card" x="490" y="342" width="430" height="156" rx="10"/>
      <text class="card-title" x="514" y="368">DETECCIÓN CON FIND</text>
      <text class="mono-cmd" x="514" y="398">find . -xtype l</text>
      <text class="sub" x="514" y="424">Localiza los symlinks cuyo destino no existe.</text>
      <text class="sub" x="514" y="450">Alternativa equivalente:</text>
      <text class="mono-alt" x="514" y="474">find . -type l ! -exec test -e {} \; -print</text>
    </g>
  </g>
</svg>
