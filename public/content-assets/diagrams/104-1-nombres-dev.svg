<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dev-nombres-title dev-nombres-desc">
  <title id="dev-nombres-title">Nomenclatura de dispositivos de bloque en /dev (LPIC-1 104.1)</title>
  <desc id="dev-nombres-desc">Tres tarjetas resumen la convención de nombres del árbol /dev. Los discos SATA, SCSI, SAS y USB usan /dev/sd*: una letra por disco y el número de partición pegado a la letra, con /dev/sda como primer disco, /dev/sda1 y /dev/sda2 como sus particiones y /dev/sdb como segundo disco. Los discos NVMe usan /dev/nvme* con controlador y namespace: /dev/nvme0n1 es el disco 1 (Ctrl 0, NS 1), /dev/nvme0n1p1 y /dev/nvme0n1p2 son sus particiones con p obligatoria, y /dev/nvme1n1 es el disco 2. Las tarjetas SD y memorias eMMC usan /dev/mmcblk*: /dev/mmcblk0 es el dispositivo completo, /dev/mmcblk0p1 y /dev/mmcblk0p2 sus particiones con p, y /dev/mmcblk1 la segunda tarjeta.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .family { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #B45309; letter-spacing: 0.04em; }
      .pattern { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .explain { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .rule { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #B45309; }
      .path { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1E36AF; }
      .meaning { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #475569; }
      .divider { stroke: #FDE68A; stroke-width: 1.5; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.1 · NOMBRES DE DISPOSITIVO EN /dev</text>
    <text class="title" x="40" y="78">Tres familias de nombres en /dev</text>
    <text class="subtitle" x="40" y="102">/dev/sd* para SATA/SCSI/SAS/USB; /dev/nvme* para NVMe</text>
    <text class="subtitle" x="40" y="122">y /dev/mmcblk* para tarjetas SD y eMMC.</text>
  </g>

  <g id="diagram-groups"></g>

  <g id="diagram-relations"></g>

  <g id="diagram-nodes">
    <g id="node-family-sd">
      <rect class="card" x="40" y="146" width="280" height="350" rx="12"/>
      <text class="family" x="60" y="178">SATA / SCSI / SAS / USB</text>
      <text class="pattern" x="60" y="206">/dev/sd*</text>
      <text class="explain" x="60" y="231">Discos tradicionales y</text>
      <text class="explain" x="60" y="251">unidades flash externas.</text>
      <text class="rule" x="60" y="291">Sin 'p': número pegado a la letra</text>
      <line class="divider" x1="60" y1="310" x2="300" y2="310"/>
      <text class="path" x="60" y="334">/dev/sda</text>
      <text class="meaning" x="60" y="354">1.er disco físico</text>
      <text class="path" x="60" y="376">/dev/sda1</text>
      <text class="meaning" x="60" y="396">Partición 1 de sda</text>
      <text class="path" x="60" y="418">/dev/sda2</text>
      <text class="meaning" x="60" y="438">Partición 2 de sda</text>
      <text class="path" x="60" y="460">/dev/sdb</text>
      <text class="meaning" x="60" y="480">2.º disco físico</text>
    </g>

    <g id="node-family-nvme">
      <rect class="card" x="340" y="146" width="280" height="350" rx="12"/>
      <text class="family" x="360" y="178">NVMe PCIe SSD</text>
      <text class="pattern" x="360" y="206">/dev/nvme*n*p*</text>
      <text class="explain" x="360" y="231">SSD M.2 de ultra alta velocidad.</text>
      <text class="explain" x="360" y="251">Controlador (Ctrl), namespace (n)</text>
      <text class="explain" x="360" y="271">y partición (p).</text>
      <text class="rule" x="360" y="291">La 'p' es obligatoria para partición</text>
      <line class="divider" x1="360" y1="310" x2="600" y2="310"/>
      <text class="path" x="360" y="334">/dev/nvme0n1</text>
      <text class="meaning" x="360" y="354">Disco 1 (Ctrl 0, NS 1)</text>
      <text class="path" x="360" y="376">/dev/nvme0n1p1</text>
      <text class="meaning" x="360" y="396">Partición 1 (con 'p')</text>
      <text class="path" x="360" y="418">/dev/nvme0n1p2</text>
      <text class="meaning" x="360" y="438">Partición 2 (con 'p')</text>
      <text class="path" x="360" y="460">/dev/nvme1n1</text>
      <text class="meaning" x="360" y="480">Disco 2 (Ctrl 1, NS 1)</text>
    </g>

    <g id="node-family-mmcblk">
      <rect class="card" x="640" y="146" width="280" height="350" rx="12"/>
      <text class="family" x="660" y="178">SD / eMMC Flash</text>
      <text class="pattern" x="660" y="206">/dev/mmcblk*p*</text>
      <text class="explain" x="660" y="231">Tarjetas SD y memorias eMMC</text>
      <text class="explain" x="660" y="251">soldadas en placa (Raspberry Pi,</text>
      <text class="explain" x="660" y="271">embebidos).</text>
      <text class="rule" x="660" y="291">La 'p' es obligatoria para partición</text>
      <line class="divider" x1="660" y1="310" x2="900" y2="310"/>
      <text class="path" x="660" y="334">/dev/mmcblk0</text>
      <text class="meaning" x="660" y="354">Dispositivo completo</text>
      <text class="path" x="660" y="376">/dev/mmcblk0p1</text>
      <text class="meaning" x="660" y="396">Partición 1 (con 'p')</text>
      <text class="path" x="660" y="418">/dev/mmcblk0p2</text>
      <text class="meaning" x="660" y="438">Partición 2 (con 'p')</text>
      <text class="path" x="660" y="460">/dev/mmcblk1</text>
      <text class="meaning" x="660" y="480">Segunda tarjeta SD</text>
    </g>
  </g>

  <g id="diagram-labels"></g>
</svg>
