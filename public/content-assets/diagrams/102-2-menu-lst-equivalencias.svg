<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gmle-title gmle-desc">
  <title id="gmle-title">Equivalencias de sintaxis entre /boot/grub/menu.lst y /boot/grub/grub.cfg (LPIC-1 102.2)</title>
  <desc id="gmle-desc">Cuatro líneas del menú antiguo emparejadas con su traducción en GRUB 2: default 0 se escribe set default="0", title pasa a menuentry con llaves, kernel pasa a linux y root (hd0,0) pasa a set root=(hd0,1) porque GRUB 2 cuenta las particiones desde uno. La columna izquierda es el fichero que se edita a mano y la derecha el fichero que se genera con grub-mkconfig.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .col-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #334155; }
      .col-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #065F46; }
      .cell-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .cell-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .code { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .note-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #881337; }
    </style>

    <marker id="gmle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · MENÚ ANTIGUO FRENTE A MENÚ ACTUAL</text>
    <text class="title" x="40" y="78">La misma entrada en dos sintaxis</text>
    <text class="subtitle" x="40" y="102">GRUB Legacy se edita a mano; GRUB 2 se genera solo.</text>
    <text class="col-head" x="40" y="140">GRUB Legacy · menu.lst</text>
    <text class="col-head-b" x="540" y="140">GRUB 2 · grub.cfg</text>
  </g>

  <g id="diagram-relations">
    <path id="gmle-rel-default" class="edge-blue" data-from="node-legacy-default" data-to="node-grub2-default" data-relation="translates-to"
          d="M 420 191 H 540" marker-end="url(#gmle-arrow)"/>
    <path id="gmle-rel-title" class="edge-blue" data-from="node-legacy-title" data-to="node-grub2-title" data-relation="translates-to"
          d="M 420 271 H 540" marker-end="url(#gmle-arrow)"/>
    <path id="gmle-rel-kernel" class="edge-blue" data-from="node-legacy-kernel" data-to="node-grub2-kernel" data-relation="translates-to"
          d="M 420 351 H 540" marker-end="url(#gmle-arrow)"/>
    <path id="gmle-rel-partition" class="edge-blue" data-from="node-legacy-partition" data-to="node-grub2-partition" data-relation="translates-to"
          d="M 420 431 H 540" marker-end="url(#gmle-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-legacy-default">
      <rect class="cell-file" x="40" y="156" width="380" height="70" rx="10"/>
      <text class="code" x="64" y="197">default 0</text>
    </g>
    <g id="node-grub2-default">
      <rect class="cell-kernel" x="540" y="156" width="380" height="70" rx="10"/>
      <text class="code" x="564" y="197">set default="0"</text>
    </g>

    <g id="node-legacy-title">
      <rect class="cell-file" x="40" y="236" width="380" height="70" rx="10"/>
      <text class="code" x="64" y="277">title Debian GNU/Linux</text>
    </g>
    <g id="node-grub2-title">
      <rect class="cell-kernel" x="540" y="236" width="380" height="70" rx="10"/>
      <text class="code" x="564" y="277">menuentry "Debian GNU/Linux" {</text>
    </g>

    <g id="node-legacy-kernel">
      <rect class="cell-file" x="40" y="316" width="380" height="70" rx="10"/>
      <text class="code" x="64" y="357">kernel /vmlinuz-2.6</text>
    </g>
    <g id="node-grub2-kernel">
      <rect class="cell-kernel" x="540" y="316" width="380" height="70" rx="10"/>
      <text class="code" x="564" y="357">linux /boot/vmlinuz-6.1</text>
    </g>

    <g id="node-legacy-partition">
      <rect class="cell-file" x="40" y="396" width="380" height="70" rx="10"/>
      <text class="code" x="64" y="437">root (hd0,0)</text>
    </g>
    <g id="node-grub2-partition">
      <rect class="cell-kernel" x="540" y="396" width="380" height="70" rx="10"/>
      <text class="code" x="564" y="437">set root=(hd0,1)</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note-rose" x="40" y="492"><tspan x="40" y="492">Tres cambios: title → menuentry, kernel → linux y (hd0,0) → (hd0,1).</tspan><tspan x="40" y="514">El fichero cambia y el índice de partición se desplaza; la lógica es la misma.</tspan></text>
  </g>
</svg>
