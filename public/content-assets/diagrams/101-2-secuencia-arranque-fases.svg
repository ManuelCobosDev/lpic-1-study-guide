<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="arranque-fases-title arranque-fases-desc">
  <title id="arranque-fases-title">Secuencia de arranque de Linux en cinco fases, de BIOS/UEFI a systemd (LPIC-1 101.2)</title>
  <desc id="arranque-fases-desc">El arranque encadena cinco fases numeradas: BIOS o UEFI ejecuta el POST y localiza el disco de arranque, GRUB 2 muestra el menú y copia el kernel a la memoria RAM, el kernel toma el control de la CPU, la memoria y el hardware, initramfs aporta en RAM los drivers necesarios para montar la raíz real y systemd arranca como PID 1, levanta los servicios y presenta la pantalla de login. Cada fase entrega el control a la siguiente y ninguna puede saltarse.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-hw { fill: #1E293B; stroke: #64748B; stroke-width: 2; }
      .node-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .node-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .node-svc { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .name-hw { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #F8FAFC; }
      .name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .role-hw { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #E2E8F0; }
      .role { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .spine { stroke: #1D40D8; stroke-width: 2; opacity: 0.35; }
      .badge { fill: #1D40D8; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SECUENCIA DE ARRANQUE · CINCO FASES</text>
    <text class="title" x="40" y="78">Del botón de encendido al login</text>
    <text class="subtitle" x="40" y="102">Cinco fases encadenadas: del firmware a systemd.</text>
  </g>

  <g id="diagram-relations">
    <line id="arranque-spine-1" class="spine" x1="44" y1="171" x2="44" y2="217"/>
    <line id="arranque-spine-2" class="spine" x1="44" y1="247" x2="44" y2="293"/>
    <line id="arranque-spine-3" class="spine" x1="44" y1="323" x2="44" y2="369"/>
    <line id="arranque-spine-4" class="spine" x1="44" y1="399" x2="44" y2="445"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-fase-bios">
      <rect class="node-hw" x="72" y="124" width="370" height="64" rx="10"/>
      <text class="name-hw" x="96" y="150">BIOS / UEFI</text>
      <text class="role-hw" x="96" y="174">El despertador</text>
    </g>

    <g id="node-fase-grub">
      <rect class="node-cmd" x="72" y="200" width="370" height="64" rx="10"/>
      <text class="name" x="96" y="226">GRUB 2</text>
      <text class="role" x="96" y="250">El menú</text>
    </g>

    <g id="node-fase-kernel">
      <rect class="node-kernel" x="72" y="276" width="370" height="64" rx="10"/>
      <text class="name" x="96" y="302">Kernel Linux</text>
      <text class="role" x="96" y="326">El cerebro</text>
    </g>

    <g id="node-fase-initramfs">
      <rect class="node-iface" x="72" y="352" width="370" height="64" rx="10"/>
      <text class="name" x="96" y="378">initramfs</text>
      <text class="role" x="96" y="402">La llave del disco</text>
    </g>

    <g id="node-fase-systemd">
      <rect class="node-svc" x="72" y="428" width="370" height="64" rx="10"/>
      <text class="name" x="96" y="454">systemd (PID 1)</text>
      <text class="role" x="96" y="478">El mayordomo</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="badge" cx="44" cy="156" r="15"/>
    <text class="badge-num" x="44" y="161">1</text>
    <text class="note" x="466" y="152">Ejecuta el POST y localiza el disco de arranque.</text>
    <text class="note" x="466" y="174">Arranca el firmware del equipo.</text>

    <circle class="badge" cx="44" cy="232" r="15"/>
    <text class="badge-num" x="44" y="237">2</text>
    <text class="note" x="466" y="228">Muestra el menú y copia el kernel a la RAM.</text>
    <text class="note" x="466" y="250">Quien carga el kernel es GRUB, no el firmware.</text>

    <circle class="badge" cx="44" cy="308" r="15"/>
    <text class="badge-num" x="44" y="313">3</text>
    <text class="note" x="466" y="304">Toma el control de la CPU, la memoria y el hardware.</text>
    <text class="note" x="466" y="326">Monta la raíz en solo lectura para revisarla.</text>

    <circle class="badge" cx="44" cy="384" r="15"/>
    <text class="badge-num" x="44" y="389">4</text>
    <text class="note" x="466" y="380">Mini-disco en RAM con los drivers que abren la raíz /.</text>
    <text class="note" x="466" y="402">Necesario si la raíz está en RAID, NVMe o LUKS.</text>

    <circle class="badge" cx="44" cy="460" r="15"/>
    <text class="badge-num" x="44" y="465">5</text>
    <text class="note" x="466" y="456">Primer proceso del sistema: arranca servicios y red.</text>
    <text class="note" x="466" y="478">Termina mostrando la pantalla de login.</text>
  </g>
</svg>
