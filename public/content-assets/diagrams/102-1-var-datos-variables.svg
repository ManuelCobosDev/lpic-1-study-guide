<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="var-title var-desc">
  <title id="var-title">Qué guarda /var y por qué se separa en su propia partición (LPIC-1 102.1)</title>
  <desc id="var-desc">El directorio /var reúne los datos que el sistema escribe en caliente y se ramifica en /var/log para los registros, /var/cache para la caché de paquetes, /var/lib/mysql para las tablas de las bases de datos, /var/spool/mail para el correo entrante y /var/tmp para los temporales que sobreviven al reinicio. Si /var comparte disco con la raíz, un proceso anormal que genere 50 GB de registros llena el disco y bloquea el sistema; en una partición aparte solo se llena /var y el servidor sigue en marcha.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-var { fill: #F1F5F9; stroke: #334155; stroke-width: 2.5; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono-root { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .root-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .card-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .warn-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #881337; }
      .warn-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
    </style>

    <marker id="var-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · DATOS VARIABLES</text>
    <text class="title" x="40" y="78">La carpeta que crece sin parar</text>
    <text class="subtitle" x="40" y="102">/var se separa; /tmp y /opt tienen su propia lógica</text>
  </g>

  <g id="diagram-relations">
    <path id="var-rel-log" class="edge" data-from="node-var" data-to="node-var-log" data-relation="contains"
          d="M 480 198 V 250 H 124 V 300" marker-end="url(#var-arrow-blue)"/>
    <path id="var-rel-cache" class="edge" data-from="node-var" data-to="node-var-cache" data-relation="contains"
          d="M 480 198 V 250 H 302 V 300" marker-end="url(#var-arrow-blue)"/>
    <path id="var-rel-mysql" class="edge" data-from="node-var" data-to="node-var-mysql" data-relation="contains"
          d="M 480 198 V 300" marker-end="url(#var-arrow-blue)"/>
    <path id="var-rel-spool" class="edge" data-from="node-var" data-to="node-var-spool" data-relation="contains"
          d="M 480 198 V 250 H 658 V 300" marker-end="url(#var-arrow-blue)"/>
    <path id="var-rel-tmp" class="edge" data-from="node-var" data-to="node-var-tmp" data-relation="contains"
          d="M 480 198 V 250 H 836 V 300" marker-end="url(#var-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-var">
      <rect class="node-var" x="380" y="140" width="200" height="58" rx="10"/>
      <text class="mono-root" x="480" y="168">/var</text>
      <text class="root-sub" x="480" y="188">datos que crecen</text>
    </g>

    <g id="node-var-log">
      <rect class="node-file" x="40" y="300" width="168" height="108" rx="10"/>
      <text class="mono-name" x="124" y="330">/var/log</text>
      <text class="card-sub" x="124" y="358">registros de eventos</text>
      <text class="card-sub" x="124" y="378">de todo el sistema</text>
    </g>

    <g id="node-var-cache">
      <rect class="node-file" x="218" y="300" width="168" height="108" rx="10"/>
      <text class="mono-name" x="302" y="330">/var/cache</text>
      <text class="card-sub" x="302" y="358">caché de paquetes</text>
      <text class="card-sub" x="302" y="378">y datos temporales</text>
    </g>

    <g id="node-var-mysql">
      <rect class="node-file" x="396" y="300" width="168" height="108" rx="10"/>
      <text class="mono-name" x="480" y="330">/var/lib/mysql</text>
      <text class="card-sub" x="480" y="358">tablas de las</text>
      <text class="card-sub" x="480" y="378">bases de datos</text>
    </g>

    <g id="node-var-spool">
      <rect class="node-file" x="574" y="300" width="168" height="108" rx="10"/>
      <text class="mono-name" x="658" y="330">/var/spool/mail</text>
      <text class="card-sub" x="658" y="358">correo entrante</text>
      <text class="card-sub" x="658" y="378">del sistema</text>
    </g>

    <g id="node-var-tmp">
      <rect class="node-file" x="752" y="300" width="168" height="108" rx="10"/>
      <text class="mono-name" x="836" y="330">/var/tmp</text>
      <text class="card-sub" x="836" y="358">temporales que</text>
      <text class="card-sub" x="836" y="378">sobreviven al reinicio</text>
    </g>

    <g id="node-warning">
      <rect class="node-warn" x="40" y="424" width="880" height="72" rx="10"/>
      <text class="warn-title" x="62" y="452">Regla de oro: separa /var en los servidores</text>
      <text class="warn-body" x="62" y="478">Un proceso anormal que genere 50 GB de logs llena /var; si comparte disco, la raíz / cae con él.</text>
    </g>
  </g>
</svg>
