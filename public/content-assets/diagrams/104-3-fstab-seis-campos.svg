<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="fstab-campos-title fstab-campos-desc">
  <title id="fstab-campos-title">Anatomía de los seis campos de /etc/fstab (LPIC-1 104.3)</title>
  <desc id="fstab-campos-desc">Una línea real de /etc/fstab se divide en seis campos: dispositivo LABEL=Backup, punto de montaje /mnt/backup, tipo btrfs, opciones defaults,noexec, dump 0 y pass 0. La banda inferior desglosa el campo pass: 1 para la raíz, que se comprueba primero; 2 para otras particiones, que se comprueban después; 0 cuando no se comprueba.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .field { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .field-focus { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .field-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .field-value { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .field-value-focus { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; text-anchor: middle; }
      .gloss { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .divider { stroke: #E2E8F0; stroke-width: 1.5; }
      .zone { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .zone-eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .pass-card { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .pass-badge { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .pass-badge-plain { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .pass-num { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .pass-num-plain { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .pass-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .pass-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
      .rule { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
    </style>

    <marker id="fstab-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">104.3 · /etc/fstab · ANATOMÍA DE UNA LÍNEA</text>
    <text class="title" x="40" y="78">Los seis campos de una línea de /etc/fstab</text>
    <text class="subtitle" x="40" y="102">Una línea real de /etc/fstab, campo a campo.</text>
  </g>

  <g id="diagram-groups">
    <rect class="zone" x="40" y="296" width="880" height="204" rx="10"/>
  </g>

  <g id="diagram-relations">
    <line id="fstab-divider" class="divider" x1="40" y1="282" x2="920" y2="282"/>
    <path id="fstab-rel-pass-order" class="edge"
          data-from="node-pass-1" data-to="node-pass-2" data-relation="then"
          d="M 312 402 H 352" marker-end="url(#fstab-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-field-1">
      <rect class="field" x="40" y="146" width="184" height="60" rx="8"/>
      <text class="field-value" x="132" y="182">LABEL=Backup</text>
    </g>

    <g id="node-field-2">
      <rect class="field" x="232" y="146" width="160" height="60" rx="8"/>
      <text class="field-value" x="312" y="182">/mnt/backup</text>
    </g>

    <g id="node-field-3">
      <rect class="field" x="400" y="146" width="116" height="60" rx="8"/>
      <text class="field-value" x="458" y="182">btrfs</text>
    </g>

    <g id="node-field-4">
      <rect class="field" x="524" y="146" width="204" height="60" rx="8"/>
      <text class="field-value" x="626" y="182">defaults,noexec</text>
    </g>

    <g id="node-field-5">
      <rect class="field" x="736" y="146" width="88" height="60" rx="8"/>
      <text class="field-value" x="780" y="182">0</text>
    </g>

    <g id="node-field-6">
      <rect class="field-focus" x="832" y="146" width="88" height="60" rx="8"/>
      <text class="field-value-focus" x="876" y="182">0</text>
    </g>

    <g id="node-pass-1">
      <rect class="pass-card" x="64" y="344" width="248" height="116" rx="10"/>
      <circle class="pass-badge" cx="100" cy="402" r="20"/>
      <text class="pass-num" x="100" y="409">1</text>
      <text class="pass-title" x="132" y="388">/ (raíz)</text>
      <text class="pass-sub" x="132" y="414">se comprueba primero</text>
    </g>

    <g id="node-pass-2">
      <rect class="pass-card" x="352" y="344" width="248" height="116" rx="10"/>
      <circle class="pass-badge" cx="388" cy="402" r="20"/>
      <text class="pass-num" x="388" y="409">2</text>
      <text class="pass-title" x="420" y="388">otras particiones</text>
      <text class="pass-sub" x="420" y="414">se comprueban después</text>
    </g>

    <g id="node-pass-0">
      <rect class="pass-card" x="640" y="344" width="248" height="116" rx="10"/>
      <circle class="pass-badge-plain" cx="676" cy="402" r="20"/>
      <text class="pass-num-plain" x="676" y="409">0</text>
      <text class="pass-title" x="708" y="388">sin comprobación</text>
      <text class="pass-sub" x="708" y="414">fsck no la revisa</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="field-label" x="52" y="134">1 · DISPOSITIVO</text>
    <text class="field-label" x="244" y="134">2 · MONTAJE</text>
    <text class="field-label" x="412" y="134">3 · TIPO</text>
    <text class="field-label" x="536" y="134">4 · OPCIONES</text>
    <text class="field-label" x="748" y="134">5 · DUMP</text>
    <text class="field-label" x="844" y="134">6 · PASS</text>

    <text class="gloss" x="52" y="236">UUID=… o LABEL=…</text>
    <text class="gloss" x="244" y="236">/, /home, none</text>
    <text class="gloss" x="412" y="236">ext4, xfs</text>
    <text class="gloss" x="412" y="258">swap</text>
    <text class="gloss" x="536" y="236">defaults, noatime, ro</text>
    <text class="gloss" x="748" y="236">0 (no)</text>
    <text class="gloss" x="748" y="258">1 (sí)</text>
    <text class="gloss" x="844" y="236">1 (raíz)</text>
    <text class="gloss" x="844" y="258">2 · 0</text>

    <text class="zone-eyebrow" x="64" y="328">EL CAMPO 6 (PASS) DECIDE EL ORDEN DE FSCK</text>
    <text class="rule" x="64" y="486">fsck comprueba la coherencia del sistema de archivos al arrancar.</text>
  </g>
</svg>
