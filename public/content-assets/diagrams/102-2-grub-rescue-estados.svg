<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gresc-title gresc-desc">
  <title id="gresc-title">Estados de grub rescue&gt; a la consola normal y al menú de GRUB (LPIC-1 102.2)</title>
  <desc id="gresc-desc">Máquina de estados de la recuperación. En el estado grub rescue&gt; solo existen cuatro comandos internos: ls, set, unset e insmod, y GRUB ni siquiera puede leer el formato del disco porque le falta el driver. Al ejecutar insmod normal y después normal se pasa al estado grub&gt;, que recupera los comandos completos linux, initrd, boot y normal; desde ahí GRUB lee grub.cfg y muestra el menú, con el que el sistema arranca solo.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #881337; }
      .state-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2.5; }
      .state-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .state-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .state-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .state-title-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #881337; }
      .state-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .gloss { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .plaque { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .plaque-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1E36AF; }
      .plaque-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="gresc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · MODO RESCATE DE GRUB 2</text>
    <text class="title" x="40" y="78">De grub rescue&gt; a la consola normal</text>
    <text class="subtitle-mono" x="40" y="102">error: unknown filesystem. grub rescue&gt;</text>
  </g>

  <g id="diagram-relations">
    <path id="gresc-rel-insmod" class="edge-blue" data-from="node-rescue" data-to="node-normal" data-relation="loads-normal-module"
          d="M 100 226 V 266" marker-end="url(#gresc-arrow)"/>
    <path id="gresc-rel-normal" class="edge-blue" data-from="node-normal" data-to="node-menu" data-relation="reads-grub-cfg"
          d="M 100 362 V 402" marker-end="url(#gresc-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-rescue">
      <rect class="state-warn" x="40" y="130" width="560" height="96" rx="10"/>
      <text class="state-title-warn" x="64" y="166">grub rescue&gt;</text>
      <text class="state-text" x="64" y="190">Solo existen 4 comandos internos:</text>
      <text class="state-text" x="64" y="210">ls, set, unset e insmod.</text>
    </g>

    <g id="node-normal">
      <rect class="state-cmd" x="40" y="266" width="560" height="96" rx="10"/>
      <text class="state-title" x="64" y="302">grub&gt;</text>
      <text class="state-text" x="64" y="326">Vuelven los comandos completos:</text>
      <text class="state-text" x="64" y="346">linux, initrd, boot y normal.</text>
    </g>

    <g id="node-menu">
      <rect class="state-ok" x="40" y="402" width="560" height="96" rx="10"/>
      <text class="state-title" x="64" y="438">menú de GRUB</text>
      <text class="state-text" x="64" y="462">El menú gráfico vuelve a</text>
      <text class="state-text" x="64" y="482">aparecer en pantalla.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <rect class="plaque" x="130" y="234" width="330" height="24" rx="6"/>
    <text class="plaque-mono" x="146" y="251">insmod normal   ·   normal</text>

    <rect class="plaque" x="130" y="370" width="330" height="24" rx="6"/>
    <text class="plaque-text" x="146" y="387">normal lee grub.cfg y abre el menú</text>

    <text class="gloss" x="620" y="168">GRUB no puede leer el formato</text>
    <text class="gloss" x="620" y="188">del disco: le falta el driver.</text>

    <text class="gloss" x="620" y="304">Si el menú no aparece, arranca</text>
    <text class="gloss" x="620" y="324">a mano: linux, initrd y boot.</text>

    <text class="gloss" x="620" y="440">El sistema arranca ya solo,</text>
    <text class="gloss" x="620" y="460">sin órdenes manuales.</text>
  </g>
</svg>
