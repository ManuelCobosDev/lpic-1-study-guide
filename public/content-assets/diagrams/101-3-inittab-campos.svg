<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="inittab-title inittab-desc">
  <title id="inittab-title">Anatomía de una línea de /etc/inittab: los cuatro campos separados por dos puntos (LPIC-1 101.3)</title>
  <desc id="inittab-desc">Cada línea de /etc/inittab tiene cuatro campos separados por dos puntos: id, runlevels, action y process. En la línea id:3:initdefault: el identificador es id, el nivel donde aplica es 3, la acción es initdefault y el campo process queda vacío porque no hay ningún comando que ejecutar: init solo lee el nivel de arranque. Las acciones de init son boot, bootwait, sysinit, wait, respawn y ctrlaltdel, y cada una decide si init espera al proceso, lo relanza cuando termina o lo ejecuta al recibir Ctrl+Alt+Supr.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #475569; }
      .band { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
      .field { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .field-empty { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; text-anchor: middle; }
      .label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .divider { stroke: #94A3B8; stroke-width: 1.5; }
      .guide { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      .note-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .note-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SYSVINIT · /etc/inittab</text>
    <text class="title" x="40" y="78">Cuatro campos entre dos puntos</text>
    <text class="subtitle" x="40" y="102">id : runlevels : action : process</text>
  </g>

  <g id="diagram-groups">
    <g id="node-inittab-line">
      <rect class="band" x="120" y="250" width="720" height="70" rx="8"/>
      <line class="divider" x1="220" y1="250" x2="220" y2="320"/>
      <line class="divider" x1="400" y1="250" x2="400" y2="320"/>
      <line class="divider" x1="680" y1="250" x2="680" y2="320"/>
      <text class="field" x="170" y="292">id:</text>
      <text class="field" x="310" y="292">3:</text>
      <text class="field" x="540" y="292">initdefault:</text>
      <text class="field-empty" x="760" y="292">(vacío)</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="label" x="120" y="196">Identificador único, 1–4 caracteres</text>
    <text class="label" x="470" y="196">Acción que init aplica al proceso</text>
    <text class="label" x="240" y="376">Niveles donde aplica (ej. 35)</text>
    <text class="label" x="690" y="376">Comando a ejecutar</text>

    <line class="guide" x1="170" y1="250" x2="170" y2="206"/>
    <line class="guide" x1="540" y1="250" x2="540" y2="206"/>
    <line class="guide" x1="310" y1="320" x2="310" y2="358"/>
    <line class="guide" x1="760" y1="320" x2="760" y2="358"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-initdefault-note">
      <rect class="band" x="40" y="412" width="880" height="88" rx="10"/>
      <text class="note-title" x="64" y="444">initdefault se lee al arrancar: init entra en el nivel 3.</text>
      <text class="note-body" x="64" y="470">El campo process queda vacío: init solo necesita conocer el nivel.</text>
    </g>
  </g>
</svg>
