<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cp-a-title cp-a-desc">
  <title id="cp-a-title">cp -r frente a cp -a en una copia de seguridad (LPIC-1 103.3)</title>
  <desc id="cp-a-desc">Comparativa de dos copias del mismo directorio: cp -r /etc /backup crea los ficheros con el dueño que ejecuta la copia, actualiza las fechas al instante actual y copia el contenido real de los enlaces simbólicos. cp -a /etc /backup clona el UID y el GID originales, preserva los sellos de modificación y copia los enlaces como enlaces. Para respaldar el sistema el examen espera cp -a, que equivale a -dpR, y nunca cp -r.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .panel-ok { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .panel-head-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; }
      .panel-head-ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #065F46; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
      .row-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #065F46; }
      .badge-warn { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5; }
      .badge-ok { fill: #D1FAE5; stroke: #059669; stroke-width: 1.5; }
      .badge-text-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #881337; letter-spacing: 0.06em; text-anchor: middle; }
      .badge-text-ok { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #065F46; letter-spacing: 0.06em; text-anchor: middle; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">cp · COPIA DE SEGURIDAD</text>
    <text class="title" x="40" y="78">cp -r copia; cp -a conserva</text>
    <text class="subtitle" x="40" y="102">Dueño, fechas y enlaces deciden la respuesta.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-cp-r">
      <rect class="panel-warn" x="40" y="124" width="420" height="300" rx="10"/>
      <text class="panel-head-warn" x="64" y="164">cp -r /etc /backup</text>
      <rect class="badge-warn" x="368" y="142" width="68" height="24" rx="6"/>
      <text class="badge-text-warn" x="402" y="159">EVITA</text>
      <line class="divider" x1="64" y1="182" x2="436" y2="182"/>

      <text class="row-label" x="64" y="206">PROPIETARIO</text>
      <text class="row-warn" x="64" y="230">pasa a ser el usuario</text>
      <text class="row-warn" x="64" y="250">que hizo la copia.</text>
      <line class="divider" x1="64" y1="266" x2="436" y2="266"/>

      <text class="row-label" x="64" y="292">FECHAS</text>
      <text class="row-warn" x="64" y="316">se actualizan al</text>
      <text class="row-warn" x="64" y="336">segundo actual.</text>
      <line class="divider" x1="64" y1="352" x2="436" y2="352"/>

      <text class="row-label" x="64" y="378">ENLACES SIMBÓLICOS</text>
      <text class="row-warn" x="64" y="402">copia el archivo real, no el enlace.</text>
    </g>

    <g id="node-cp-a">
      <rect class="panel-ok" x="500" y="124" width="420" height="300" rx="10"/>
      <text class="panel-head-ok" x="524" y="164">cp -a /etc /backup</text>
      <rect class="badge-ok" x="828" y="142" width="68" height="24" rx="6"/>
      <text class="badge-text-ok" x="862" y="159">USA</text>
      <line class="divider" x1="524" y1="182" x2="896" y2="182"/>

      <text class="row-label" x="524" y="206">PROPIETARIO</text>
      <text class="row-ok" x="524" y="230">clona el UID y el GID</text>
      <text class="row-ok" x="524" y="250">originales.</text>
      <line class="divider" x1="524" y1="266" x2="896" y2="266"/>

      <text class="row-label" x="524" y="292">FECHAS</text>
      <text class="row-ok" x="524" y="316">preserva los sellos</text>
      <text class="row-ok" x="524" y="336">de modificación.</text>
      <line class="divider" x1="524" y1="352" x2="896" y2="352"/>

      <text class="row-label" x="524" y="378">ENLACES SIMBÓLICOS</text>
      <text class="row-ok" x="524" y="402">copia el enlace sin gastar disco.</text>
    </g>

    <g id="node-veredicto">
      <rect class="verdict" x="40" y="440" width="880" height="68" rx="10"/>
      <text class="verdict-label" x="64" y="466">VEREDICTO</text>
      <text class="verdict-text" x="64" y="492">Respaldar /etc o /home exige cp -a (equivale a -dpR), nunca cp -r.</text>
    </g>
  </g>
</svg>
