<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vi-nav-title vi-nav-desc">
  <title id="vi-nav-title">Navegación en modo normal de vi: teclas h, j, k, l y alcance de los saltos (LPIC-1 103.8)</title>
  <desc id="vi-nav-desc">En modo normal las cuatro teclas de la fila central del teclado mueven el cursor sin escribir nada: h va a la izquierda, j baja, k sube y l va a la derecha. Los demás movimientos cambian de alcance: w, b y e saltan entre palabras, de modo que W y E ignoran la puntuación; 0 y el signo dólar van al primer y al último carácter de la línea; gg o 1G llevan a la primera línea del archivo y G a la última. Para abrir un archivo ya situado en una línea se usa vi +N archivo, y vi + sin número abre en la última línea.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .zone { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .zone-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .key { fill: #1E293B; stroke: #0F172A; stroke-width: 2; }
      .key-letter { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 24px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; }
      .key-word { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #E2E8F0; text-anchor: middle; }
      .band { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.08em; }
      .band-keys { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .band-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .band-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">VI · MODO NORMAL · MOVIMIENTO DEL CURSOR</text>
    <text class="title" x="40" y="78">Cuatro teclas mueven, ninguna escribe</text>
    <text class="subtitle" x="40" y="102">El alcance del salto depende de la tecla.</text>
  </g>

  <g id="diagram-groups">
    <rect class="zone" x="40" y="130" width="360" height="340" rx="12"/>
    <text class="zone-label" x="64" y="158">FILA CENTRAL DEL TECLADO</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-key-k">
      <rect class="key" x="168" y="190" width="104" height="88" rx="10"/>
      <text class="key-letter" x="220" y="226">k</text>
      <text class="key-word" x="220" y="256">arriba</text>
    </g>

    <g id="node-key-h">
      <rect class="key" x="56" y="286" width="104" height="88" rx="10"/>
      <text class="key-letter" x="108" y="322">h</text>
      <text class="key-word" x="108" y="352">izquierda</text>
    </g>

    <g id="node-key-j">
      <rect class="key" x="168" y="286" width="104" height="88" rx="10"/>
      <text class="key-letter" x="220" y="322">j</text>
      <text class="key-word" x="220" y="352">abajo</text>
    </g>

    <g id="node-key-l">
      <rect class="key" x="280" y="286" width="104" height="88" rx="10"/>
      <text class="key-letter" x="332" y="322">l</text>
      <text class="key-word" x="332" y="352">derecha</text>
    </g>

    <g id="node-band-palabra">
      <rect class="band" x="430" y="130" width="490" height="126" rx="10"/>
      <text class="band-title" x="454" y="158">PALABRA</text>
      <text class="band-keys" x="454" y="192">w  b  e</text>
      <text class="band-desc" x="454" y="218">siguiente, anterior y final de palabra</text>
      <text class="band-note" x="454" y="240">W y E ignoran la puntuación</text>
    </g>

    <g id="node-band-linea">
      <rect class="band" x="430" y="266" width="490" height="98" rx="10"/>
      <text class="band-title" x="454" y="294">LÍNEA</text>
      <text class="band-keys" x="454" y="326">0  $</text>
      <text class="band-desc" x="454" y="350">primer y último carácter de la línea</text>
    </g>

    <g id="node-band-archivo">
      <rect class="band" x="430" y="376" width="490" height="94" rx="10"/>
      <text class="band-title" x="454" y="402">ARCHIVO</text>
      <text class="band-keys" x="454" y="432">gg  ·  1G  ·  G</text>
      <text class="band-desc" x="454" y="456">primera línea y última línea</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note" x="64" y="424">Navegación por caracteres.</text>
    <text class="note" x="64" y="446">Mueve el cursor, no escribe.</text>
  </g>
</svg>

