<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dpm-title dpm-desc">
  <title id="dpm-title">Discos, particiones y puntos de montaje en el árbol único de Linux (LPIC-1 102.1)</title>
  <desc id="dpm-desc">Dos discos físicos se reparten en particiones y cada una se injerta en una carpeta del árbol único con raíz en barra. El SSD NVMe /dev/nvme0n1 aporta la partición 1 de 512 MB como ESP en /boot/efi, la partición 2 de 450 GB como raíz ext4 y la partición 3 de 8 GB como swap; quedan 41,5 GB sin asignar. El disco SATA /dev/sdb aporta sdb1 de 1,8 TB en /home y 200 GB libres. El nombre del dispositivo codifica el bus, la ranura, el número de disco y el número de partición. Las barras son esquemáticas y no están a escala: el objetivo es comparar el reparto, no medir proporciones.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-iface { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .zone { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .zone-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .mono-sm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .sub-end { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; text-anchor: end; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .decoder-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #334155; }
      .seg-esp { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.5; }
      .seg-root { fill: #EFF4FF; stroke: #2550EB; stroke-width: 1.5; }
      .seg-swap { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .seg-free { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .seg-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .seg-mount { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #1E36AF; text-anchor: middle; }
      .seg-mount-swap { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #881337; text-anchor: middle; }
      .seg-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .foot { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .foot-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.1 · DISCOS, PARTICIONES Y MONTAJE</text>
    <text class="title" x="40" y="78">Un solo árbol, dos discos</text>
    <text class="subtitle" x="40" y="102">Cada partición se injerta en una carpeta del árbol</text>
  </g>

  <g id="diagram-groups">
    <rect class="zone" id="zone-decoder" x="656" y="120" width="264" height="350" rx="12"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-disk-nvme">
      <rect class="node-file" x="40" y="120" width="600" height="170" rx="10"/>
      <text class="mono-name" x="62" y="148">/dev/nvme0n1</text>
      <text class="sub-end" x="618" y="148">SSD NVMe M.2 · 500 GB · sistema</text>
      <rect class="seg-esp" x="60" y="166" width="130" height="58" rx="6"/>
      <text class="seg-name" x="125" y="188">p1 · 512M</text>
      <text class="seg-mount" x="125" y="208">/boot/efi</text>
      <rect class="seg-root" x="190" y="166" width="210" height="58" rx="6"/>
      <text class="seg-name" x="295" y="188">p2 · 450G</text>
      <text class="seg-mount" x="295" y="208">/ · raíz ext4</text>
      <rect class="seg-swap" x="400" y="166" width="110" height="58" rx="6"/>
      <text class="seg-name" x="455" y="188">p3 · 8G</text>
      <text class="seg-mount-swap" x="455" y="208">[SWAP]</text>
      <rect class="seg-free" x="510" y="166" width="110" height="58" rx="6"/>
      <text class="seg-name" x="565" y="188">41,5G</text>
      <text class="seg-note" x="565" y="208">libre</text>
      <text class="note" x="62" y="246">p1 es la ESP en FAT32 que lee la UEFI · p2 es la raíz ext4 · p3 es swap para hibernar</text>
      <text class="note" x="62" y="265">El espacio sin asignar queda reservado para particiones futuras</text>
    </g>

    <g id="node-disk-sata">
      <rect class="node-file" x="40" y="300" width="600" height="170" rx="10"/>
      <text class="mono-name" x="62" y="328">/dev/sdb</text>
      <text class="sub-end" x="618" y="328">SATA · 2 TB · datos</text>
      <rect class="seg-root" x="60" y="346" width="420" height="58" rx="6"/>
      <text class="seg-name" x="270" y="368">sdb1 · 1,8T</text>
      <text class="seg-mount" x="270" y="388">/home</text>
      <rect class="seg-free" x="480" y="346" width="140" height="58" rx="6"/>
      <text class="seg-name" x="550" y="368">200G</text>
      <text class="seg-note" x="550" y="388">sin asignar</text>
      <text class="note" x="62" y="426">sdb1 en /home conserva tus datos si reinstalas el sistema del primer disco</text>
      <text class="note" x="62" y="445">Los 200 GB libres se reservan para particiones futuras o para LVM</text>
    </g>

    <g id="node-name-nvme">
      <rect class="node-iface" x="672" y="160" width="232" height="140" rx="8"/>
      <text class="mono-sm" x="694" y="188">/dev/nvme0n1p2</text>
      <text class="decoder-line" x="694" y="212">nvme = bus PCIe</text>
      <text class="decoder-line" x="694" y="231">0 = ranura de la placa</text>
      <text class="decoder-line" x="694" y="250">n1 = disco físico 1</text>
      <text class="decoder-line" x="694" y="269">p2 = partición 2</text>
    </g>

    <g id="node-name-sata">
      <rect class="node-iface" x="672" y="316" width="232" height="140" rx="8"/>
      <text class="mono-sm" x="694" y="344">/dev/sdb1</text>
      <text class="decoder-line" x="694" y="368">sd = disco SATA o USB</text>
      <text class="decoder-line" x="694" y="387">b = 2.º disco (a = 1.º, c = 3.º)</text>
      <text class="decoder-line" x="694" y="406">1 = partición 1</text>
      <text class="decoder-line" x="694" y="425">→ /dev/sdb1 montado en /home</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="zone-label" x="680" y="146">CÓMO SE LEE EL NOMBRE</text>
    <rect class="foot" x="40" y="482" width="880" height="34" rx="8"/>
    <text class="foot-text" x="64" y="504">Windows usa unidades C:, D:; Linux, un único árbol con raíz /</text>
    <text class="note" x="896" y="504" text-anchor="end">Barras esquemáticas, no a escala</text>
  </g>
</svg>
