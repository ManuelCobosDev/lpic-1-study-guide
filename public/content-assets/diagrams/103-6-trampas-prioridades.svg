<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="trap-title trap-desc">
  <title id="trap-title">Cuatro trampas de examen sobre prioridades y niceness, con el error y la realidad (LPIC-1 103.6)</title>
  <desc id="trap-desc">Cuatro tarjetas contraponen la creencia errónea y la realidad técnica. La escala no premia el número alto: -20 es la máxima prioridad y +19 la mínima. La sintaxis antigua no asigna negativos con un guion: nice -5 da +5, y para -5 hay que escribir nice --5 o nice -n -5, que exige root. nice comando no arranca en 0, sino que suma +10 por defecto y arranca en 10. Y un usuario normal no puede deshacer su renice: subir de 0 a 10 es posible, pero bajarlo da Permission denied.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .tag-mal { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #E11D48; letter-spacing: 0.06em; }
      .tag-bien { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #059669; letter-spacing: 0.06em; }
      .said { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #881337; }
      .real { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #065F46; }
      .why { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">PRIORIDADES Y NICENESS · TRAMPAS DE EXAMEN</text>
    <text class="title" x="40" y="78">Cuatro falsos amigos del examen</text>
    <text class="subtitle" x="40" y="102">Lo que parece y lo que hace el kernel.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-trampa-signo">
      <rect class="card" x="40" y="130" width="440" height="164" rx="10"/>
      <text class="card-title" x="64" y="162">El signo de la escala</text>
      <text class="tag-mal" x="64" y="190">MAL</text>
      <text class="said" x="112" y="190">+19 sería más prioridad que -20</text>
      <text class="tag-bien" x="64" y="218">BIEN</text>
      <text class="real" x="112" y="218">-20 es la máxima; +19, la mínima</text>
      <text class="why" x="64" y="246">Nice mide amabilidad: el proceso</text>
      <text class="why" x="64" y="268">que más cede CPU recibe menos.</text>
    </g>

    <g id="node-trampa-guiones">
      <rect class="card" x="480" y="130" width="440" height="164" rx="10"/>
      <text class="card-title" x="504" y="162">Los guiones de nice</text>
      <text class="tag-mal" x="504" y="190">MAL</text>
      <text class="said" x="552" y="190">nice -5 asigna prioridad negativa</text>
      <text class="tag-bien" x="504" y="218">BIEN</text>
      <text class="real" x="552" y="218">nice -5 da +5; para -5: nice --5</text>
      <text class="why" x="504" y="246">El guion es la bandera, no el signo:</text>
      <text class="why" x="504" y="268">y el valor negativo solo lo pone root.</text>
    </g>

    <g id="node-trampa-por-defecto">
      <rect class="card" x="40" y="310" width="440" height="164" rx="10"/>
      <text class="card-title" x="64" y="342">nice sin argumentos</text>
      <text class="tag-mal" x="64" y="370">MAL</text>
      <text class="said" x="112" y="370">nice updatedb arranca en nice 0</text>
      <text class="tag-bien" x="64" y="398">BIEN</text>
      <text class="real" x="112" y="398">arranca con nice 10 (suma +10)</text>
      <text class="why" x="64" y="426">Sin nice, el proceso arranca en 0;</text>
      <text class="why" x="64" y="448">nice a secas añade diez.</text>
    </g>

    <g id="node-trampa-renice">
      <rect class="card" x="480" y="310" width="440" height="164" rx="10"/>
      <text class="card-title" x="504" y="342">Deshacer un renice</text>
      <text class="tag-mal" x="504" y="370">MAL</text>
      <text class="said" x="552" y="370">el usuario recupera su nice 0</text>
      <text class="tag-bien" x="504" y="398">BIEN</text>
      <text class="real" x="552" y="398">solo root reduce el niceness</text>
      <text class="why" x="504" y="426">Un usuario sube de 0 a 10, pero</text>
      <text class="why" x="504" y="448">bajar da Permission denied.</text>
    </g>
  </g>
</svg>
