<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gnd-title gnd-desc">
  <title id="gnd-title">Nomenclatura de discos y particiones en Linux, GRUB Legacy y GRUB 2 (LPIC-1 102.2)</title>
  <desc id="gnd-desc">Tres filas paralelas con las dos primeras particiones del primer disco. El kernel de Linux las llama /dev/sda1 y /dev/sda2. GRUB Legacy las llama (hd0,0) y (hd0,1): el disco se cuenta desde cero y la partición también. GRUB 2 las llama (hd0,1) y (hd0,2): el disco sigue empezando en cero, pero la partición empieza en uno, igual que en Linux.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .col-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .lane-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .lane-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .lane-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .cell-cmd { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .cell-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .cell-kernel { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .lane-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .lane-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .value-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 21px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .value-split { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; text-anchor: middle; }
      .note-rose { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #881337; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">102.2 · NOMENCLATURA DE DISCOS</text>
    <text class="title" x="40" y="78">El mismo disco, tres sintaxis</text>
    <text class="subtitle" x="40" y="102">Mismo disco /dev/sda: solo cambia cómo se escribe.</text>
    <text class="col-head" x="425" y="150" text-anchor="middle">PARTICIÓN 1 DE /dev/sda</text>
    <text class="col-head" x="755" y="150" text-anchor="middle">PARTICIÓN 2 DE /dev/sda</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-lane-linux">
      <rect class="lane-cmd" x="40" y="186" width="210" height="44" rx="10"/>
      <text class="lane-name" x="60" y="206">Linux</text>
      <text class="lane-sub" x="60" y="222">dispositivos</text>
    </g>
    <g id="node-cell-linux-1">
      <rect class="cell-cmd" x="270" y="176" width="310" height="64" rx="10"/>
      <text class="value-mono" x="425" y="202">/dev/sda1</text>
      <text class="value-split" x="425" y="226">disco 1 · partición 1</text>
    </g>
    <g id="node-cell-linux-2">
      <rect class="cell-cmd" x="600" y="176" width="310" height="64" rx="10"/>
      <text class="value-mono" x="755" y="202">/dev/sda2</text>
      <text class="value-split" x="755" y="226">disco 1 · partición 2</text>
    </g>

    <g id="node-lane-legacy">
      <rect class="lane-file" x="40" y="286" width="210" height="44" rx="10"/>
      <text class="lane-name" x="60" y="306">GRUB Legacy</text>
      <text class="lane-sub" x="60" y="322">heredado</text>
    </g>
    <g id="node-cell-legacy-1">
      <rect class="cell-file" x="270" y="276" width="310" height="64" rx="10"/>
      <text class="value-mono" x="425" y="302">(hd0,0)</text>
      <text class="value-split" x="425" y="326">disco 0 · partición 0</text>
    </g>
    <g id="node-cell-legacy-2">
      <rect class="cell-file" x="600" y="276" width="310" height="64" rx="10"/>
      <text class="value-mono" x="755" y="302">(hd0,1)</text>
      <text class="value-split" x="755" y="326">disco 0 · partición 1</text>
    </g>

    <g id="node-lane-grub2">
      <rect class="lane-kernel" x="40" y="386" width="210" height="44" rx="10"/>
      <text class="lane-name" x="60" y="406">GRUB 2</text>
      <text class="lane-sub" x="60" y="422">actual</text>
    </g>
    <g id="node-cell-grub2-1">
      <rect class="cell-kernel" x="270" y="376" width="310" height="64" rx="10"/>
      <text class="value-mono" x="425" y="402">(hd0,1)</text>
      <text class="value-split" x="425" y="426">disco 0 · partición 1</text>
    </g>
    <g id="node-cell-grub2-2">
      <rect class="cell-kernel" x="600" y="376" width="310" height="64" rx="10"/>
      <text class="value-mono" x="755" y="402">(hd0,2)</text>
      <text class="value-split" x="755" y="426">disco 0 · partición 2</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="note-rose" x="40" y="482"><tspan x="40" y="482">En GRUB 2 el índice de la partición coincide con el de Linux:</tspan><tspan x="40" y="504">(hd0,1) es /dev/sda1. En GRUB Legacy empieza en 0: (hd0,0).</tspan></text>
  </g>
</svg>
