<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pr-title pr-desc">
  <title id="pr-title">Paginación con pr -l 60 -2 y conversión bidireccional entre tabuladores y espacios (LPIC-1 103.2)</title>
  <desc id="pr-desc">pr -l 60 -2 maqueta un fichero para impresión: la página lleva una cabecera con fecha, hora y número de página, y el texto se reparte en dos columnas sobre una página de sesenta líneas. Debajo, la conversión de espacios en blanco es bidireccional: expand -t 4 cambia cada tabulador por cuatro espacios, mientras que unexpand -a vuelve a condensar los espacios en tabuladores, incluidos los que no están al inicio de línea.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1E36AF; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .page { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .page-head { fill: #F1F5F9; }
      .page-head-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #475569; }
      .page-line { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; fill: #334155; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .card-b { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .card-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .card-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .node-tab { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-space { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .node-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .node-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #1E36AF; }
      .edge-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #1D40D8; text-anchor: middle; }
      .detail { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .detail-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .detail-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .edge { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="pr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">FORMATEAR · pr, expand Y unexpand</text>
    <text class="title" x="40" y="78">Páginas, tabuladores y espacios</text>
    <text class="subtitle" x="40" y="102">pr maqueta para papel; expand y unexpand traducen tabs.</text>
  </g>

  <g id="diagram-relations">
    <path id="pr-rel-espacios" class="edge" data-from="node-tab-1" data-to="node-espacios" data-relation="expand-t4"
          d="M 240 400 H 380" marker-end="url(#pr-arrow)"/>
    <path id="pr-rel-tab" class="edge" data-from="node-espacios" data-to="node-tab-2" data-relation="unexpand-a"
          d="M 580 400 H 720" marker-end="url(#pr-arrow)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-pagina">
      <rect class="page" x="40" y="148" width="600" height="168"/>
      <rect class="page-head" x="40" y="148" width="600" height="34"/>
      <rect x="40" y="148" width="600" height="168" fill="none" stroke="#475569" stroke-width="2"/>
      <line class="divider" x1="40" y1="182" x2="640" y2="182"/>
      <text class="page-head-text" x="64" y="170">fecha · hora · página 1</text>
      <text class="page-line" x="64" y="210">línea 01</text>
      <text class="page-line" x="64" y="236">línea 02</text>
      <text class="page-line" x="64" y="262">línea 03</text>
      <text class="page-line" x="64" y="288">línea 04</text>
      <text class="page-line" x="344" y="210">línea 05</text>
      <text class="page-line" x="344" y="236">línea 06</text>
      <text class="page-line" x="344" y="262">línea 07</text>
      <text class="page-line" x="344" y="288">línea 08</text>
    </g>

    <g id="node-opciones">
      <rect class="card-b" x="660" y="148" width="260" height="168" rx="10"/>
      <text class="card-title" x="684" y="182">Opciones de pr</text>
      <line class="divider" x1="684" y1="194" x2="896" y2="194"/>
      <text class="card-mono" x="684" y="226">-l 60</text>
      <text class="card-text" x="760" y="226">líneas por página</text>
      <text class="card-mono" x="684" y="256">-2 / -3</text>
      <text class="card-text" x="760" y="256">columnas</text>
      <text class="card-text" x="684" y="288">cabecera en cada plana</text>
    </g>

    <g id="node-tab-1">
      <rect class="node-tab" x="40" y="360" width="200" height="80" rx="10"/>
      <text class="node-title" x="64" y="392">tabulador</text>
      <text class="node-mono" x="64" y="418">\t · un carácter</text>
    </g>

    <g id="node-espacios">
      <rect class="node-space" x="380" y="360" width="200" height="80" rx="10"/>
      <text class="node-title" x="404" y="392">cuatro espacios</text>
      <text class="node-mono" x="404" y="418">· · · ·</text>
    </g>

    <g id="node-tab-2">
      <rect class="node-tab" x="720" y="360" width="200" height="80" rx="10"/>
      <text class="node-title" x="744" y="392">tabulador</text>
      <text class="node-mono" x="744" y="418">\t otra vez</text>
    </g>

    <g id="node-detalle">
      <rect class="detail" x="40" y="458" width="880" height="48" rx="8"/>
      <text class="detail-label" x="64" y="488">DETALLE</text>
      <text class="detail-text" x="150" y="488">unexpand -a condensa todos los espacios posibles, no solo los del inicio de línea.</text>
    </g>
  </g>

  <g id="diagram-labels">
    <text class="tag" x="40" y="136">pr -l 60 -2</text>
    <text class="note" x="40" y="338">cabecera con fecha, hora y número de página en cada plana</text>
    <text class="edge-label" x="310" y="388">expand -t 4</text>
    <text class="edge-label" x="650" y="388">unexpand -a</text>
  </g>
</svg>
