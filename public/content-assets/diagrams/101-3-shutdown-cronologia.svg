<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">Cronología de un shutdown -h +15 con aviso a los usuarios y cierre ordenado (LPIC-1 101.3)</title>
  <desc id="sd-desc">Cuando se programa un apagado con shutdown -h +15, el primer paso es difundir el aviso a todos los usuarios conectados mediante wall. Cinco minutos antes del cierre se crea el archivo /run/nologin para que nadie nuevo pueda iniciar sesión. En el instante final el sistema envía SIGTERM a los procesos para que guarden sus datos, después SIGKILL a los que no terminaron, sincroniza los discos con sync, desmonta los sistemas de archivos y llama a poweroff. La opción -c cancela la cuenta atrás mientras siga en marcha.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .time-node { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .time-node-end { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono-time { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1E36AF; text-anchor: middle; }
      .mono-time-end { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; text-anchor: middle; }
      .axis { stroke: #94A3B8; stroke-width: 2; }
      .stem { stroke: #94A3B8; stroke-width: 1.5; }
      .dot { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .band { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .band-line { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">SHUTDOWN · CRONOLOGÍA</text>
    <text class="title" x="40" y="78">Quince minutos hasta el apagado</text>
    <text class="subtitle" x="40" y="102">shutdown -h +15 avisa, bloquea y apaga</text>
  </g>

  <g id="diagram-relations">
    <line class="axis" x1="70" y1="250" x2="890" y2="250"/>
    <line class="stem" x1="180" y1="204" x2="180" y2="244"/>
    <line class="stem" x1="480" y1="204" x2="480" y2="244"/>
    <line class="stem" x1="780" y1="204" x2="780" y2="244"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-t15">
      <rect class="time-node" x="80" y="150" width="200" height="54" rx="10"/>
      <text class="mono-time" x="180" y="184">T-15 min</text>
    </g>
    <g id="node-t5">
      <rect class="time-node" x="380" y="150" width="200" height="54" rx="10"/>
      <text class="mono-time" x="480" y="184">T-5 min</text>
    </g>
    <g id="node-t0">
      <rect class="time-node-end" x="680" y="150" width="200" height="54" rx="10"/>
      <text class="mono-time-end" x="780" y="184">T-0</text>
    </g>

    <g id="node-flow">
      <rect class="band" x="40" y="350" width="880" height="80" rx="10"/>
      <text class="band-line" x="64" y="382">shutdown -c cancela; -h apaga, -r reinicia, -H detiene la CPU.</text>
      <text class="band-line" x="64" y="408">Sin -h ni -r, shutdown baja al nivel 1 (usuario único).</text>
    </g>
  </g>

  <g id="diagram-labels">
    <circle class="dot" cx="180" cy="250" r="6"/>
    <circle class="dot" cx="480" cy="250" r="6"/>
    <circle class="dot" cx="780" cy="250" r="6"/>

    <text class="desc" x="180" y="282">wall difunde el aviso a los</text>
    <text class="desc" x="180" y="306">usuarios conectados</text>
    <text class="desc" x="480" y="282">se crea /run/nologin: nadie</text>
    <text class="desc" x="480" y="306">nuevo puede entrar</text>
    <text class="desc" x="780" y="282">SIGTERM, luego SIGKILL,</text>
    <text class="desc" x="780" y="306">sync y apagado final</text>

    <text class="note" x="40" y="470">wall también admite un mensaje propio: echo "texto" | wall.</text>
    <text class="note" x="40" y="494">La opción -a consulta /etc/shutdown.allow antes de reiniciar.</text>
  </g>
</svg>
