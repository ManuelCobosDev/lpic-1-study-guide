<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mkdir-rmdir-title mkdir-rmdir-desc">
  <title id="mkdir-rmdir-title">mkdir -p crea los niveles que faltan y rmdir solo borra directorios vacíos (LPIC-1 103.3)</title>
  <desc id="mkdir-rmdir-desc">Con mkdir -p a/b/c se crean de una vez los tres niveles aunque a y b no existan; sin la opción -p, mkdir a/b/c falla con No such file or directory cuando falta un directorio padre. Para borrar, rmdir solo elimina carpetas vacías y se niega si hay ficheros dentro, mientras que rm -r recorre el árbol completo y rm -rf borra sin preguntar.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .zone { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .zone-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1E36AF; }
      .zone-note { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #065F46; }
      .node-file { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .node-warn { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2; }
      .mono-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .mono-name-warn { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #881337; }
      .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .sub-warn { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #881337; }
      .band { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .band-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .band-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; fill: #334155; }
      .band-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; font-weight: 600; fill: #881337; }
      .edge-blue { fill: none; stroke: #1D40D8; stroke-width: 2.5; }
    </style>

    <marker id="mkdir-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D40D8"/>
    </marker>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">mkdir · rmdir</text>
    <text class="title" x="40" y="78">Crear la ruta completa o negarse a borrar</text>
    <text class="subtitle" x="40" y="102">mkdir -p crea los padres que falten; rmdir exige vacío.</text>
  </g>

  <g id="diagram-groups">
    <g id="zone-mkdir">
      <rect class="zone" x="40" y="126" width="430" height="250" rx="12"/>
      <text class="zone-label" x="62" y="154">mkdir -p a/b/c</text>
    </g>
    <g id="zone-rmdir">
      <rect class="zone" x="490" y="126" width="430" height="250" rx="12"/>
      <text class="zone-label" x="512" y="154">rmdir frente a rm -r</text>
    </g>
  </g>

  <g id="diagram-relations">
    <path id="mkdir-rel-a-b" class="edge-blue"
          data-from="node-mkdir-a" data-to="node-mkdir-b" data-relation="creates"
          d="M 149 224 V 240" marker-end="url(#mkdir-arrow-blue)"/>
    <path id="mkdir-rel-b-c" class="edge-blue"
          data-from="node-mkdir-b" data-to="node-mkdir-c" data-relation="creates"
          d="M 189 288 V 304" marker-end="url(#mkdir-arrow-blue)"/>
  </g>

  <g id="diagram-nodes">
    <g id="node-mkdir-a">
      <rect class="node-file" x="64" y="176" width="170" height="48" rx="8"/>
      <text class="mono-name" x="86" y="206">a/</text>
      <text class="sub" x="140" y="206">se crea</text>
    </g>
    <g id="node-mkdir-b">
      <rect class="node-file" x="104" y="240" width="170" height="48" rx="8"/>
      <text class="mono-name" x="126" y="270">b/</text>
      <text class="sub" x="180" y="270">se crea</text>
    </g>
    <g id="node-mkdir-c">
      <rect class="node-file" x="144" y="304" width="170" height="48" rx="8"/>
      <text class="mono-name" x="166" y="334">c/</text>
      <text class="sub" x="220" y="334">se crea</text>
    </g>

    <g id="node-rmdir">
      <rect class="node-file" x="510" y="170" width="390" height="88" rx="8"/>
      <text class="mono-name" x="532" y="202">rmdir dir</text>
      <text class="sub" x="532" y="230">Solo borra carpetas vacías: si hay ficheros,</text>
      <text class="sub" x="532" y="250">se niega en redondo y no borra nada.</text>
    </g>

    <g id="node-rm-r">
      <rect class="node-warn" x="510" y="270" width="390" height="88" rx="8"/>
      <text class="mono-name-warn" x="532" y="302">rm -r dir</text>
      <text class="sub-warn" x="532" y="330">Recorre el árbol y borra el contenido;</text>
      <text class="sub-warn" x="532" y="350">rm -rf no pregunta ni avisa de errores.</text>
    </g>

    <g id="node-aviso">
      <rect class="band" x="40" y="392" width="880" height="116" rx="10"/>
      <text class="band-title" x="62" y="424">Sin -p el comando falla</text>
      <text class="band-body" x="62" y="452">mkdir a/b/c devuelve</text>
      <text class="band-mono" x="210" y="452">No such file or directory</text>
      <text class="band-body" x="430" y="452">si a no existe.</text>
      <text class="band-body" x="62" y="480">Para eliminar un árbol con contenido se usa rm -r o rm -rf;</text>
      <text class="band-body" x="62" y="502">rmdir -p solo borra la ruta completa cuando toda ella está vacía.</text>
    </g>
  </g>
</svg>
