<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="bre-ere-title bre-ere-desc">
  <title id="bre-ere-title">Comparativa de los motores BRE y ERE y el papel de la barra invertida (LPIC-1 103.7)</title>
  <desc id="bre-ere-desc">Dos paneles enfrentados muestran el mismo conjunto de operadores en los dos motores POSIX. BRE, el estándar histórico de grep y sed, trata +, ?, |, ( ) y { } como texto ordinario y exige anteponer una barra invertida para activarlos, como en grep 'a\+' o grep 'a\|b'. ERE, disponible con egrep y grep -E, los interpreta como metacaracteres de serie y no lleva barra invertida, como en egrep 'a+' o grep -E 'a|b'. El veredicto recuerda que la misma expresión cambia de significado según el motor.</desc>

  <defs>
    <style>
      .canvas { fill: #FFFFFF; }
      .frame { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.08em; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-a { fill: #F1F5F9; stroke: #475569; stroke-width: 2; }
      .panel-b { fill: #EFF4FF; stroke: #2550EB; stroke-width: 2; }
      .panel-head-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .panel-head-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 19px; font-weight: 700; fill: #1E36AF; }
      .panel-note-a { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
      .panel-note-b { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; fill: #334155; }
      .row-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 0.06em; }
      .row-value { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .row-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #0F172A; }
      .row-mono-b { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 16px; font-weight: 500; fill: #1E36AF; }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; }
      .verdict { fill: #FFFFFF; stroke: #475569; stroke-width: 2; }
      .verdict-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.06em; }
      .verdict-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; fill: #0F172A; }
    </style>
  </defs>

  <g id="diagram-background">
    <rect class="canvas" x="0" y="0" width="960" height="540"/>
    <rect class="frame" x="16" y="16" width="928" height="508" rx="14"/>
    <text class="eyebrow" x="40" y="44">MOTORES POSIX · BRE FRENTE A ERE</text>
    <text class="title" x="40" y="78">El mismo operador, dos motores</text>
    <text class="subtitle" x="40" y="102">Cambia un detalle: dónde actúa la barra invertida.</text>
  </g>

  <g id="diagram-nodes">
    <g id="node-panel-bre">
      <rect class="panel-a" x="40" y="132" width="420" height="300" rx="10"/>
      <text class="panel-head-a" x="64" y="164">BRE · Basic Regular Expressions</text>
      <text class="panel-note-a" x="64" y="186">El estándar histórico original de Unix</text>
      <line class="divider" x1="64" y1="200" x2="436" y2="200"/>
      <text class="row-label" x="64" y="224">HERRAMIENTA</text>
      <text class="row-mono" x="64" y="246">grep · sed</text>
      <line class="divider" x1="64" y1="260" x2="436" y2="260"/>
      <text class="row-label" x="64" y="284">OPERADORES + ? | ( ) { }</text>
      <text class="row-value" x="64" y="306">Texto ordinario, literal</text>
      <line class="divider" x1="64" y1="320" x2="436" y2="320"/>
      <text class="row-label" x="64" y="344">PARA ACTIVARLOS</text>
      <text class="row-value" x="64" y="366">Antepón la barra invertida</text>
      <line class="divider" x1="64" y1="380" x2="436" y2="380"/>
      <text class="row-label" x="64" y="398">EJEMPLO</text>
      <text class="row-mono" x="64" y="420">grep 'a\+'  ·  grep 'a\|b'</text>
    </g>

    <g id="node-panel-ere">
      <rect class="panel-b" x="500" y="132" width="420" height="300" rx="10"/>
      <text class="panel-head-b" x="524" y="164">ERE · Extended Regular Expressions</text>
      <text class="panel-note-b" x="524" y="186">El estándar moderno, ampliado y simplificado</text>
      <line class="divider" x1="524" y1="200" x2="896" y2="200"/>
      <text class="row-label" x="524" y="224">HERRAMIENTA</text>
      <text class="row-mono-b" x="524" y="246">egrep · grep -E</text>
      <line class="divider" x1="524" y1="260" x2="896" y2="260"/>
      <text class="row-label" x="524" y="284">OPERADORES + ? | ( ) { }</text>
      <text class="row-value" x="524" y="306">Metacaracteres de serie</text>
      <line class="divider" x1="524" y1="320" x2="896" y2="320"/>
      <text class="row-label" x="524" y="344">PARA ACTIVARLOS</text>
      <text class="row-value" x="524" y="366">Escríbelos tal cual, sin barra</text>
      <line class="divider" x1="524" y1="380" x2="896" y2="380"/>
      <text class="row-label" x="524" y="398">EJEMPLO</text>
      <text class="row-mono-b" x="524" y="420">egrep 'a+'  ·  grep -E 'a|b'</text>
    </g>

    <g id="node-veredicto">
      <rect class="verdict" x="40" y="444" width="880" height="56" rx="10"/>
      <text class="verdict-label" x="64" y="479">VEREDICTO</text>
      <text class="verdict-text" x="168" y="469">En BRE, \+ y \| activan el operador; en ERE ya son</text>
      <text class="verdict-text" x="168" y="491">nativos y la barra invertida los vuelve literales.</text>
    </g>
  </g>
</svg>
